<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JAVIA Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
:root{--primary:#1B3A5C;--primary-lt:#2E5A88;--primary-dk:#0F2440;--accent:#2E86AB;--accent-lt:#48A6CB;--accent-glow:rgba(46,134,171,.15);--success:#27AE60;--warning:#F39C12;--danger:#E74C3C;--bg:#F7F9FC;--bg-card:#FFF;--text:#2C3E50;--text-lt:#7F8C8D;--border:#E1E8EE;--border-lt:#F0F3F6;--shadow:0 2px 12px rgba(27,58,92,.08);--shadow-lg:0 8px 32px rgba(27,58,92,.12);--radius:10px;--radius-lg:16px;--tr:.25s cubic-bezier(.4,0,.2,1);--font:'Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;--font-d:'Poppins','Noto Sans KR',sans-serif}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh;-webkit-font-smoothing:antialiased}
.header{position:fixed;top:0;left:0;right:0;z-index:100;background:var(--primary-dk);border-bottom:1px solid rgba(255,255,255,.08)}.header-inner{max-width:1400px;margin:0 auto;padding:0 24px;height:60px;display:flex;align-items:center;justify-content:space-between}.logo{text-decoration:none;display:flex;align-items:baseline;gap:8px}.logo-text{font-family:var(--font-d);font-size:24px;font-weight:800;color:#fff;letter-spacing:-.5px}.logo-sub{font-size:11px;color:rgba(255,255,255,.5);font-weight:300}.header-nav{display:flex;align-items:center;gap:8px}.btn-h{background:none;border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.8);padding:6px 14px;border-radius:6px;cursor:pointer;font-size:13px;transition:var(--tr);font-family:var(--font)}.btn-h:hover{background:rgba(255,255,255,.1);color:#fff}.btn-h-logout{border-color:rgba(231,76,60,.4);color:rgba(231,76,60,.8)}.btn-h-logout:hover{background:rgba(231,76,60,.15);color:#E74C3C}.hdr-name{color:rgba(255,255,255,.9);font-size:13px;font-weight:500;padding:0 4px}
.fg{margin-bottom:16px;flex:1}.fg label{display:block;font-size:13px;font-weight:500;color:var(--text);margin-bottom:6px}.fg label i{color:var(--danger);font-style:normal}.fg input,.fg select,.fg textarea{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:8px;font-size:14px;font-family:var(--font);transition:var(--tr);background:#fff;color:var(--text)}.fg input:focus,.fg select:focus,.fg textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}.fr{display:flex;gap:16px}
.btn{background:var(--primary);color:#fff;border:none;padding:10px 24px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;transition:var(--tr);font-family:var(--font)}.btn:hover{background:var(--primary-lt);transform:translateY(-1px);box-shadow:var(--shadow)}.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}.btn-sec{background:#fff;color:var(--text);border:1px solid var(--border)}.btn-sec:hover{border-color:var(--primary);color:var(--primary);background:#fff}.btn-sm{padding:6px 12px;font-size:12px}.btn-danger{background:var(--danger);color:#fff;border:none;padding:6px 12px;border-radius:6px;font-size:12px;cursor:pointer}.btn-full{width:100%}.btn-success{background:var(--success)}.btn-warning{background:var(--warning);color:#333}
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600}.badge-doc{background:#E8F5E9;color:#2E7D32}.badge-ppt{background:#FFF3E0;color:#E65100}.badge-html{background:#E3F2FD;color:#1565C0}.badge-video{background:#FCE4EC;color:#C62828}.st-active{color:var(--success);font-weight:600}.st-suspended{color:var(--danger);font-weight:600}.st-expired{color:var(--danger);font-weight:600}.st-ok{color:var(--success);font-weight:600}.st-warn{color:var(--warning);font-weight:600}
.tbl{width:100%;border-collapse:collapse;font-size:13px}.tbl th{background:var(--primary);color:#fff;padding:10px 12px;text-align:left;font-weight:500;white-space:nowrap}.tbl td{padding:10px 12px;border-bottom:1px solid var(--border-lt)}.tbl tbody tr:hover{background:var(--accent-glow)}.tbl .ov{max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tbl-wrap{overflow-x:auto}
.tabs{display:flex;gap:4px;margin-bottom:20px;flex-wrap:wrap}.tab{padding:10px 20px;border:none;background:var(--border-lt);border-radius:8px 8px 0 0;cursor:pointer;font-size:14px;font-weight:500;color:var(--text-lt);transition:var(--tr);font-family:var(--font)}.tab.active{background:var(--primary);color:#fff}
.modal{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center}.mdl-bg{position:absolute;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(4px)}.mdl-box{position:relative;background:var(--bg-card);border-radius:var(--radius-lg);padding:32px;max-width:500px;width:90%;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lg);z-index:1}.mdl-lg{max-width:720px}.mdl-x{position:absolute;top:12px;right:16px;background:none;border:none;font-size:28px;color:var(--text-lt);cursor:pointer;z-index:2}
.toast{position:fixed;bottom:32px;left:50%;transform:translateX(-50%);background:var(--primary-dk);color:#fff;padding:12px 28px;border-radius:8px;font-size:14px;z-index:9999;box-shadow:var(--shadow-lg)}.toast-success{background:var(--success)}.toast-error{background:var(--danger)}.toast-warning{background:var(--warning);color:#333}
.adm-layout{display:flex;min-height:100vh;padding-top:60px}.sidebar{width:220px;background:var(--primary-dk);position:fixed;top:60px;left:0;bottom:0;overflow-y:auto;padding:12px 0;z-index:50;border-right:1px solid rgba(255,255,255,.05)}.side-nav{display:flex;flex-direction:column}.sn{color:rgba(255,255,255,.65);text-decoration:none;padding:10px 20px;font-size:13px;transition:var(--tr);border-left:3px solid transparent;cursor:pointer}.sn:hover{color:#fff;background:rgba(255,255,255,.05)}.sn.active{color:#fff;background:rgba(46,134,171,.15);border-left-color:var(--accent)}.adm-main{flex:1;margin-left:220px;padding:24px;min-height:calc(100vh - 60px)}.panel h2{font-size:22px;font-weight:600;color:var(--primary);margin-bottom:20px;padding-bottom:12px;border-bottom:2px solid var(--border-lt)}.toolbar{display:flex;gap:8px;margin-bottom:16px;align-items:center;flex-wrap:wrap}.toolbar input,.toolbar select{padding:8px 12px;border:1px solid var(--border);border-radius:6px;font-size:13px;font-family:var(--font)}.toolbar label{font-size:13px;color:var(--text-lt)}.form-box{background:var(--bg);padding:20px;border-radius:var(--radius);margin:16px 0;border:1px solid var(--border-lt)}.info-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:16px;font-size:13px}.info-grid label{color:var(--text-lt);margin-right:8px}
.dash-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}.dash-c{background:var(--bg-card);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);border-left:4px solid var(--accent)}.dash-c span{font-size:13px;color:var(--text-lt);display:block;margin-bottom:8px}.dash-c strong{font-size:28px;color:var(--primary);font-weight:700}.dash-c em{font-size:13px;color:var(--text-lt);font-style:normal}
.hidden{display:none!important}.empty{text-align:center;padding:48px;color:var(--text-lt);font-size:15px}.mt{margin-top:16px}
.mob-menu-btn{display:none;background:none;border:none;color:#fff;font-size:24px;cursor:pointer}
@media(max-width:768px){.header-nav{display:none}.mob-menu-btn{display:block}.fr{flex-direction:column;gap:0}.tbl{font-size:12px}.tbl th,.tbl td{padding:8px 6px}.mdl-box{padding:20px}.dash-row{grid-template-columns:repeat(2,1fr)}.sidebar{display:none;position:fixed;z-index:999;width:100%}.sidebar.show{display:block}.adm-main{margin-left:0}.info-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
<header class="header"><div class="header-inner"><a href="admin.html" class="logo"><span class="logo-text">JAVIA</span><span class="logo-sub">Admin</span></a><nav class="header-nav"><span id="adm-name" class="hdr-name"></span><button class="btn-h" onclick="goUser()">사용자 페이지</button><button class="btn-h btn-h-logout" onclick="admLogout()">로그아웃</button></nav><button class="mob-menu-btn" onclick="document.querySelector('.sidebar').classList.toggle('show')">☰</button></div></header>
<div class="adm-layout">
  <aside class="sidebar"><nav class="side-nav">
    <a class="sn active" data-p="p-dash" onclick="goPanel(this)">📊 대시보드</a>
    <a class="sn" data-p="p-members" onclick="goPanel(this)">👥 회원관리</a>
    <a class="sn" data-p="p-admins" onclick="goPanel(this)">🔑 관리자관리</a>
    <a class="sn" data-p="p-contents" onclick="goPanel(this)">📁 콘텐츠관리</a>
    <a class="sn" data-p="p-cats" onclick="goPanel(this)">🏷 카테고리관리</a>
    <a class="sn" data-p="p-logs" onclick="goPanel(this)">📋 이용로그</a>
    <a class="sn" data-p="p-notices" onclick="goPanel(this)">📢 공지사항관리</a>
    <a class="sn" data-p="p-terms" onclick="goPanel(this)">📝 약관관리</a>
  </nav></aside>
  <main class="adm-main">
    <div id="p-dash" class="panel"><h2>대시보드</h2><div class="dash-row"><div class="dash-c"><span>전체 회원</span><strong id="d-total">0</strong></div><div class="dash-c"><span>이용중</span><strong id="d-active">0</strong></div><div class="dash-c"><span>기간만료</span><strong id="d-expired">0</strong></div><div class="dash-c"><span>오늘 열람</span><strong id="d-views">0</strong></div></div></div>

    <div id="p-members" class="panel hidden"><h2>회원관리</h2>
      <button class="btn" onclick="showAddUser()">무료사용자 추가</button>
      <div id="add-user-form" class="hidden form-box">
        <div class="fr"><div class="fg"><label>이름 <i>*</i></label><input id="nu-name" required></div><div class="fg"><label>아이디 <i>*</i></label><input id="nu-loginid" required></div></div>
        <div class="fr"><div class="fg"><label>비밀번호 <i>*</i></label><input id="nu-pw" type="password" required></div><div class="fg"><label>이메일 <i>*</i></label><input id="nu-email" type="email" required></div></div>
        <div class="fr"><div class="fg"><label>소속사</label><input id="nu-company"></div><div class="fg"><label>직함</label><input id="nu-title"></div></div>
        <div class="fr"><div class="fg"><label>연락처</label><input id="nu-phone" placeholder="010-0000-0000"></div><div class="fg"><label>이용기간</label><select id="nu-period"><option value="30">30일</option><option value="90">90일</option><option value="180">180일</option><option value="365">365일</option></select></div></div>
        <button class="btn" onclick="createUser()">생성</button> <button class="btn btn-sec" onclick="$('add-user-form').classList.add('hidden')">취소</button>
      </div>
      <div class="toolbar mt"><input id="m-search" placeholder="이름/연락처/이메일 검색..." oninput="loadMembers()"></div>
      <div class="tbl-wrap"><table class="tbl"><thead><tr><th>가입일</th><th>이름</th><th>아이디</th><th>소속</th><th>연락처</th><th>이용만료</th><th>상태</th><th>관리</th></tr></thead><tbody id="tb-members"></tbody></table></div>
    </div>

    <div id="p-admins" class="panel hidden"><h2>관리자 관리</h2><button class="btn" id="btn-add-adm" onclick="document.getElementById('add-adm-form').classList.toggle('hidden')">관리자 추가</button><div id="add-adm-form" class="hidden form-box"><div class="fr"><div class="fg"><label>아이디</label><input id="na-id"></div><div class="fg"><label>이름</label><input id="na-name"></div><div class="fg"><label>비밀번호</label><input id="na-pw" type="password"></div></div><button class="btn" onclick="createAdmin()">생성</button> <button class="btn btn-sec" onclick="document.getElementById('add-adm-form').classList.add('hidden')">취소</button></div><table class="tbl mt"><thead><tr><th>아이디</th><th>이름</th><th>권한</th><th>마지막 로그인</th><th>상태</th><th>관리</th></tr></thead><tbody id="tb-admins"></tbody></table></div>

    <div id="p-contents" class="panel hidden"><h2>콘텐츠 관리</h2><button class="btn" onclick="showCF()">콘텐츠 등록</button><div id="cf-area" class="hidden form-box"><form onsubmit="saveCont(event)"><input type="hidden" id="cf-id"><div class="fr"><div class="fg"><label>제목</label><input id="cf-title" required></div><div class="fg"><label>카테고리</label><select id="cf-cat"></select></div></div><div class="fr"><div class="fg"><label>유형</label><select id="cf-type"><option value="doc">문서</option><option value="ppt">PPT</option><option value="html">HTML</option><option value="video">영상</option></select></div><div class="fg"><label>정렬순서</label><input id="cf-sort" type="number" value="0"></div></div><div class="fg"><label>콘텐츠 URL</label><input id="cf-url" type="url" required></div><div class="fg"><label>썸네일 URL (선택)</label><input id="cf-thumb"></div><div class="fg"><label>요약</label><textarea id="cf-summary" rows="3"></textarea></div><div class="fg"><label>노출</label><select id="cf-active"><option value="1">노출</option><option value="0">비노출</option></select></div><button type="submit" class="btn">저장</button> <button type="button" class="btn btn-sec" onclick="$('cf-area').classList.add('hidden')">취소</button></form></div><div class="tbl-wrap mt"><table class="tbl"><thead><tr><th>제목</th><th>카테고리</th><th>유형</th><th>열람수</th><th>노출</th><th>관리</th></tr></thead><tbody id="tb-conts"></tbody></table></div></div>

    <div id="p-cats" class="panel hidden"><h2>카테고리 관리</h2><div class="toolbar"><input id="nc-name" placeholder="카테고리명"><button class="btn" onclick="addCat()">추가</button></div><table class="tbl mt"><thead><tr><th>카테고리명</th><th>정렬</th><th>상태</th><th>관리</th></tr></thead><tbody id="tb-cats"></tbody></table></div>

    <div id="p-logs" class="panel hidden"><h2>이용 로그</h2><div class="toolbar"><label>기간:</label><input id="lg-from" type="date"> ~ <input id="lg-to" type="date"><button class="btn" onclick="loadLogs()">조회</button><button class="btn btn-sec" onclick="exportCSV()">CSV 다운로드</button></div><div id="lg-summary" class="dash-row mt"></div><div class="tbl-wrap mt"><table class="tbl"><thead><tr><th>날짜</th><th>회원</th><th>콘텐츠</th></tr></thead><tbody id="tb-logs"></tbody></table></div></div>

    <div id="p-notices" class="panel hidden"><h2>공지사항 관리</h2><button class="btn" onclick="showNF()">공지 등록</button><div id="nf-area" class="hidden form-box"><form onsubmit="saveNotice(event)"><input type="hidden" id="nf-id"><div class="fg"><label>제목</label><input id="nf-title" required></div><div class="fg"><label>내용</label><textarea id="nf-body" rows="6" required></textarea></div><div class="fg"><label>노출</label><select id="nf-active"><option value="1">노출</option><option value="0">비노출</option></select></div><button type="submit" class="btn">저장</button> <button type="button" class="btn btn-sec" onclick="$('nf-area').classList.add('hidden')">취소</button></form></div><table class="tbl mt"><thead><tr><th>제목</th><th>노출</th><th>등록일</th><th>관리</th></tr></thead><tbody id="tb-notices"></tbody></table></div>

    <div id="p-terms" class="panel hidden"><h2>약관 관리</h2><div class="tabs"><button class="tab active" onclick="loadTermEdit('terms_of_service',this)">이용약관</button><button class="tab" onclick="loadTermEdit('privacy_policy',this)">개인정보처리방침</button></div><form onsubmit="saveTerm(event)"><input type="hidden" id="te-type" value="terms_of_service"><div class="fg"><textarea id="te-body" rows="15" style="font-family:monospace"></textarea></div><button type="submit" class="btn">저장</button></form></div>
  </main>
</div>

<div id="mdl-member" class="modal hidden"><div class="mdl-bg" onclick="closeM('mdl-member')"></div><div class="mdl-box mdl-lg"><button class="mdl-x" onclick="closeM('mdl-member')">×</button><div id="member-inner"></div></div></div>
<div id="toast" class="toast hidden"></div>

<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import{getAuth,onAuthStateChanged,signOut,createUserWithEmailAndPassword}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import{getFirestore,collection,doc,getDoc,getDocs,setDoc,updateDoc,deleteDoc,query,where,orderBy,limit,serverTimestamp,increment,Timestamp}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const FC={apiKey:"AIzaSyCf7CsUTgfIWY-RW_mvTJOhczDtk1xM9sA",authDomain:"kfpc-company-support-project.firebaseapp.com",projectId:"kfpc-company-support-project",storageBucket:"kfpc-company-support-project.firebasestorage.app",messagingSenderId:"1012609333373",appId:"1:1012609333373:web:7b6c207c81ff10d156d914",measurementId:"G-CMW6QQ470G"};
const app=initializeApp(FC);
const auth=getAuth(app);
const db=getFirestore(app,'javia-db');

const $=id=>document.getElementById(id);
const gid=()=>Date.now().toString(36)+Math.random().toString(36).substr(2,9);
const fmt=n=>(n||0).toLocaleString('ko-KR');
const fdate=t=>{if(!t)return'-';const d=t.toDate?t.toDate():new Date(t);return d.toLocaleDateString('ko-KR');};
const fdatetime=t=>{if(!t)return'-';const d=t.toDate?t.toDate():new Date(t);return d.toLocaleDateString('ko-KR')+' '+d.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});};
const esc=s=>{if(!s)return'';const d=document.createElement('div');d.textContent=s;return d.innerHTML;};
let _tt;function toast(m,t=''){const e=$('toast');e.textContent=m;e.className='toast'+(t?' toast-'+t:'');e.classList.remove('hidden');clearTimeout(_tt);_tt=setTimeout(()=>e.classList.add('hidden'),3000);}
function openM(id){$(id).classList.remove('hidden');}
function closeM(id){$(id).classList.add('hidden');}
function typeBadge(t){const l={doc:'문서',ppt:'PPT',html:'HTML',video:'영상'};return`<span class="badge badge-${t}">${l[t]||t}</span>`;}

function expiryStatus(expiresAt){
  if(!expiresAt)return{text:'미설정',cls:'st-warn'};
  const exp=expiresAt.toDate?expiresAt.toDate():new Date(expiresAt);
  const now=new Date(),diff=Math.ceil((exp-now)/(1000*60*60*24));
  if(diff<0)return{text:'만료('+fdate(expiresAt)+')',cls:'st-expired'};
  if(diff<=7)return{text:fdate(expiresAt)+' ('+diff+'일)',cls:'st-warn'};
  return{text:fdate(expiresAt)+' ('+diff+'일)',cls:'st-ok'};
}

let admUser=null,admData=null;

onAuthStateChanged(auth,async u=>{
  if(!u||!u.email||!u.email.endsWith('@javia-admin.internal')){window.location.href='index.html';return;}
  admUser=u;
  const lid=u.email.replace('@javia-admin.internal','');
  const snap=await getDocs(query(collection(db,'admins'),where('loginId','==',lid),limit(1)));
  if(snap.empty){window.location.href='index.html';return;}
  admData=snap.docs[0].data();
  $('adm-name').textContent=(admData.name||admData.loginId)+' ('+({superadmin:'총괄',admin:'관리자'}[admData.role]||admData.role)+')';
  loadDash();
});

async function admLogout(){await signOut(auth);window.location.href='index.html';}
function goUser(){window.open('index.html','_blank');}

function goPanel(el){
  document.querySelectorAll('.sn').forEach(a=>a.classList.remove('active'));el.classList.add('active');
  document.querySelectorAll('.panel').forEach(p=>p.classList.add('hidden'));$(el.dataset.p).classList.remove('hidden');
  document.querySelector('.sidebar').classList.remove('show');
  const ld={'p-dash':loadDash,'p-members':loadMembers,'p-admins':loadAdmins,'p-contents':loadConts,'p-cats':loadCats,'p-logs':loadLogs,'p-notices':loadNoticesAdm,'p-terms':()=>loadTermEdit('terms_of_service')};
  if(ld[el.dataset.p])ld[el.dataset.p]();
}

// ═══ DASHBOARD ═══
async function loadDash(){
  const today=new Date();today.setHours(0,0,0,0);const tTs=Timestamp.fromDate(today);
  const allSnap=await getDocs(query(collection(db,'users'),where('role','==','free_user')));
  let total=0,active=0,expired=0;const now=new Date();
  allSnap.docs.forEach(d=>{total++;const u=d.data();if(!u.expiresAt)return;const exp=u.expiresAt.toDate?u.expiresAt.toDate():new Date(u.expiresAt);if(now>exp)expired++;else active++;});
  $('d-total').textContent=total;$('d-active').textContent=active;$('d-expired').textContent=expired;
  const vw=await getDocs(query(collection(db,'view_logs'),where('createdAt','>=',tTs)));$('d-views').textContent=vw.size;
}

// ═══ MEMBERS (무료사용자) ═══
function showAddUser(){$('add-user-form').classList.toggle('hidden');}

async function createUser(){
  const name=$('nu-name').value.trim(),loginId=$('nu-loginid').value.trim(),pw=$('nu-pw').value,email=$('nu-email').value.trim();
  const company=$('nu-company').value.trim(),title=$('nu-title').value.trim(),phone=$('nu-phone').value.trim();
  const days=parseInt($('nu-period').value);
  if(!name||!loginId||!pw||!email)return toast('필수항목을 입력하세요.','error');
  if(pw.length<6)return toast('비밀번호 6자 이상','error');
  // 중복 체크
  const idChk=await getDocs(query(collection(db,'users'),where('loginId','==',loginId),limit(1)));
  if(!idChk.empty)return toast('이미 사용 중인 아이디','error');
  try{
    const secondApp=initializeApp(FC,'tempUser'+Date.now());
    const secondAuth=getAuth(secondApp);
    const cred=await createUserWithEmailAndPassword(secondAuth,email,pw);
    const uid=cred.user.uid;
    await signOut(secondAuth);
    const expiresAt=Timestamp.fromDate(new Date(Date.now()+days*24*60*60*1000));
    await setDoc(doc(db,'users',uid),{
      userId:uid,name,company,title,phone,email,address:'',loginId,
      role:'free_user',status:'active',expiresAt,
      createdBy:admUser.uid,lastLoginAt:null,
      createdAt:serverTimestamp(),updatedAt:serverTimestamp()
    });
    toast('무료사용자 생성 완료 (아이디: '+loginId+', '+days+'일)','success');
    $('add-user-form').classList.add('hidden');
    ['nu-name','nu-loginid','nu-pw','nu-email','nu-company','nu-title','nu-phone'].forEach(id=>$(id).value='');
    loadMembers();
  }catch(e){
    if(e.code==='auth/email-already-in-use')toast('이미 Auth에 존재하는 이메일','error');
    else toast('생성 실패: '+e.message,'error');
  }
}

async function loadMembers(){
  const s=($('m-search')?.value||'').toLowerCase();
  const snap=await getDocs(query(collection(db,'users'),where('role','==','free_user'),orderBy('createdAt','desc')));
  let list=snap.docs.map(d=>({id:d.id,...d.data()}));
  if(s)list=list.filter(m=>(m.name||'').toLowerCase().includes(s)||(m.phone||'').includes(s)||(m.email||'').toLowerCase().includes(s)||(m.loginId||'').toLowerCase().includes(s));
  $('tb-members').innerHTML=list.map(m=>{const es=expiryStatus(m.expiresAt);return`<tr><td>${fdate(m.createdAt)}</td><td>${esc(m.name)}</td><td>${esc(m.loginId)}</td><td>${esc(m.company||'')}</td><td>${esc(m.phone||'')}</td><td><span class="${es.cls}">${es.text}</span></td><td><span class="st-${m.status}">${m.status==='active'?'정상':'정지'}</span></td><td><button class="btn btn-sm" onclick="showMember('${m.id}')">상세</button></td></tr>`;}).join('');
}

async function showMember(uid){
  const d=await getDoc(doc(db,'users',uid));if(!d.exists())return;const m=d.data();
  const es=expiryStatus(m.expiresAt);
  const vlSnap=await getDocs(query(collection(db,'view_logs'),where('userId','==',uid),orderBy('createdAt','desc'),limit(20)));
  $('member-inner').innerHTML=`<h2>${esc(m.name)} 회원 상세</h2>
    <div class="info-grid"><div><label>아이디:</label>${esc(m.loginId)}</div><div><label>소속:</label>${esc(m.company||'')}</div><div><label>직함:</label>${esc(m.title||'')}</div><div><label>연락처:</label>${esc(m.phone||'')}</div><div><label>이메일:</label>${esc(m.email||'')}</div><div><label>상태:</label><span class="st-${m.status}">${m.status==='active'?'정상':'정지'}</span></div><div><label>이용만료:</label><span class="${es.cls}" style="font-weight:600">${es.text}</span></div><div><label>가입일:</label>${fdate(m.createdAt)}</div><div><label>마지막 로그인:</label>${fdatetime(m.lastLoginAt)}</div></div>
    <div style="margin:16px 0;display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn btn-sm" onclick="toggleStatus('${uid}','${m.status}')">${m.status==='active'?'정지하기':'해제하기'}</button>
    </div>
    <h3>이용기간 연장/변경</h3>
    <div class="fr" style="margin:12px 0"><div class="fg"><label>연장 기간</label><select id="ext-${uid}"><option value="30">30일</option><option value="90">90일</option><option value="180">180일</option><option value="365">365일</option></select></div><button class="btn btn-sm btn-success" style="align-self:end" onclick="extendPeriod('${uid}')">연장</button><div class="fg"><label>만료일 직접 지정</label><input id="expdate-${uid}" type="date"></div><button class="btn btn-sm btn-warning" style="align-self:end" onclick="setExpDate('${uid}')">적용</button></div>
    <h3 class="mt">이용 내역(최근 20건)</h3><table class="tbl"><thead><tr><th>날짜</th><th>콘텐츠</th></tr></thead><tbody>${vlSnap.docs.map(d=>{const l=d.data();return`<tr><td>${fdatetime(l.createdAt)}</td><td class="ov">${l.contentId}</td></tr>`;}).join('')}</tbody></table>`;
  openM('mdl-member');
}

async function toggleStatus(uid,cur){const ns=cur==='active'?'suspended':'active';if(!confirm((ns==='suspended'?'정지':'해제')+'하시겠습니까?'))return;await updateDoc(doc(db,'users',uid),{status:ns,updatedAt:serverTimestamp()});toast('상태 변경 완료','success');closeM('mdl-member');loadMembers();}

async function extendPeriod(uid){
  const days=parseInt($('ext-'+uid).value);
  const uDoc=await getDoc(doc(db,'users',uid));const u=uDoc.data();
  let base=new Date();
  if(u.expiresAt){const exp=u.expiresAt.toDate?u.expiresAt.toDate():new Date(u.expiresAt);if(exp>base)base=exp;}
  const newExp=Timestamp.fromDate(new Date(base.getTime()+days*24*60*60*1000));
  await updateDoc(doc(db,'users',uid),{expiresAt:newExp,updatedAt:serverTimestamp()});
  toast(days+'일 연장 완료','success');closeM('mdl-member');loadMembers();
}

async function setExpDate(uid){
  const val=$('expdate-'+uid).value;if(!val)return toast('날짜를 선택하세요','error');
  const d=new Date(val);d.setHours(23,59,59,999);
  await updateDoc(doc(db,'users',uid),{expiresAt:Timestamp.fromDate(d),updatedAt:serverTimestamp()});
  toast('만료일 변경 완료: '+fdate(Timestamp.fromDate(d)),'success');closeM('mdl-member');loadMembers();
}

// ═══ ADMINS ═══
async function loadAdmins(){
  const snap=await getDocs(query(collection(db,'admins'),orderBy('createdAt','desc')));
  $('tb-admins').innerHTML=snap.docs.map(d=>{const a=d.data();const isSA=a.role==='superadmin';return`<tr><td>${esc(a.loginId)}</td><td>${esc(a.name||'')}</td><td>${a.role==='superadmin'?'총괄관리자':'관리자'}</td><td>${fdatetime(a.lastLoginAt)}</td><td><span class="st-${a.status}">${a.status==='active'?'정상':'정지'}</span></td><td>${!isSA&&admData?.role==='superadmin'?`<button class="btn btn-sm btn-danger" onclick="delAdmin('${d.id}')">삭제</button>`:'-'}</td></tr>`;}).join('');
  $('btn-add-adm').style.display=admData?.role==='superadmin'?'':'none';
}
async function createAdmin(){
  const lid=$('na-id').value.trim(),name=$('na-name').value.trim(),pw=$('na-pw').value;
  if(!lid||!name||!pw)return toast('모든 항목을 입력하세요.','error');
  if(pw.length<6)return toast('비밀번호 6자 이상','error');
  const ex=await getDocs(query(collection(db,'admins'),where('loginId','==',lid),limit(1)));
  if(!ex.empty)return toast('이미 존재하는 아이디','error');
  try{
    const secondApp=initializeApp(FC,'tempAdmin'+Date.now());const secondAuth=getAuth(secondApp);
    await createUserWithEmailAndPassword(secondAuth,lid+'@javia-admin.internal',pw);await signOut(secondAuth);
    const id=gid();await setDoc(doc(db,'admins',id),{adminId:id,loginId:lid,name,role:'admin',status:'active',createdBy:admUser.uid,lastLoginAt:null,createdAt:serverTimestamp()});
    toast('관리자 추가 완료','success');$('add-adm-form').classList.add('hidden');$('na-id').value='';$('na-name').value='';$('na-pw').value='';loadAdmins();
  }catch(e){if(e.code==='auth/email-already-in-use')toast('이미 Auth에 존재하는 계정','error');else toast('생성 실패: '+e.message,'error');}
}
async function delAdmin(docId){if(!confirm('삭제하시겠습니까?'))return;await deleteDoc(doc(db,'admins',docId));toast('삭제 완료','success');loadAdmins();}

// ═══ CONTENTS ═══
async function loadConts(){
  const catSnap=await getDocs(query(collection(db,'categories'),orderBy('sortOrder')));const cats=catSnap.docs.map(d=>d.data());const catMap={};cats.forEach(c=>catMap[c.categoryId]=c.name);
  $('cf-cat').innerHTML=cats.map(c=>`<option value="${c.categoryId}">${esc(c.name)}</option>`).join('');
  const cSnap=await getDocs(query(collection(db,'contents'),orderBy('sortOrder')));
  $('tb-conts').innerHTML=cSnap.docs.map(d=>{const c=d.data();return`<tr><td class="ov">${esc(c.title)}</td><td>${esc(catMap[c.categoryId]||'')}</td><td>${typeBadge(c.type)}</td><td>${c.viewCount||0}</td><td>${c.isActive?'<span class="st-active">노출</span>':'<span class="st-suspended">비노출</span>'}</td><td><button class="btn btn-sm" onclick="editCont('${c.contentId}')">수정</button></td></tr>`;}).join('');
}
function showCF(){$('cf-area').classList.remove('hidden');$('cf-id').value='';document.querySelector('#cf-area form').reset();}
async function editCont(cid){const d=await getDoc(doc(db,'contents',cid));if(!d.exists())return;const c=d.data();$('cf-id').value=cid;$('cf-title').value=c.title;$('cf-cat').value=c.categoryId;$('cf-type').value=c.type;$('cf-url').value=c.url;$('cf-thumb').value=c.thumbnailUrl||'';$('cf-summary').value=c.summary||'';$('cf-sort').value=c.sortOrder||0;$('cf-active').value=c.isActive?'1':'0';$('cf-area').classList.remove('hidden');}
async function saveCont(e){
  e.preventDefault();const cid=$('cf-id').value||gid();
  const data={contentId:cid,title:$('cf-title').value.trim(),categoryId:$('cf-cat').value,type:$('cf-type').value,url:$('cf-url').value.trim(),thumbnailUrl:$('cf-thumb').value.trim()||null,summary:$('cf-summary').value.trim(),sortOrder:parseInt($('cf-sort').value)||0,isActive:$('cf-active').value==='1',updatedAt:serverTimestamp()};
  if(!$('cf-id').value){data.viewCount=0;data.createdAt=serverTimestamp();}
  await setDoc(doc(db,'contents',cid),data,{merge:true});toast('콘텐츠 저장 완료','success');$('cf-area').classList.add('hidden');loadConts();
}

// ═══ CATEGORIES ═══
async function loadCats(){const snap=await getDocs(query(collection(db,'categories'),orderBy('sortOrder')));$('tb-cats').innerHTML=snap.docs.map(d=>{const c=d.data();return`<tr><td>${esc(c.name)}</td><td>${c.sortOrder}</td><td>${c.isActive?'<span class="st-active">활성</span>':'<span class="st-suspended">비활성</span>'}</td><td><button class="btn btn-sm" onclick="toggleCat('${c.categoryId}',${c.isActive})">${c.isActive?'비활성':'활성'}</button></td></tr>`;}).join('');}
async function addCat(){const name=$('nc-name').value.trim();if(!name)return toast('이름을 입력하세요.','error');const snap=await getDocs(collection(db,'categories'));const id=gid();await setDoc(doc(db,'categories',id),{categoryId:id,name,sortOrder:snap.size,isActive:true});$('nc-name').value='';toast('추가 완료','success');loadCats();}
async function toggleCat(id,cur){await updateDoc(doc(db,'categories',id),{isActive:!cur});loadCats();}

// ═══ LOGS ═══
let _logs=[];
async function loadLogs(){
  const constraints=[orderBy('createdAt','desc')];const f=$('lg-from').value,t=$('lg-to').value;
  if(f)constraints.push(where('createdAt','>=',Timestamp.fromDate(new Date(f))));
  if(t){const td=new Date(t);td.setHours(23,59,59,999);constraints.push(where('createdAt','<=',Timestamp.fromDate(td)));}
  constraints.push(limit(500));
  const snap=await getDocs(query(collection(db,'view_logs'),...constraints));_logs=snap.docs.map(d=>d.data());
  const uc={},cc={};const rows=[];
  for(const l of _logs){if(!uc[l.userId]){const u=await getDoc(doc(db,'users',l.userId));uc[l.userId]=u.exists()?u.data().name:l.userId;}if(!cc[l.contentId]){const c=await getDoc(doc(db,'contents',l.contentId));cc[l.contentId]=c.exists()?c.data().title:l.contentId;}rows.push(`<tr><td>${fdatetime(l.createdAt)}</td><td>${esc(uc[l.userId])}</td><td class="ov">${esc(cc[l.contentId])}</td></tr>`);}
  $('lg-summary').innerHTML=`<div class="dash-c"><span>총 열람수</span><strong>${_logs.length}</strong></div>`;$('tb-logs').innerHTML=rows.join('');
}
function exportCSV(){if(!_logs.length)return toast('데이터 없음','error');let csv='\uFEFF날짜,사용자ID,콘텐츠ID\n';_logs.forEach(l=>{csv+=`${fdatetime(l.createdAt)},${l.userId},${l.contentId}\n`;});const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='javia_logs_'+new Date().toISOString().slice(0,10)+'.csv';a.click();}

// ═══ NOTICES ═══
async function loadNoticesAdm(){const snap=await getDocs(query(collection(db,'notices'),orderBy('createdAt','desc')));$('tb-notices').innerHTML=snap.docs.map(d=>{const n=d.data();return`<tr><td>${esc(n.title)}</td><td>${n.isActive?'<span class="st-active">노출</span>':'<span class="st-suspended">비노출</span>'}</td><td>${fdate(n.createdAt)}</td><td><button class="btn btn-sm" onclick="editNotice('${n.noticeId}')">수정</button></td></tr>`;}).join('');}
function showNF(){$('nf-area').classList.remove('hidden');$('nf-id').value='';$('nf-title').value='';$('nf-body').value='';}
async function editNotice(nid){const d=await getDoc(doc(db,'notices',nid));if(!d.exists())return;const n=d.data();$('nf-id').value=nid;$('nf-title').value=n.title;$('nf-body').value=n.body;$('nf-active').value=n.isActive?'1':'0';$('nf-area').classList.remove('hidden');}
async function saveNotice(e){e.preventDefault();const nid=$('nf-id').value||gid();const data={noticeId:nid,title:$('nf-title').value.trim(),body:$('nf-body').value.trim(),isActive:$('nf-active').value==='1',updatedAt:serverTimestamp()};if(!$('nf-id').value){data.createdBy=admUser.uid;data.createdAt=serverTimestamp();}await setDoc(doc(db,'notices',nid),data,{merge:true});toast('공지 저장 완료','success');$('nf-area').classList.add('hidden');loadNoticesAdm();}

// ═══ TERMS ═══
async function loadTermEdit(type,btn){if(btn){btn.parentElement.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));btn.classList.add('active');}$('te-type').value=type;const snap=await getDocs(query(collection(db,'terms'),where('type','==',type),where('isActive','==',true),orderBy('version','desc'),limit(1)));$('te-body').value=snap.empty?'':snap.docs[0].data().content;}
async function saveTerm(e){e.preventDefault();const type=$('te-type').value,content=$('te-body').value.trim();const exSnap=await getDocs(query(collection(db,'terms'),where('type','==',type),where('isActive','==',true)));let ver=1;if(!exSnap.empty){ver=(exSnap.docs[0].data().version||0)+1;for(const d of exSnap.docs)await updateDoc(d.ref,{isActive:false});}const tid=gid();await setDoc(doc(db,'terms',tid),{termId:tid,type,content,version:ver,isActive:true,updatedBy:admUser.uid,createdAt:serverTimestamp(),updatedAt:serverTimestamp()});toast('약관 저장 완료 (v'+ver+')','success');}

window.loadAdmins=loadAdmins;window.createAdmin=createAdmin;window.delAdmin=delAdmin;
window.showCF=showCF;window.editCont=editCont;window.saveCont=saveCont;window.loadConts=loadConts;
window.addCat=addCat;window.toggleCat=toggleCat;window.loadCats=loadCats;
window.loadLogs=loadLogs;window.exportCSV=exportCSV;
window.showNF=showNF;window.editNotice=editNotice;window.saveNotice=saveNotice;window.loadNoticesAdm=loadNoticesAdm;
window.loadTermEdit=loadTermEdit;window.saveTerm=saveTerm;
</script>
