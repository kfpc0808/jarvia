<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JARVIA Daily Report</title>
<script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.4/kakao.min.js"></script>
<script>if(window.Kakao&&!Kakao.isInitialized())Kakao.init('2953646393fc63c68eaad8a2467e35bf');</script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Pretendard','Apple SD Gothic Neo',sans-serif;background:#F7F9FC;height:100vh;overflow:hidden}
#dr-loading,#dr-lock{position:fixed;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;background:#F7F9FC;z-index:9999}
#dr-lock{display:none}
#dr-viewer{width:100%;height:100vh;border:none;display:none}
.lock-box{text-align:center}
.lock-icon{font-size:48px;margin-bottom:16px}
.lock-title{font-size:16px;font-weight:600;color:#2C3E50;margin-bottom:8px}
.lock-sub{font-size:13px;color:#7F8C8D;margin-bottom:20px}
.lock-btn{display:inline-block;padding:10px 24px;background:#1B3A5C;color:#fff;border-radius:8px;text-decoration:none;font-size:14px;font-weight:600}
.lock-btn:hover{background:#2E5580}
.loading-spinner{width:32px;height:32px;border:3px solid #E1E8EE;border-top-color:#1B3A5C;border-radius:50%;animation:spin .8s linear infinite;margin-bottom:12px}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:13px;color:#7F8C8D}
</style>
</head>
<body>

<div id="dr-loading">
  <div style="text-align:center">
    <div class="loading-spinner"></div>
    <div class="loading-text">인증 확인 중...</div>
  </div>
</div>

<div id="dr-lock">
  <div class="lock-box">
    <div class="lock-icon">🔒</div>
    <p class="lock-title">로그인이 필요합니다</p>
    <p class="lock-sub">JARVIA 회원만 열람 가능한 콘텐츠입니다.</p>
    <a href="./index.html" class="lock-btn">JARVIA 로그인</a>
  </div>
</div>

<iframe id="dr-viewer"></iframe>

<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import{getAuth,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import{getFirestore,doc,getDoc}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const app=initializeApp({apiKey:"AIzaSyBD9p-bf162RiiD1Y3BsY-NvbYjpOSrzmg",authDomain:"jarvia-platform.firebaseapp.com",projectId:"jarvia-platform",storageBucket:"jarvia-platform.firebasestorage.app",messagingSenderId:"388025068900",appId:"1:388025068900:web:09ba8e12e9e9e2ec49de71"});
const auth=getAuth(app);
const db=getFirestore(app,'javia-db');

const id=new URLSearchParams(location.search).get('id');
if(!id){
  document.getElementById('dr-loading').style.display='none';
  document.getElementById('dr-lock').style.display='flex';
  document.querySelector('.lock-title').textContent='잘못된 접근입니다';
  document.querySelector('.lock-sub').textContent='리포트 ID가 지정되지 않았습니다.';
}else{
  onAuthStateChanged(auth,async u=>{
    document.getElementById('dr-loading').style.display='none';
    if(u){
      // ★ 무료회원 접근 차단 + 회원명/공유설정 로드
      let _userName='';
      let _loginId='';
      let _shareData=null;
      try{
        const uDoc=await getDoc(doc(db,'users',u.uid));
        if(uDoc.exists()&&uDoc.data().role==='free_user'){
          document.getElementById('dr-lock').style.display='flex';
          document.querySelector('.lock-title').textContent='이용 권한이 없습니다';
          document.querySelector('.lock-sub').textContent='유료회원 전용 콘텐츠입니다.';
          return;
        }
        if(uDoc.exists()){
          _userName=uDoc.data().name||'';
          _loginId=uDoc.data().loginId||'';
        }
      }catch(e){}
      // ★ fc_share_profiles에서 공유 설정 로드
      if(_loginId){
        try{
          const spDoc=await getDoc(doc(db,'fc_share_profiles',_loginId));
          if(spDoc.exists()){
            const sp=spDoc.data();
            _shareData={
              title:sp.shareTitle||'',
              desc:sp.shareDesc||'',
              imageUrl:sp.shareImageUrl||'',
              link:'https://jarvia.co.kr/client-daily?fc='+_loginId
            };
          }
        }catch(e){}
      }
      if(!_shareData&&_loginId){
        _shareData={title:'',desc:'',imageUrl:'',link:'https://jarvia.co.kr/client-daily?fc='+_loginId};
      }
      const url='https://storage.googleapis.com/jarvia-platform.firebasestorage.app/daily-reports/'+id+'_daily-report.html';
      const viewer=document.getElementById('dr-viewer');
      viewer.src=url+'?t='+Date.now();
      viewer.style.display='block';
      // ★ 회원명 + 공유설정 전달
      viewer.addEventListener('load',function(){
        viewer.contentWindow.postMessage({type:'setMemberData',name:_userName,share:_shareData},'*');
      });
      // ★ iframe에서 카카오 공유 요청 수신
      window.addEventListener('message',function(e){
        if(!e.data||e.data.type!=='requestKakaoShare')return;
        var sd=e.data.share||_shareData;
        if(!sd||!sd.link){alert('공유 설정이 없습니다. 마이페이지에서 카톡 공유 설정을 저장해주세요.');return;}
        var title=sd.title||(_userName?_userName+'의 Daily Briefing':'Daily Briefing');
        var desc=sd.desc||'매일 아침 전해드리는 금융 인사이트';
        var imgUrl=sd.imageUrl||'https://jarvia.co.kr/client_report_share_v2.png';
        if(window.Kakao&&Kakao.isInitialized()){
          Kakao.Share.sendDefault({
            objectType:'feed',
            content:{title:title,description:desc,imageUrl:imgUrl,imageWidth:800,imageHeight:400,link:{mobileWebUrl:sd.link,webUrl:sd.link}},
            buttons:[{title:'브리핑 보러가기',link:{mobileWebUrl:sd.link,webUrl:sd.link}}],
            installTalk:true
          });
        }else{
          if(navigator.clipboard){navigator.clipboard.writeText(sd.link).then(function(){alert('링크를 복사했습니다.\n'+sd.link);});}
          else{prompt('링크를 복사하세요:',sd.link);}
        }
      });
      // ★ 토크 트리거 — 텍스트형 카카오 공유 수신 (2026-06-12)
      //   리포트(iframe)의 [카톡 공유] 버튼이 {type:'requestKakaoShareText', text:멘트}를 보내면
      //   멘트 본문을 텍스트형으로 공유. SDK 부재·호출 실패 시 클립보드 복사로 강등.
      window.addEventListener('message',function(e){
        if(!e.data||e.data.type!=='requestKakaoShareText'||!e.data.text)return;
        var ttMsg=String(e.data.text);
        var ttLink=(_shareData&&_shareData.link)||'https://jarvia.co.kr';
        function ttCopy(){
          if(navigator.clipboard){navigator.clipboard.writeText(ttMsg).then(function(){alert('멘트를 복사했습니다. 카톡·문자에 붙여넣으세요.');});}
          else{prompt('아래 멘트를 복사하세요:',ttMsg);}
        }
        if(window.Kakao&&Kakao.isInitialized()){
          try{
            Kakao.Share.sendDefault({
              objectType:'text',
              text:ttMsg.slice(0,200),
              link:{mobileWebUrl:ttLink,webUrl:ttLink},
              buttonTitle:'브리핑 보러가기',
              installTalk:true
            });
          }catch(err){ttCopy();}
        }else{ttCopy();}
      });
    }else{
      document.getElementById('dr-lock').style.display='flex';
    }
  });
}
</script>
</body>
</html>
