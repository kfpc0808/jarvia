<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>JARVIA AI 제안서</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@500;700&display=swap">
<style>
:root{--navy:#0f1f3a;--navy2:#2a3c5e;--navy3:#47597c;--ivory:#f7f3ea;--ivory2:#efe8d6;--paper:#fff;--ink:#1a2233;--sub:#4a5263;--gold:#e3c88f;--gold2:#c9a45c;--goldink:#6b4f10;--mist:#c8d1e0;--line:#d9d2c1;--warn:#8a3b12;--warnbg:#fbeee3;--ok:#1d5c46;--okbg:#e7f2ec;--paper2:#fbf9f4;--tint:#f3eee1;--mute:#566072;--golddeep:#9a7422;
--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--navy);color:var(--ivory);font-family:'Noto Sans KR',system-ui,sans-serif;font-size:16px;line-height:1.7;word-break:keep-all;overflow-wrap:anywhere}
button,input,textarea,select{font-family:inherit;font-size:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
.serif{font-family:'Noto Serif KR',serif}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:calc(12px + var(--sat)) 5% 12px;border-bottom:1px solid var(--navy2)}
.brand{display:flex;align-items:baseline;gap:10px}
.brand b{font-family:'Noto Serif KR',serif;font-size:20px;letter-spacing:.08em}
.brand span{font-size:13px;letter-spacing:.16em;color:var(--gold)}
.topr{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:14px;color:var(--mist)}
.pill{min-height:44px;padding:0 16px;border:1px solid var(--navy3);border-radius:999px;background:transparent;color:var(--ivory);font-size:14px}
main{padding:40px 5% calc(40px + var(--sab));display:flex;flex-direction:column;align-items:center;gap:28px}
.hero{max-width:760px;text-align:center;display:flex;flex-direction:column;gap:10px}
.eyebrow{font-size:13px;letter-spacing:.24em;color:var(--gold)}
h1{margin:0;font-family:'Noto Serif KR',serif;font-weight:700;font-size:clamp(26px,3.2vw,40px);line-height:1.35}
.hero p{margin:0;color:var(--mist)}
.cols{width:100%;max-width:1140px;display:flex;flex-wrap:wrap;gap:22px;align-items:stretch}
.card{flex:3 1 440px;min-width:0;background:var(--ivory);color:var(--ink);border-radius:18px;border-top:3px solid var(--gold2);padding:24px 26px 22px;display:flex;flex-direction:column;gap:14px}
.side{flex:2 1 330px;min-width:0;border:1px solid var(--navy2);border-radius:18px;padding:24px;display:flex;flex-direction:column;gap:16px}
.side h2{margin:0;font-family:'Noto Serif KR',serif;font-size:18px}
.toc{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.toc li{display:flex;align-items:flex-start;gap:12px}
.toc i{flex:none;width:26px;height:26px;border:1px solid var(--gold);border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:13px;font-style:normal;color:var(--gold)}
.toc b{display:block;font-size:16px}
.toc span{font-size:14.5px;color:var(--mist);line-height:1.6}
.sidefoot{margin:0;border-top:1px solid var(--navy2);padding-top:14px;font-size:14.5px;color:#e6ebf3}
label.lb{font-size:14px;font-weight:700;color:var(--sub)}
textarea.req{width:100%;min-height:190px;resize:vertical;border:1px solid var(--line);border-radius:12px;background:#fff;padding:16px 18px;font-size:17px;line-height:1.7;color:var(--ink)}
.attach{min-height:64px;padding:10px 16px;display:flex;align-items:center;gap:12px;text-align:left;border:1.5px dashed #b3a98f;border-radius:12px;background:#fbf9f3;color:var(--ink)}
.attach b{display:block;font-size:15px}
.attach span span{font-size:13.5px;color:var(--sub);line-height:1.5}
.files{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.files li{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:4px 4px 4px 12px;font-size:14.5px}
.files li span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.xbtn{flex:none;width:44px;height:44px;border:none;background:transparent;color:var(--sub);font-size:20px}
.notice{display:flex;align-items:flex-start;gap:10px;background:var(--ivory2);border-radius:12px;padding:12px 14px}
.notice p{margin:0;font-size:14.5px;line-height:1.65;color:#3d3214}
.notice svg{flex:none;margin-top:2px}
.row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.btn{min-height:48px;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid #c9c1ad;border-radius:12px;background:#fff;color:var(--ink);font-size:15px;font-weight:500}
.btn.rec{border-color:var(--warn);color:var(--warn)}
.cta{min-height:54px;padding:0 30px;display:inline-flex;align-items:center;justify-content:center;gap:10px;border:none;border-radius:12px;background:var(--navy);color:var(--ivory);font-size:17px;font-weight:700}
.cta:disabled,.btn:disabled{opacity:.55;cursor:default}
.cta.gold{background:var(--gold);color:var(--navy)}
.steps{list-style:none;margin:0;padding:0;width:100%;max-width:1140px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.steps li{border:1px solid var(--navy2);border-radius:14px;padding:14px 18px;display:flex;align-items:baseline;gap:12px}
.steps em{font-family:'Noto Serif KR',serif;font-style:normal;font-size:15px;color:var(--gold)}
.steps b{display:block;font-size:15.5px}
.steps span span{font-size:14px;color:var(--mist);line-height:1.6}
.msg{width:100%;max-width:1140px;border-radius:12px;padding:12px 16px;font-size:15px;background:var(--warnbg);color:var(--warn)}
/* 진행 */
.wait{width:100%;max-width:640px;background:var(--ivory);color:var(--ink);border-radius:18px;padding:28px;display:flex;flex-direction:column;gap:14px;text-align:center}
.wait h2{margin:0;font-family:'Noto Serif KR',serif;font-size:21px}
.wait p{margin:0;color:var(--sub);font-size:15px}
.wait .wclock{font-size:14px;color:var(--mute);font-variant-numeric:tabular-nums}
textarea.req::placeholder{color:#a3a9b3;opacity:1}
.bar{height:6px;border-radius:99px;background:var(--ivory2);overflow:hidden}
.bar i{display:block;height:100%;width:30%;border-radius:99px;background:var(--gold2);animation:slide 1.6s ease-in-out infinite}
@keyframes slide{0%{margin-left:-30%}100%{margin-left:100%}}
@media (prefers-reduced-motion:reduce){.bar i{animation:none;width:100%}}
/* 확인 화면 */
.sheet{width:100%;max-width:920px;background:var(--ivory);color:var(--ink);border-radius:18px;border-top:3px solid var(--gold2);padding:26px;display:flex;flex-direction:column;gap:22px}
.sheet h2{margin:0;font-family:'Noto Serif KR',serif;font-size:22px}
.sheet h3{margin:0 0 8px;font-size:16px}
.sheet .hint{margin:0;font-size:14.5px;color:var(--sub)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld label{font-size:13.5px;color:var(--sub)}
.fld .in{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:0 10px;min-height:46px}
.fld input{flex:1;min-width:0;border:none;outline:none;background:transparent;font-size:16px;color:var(--ink);min-height:44px}
.fld .u{flex:none;font-size:14px;color:var(--sub)}
.fld.need .in{border-color:var(--warn);background:var(--warnbg)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 14px;border:1px solid #c9c1ad;border-radius:999px;background:#fff;color:var(--ink);font-size:14.5px}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--ivory)}
.facts{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px}
.facts li{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14.5px}
.facts small{display:block;color:var(--sub);font-size:12.5px}
.facts li.unsure{border-color:var(--warn);background:var(--warnbg)}
.box{border-radius:12px;padding:12px 14px;font-size:14.5px}
.box.warn{background:var(--warnbg);color:var(--warn)}
.box.info{background:var(--ivory2);color:#3d3214}
.box ul{margin:0;padding-left:18px}
.pv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.pv div{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.pv small{display:block;font-size:12.5px;color:var(--sub);line-height:1.45}
.pv b{font-size:18px}
/* 문서 — 종이 한 장처럼: 가는 선, 넉넉한 여백, 명조 제목과 숫자 */
.doc{width:100%;max-width:960px;background:var(--paper2);color:var(--ink);border-radius:4px;overflow:hidden}
.dochead{padding:68px 64px 44px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:22px}
.cvtop{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.cvk{font-size:12.5px;font-weight:700;letter-spacing:.26em;color:var(--goldink)}
.cvd{font-size:13px;letter-spacing:.08em;color:var(--mute)}
.cvrule{width:56px;height:2px;background:var(--gold2)}
.dochead h2{margin:0;font-family:'Noto Serif KR',serif;font-weight:700;font-size:clamp(28px,4vw,44px);line-height:1.35;letter-spacing:-.02em}
.dochead p.sub{margin:0;font-family:'Noto Serif KR',serif;font-weight:500;font-size:clamp(17px,2vw,21px);line-height:1.7;color:var(--mute)}
.dochead small{display:block;font-size:13px;color:var(--mute)}
.answers{margin:6px 0 0;padding:0;list-style:none;border-top:1px solid var(--line)}
.answers li{display:flex;gap:18px;margin:0;padding:16px 0;border-bottom:1px solid var(--line);font-size:17px;line-height:1.75}
.answers .an{flex:none;font-family:'Noto Serif KR',serif;font-size:15px;font-weight:700;color:var(--goldink);padding-top:3px}
.answers .at{min-width:0}
.audit{margin:0;padding:16px 64px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:center;gap:4px 18px;font-size:13.5px}
.audit .al{font-weight:700;color:var(--ink)}
.tag{display:inline-flex;align-items:center;gap:5px;min-height:28px;font-size:13.5px;font-weight:500}
.tag.ok{color:#2b6a4a}
.tag.no{color:var(--warn);font-weight:700}
.auditd{padding:14px 64px 16px;border-bottom:1px solid var(--line);font-size:14px;color:var(--mute)}
.auditd strong{color:var(--warn)}
.auditd ul{margin:4px 0 0;padding-left:18px}
section.sec{padding:56px 64px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:24px}
.sh{display:flex;flex-direction:column;gap:10px}
.kh{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.kh .no{font-family:'Noto Serif KR',serif;font-size:32px;font-weight:500;line-height:1;color:var(--golddeep)}
.sec .k{font-size:13px;font-weight:700;letter-spacing:.2em;color:var(--goldink)}
.sec h3{margin:0;font-family:'Noto Serif KR',serif;font-weight:700;font-size:clamp(21px,2.4vw,27px);line-height:1.45;letter-spacing:-.01em}
.sec .lead{margin:0;font-size:17.5px;line-height:1.7;font-weight:400;color:var(--mute)}
.sec .lead .fig{color:var(--ink)}
.sec p{margin:0;font-size:16.5px;line-height:1.85}
.sec ul.l{margin:0;padding:0;list-style:none;border-top:1px solid var(--line)}
.sec ul.l li{position:relative;margin:0;padding:13px 0 13px 20px;border-bottom:1px solid var(--line);font-size:16.5px;line-height:1.75}
.sec ul.l li::before{content:"";position:absolute;left:2px;top:1.62em;width:8px;height:1px;background:var(--golddeep)}
.tw{overflow-x:auto;margin:0}
table{border-collapse:collapse;width:100%;min-width:420px;font-size:15px}
th{padding:0 14px 12px 0;text-align:left;vertical-align:bottom;font-size:12.5px;font-weight:700;letter-spacing:.14em;color:var(--mute);border-bottom:2px solid var(--ink);white-space:nowrap}
td{padding:14px 14px 14px 0;text-align:left;vertical-align:top;line-height:1.65;border-bottom:1px solid var(--line)}
td:first-child{font-weight:500;color:var(--ink)}
tr.sum td{font-weight:700;border-bottom-color:var(--ink)}
tr.hl td{font-weight:700;background:var(--tint);border-bottom-color:var(--ink)}
tr.hl td:first-child{padding-left:12px}
.tnote{margin:-12px 0 0;font-size:13.5px;color:var(--mute)}
.stats{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);margin:0;border-top:2px solid var(--ink);border-bottom:1px solid var(--line)}
.stat{display:flex;flex-direction:column;gap:6px;min-width:0;padding:22px 24px;border-left:1px solid var(--line)}
.stat:first-child{padding-left:0;border-left:none}
.stat small{display:block;font-size:13px;font-weight:700;letter-spacing:.14em;color:var(--mute)}
.stat b{font-family:'Noto Serif KR',serif;font-size:clamp(28px,3.4vw,40px);line-height:1.2;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat b .fig{border-bottom:none;white-space:normal}
.stat i{display:block;font-style:normal;font-size:14px;line-height:1.6;color:var(--mute)}
.stat:last-child:not(:first-child) b{color:var(--goldink)}
.bars{display:flex;flex-direction:column;gap:16px;margin:0}
.barrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px 12px;align-items:baseline;font-size:14.5px}
.barrow>span{grid-column:1;grid-row:1;color:var(--mute)}
.barrow>b{grid-column:2;grid-row:1;font-family:'Noto Serif KR',serif;font-size:16px;white-space:nowrap;font-variant-numeric:tabular-nums}
.barrow .t{grid-column:1/-1;grid-row:2;height:8px;border-radius:4px;background:var(--tint);overflow:hidden}
.barrow .t i{display:block;height:100%;border-radius:4px;background:var(--navy3)}
.barrow:first-child .t i{background:var(--ink)}
.co{margin:0;padding:18px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-family:'Noto Serif KR',serif;font-weight:500;font-size:17.5px;line-height:1.75;color:var(--ink)}
.co::before{content:"참고";display:block;margin-bottom:8px;font-family:'Noto Sans KR',system-ui,sans-serif;font-size:12.5px;font-weight:700;letter-spacing:.2em;color:var(--goldink)}
.co.key::before{content:"핵심"}
.co.warn::before{content:"유의하실 점";color:var(--warn)}
.co.memo,.co.stalebox{padding:12px 14px;border:none;border-radius:4px;font-family:inherit;font-weight:400;font-size:15px;line-height:1.7}
.co.memo{background:var(--tint)}
.co.stalebox{background:var(--warnbg);color:var(--warn)}
.co.memo::before,.co.stalebox::before{content:none}
.fig{font-weight:700;border-bottom:1px dotted var(--goldink);cursor:help;white-space:nowrap}
/* 화법 — 회원 전용. 본문(종이)과 구분되도록 남색 바탕 */
details.sp{margin:0;border-radius:4px;background:var(--navy);color:var(--ivory)}
details.sp>summary{list-style:none;min-height:56px;padding:12px 28px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 12px;cursor:pointer}
details.sp>summary::-webkit-details-marker{display:none}
.spt{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;font-family:'Noto Serif KR',serif;font-weight:700;font-size:18px}
.spk{font-family:'Noto Sans KR',system-ui,sans-serif;font-size:12.5px;font-weight:700;letter-spacing:.22em;color:var(--gold)}
details.sp>summary small{font-weight:400;color:var(--mist);font-size:13.5px}
.spb{padding:6px 28px 30px;border-top:1px solid var(--navy2);font-size:16px;line-height:1.85}
.spb h4{margin:22px 0 8px;font-size:13.5px;font-weight:700;color:var(--gold);letter-spacing:.08em}
.spb p{margin:0 0 6px;font-size:16px}
.spb ul{margin:0;padding-left:18px}
.spb .qa{border:1px solid var(--navy2);border-radius:4px;padding:14px 18px;margin:0 0 10px;color:var(--mist)}
.spb .qa b{display:block;margin-bottom:4px;color:var(--ivory)}
.spb .fig{border-bottom-color:var(--gold)}
.spb .spw{margin:18px 0 0;padding:10px 12px;border:1px solid var(--gold2);border-radius:4px;font-size:14.5px;line-height:1.7;color:var(--gold)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--goldink);border-radius:50%;animation:rot .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes rot{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.tail{padding:48px 64px 56px;font-size:14.5px;color:var(--mute);display:flex;flex-direction:column;gap:14px}
.tail h4{margin:0;font-size:12.5px;font-weight:700;letter-spacing:.22em;color:var(--goldink)}
.tail ul{margin:0 0 14px;padding:0;list-style:none;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:0 40px}
.tail li{padding:12px 0;border-bottom:1px solid var(--line);line-height:1.65}
.tail a{color:var(--goldink)}
.tailfoot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 16px;padding-top:18px;border-top:2px solid var(--ink);font-size:13px;letter-spacing:.08em}
.wrapbox{padding:44px 64px;border-bottom:1px solid var(--line);background:var(--tint)}
.wrapbox h3{margin:0 0 4px;font-family:'Noto Serif KR',serif;font-size:21px}
.wrapbox h4{margin:22px 0 8px;font-size:12.5px;font-weight:700;letter-spacing:.2em;color:var(--goldink)}
.wrapbox ul{margin:0;padding:0;list-style:none;border-top:1px solid var(--line);font-size:15.5px}
.wrapbox li{padding:11px 0;border-bottom:1px solid var(--line);line-height:1.7}
.wrapbox pre{margin:0;white-space:pre-wrap;font-family:inherit;font-size:15.5px;line-height:1.8;background:var(--paper2);border:1px solid var(--line);border-radius:4px;padding:16px 18px}
.docfoot{width:100%;max-width:960px;display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between}
.pop{position:fixed;z-index:65;max-width:min(320px,calc(100vw - 24px));background:var(--navy);color:var(--ivory);border:1px solid var(--navy3);border-radius:12px;padding:10px 12px;font-size:13.5px;line-height:1.55;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.pop b{color:var(--gold)}
.fixcta{display:none}
@media (max-width:640px){
 main{padding:26px 16px calc(110px + var(--sab));gap:20px}
 .top{padding-left:16px;padding-right:16px}
 .card{padding:16px}.side{padding:16px}.sheet{padding:18px}
 .dochead{padding:36px 22px 30px;gap:18px}
 section.sec{padding:34px 22px;gap:22px}
 .tail{padding:30px 22px 36px}.wrapbox{padding:30px 22px}
 .audit,.auditd{padding-left:22px;padding-right:22px}
 .answers li{gap:12px;font-size:16px}
 .kh .no{font-size:26px}.sec .lead{font-size:16px}.sec p,.sec ul.l li{font-size:16px}.co{font-size:16.5px}
 .stats{grid-auto-flow:row;grid-auto-columns:auto}
 .stat{padding:18px 0;border-left:none;border-top:1px solid var(--line)}.stat:first-child{border-top:none}
 details.sp>summary{padding:12px 18px}.spb{padding:4px 18px 24px}
 textarea.req{min-height:168px;font-size:16px}
 .card .cta.inline{display:none}
 .fixcta{display:block;position:fixed;left:0;right:0;bottom:0;z-index:20;padding:12px 16px calc(14px + var(--sab));background:var(--navy);border-top:1px solid var(--navy2)}
 .fixcta .cta{width:100%}
 /* 휴대폰: 표를 가로로 밀지 않도록 행마다 묶어 세로로 보여 준다 */
 .tw{overflow:visible}
 table{min-width:0;display:block}thead{display:none}tbody{display:block;border-top:2px solid var(--ink)}
 tr{display:block;padding:12px 0;border-bottom:1px solid var(--line)}
 tr.sum{border-bottom-color:var(--ink)}
 tr.hl{padding:12px;background:var(--tint);border-bottom-color:var(--ink)}
 td{display:block;padding:3px 0;border-bottom:none;background:transparent;text-align:left}

  if (e && e.name === 'AbortError') return '응답 시간이 초과되었습니다. 잠시 후 다시 시도해 주세요.';
  if (/failed to fetch|networkerror|load failed/i.test(raw)) return '네트워크 연결이 불안정합니다. 연결을 확인한 뒤 다시 시도해 주세요.';
  if (/AUTH_REQUIRED|TOKEN_INVALID|401/.test(code + raw)) return '로그인 연결이 필요합니다. 자비아(jarvia.co.kr)에 로그인한 뒤 AI 제안서를 다시 열어 주세요.';
  if (/\b429\b|rate.?limit|overload|\b529\b/i.test(raw)) return 'AI 사용량이 일시적으로 몰렸습니다. 잠시 후 다시 시도해 주세요.';
  return raw || '처리 중 오류가 발생했습니다.';
}

function addFiles(list) {
  const okType = { 'application/pdf': 1, 'image/jpeg': 1, 'image/png': 1 };
  let total = S.files.reduce((a, f) => a + f.size, 0); const msgs = [];
  Array.from(list || []).forEach((f) => {
    if (!okType[f.type]) { msgs.push(`${f.name}: PDF·JPG·PNG 파일만 첨부할 수 있습니다.`); return; }
    if (f.size > LIMITS.fileBytes) { msgs.push(`${f.name}: 파일 하나는 10MB 이하여야 합니다.`); return; }
    if (S.files.length >= LIMITS.files) { msgs.push('첨부는 최대 10개까지 가능합니다.'); return; }
    if (total + f.size > LIMITS.totalBytes) { msgs.push(`${f.name}: 첨부 전체는 20MB 이하여야 합니다.`); return; }
    total += f.size; S.files.push(f);
  });
  S.err = [...new Set(msgs)].join(' '); keepText(); render();
}
const readB64 = (f) => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1] || ''); r.onerror = () => rej(new Error('파일을 읽지 못했습니다: ' + f.name)); r.readAsDataURL(f); });

async function doPrepare() {

    const files = []; for (const f of S.files) files.push({ name: f.name, type: f.type, data: await readB64(f) });

ing", "title": "{{age_retire}}부터 {{age_pension_start}}까지 {{gap_years}}이 가장 빠듯한 구간입니다", "lead": "이 기간에는 국민연금 없이 생활비 전액을 모아 둔 돈에서 꺼내야 해서 {{need_gap}}이 더 필요합니다.", "blocks": [{"type": "p", "text": "월급은 {{age_retire}}에 끊기는데 국민연금은 {{age_pension_start}}부터 나옵니다. 그 사이 {{gap_years}} 동안은 매달 {{expense_at_retire}}을 전부 자산에서 꺼내 써야 합니다. 이때 더 필요한 {{need_gap}}은 앞의 부족분 계산에 이미 넣었으므로 따로 더하실 필요는 없습니다."}, {"type": "p", "text": "공백을 줄이려고 국민연금을 앞당겨 받는 방법도 있습니다. 다만 받는 시기에 따라 평생 받는 금액이 달라지므로 아래 세 가지를 견주어 보셔야 합니다."}, {"type": "table", "head": ["받는 시기", "월 수령액(오늘 가치)", "따져 볼 점"], "rows": [["5년 앞당겨 받기", "{{np_early_monthly}}", "{{np_early_cut}} 줄어든 금액을 평생 받습니다. 공백은 메워지지만 {{np_breakeven_early}} 이후로는 제때 받는 쪽이 유리합니다."], ["제때 받기", "{{pension_today}}", "{{age_pension_start}}부터 받습니다. 이 문서의 기준입니다."], ["5년 늦춰 받기", "{{np_delay_monthly}}", "{{np_delay_up}} 늘어난 금액을 평생 받습니다. {{np_breakeven_delay}} 이후로 유리해지지만 공백이 그만큼 길어집니다."]], "note": "유리해지는 나이는 받는 금액을 단순히 더해 비교한 대략의 값입니다."}, {"type": "p", "text": "보유하신 주택({{home_value}})은 마지막 안전판으로 볼 수 있습니다. 주택연금(집을 담보로 맡기고 그 집에 계속 살면서 매달 연금을 받는 제도)을 {{age_retire}}에 시작하면 월 {{housing_monthly_retire}} 안팎으로 추정되고, 이를 은퇴 시점의 목돈으로 바꾸면 {{housing_equivalent}} 수준입니다. 부족분보다 큰 금액이지만 집을 물려주는 계획과 맞바꾸는 선택이므로, 적립으로 먼저 메우고 예비 수단으로 남겨 두시는 편이 좋습니다."}, {"type": "callout", "tone": "warn", "text": "앞당겨 받기는 한 번 정하면 줄어든 금액이 평생 이어집니다. 오래 사실수록 손해가 커지는 선택이므로, 공백은 국민연금을 당기기보다 따로 모은 돈으로 건너는 쪽을 먼저 검토하시기 바랍니다."}]}, {"id": "s6", "kind": "options", "title": "부족분을 메우는 길은 세 가지이고, 섞어 쓸 수 있습니다", "lead": "적립을 올리는 길이 가장 직접적이고, 더 일하는 길이 효과가 가장 큽니다.", "blocks": [{"type": "table", "head": ["길", "좋은 점", "한계", "맞는 경우"], "rows": [["① 적립 올리기 — 매월 {{required_save}}", "지금 소득 안에서 바로 시작할 수 있습니다. 연금저축·IRP로 넣으면 세액공제도 늘어납니다.", "매달 쓸 수 있는 돈이 {{additional_save}} 줄어듭니다. {{years_to_retire}} 동안 빠짐없이 이어 가야 합니다.", "지금 생활비에 여유가 있고 계획대로 {{age_retire}}에 은퇴하고 싶은 경우"], ["② 더 일하기 — {{later2_age}}까지", "적립을 올리지 않아도 충족률이 {{later2_rate}}가 되어 부족이 없어집니다. 1년만 늦춰도 부족분이 {{later1_shortfall}}으로 줄어듭니다.", "건강과 일자리가 뒷받침되어야 합니다. 지금 미리 정해 둘 수 없는 길입니다.", "일을 계속할 뜻이 있고 정년 뒤에도 일할 길이 보이는 경우"], ["③ 주택연금 더하기", "적립을 늘리지 않고도 월 {{housing_monthly_retire}} 안팎(추정)의 평생 소득이 생깁니다.", "집을 담보로 맡기는 선택이라 상속 계획이 달라집니다. 금액은 가입할 때의 집값과 금리에 따라 달라집니다.", "집을 물려줄 계획이 없고 살던 집에서 계속 살고 싶은 경우"]], "note": ""}, {"type": "p", "text": "세 길은 내어 주는 것이 서로 다릅니다. ①은 지금의 소비를, ②는 은퇴 뒤의 시간을, ③은 집을 내어 주고 노후 자금을 얻습니다. 그래서 어느 길이 좋은지는 숫자보다 과장님이 무엇을 내어 줄 수 있는지에 달려 있습니다."}, {"type": "p", "text": "더 일하는 길의 효과를 은퇴 나이별로 보면 아래와 같습니다. 은퇴를 늦추면 적립하는 기간은 늘고 꺼내 쓰는 기간은 줄어서, 한 해의 효과가 생각보다 큽니다."}, {"type": "auto", "ref": "retireLaterTable"}, {"type": "callout", "tone": "key", "text": "권해 드리는 순서는 ①을 기본으로 하고, 형편이 달라지면 ②로 보완하고, ③은 예비로 남겨 두는 것입니다. ①은 오늘 정하면 다음 달부터 효과가 쌓이지만, ②와 ③은 그때가 되어야 정할 수 있기 때문입니다."}]}, {"id": "s7", "kind": "sensitivity", "title": "수익률과 물가 가정에 따라 부족분은 크게 달라집니다", "lead": "그래서 한 번 정하고 끝내지 않고 해마다 다시 확인해야 합니다.", "blocks": [{"type": "auto", "ref": "sensitivityTable"}, {"type": "p", "text": "표의 가운데 칸이 이 문서의 기준인 {{shortfall}}입니다. 같은 금액을 적립해도 수익률이 기준보다 낮거나 물가가 더 오르면 부족분이 커지고, 반대의 경우에는 부족이 없어지기도 합니다. 수익률과 물가는 누구도 미리 정할 수 없는 값이어서, 이 문서의 숫자는 약속이 아니라 지금 시점의 가장 그럴듯한 추정입니다."}, {"type": "p", "text": "그대로 두면 생기는 일은 모르는 사이에 벌어지는 차이입니다. 처음 몇 해의 작은 차이가 {{years_to_retire}} 동안 쌓이면 은퇴 직전에는 메우기 어려운 금액이 됩니다. 할 수 있는 일은 1년에 한 번 실제 수익률과 물가를 넣어 다시 계산하고, 벌어진 만큼 적립을 조정하는 것입니다."}, {"type": "callout", "tone": "warn", "text": "연 {{rate_accum}} 수익률은 가정입니다. 실제 수익률은 해마다 달라지고 원금 손실이 날 수도 있습니다. 투자 비중은 과장님이 감당할 수 있는 범위 안에서 정해야 합니다."}]}, {"id": "s8", "kind": "delay", "title": "시작을 1년 미루면 매월 {{delay1_increase}}을 더 내야 합니다", "lead": "같은 목표라도 늦게 시작할수록 매달의 부담이 커집니다.", "blocks": [{"type": "auto", "ref": "delayCostTable"}, {"type": "p", "text": "지금 시작하면 매월 {{required_save}}이면 되지만, 1년 뒤에 시작하면 {{delay1_required}}, 5년 뒤에는 {{delay5_required}}이 필요합니다. 미룬 기간만큼 돈이 불어날 시간이 사라지고, 같은 금액을 더 짧은 기간에 모아야 하기 때문입니다."}, {"type": "p", "text": "5년을 미루면 매월 부담이 지금 시작할 때보다 {{delay5_increase}} 늘어납니다. 지금 더 내야 하는 {{additional_save}}보다 훨씬 큰 금액입니다. 결정을 뒤로 미루는 것은 부담을 없애는 것이 아니라 더 큰 부담으로 바꾸는 일입니다."}, {"type": "callout", "tone": "key", "text": "미루는 것도 하나의 선택이고, 그 선택의 값이 위 표입니다. 금액을 다 올리기 어렵다면 올릴 수 있는 만큼만 먼저 시작하는 편이 기다리는 것보다 낫습니다."}]}, {"id": "s9", "kind": "action", "title": "이번 달 두 가지, 다음 미팅 전 두 가지면 계획이 시작됩니다", "lead": "이번 달에는 적립을 올려 연금 계좌에 먼저 넣고, 다음 미팅 전에는 국민연금 예상액과 퇴직연금 운용 내역을 확인합니다.", "blocks": [{"type": "table", "head": ["언제", "할 일", "이유"], "rows": [["이번 달", "매월 적립을 {{deposit_monthly}}에서 {{required_save}}으로 올리기(자동이체)", "부족분 {{shortfall}}을 메우는 기본 수단입니다."], ["이번 달", "늘리는 금액을 연금저축·IRP에 먼저 넣기", "연 세액공제 예상액이 {{tax_credit_now}}에서 {{tax_credit_added}}으로 늘어납니다(추정)."], ["다음 미팅 전", "국민연금공단에서 예상 연금액 다시 확인하기", "자료의 두 금액 가운데 어느 쪽이 맞는지에 따라 결과가 달라집니다."], ["다음 미팅 전", "퇴직연금 운용 내역 확인하기", "적립금 {{assets_retirement}}이 어떤 상품에 들어 있는지에 따라 수익률 가정이 달라집니다."], ["해마다 한 번", "실제 수익률과 물가로 다시 계산하기", "가정과 실제의 차이를 일찍 바로잡기 위해서입니다."]], "note": ""}, {"type": "p", "text": "연금저축과 IRP(개인형 퇴직연금)에 넣는 돈은 연말정산에서 세액공제를 받습니다. 지금 연 {{tax_contribution}}을 넣고 계셔서 한도에 여유가 있고, 추가 적립을 이쪽으로 넣으면 해마다 세금이 {{tax_credit_gain}} 더 줄어드는 것으로 추정됩니다. 같은 돈을 적립하고도 줄어드는 세금만큼 실제 부담이 가벼워집니다."}, {"type": "callout", "tone": "warn", "text": "세액공제는 내야 할 세금(결정세액)이 있을 때만 효과가 있습니다. 또 연금 계좌에 넣은 돈은 연금으로 받기 전에 중도에 찾으면 세금 부담이 생깁니다. 급하게 쓸 돈과는 따로 떼어 넣으셔야 합니다."}]}, {"id": "s10", "kind": "closing", "title": "오늘 확인한 세 가지와 정하실 한 가지", "lead": "부족분은 크지 않고, 지금 시작하면 가볍게 메울 수 있습니다.", "blocks": [{"type": "list", "items": ["지금 속도로는 필요한 돈의 {{sufficiency_rate}}까지 준비되고 {{shortfall}}이 모자랍니다.", "{{age_retire}}부터 {{gap_years}} 동안의 국민연금 공백은 이 계산에 이미 넣었습니다.", "시작을 1년만 미뤄도 매월 부담이 {{delay1_increase}} 늘어납니다."]}, {"type": "callout", "tone": "key", "text": "정하실 한 가지는 이번 달부터 매월 적립을 {{required_save}}으로 올릴지입니다. 부담스러우시면 올릴 수 있는 금액을 말씀해 주십시오. 그 금액에 맞춰 더 일하는 기간과 섞은 안을 다시 계산해 드리겠습니다."}, {"type": "p", "text": "이 자료는 알려 주신 내용과 가정을 바탕으로 한 시뮬레이션입니다. 실제 결과는 수익률과 물가, 제도 변화에 따라 달라질 수 있으므로 해마다 함께 점검하겠습니다."}]}], "tail": {"assumptions": {"type": "list", "items": ["기대수명: 90세 (입력에 없어 기본 가정 적용)", "은퇴 후 수익률: 3.5% (입력에 없어 기본 가정 적용)", "물가상승률: 2.5% (입력에 없어 기본 가정 적용)", "국민연금 개시 나이: 65세 (입력에 없어 기본 가정 적용)", "금액은 따로 표시하지 않으면 은퇴 시점 금액입니다. 오늘 가치인 경우 「오늘 가치」라고 적었습니다.", "기준 계산은 은퇴 후 생활비를 은퇴 시점 금액으로 고정한 값입니다. 은퇴 후 물가 상승을 반영한 값은 비교용으로 따로 표시했습니다.", "매월 적립은 은퇴할 때까지 빠짐없이 납입하고, 중간에 꺼내 쓰지 않는다고 가정했습니다.", "주택연금 금액은 한국주택금융공사 공개 예시를 바탕으로 한 추정치입니다. 실제 금액은 공사 계산기로 확인해야 합니다.", "세액공제는 결정세액 범위 안에서만 효과가 있습니다. 결정세액 확인 전 추정치입니다.", "이 자료는 의사결정을 돕는 참고용 시뮬레이션이며, 실제 결과는 달라질 수 있습니다."], "fixed": true}, "refs": {"type": "refs", "items": [{"kind": "law", "title": "소득세법 제59조의3 (연금계좌세액공제)", "docNo": "", "url": "https://www.law.go.kr/법령/소득세법/제59조의3", "summary": "연금저축과 퇴직연금 계좌에 넣은 금액의 일정 비율을 세금에서 빼 주는 근거 조문입니다."}, {"kind": "law", "title": "국민연금법 제61조 (노령연금 수급권자)", "docNo": "", "url": "https://www.law.go.kr/법령/국민연금법/제61조", "summary": "노령연금을 받는 나이와, 앞당겨 받는 조기노령연금의 근거 조문입니다."}, {"kind": "law", "title": "국민연금법 제62조 (지급의 연기에 따른 가산)", "docNo": "", "url": "https://www.law.go.kr/법령/국민연금법/제62조", "summary": "연금 받는 시기를 늦추면 금액을 더해 주는 근거 조문입니다."}]}}}, "figures": {"age_now": {"kind": "age", "value": 40, "text": "40세", "label": "현재 나이"}, "age_retire": {"kind": "age", "value": 60, "text": "60세", "label": "은퇴 나이"}, "age_life": {"kind": "age", "value": 90, "text": "90세", "label": "기대수명"}, "age_pension_start": {"kind": "age", "value": 65, "text": "65세", "label": "국민연금 개시 나이"}, "years_to_retire": {"kind": "years", "value": 20, "text": "20년", "label": "은퇴까지 남은 기간"}, "years_in_retire": {"kind": "years", "value": 30, "text": "30년", "label": "은퇴 후 기간"}, "gap_years": {"kind": "years", "value": 5, "text": "5년", "label": "국민연금 공백 기간"}, "year_retire": {"kind": "year", "value": 2046, "text": "2046년", "label": "은퇴하는 해"}, "rate_accum": {"kind": "pct", "value": 5, "text": "5%", "label": "적립 기간 수익률(가정)"}, "rate_receive": {"kind": "pct", "value": 3.5, "text": "3.5%", "label": "은퇴 후 수익률(가정)"}, "rate_inflation": {"kind": "pct", "value": 2.5, "text": "2.5%", "label": "물가상승률(가정)"}, "expense_today": {"kind": "won", "value": 3000000, "text": "300만 원", "label": "희망 월 생활비(오늘 가치)"}, "pension_today": {"kind": "won", "value": 1000000, "text": "100만 원", "label": "], ["준비 자금 합계", "{{prep_total}}", "충족률 {{sufficiency_rate}}"], ["부족분", "{{shortfall}}", "매월 {{required_save}} 적립이면 해소 (지금보다 {{additional_save}} 추가)"]]}, "sensitivityTable": {"type": "table", "head": ["적립 수익률 ＼ 물가", "2%", "2.5%", "3%"], "rows": [["연 4%", "1.39억 원", "2.15억 원", "2.99억 원"], ["연 5% (기준)", "3,491만 원", "1.11억 원", "1.95억 원"], ["연 6%", "부족 없음", "부족 없음", "7,064만 원"]], "note": "은퇴 후 수익률은 기준값으로 두고 적립 수익률과 물가만 바꾼 값입니다.", "fixed": true}, "delayCostTable": {"type": "table", "head": ["시작 시점", "필요한 매월 적립", "지금 시작보다"], "rows": [["지금", "{{required_save}}", "—"], ["1년 뒤", "{{delay1_required}}", "+{{delay1_increase}}"], ["3년 뒤", "{{delay3_required}}", "+{{delay3_increase}}"], ["5년 뒤", "{{delay5_required}}", "+{{delay5_increase}}"]]}, "retireLaterTable": {"type": "table", "head": ["은퇴 나이", "충족률", "부족분"], "rows": [["{{age_retire}} (기준)", "{{sufficiency_rate}}", "{{shortfall}}"], ["{{later1_age}}", "{{later1_rate}}", "{{later1_shortfall}}"], ["{{later2_age}}", "{{later2_rate}}", "부족 없음"], ["{{later3_age}}", "{{later3_rate}}", "부족 없음"]]}}, "audit": {"checks": [{"id": "structure", "label": "문서 구조", "ok": true, "items": []}, {"id": "numbers", "label": "숫자 일관성", "ok": true, "items": []}, {"id": "requests", "label": "요청 반영", "ok": true, "items": [{"request": 1, "text": "물가를 반영한 은퇴 부족 자금 산출", "section": "s4"}, {"request": 2, "text": "국민연금이 나오기 전 5년 대비", "section": "s5"}]}, {"id": "wording", "label": "표현 점검", "ok": true, "items": []}], "verify": {"ran": true, "fixed": [], "minor": []}, "warnings": []}, "meta": {"mode": "token", "baseDate": "2026-11-21"}, "speech": {"s1": {"reframe": "\"내 노후가 괜찮은가\"라는 막연한 걱정을 \"얼마가 모자라고 매달 얼마면 되는가\"라는 풀 수 있는 문제로 바꿔 드립니다.", "opening": "과장님, 오늘은 결론부터 보여 드리겠습니다. 화면 맨 위 문장을 보시면 지금 하고 계신 적립만 이어 가셔도 필요한 돈의 {{sufficiency_rate}}까지는 준비가 됩니다. \"지금 하는 걸로 되는 건지 모르겠다\"는 말씀을 많이들 하시는데, 과장님의 답은 \"거의 됩니다. 조금 모자랍니다\"입니다. 모자란 금액이 화면에 보이는 {{shortfall}}이고, 이걸 매달 금액으로 바꾸면 {{additional_save}}입니다. 오늘 한 시간은 이 숫자가 어떻게 나왔는지 같이 확인하고, 어떻게 메울지 정하는 시간으로 쓰겠습니다.", "numberTalk": "세 개의 숫자를 순서대로 읽어 드리겠습니다. 첫 번째 {{need_total}}은 과장님이 은퇴하실 때 손에 있어야 하는 돈이고, 두 번째 {{prep_total}}은 지금처럼만 하셔도 그때 모여 있을 돈입니다. 둘의 차이가 세 번째 {{shortfall}}입니다. 억 단위라 크게 느껴지시겠지만 한꺼번에 내는 돈이 아니고, 남은 {{years_to_retire}}에 걸쳐 매달 {{additional_save}}씩 더 넣으면 채워지는 금액입니다.", "insight": "제가 이 숫자를 먼저 보여 드리는 이유가 있습니다. 노후 준비가 어려운 건 돈이 없어서라기보다 얼마가 필요한지 몰라서인 경우가 많습니다. 목표가 안 보이면 많이 넣어도 불안하고, 적게 넣어도 그냥 넘어가게 됩니다. 과장님은 이미 세 가지 연금을 다 갖추고 계셔서 출발선이 앞에 있습니다. 오늘 숫자를 확인하시면 앞으로는 \"이만큼이면 된다\"는 기준을 가지고 지내실 수 있습니다.", "bridge": "그럼 이 숫자들이 과장님이 알려 주신 어떤 내용에서 나왔는지, 제가 제대로 받아 적었는지부터 확인하겠습니다.", "closing": "오늘은 \"부족분이 있고, 매달 금액으로 바꾸면 풀 수 있는 크기\"라는 점까지만 먼저 동의해 주시면 됩니다.", "questions": ["과장님, 이 결과를 보시고 처음 드는 생각이 어떠세요? 예상하신 것보다 나은 편인가요, 모자란 편인가요?", "매달 {{additional_save}}이라는 금액은 지금 생활에서 어느 정도의 무게로 느껴지시나요?"], "branches": [{"answer": "생각보다 괜찮네요.", "follow": "네, 그동안 꾸준히 해 오신 덕분입니다. 다만 이 결과는 몇 가지 가정을 놓고 계산한 것이어서, 가정이 바뀌면 어떻게 되는지도 뒤에서 같이 보시면 좋겠습니다. 좋은 숫자일수록 근거를 확인해 두셔야 마음 놓고 믿으실 수 있습니다."}, {"answer": "그래도 억 단위가 모자란다니 걱정이네요.", "follow": "그렇게 느끼시는 게 자연스럽습니다. 그런데 이 금액은 은퇴하는 해의 금액이라 오늘의 돈으로 느끼시는 것보다 실제 무게는 가볍습니다. 그리고 지금부터 나눠 준비하면 매달 {{additional_save}}으로 바뀝니다. 이 계산 과정을 뒤에서 하나씩 보여 드리겠습니다."}, {"answer": "지금도 빠듯한데 더 넣기는 어렵습니다.", "follow": "솔직하게 말씀해 주셔서 감사합니다. 적립을 올리는 것만이 방법은 아닙니다. 은퇴 시기를 조금 조정하는 길도 있고 섞는 방법도 있어서, 뒤에 세 가지 길을 비교해 두었습니다. 과장님 형편에 맞는 조합을 같이 찾아보겠습니다."}], "objections": [{"q": "이런 계산은 어차피 가정이잖아요. 믿을 수 있나요?", "a": "맞습니다, 가정입니다. 그래서 이 문서는 가정을 숨기지 않고 맨 뒤에 전부 적어 두었고, 가정이 틀렸을 때 숫자가 얼마나 달라지는지도 표로 넣었습니다. 정확한 예언이 아니라 방향을 잡는 지도라고 보시면 됩니다. 과장님은 지도 없이 가는 것과 대략의 지도라도 들고 가는 것 중에 어느 쪽이 낫다고 보세요?"}, {"q": "결국 뭘 더 가입하라는 얘기 아닌가요?", "a": "그렇게 들리실 수 있습니다. 오늘 문서에는 특정 상품 이름이 하나도 없습니다. 정하실 것은 상품이 아니라 매달 얼마를 노후 몫으로 떼어 둘지입니다. 그 금액이 정해지면 어디에 넣는 게 유리한지는 그다음 문제입니다. 금액부터 같이 보시겠어요?"}]}, "s2": {"reframe": "계산 결과를 믿으려면 들어간 재료가 맞아야 합니다. 이 단락은 \"제가 과장님 말씀을 정확히 받아 적었는지\" 확인받는 자리입니다.", "opening": "과장님, 이 표는 지난번에 말씀해 주신 내용을 제가 정리한 것입니다. 하나씩 읽어 드릴 테니 틀린 데가 있으면 바로 말씀해 주십시오. 지금 {{age_now}}이시고 {{age_retire}}에 은퇴를 생각하고 계시고, 은퇴 뒤에도 지금 돈으로 월 {{expense_today}} 정도의 생활을 원하신다고 하셨습니다. 가지고 계신 금융자산이 {{assets_financial}}, 퇴직연금에 {{assets_retirement}}이 쌓여 있고, 매달 {{deposit_monthly}}을 넣고 계십니다. 여기까지 맞으신가요?", "numberTalk": "여기서 꼭 짚어 드릴 숫자는 생활비입니다. 월 {{expense_today}}은 오늘의 물가로 말씀하신 금액입니다. 그런데 은퇴는 {{years_to_retire}} 뒤의 일이어서, 그때 같은 장바구니를 채우려면 더 많은 돈이 필요합니다. 그래서 이 문서의 금액은 대부분 은퇴하는 해의 금액으로 적었고, 오늘 가치일 때만 따로 표시해 두었습니다. 숫자가 갑자기 커 보이더라도 생활 수준이 달라진 것이 아니라 물가를 입힌 것이라고 이해하시면 됩니다.", "insight": "국민연금 예상액은 한 가지 말씀드릴 것이 있습니다. 주신 자료에 금액이 두 가지로 적혀 있어서, 저는 낮은 쪽으로 계산했습니다. 노후 계획은 모자라는 것보다 남는 쪽이 안전하기 때문입니다. 높은 쪽이 맞다면 오늘 보시는 부족분은 그만큼 줄어듭니다. 이 부분은 공단에서 다시 확인하시면 바로 정리됩니다. 이렇게 불확실한 값은 제가 임의로 좋게 잡지 않는다는 점을 기억해 주시면 좋겠습니다.", "bridge": "재료가 맞는지 확인했으니, 이제 이 재료로 과장님의 연금 세 층이 각각 어떤 상태인지 보겠습니다.", "closing": "\"이 표의 내용이 내 상황과 맞다\"는 확인을 받고 다음으로 넘어갑니다.", "questions": ["이 표에서 실제와 다른 항목이 있으신가요? 금액이 대략적이어도 괜찮습니다.", "여기에 적히지 않은 다른 연금이나 저축, 또는 앞으로 큰돈이 나갈 계획이 있으신가요?"], "branches": [{"answer": "다 맞습니다.", "follow": "확인해 주셔서 감사합니다. 그러면 이 내용을 바탕으로 계산한 결과를 믿고 보셔도 됩니다. 혹시 나중에라도 달라지는 것이 생기면 숫자만 바꿔 바로 다시 계산해 드릴 수 있습니다."}, {"answer": "생활비는 좀 더 필요할 것 같아요.", "follow": "좋은 말씀입니다. 생활비는 결과를 가장 크게 움직이는 값입니다. 오늘은 말씀하신 금액으로 끝까지 보시고, 미팅 뒤에 원하시는 금액으로 다시 계산한 결과를 따로 보내 드리겠습니다. 두 결과를 나란히 보시면 판단하기가 훨씬 쉽습니다."}, {"answer": "배우자 연금도 있는데요.", "follow": "중요한 정보입니다. 배우자분의 연금이 더해지면 가구 전체로는 준비 수준이 올라갑니다. 다음에 배우자분 예상액을 알려 주시면 두 분을 합친 계산으로 다시 정리해 드리겠습니다. 오늘은 과장님 기준으로 먼저 보시겠습니다."}], "objections": [{"q": "집이 있는데 그건 왜 자산에 안 넣었나요?", "a": "좋은 질문입니다. 사시는 집은 팔아서 생활비로 쓰기가 어려워서 준비 자금에서는 뺐습니다. 대신 집에 살면서 연금으로 받는 방법이 있어서 뒤에서 예비 수단으로 따로 다뤘습니다. 과장님은 집을 노후 자금으로 쓰는 것에 대해 어떻게 생각하고 계세요?"}, {"q": "퇴직금은 회사에서 알아서 주는 건데 굳이 넣어야 하나요?", "a": "그렇게 생각하시는 분이 많습니다. 그런데 퇴직연금은 과장님의 두 번째 연금이고, 받을 때 한꺼번에 찾느냐 나눠 받느냐에 따라 노후 소득이 달라집니다. 그래서 준비 자금에 넣어 함께 보는 것이 정확합니다. 지금 적립금이 어떤 상품으로 운용되고 있는지 확인해 보신 적 있으세요?"}]}, "s3": {"reframe": "\"연금이 세 개나 있으니 됐다\"는 생각을 \"세 개가 각각 얼마를 채우는지 봐야 한다\"로 바꿔 드립니다.", "opening": "과장님, 노후 소득은 보통 세 층으로 봅니다. 나라에서 주는 국민연금, 회사에서 쌓아 주는 퇴직연금, 그리고 과장님이 따로 모으는 개인연금과 저축입니다. 좋은 소식부터 말씀드리면 과장님은 세 층을 모두 갖추고 계십니다. 새로 만드실 것이 없다는 뜻이어서 출발이 좋습니다. 그런데 층이 있다는 것과 그 층이 충분하다는 것은 다른 이야기라서, 층마다 얼마를 채우는지 표로 정리했습니다.", "numberTalk": "첫 줄의 {{public_share}}라는 숫자를 봐 주십시오. 국민연금이 과장님이 원하시는 생활비 가운데 이만큼을 채운다는 뜻입니다. 뒤집어 말하면 나머지는 국민연금이 책임지지 않습니다. 그 나머지를 2층과 3층이 메워야 하는데, 지금 속도로 가면 은퇴 때 {{prep_total}}이 모이고 필요한 {{need_total}}에는 조금 못 미칩니다. 참고로 이 비율은 앞에서 본 {{sufficiency_rate}}와는 기준이 다른 숫자이니 섞어 보지 않으셔도 됩니다.", "insight": "국민연금은 금액이 크지 않아도 가치가 큰 연금입니다. 살아 계신 동안 계속 나오고 물가에 맞춰 금액이 조정되기 때문입니다. 그래서 국민연금을 바닥에 깔고, 그 위에 과장님이 모은 돈을 얹는 구조로 생각하시면 됩니다. 문제는 그 위에 얹을 돈입니다. 이 돈은 누가 대신 채워 주지 않고, 지금부터 은퇴까지 과장님이 얼마를 쌓느냐로 정해집니다. 다행히 모자란 정도가 크지 않아서 지금 손을 대면 가볍게 끝납니다.", "bridge": "그러면 필요한 돈과 준비되는 돈을 어떻게 계산했는지, 표로 한 줄씩 보여 드리겠습니다.", "closing": "\"층은 다 있고, 모자란 것은 3층의 속도\"라는 진단에 고개를 끄덕이시면 충분합니다.", "questions": ["국민연금이 생활비의 이 정도만 채운다는 점은 알고 계셨나요, 아니면 예상보다 적으신가요?", "세 층 가운데 과장님이 가장 든든하게 생각하시는 것은 어느 쪽이세요?"], "branches": [{"answer": "국민연금이 생각보다 적네요.", "follow": "많은 분이 그렇게 말씀하십니다. 국민연금은 처음부터 생활비 전부를 책임지도록 만들어진 제도가 아니어서 그렇습니다. 그래서 나머지를 어떻게 채우느냐가 노후 준비의 실제 내용입니다. 과장님은 이미 2층과 3층이 있으니 그 속도만 조정하시면 됩니다."}, {"answer": "퇴직연금이 있으니 든든합니다.", "follow": "네, 큰 자산입니다. 다만 퇴직연금은 받을 때 한꺼번에 찾아 다른 곳에 쓰시는 경우가 많습니다. 노후 소득으로 쓰려면 연금으로 나눠 받는 계획을 미리 세워 두시는 것이 좋습니다. 이 부분은 실행 단락에서 다시 말씀드리겠습니다."}], "objections": [{"q": "국민연금은 나중에 못 받는 것 아닌가요?", "a": "그런 걱정을 하시는 분이 많습니다. 제도가 바뀔 가능성은 저도 단정해 말씀드릴 수 없습니다. 그래서 이 계산은 국민연금을 낮은 쪽 금액으로 잡았고, 국민연금에 기대는 비중이 크지 않은 구조입니다. 불확실한 것에 덜 기대려면 결국 스스로 쌓는 몫을 키우는 것이 방법인데, 과장님 생각은 어떠세요?"}, {"q": "세 개 다 있는데 뭘 더 해야 하나요?", "a": "맞습니다, 새로 만드실 것은 없습니다. 제가 말씀드리는 것은 새 연금이 아니라 지금 하고 계신 3층의 금액을 조금 올리는 것입니다. 층을 늘리는 것이 아니라 속도를 올리는 일입니다. 그 \"조금\"이 얼마인지 다음 장에서 계산으로 보여 드려도 될까요?"}]}, "s4": {"reframe": "부족분이라는 결과만 보여 드리는 것이 아니라, 과장님이 직접 계산을 따라가 보고 \"내 숫자\"로 받아들이시게 합니다.", "opening": "과장님, 이 장이 오늘 문서의 중심입니다. 조금 천천히 보겠습니다. 계산은 세 줄입니다. 필요한 돈에서 준비되는 돈을 빼면 모자란 돈이 나옵니다. 표의 위쪽이 필요한 돈이고 아래쪽이 준비되는 돈입니다. 먼저 필요한 돈부터 보시면, 지금 월 {{expense_today}}으로 하시는 생활을 은퇴하는 해에 그대로 하려면 월 {{expense_at_retire}}이 듭니다. 물가 때문입니다. 여기서 국민연금을 빼고 남는 금액을 은퇴 뒤 내내 꺼내 쓴다고 보고 계산했습니다.", "numberTalk": "막대 세 개를 봐 주십시오. 가장 긴 것이 필요한 {{need_total}}, 그다음이 준비되는 {{prep_total}}, 짧은 것이 모자란 {{shortfall}}입니다. 준비되는 돈 가운데 {{prep_assets}}은 지금 가지고 계신 자산이 불어난 것이고, {{prep_deposits}}은 앞으로 매달 넣으실 돈이 자란 것입니다. 이미 가진 돈이 만드는 몫이 더 큰 것이 보이시죠. 일찍 넣어 둔 돈이 일을 많이 한다는 뜻입니다. 그리고 모자란 금액은 매달 {{additional_save}}으로 바꿔 생각하시면 됩니다.", "insight": "제가 불리한 숫자도 하나 적어 두었습니다. 아래 주의 상자를 보시면, 은퇴 뒤에도 물가가 계속 오른다고 보면 부족분이 {{alt_inflate_shortfall}}까지 커집니다. 기준 계산은 은퇴 뒤 생활비를 고정한 값이라 낙관적인 쪽에 가깝습니다. 좋은 숫자만 보여 드리고 넘어가면 나중에 과장님이 곤란해지십니다. 두 숫자 사이 어디쯤이 실제가 될 것이고, 그래서 해마다 다시 확인하자고 말씀드리는 것입니다.", "bridge": "부족분 안에는 조금 특별한 구간이 하나 들어 있습니다. 월급도 국민연금도 없는 몇 해인데, 그 이야기를 이어서 드리겠습니다.", "closing": "\"필요에서 준비를 빼면 이만큼이 모자란다\"는 계산 자체에 동의를 받습니다.", "questions": ["계산 과정에서 이해가 안 되거나 납득이 안 되는 줄이 있으셨나요?", "과장님은 은퇴 뒤에 생활비가 지금 수준으로 유지될 것 같으세요, 줄어들 것 같으세요?"], "branches": [{"answer": "은퇴하면 생활비는 줄지 않나요?", "follow": "그렇게 보시는 분이 많고, 실제로 교육비나 대출 상환은 줄어드는 경우가 많습니다. 반대로 의료비와 여가비는 늘어나는 편입니다. 그래서 오늘은 말씀하신 금액 그대로 계산했습니다. 줄어든 금액으로 보고 싶으시면 그 금액으로도 계산해서 비교해 드리겠습니다."}, {"answer": "수익률 가정이 너무 높은 것 아닌가요?", "follow": "날카로운 지적이십니다. 가정한 수익률은 약속이 아니고 해마다 달라집니다. 그래서 수익률이 더 낮을 때 부족분이 얼마가 되는지를 뒤의 표에 넣어 두었습니다. 그 표를 보시고 과장님이 편하게 느끼시는 가정으로 다시 잡아도 됩니다."}, {"answer": "계산은 이해했습니다.", "follow": "감사합니다. 그러면 이 부족분을 기준으로 이야기를 이어 가겠습니다. 기억하실 것은 하나입니다. 큰 금액처럼 보여도 남은 기간이 길어서 매달의 금액으로는 감당할 수 있는 크기라는 점입니다."}], "objections": [{"q": "물가가 그렇게까지 오를까요?", "a": "앞으로의 물가는 저도 알 수 없습니다. 다만 과장님이 사회생활을 시작하셨을 때의 점심값과 지금을 떠올려 보시면 긴 기간의 물가가 어떤 것인지 느낌이 오실 겁니다. 물가를 넣지 않으면 계산은 편해지지만 은퇴 뒤에 모자라게 됩니다. 넉넉하게 잡는 쪽과 빠듯하게 잡는 쪽 중에 어느 쪽이 마음이 편하세요?"}, {"q": "{{age_life}}까지 산다는 법도 없는데 너무 길게 잡은 것 아닌가요?", "a": "그렇게 생각하실 수 있습니다. 그런데 노후 자금에서 곤란한 경우는 일찍 떠나는 경우가 아니라 돈보다 오래 사는 경우입니다. 길게 잡았다가 남으면 가족에게 남기면 되지만, 짧게 잡았다가 모자라면 방법이 없습니다. 그래서 길게 잡는 것이 안전한데, 과장님 집안 어른들은 어떠셨어요?"}]}, "s5": {"reframe": "\"연금은 나오는 대로 받으면 된다\"는 생각을 \"언제부터 받느냐가 평생 금액을 정한다\"로 바꿔 드립니다.", "opening": "과장님, 은퇴 계획에서 사람들이 가장 자주 놓치는 구간이 여기입니다. 월급은 {{age_retire}}에 끊기는데 국민연금은 {{age_pension_start}}부터 나옵니다. 그 사이 {{gap_years}}은 들어오는 돈이 없는 기간입니다. 이 기간에는 생활비 전부를 모아 둔 돈에서 꺼내 써야 해서 자산이 가장 빨리 줄어듭니다. 앞에서 본 부족분에는 이 기간의 몫이 이미 들어 있으니 금액을 따로 더하실 필요는 없습니다. 다만 어떻게 건널지는 미리 정해 두셔야 합니다.", "numberTalk": "표의 세 줄은 국민연금을 언제 받느냐에 따라 금액이 어떻게 달라지는지 보여 줍니다. 앞당겨 받으면 월 {{np_early_monthly}}, 제때 받으면 {{pension_today}}, 늦춰 받으면 {{np_delay_monthly}}입니다. 중요한 것은 이 차이가 평생 이어진다는 점입니다. 앞당기면 {{np_early_cut}} 줄어든 금액을 돌아가실 때까지 받습니다. 대략 {{np_breakeven_early}}를 넘겨 사시면 제때 받는 쪽이 더 많이 받게 됩니다.", "insight": "공백이 걱정되면 국민연금을 당겨 받고 싶은 마음이 드는 것이 당연합니다. 그런데 당겨 받는 것은 당장의 공백을 메우는 대신 평생의 금액을 줄이는 선택입니다. 한 번 정하면 되돌리기 어렵습니다. 그래서 저는 공백은 따로 모은 돈으로 건너고, 국민연금은 제때 받는 것을 기본으로 생각하시라고 말씀드립니다. 집도 마찬가지입니다. 주택연금이라는 방법이 있지만 물려주실 계획과 맞바꾸는 일이어서 예비로 남겨 두는 편이 좋습니다.", "bridge": "공백까지 포함해서 모자란 금액을 확인했으니, 이제 그 금액을 메우는 세 가지 길을 비교해 보겠습니다.", "closing": "\"공백은 국민연금을 당기지 않고 모은 돈으로 건넌다\"는 기본 방향에 동의를 받습니다.", "questions": ["과장님은 {{age_retire}} 이후에도 얼마 동안은 일을 하실 생각이 있으신가요?", "사시는 집은 물려주실 계획이신가요, 노후 자금으로 쓰실 수도 있다고 보시나요?"], "branches": [{"answer": "은퇴 뒤에도 조금은 일할 것 같아요.", "follow": "그렇다면 공백의 부담이 크게 줄어듭니다. 그 기간에 생활비의 일부만 벌어도 자산을 꺼내 쓰는 속도가 느려지기 때문입니다. 뒤의 대안 비교에 은퇴를 늦추는 길의 효과를 숫자로 넣어 두었으니 같이 보시겠습니다."}, {"answer": "집은 물려주고 싶습니다.", "follow": "네, 그렇게 생각하시는 분이 많습니다. 그러면 주택연금은 계획에서 빼고, 적립과 은퇴 시기 조정으로 메우는 쪽으로 보시면 됩니다. 집은 만약의 경우를 위한 마지막 수단으로만 기억해 두시면 됩니다."}, {"answer": "그럼 국민연금을 늦춰 받는 게 좋은 건가요?", "follow": "오래 사실수록 유리한 것은 맞습니다. 다만 늦추는 동안은 공백이 더 길어지므로 그 기간을 버틸 돈이 따로 있어야 합니다. 지금 정하실 일은 아니고, 은퇴가 가까워졌을 때 건강과 자산 상태를 보고 정하시면 됩니다."}], "objections": [{"q": "일찍 받는 게 이득 아닌가요? 언제까지 살지 모르는데요.", "a": "그렇게 보시는 것도 일리가 있습니다. 다만 일찍 받아서 이득인 경우는 일찍 떠나시는 경우이고, 그때는 돈이 모자랄 일이 없습니다. 반대로 오래 사시는 경우에 줄어든 연금으로 버텨야 하는 것이 위험입니다. 노후 자금은 오래 사는 쪽에 맞춰 준비하는 것이 안전한데, 과장님은 어느 쪽 위험이 더 걱정되세요?"}, {"q": "주택연금은 집을 뺏기는 것 아닌가요?", "a": "그렇게 알고 계신 분이 많습니다. 집에 계속 사시면서 연금을 받는 제도이고, 세부 조건은 가입 시점에 공사에서 확인하셔야 합니다. 그리고 이 금액은 추정치입니다. 오늘은 권해 드리는 것이 아니라 이런 예비 수단이 있다는 것만 알려 드리는 것입니다. 지금은 계획에서 빼고 보시겠어요?"}]}, "s6": {"reframe": "\"더 넣으라는 말이구나\"로 듣지 않고 \"세 가지 가운데 내가 고른다\"로 받아들이시게 합니다.", "opening": "과장님, 모자란 금액을 메우는 길을 세 가지로 정리했습니다. 제가 하나를 정해 드리는 것이 아니라 과장님이 고르시도록 나란히 놓았습니다. 첫째는 매달 적립을 올리는 길, 둘째는 은퇴를 조금 늦추는 길, 셋째는 집을 연금으로 쓰는 길입니다. 표는 길마다 좋은 점과 한계, 그리고 어떤 분께 맞는지를 적은 것입니다. 한계부터 읽어 보시는 것도 좋습니다. 세 길은 내어 주는 것이 서로 다르기 때문입니다.", "numberTalk": "첫째 길의 숫자는 매월 {{required_save}}입니다. 지금보다 {{additional_save}}을 더 넣는 것입니다. 둘째 길은 아래 작은 표를 봐 주십시오. 은퇴를 {{later1_age}}로 한 해만 늦춰도 부족분이 {{later1_shortfall}}으로 줄고, {{later2_age}}까지 일하시면 부족이 없어집니다. 한 해를 더 일하면 넣는 기간은 한 해 늘고 꺼내 쓰는 기간은 한 해 줄어서 효과가 양쪽에서 생깁니다. 셋째 길의 주택연금 금액은 추정치라는 점을 함께 말씀드립니다.", "insight": "어느 길이 좋으냐는 숫자로만 정해지지 않습니다. 첫째 길은 지금의 씀씀이를, 둘째 길은 은퇴 뒤의 시간을, 셋째 길은 집을 내어 주는 선택입니다. 무엇이 과장님께 덜 아까운지에 따라 답이 달라집니다. 제가 첫째 길을 기본으로 권해 드리는 이유는 하나입니다. 오늘 정하면 다음 달부터 효과가 쌓이는 길은 이것뿐이기 때문입니다. 나머지 두 길은 그때가 되어야 정할 수 있어서, 지금은 보완책으로 알아 두시면 됩니다.", "bridge": "어느 길을 고르시든 이 숫자들은 가정 위에 서 있습니다. 가정이 달라지면 얼마나 움직이는지 보겠습니다.", "closing": "\"기본은 적립을 올리는 것이고, 나머지 둘은 보완책\"이라는 순서에 동의를 받습니다.", "questions": ["세 가지 가운데 과장님 마음이 먼저 가는 길은 어느 쪽인가요?", "지금 생활에서 매달 줄일 수 있는 지출이 있다면 어느 정도일까요?"], "branches": [{"answer": "적립을 올리는 게 낫겠네요.", "follow": "네, 가장 직접적인 길입니다. 올리실 금액 전부를 한 번에 시작하기 부담스러우시면 절반부터 시작하고 내년에 나머지를 올리는 방법도 있습니다. 중요한 것은 금액보다 이번 달에 시작하는 것입니다. 어느 계좌로 넣는 것이 유리한지는 실행 단락에서 말씀드리겠습니다."}, {"answer": "저는 어차피 더 일할 생각입니다.", "follow": "그러시다면 마음이 한결 편하실 겁니다. 다만 그때의 건강과 일자리는 지금 정할 수 없는 일입니다. 그래서 적립을 조금만 올려 두고, 더 일하게 되면 그만큼 여유가 생기는 구조로 가시면 좋습니다. 계획이 틀어졌을 때 버틸 자리가 생깁니다."}, {"answer": "잘 모르겠어요. 생각해 볼게요.", "follow": "당연합니다. 오늘 꼭 정하실 필요는 없습니다. 다만 다음 장에 결정을 미룰 때 달라지는 금액을 정리해 두었으니 그것까지만 보시고 생각해 보시면 좋겠습니다. 판단에 필요한 숫자를 다 보신 뒤에 정하시는 것이 맞습니다."}], "objections": [{"q": "매달 더 넣는 건 솔직히 부담됩니다.", "a": "충분히 그러실 수 있습니다. 지금 생활이 먼저이니까요. 그래서 금액을 정해진 숫자로 생각하지 않으셔도 됩니다. 올릴 수 있는 금액을 말씀해 주시면, 그 금액에 은퇴 시기를 얼마나 조정하면 되는지 다시 계산해 드릴 수 있습니다. 편하게 낼 수 있는 금액이 어느 정도이실까요?"}, {"q": "정년이 있는데 더 일하는 게 가능한가요?", "a": "맞습니다, 그래서 둘째 길을 기본으로 삼기 어렵다고 적어 두었습니다. 같은 직장이 아니어도 소득이 조금이라도 이어지면 효과는 비슷합니다. 다만 될지 안 될지 모르는 일에 계획 전체를 걸 수는 없으니 보완책으로만 두시는 것이 좋습니다. 은퇴 뒤에 해 보고 싶은 일이 있으세요?"}, {"q": "주택연금으로 다 해결되는 것 아닌가요?", "a": "금액만 보면 그렇게 보입니다. 다만 추정치이고, 집값과 금리에 따라 달라지며, 물려주실 계획과 맞바꾸는 선택입니다. 그래서 처음부터 기대는 것보다 마지막에 남겨 두는 카드로 보시는 편이 안전합니다. 집에 대해서는 가족과 이야기해 보신 적이 있으세요?"}]}, "s7": {"reframe": "숫자를 약속으로 받아들이지 않고 \"해마다 점검하는 기준\"으로 받아들이시게 합니다.", "opening": "과장님, 이 장은 제가 일부러 넣은 장입니다. 오늘 보신 숫자는 수익률과 물가를 가정해서 나온 것인데, 이 두 가지는 누구도 맞힐 수 없습니다. 그래서 가정이 조금씩 달라지면 부족분이 어떻게 변하는지 표로 만들었습니다. 수익률 세 가지와 물가 세 가지를 짝지은 것입니다. 한가운데 값이 오늘 기준으로 삼은 {{shortfall}}입니다. 수익률이 낮거나 물가가 높은 쪽이 불리한 경우이고, 그 반대가 유리한 경우입니다.", "numberTalk": "표에서 보실 것은 칸마다의 금액보다 금액이 움직이는 폭입니다. 가운데에서 한 칸만 옮겨도 부족분이 꽤 달라지고, 유리한 쪽에서는 부족이 없다고 나오는 칸도 있습니다. 같은 돈을 넣어도 결과가 이만큼 달라질 수 있다는 뜻입니다. 그래서 매달 {{required_save}}이라는 숫자는 정답이 아니라 지금 시점에서 가장 그럴듯한 출발점입니다.", "insight": "이 표를 보여 드리면 \"그럼 계획이 무슨 소용이냐\"고 물으시는 분도 계십니다. 저는 반대로 생각합니다. 결과가 흔들릴 수 있다는 것을 알기 때문에 점검이 필요한 것입니다. 한 번 정하고 잊어버리면 차이가 조금씩 쌓여서 은퇴 직전에야 알게 됩니다. 1년에 한 번 실제 수익률과 물가를 넣어 다시 계산하면 벌어진 만큼만 조금 고치면 됩니다. 수익률은 해마다 다르고 손실이 나는 해도 있다는 점도 숨기지 않고 말씀드립니다.", "bridge": "가정은 우리가 정할 수 없지만, 언제 시작하느냐는 정할 수 있습니다. 그 차이를 숫자로 보겠습니다.", "closing": "\"숫자는 약속이 아니라 기준이고, 1년에 한 번 다시 본다\"는 데 동의를 받습니다.", "questions": ["과장님은 투자에서 손실이 나는 해가 있어도 길게 가져가실 수 있는 편이신가요?", "1년에 한 번 이 계산을 다시 해 보는 것에 대해서는 어떻게 생각하세요?"], "branches": [{"answer": "손실 나는 건 싫습니다.", "follow": "그 마음을 존중합니다. 그러면 기대 수익률을 낮게 잡고 계획을 세우는 것이 맞습니다. 그 경우 필요한 적립은 조금 더 커지지만 마음이 편한 계획이 오래갑니다. 낮은 수익률로 다시 계산한 결과를 미팅 뒤에 보내 드리겠습니다."}, {"answer": "길게 보면 괜찮다고 생각합니다.", "follow": "긴 기간을 보시는 것은 좋은 태도입니다. 다만 은퇴가 가까워질수록 손실을 만회할 시간이 줄어든다는 점은 기억해 주십시오. 그래서 시간이 지나면서 위험을 조금씩 줄여 가는 것이 일반적입니다. 이 부분도 해마다 점검할 때 함께 보겠습니다."}], "objections": [{"q": "이렇게 달라질 수 있으면 계산이 의미가 있나요?", "a": "그렇게 느끼실 수 있습니다. 그런데 일기예보가 틀릴 수 있다고 해서 우산을 준비하지 않는 사람은 없습니다. 이 표는 틀릴 수 있는 범위를 미리 보여 드리는 것이고, 그 범위를 알면 대비할 수 있습니다. 가장 불리한 칸을 보셨을 때 과장님이 감당할 수 있는 수준인지 여쭤봐도 될까요?"}, {"q": "그냥 안전하게 예금만 하면 안 되나요?", "a": "안전을 중요하게 보시는 것은 당연합니다. 다만 수익률이 물가보다 낮으면 돈의 실제 가치가 줄어드는 위험이 있습니다. 표에서 수익률이 낮은 줄을 보시면 부족분이 커지는 것이 그 때문입니다. 안전과 수익 사이에서 과장님께 맞는 지점을 찾는 것이 중요한데, 지금 자산은 주로 어디에 두고 계세요?"}]}, "s8": {"reframe": "\"나중에 여유가 생기면 시작하자\"를 \"미루는 데에도 값이 있다\"로 바꿔 드립니다.", "opening": "과장님, 마지막으로 보실 표입니다. 같은 목표를 놓고 시작하는 시점만 바꿔 본 것입니다. 지금 시작하면 매월 {{required_save}}이면 됩니다. 1년 뒤에 시작하면 {{delay1_required}}, 5년 뒤에 시작하면 {{delay5_required}}이 필요합니다. 목표 금액은 그대로인데 매달 내야 하는 돈이 달라집니다. 이 차이는 누가 더 가져가는 돈이 아니라, 미룬 기간 동안 불어나지 못한 시간의 값입니다.", "numberTalk": "「지금 시작보다」 칸을 봐 주십시오. 1년을 미루면 매달 {{delay1_increase}}이 늘고, 5년을 미루면 {{delay5_increase}}이 늘어납니다. 지금 더 내셔야 하는 금액이 {{additional_save}}인데, 5년 뒤에는 그보다 훨씬 큰 금액을 더 내야 같은 자리에 도착합니다. 미루면 부담이 사라지는 것이 아니라 나중의 과장님께 더 큰 금액으로 넘어가는 것입니다.", "insight": "저도 \"지금은 여유가 없으니 조금 있다가\"라는 말씀을 자주 듣습니다. 그 마음을 압니다. 그런데 몇 년 뒤에 여유가 생기는 경우보다 다른 지출이 그 자리를 채우는 경우가 더 많습니다. 그래서 전부가 아니어도 됩니다. 올릴 수 있는 만큼만 먼저 시작하시면, 나머지는 형편이 나아질 때 올리셔도 늦지 않습니다. 시작한 돈은 그날부터 불어나기 시작합니다.", "bridge": "그러면 시작하신다면 이번 달에 구체적으로 무엇을 하시면 되는지 정리해 드리겠습니다.", "closing": "\"기다리는 것보다 할 수 있는 만큼 먼저 시작하는 편이 낫다\"는 데 동의를 받습니다.", "questions": ["과장님께서 적립을 미루게 되는 가장 큰 이유가 있다면 무엇일까요?", "전부가 아니라면, 이번 달부터 시작할 수 있는 금액은 어느 정도일까요?"], "branches": [{"answer": "지금은 나가는 돈이 많아서 어렵습니다.", "follow": "그런 시기에는 정말 빠듯하시지요. 큰 지출이 끝나는 때가 언제쯤인지 알려 주시면, 그때까지는 작은 금액으로 가고 그 뒤에 올리는 계획으로 다시 짜 드리겠습니다. 멈추지 않고 이어 가는 것이 금액보다 중요합니다."}, {"answer": "그럼 지금 시작해야겠네요.", "follow": "좋은 결정이십니다. 그러면 다음 장에서 이번 달에 하실 일을 순서대로 정리해 두었으니 같이 보시겠습니다. 자동이체로 걸어 두시면 신경 쓰지 않아도 이어집니다."}], "objections": [{"q": "몇 년 뒤에 월급이 오르면 그때 더 넣으면 되지 않나요?", "a": "그렇게 생각하시는 것도 자연스럽습니다. 월급이 오르면 그때 더 넣으시는 것은 저도 권해 드립니다. 다만 그때 넣을 돈과 지금 넣을 돈은 불어나는 기간이 다릅니다. 지금 조금 시작하고 월급이 오를 때 올리는 것과, 그때까지 기다리는 것 가운데 어느 쪽이 부담이 덜할 것 같으세요?"}, {"q": "불안하게 만들려고 이런 표를 보여 주는 것 아닌가요?", "a": "그렇게 보이셨다면 죄송합니다. 겁을 드리려는 것이 아니라 결정을 미루는 것에도 값이 있다는 사실을 숨기지 않으려는 것입니다. 미루기로 하셔도 그것은 과장님의 선택이고, 저는 그 값을 알고 고르시기를 바랄 뿐입니다. 이 표를 빼고 판단하시는 편이 더 낫다고 보세요?"}]}, "s9": {"reframe": "\"해야겠다\"는 생각을 \"이번 달에 이것부터 한다\"는 행동으로 바꿔 드립니다.", "opening": "과장님, 여기부터는 실제로 하실 일입니다. 표의 위에서부터 차례대로 하시면 됩니다. 이번 달에 하실 일은 두 가지입니다. 매달 적립을 {{deposit_monthly}}에서 {{required_save}}으로 올리는 것, 그리고 늘리는 금액을 연금저축이나 IRP에 먼저 넣는 것입니다. 다음 미팅 전까지는 국민연금 예상액과 퇴직연금 운용 내역을 확인해 주시면 됩니다. 그리고 1년에 한 번 저와 다시 계산하는 것까지가 전체 계획입니다.", "numberTalk": "늘리는 금액을 연금 계좌에 먼저 넣으시라고 한 이유가 숫자에 있습니다. 지금 연 {{tax_contribution}}을 넣고 계셔서 세액공제를 받을 수 있는 한도에 여유가 있습니다. 추가 적립을 이쪽으로 넣으면 연말정산에서 돌려받는 세금이 한 해 {{tax_credit_gain}} 정도 늘어나는 것으로 추정됩니다. 같은 돈을 적립하면서 세금이 줄어드는 만큼 실제 부담이 가벼워지는 것입니다.", "insight": "다만 두 가지는 꼭 알고 시작하셔야 합니다. 첫째, 세액공제는 내야 할 세금이 있을 때만 효과가 있어서 실제 금액은 연말정산 내용에 따라 달라집니다. 둘째, 연금 계좌에 넣은 돈은 연금으로 받기 전에 중간에 찾으면 세금 부담이 생깁니다. 그래서 갑자기 쓸 일이 생길 수 있는 돈은 여기에 넣으시면 안 됩니다. 비상금은 따로 두시고, 은퇴까지 건드리지 않을 돈만 넣으시는 것이 원칙입니다.", "bridge": "할 일까지 정리했으니, 오늘 이야기를 세 줄로 줄이고 과장님이 정하실 한 가지만 남기겠습니다.", "closing": "이번 달 적립 증액과 다음 미팅 전 확인 두 가지에 대해 \"해 보겠다\"는 답을 받습니다.", "questions": ["비상시에 쓰실 돈은 따로 마련되어 있으신가요?", "국민연금 예상액과 퇴직연금 내역은 언제쯤 확인이 가능하실까요?"], "branches": [{"answer": "비상금은 따로 없습니다.", "follow": "그러면 순서를 조금 바꾸는 것이 좋겠습니다. 몇 달 치 생활비를 먼저 비상금으로 떼어 두시고, 그다음에 연금 계좌 적립을 올리시는 것이 안전합니다. 급한 일이 생겼을 때 연금 계좌를 깨면 세금으로 손해를 보실 수 있기 때문입니다."}, {"answer": "연금 계좌는 이미 있습니다.", "follow": "잘하고 계십니다. 그러면 새로 만드실 것 없이 지금 계좌의 납입 금액만 올리시면 됩니다. 자동이체 금액을 바꾸는 방법은 이용하시는 금융회사 앱에서 바로 가능하니, 원하시면 지금 같이 확인해 드리겠습니다."}, {"answer": "확인하는 방법을 모르겠어요.", "follow": "어렵지 않습니다. 국민연금은 공단 누리집이나 앱의 예상 연금액 조회에서 보실 수 있고, 퇴직연금은 가입하신 금융회사 앱에 내역이 있습니다. 미팅 뒤에 확인하는 순서를 문자로 정리해 보내 드리겠습니다."}], "objections": [{"q": "중간에 못 찾는 돈이면 불안한데요.", "a": "그 걱정이 맞습니다. 그래서 비상금을 먼저 떼어 두시라고 말씀드린 것입니다. 연금 계좌는 묶여 있다는 것이 단점이면서, 은퇴 전에 다른 곳에 써 버리지 않게 해 주는 장점이기도 합니다. 묶이는 돈과 자유로운 돈의 비율을 어느 정도로 가져가시면 마음이 편하실까요?"}, {"q": "세금 돌려받는 건 나중에 다 토해 낸다던데요.", "a": "그런 이야기를 들으셨을 수 있습니다. 연금으로 받을 때 세금을 내는 것은 사실입니다. 다만 지금 돌려받는 금액과 나중에 내는 금액은 세율이 다르고, 과장님의 연말정산 내용에 따라 결과가 달라집니다. 정확한 금액은 제가 단정해 드릴 수 없으니, 올해 연말정산 자료로 함께 확인해 보시겠어요?"}]}, "s10": {"reframe": "긴 설명을 \"세 가지 사실과 한 가지 결정\"으로 줄여, 미팅이 끝난 뒤에도 기억에 남게 합니다.", "opening": "과장님, 오늘 긴 이야기를 들어 주셔서 감사합니다. 마지막으로 세 줄로 줄여 드리겠습니다. 하나, 지금 속도로는 필요한 돈의 {{sufficiency_rate}}까지 준비되고 {{shortfall}}이 모자랍니다. 둘, 국민연금이 나오기 전 {{gap_years}}의 공백은 이 계산에 이미 들어 있습니다. 셋, 시작을 1년만 미뤄도 매달 부담이 {{delay1_increase}} 늘어납니다. 이 세 가지만 기억하고 가셔도 오늘 미팅은 충분합니다.", "numberTalk": "정하실 것은 한 가지입니다. 이번 달부터 매달 적립을 {{required_save}}으로 올릴지입니다. 지금보다 {{additional_save}}이 더 들어가는 금액입니다. 이 금액이 부담되시면 그대로 따르실 필요가 없습니다. 올릴 수 있는 금액을 말씀해 주시면, 그 금액으로는 은퇴 시기를 얼마나 조정하면 되는지 제가 다시 계산해 드리겠습니다.", "insight": "오늘 드린 자료는 약속이 아니라 지금 시점의 추정이라는 점을 다시 말씀드립니다. 수익률과 물가, 제도가 바뀌면 숫자도 바뀝니다. 그래서 한 번의 계획으로 끝내지 않고 해마다 같이 점검하겠다고 말씀드리는 것입니다. 저는 과장님이 은퇴하시는 날까지 이 숫자가 맞게 가고 있는지 확인해 드리는 역할을 하겠습니다. 오늘 정하지 못하셔도 괜찮습니다. 집에 가셔서 가족과 이야기해 보시고 알려 주셔도 됩니다.", "bridge": "오늘 미팅은 여기까지입니다. 확인하실 것과 다음 약속을 정리해서 저녁에 문자로 보내 드리겠습니다.", "closing": "적립을 올릴지에 대한 답, 또는 답을 주실 날짜를 받고 다음 약속을 잡습니다.", "questions": ["오늘 내용 가운데 가장 기억에 남는 숫자는 무엇인가요?", "결정하시는 데 더 필요한 자료나, 같이 상의하실 분이 계신가요?"], "branches": [{"answer": "이번 달부터 올리겠습니다.", "follow": "좋은 결정이십니다. 그러면 자동이체 금액 변경부터 하시고, 다음 미팅에서 국민연금 예상액과 퇴직연금 내역을 가지고 숫자를 한 번 더 다듬겠습니다. 다음 약속은 언제가 편하실까요?"}, {"answer": "가족과 상의해 보고 연락드릴게요.", "follow": "물론입니다. 가족과 함께 정하시는 것이 맞습니다. 오늘 자료를 그대로 보여 드리면 설명하기 쉬우실 겁니다. 다음에 배우자분과 함께 보시는 자리를 만들면 두 분 기준으로 다시 계산해 드릴 수 있습니다."}, {"answer": "금액을 좀 줄여서 시작하고 싶어요.", "follow": "충분히 좋은 선택입니다. 원하시는 금액을 알려 주시면 그 금액으로 다시 계산한 결과를 보내 드리겠습니다. 모자라는 부분은 은퇴 시기 조정으로 얼마나 메워지는지도 함께 적어 드리겠습니다."}], "objections": [{"q": "좀 더 생각해 보겠습니다.", "a": "네, 그렇게 하십시오. 서두르실 일이 아닙니다. 다만 생각하시는 동안 도움이 되도록, 어떤 점이 가장 걸리시는지 하나만 알려 주시면 그 부분의 자료를 따로 정리해 드리겠습니다. 금액인가요, 가정인가요, 아니면 다른 부분인가요?"}, {"q": "다른 곳에서도 상담을 받아 보고 싶습니다.", "a": "좋은 생각이십니다. 큰 결정은 여러 의견을 들어 보시는 것이 맞습니다. 다른 곳에서 상담받으실 때 오늘 자료의 가정과 계산 과정을 그대로 견주어 보시면 됩니다. 비교해 보시고 궁금한 점이 생기면 언제든 물어봐 주시겠어요?"}]}}, "wrap": {"followUpPlan": ["미팅 당일 저녁: 오늘 확인한 내용과 다음 약속을 문자로 보내기", "미팅 다음 날: 고객이 다른 금액(생활비, 적립액)으로 보고 싶다고 한 경우 그 값으로 다시 계산해 전달하기", "1주일 안: 국민연금 예상액과 퇴직연금 운용 내역을 확인했는지 묻고, 조회 방법이 필요하면 순서를 안내하기", "다음 미팅 전날: 받은 자료로 숫자를 다시 계산하고 달라진 부분만 표시해 두기", "적립을 올린 경우: 한 달 뒤 자동이체가 바뀐 금액으로 나갔는지 확인하기"], "nextMeetingDocs": ["국민연금 예상 연금액 조회 화면 — 자료의 두 금액 가운데 맞는 값을 정하기 위해", "퇴직연금 운용 내역(상품과 수익률) — 수익률 가정을 실제에 맞추기 위해", "연금저축·IRP 납입 내역과 올해 연말정산 자료 — 세액공제 예상액을 실제 세금 기준으로 확인하기 위해", "배우자의 연금 예상액(해당하는 경우) — 가구 기준으로 다시 계산하기 위해"], "followUpMessage": "홍길동 과장님, 오늘 시간 내 주셔서 감사합니다. 오늘은 지금 적립으로 준비되는 수준과 모자란 금액, 그리고 국민연금이 나오기 전 기간의 대비를 함께 확인했습니다. 다음에 뵐 때 국민연금 예상액과 퇴직연금 운용 내역을 확인해 주시면 숫자를 더 정확하게 다듬겠습니다. 적립 금액은 편하실 때 생각을 알려 주십시오. 다음 약속은 말씀하신 날짜로 잡아 두겠습니다. 궁금한 점은 언제든 연락 주십시오."}};
