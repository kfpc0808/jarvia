<html lang="ko">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<!-- ★ JARVIA 오류 조기 수집 (개인정보 미수집 · 사용자 무영향 · 실패해도 무해) -->
<script>
(function(){try{
  if(window.__jvErr)return; window.__jvErr={buf:[],track:{}}; window.__jvPage='consensus';
  var push=function(o){try{if(window.__jvErr.buf.length<50)window.__jvErr.buf.push(o);}catch(e){}};
  window.addEventListener('error',function(e){push({t:'js_error',message:(e&&e.message)||'error',source:(e&&e.filename)||'',lineno:(e&&e.lineno)||0,colno:(e&&e.colno)||0,stack:(e&&e.error&&e.error.stack)||'',at:Date.now()});},true);
  window.addEventListener('unhandledrejection',function(e){var r=e&&e.reason;push({t:'promise_rejection',message:(r&&(r.message||String(r)))||'unhandledrejection',stack:(r&&r.stack)||'',source:'',lineno:0,colno:0,at:Date.now()});});
}catch(_e){}})();
</script>
<script type="module" src="jarvia-error-collector.js"></script>
<title>모닝 컨센서스 — 주요 증권사 리서치 공통 의견 | JARVIA</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800&family=Sora:wght@600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1E2226;--navy-lt:#3A4148;--navy-dk:#141719;
  --accent:#96701F;--accent-lt:#C9A05C;--accent-glow:rgba(201,160,92,.12);
  --gold:#C9A05C;--gold-lt:#E3C893;--gold-bg:rgba(201,160,92,.07);
  --success:#27AE60;--danger:#E74C3C;--warning:#F39C12;
  --bg:#F6F5F1;--bg-card:#FFF;--bg-section:#FAF9F6;
  --text:#1C2024;--text-lt:#565D66;--text-sub:#8A9098;
  --border:#E1E8EE;--border-lt:#F0F3F6;
  --shadow:0 2px 12px rgba(20,23,25,.06);
  --shadow-md:0 4px 20px rgba(20,23,25,.10);
  --radius:12px;--radius-sm:8px;
  --font:'Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;
  --font-mono:'JetBrains Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh}
a{color:inherit}

/* ── 헤더 ── */
.hd{background:linear-gradient(135deg,var(--navy-dk),var(--navy));color:#fff;padding:0 0 0}
.hd-in{max-width:820px;margin:0 auto;padding:14px 18px 16px}
.hd-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.hd-back{font-size:13px;color:rgba(255,255,255,.65);text-decoration:none;display:inline-flex;align-items:center;gap:4px}
.hd-back:hover{color:#fff}
.hd-title{font-family:'Sora',var(--font);font-size:21px;font-weight:800;letter-spacing:.01em;display:flex;align-items:center;gap:10px}
.hd-sub{font-size:12px;color:rgba(255,255,255,.6);margin-top:4px}
.hd-badge{font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--gold-lt);border:1px solid rgba(201,160,92,.5);border-radius:5px;padding:2px 8px;background:rgba(201,160,92,.1)}

/* ── 날짜 네비게이션 ── */
.nav-bar{max-width:820px;margin:-1px auto 0;padding:0 18px}
.nav-card{background:var(--bg-card);border:1px solid var(--border-lt);border-radius:var(--radius);box-shadow:var(--shadow);padding:10px 14px;display:flex;align-items:center;gap:8px;transform:translateY(16px)}
.nav-btn{width:36px;height:36px;border-radius:9px;border:1px solid var(--border);background:#fff;font-size:15px;cursor:pointer;color:var(--navy);font-family:var(--font);transition:.15s;flex-shrink:0}
.nav-btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent);background:var(--gold-bg)}
.nav-btn:disabled{opacity:.3;cursor:default}
.nav-date{flex:1;text-align:center;position:relative}
.nav-date-main{font-size:15.5px;font-weight:800;color:var(--navy);cursor:pointer;display:inline-flex;align-items:center;gap:7px;padding:4px 10px;border-radius:8px;transition:.15s}
.nav-date-main:hover{background:var(--bg-section)}
.nav-date-sub{font-size:10.5px;color:var(--text-sub);margin-top:1px}
.nav-caret{font-size:10px;color:var(--text-sub)}
.date-list{display:none;position:absolute;top:calc(100% + 8px);left:50%;transform:translateX(-50%);background:#fff;border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-md);z-index:60;max-height:320px;overflow-y:auto;min-width:230px;padding:6px}
.date-list.open{display:block}
.date-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 12px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;color:var(--text)}
.date-item:hover{background:var(--bg-section)}
.date-item.cur{background:var(--accent-glow);color:var(--accent)}
.date-item .di-meta{font-family:var(--font-mono);font-size:10.5px;color:var(--text-sub);font-weight:500}
.date-item.fb .di-meta{color:var(--warning)}
.cap-btn{flex-shrink:0;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:9px;background:#fff;padding:0 13px;height:36px;font-size:12.5px;font-weight:700;color:var(--navy);cursor:pointer;font-family:var(--font);transition:.15s}
.cap-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--gold-bg)}
.cap-btn:disabled{opacity:.4;cursor:default}

/* ── 본문 ── */
.wrap{max-width:820px;margin:0 auto;padding:34px 18px 46px}
.report-card{background:var(--bg-card);border:1px solid var(--border-lt);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px 20px}
@media(min-width:640px){.report-card{padding:26px 26px}}
.empty{text-align:center;padding:70px 20px;color:var(--text-sub)}
.empty-icon{font-size:44px;margin-bottom:14px}
.empty p{font-size:14px;line-height:1.8}
.skel{height:220px;border-radius:var(--radius);background:linear-gradient(90deg,#EFEDE8 25%,#F7F5F0 50%,#EFEDE8 75%);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* ── 컨센서스 컴포넌트 ── */
.mc-banner{background:linear-gradient(135deg,rgba(201,160,92,.07),rgba(212,160,60,.03));border:1px solid rgba(201,160,92,.2);border-radius:var(--radius-sm);padding:13px 16px;margin-bottom:14px;font-size:12.5px;color:var(--text-lt);line-height:1.75}
.mc-banner b{color:var(--navy)}
.mc-firms{margin-top:8px;font-size:11px;color:var(--text-sub)}
.mc-strip{background:linear-gradient(135deg,#141719,#1E2226);color:#fff;border-radius:var(--radius-sm);padding:14px 18px;display:flex;flex-wrap:wrap;gap:14px 26px;align-items:center;margin-bottom:16px}
.mc-strip .lb{font-size:10px;letter-spacing:.12em;color:rgba(255,255,255,.55);font-weight:700}
.mc-strip .vl{font-size:15px;font-weight:700;color:var(--gold-lt)}
.mc-strip .vr{margin-left:auto;text-align:right}
.mc-strip .vr .ok{font-size:10.5px;font-weight:700;color:rgba(255,255,255,.7)}
.mc-strip .vr .ok span{color:#7CD9A5}
.mc-strip .vr .tm{font-family:var(--font-mono);font-size:9.5px;color:rgba(255,255,255,.4);margin-top:2px}
.mc-bh{display:flex;align-items:center;gap:10px;margin:22px 0 10px;flex-wrap:wrap}
.mc-bh:first-of-type{margin-top:0}
.mc-bh .no{font-family:var(--font-mono);font-size:10px;font-weight:700;color:var(--accent);background:var(--gold-bg);border:1px solid rgba(201,160,92,.3);border-radius:5px;padding:2px 8px}
.mc-bh .tt{font-size:15px;font-weight:800;color:var(--navy)}
.mc-bh .tt small{font-size:11px;font-weight:600;color:var(--text-sub)}
.mc-bh .agree{margin-left:auto;display:flex;align-items:center;gap:6px}
.mc-bh .agree .num{font-family:var(--font-mono);font-size:11px;font-weight:700;color:var(--accent)}
.mc-dots{display:inline-flex;gap:3px;vertical-align:middle}
.mc-dots i{width:8px;height:8px;border-radius:50%;background:var(--border-lt);display:inline-block}
.mc-dots i.on{background:var(--gold)}
.mc-line{background:var(--bg-section);border:1px solid var(--border-lt);border-left:3px solid var(--gold);border-radius:var(--radius-sm);padding:12px 16px;font-size:13.5px;line-height:1.8;margin-bottom:8px}
.mc-tag{display:inline-block;font-size:10.5px;font-weight:700;border-radius:4px;padding:1px 7px;margin-right:8px}
.tag-neutral{background:#EEF1F4;color:#565D66}.tag-caution{background:rgba(243,156,18,.12);color:#B8770B}
.tag-positive{background:rgba(39,174,96,.1);color:#1E8A4C}.tag-negative{background:rgba(46,111,216,.1);color:#2E6FD8}
.mc-chips{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:8px}
.mc-chips .cl{font-size:10.5px;font-weight:700}
.cl-ag{color:var(--accent)}.cl-dg{color:var(--danger);margin-left:6px}.cl-nc{color:var(--text-sub);margin-left:6px}
.mc-chip{font-size:10.5px;font-weight:600;border-radius:11px;padding:2px 9px;white-space:nowrap}
.ch-ag{color:#3A4148;background:#fff;border:1px solid var(--border)}
.ch-dg{color:var(--danger);background:rgba(231,76,60,.05);border:1px solid rgba(231,76,60,.35)}
.ch-nc{color:var(--text-sub);background:var(--border-lt);border:1px solid var(--border-lt)}
.mc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.mc-gcard{background:var(--bg-section);border:1px solid var(--border-lt);border-radius:var(--radius-sm);padding:13px 15px}
.mc-gcard .gk{font-size:11px;font-weight:700;color:var(--text-sub);display:flex;justify-content:space-between;gap:6px;margin-bottom:5px}
.mc-gcard .gk .gn{font-family:var(--font-mono);font-size:10px;color:var(--accent);background:var(--gold-bg);border-radius:9px;padding:1px 7px;white-space:nowrap}
.mc-gcard .gh{font-size:13px;font-weight:700;color:var(--navy);line-height:1.6;margin-bottom:4px}
.mc-gcard .gd{font-size:11.5px;color:var(--text-lt);line-height:1.7}
.mc-easy{margin-top:10px;border:1.5px dashed rgba(201,160,92,.45);border-radius:var(--radius-sm);background:#FFFDF8;padding:10px 14px 13px}
.mc-easy .eh{font-size:12px;font-weight:800;color:var(--accent)}
.mc-easy .eh small{float:right;font-size:10px;font-weight:400;color:var(--text-sub)}
.mc-easy .et{font-weight:800;color:var(--navy);font-size:12.5px;margin-top:7px}
.mc-easy .ex{margin-left:12px;font-size:12.5px;color:var(--text-lt);line-height:1.8}
.mc-sectors{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.mc-sector{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--border);border-radius:20px;padding:6px 14px 6px 12px;font-size:12.5px;font-weight:700;color:var(--navy)}
.mc-sector .sc{font-family:var(--font-mono);font-size:10.5px;color:var(--accent);background:var(--gold-bg);border-radius:10px;padding:1px 8px}
.mc-stock{border:1px solid var(--border-lt);border-radius:var(--radius-sm);background:var(--bg-section);padding:13px 16px;margin-bottom:9px}
.mc-stock .sh{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:5px}
.mc-stock .sn{font-size:14px;font-weight:800;color:var(--navy)}
.mc-stock .scd{font-family:var(--font-mono);font-size:10.5px;color:var(--text-sub)}
.mc-stock .smc{margin-left:auto;font-family:var(--font-mono);font-size:11px;font-weight:700;color:var(--accent)}
.mc-stock .sr{font-size:12.5px;line-height:1.75}
.mc-tip{margin-top:16px;padding:12px 15px;border-radius:var(--radius-sm);background:var(--accent-glow);border-left:3px solid var(--accent);font-size:12.5px;color:var(--navy);line-height:1.75}
.mc-fb{font-size:12.5px;color:var(--text-sub);padding:10px 14px;background:var(--bg-section);border-radius:var(--radius-sm)}
.mc-foot{margin-top:16px;padding-top:12px;border-top:1px dashed var(--border)}
.mc-foot .fd{font-size:10.5px;color:var(--text-sub);line-height:1.65}
.mc-foot .fs{text-align:right;font-size:10px;color:#95A5A6;margin-top:6px}
.fallback-card{text-align:center;padding:44px 20px}
.fallback-card .fi{font-size:38px;margin-bottom:12px}
.fallback-card .ft{font-size:14.5px;font-weight:700;color:var(--navy);margin-bottom:6px}
.fallback-card .fx{font-size:12.5px;color:var(--text-sub);line-height:1.8}
.cap-toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--navy);color:#fff;font-size:13px;font-weight:600;padding:11px 20px;border-radius:24px;box-shadow:var(--shadow-md);z-index:99;display:none}
@media(max-width:520px){
  .hd-title{font-size:18px}
  .mc-strip{gap:10px 18px;padding:12px 14px}
  .mc-strip .vl{font-size:13.5px}
  .cap-btn .cap-tx{display:none}
  .cap-btn{padding:0 11px}
}
</style>

<body>

<header class="hd">
  <div class="hd-in">
    <div class="hd-top"><a class="hd-back" href="./index.html">← 메인으로</a></div>
    <div class="hd-title">🧭 모닝 컨센서스 <span class="hd-badge">MORNING CONSENSUS</span></div>
    <div class="hd-sub">주요 증권사 조간 리서치 공통 의견 · 매 영업일 오전 발행</div>
  </div>
</header>

<div class="nav-bar">
  <div class="nav-card">
    <button class="nav-btn" id="btnPrev" onclick="navMove(1)" title="이전 영업일">‹</button>
    <div class="nav-date">
      <div class="nav-date-main" id="dateMain" onclick="toggleDateList(event)">날짜 불러오는 중… <span class="nav-caret">▼</span></div>
      <div class="nav-date-sub" id="dateSub"></div>
      <div class="date-list" id="dateList"></div>
    </div>
    <button class="nav-btn" id="btnNext" onclick="navMove(-1)" title="다음 영업일">›</button>
    <button class="cap-btn" id="btnCap" onclick="captureReport()" title="이미지로 저장">📷 <span class="cap-tx">이미지 저장</span></button>
  </div>
</div>

<div class="wrap">
  <div id="main"><div class="skel"></div></div>
</div>

<div class="cap-toast" id="capToast">이미지를 저장했습니다</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import{getAuth,onAuthStateChanged,setPersistence,browserLocalPersistence}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import{getFirestore,collection,getDocs,query,orderBy,limit}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const FC={apiKey:"AIzaSyBD9p-bf162RiiD1Y3BsY-NvbYjpOSrzmg",authDomain:"jarvia-platform.firebaseapp.com",projectId:"jarvia-platform",storageBucket:"jarvia-platform.firebasestorage.app",messagingSenderId:"388025068900",appId:"1:388025068900:web:09ba8e12e9e9e2ec49de71"};
const app=initializeApp(FC);
const auth=getAuth(app);
setPersistence(auth,browserLocalPersistence).catch(()=>{});   /* 메인(index.html)과 동일 저장 방식 — 없으면 로그인 정보를 못 읽음 */
const db=getFirestore(app,'javia-db');

function esc(s){return s?String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'):'';}

let archive=[];   // [{id(=fileDate), status, ko, firmList, totalFirms, collectedAt}] 최신순
let curIdx=0;     // archive 인덱스 (0=최신)

/* ── 데이터 로드: morning_consensus 최근 60건 (done·fallback만 아카이브 편입) ── */
async function loadArchive(){
  try{
    const snap=await getDocs(query(collection(db,'morning_consensus'),orderBy('fileDate','desc'),limit(60)));
    archive=snap.docs.map(d=>({id:d.id,...d.data()})).filter(r=>r.status==='done'||r.status==='fallback');
    if(!archive.length){
      document.getElementById('dateMain').innerHTML='발행 이력 없음';
      document.getElementById('main').innerHTML='<div class="empty"><div class="empty-icon">🧭</div><p>아직 발행된 모닝 컨센서스가 없습니다.<br>매 영업일 오전 9시 전후에 발행됩니다.</p></div>';
      document.getElementById('btnCap').disabled=true;
      return;
    }
    curIdx=0;
    renderDateList();
    show();
  }catch(e){
    console.error('load error:',e);
    document.getElementById('main').innerHTML='<div class="empty"><div class="empty-icon">⚠️</div><p>데이터를 불러올 수 없습니다.<br>잠시 후 다시 시도해 주세요.</p></div>';
  }
}

/* ── 날짜 표시·이동 ── */
const WD=['일','월','화','수','목','금','토'];
function parseYmd(r){   /* 문서 date 필드(YYYY-MM-DD) 우선, 없으면 ID(YYYYMMDD·YYYY-MM-DD 양형식) 파싱 */
  const s=String((r&&r.date)||(r&&r.id)||r||'');
  const m=s.match(/^(\d{4})-?(\d{2})-?(\d{2})$/);
  return m?{y:+m[1],mo:+m[2],d:+m[3]}:null;
}
function fmtDate(r){
  const p=parseYmd(r);
  if(!p)return{main:esc(String((r&&r.id)||'')),dash:String((r&&r.id)||'')};
  const dt=new Date(p.y,p.mo-1,p.d);
  const z=n=>String(n).padStart(2,'0');
  return{main:`${p.y}년 ${p.mo}월 ${p.d}일 (${WD[dt.getDay()]})`,dash:`${p.y}-${z(p.mo)}-${z(p.d)}`};
}
function show(){
  const r=archive[curIdx];
  if(!r)return;
  const f=fmtDate(r);
  document.getElementById('dateMain').innerHTML=`${f.main} <span class="nav-caret">▼</span>`;
  document.getElementById('dateSub').textContent=curIdx===0?'최신 발행분':`${curIdx} 영업일 전`;
  document.getElementById('btnPrev').disabled=curIdx>=archive.length-1;
  document.getElementById('btnNext').disabled=curIdx<=0;
  document.getElementById('btnCap').disabled=!(r.status==='done'&&r.ko);
  renderDateList();
  document.getElementById('main').innerHTML=`<div class="report-card" id="capArea">${renderConsensus(r)}</div>`;
  window.scrollTo({top:0,behavior:'smooth'});
}
function navMove(dir){   /* dir: 1=이전(과거), -1=다음(최신) */
  const ni=curIdx+dir;
  if(ni<0||ni>=archive.length)return;
  curIdx=ni;show();
  closeDateList();
}
function toggleDateList(ev){
  ev.stopPropagation();
  document.getElementById('dateList').classList.toggle('open');
}
function closeDateList(){document.getElementById('dateList').classList.remove('open');}
document.addEventListener('click',e=>{if(!e.target.closest('.nav-date'))closeDateList();});
function renderDateList(){
  const el=document.getElementById('dateList');
  el.innerHTML=archive.map((r,i)=>{
    const f=fmtDate(r);
    const meta=r.status==='fallback'?'발행 보류':`${r.totalFirms||(r.ko&&r.ko.meta&&r.ko.meta.totalFirms)||''}개사`;
    return `<div class="date-item${i===curIdx?' cur':''}${r.status==='fallback'?' fb':''}" onclick="selectDate(${i})"><span>${f.main}</span><span class="di-meta">${esc(String(meta))}</span></div>`;
  }).join('');
}
function selectDate(i){curIdx=i;show();closeDateList();}

/* ── 컨센서스 풀 렌더 (dailyReport renderConsensusSection과 동일 구조 · 컨설턴트 페이지 → 상담 Tip 포함) ── */
function renderConsensus(mc){
  if(mc.status==='fallback'||!mc.ko){
    return `<div class="fallback-card"><div class="fi">🌙</div><div class="ft">오늘은 컨센서스 발행이 보류되었습니다</div><div class="fx">${esc(mc.fallbackText||'증권사 조간 리서치 수집이 기준 수량에 미달하여 정확성을 위해 발행하지 않았습니다.')}<br>다음 영업일에 다시 찾아뵙겠습니다.</div></div>`;
  }
  const d=mc.ko,meta=d.meta||{};
  const N=mc.totalFirms||meta.totalFirms||0;
  const dots=n=>{let h='<span class="mc-dots">';for(let i=0;i<N;i++)h+=`<i${i<n?' class="on"':''}></i>`;return h+'</span>';};
  const tagCls=t=>({neutral:'tag-neutral',caution:'tag-caution',positive:'tag-positive',negative:'tag-negative'}[t]||'tag-neutral');
  const firmChips=it=>{
    const ag=it.agreeFirms||[],dg=it.disagreeFirms||[],nc=it.notCoveredFirms||[];
    if(!ag.length&&!dg.length&&!nc.length)return'';
    let h='<div class="mc-chips">';
    if(ag.length)h+=`<span class="cl cl-ag">일치 ${ag.length}</span>`+ag.map(f=>`<span class="mc-chip ch-ag">${esc(f)}</span>`).join('');
    if(dg.length)h+=`<span class="cl cl-dg">반대 ${dg.length}</span>`+dg.map(f=>`<span class="mc-chip ch-dg">${esc(f)}</span>`).join('');
    if(nc.length)h+=`<span class="cl cl-nc">미언급 ${nc.length}</span>`+nc.map(f=>`<span class="mc-chip ch-nc">${esc(f)}</span>`).join('');
    return h+'</div>';
  };
  const clineBox=it=>`<div class="mc-line"><span class="mc-tag ${tagCls(it.tagType)}">${esc(it.tag||'')}</span>${esc(it.text||'')}${firmChips(it)}</div>`;
  const easyBox=g=>{
    if(!g||!g.length)return'';
    return `<div class="mc-easy"><div class="eh">📖 쉽게 풀어드려요 <small>투자 입문자용 해설</small></div>`+g.map(x=>`<div class="et">· ${esc(x.term)}</div><div class="ex">${esc(x.explain)}</div>`).join('')+`</div>`;
  };
  const blockHead=(num,title,agreeCount)=>`<div class="mc-bh"><span class="no">${num}</span><span class="tt">${title}</span>${typeof agreeCount==='number'&&N?`<span class="agree">${dots(agreeCount)}<span class="num">${agreeCount}/${N}</span></span>`:''}</div>`;
  const fb=t=>`<div class="mc-fb">${esc(t)}</div>`;

  let b='';
  b+=`<div class="mc-banner"><b>이 자료는 이렇게 만들어집니다</b> — 국내 주요 증권사 <b>${N}개사의 조간 리서치</b>를 AI가 전수 분석하여, <b>70% 이상이 같은 방향으로 보는 의견만</b> 골라 담았습니다. 한 증권사의 주장이 아니라 "증권가 전체가 어디에 동의하는가"를 전달하며, 의견이 엇갈리는 내용은 싣지 않습니다. 게시 전 모든 문장은 서로 다른 3사 AI의 교차 검증을 통과합니다.<div class="mc-firms"><b style="color:var(--navy)">오늘의 분석 대상 ${N}개사</b> · ${(mc.firmList||[]).map(esc).join(' · ')}</div></div>`;
  b+=`<div class="mc-strip"><div><div class="lb">오늘의 시장 온도</div><div class="vl">${esc(meta.overallTemp||'')}</div></div><div><div class="lb">지수 방향 컨센서스</div><div class="vl">${esc(meta.overallDirection||'')}</div></div><div><div class="lb">일치도</div><div class="vl" style="font-family:var(--font-mono)">${meta.overallAgree||0}<span style="font-size:11px;color:rgba(255,255,255,.6)"> / ${N}개사</span></div></div><div class="vr"><div class="ok"><span>✓</span> 3중 교차검증 통과</div><div class="tm">집계 완료 ${esc(mc.collectedAt||'')} · ${N}개사</div></div></div>`;

  const ol=d.outlook||{};
  b+=blockHead('01','오늘의 시황전망',ol.agreeCount);
  b+=ol.blockFallback?fb(ol.blockFallback):(ol.items||[]).map(clineBox).join('');
  b+=easyBox(ol.easyGuide);

  const st=d.strategy||{};
  b+=blockHead('02','투데이 투자전략',st.agreeCount);
  if(st.blockFallback){b+=fb(st.blockFallback);}
  else{
    b+=`<div class="mc-grid">`+(st.grid||[]).map(g=>`<div class="mc-gcard"><div class="gk"><span>${esc(g.key||'')}</span><span class="gn">${g.agreeCount||0}개사 일치</span></div><div class="gh">${esc(g.headline||'')}</div><div class="gd">${esc(g.detail||'')}</div></div>`).join('')+`</div>`;
    if((st.agreeFirms||[]).length)b+=firmChips({agreeFirms:st.agreeFirms});
  }
  b+=easyBox(st.easyGuide);

  const mt=d.midTerm||{};
  b+=blockHead('03','시장전망 <small>(주간~월간)</small>',mt.agreeCount);
  b+=mt.blockFallback?fb(mt.blockFallback):(mt.items||[]).map(clineBox).join('');
  b+=easyBox(mt.easyGuide);

  const sk=d.stocks||{};
  b+=blockHead('04','리서치 다수 언급 기업 <small>(3개사 이상 공통 언급)</small>');
  if(sk.blockFallback){b+=fb(sk.blockFallback);}
  else{
    if((sk.sectors||[]).length)b+=`<div class="mc-sectors">`+sk.sectors.map(s=>`<span class="mc-sector">${esc(s.name)} <span class="sc">${s.count}개사</span></span>`).join('')+`</div>`;
    b+=(sk.list||[]).map(s=>`<div class="mc-stock"><div class="sh"><span class="sn">${esc(s.name)}</span><span class="scd">${esc(s.code==='unknown'?'':s.code||'')}</span><span class="smc">${s.mentionCount||0}개사 언급</span></div><div class="sr">${esc(s.reason||'')}</div>${firmChips({agreeFirms:s.mentionFirms||[]})}</div>`).join('');
  }
  b+=easyBox(sk.easyGuide);

  /* ★ 상담 활용 Tip — 컨설턴트 전용. 이미지 캡처(고객 공유용)에서는 자동 제외됨 */
  if(d.consultTip)b+=`<div class="mc-tip">💡 <b>상담 활용 Tip</b> · ${esc(d.consultTip)} <span style="display:block;margin-top:5px;font-size:10.5px;color:var(--text-sub)">※ 이 팁은 컨설턴트 전용이며, 📷 이미지 저장 시에는 포함되지 않습니다.</span></div>`;

  b+=`<div class="mc-foot"><div class="fd">※ 본 내용은 각 증권사가 공개 발행한 조간 리서치의 공통 의견을 AI가 정보 제공 목적으로 집계·재구성한 것입니다. 증권사명은 해당 취지의 의견을 제시한 발행사를 표시하며 원문 인용이 아니고, '미언급'은 반대가 아니라 해당 주제를 다루지 않았다는 뜻입니다. 특정 종목의 매수·매도 추천이 아니며, 투자 판단과 책임은 투자자 본인에게 있습니다.</div><div class="fs">집계: ${esc(meta.date||'')} 조간 리서치 ${N}개사 전수 분석 · ${esc(mc.collectedAt||'')} 집계 완료 · 3중 교차검증 통과</div></div>`;
  return b;
}

/* ── 📷 이미지 저장 (html2canvas · ★ B2B2C: 상담 Tip은 캡처에서 제외) ── */
let capturing=false;
async function captureReport(){
  if(capturing)return;
  const area=document.getElementById('capArea');
  const r=archive[curIdx];
  if(!area||!r||typeof html2canvas==='undefined')return;
  capturing=true;
  const btn=document.getElementById('btnCap');
  btn.disabled=true;
  try{
    const canvas=await html2canvas(area,{
      scale:2,backgroundColor:'#FFFFFF',useCORS:true,logging:false,
      onclone:doc=>{doc.querySelectorAll('.mc-tip').forEach(el=>el.remove());}   /* 고객 공유 이미지에 컨설턴트 팁 미포함 */
    });
    const a=document.createElement('a');
    a.download=`모닝컨센서스_${fmtDate(r).dash}.png`;
    a.href=canvas.toDataURL('image/png');
    a.click();
    const t=document.getElementById('capToast');
    t.style.display='block';setTimeout(()=>{t.style.display='none';},2200);
  }catch(e){
    console.error('capture error:',e);
    alert('이미지 저장에 실패했습니다. 잠시 후 다시 시도해 주세요.');
  }finally{
    capturing=false;btn.disabled=false;
  }
}

/* onclick 핸들러 window 등록 (module scope) */
window.navMove=navMove;
window.toggleDateList=toggleDateList;
window.selectDate=selectDate;
window.captureReport=captureReport;

/* ── 인증 확인 후 로드 (daily-report.html과 동일 정책: 로그인 회원 전 등급 열람) ── */
onAuthStateChanged(auth,async u=>{
  if(u){
    try{sessionStorage.removeItem('_mcAutoReload');}catch(_e){}
    loadArchive();
  }else{
    /* 오탐 방어: 순간적 null이면 복원 유예 → 로그인 이력 있으면 1회 자동 새로고침 */
    await new Promise(r=>setTimeout(r,1500));if(auth.currentUser)return;
    if(localStorage.getItem('jarvia_hasLogin')==='1'&&!sessionStorage.getItem('_mcAutoReload')){
      sessionStorage.setItem('_mcAutoReload','1');
      console.warn('인증 오탐 감지(로그인 이력 존재) — 자동 새로고침으로 복구 시도');
      location.reload();return;
    }
    document.getElementById('main').innerHTML='<div class="empty"><div class="empty-icon">🔒</div><p>로그인이 필요합니다.<br><a href="./index.html" style="color:var(--accent)">메인으로 이동</a></p></div>';
    document.getElementById('dateMain').textContent='—';
    document.getElementById('btnCap').disabled=true;
  }
});
</script>
