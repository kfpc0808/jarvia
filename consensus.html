<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<!-- ★ JARVIA 오류 조기 수집 (개인정보 미수집 · 사용자 무영향 · 실패해도 무해) -->

<title>모닝 컨센서스 — 증권가 아침 리서치 통합 | JARVIA</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800&family=Sora:wght@600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1E2226;--navy-lt:#3A4148;--navy-dk:#141719;
  --accent:#96701F;--accent-lt:#C9A05C;--accent-glow:rgba(201,160,92,.12);
  --gold:#C9A05C;--gold-lt:#E3C893;--gold-bg:rgba(201,160,92,.07);
  --success:#27AE60;--danger:#E74C3C;--warning:#F39C12;
  --bg:#F6F5F1;--bg-card:#FFF;--bg-section:#FAF9F6;
  --text:#1C2024;--text-lt:#565D66;--text-sub:#8A9098;
  --border:#E1E8EE;--border-lt:#F0F3F6;
  --shadow:0 2px 12px rgba(20,23,25,.06);
  --shadow-md:0 4px 20px rgba(20,23,25,.10);
  --radius:12px;--radius-sm:8px;
  --font:'Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;
  --font-mono:'JetBrains Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh}
a{color:inherit}

/* ── 헤더 ── */
.hd{background:linear-gradient(135deg,var(--navy-dk),var(--navy));color:#fff;padding:0 0 0}
.hd-in{max-width:820px;margin:0 auto;padding:14px 18px 16px}
.hd-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.hd-back{font-size:13px;color:rgba(255,255,255,.65);text-decoration:none;display:inline-flex;align-items:center;gap:4px}
.hd-back:hover{color:#fff}
.hd-title{font-family:'Sora',var(--font);font-size:21px;font-weight:800;letter-spacing:.01em;display:flex;align-items:center;gap:10px}
.hd-sub{font-size:13px;color:rgba(255,255,255,.6);margin-top:4px}
.hd-badge{font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--gold-lt);border:1px solid rgba(201,160,92,.5);border-radius:5px;padding:2px 8px;background:rgba(201,160,92,.1)}

/* ── 날짜 네비게이션 ── */
.nav-bar{max-width:820px;margin:-1px auto 0;padding:0 18px}
.nav-card{background:var(--bg-card);border:1px solid var(--border-lt);border-radius:var(--radius);box-shadow:var(--shadow);padding:10px 14px;display:flex;align-items:center;gap:8px;transform:translateY(16px)}
.nav-btn{width:36px;height:36px;border-radius:9px;border:1px solid var(--border);background:#fff;font-size:15px;cursor:pointer;color:var(--navy);font-family:var(--font);transition:.15s;flex-shrink:0}
.nav-btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent);background:var(--gold-bg)}
.nav-btn:disabled{opacity:.3;cursor:default}
.nav-date{flex:1;text-align:center;position:relative}
.nav-date-main{font-size:15.5px;font-weight:800;color:var(--navy);cursor:pointer;display:inline-flex;align-items:center;gap:7px;padding:4px 10px;border-radius:8px;transition:.15s;white-space:nowrap}
.nav-date-main:hover{background:var(--bg-section)}
.nav-date-sub{font-size:10.5px;color:var(--text-sub);margin-top:1px}
.nav-caret{font-size:10px;color:var(--text-sub)}
.date-list{display:none;position:absolute;top:calc(100% + 8px);left:50%;transform:translateX(-50%);background:#fff;border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-md);z-index:60;max-height:320px;overflow-y:auto;min-width:230px;padding:6px}
.date-list.open{display:block}
.date-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 12px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600;color:var(--text)}
.date-item:hover{background:var(--bg-section)}
.date-item.cur{background:var(--accent-glow);color:var(--accent)}
.date-item .di-meta{font-family:var(--font-mono);font-size:11.5px;color:var(--text-sub);font-weight:500}
.date-item.fb .di-meta{color:var(--warning)}
.cap-btn{flex-shrink:0;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:9px;background:#fff;padding:0 13px;height:36px;font-size:12.5px;font-weight:700;color:var(--navy);cursor:pointer;font-family:var(--font);transition:.15s}
.cap-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--gold-bg)}
.cap-btn:disabled{opacity:.4;cursor:default}

/* ── 본문 ── */
/* ★ [2026-08-22] 모바일 가로 활용 — 좌우 여백이 wrap+main+card 3중으로 겹쳐 편측 56px을 먹고 있었다.
   모바일에서 30px로 줄이고, 640px 이상에서는 종전 여백을 그대로 유지한다. */
.wrap{max-width:820px;margin:0 auto;padding:34px 10px 46px}
@media(min-width:640px){.wrap{padding:34px 18px 46px}}
.report-card{background:var(--bg-card);border:1px solid var(--border-lt);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 10px}
@media(min-width:640px){.report-card{padding:22px 20px}}
@media(min-width:640px){.report-card{padding:26px 26px}}
.empty{text-align:center;padding:70px 20px;color:var(--text-sub)}
.empty-icon{font-size:44px;margin-bottom:14px}
.empty p{font-size:15.5px;line-height:1.8}
.skel{height:220px;border-radius:var(--radius);background:linear-gradient(90deg,#EFEDE8 25%,#F7F5F0 50%,#EFEDE8 75%);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* ── 컨센서스 컴포넌트 ── */
.mc-banner{background:linear-gradient(135deg,rgba(201,160,92,.07),rgba(212,160,60,.03));border:1px solid rgba(201,160,92,.2);border-radius:var(--radius-sm);padding:14px 16px;margin-bottom:14px;font-size:14.5px;color:var(--text-lt);line-height:1.7}
.mc-banner b{color:var(--navy)}
/* ★ [2026-08-10] 안내 배너 넘버링 리디자인 — PC·모바일 공통 */
.mc-banner .bn-title{font-size:13px;font-weight:800;color:var(--navy);display:flex;align-items:center;gap:7px;margin-bottom:10px}
.mc-banner ol.bn-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.mc-banner ol.bn-list li{display:flex;gap:9px;align-items:flex-start}
.mc-banner .bn-no{flex-shrink:0;width:19px;height:19px;border-radius:50%;background:linear-gradient(135deg,#C9A05C,#96701F);color:#fff;font-size:11.5px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;margin-top:1.5px}
.mc-banner .bn-tx{flex:1;line-height:1.65}
@media(min-width:640px){.mc-banner{padding:16px 20px}.mc-banner ol.bn-list{gap:7px}}
/* ★ [2026-08-12] 안내 배너 접이식 — 기본 접힘, 클릭 펼침 */
details.mc-banner>summary{cursor:pointer;user-select:none;list-style:none}
details.mc-banner>summary::-webkit-details-marker{display:none}
details.mc-banner:not([open])>summary.bn-title{margin-bottom:0}
.mc-banner .bn-cara{font-size:9px;color:#96701F;transition:transform .2s}
details.mc-banner[open] .bn-cara{transform:rotate(90deg)}
.mc-banner .bn-hint{margin-left:auto;font-size:11.5px;font-weight:600;color:var(--text-sub)}
details.mc-banner[open] .bn-hint{display:none}
.mc-firms{margin-top:8px;font-size:12px;color:var(--text-sub)}
.mc-strip{background:linear-gradient(135deg,#141719,#1E2226);color:#fff;border-radius:var(--radius-sm);padding:14px 18px;display:flex;flex-wrap:wrap;gap:14px 26px;align-items:center;margin-bottom:16px}
.mc-strip .lb{font-size:11px;letter-spacing:.12em;color:rgba(255,255,255,.55);font-weight:700}
.mc-strip .vl{font-size:16.5px;font-weight:700;color:var(--gold-lt)}
.mc-strip .vr{margin-left:auto;text-align:right}
.mc-strip .vr .ok{font-size:11.5px;font-weight:700;color:rgba(255,255,255,.7)}
.mc-strip .vr .ok span{color:#7CD9A5}
.mc-strip .vr .tm{font-family:var(--font-mono);font-size:10.5px;color:rgba(255,255,255,.4);margin-top:2px}
.mc-bh{display:flex;align-items:center;gap:10px;margin:22px 0 10px;flex-wrap:wrap}
.mc-bh:first-of-type{margin-top:0}
.mc-bh .no{font-family:var(--font-mono);font-size:11px;font-weight:700;color:var(--accent);background:var(--gold-bg);border:1px solid rgba(201,160,92,.3);border-radius:5px;padding:2px 8px}
.mc-bh .tt{font-size:16.5px;font-weight:800;color:var(--navy)}
.mc-bh .tt small{font-size:12px;font-weight:600;color:var(--text-sub)}
.mc-bh .agree{margin-left:auto;display:flex;align-items:center;gap:6px}
.mc-bh .agree .num{font-family:var(--font-mono);font-size:12px;font-weight:700;color:var(--accent)}
.mc-dots{display:inline-flex;gap:3px;vertical-align:middle}
.mc-dots i{width:8px;height:8px;border-radius:50%;background:var(--border-lt);display:inline-block}
.mc-dots i.on{background:var(--gold)}
.mc-line{background:var(--bg-section);border:1px solid var(--border-lt);border-left:3px solid var(--gold);border-radius:var(--radius-sm);padding:12px 16px;font-size:16px;line-height:1.8;margin-bottom:8px}
.mc-tag{display:inline-block;font-size:11.5px;font-weight:700;border-radius:4px;padding:1px 7px;margin-right:8px}
.tag-neutral{background:#EEF1F4;color:#565D66}.tag-caution{background:rgba(243,156,18,.12);color:#B8770B}
.tag-positive{background:rgba(39,174,96,.1);color:#1E8A4C}.tag-negative{background:rgba(46,111,216,.1);color:#2E6FD8}
.mc-chips{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:8px}
.mc-chips .cl{font-size:11.5px;font-weight:700}
.cl-ag{color:var(--accent)}.cl-dg{color:var(--danger);margin-left:6px}.cl-nc{color:var(--text-sub);margin-left:6px}
.mc-chip{font-size:11.5px;font-weight:600;border-radius:11px;padding:2px 9px;white-space:nowrap}
.ch-ag{color:#3A4148;background:#fff;border:1px solid var(--border)}
.ch-dg{color:var(--danger);background:rgba(231,76,60,.05);border:1px solid rgba(231,76,60,.35)}
.ch-nc{color:var(--text-sub);background:var(--border-lt);border:1px solid var(--border-lt)}
/* ★ [2026-08] 증권사 칩 접기 */
.mc-fold{margin-top:8px}
.mc-fold summary{list-style:none;cursor:pointer;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:11.5px;font-weight:700;user-select:none;-webkit-user-select:none}
.mc-fold summary::-webkit-details-marker{display:none}
.mc-fold .mc-cara{display:inline-block;font-size:9px;color:var(--text-sub);transition:transform .2s}
.mc-fold[open] .mc-cara{transform:rotate(90deg)}
.mc-fold .mc-hint::after{content:"증권사명 보기";font-size:10px;font-weight:500;color:var(--text-sub)}
.mc-fold[open] .mc-hint::after{content:"접기"}
.mc-fold .mc-chips{margin-top:7px}
/* ★ [2026-08] 블록 배타 아코디언 — 제목줄 상시 노출, 하나 펼치면 나머지 접힘 */
.mc-blk+.mc-blk{margin-top:12px}
.mc-blk>summary{list-style:none;cursor:pointer;user-select:none;-webkit-user-select:none}
.mc-blk>summary::-webkit-details-marker{display:none}
.mc-blk>summary.mc-bh{margin:0}
.mc-blk .mc-arr{margin-left:8px;font-size:12px;color:var(--text-sub);transition:transform .2s}
.mc-blk[open] .mc-arr{transform:rotate(180deg)}
/* ★ [2026-08-10] 2단계 성립: 우세 의견 배지 (컨센서스=골드, 우세=회색 계열) */
.mc-prev-badge{display:inline-block;font-size:10px;font-weight:700;color:#565D66;background:#EEF1F4;border:1px solid #DDE3E9;border-radius:4px;padding:1px 7px;margin-right:6px;vertical-align:1px}
/* ★ [2026-08-10] 참고 언급 종목 (2개사) — 컨센서스 종목보다 옅은 톤 */
.mc-ref-head{margin:12px 0 7px;font-size:11.5px;font-weight:800;color:#8A9098}
.mc-stock.ref{background:#FBFCFD;border-style:dashed}
.mc-stock.ref .smc{color:#8A9098}
/* ★ [2026-08-18] 증권사별 의견 — 블록 하단 상시 노출로 전환 (접이식 폐지: 발견성 확보 + 고객용 HTML·캡처 누락 방지) */
.mc-firms-fold{margin-top:11px;border-top:1px dashed var(--border-lt)}
.mc-firms-fold .ff-hd{padding:9px 2px 3px;font-size:13.5px;font-weight:800;color:#96701F}
.mc-fold.as-div{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:11.5px;font-weight:700}
/* ★ [2026-08-22] 증권사별 의견 — 좌우 2단(회사명 92px 고정 + 본문) 에서 상하 2단으로 전환.
   모바일에서 본문 폭이 92px+간격만큼 깎여 5~6글자마다 줄바꿈되던 문제를 해소한다.
   회사명·방향 배지를 첫 줄에, 본문을 그 아래 전체 폭으로 배치. */
.mc-fbrow{padding:9px 2px 10px;border-bottom:1px solid #F5F7F9;font-size:14.5px;line-height:1.75}
.mc-fbrow .fb-hd{display:flex;align-items:center;gap:7px;margin-bottom:4px}
.mc-fbrow:last-child{border-bottom:none}
.mc-fbrow .fbf{font-weight:800;color:var(--navy);font-size:14px}
.mc-fbrow .fbt{display:block;word-break:keep-all}
.mc-fbrow .fbd{font-size:11px;font-weight:700;border-radius:4px;padding:1px 6px;white-space:nowrap;align-self:center}
.fbd-up{color:#1E8A4C;background:rgba(39,174,96,.1)}.fbd-neutral{color:#565D66;background:#EEF1F4}.fbd-down{color:#2E6FD8;background:rgba(46,111,216,.1)}
.mc-fbrow .fbt{flex:1;color:#3A4148}
.mc-fbrow.nc .fbf{color:#AEB6BE;font-weight:600}
.mc-fbrow.nc{padding:8px 2px;display:flex;gap:8px;align-items:baseline}   /* 미언급 행은 한 줄 유지 */
.mc-fbrow.nc .fbf{flex:0 0 auto;color:#8A9098;font-weight:700;font-size:12.5px}
.mc-fbrow.nc .fbt{color:#AEB6BE;font-style:normal;font-size:12.5px}
.mc-bd{padding-top:10px}
.mc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.mc-gcard{background:var(--bg-section);border:1px solid var(--border-lt);border-radius:var(--radius-sm);padding:13px 15px}
.mc-gcard .gk{font-size:12px;font-weight:700;color:var(--text-sub);display:flex;justify-content:space-between;gap:6px;margin-bottom:5px}
.mc-gcard .gk .gn{font-family:var(--font-mono);font-size:11px;color:var(--accent);background:var(--gold-bg);border-radius:9px;padding:1px 7px;white-space:nowrap}
.mc-gcard .gh{font-size:14.5px;font-weight:700;color:var(--navy);line-height:1.6;margin-bottom:4px}
.mc-gcard .gd{font-size:14px;color:var(--text-lt);line-height:1.7}
.mc-easy{margin-top:10px;border:1.5px dashed rgba(201,160,92,.45);border-radius:var(--radius-sm);background:#FFFDF8;padding:10px 14px 13px}
.mc-easy .eh{font-size:13.5px;font-weight:800;color:var(--accent)}
.mc-easy .eh small{float:right;font-size:11px;font-weight:400;color:var(--text-sub)}
.mc-easy .et{font-weight:800;color:var(--navy);font-size:14px;margin-top:7px}
.mc-easy .ex{margin-left:12px;font-size:14.5px;color:var(--text-lt);line-height:1.8}
.mc-sectors{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.mc-sector{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--border);border-radius:20px;padding:6px 14px 6px 12px;font-size:14.5px;font-weight:700;color:var(--navy)}
.mc-sector .sc{font-family:var(--font-mono);font-size:11.5px;color:var(--accent);background:var(--gold-bg);border-radius:10px;padding:1px 8px}
.mc-stock{border:1px solid var(--border-lt);border-radius:var(--radius-sm);background:var(--bg-section);padding:13px 16px;margin-bottom:9px}
.mc-stock .sh{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:5px}
.mc-stock .sn{font-size:15.5px;font-weight:800;color:var(--navy)}
.mc-stock .scd{font-family:var(--font-mono);font-size:11.5px;color:var(--text-sub)}
.mc-stock .smc{margin-left:auto;font-family:var(--font-mono);font-size:12px;font-weight:700;color:var(--accent)}
.mc-stock .sr{font-size:14.5px;line-height:1.75}
.mc-tip{margin-top:16px;padding:12px 15px;border-radius:var(--radius-sm);background:var(--accent-glow);border-left:3px solid var(--accent);font-size:14.5px;color:var(--navy);line-height:1.75}
.mc-fb{font-size:14.5px;color:var(--text-sub);padding:10px 14px;background:var(--bg-section);border-radius:var(--radius-sm)}
/* ★ [2026-08-20] 읽기 가이드 "오늘 이런 분께 도움이 됩니다" — 리포트 최상단 진입 안내.
   details가 아닌 div로 구성 → 고객 열람 모드(?v=1)에서도 항상 표시된다. */
.mg-card{border-radius:16px;overflow:hidden;margin-bottom:14px;box-shadow:0 4px 18px rgba(21,41,74,.13);border:1px solid rgba(201,160,92,.35)}
.mg-hd{background:linear-gradient(135deg,#15294A,#22406E);padding:14px 16px 13px;position:relative}
.mg-hd::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:linear-gradient(90deg,#96701F,#E3C893,#96701F)}
.mg-hd .t{font-size:17px;font-weight:800;color:#fff;letter-spacing:-.3px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.mg-hd .bdg{font-size:10px;font-weight:700;letter-spacing:.04em;color:#E8D5AC;border:1px solid rgba(201,169,110,.55);background:rgba(201,169,110,.16);border-radius:5px;padding:2px 7px;white-space:nowrap}
.mg-hd .s{font-size:12.5px;color:#AEB8CC;margin-top:5px;line-height:1.6;word-break:keep-all}
.mg-bd{background:#FBFAF7;padding:14px 10px 15px}
.mg-lead{font-size:14.5px;line-height:1.8;color:#3D444C;word-break:keep-all;padding:0 3px 13px;border-bottom:1px dashed #E2DCCF;margin-bottom:13px}
.mg-item{background:#fff;border:1px solid #EAE4D8;border-left:3px solid #C9A05C;border-radius:10px;padding:11px 13px 12px;box-shadow:0 1px 5px rgba(30,34,38,.04)}
.mg-item+.mg-item{margin-top:9px}
.mg-k{display:flex;align-items:flex-start;gap:7px;font-size:15px;font-weight:800;color:#15294A;letter-spacing:-.3px;line-height:1.45;margin-bottom:6px;word-break:keep-all}

<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import{getAuth,onAuthStateChanged,setPersistence,browserLocalPersistence}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import{getFirestore,collection,getDocs,query,where,orderBy,limit,doc,getDoc,runTransaction,serverTimestamp,Timestamp}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
import{getFunctions,httpsCallable}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-functions.js';   /* ★ [2026-08-21] 공유 링크 서명 키 발급·해석용 */   /* ★ [2026-08-14] 유료화 — where·트랜잭션 추가 */

const FC={apiKey:"AIzaSyBD9p-bf162RiiD1Y3BsY-NvbYjpOSrzmg",authDomain:"jarvia-platform.firebaseapp.com",projectId:"jarvia-platform",storageBucket:"jarvia-platform.firebasestorage.app",messagingSenderId:"388025068900",appId:"1:388025068900:web:09ba8e12e9e9e2ec49de71"};
const app=initializeApp(FC);
const auth=getAuth(app);
setPersistence(auth,browserLocalPersistence).catch(()=>{});   /* 메인(index.html)과 동일 저장 방식 — 없으면 로그인 정보를 못 읽음 */
const db=getFirestore(app,'javia-db');
const fns=getFunctions(app,'asia-northeast3');   /* ★ [2026-08-21] mcShareKey 호출용 — 리전 고정 필수 */

/* ═══ [2026-08-14] 모닝 컨센서스 유료화 게이트 — index.html의 유료화 블록과 쌍(정책 변경 시 함께 수정) ═══
   · 멤버십 6롤 무료 · 발행보류(fallback) 무료 · 일반회원 1,000원/건(포인트 우선), 결제 일자는 당일 자정까지 재열람 무료
   · 직접 URL 진입 우회 차단: 본문 렌더 전 이 게이트를 반드시 통과 */
const MC_PRICE=1000;
const MC_MEMBER_ROLES=['admin','jarvia_member','jarvia_inner','inner_circle','con_homepage','branch_manager'];
let mcUid=null,mcRole='',mcBal=0,mcPoint=0;
const mcPaid={};          /* {날짜ID:true} — 이 세션에서 확인된 유효 결제 */
const fmtN=n=>Number(n||0).toLocaleString('ko-KR');
async function mcLoadRole(uid){
  try{const us=await getDoc(doc(db,'users',uid));if(us.exists()){const d=us.data();mcRole=d.role||'';mcBal=d.balance||0;mcPoint=d.point||0;}}catch(e){console.warn('role 조회 실패',e);}
}
const mcIsMember=()=>(typeof MCV!=='undefined'&&MCV)||MC_MEMBER_ROLES.includes(mcRole);   /* ★ [2026-08-15] 고객 열람 모드는 결제 게이트 없이 무료 열람 */
async function mcCheckPaid(dateId){
  if(mcPaid[dateId])return true;
  try{
    const snap=await getDocs(query(collection(db,'view_logs'),where('userId','==',mcUid),where('contentId','==','consensus:'+dateId)));
    const now=Date.now();
    if(snap.docs.some(d=>{const ex=d.data().expiresAt;return ex&&ex.toMillis()>now;})){mcPaid[dateId]=true;return true;}
  }catch(e){console.warn('결제기록 조회 실패',e);}
  return false;
}
async function mcCharge(dateId){   /* index.html _mcCharge와 동일 로직 */
  const uRef=doc(db,'users',mcUid);
  return runTransaction(db,async tx=>{
    const uDoc=await tx.get(uRef);
    if(!uDoc.exists())throw new Error('데이터 오류');
    const ud=uDoc.data();
    if(((ud.point||0)+(ud.balance||0))<MC_PRICE)throw new Error('INSUFFICIENT_BALANCE');
    const pointUsed=Math.min(ud.point||0,MC_PRICE),balUsed=MC_PRICE-pointUsed;
    const np=(ud.point||0)-pointUsed,nb=(ud.balance||0)-balUsed;
    const eod=new Date();eod.setHours(23,59,59,999);
    const gid=()=>Date.now().toString(36)+Math.random().toString(36).substr(2,9);
    const txId=gid(),logId=gid(),paidAt=Timestamp.fromDate(new Date()),expiresAt=Timestamp.fromDate(eod);
    tx.update(uRef,{balance:nb,point:np,updatedAt:serverTimestamp()});
    tx.set(doc(db,'transactions',txId),{txId,userId:mcUid,type:'spend',amount:-MC_PRICE,pointUsed,balanceUsed:balUsed,balanceAfter:nb,pointAfter:np,refType:'consensus',refId:dateId,createdAt:serverTimestamp()});
    tx.set(doc(db,'view_logs',logId),{logId,userId:mcUid,contentId:'consensus:'+dateId,price:MC_PRICE,txId,paidAt,expiresAt,createdAt:serverTimestamp()});
    return{pointUsed,balUsed,balance:nb,point:np};
  });
}
function mcPaywall(r,f){   /* 미결제 일자 잠금 카드 */
  return `<div class="report-card"><div class="fallback-card"><div class="fi">🔒</div>
    <div class="ft">${f.main} 컨센서스 열람권이 필요합니다</div>
    <div class="fx">일반회원은 <b>1,000원/건</b>(포인트 우선 차감)으로 열람하실 수 있습니다.<br>
    결제한 일자는 <b>오늘 하루(자정까지) 재열람 무료</b>이며, 다른 일자 선택 시 별도 결제됩니다.<br>
    <span style="color:#96701F;font-weight:700">★ 무료 재열람은 오늘까지이니 열람 후 캡처·다운로드로 반드시 저장해 두세요.</span></div>
    <button onclick="mcPayView('${r.id}')" style="margin-top:16px;border:none;border-radius:10px;background:linear-gradient(135deg,#C9A05C,#96701F);color:#fff;font-size:14px;font-weight:800;cursor:pointer;font-family:var(--font);padding:12px 28px">1,000원 결제하고 보기</button>
    <div style="margin-top:12px;font-size:11px;color:var(--text-sub)">멤버십(자비아·이너서클·컨설턴트홈·지사장)은 무료 — <a href="./index.html" style="color:var(--accent)">멤버십 안내</a></div>
    </div></div>`;
}
window.mcPayView=async function(dateId){
  try{
    if((mcPoint+mcBal)<MC_PRICE){
      if(confirm('잔액이 부족합니다.\n\n현재 잔액: '+fmtN(mcBal)+'원 / 포인트: '+fmtN(mcPoint)+'P\n모닝 컨센서스는 1,000원/건입니다.\n\n충전 화면으로 이동하시겠습니까?'))location.href='./index.html?action=charge';
      return;
    }
    const pu=Math.min(mcPoint,MC_PRICE),bu=MC_PRICE-pu;
    const ok=confirm('모닝 컨센서스 열람권 결제\n\n· 결제 금액: 1,000원 (포인트 '+fmtN(pu)+'P + 잔액 '+fmtN(bu)+'원)\n· 대상 일자: '+dateId+'\n· 결제한 일자는 오늘 하루(자정까지) 재열람 무료\n· 다른 일자 선택 시 1,000원이 별도 결제됩니다\n\n★ 무료 재열람은 오늘까지이니, 열람 후 캡처·다운로드로 반드시 저장해 두세요.\n\n결제하시겠습니까?');
    if(!ok)return;
    const r=await mcCharge(dateId);
    mcPaid[dateId]=true;mcPoint=r.point;mcBal=r.balance;
    alert('💰 1,000원 차감 (포인트 '+fmtN(r.pointUsed)+'P + 잔액 '+fmtN(r.balUsed)+'원)\n남은 포인트: '+fmtN(r.point)+'P | 잔액: '+fmtN(r.balance)+'원');
    show();
  }catch(err){
    if(err.message==='INSUFFICIENT_BALANCE'){if(confirm('잔액이 부족합니다. 충전 화면으로 이동하시겠습니까?'))location.href='./index.html?action=charge';}
    else alert('결제 처리 중 오류: '+err.message);
  }
};

function esc(s){return s?String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'):'';}

let archive=[];   // [{id(=fileDate), status, ko, firmList, totalFirms, collectedAt}] 최신순
let curIdx=0;     // archive 인덱스 (0=최신)

/* ★ [2026-08-21] 고객 열람 모드 전용 로드 — 해당 1건만 가져온다.
   종전에는 고객 화면에서도 loadArchive()로 60건을 통째로 내려받아, 날짜 이동 UI를 감춰도
   개발자도구 콘솔에서 archive 변수로 지난 60일치를 모두 열람할 수 있었다.
   단건 조회로 바꾸면 그 경로가 막히고, 전송량도 60분의 1로 줄어 모바일 로딩이 빨라진다.
   MC_KEY_FROM: 이 날짜 이후 발행분은 서명 키(k)로만 열 수 있다.
   그 전 날짜는 이미 고객에게 나간 d= 링크가 있으므로 계속 열리게 둔다. */
const MC_KEY_FROM='20260821';
async function loadArchiveViewer(){
  try{
    let fd='', _why='';
    if(MCV.k){
      /* 서명 키 → 발행일. 위조·변조 키는 서버가 거부한다 */
      try{
        const r=await httpsCallable(fns,'mcShareKey')({mode:'resolve',fc:MCV.fc,key:MCV.k});
        if(r&&r.data&&r.data.success)fd=String(r.data.fileDate||'');
        else _why=(r&&r.data&&r.data.error)||'키 검증 실패';
      }catch(e){ _why='서버 연결 실패: '+((e&&e.message)||''); console.warn('키 해석 실패:',e&&e.message); }
    }else if(/^\d{8}$/.test(MCV.d)){
      if(MCV.d<MC_KEY_FROM)fd=MCV.d;   /* 구버전 링크 호환 — 적용일 이전 발행분만 */
      else _why='보안 강화로 날짜 직접 지정 방식은 더 이상 지원되지 않습니다';
    }else{ _why='링크에 열람 키가 없습니다'; }
    if(!fd){
      /* ★ [2026-08-24] 실패 사유 표시 + 명함 유지.
         종전에는 사유 없이 잠금 화면만 떠서 원인 추적에 Cloud Logging 조회가 필요했고,
         명함마저 빠져 고객이 누가 보낸 링크인지도 알 수 없었다(2026-08-24 헤더 미표시 건).
         명함(mcvTopHTML)은 이 함수보다 먼저 로드되는 fcProfile 기반이라 오류와 무관하게 표시 가능하다. */
      document.getElementById('dateMain').innerHTML='&nbsp;';
      document.getElementById('main').innerHTML=(typeof mcvTopHTML==='function'?mcvTopHTML():'')
        +'<div class="empty"><div class="empty-icon">🔒</div><p>유효하지 않은 링크입니다.<br>담당 컨설턴트에게 다시 요청해 주세요.</p>'
        +(_why?'<p style="margin-top:10px;font-size:11.5px;color:#AEB6BE">사유: '+String(_why).replace(/</g,'&lt;').slice(0,120)+'</p>':'')
        +'</div>';
      return;
    }
    const snap=await getDoc(doc(db,'morning_consensus',fd));
    if(!snap.exists()){
      document.getElementById('dateMain').innerHTML='&nbsp;';
      document.getElementById('main').innerHTML=(typeof mcvTopHTML==='function'?mcvTopHTML():'')
        +'<div class="empty"><div class="empty-icon">🧭</div><p>해당 일자의 리포트를 찾을 수 없습니다.</p></div>';
      return;
    }
    archive=[{id:snap.id,...snap.data()}];   /* 뷰어는 1건만 보유 — 날짜 이동 UI는 mcview 에서 숨겨져 있다 */
    curIdx=0;
    renderDateList();
    show();
  }catch(e){
    console.error('viewer load error:',e);
    document.getElementById('main').innerHTML='<div class="empty"><div class="empty-icon">⚠️</div><p>리포트를 불러오지 못했습니다.</p></div>';
  }
}

/* ── 데이터 로드: morning_consensus 최근 60건 (done·fallback만 아카이브 편입) ── */
async function loadArchive(){

    }
    curIdx=0;

    renderDateList();

  }
}

/* ── 날짜 표시·이동 ── */
const WD=['일','월','화','수','목','금','토'];
function parseYmd(r){   /* 문서 date 필드(YYYY-MM-DD) 우선, 없으면 ID(YYYYMMDD·YYYY-MM-DD 양형식) 파싱 */
  const s=String((r&&r.date)||(r&&r.id)||r||'');
  const m=s.match(/^(\d{4})-?(\d{2})-?(\d{2})$/);
  return m?{y:+m[1],mo:+m[2],d:+m[3]}:null;
}
function fmtDate(r){
  const p=parseYmd(r);
  if(!p)return{main:esc(String((r&&r.id)||'')),dash:String((r&&r.id)||'')};
  const dt=new Date(p.y,p.mo-1,p.d);
  const z=n=>String(n).padStart(2,'0');
  return{main:`${p.y}년 ${p.mo}월 ${p.d}일 (${WD[dt.getDay()]})`,dash:`${p.y}-${z(p.mo)}-${z(p.d)}`};
}
/* ★ [2026-08-21] 공유 키 선발급 캐시.
   클립보드 쓰기는 '사용자 조작 직후'에만 허용된다(Safari·iOS는 특히 엄격).
   버튼을 누른 뒤 서버 호출을 await 하면 그 자격이 만료돼 복사가 조용히 실패한다.
   그래서 리포트를 표시하는 시점에 미리 키를 받아 두고, 복사 시에는 캐시만 읽는다. */
const _mcKeys={};
async function prefetchShareKey(fileDate){
  const fd=String(fileDate||'').replace(/\D/g,'');
  if(!fd||_mcKeys[fd]||MCV)return;            /* 고객 뷰어는 링크를 만들지 않는다 */
  if(!auth.currentUser)return;
  try{
    const kr=await httpsCallable(fns,'mcShareKey')({mode:'make',fileDate:fd});
    /* ★ [2026-08-24] 서버가 서명에 쓴 loginId(lid)를 키와 함께 보관한다.
       종전에는 링크의 fc= 를 화면 값(fcProfile.loginId)으로 채웠는데, 이 값은
       consultants 문서·localStorage 캐시·명함 편집 수동 입력의 세 갈래에서 오므로
       서버 서명 값과 어긋날 수 있었다. 어긋나면 (구링크) 명함만 조용히 빠지거나
       (신링크) 검증 실패로 잠금 화면이 떴다 — 2026-08-24 헤더 미표시 건의 구조적 원인.
       서버 응답 값을 그대로 쓰면 출처가 하나가 되어 원천적으로 어긋날 수 없다. */
    if(kr&&kr.data&&kr.data.success)_mcKeys[fd]={key:String(kr.data.key||''),lid:String(kr.data.loginId||'')};
  }catch(e){ console.warn('공유 키 선발급 실패:',e&&e.message); }
}

function show(){
  const r=archive[curIdx];
  if(!r)return;
  try{ mcTtsStop(); }catch(_e){}   /* ★ [2026-09-02] 날짜 이동 시 섹션 낭독 중단 */
  try{ if(r.id)prefetchShareKey(r.id); }catch(_e){}   /* 비차단 — 렌더를 지연시키지 않는다 */
  const f=fmtDate(r);
  document.getElementById('dateMain').innerHTML=`${f.main} <span class="nav-caret">▼</span>`;
  document.getElementById('dateSub').textContent=curIdx===0?'최신 발행분':`${curIdx} 영업일 전`;
  document.getElementById('btnPrev').disabled=curIdx>=archive.length-1;
  document.getElementById('btnNext').disabled=curIdx<=0;
  _setShareDisabled(!(r.status==='done'&&r.ko));
  renderDateList();
  /* ★ [2026-08-14] 유료화 게이트 — 멤버십·발행보류는 무료, 일반회원은 결제(당일 유효) 확인 후 렌더 */
  const _free=mcIsMember()||r.status==='fallback'||!r.ko;
  if(_free||mcPaid[r.id]){
    document.getElementById('main').innerHTML=MCV
      ? (mcvTopHTML()+`<div class="report-card" id="capArea">${renderConsensus(r)}</div>`+(cardFooterHTML()||''))
      : `<div class="report-card" id="capArea">${renderConsensus(r)}</div>`;
    const _dl=!(r.status==='done'&&r.ko);
    _setShareDisabled(_dl);
    try{ mcTtsInit(r.id); }catch(_e){ console.warn('[MC-TTS] 주입 실패',_e); }   /* ★ [2026-09-02] 섹션 낭독 바 주입 */
  }else{
    const _f=fmtDate(r),_ck=r.id;
    _setShareDisabled(true);   /* 미결제 상태 — 아래 _setShareDisabled 정책 스위치 참조 */
    document.getElementById('main').innerHTML='<div class="report-card"><div class="skel"></div></div>';
    mcCheckPaid(_ck).then(paid=>{
      if(archive[curIdx]&&archive[curIdx].id!==_ck)return;   /* 확인 중 날짜 이동 시 무시 */
      if(paid){show();return;}
      document.getElementById('main').innerHTML=mcPaywall(r,_f);
    });
  }
  window.scrollTo({top:0,behavior:'smooth'});
}
function navMove(dir){   /* dir: 1=이전(과거), -1=다음(최신) */
  const ni=curIdx+dir;
  if(ni<0||ni>=archive.length)return;
  curIdx=ni;show();
  closeDateList();
}
function toggleDateList(ev){
  ev.stopPropagation();
  document.getElementById('dateList').classList.toggle('open');
}
function closeDateList(){document.getElementById('dateList').classList.remove('open');}
document.addEventListener('click',e=>{if(!e.target.closest('.nav-date'))closeDateList();});
/* ★ [2026-08-10] 블록 독립 토글 — 배타 아코디언 제거 (KFPC 요청: 전체를 동시에 펼쳐볼 수 있게).
   details 기본 동작만 사용 — 각 블록은 클릭한 것만 열리고 닫히며 서로 영향 없음 */
function renderDateList(){
  const el=document.getElementById('dateList');
  el.innerHTML=archive.map((r,i)=>{
    const f=fmtDate(r);
    const meta=r.status==='fallback'?'발행 보류':`${r.totalFirms||(r.ko&&r.ko.meta&&r.ko.meta.totalFirms)||''}개사`;
    return `<div class="date-item${i===curIdx?' cur':''}${r.status==='fallback'?' fb':''}" onclick="selectDate(${i})"><span>${f.main}</span><span class="di-meta">${esc(String(meta))}</span></div>`;
  }).join('');
}
function selectDate(i){curIdx=i;show();closeDateList();}

/* ── 컨센서스 풀 렌더 (dailyReport renderConsensusSection과 동일 구조 · 컨설턴트 페이지 → 상담 Tip 포함) ── */
function renderConsensus(mc){
  if(mc.status==='fallback'||!mc.ko){
    return `<div class="fallback-card"><div class="fi">🌙</div><div class="ft">오늘은 컨센서스 발행이 보류되었습니다</div><div class="fx">${esc(mc.fallbackText||'증권사 조간 리서치 수집이 기준 수량에 미달하여 정확성을 위해 발행하지 않았습니다.')}<br>다음 영업일에 다시 찾아뵙겠습니다.</div></div>`;
  }
  const d=mc.ko,meta=d.meta||{};
  const N=mc.totalFirms||meta.totalFirms||0;
  const dots=n=>{let h='<span class="mc-dots">';for(let i=0;i<N;i++)h+=`<i${i<n?' class="on"':''}></i>`;return h+'</span>';};
  const tagCls=t=>({neutral:'tag-neutral',caution:'tag-caution',positive:'tag-positive',negative:'tag-negative'}[t]||'tag-neutral');
  const firmChips=it=>{
    const ag=it.agreeFirms||[],dg=it.disagreeFirms||[],nc=it.notCoveredFirms||[];
    if(!ag.length&&!dg.length&&!nc.length)return'';
    /* ★ [2026-08] 증권사 칩 접기 — 기본은 요약 수치, 탭하면 명단 펼침 */
    let sum='';
    if(ag.length)sum+=`<span class="cl cl-ag">일치 ${ag.length}</span>`;
    if(dg.length)sum+=`<span class="cl cl-dg">반대 ${dg.length}</span>`;
    if(nc.length)sum+=`<span class="cl cl-nc">미언급 ${nc.length}</span>`;
    let h='<div class="mc-chips">';
    if(ag.length)h+=`<span class="cl cl-ag">일치 ${ag.length}</span>`+ag.map(f=>`<span class="mc-chip ch-ag">${esc(f)}</span>`).join('');
    if(dg.length)h+=`<span class="cl cl-dg">반대 ${dg.length}</span>`+dg.map(f=>`<span class="mc-chip ch-dg">${esc(f)}</span>`).join('');
    if(nc.length)h+=`<span class="cl cl-nc">미언급 ${nc.length}</span>`+nc.map(f=>`<span class="mc-chip ch-nc">${esc(f)}</span>`).join('');
    h+='</div>';
    return `<details class="mc-fold"><summary><span class="mc-cara">▶</span>${sum}<span class="mc-hint"></span></summary>${h}</details>`;
  };
  /* tier별 표시 (2026-08-10 전수 통합): consensus=골드 보더, prevailing=우세 배지+회색 보더, view=중립 보더 무배지 */
  const tierStyle=t=>t==='consensus'?'':t==='prevailing'?'border-left-color:#B8C0C9':'border-left-color:#DDE3E9';
  const clineBox=it=>`<div class="mc-line" style="${tierStyle(it.tier||'view')}">${it.tier==='prevailing'?'<span class="mc-prev-badge">우세</span>':''}<span class="mc-tag ${tagCls(it.tagType)}">${esc(it.tag||'')}</span>${esc(it.text||'')}${firmChips(it)}</div>`;
  /* ★ [2026-08-10] 증권사별 의견 보기 — firmBriefs에서 해당 섹션 필드만 추출해 접이식 표시 */
  const dirBadge=dv=>({up:'<span class="fbd fbd-up">상승</span>',neutral:'<span class="fbd fbd-neutral">중립</span>',down:'<span class="fbd fbd-down">하락</span>'}[dv]||'');
  const firmBriefsFold=(field,withDir)=>{
    /* ★ [2026-08-10] 전원 표시: firmList 순서대로 N개사 모두 — 미커버 회사도 '다루지 않음' 회색 행으로 명시 (미언급도 판단 재료) */
    const byFirm={};(d.firmBriefs||[]).forEach(x=>{if(x&&x.firm)byFirm[x.firm]=x;});
    const firms=mc.firmList||Object.keys(byFirm);
    if(!firms.length)return'';
    const cov=firms.filter(f=>byFirm[f]&&byFirm[f][field]);
    const ncf=firms.filter(f=>!(byFirm[f]&&byFirm[f][field]));
    return `<div class="mc-firms-fold"><div class="ff-hd">${firms.length}개사는 이렇게 봤습니다 <span style="font-weight:600;color:var(--text-sub)">(이 주제 언급 ${cov.length}곳)</span></div>`+
      cov.map(f=>{const x=byFirm[f];
        return `<div class="mc-fbrow"><div class="fb-hd"><span class="fbf">${esc(f)}</span>${withDir?dirBadge(x.direction):''}</div><span class="fbt">${esc(x[field])}</span></div>`;}).join('')+
      (ncf.length?`<div class="mc-fbrow nc"><span class="fbf">미언급 ${ncf.length}곳</span><span class="fbt">${ncf.map(f=>esc(f)).join(' · ')}</span></div>`:'')+`</div>`;
  };
  const easyBox=g=>{
    if(!g||!g.length)return'';
    return `<div class="mc-easy"><div class="eh">📖 쉽게 풀어드려요 <small>투자 입문자용 해설</small></div>`+g.map(x=>`<div class="et">· ${esc(x.term)}</div><div class="ex">${esc(x.explain)}</div>`).join('')+`</div>`;
  };
  /* ★ [2026-08] 블록 아코디언 래퍼 — 제목줄(summary) 상시 노출 + 본문 접기, open=기본 펼침 */
  const blockWrap=(num,title,agreeCount,inner,open)=>`<details class="mc-blk"${open?' open':''}><summary class="mc-bh"><span class="no">${num}</span><span class="tt">${title}</span>${typeof agreeCount==='number'&&N?`<span class="agree">${dots(agreeCount)}<span class="num">${agreeCount}/${N}</span></span><span class="mc-arr">▾</span>`:`<span class="mc-arr" style="margin-left:auto">▾</span>`}</summary><div class="mc-bd">${inner}</div></details>`;
  const fb=t=>`<div class="mc-fb">${esc(t)}</div>`;

  let b='';
  /* ★ [2026-08-10] 안내 배너 넘버링 리디자인 — 내용 동일, 가독성 개선 */
  /* ★ [2026-08-12] 안내 배너 접이식 전환 — 기본 접힘, 클릭 시 펼침 (뷰어·고객용 HTML 공통) */
  b+=`<details class="mc-banner"><summary class="bn-title"><span class="bn-cara">▶</span><span class="bn-tt">📋 이 자료는 이렇게 만들어집니다</span><span class="bn-hint">펼침</span></summary><ol class="bn-list">`
    +`<li><span class="bn-no">1</span><span class="bn-tx">국내 주요 증권사 <b>${N}개사의 조간 리서치 전체</b>를 AI가 분석해 한 장으로 통합합니다.</span></li>`
    +`<li><span class="bn-no">2</span><span class="bn-tx">어떤 회사의 견해도 버리지 않고 취지별로 묶어 <b>다수 견해부터 단독 견해까지 전부</b> 싣습니다.</span></li>`
    +`<li><span class="bn-no">3</span><span class="bn-tx"><b>60% 이상 일치는 '컨센서스'</b>, <b>과반 일치는 '우세'</b> 라벨로 의견의 무게를 표시합니다.</span></li>`
    +`<li><span class="bn-no">4</span><span class="bn-tx">각 블록 끝에 <b>참여 증권사 전원의 의견과 방향</b>을 표로 싣습니다.</span></li>`
    +`<li><span class="bn-no">5</span><span class="bn-tx">오늘 증권가의 시각 분포를 파악하고 스스로 투자 스탠스를 정립하시라는 취지이며, <b>최종 판단은 독자의 몫</b>입니다.</span></li>`
    +`<li><span class="bn-no">6</span><span class="bn-tx">게시 전 모든 문장은 <b>서로 다른 3사 AI의 교차 검증</b>을 통과합니다.</span></li>`
    +`</ol><div class="mc-firms"><b style="color:var(--navy)">오늘의 분석 대상 ${N}개사</b> · ${(mc.firmList||[]).map(esc).join(' · ')}</div></details>`;
  /* ★ [2026-08-20] 읽기 가이드 — 리포트 최상단. todayGuide 도입(2026-08-20) 이후 발행분만 표시.
     과거 발행분에는 필드가 없으므로 통째로 건너뛴다(prevDayRecap과 동일 가드 패턴). */
  const tg=d.todayGuide;
  if(tg&&Array.isArray(tg.items)&&tg.items.length){
    b+=`<div class="mg-card"><div class="mg-hd">`
      +`<div class="t">🧭 오늘 이런 분께 도움이 됩니다 <span class="bdg">읽기 가이드</span></div>`
      +`<div class="s">${N}개사 리서치에서 근거가 확인된 유형만 골랐습니다. 오늘은 ${tg.items.length}가지입니다.</div></div>`
      +`<div class="mg-bd">`
      +(tg.lead?`<div class="mg-lead">${esc(tg.lead)}</div>`:'')
      +tg.items.map(it=>`<div class="mg-item"><div class="mg-k"><span class="ic">${esc(it.icon||'•')}</span><span>${esc(it.label||'')}</span></div>`
        +`<div class="mg-t">${esc(it.text||'')}</div>`
        +(it.caution?`<div class="mg-cau">${esc(it.caution)}</div>`:'')+`</div>`).join('')
      +(tg.closing?`<div class="mg-end"><div class="et">오늘의 핵심</div><div class="ex">${esc(tg.closing)}</div></div>`:'')
      +`</div></div>`;
  }
  /* ★ [2026-08-10] 전일 마감 리뷰 — 8개사 리서치의 전일 시황 종합 (prevDayRecap 도입 이후 발행분만 표시) */
  if(d.prevDayRecap&&d.prevDayRecap.full){
    b+=`<div class="mc-recap" style="background:#fff;border:1.5px solid #C9A05C;border-radius:14px;padding:15px 12px;margin-bottom:14px;box-shadow:0 3px 12px rgba(201,160,92,.12)">`
      +`<div style="font-size:15px;font-weight:800;color:var(--navy);display:flex;align-items:center;gap:7px;margin-bottom:9px">📈 전일 마감 리뷰 <span style="font-size:11.5px;font-weight:700;color:#96701F;background:var(--gold-bg,#FBF7EE);border:1px solid rgba(201,160,92,.35);border-radius:5px;padding:2px 7px">${N}개사 리서치 종합</span></div>`
      +`<div class="mc-recap-bd" style="font-size:14.5px;color:var(--text,#33393F);line-height:1.85;word-break:keep-all">${esc(d.prevDayRecap.full)}</div>`   /* 12.5 -> 14.5 (2026-08-22) */

function copyShareLink(){
  const r=archive[curIdx];
  const d=(r&&r.id)?String(r.id).replace(/\D/g,''):'';
  /* ★ [2026-08-24] fc= 는 서버가 서명에 쓴 loginId 만 사용한다.
     종전에는 화면 값(fcProfile.loginId)을 썼고, 그 값이 서버 서명 값과 다르면
     고객 화면에서 명함이 빠지거나 링크가 잠겼다. 서버 응답 값을 쓰면 항상 일치한다.
     fcProfile 은 이제 명함 '표시'에만 쓰고, 링크 생성에는 관여하지 않는다. */
  const _e=d?(_mcKeys[d]||null):null;
  if(d&&(!_e||!_e.key||!_e.lid)){
    /* 선발급이 아직/실패 — 구형 d= 링크로 대체하지 않는다(대체하면 날짜 조작 차단이 무너진다) */
    try{ prefetchShareKey(d); }catch(_er){}
    alert('공유 링크를 준비 중입니다.\n\n잠시 후 다시 눌러 주세요.\n\n(반복되면 로그아웃 후 다시 로그인해 주세요)'); return;
  }
  const url='https://briefingog-cvmdsjgzxa-du.a.run.app?fc='+encodeURIComponent(_e?_e.lid:'')+'&t=mc'+(_e&&_e.key?'&k='+encodeURIComponent(_e.key):'');
  const done=()=>{
    const t=document.getElementById('capToast');
    if(t){const o=t.textContent;t.textContent='링크를 복사했습니다 — 카톡에 붙여넣으세요';t.style.display='block';
      setTimeout(()=>{t.style.display='none';t.textContent=o;},2600);}
  };
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(done).catch(()=>fallbackCopy(url,done));
  }else fallbackCopy(url,done);
}
function fallbackCopy(text,cb){
  const ta=document.createElement('textarea');
  ta.value=text;ta.style.position='fixed';ta.style.opacity='0';
  document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');cb&&cb();}catch(_e){alert('복사에 실패했습니다.\n\n'+text);}
  document.body.removeChild(ta);
}

const MC_TTS_ENDPOINT='https://ttsspeak-cvmdsjgzxa-du.a.run.app';
const MC_TTS_VOICE='ko-KR-Chirp3-HD-Despina';
const MC_TTS_MIN=50;                       /* 이 글자 수 미만이면 바를 넣지 않음 */
/* 낭독 대상 — sel: 섹션, body: 본문(빈 값이면 섹션 자신), pos: 바 위치 */
const MC_TTS_TARGETS=[
  {sel:'.mg-card',       body:'.mg-bd',       id:'guide', title:'오늘의 읽기 가이드', pos:'start'},
  {sel:'.mc-recap',      body:'.mc-recap-bd', id:'recap', title:'전일 마감 리뷰',     pos:'start'},
  {sel:'details.mc-blk', body:'.mc-bd',       id:'',      title:'',                  pos:'start'},
  {sel:'.mc-tip',        body:'',             id:'tip',   title:'상담 활용 Tip',      pos:'end'}
];
const _mcTMap={};                          /* {섹션id: {sec, body, title}} */
const _mcT={id:null,url:null,audio:null,rate:1,date:'',title:''};

function mcTtsInit(dateId){
  _mcT.date=String(dateId||'').replace(/\D/g,'');
  for(const k in _mcTMap)delete _mcTMap[k];
  const root=document.getElementById('main');
  if(!root)return;
  /* 재렌더·중복 호출 방어 — 남아 있는 바를 먼저 제거 */
  root.querySelectorAll('.mc-tts-bar').forEach(b=>{if(b.parentNode)b.parentNode.removeChild(b);});
  let n=0;
  MC_TTS_TARGETS.forEach(spec=>{
    root.querySelectorAll(spec.sel).forEach((sec,i)=>{
      const body=spec.body?sec.querySelector(spec.body):sec;
      if(!body)return;
      let sid=spec.id,ttl=spec.title;
      if(!sid){   /* mc-blk — 번호(01~04)로 고정 id 생성 → 캐시 키 안정 */
        const no=sec.querySelector('summary .no'),tt=sec.querySelector('summary .tt');
        sid='blk'+(((no&&no.textContent.trim())||String(i+1)).replace(/[^0-9]/g,'')||String(i+1));
        ttl=(tt&&tt.textContent.trim())||('블록 '+(i+1));
      }
      if(_mcTMap[sid])return;
      const text=mcTtsText(body);
      if(text.length<MC_TTS_MIN)return;
      _mcTMap[sid]={sec:sec,body:body,title:ttl};
      const bar=document.createElement('button');
      bar.type='button';
      bar.className='mc-tts-bar'+(spec.pos==='end'?' at-end':'');
      bar.setAttribute('data-mctts',sid);
      bar.innerHTML='<span class="mc-tts-ic">▶</span><span class="mc-tts-tx">'
        +'<span class="mc-tts-t1">이 내용 음성으로 듣기</span>'
        +'<span class="mc-tts-t2">약 '+mcTtsEta(text.length)+' · '+mcTtsEsc(ttl)+'</span></span>';
      bar.addEventListener('click',ev=>{ev.stopPropagation();ev.preventDefault();mcTtsHit(sid);});
      if(spec.pos==='end')body.appendChild(bar);
      else body.insertBefore(bar,body.firstChild);
      n++;
    });
  });
  if(n)console.log('[MC-TTS] 낭독 바 '+n+'개 삽입');
}

/** 낭독용 평문 추출 — 바·버튼·증권사 칩 명단·미언급 행 제외
    ※ 분리된 노드에서는 innerText 가 textContent 로 폴백되어 문단 경계가 사라진다.
       블록 태그를 개행, 인라인 span 을 공백으로 치환해 문장이 붙어 읽히는 것을 막는다. */
function mcTtsText(body){
  const c=body.cloneNode(true);
  c.querySelectorAll('.mc-tts-bar,.mc-fold,.mc-fbrow.nc,.mc-dots,.mc-tip span[style*="display:block"],button,script,style').forEach(el=>{
    if(el.parentNode)el.parentNode.removeChild(el);
  });
  const raw=c.innerHTML
    .replace(/<br\s*\/?>/gi,'\n')
    .replace(/<\/(div|p|li|ol|ul|h[1-6]|tr|summary|details|section)>/gi,'\n')
    .replace(/<\/span>/gi,' ')
    .replace(/<[^>]*>/g,'');
  const ta=document.createElement('textarea');ta.innerHTML=raw;
  return ta.value.replace(/[ \t]+/g,' ').replace(/ *\n */g,'\n').replace(/\n{3,}/g,'\n\n').trim();
}
function mcTtsEsc(t){return String(t||'').replace(/[<>&]/g,m=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[m]));}
/** Despina 실측 기준 대략 초당 5.9자 */
function mcTtsEta(len){const s=Math.max(5,Math.round(len/5.9));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function mcTtsFmt(s){s=Math.max(0,Math.round(s||0));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}

function mcTtsBar(id){return document.querySelector('.mc-tts-bar[data-mctts="'+id+'"]');}
function mcTtsSet(id,state){
  const b=mcTtsBar(id);if(!b)return;
  const m=_mcTMap[id]||{};
  const ic=b.querySelector('.mc-tts-ic'),t1=b.querySelector('.mc-tts-t1'),t2=b.querySelector('.mc-tts-t2');
  b.classList.toggle('on',state==='play'||state==='load');
  if(state==='load'){ic.innerHTML='<span class="mc-tts-sp"></span>';t1.textContent='음성 준비 중…';t2.textContent='첫 재생은 몇 초 걸립니다';}
  else if(state==='play'){ic.textContent='❚❚';t1.textContent='재생 중 — 눌러서 정지';t2.textContent=m.title||'';}
  else{ic.textContent='▶';t1.textContent='이 내용 음성으로 듣기';
       const len=m.body?mcTtsText(m.body).length:0;
       t2.textContent='약 '+mcTtsEta(len)+' · '+(m.title||'');}
}
function mcTtsClearAll(){document.querySelectorAll('.mc-tts-bar').forEach(b=>mcTtsSet(b.getAttribute('data-mctts'),null));}

function mcTtsHit(id){
  const m=_mcTMap[id];if(!m)return;
  /* 같은 블록 재클릭 → 일시정지 / 재개 */
  if(_mcT.id===id&&_mcT.audio){
    if(!_mcT.audio.paused){_mcT.audio.pause();mcTtsSet(id,null);mcTtsMiniBtn('▶');}
    else{_mcT.audio.play();mcTtsSet(id,'play');mcTtsMiniBtn('❚❚');}
    return;
  }
  mcTtsStop();
  if(m.sec.tagName==='DETAILS'&&!m.sec.open)m.sec.open=true;   /* 접힌 블록 자동 펼침 */
  const text=mcTtsText(m.body);
  if(!text){alert('읽을 내용이 없습니다.');return;}
  _mcT.id=id;
  mcTtsSet(id,'load');
  mcTtsMiniShow(m.title,true);
  fetch(MC_TTS_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({text:text,date:_mcT.date,section:'mc-'+id,voice:MC_TTS_VOICE,lang:'ko-KR'})})
    .then(r=>{
      if(!r.ok)return r.text().then(t=>{throw new Error(r.status+' '+t.slice(0,120));});
      const ct=r.headers.get('content-type')||'';
      return ct.indexOf('application/json')>=0?r.json().then(j=>j.url):r.blob().then(b=>URL.createObjectURL(b));
    })
    .then(url=>{if(_mcT.id!==id)return;mcTtsPlayUrl(id,url);})
    .catch(e=>{
      console.warn('[MC-TTS] 실패:',e.message);
      if(_mcT.id!==id)return;
      _mcT.id=null;mcTtsSet(id,null);mcTtsMiniHide();
      alert('음성을 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.');
    });
}

function mcTtsPlayUrl(id,url){
  mcTtsStopAudio();
  const a=new Audio(url);
  a.playbackRate=_mcT.rate;
  _mcT.audio=a;_mcT.url=url;
  a.addEventListener('loadedmetadata',()=>{const e=document.getElementById('mcTmDur');if(e)e.textContent=mcTtsFmt(a.duration);});
  a.addEventListener('timeupdate',()=>{
    const c=document.getElementById('mcTmCur'),f=document.getElementById('mcTmFill');
    if(c)c.textContent=mcTtsFmt(a.currentTime);
    if(f&&a.duration)f.style.width=(a.currentTime/a.duration*100)+'%';
  });
  a.addEventListener('ended',()=>mcTtsStop());
  a.addEventListener('error',()=>{mcTtsSet(id,null);mcTtsMiniHide();_mcT.id=null;});
  a.play().then(()=>{mcTtsSet(id,'play');mcTtsMiniShow((_mcTMap[id]||{}).title,false);mcTtsMiniBtn('❚❚');})
          .catch(()=>{mcTtsSet(id,null);});
}
function mcTtsStopAudio(){
  if(_mcT.audio){try{_mcT.audio.pause();}catch(e){}
    if(_mcT.url&&_mcT.url.indexOf('blob:')===0){try{URL.revokeObjectURL(_mcT.url);}catch(e){}}}
  _mcT.audio=null;_mcT.url=null;
}
function mcTtsStop(){mcTtsStopAudio();_mcT.id=null;mcTtsClearAll();mcTtsMiniHide();}
function mcTtsToggle(){
  if(!_mcT.audio||!_mcT.id)return;
  if(_mcT.audio.paused){_mcT.audio.play();mcTtsSet(_mcT.id,'play');mcTtsMiniBtn('❚❚');}
  else{_mcT.audio.pause();mcTtsSet(_mcT.id,null);mcTtsMiniBtn('▶');}
}
function mcTtsRate(){
  /* Chirp3-HD 는 서버 배속 미지원 — 브라우저 playbackRate 로만 조절 */
  const o=[1,1.25,1.5,0.9],i=(o.indexOf(_mcT.rate)+1)%o.length;
  _mcT.rate=o[i];
  if(_mcT.audio)_mcT.audio.playbackRate=_mcT.rate;
  const e=document.getElementById('mcTmRate');if(e)e.textContent=_mcT.rate+'x';
}
function mcTtsMini(){
  let el=document.getElementById('mcTtsMini');
  if(el)return el;
  el=document.createElement('div');
  el.id='mcTtsMini';
  el.innerHTML='<div class="mc-tm-row">'
    +'<button type="button" class="mc-tm-play" id="mcTmPlay">▶</button>'
    +'<div class="mc-tm-b"><div class="mc-tm-t" id="mcTmTitle"></div>'
    +'<div class="mc-tm-s"><span id="mcTmCur">0:00</span> / <span id="mcTmDur">0:00</span> · 음성 낭독</div></div>'
    +'<button type="button" class="mc-tm-sp" id="mcTmRate">1x</button>'
    +'<button type="button" class="mc-tm-x" id="mcTmX">✕</button></div>'
    +'<div class="mc-tm-pr"><div class="mc-tm-fl" id="mcTmFill"></div></div>';
  document.body.appendChild(el);
  el.querySelector('#mcTmPlay').addEventListener('click',mcTtsToggle);
  el.querySelector('#mcTmRate').addEventListener('click',mcTtsRate);
  el.querySelector('#mcTmX').addEventListener('click',mcTtsStop);
  return el;
}
function mcTtsMiniBtn(t){const e=document.getElementById('mcTmPlay');if(e)e.textContent=t;}
function mcTtsMiniShow(title,loading){
  const el=mcTtsMini();
  document.getElementById('mcTmTitle').textContent=title||'';
  if(loading){document.getElementById('mcTmCur').textContent='--:--';document.getElementById('mcTmDur').textContent='--:--';
              document.getElementById('mcTmFill').style.width='0%';mcTtsMiniBtn('▶');}
  el.classList.add('on');
}
function mcTtsMiniHide(){
  const el=document.getElementById('mcTtsMini');if(!el)return;
  el.classList.remove('on');
  mcTtsMiniBtn('▶');
  document.getElementById('mcTmFill').style.width='0%';
}
/* 화면 이탈 시 재생 중단 (고객 오버레이에서 닫는 경우 포함) */
window.addEventListener('pagehide',()=>{try{mcTtsStopAudio();}catch(e){}});
</script>
