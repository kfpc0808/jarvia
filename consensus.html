<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>모닝 컨센서스 — 증권가 아침 리서치 통합 | JARVIA</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800&family=Sora:wght@600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1E2226;--navy-lt:#3A4148;--navy-dk:#141719;
  --accent:#96701F;--accent-lt:#C9A05C;--accent-glow:rgba(201,160,92,.12);
  --gold:#C9A05C;--gold-lt:#E3C893;--gold-bg:rgba(201,160,92,.07);
  --success:#27AE60;--danger:#E74C3C;--warning:#F39C12;
  --bg:#F6F5F1;--bg-card:#FFF;--bg-section:#FAF9F6;
  --text:#1C2024;--text-lt:#565D66;--text-sub:#8A9098;
  --border:#E1E8EE;--border-lt:#F0F3F6;
  --shadow:0 2px 12px rgba(20,23,25,.06);
  --shadow-md:0 4px 20px rgba(20,23,25,.10);
  --radius:12px;--radius-sm:8px;
  --font:'Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;
  --font-mono:'JetBrains Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh}
a{color:inherit}

/* ── 헤더 ── */
.hd{background:linear-gradient(135deg,var(--navy-dk),var(--navy));color:#fff;padding:0 0 0}
.hd-in{max-width:820px;margin:0 auto;padding:14px 18px 16px}
.hd-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.hd-back{font-size:13px;color:rgba(255,255,255,.65);text-decoration:none;display:inline-flex;align-items:center;gap:4px}
.hd-back:hover{color:#fff}
.hd-title{font-family:'Sora',var(--font);font-size:21px;font-weight:800;letter-spacing:.01em;display:flex;align-items:center;gap:10px}
.hd-sub{font-size:12px;color:rgba(255,255,255,.6);margin-top:4px}
.hd-badge{font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--gold-lt);border:1px solid rgba(201,160,92,.5);border-radius:5px;padding:2px 8px;background:rgba(201,160,92,.1)}

/* ── 날짜 네비게이션 ── */
.nav-bar{max-width:820px;margin:-1px auto 0;padding:0 18px}
.nav-card{background:var(--bg-card);border:1px solid var(--border-lt);border-radius:var(--radius);box-shadow:var(--shadow);padding:10px 14px;display:flex;align-items:center;gap:8px;transform:translateY(16px)}
.nav-btn{width:36px;height:36px;border-radius:9px;border:1px solid var(--border);background:#fff;font-size:15px;cursor:pointer;color:var(--navy);font-family:var(--font);transition:.15s;flex-shrink:0}
.nav-btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent);background:var(--gold-bg)}
.nav-btn:disabled{opacity:.3;cursor:default}
.nav-date{flex:1;text-align:center;position:relative}
.nav-date-main{font-size:15.5px;font-weight:800;color:var(--navy);cursor:pointer;display:inline-flex;align-items:center;gap:7px;padding:4px 10px;border-radius:8px;transition:.15s;white-space:nowrap}
.nav-date-main:hover{background:var(--bg-section)}
.nav-date-sub{font-size:10.5px;color:var(--text-sub);margin-top:1px}
.nav-caret{font-size:10px;color:var(--text-sub)}
.date-list{display:none;position:absolute;top:calc(100% + 8px);left:50%;transform:translateX(-50%);background:#fff;border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-md);z-index:60;max-height:320px;overflow-y:auto;min-width:230px;padding:6px}
.date-list.open{display:block}
.date-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 12px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;color:var(--text)}
.date-item:hover{background:var(--bg-section)}
.date-item.cur{background:var(--accent-glow);color:var(--accent)}
.date-item .di-meta{font-family:var(--font-mono);font-size:10.5px;color:var(--text-sub);font-weight:500}
.date-item.fb .di-meta{color:var(--warning)}
.cap-btn{flex-shrink:0;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:9px;background:#fff;padding:0 13px;height:36px;font-size:12.5px;font-weight:700;color:var(--navy);cursor:pointer;font-family:var(--font);transition:.15s}
.cap-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--gold-bg)}
.cap-btn:disabled{opacity:.4;cursor:default}

/* ── 본문 ── */
.wrap{max-width:820px;margin:0 auto;padding:34px 18px 46px}
.report-card{background:var(--bg-card);border:1px solid var(--border-lt);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px 20px}
@media(min-width:640px){.report-card{padding:26px 26px}}
.empty{text-align:center;padding:70px 20px;color:var(--text-sub)}
.empty-icon{font-size:44px;margin-bottom:14px}
.empty p{font-size:14px;line-height:1.8}
.skel{height:220px;border-radius:var(--radius);background:linear-gradient(90deg,#EFEDE8 25%,#F7F5F0 50%,#EFEDE8 75%);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* ── 컨센서스 컴포넌트 ── */
.mc-banner{background:linear-gradient(135deg,rgba(201,160,92,.07),rgba(212,160,60,.03));border:1px solid rgba(201,160,92,.2);border-radius:var(--radius-sm);padding:14px 16px;margin-bottom:14px;font-size:12.5px;color:var(--text-lt);line-height:1.7}
.mc-banner b{color:var(--navy)}
/* ★ [2026-08-10] 안내 배너 넘버링 리디자인 — PC·모바일 공통 */
.mc-banner .bn-title{font-size:13px;font-weight:800;color:var(--navy);display:flex;align-items:center;gap:7px;margin-bottom:10px}
.mc-banner ol.bn-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.mc-banner ol.bn-list li{display:flex;gap:9px;align-items:flex-start}
.mc-banner .bn-no{flex-shrink:0;width:19px;height:19px;border-radius:50%;background:linear-gradient(135deg,#C9A05C,#96701F);color:#fff;font-size:10.5px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;margin-top:1.5px}
.mc-banner .bn-tx{flex:1;line-height:1.65}
@media(min-width:640px){.mc-banner{padding:16px 20px}.mc-banner ol.bn-list{gap:7px}}
/* ★ [2026-08-12] 안내 배너 접이식 — 기본 접힘, 클릭 펼침 */
details.mc-banner>summary{cursor:pointer;user-select:none;list-style:none}
details.mc-banner>summary::-webkit-details-marker{display:none}
details.mc-banner:not([open])>summary.bn-title{margin-bottom:0}
.mc-banner .bn-cara{font-size:9px;color:#96701F;transition:transform .2s}
details.mc-banner[open] .bn-cara{transform:rotate(90deg)}
.mc-banner .bn-hint{margin-left:auto;font-size:10.5px;font-weight:600;color:var(--text-sub)}
details.mc-banner[open] .bn-hint{display:none}
.mc-firms{margin-top:8px;font-size:11px;color:var(--text-sub)}
.mc-strip{background:linear-gradient(135deg,#141719,#1E2226);color:#fff;border-radius:var(--radius-sm);padding:14px 18px;display:flex;flex-wrap:wrap;gap:14px 26px;align-items:center;margin-bottom:16px}
.mc-strip .lb{font-size:10px;letter-spacing:.12em;color:rgba(255,255,255,.55);font-weight:700}
.mc-strip .vl{font-size:15px;font-weight:700;color:var(--gold-lt)}
.mc-strip .vr{margin-left:auto;text-align:right}
.mc-strip .vr .ok{font-size:10.5px;font-weight:700;color:rgba(255,255,255,.7)}
.mc-strip .vr .ok span{color:#7CD9A5}
.mc-strip .vr .tm{font-family:var(--font-mono);font-size:9.5px;color:rgba(255,255,255,.4);margin-top:2px}
.mc-bh{display:flex;align-items:center;gap:10px;margin:22px 0 10px;flex-wrap:wrap}
.mc-bh:first-of-type{margin-top:0}
.mc-bh .no{font-family:var(--font-mono);font-size:10px;font-weight:700;color:var(--accent);background:var(--gold-bg);border:1px solid rgba(201,160,92,.3);border-radius:5px;padding:2px 8px}
.mc-bh .tt{font-size:15px;font-weight:800;color:var(--navy)}
.mc-bh .tt small{font-size:11px;font-weight:600;color:var(--text-sub)}
.mc-bh .agree{margin-left:auto;display:flex;align-items:center;gap:6px}
.mc-bh .agree .num{font-family:var(--font-mono);font-size:11px;font-weight:700;color:var(--accent)}
.mc-dots{display:inline-flex;gap:3px;vertical-align:middle}
.mc-dots i{width:8px;height:8px;border-radius:50%;background:var(--border-lt);display:inline-block}
.mc-dots i.on{background:var(--gold)}
.mc-line{background:var(--bg-section);border:1px solid var(--border-lt);border-left:3px solid var(--gold);border-radius:var(--radius-sm);padding:12px 16px;font-size:14px;line-height:1.8;margin-bottom:8px}
.mc-tag{display:inline-block;font-size:10.5px;font-weight:700;border-radius:4px;padding:1px 7px;margin-right:8px}
.tag-neutral{background:#EEF1F4;color:#565D66}.tag-caution{background:rgba(243,156,18,.12);color:#B8770B}
.tag-positive{background:rgba(39,174,96,.1);color:#1E8A4C}.tag-negative{background:rgba(46,111,216,.1);color:#2E6FD8}
.mc-chips{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:8px}
.mc-chips .cl{font-size:10.5px;font-weight:700}
.cl-ag{color:var(--accent)}.cl-dg{color:var(--danger);margin-left:6px}.cl-nc{color:var(--text-sub);margin-left:6px}
.mc-chip{font-size:10.5px;font-weight:600;border-radius:11px;padding:2px 9px;white-space:nowrap}
.ch-ag{color:#3A4148;background:#fff;border:1px solid var(--border)}
.ch-dg{color:var(--danger);background:rgba(231,76,60,.05);border:1px solid rgba(231,76,60,.35)}
.ch-nc{color:var(--text-sub);background:var(--border-lt);border:1px solid var(--border-lt)}
/* ★ [2026-08] 증권사 칩 접기 */
.mc-fold{margin-top:8px}
.mc-fold summary{list-style:none;cursor:pointer;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:10.5px;font-weight:700;user-select:none;-webkit-user-select:none}
.mc-fold summary::-webkit-details-marker{display:none}
.mc-fold .mc-cara{display:inline-block;font-size:9px;color:var(--text-sub);transition:transform .2s}
.mc-fold[open] .mc-cara{transform:rotate(90deg)}
.mc-fold .mc-hint::after{content:"증권사명 보기";font-size:10px;font-weight:500;color:var(--text-sub)}
.mc-fold[open] .mc-hint::after{content:"접기"}
.mc-fold .mc-chips{margin-top:7px}
/* ★ [2026-08] 블록 배타 아코디언 — 제목줄 상시 노출, 하나 펼치면 나머지 접힘 */
.mc-blk+.mc-blk{margin-top:12px}
.mc-blk>summary{list-style:none;cursor:pointer;user-select:none;-webkit-user-select:none}
.mc-blk>summary::-webkit-details-marker{display:none}
.mc-blk>summary.mc-bh{margin:0}
.mc-blk .mc-arr{margin-left:8px;font-size:11px;color:var(--text-sub);transition:transform .2s}
.mc-blk[open] .mc-arr{transform:rotate(180deg)}
/* ★ [2026-08-10] 2단계 성립: 우세 의견 배지 (컨센서스=골드, 우세=회색 계열) */
.mc-prev-badge{display:inline-block;font-size:10px;font-weight:700;color:#565D66;background:#EEF1F4;border:1px solid #DDE3E9;border-radius:4px;padding:1px 7px;margin-right:6px;vertical-align:1px}
/* ★ [2026-08-10] 참고 언급 종목 (2개사) — 컨센서스 종목보다 옅은 톤 */
.mc-ref-head{margin:12px 0 7px;font-size:11.5px;font-weight:800;color:#8A9098}
.mc-stock.ref{background:#FBFCFD;border-style:dashed}
.mc-stock.ref .smc{color:#8A9098}
/* ★ [2026-08-10] 증권사별 의견 보기 — 블록 하단 접이식 (독립 토글, 기본 접힘) */
.mc-firms-fold{margin-top:11px;border-top:1px dashed var(--border-lt)}
.mc-firms-fold>summary{list-style:none;cursor:pointer;user-select:none;padding:9px 2px 3px;font-size:12px;font-weight:800;color:#96701F;display:flex;align-items:center;gap:6px}
.mc-firms-fold>summary::-webkit-details-marker{display:none}
.mc-firms-fold .ff-cara{font-size:9px;transition:transform .2s}
.mc-firms-fold[open] .ff-cara{transform:rotate(90deg)}
.mc-fbrow{display:flex;gap:9px;align-items:baseline;padding:6px 2px;border-bottom:1px solid #F5F7F9;font-size:12.5px;line-height:1.7}
.mc-fbrow:last-child{border-bottom:none}
.mc-fbrow .fbf{flex:0 0 92px;font-weight:800;color:var(--navy);font-size:12px}
.mc-fbrow .fbd{font-size:10px;font-weight:700;border-radius:4px;padding:1px 6px;white-space:nowrap;align-self:center}
.fbd-up{color:#1E8A4C;background:rgba(39,174,96,.1)}.fbd-neutral{color:#565D66;background:#EEF1F4}.fbd-down{color:#2E6FD8;background:rgba(46,111,216,.1)}
.mc-fbrow .fbt{flex:1;color:#3A4148}
.mc-fbrow.nc .fbf{color:#AEB6BE;font-weight:600}
.mc-fbrow.nc .fbt{color:#AEB6BE;font-style:normal;font-size:11.5px}
.mc-bd{padding-top:10px}
.mc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.mc-gcard{background:var(--bg-section);border:1px solid var(--border-lt);border-radius:var(--radius-sm);padding:13px 15px}
.mc-gcard .gk{font-size:11px;font-weight:700;color:var(--text-sub);display:flex;justify-content:space-between;gap:6px;margin-bottom:5px}
.mc-gcard .gk .gn{font-family:var(--font-mono);font-size:10px;color:var(--accent);background:var(--gold-bg);border-radius:9px;padding:1px 7px;white-space:nowrap}
.mc-gcard .gh{font-size:13px;font-weight:700;color:var(--navy);line-height:1.6;margin-bottom:4px}
.mc-gcard .gd{font-size:12px;color:var(--text-lt);line-height:1.7}
.mc-easy{margin-top:10px;border:1.5px dashed rgba(201,160,92,.45);border-radius:var(--radius-sm);background:#FFFDF8;padding:10px 14px 13px}
.mc-easy .eh{font-size:12px;font-weight:800;color:var(--accent)}
.mc-easy .eh small{float:right;font-size:10px;font-weight:400;color:var(--text-sub)}
.mc-easy .et{font-weight:800;color:var(--navy);font-size:12.5px;margin-top:7px}
.mc-easy .ex{margin-left:12px;font-size:12.5px;color:var(--text-lt);line-height:1.8}
.mc-sectors{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.mc-sector{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--border);border-radius:20px;padding:6px 14px 6px 12px;font-size:12.5px;font-weight:700;color:var(--navy)}
.mc-sector .sc{font-family:var(--font-mono);font-size:10.5px;color:var(--accent);background:var(--gold-bg);border-radius:10px;padding:1px 8px}
.mc-stock{border:1px solid var(--border-lt);border-radius:var(--radius-sm);background:var(--bg-section);padding:13px 16px;margin-bottom:9px}
.mc-stock .sh{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:5px}
.mc-stock .sn{font-size:14px;font-weight:800;color:var(--navy)}
.mc-stock .scd{font-family:var(--font-mono);font-size:10.5px;color:var(--text-sub)}
.mc-stock .smc{margin-left:auto;font-family:var(--font-mono);font-size:11px;font-weight:700;color:var(--accent)}
.mc-stock .sr{font-size:12.5px;line-height:1.75}
.mc-tip{margin-top:16px;padding:12px 15px;border-radius:var(--radius-sm);background:var(--accent-glow);border-left:3px solid var(--accent);font-size:12.5px;color:var(--navy);line-height:1.75}
.mc-fb{font-size:12.5px;color:var(--text-sub);padding:10px 14px;background:var(--bg-section);border-radius:var(--radius-sm)}
.mc-foot{margin-top:16px;padding-top:12px;border-top:1px dashed var(--border)}
.mc-foot .fd{font-size:10.5px;color:var(--text-sub);line-height:1.65}
.mc-foot .fs{text-align:right;font-size:10px;color:#95A5A6;margin-top:6px}
.fallback-card{text-align:center;padding:44px 20px}
.fallback-card .fi{font-size:38px;margin-bottom:12px}
.fallback-card .ft{font-size:14.5px;font-weight:700;color:var(--navy);margin-bottom:6px}
.fallback-card .fx{font-size:12.5px;color:var(--text-sub);line-height:1.8}
.cap-toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--navy);color:#fff;font-size:13px;font-weight:600;padding:11px 20px;border-radius:24px;box-shadow:var(--shadow-md);z-index:99;display:none}
@media(max-width:520px){
  .hd-title{font-size:18px}
  .mc-strip{gap:10px 18px;padding:12px 14px}
  .mc-strip .vl{font-size:13.5px}
  .cap-btn .cap-tx{display:none}
  .cap-btn{padding:0 11px}
  /* ★ [2026-08-10] 날짜 한 행 유지 — 모바일에서 버튼·폰트 축소 */
  .nav-card{padding:9px 10px;gap:5px;flex-wrap:wrap;justify-content:center}   /* ★ [2026-08-11] 넘침 방지 — 공간 부족 시 저장 버튼들이 둘째 줄로 자연 배치 */
  .nav-btn{display:none}   /* ★ [2026-08-11] 모바일: ‹ › 화살표 숨김 — 날짜 탭 목록으로 대체, 저장 3버튼 한 줄 확보 */
  .cap-btn{height:29px;padding:0 8px;font-size:12px}   /* ★ [2026-08-11] 3버튼 모두 보이도록 소폭 축소 */
  .nav-date-main{font-size:13.5px;padding:3px 4px;gap:4px}
  .nav-caret{font-size:9px}
}
</style>
</head>
<body>

<header class="hd">
  <div class="hd-in">
    <div class="hd-top"><a class="hd-back" href="./index.html">← 메인으로</a></div>
    <div class="hd-title">🧭 모닝 컨센서스 <span class="hd-badge">MORNING CONSENSUS</span></div>
    <div class="hd-sub">증권가 아침 리서치 통합 · 매 영업일 오전 발행</div>
  </div>
</header>

<div class="nav-bar">
  <div class="nav-card">
    <button class="nav-btn" id="btnPrev" onclick="navMove(1)" title="이전 영업일">‹</button>
    <div class="nav-date">
      <div class="nav-date-main" id="dateMain" onclick="toggleDateList(event)">날짜 불러오는 중… <span class="nav-caret">▼</span></div>
      <div class="nav-date-sub" id="dateSub"></div>
      <div class="date-list" id="dateList"></div>
    </div>
    <button class="nav-btn" id="btnNext" onclick="navMove(-1)" title="다음 영업일">›</button>
    <button class="cap-btn" id="btnCap" onclick="captureReport()" title="이미지로 저장">📷 <span class="cap-tx">이미지 저장</span></button>
    <button class="cap-btn" id="btnPdf" onclick="downloadPdf()" title="PDF로 저장 (A4)">📄 <span class="cap-tx">PDF</span></button>
    <button class="cap-btn" id="btnHtml" onclick="downloadCustomerHtml()" title="고객에게 보내는 HTML 파일 저장 (상담 Tip 제외 · 명함 헤더 포함)" style="border-color:#C9A05C;background:#FBF5E9;color:#96701F;font-weight:700">👥 <span class="cap-tx">고객용 HTML</span></button>
  </div>
</div>

<div class="wrap">
  <div id="main"><div class="skel"></div></div>
</div>

<div class="cap-toast" id="capToast">이미지를 저장했습니다</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import{getAuth,onAuthStateChanged,setPersistence,browserLocalPersistence}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import{getFirestore,collection,getDocs,query,orderBy,limit,doc,getDoc}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const FC={apiKey:"AIzaSyBD9p-bf162RiiD1Y3BsY-NvbYjpOSrzmg",authDomain:"jarvia-platform.firebaseapp.com",projectId:"jarvia-platform",storageBucket:"jarvia-platform.firebasestorage.app",messagingSenderId:"388025068900",appId:"1:388025068900:web:09ba8e12e9e9e2ec49de71"};
const app=initializeApp(FC);
const auth=getAuth(app);
setPersistence(auth,browserLocalPersistence).catch(()=>{});   /* 메인(index.html)과 동일 저장 방식 — 없으면 로그인 정보를 못 읽음 */
const db=getFirestore(app,'javia-db');

function esc(s){return s?String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'):'';}

let archive=[];   // [{id(=fileDate), status, ko, firmList, totalFirms, collectedAt}] 최신순
let curIdx=0;     // archive 인덱스 (0=최신)

/* ── 데이터 로드: morning_consensus 최근 60건 (done·fallback만 아카이브 편입) ── */
async function loadArchive(){
  try{
    const snap=await getDocs(query(collection(db,'morning_consensus'),orderBy('fileDate','desc'),limit(60)));
    archive=snap.docs.map(d=>({id:d.id,...d.data()})).filter(r=>r.status==='done'||r.status==='fallback');
    if(!archive.length){
      document.getElementById('dateMain').innerHTML='발행 이력 없음';
      document.getElementById('main').innerHTML='<div class="empty"><div class="empty-icon">🧭</div><p>아직 발행된 모닝 컨센서스가 없습니다.<br>매 영업일 오전 9시 전후에 발행됩니다.</p></div>';
      document.getElementById('btnCap').disabled=true;
      return;
    }
    curIdx=0;
    renderDateList();
    show();
  }catch(e){
    console.error('load error:',e);
    document.getElementById('main').innerHTML='<div class="empty"><div class="empty-icon">⚠️</div><p>데이터를 불러올 수 없습니다.<br>잠시 후 다시 시도해 주세요.</p></div>';
  }
}

/* ── 날짜 표시·이동 ── */
const WD=['일','월','화','수','목','금','토'];
function parseYmd(r){   /* 문서 date 필드(YYYY-MM-DD) 우선, 없으면 ID(YYYYMMDD·YYYY-MM-DD 양형식) 파싱 */
  const s=String((r&&r.date)||(r&&r.id)||r||'');
  const m=s.match(/^(\d{4})-?(\d{2})-?(\d{2})$/);
  return m?{y:+m[1],mo:+m[2],d:+m[3]}:null;
}
function fmtDate(r){
  const p=parseYmd(r);
  if(!p)return{main:esc(String((r&&r.id)||'')),dash:String((r&&r.id)||'')};
  const dt=new Date(p.y,p.mo-1,p.d);
  const z=n=>String(n).padStart(2,'0');
  return{main:`${p.y}년 ${p.mo}월 ${p.d}일 (${WD[dt.getDay()]})`,dash:`${p.y}-${z(p.mo)}-${z(p.d)}`};
}
function show(){
  const r=archive[curIdx];
  if(!r)return;
  const f=fmtDate(r);
  document.getElementById('dateMain').innerHTML=`${f.main} <span class="nav-caret">▼</span>`;
  document.getElementById('dateSub').textContent=curIdx===0?'최신 발행분':`${curIdx} 영업일 전`;
  document.getElementById('btnPrev').disabled=curIdx>=archive.length-1;
  document.getElementById('btnNext').disabled=curIdx<=0;
  document.getElementById('btnCap').disabled=!(r.status==='done'&&r.ko);
  renderDateList();
  document.getElementById('main').innerHTML=`<div class="report-card" id="capArea">${renderConsensus(r)}</div>`;
  window.scrollTo({top:0,behavior:'smooth'});
}
function navMove(dir){   /* dir: 1=이전(과거), -1=다음(최신) */
  const ni=curIdx+dir;
  if(ni<0||ni>=archive.length)return;
  curIdx=ni;show();
  closeDateList();
}
function toggleDateList(ev){
  ev.stopPropagation();
  document.getElementById('dateList').classList.toggle('open');
}
function closeDateList(){document.getElementById('dateList').classList.remove('open');}
document.addEventListener('click',e=>{if(!e.target.closest('.nav-date'))closeDateList();});
/* ★ [2026-08-10] 블록 독립 토글 — 배타 아코디언 제거 (KFPC 요청: 전체를 동시에 펼쳐볼 수 있게).
   details 기본 동작만 사용 — 각 블록은 클릭한 것만 열리고 닫히며 서로 영향 없음 */
function renderDateList(){
  const el=document.getElementById('dateList');
  el.innerHTML=archive.map((r,i)=>{
    const f=fmtDate(r);
    const meta=r.status==='fallback'?'발행 보류':`${r.totalFirms||(r.ko&&r.ko.meta&&r.ko.meta.totalFirms)||''}개사`;
    return `<div class="date-item${i===curIdx?' cur':''}${r.status==='fallback'?' fb':''}" onclick="selectDate(${i})"><span>${f.main}</span><span class="di-meta">${esc(String(meta))}</span></div>`;
  }).join('');
}
function selectDate(i){curIdx=i;show();closeDateList();}

/* ── 컨센서스 풀 렌더 (dailyReport renderConsensusSection과 동일 구조 · 컨설턴트 페이지 → 상담 Tip 포함) ── */
function renderConsensus(mc){
  if(mc.status==='fallback'||!mc.ko){
    return `<div class="fallback-card"><div class="fi">🌙</div><div class="ft">오늘은 컨센서스 발행이 보류되었습니다</div><div class="fx">${esc(mc.fallbackText||'증권사 조간 리서치 수집이 기준 수량에 미달하여 정확성을 위해 발행하지 않았습니다.')}<br>다음 영업일에 다시 찾아뵙겠습니다.</div></div>`;
  }
  const d=mc.ko,meta=d.meta||{};
  const N=mc.totalFirms||meta.totalFirms||0;
  const dots=n=>{let h='<span class="mc-dots">';for(let i=0;i<N;i++)h+=`<i${i<n?' class="on"':''}></i>`;return h+'</span>';};
  const tagCls=t=>({neutral:'tag-neutral',caution:'tag-caution',positive:'tag-positive',negative:'tag-negative'}[t]||'tag-neutral');
  const firmChips=it=>{
    const ag=it.agreeFirms||[],dg=it.disagreeFirms||[],nc=it.notCoveredFirms||[];
    if(!ag.length&&!dg.length&&!nc.length)return'';
    /* ★ [2026-08] 증권사 칩 접기 — 기본은 요약 수치, 탭하면 명단 펼침 (📷 캡처는 접힌 상태 그대로) */
    let sum='';
    if(ag.length)sum+=`<span class="cl cl-ag">일치 ${ag.length}</span>`;
    if(dg.length)sum+=`<span class="cl cl-dg">반대 ${dg.length}</span>`;
    if(nc.length)sum+=`<span class="cl cl-nc">미언급 ${nc.length}</span>`;
    let h='<div class="mc-chips">';
    if(ag.length)h+=`<span class="cl cl-ag">일치 ${ag.length}</span>`+ag.map(f=>`<span class="mc-chip ch-ag">${esc(f)}</span>`).join('');
    if(dg.length)h+=`<span class="cl cl-dg">반대 ${dg.length}</span>`+dg.map(f=>`<span class="mc-chip ch-dg">${esc(f)}</span>`).join('');
    if(nc.length)h+=`<span class="cl cl-nc">미언급 ${nc.length}</span>`+nc.map(f=>`<span class="mc-chip ch-nc">${esc(f)}</span>`).join('');
    h+='</div>';
    return `<details class="mc-fold"><summary><span class="mc-cara">▶</span>${sum}<span class="mc-hint"></span></summary>${h}</details>`;
  };
  /* tier별 표시 (2026-08-10 전수 통합): consensus=골드 보더, prevailing=우세 배지+회색 보더, view=중립 보더 무배지 */
  const tierStyle=t=>t==='consensus'?'':t==='prevailing'?'border-left-color:#B8C0C9':'border-left-color:#DDE3E9';
  const clineBox=it=>`<div class="mc-line" style="${tierStyle(it.tier||'view')}">${it.tier==='prevailing'?'<span class="mc-prev-badge">우세</span>':''}<span class="mc-tag ${tagCls(it.tagType)}">${esc(it.tag||'')}</span>${esc(it.text||'')}${firmChips(it)}</div>`;
  /* ★ [2026-08-10] 증권사별 의견 보기 — firmBriefs에서 해당 섹션 필드만 추출해 접이식 표시 */
  const dirBadge=dv=>({up:'<span class="fbd fbd-up">상승</span>',neutral:'<span class="fbd fbd-neutral">중립</span>',down:'<span class="fbd fbd-down">하락</span>'}[dv]||'');
  const firmBriefsFold=(field,withDir)=>{
    /* ★ [2026-08-10] 전원 표시: firmList 순서대로 N개사 모두 — 미커버 회사도 '다루지 않음' 회색 행으로 명시 (미언급도 판단 재료) */
    const byFirm={};(d.firmBriefs||[]).forEach(x=>{if(x&&x.firm)byFirm[x.firm]=x;});
    const firms=mc.firmList||Object.keys(byFirm);
    if(!firms.length)return'';
    const covered=firms.filter(f=>byFirm[f]&&byFirm[f][field]).length;
    return `<details class="mc-firms-fold"><summary><span class="ff-cara">▶</span>증권사별 의견 보기 <span style="font-weight:600;color:var(--text-sub)">(${firms.length}개사 전체 · 이 주제 언급 ${covered}곳)</span></summary>`+
      firms.map(f=>{const x=byFirm[f]||{};const v=x[field];
        return v?`<div class="mc-fbrow"><span class="fbf">${esc(f)}</span>${withDir?dirBadge(x.direction):''}<span class="fbt">${esc(v)}</span></div>`
                :`<div class="mc-fbrow nc"><span class="fbf">${esc(f)}</span><span class="fbt">이 주제는 다루지 않음</span></div>`;}).join('')+`</details>`;
  };
  const easyBox=g=>{
    if(!g||!g.length)return'';
    return `<div class="mc-easy"><div class="eh">📖 쉽게 풀어드려요 <small>투자 입문자용 해설</small></div>`+g.map(x=>`<div class="et">· ${esc(x.term)}</div><div class="ex">${esc(x.explain)}</div>`).join('')+`</div>`;
  };
  /* ★ [2026-08] 블록 아코디언 래퍼 — 제목줄(summary) 상시 노출 + 본문 접기, open=기본 펼침 */
  const blockWrap=(num,title,agreeCount,inner,open)=>`<details class="mc-blk"${open?' open':''}><summary class="mc-bh"><span class="no">${num}</span><span class="tt">${title}</span>${typeof agreeCount==='number'&&N?`<span class="agree">${dots(agreeCount)}<span class="num">${agreeCount}/${N}</span></span><span class="mc-arr">▾</span>`:`<span class="mc-arr" style="margin-left:auto">▾</span>`}</summary><div class="mc-bd">${inner}</div></details>`;
  const fb=t=>`<div class="mc-fb">${esc(t)}</div>`;

  let b='';
  /* ★ [2026-08-10] 안내 배너 넘버링 리디자인 — 내용 동일, 가독성 개선 */
  /* ★ [2026-08-12] 안내 배너 접이식 전환 — 기본 접힘, 클릭 시 펼침 (뷰어·고객용 HTML 공통, 이미지/PDF 캡처는 종전대로 전체 포함) */
  b+=`<details class="mc-banner"><summary class="bn-title"><span class="bn-cara">▶</span><span class="bn-tt">📋 이 자료는 이렇게 만들어집니다</span><span class="bn-hint">펼쳐 보기</span></summary><ol class="bn-list">`
    +`<li><span class="bn-no">1</span><span class="bn-tx">국내 주요 증권사 <b>${N}개사의 조간 리서치 전체</b>를 AI가 분석해 한 장으로 통합합니다.</span></li>`
    +`<li><span class="bn-no">2</span><span class="bn-tx">어떤 회사의 견해도 버리지 않고 취지별로 묶어 <b>다수 견해부터 단독 견해까지 전부</b> 싣습니다.</span></li>`
    +`<li><span class="bn-no">3</span><span class="bn-tx"><b>60% 이상 일치는 '컨센서스'</b>, <b>과반 일치는 '우세'</b> 라벨로 의견의 무게를 표시합니다.</span></li>`
    +`<li><span class="bn-no">4</span><span class="bn-tx">각 블록 하단에서 <b>증권사별 의견 요약</b>을 확인할 수 있습니다.</span></li>`
    +`<li><span class="bn-no">5</span><span class="bn-tx">오늘 증권가의 시각 분포를 파악하고 스스로 투자 스탠스를 정립하시라는 취지이며, <b>최종 판단은 독자의 몫</b>입니다.</span></li>`
    +`<li><span class="bn-no">6</span><span class="bn-tx">게시 전 모든 문장은 <b>서로 다른 3사 AI의 교차 검증</b>을 통과합니다.</span></li>`
    +`</ol><div class="mc-firms"><b style="color:var(--navy)">오늘의 분석 대상 ${N}개사</b> · ${(mc.firmList||[]).map(esc).join(' · ')}</div></details>`;
  /* ★ [2026-08-10] 전일 마감 리뷰 — 8개사 리서치의 전일 시황 종합 (prevDayRecap 도입 이후 발행분만 표시) */
  if(d.prevDayRecap&&d.prevDayRecap.full){
    b+=`<div style="background:#fff;border:1.5px solid #C9A05C;border-radius:14px;padding:15px 17px;margin-bottom:14px;box-shadow:0 3px 12px rgba(201,160,92,.12)">`
      +`<div style="font-size:13.5px;font-weight:800;color:var(--navy);display:flex;align-items:center;gap:7px;margin-bottom:9px">📈 전일 마감 리뷰 <span style="font-size:10.5px;font-weight:700;color:#96701F;background:var(--gold-bg,#FBF7EE);border:1px solid rgba(201,160,92,.35);border-radius:5px;padding:2px 7px">${N}개사 리서치 종합</span></div>`
      +`<div style="font-size:12.5px;color:var(--text,#33393F);line-height:1.8;word-break:keep-all">${esc(d.prevDayRecap.full)}</div>`
      +`</div>`;
  }
  b+=`<div class="mc-strip"><div><div class="lb">오늘의 시장 온도</div><div class="vl">${esc(meta.overallTemp||'')}</div></div><div><div class="lb">오늘의 방향 분포</div><div class="vl">${esc(meta.overallDirection||'')}</div></div><div><div class="lb">일치도</div><div class="vl" style="font-family:var(--font-mono)">${meta.overallAgree||0}<span style="font-size:11px;color:rgba(255,255,255,.6)"> / ${N}개사</span></div></div><div class="vr"><div class="ok"><span>✓</span> 3중 교차검증 통과</div><div class="tm">집계 완료 ${esc(mc.collectedAt||'')} · ${N}개사</div></div></div>`;

  const ol=d.outlook||{};
  let i1=ol.blockFallback?fb(ol.blockFallback):(ol.items||[]).map(clineBox).join('');
  i1+=easyBox(ol.easyGuide);
  i1+=firmBriefsFold('outlook',true);   /* ★ 각사 의견 (방향 배지 포함) */
  b+=blockWrap('01','오늘의 시황전망',ol.agreeCount,i1,true);

  const st=d.strategy||{};
  let i2='';
  if(st.blockFallback){i2=fb(st.blockFallback);}
  else{
    i2=`<div class="mc-grid">`+(st.grid||[]).map(g=>`<div class="mc-gcard"><div class="gk"><span>${g.tier==='prevailing'?'<span class="mc-prev-badge">우세</span>':''}${esc(g.key||'')}</span><span class="gn">${g.agreeCount||0}개사 일치</span></div><div class="gh">${esc(g.headline||'')}</div><div class="gd">${esc(g.detail||'')}</div></div>`).join('')+`</div>`;
    if((st.agreeFirms||[]).length)i2+=firmChips({agreeFirms:st.agreeFirms});
  }
  i2+=easyBox(st.easyGuide);
  i2+=firmBriefsFold('strategy',false);   /* ★ 각사 의견 */
  b+=blockWrap('02','투데이 투자전략',st.agreeCount,i2,false);

  const mt=d.midTerm||{};
  let i3=mt.blockFallback?fb(mt.blockFallback):(mt.items||[]).map(clineBox).join('');
  i3+=easyBox(mt.easyGuide);
  i3+=firmBriefsFold('midTerm',false);   /* ★ 각사 의견 */
  b+=blockWrap('03','시장전망 <small>(주간~월간)</small>',mt.agreeCount,i3,false);

  const sk=d.stocks||{};
  let i4='';
  if(sk.blockFallback){i4=fb(sk.blockFallback);}
  else{
    if((sk.sectors||[]).length)i4+=`<div class="mc-sectors">`+sk.sectors.map(s=>`<span class="mc-sector">${esc(s.name)} <span class="sc">${s.count}개사</span></span>`).join('')+`</div>`;
    i4+=(sk.list||[]).map(s=>`<div class="mc-stock"><div class="sh"><span class="sn">${esc(s.name)}</span><span class="scd">${esc(s.code==='unknown'?'':s.code||'')}</span><span class="smc">${s.mentionCount||0}개사 언급</span></div><div class="sr">${esc(s.reason||'')}</div>${firmChips({agreeFirms:s.mentionFirms||[]})}</div>`).join('');
  }
  /* ★ [2026-08-10] 참고 언급 (2개사) — 컨센서스 종목 폴백 여부와 무관하게 표시 (판단 재료 제공) */
  if((sk.refList||[]).length){
    i4+=`<div class="mc-ref-head">◇ 참고 언급 <small style="font-weight:600">(2개사 공통 — 컨센서스 기준 미달이나 복수 언급된 종목)</small></div>`;
    i4+=sk.refList.map(s=>`<div class="mc-stock ref"><div class="sh"><span class="sn">${esc(s.name)}</span><span class="scd">${esc(s.code==='unknown'?'':s.code||'')}</span><span class="smc">${s.mentionCount||2}개사 언급</span></div><div class="sr">${esc(s.reason||'')}</div>${firmChips({agreeFirms:s.mentionFirms||[]})}</div>`).join('');
  }
  i4+=easyBox(sk.easyGuide);
  b+=blockWrap('04','리서치 다수 언급 기업 <small>(컨센서스 3개사+ · 참고 2개사)</small>',undefined,i4,false);

  /* ★ 상담 활용 Tip — 컨설턴트 전용. 이미지 캡처(고객 공유용)에서는 자동 제외됨 */
  if(d.consultTip)b+=`<div class="mc-tip">💡 <b>상담 활용 Tip</b> · ${esc(d.consultTip)} <span style="display:block;margin-top:5px;font-size:10.5px;color:var(--text-sub)">※ 이 팁은 컨설턴트 전용이며, 📷 이미지 저장 시에는 포함되지 않습니다.</span></div>`;

  b+=`<div class="mc-foot"><div class="fd">※ 본 내용은 각 증권사가 공개 발행한 조간 리서치 전체를 AI가 정보 제공 목적으로 통합·재구성한 것입니다. '컨센서스'(60% 이상 일치)와 '우세'(과반 일치)는 무게 표시 라벨이며, 라벨 없는 항목은 소수·단독 견해입니다. 증권사별 의견 요약은 각사 논지의 재서술로 원문 인용이 아니고, '미언급'은 반대가 아니라 해당 주제를 다루지 않았다는 뜻입니다. 특정 종목의 매수·매도 추천이 아니며, 투자 판단과 책임은 투자자 본인에게 있습니다.</div><div class="fs">집계: ${esc(meta.date||'')} 조간 리서치 ${N}개사 전수 분석 · ${esc(mc.collectedAt||'')} 집계 완료 · 3중 교차검증 통과</div></div>`;

let fcProfile=null;   // {name,company,title,phone,loginId}

  try{
    const us=await getDoc(doc(db,'users',u.uid));
    const lid=us.exists()?(us.data().loginId||''):'';
    if(lid){
      const cs=await getDoc(doc(db,'consultants',lid));
      if(cs.exists()){
        const c=cs.data();
        const p={name:c.name||'',company:c.company||'',title:c.title||'',phone:c.phone||c.mobile||c.tel||'',loginId:lid};   /* ★ [2026-08-11] loginId 포함 — 고객용 HTML의 소개카드·재무상담 버튼 자동 생성 */
        if(p.name){fcProfile=p;try{localStorage.setItem('mc_card',JSON.stringify(p));}catch(_e){}return;}
      }

  }catch(e){console.warn('[profile]',e.message);}
  try{const s=localStorage.getItem('mc_card');if(s)fcProfile=JSON.parse(s);}catch(_e){}
}

function downloadCustomerHtml(){

  }else if(!(fcProfile.loginId||'').trim()){

  }

  const blob=new Blob(['\ufeff'+html],{type:'text/html;charset=utf-8'});

/* 공용 캔버스 생성 — 이미지/PDF가 동일 렌더 파이프라인 사용 (명함 푸터 포함) */
async function buildReportCanvas(){
  const area=document.getElementById('capArea');
  const r=archive[curIdx];
  if(!area||!r||typeof html2canvas==='undefined')return null;
  return await html2canvas(area,{
    scale:2,backgroundColor:'#FFFFFF',useCORS:true,logging:false,windowWidth:1100,   /* ★ [2026-08] 어떤 기기에서 저장해도 PC형 레이아웃으로 캡처 */
    onclone:doc=>{
      const a2=doc.getElementById('capArea');if(a2){a2.style.width='1000px';a2.style.maxWidth='1000px';}
      /* ★ [2026-08-10] 저장물 상단 제목·발행일 헤더 — 화면의 날짜는 nav-bar(캡처 영역 밖)에 있어 이미지·PDF에 날짜가 빠지던 문제 해결 */
      if(a2){
        const f=fmtDate(r);
        const hd=doc.createElement('div');
        hd.style.cssText='display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:2px 2px 14px;margin-bottom:18px;border-bottom:2px solid #C9A05C';
        hd.innerHTML='<div style="font-size:19px;font-weight:800;color:#1E2226;letter-spacing:-.3px">🧭 모닝 컨센서스 <span style="font-size:11px;font-weight:700;color:#96701F;letter-spacing:.6px">MORNING CONSENSUS</span></div>'
          +'<div style="font-size:14.5px;font-weight:800;color:#1E2226;white-space:nowrap">'+esc(f.main)+'</div>';
        a2.insertBefore(hd,a2.firstChild);
      }
      doc.querySelectorAll('details.mc-blk').forEach(el=>el.setAttribute('open',''));   /* 접힘 상태와 무관하게 전 블록 펼쳐 완결형 이미지 */
      /* ★ [2026-08-12] 접이식 배너 — 캡처물은 접힘 상태와 무관하게 종전대로 전체 내용을 정적 div로 포함 */
      doc.querySelectorAll('details.mc-banner').forEach(el=>{const div=doc.createElement('div');div.className='mc-banner';div.innerHTML=el.innerHTML;el.replaceWith(div);});
      doc.querySelectorAll('div.mc-banner > summary').forEach(sm=>{const p=doc.createElement('div');p.className='bn-title';p.textContent='📋 이 자료는 이렇게 만들어집니다';sm.replaceWith(p);});
      /* ★ [2026-08-10] 각사 의견·증권사 칩: html2canvas가 열린 details를 겹쳐 그리는 문제 회피 —
         사용자가 펼쳐둔 것은 정적 div로 변환해 캡처에 포함, 접혀 있던 것은 캡처에서 제외 */
      doc.querySelectorAll('details.mc-firms-fold, details.mc-fold').forEach(el=>{
        if(el.open){const div=doc.createElement('div');div.className=el.className+' as-div';div.innerHTML=el.innerHTML;el.replaceWith(div);}
        else el.remove();
      });
      doc.querySelectorAll('.as-div > summary').forEach(sm=>{const p=doc.createElement('div');p.style.cssText='padding:9px 2px 3px;font-size:12px;font-weight:800;color:#96701F';p.textContent=sm.textContent;sm.replaceWith(p);});
      doc.querySelectorAll('.mc-tip, .mc-cara, .mc-hint, .mc-arr').forEach(el=>el.remove());   /* 컨설턴트 팁·접기 UI 부속 미포함 (일치/반대/미언급 수치는 유지) */
      /* ★ [2026-08-10] 명함 푸터 삽입 (프로필 있을 때만) */
      const ft=cardFooterHTML();
      if(ft&&a2){const w=doc.createElement('div');w.innerHTML=ft;a2.appendChild(w.firstChild);}
    }
  });
}

/* ★ [2026-08-10] 📄 PDF 저장 — A4 세로(210×297mm), 긴 내용 자동 페이지 분할, 명함 푸터 포함 */
async function downloadPdf(){
  if(capturing)return;
  const r=archive[curIdx];if(!r)return;
  const JS=(window.jspdf&&window.jspdf.jsPDF);
  if(!JS){alert('PDF 모듈을 불러오지 못했습니다. 새로고침 후 다시 시도해 주세요.');return;}
  capturing=true;
  const btn=document.getElementById('btnPdf');
  btn.disabled=true;
  try{
    const canvas=await buildReportCanvas();
    if(!canvas)throw new Error('canvas null');
    const pdf=new JS({orientation:'portrait',unit:'mm',format:'a4'});
    const MARGIN=8, pw=210-MARGIN*2, ph=297-MARGIN*2;                       // 인쇄 여백 8mm
    const imgWpx=canvas.width, pageHpx=Math.floor(imgWpx*(ph/pw));          // 한 페이지에 들어갈 원본 px 높이
    /* ★ [2026-08-10] 스마트 페이지 분할 — 페이지 경계에서 위로 최대 35% 범위를 스캔해
       "완전한 흰색 가로줄"(블록 사이 여백, 카드 배경 #FFF)을 찾아 그 지점에서 자른다.
       카드·문단·해설박스 중간이 싹둑 잘리던 문제 해결. 흰 줄이 없으면 기존처럼 기계적 자름(안전망). */
    const srcCtx=canvas.getContext('2d',{willReadFrequently:true});
    const isWhiteRow=y=>{
      const row=srcCtx.getImageData(0,y,imgWpx,1).data;
      for(let x=0;x<imgWpx*4;x+=16){                                        // 매 4px 샘플(점선 테두리도 검출)
        if(row[x]<250||row[x+1]<250||row[x+2]<250)return false;
      }
      return true;
    };
    const findCut=yEnd=>{
      const yMin=yEnd-Math.floor(pageHpx*0.35);
      for(let y=yEnd;y>yMin;y-=2){if(isWhiteRow(y))return y;}
      return yEnd;                                                          // 흰 줄 없음 → 기계적 자름
    };
    let y=0,page=0;
    while(y<canvas.height){
      let sliceH=Math.min(pageHpx,canvas.height-y);
      if(y+sliceH<canvas.height)sliceH=findCut(y+sliceH)-y;                 // 마지막 페이지는 탐색 불필요
      const c2=document.createElement('canvas');
      c2.width=imgWpx;c2.height=sliceH;
      const ctx=c2.getContext('2d');
      ctx.fillStyle='#FFFFFF';ctx.fillRect(0,0,imgWpx,sliceH);
      ctx.drawImage(canvas,0,y,imgWpx,sliceH,0,0,imgWpx,sliceH);
      if(page>0)pdf.addPage();
      pdf.addImage(c2.toDataURL('image/jpeg',0.92),'JPEG',MARGIN,MARGIN,pw,sliceH*(pw/imgWpx));
      y+=sliceH;page++;
    }
    pdf.save(`모닝컨센서스_${fmtDate(r).dash}.pdf`);
    const t=document.getElementById('capToast');
    t.style.display='block';setTimeout(()=>{t.style.display='none';},2200);
  }catch(e){
    console.error('pdf error:',e);
    alert('PDF 저장에 실패했습니다. 잠시 후 다시 시도해 주세요.');
  }finally{
    capturing=false;btn.disabled=false;
  }
}

  if(u){
    try{sessionStorage.removeItem('_mcAutoReload');}catch(_e){}
    loadFcProfile(u);   /* ★ [2026-08-10] 명함 프로필 로드 (비차단 — 캡처 전까지만 완료되면 됨) */
    loadArchive();
  }else{
    /* 오탐 방어: 순간적 null이면 복원 유예 → 로그인 이력 있으면 1회 자동 새로고침 */
    await new Promise(r=>setTimeout(r,1500));if(auth.currentUser)return;
    if(localStorage.getItem('jarvia_hasLogin')==='1'&&!sessionStorage.getItem('_mcAutoReload')){
      sessionStorage.setItem('_mcAutoReload','1');
      console.warn('인증 오탐 감지(로그인 이력 존재) — 자동 새로고침으로 복구 시도');
      location.reload();return;
    }
    document.getElementById('main').innerHTML='<div class="empty"><div class="empty-icon">🔒</div><p>로그인이 필요합니다.<br><a href="./index.html" style="color:var(--accent)">메인으로 이동</a></p></div>';
    document.getElementById('dateMain').textContent='—';
    document.getElementById('btnCap').disabled=true;
  }
});
</script>
