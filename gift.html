<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>자비아 콘텐츠 선물이 도착했어요</title>
<meta name="description" content="보험·재무 컨설턴트를 위한 프리미엄 콘텐츠 플랫폼, 자비아(JARVIA)">
<meta property="og:type" content="website">
<meta property="og:title" content="자비아 콘텐츠 선물이 도착했어요">
<meta property="og:description" content="보험·재무 컨설턴트를 위한 프리미엄 콘텐츠 — 무료 가입하고 선물을 열어보세요">
<meta property="og:image" content="https://jarvia.co.kr/jarvia_share.png">
<meta name="theme-color" content="#0B1B3A">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#FAF8F3}
body{font-family:Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#1A2238;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere}
.wrap{max-width:520px;margin:0 auto;min-height:100vh;background:#FAF8F3}
.top{background:#0B1B3A;color:#fff;padding:calc(14px + env(safe-area-inset-top)) 22px 28px}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.logo{font-size:20px;font-weight:900;letter-spacing:.6px;color:#fff;text-decoration:none}
.login{font-size:13px;color:#AEB6CC;text-decoration:none}
.from{background:rgba(201,164,92,.14);border:1px solid rgba(201,164,92,.45);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:12px}
.av{width:44px;height:44px;border-radius:50%;background:#C9A45C;color:#0B1B3A;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px;flex-shrink:0}
.from .k{font-size:12px;color:#C9A45C;font-weight:700;display:flex;align-items:center;gap:5px}
.from .n{font-size:16px;font-weight:800;margin-top:2px}
.thumb{margin-top:18px;border-radius:14px;overflow:hidden;box-shadow:0 14px 34px rgba(0,0,0,.38);aspect-ratio:16/9;background:#162a52}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.ser{margin-top:18px;font-size:12.5px;color:#C9A45C;font-weight:700;letter-spacing:.2px}
.tt{font-size:22px;font-weight:800;line-height:1.4;margin-top:6px}
.body{padding:24px 22px calc(28px + env(safe-area-inset-bottom))}
.h3{font-size:15.5px;font-weight:800;margin-bottom:10px}
.sum{font-size:15px;line-height:1.85;color:#2A3350;white-space:pre-line}
.list{background:#fff;border:1px solid #ECE6D8;border-radius:14px;margin-top:10px}
.row{display:flex;align-items:center;gap:12px;padding:14px}
.row+.row{border-top:1px solid #F1ECE1}
.ic{width:38px;height:38px;border-radius:10px;background:#0B1B3A;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.row .t{font-size:14.5px;font-weight:700}.row .d{font-size:12.5px;color:#7A8299;margin-top:1px}
.row .lk{margin-left:auto}
.ok{display:flex;align-items:center;gap:8px;font-size:13px;color:#5A6484;margin-top:10px}
.cta{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:56px;margin-top:20px;border-radius:14px;background:linear-gradient(135deg,#D8B56A,#B8903F);color:#0B1B3A;font-size:16.5px;font-weight:800;text-decoration:none;box-shadow:0 10px 22px rgba(184,144,63,.35)}
.sub{display:block;text-align:center;font-size:13.5px;color:#5A6484;margin-top:14px;text-decoration:none}
.sub b{color:#0B1B3A}
.foot{margin-top:30px;padding-top:20px;border-top:1px solid #ECE6D8;text-align:center}
.foot .l{font-size:17px;font-weight:900;color:#0B1B3A;letter-spacing:.6px}
.foot p{font-size:12.5px;color:#7A8299;line-height:1.7;margin-top:6px}
.state{padding:120px 24px;text-align:center;color:#5A6484;font-size:14.5px;line-height:1.8}
.sk{background:linear-gradient(90deg,#1b2d55 0%,#243a6a 50%,#1b2d55 100%);background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="top"><div class="bar"><a class="logo" href="/">JARVIA</a></div><div class="thumb sk"></div><div class="tt" style="opacity:.4;margin-top:18px">선물을 불러오는 중…</div></div>
</div>
<script>
(function(){
  var FN='https://asia-northeast3-jarvia-platform.cloudfunctions.net/giftPreview';
  var GIFT='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#C9A45C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13"/><path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5C11 3 12 8 12 8s1-5 4.5-5a2.5 2.5 0 0 1 0 5"/></svg>';
  var ICONS={
    doc:'<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#C9A45C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h6"/></svg>',
    audio:'<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#C9A45C" stroke-width="1.8" stroke-linecap="round"><path d="M4 15v-3a8 8 0 0 1 16 0v3"/><rect x="3" y="14" width="4" height="6" rx="1.5"/><rect x="17" y="14" width="4" height="6" rx="1.5"/></svg>',
    cards:'<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#C9A45C" stroke-width="1.8"><rect x="3" y="6" width="13" height="15" rx="2"/><path d="M8 3h11a2 2 0 0 1 2 2v13"/></svg>'
  };
  var LOCK='<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#B8AE98" stroke-width="1.9" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';
  var CHECK='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2E7D32" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>';
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function fail(msg){document.getElementById('app').innerHTML='<div class="top"><div class="bar"><a class="logo" href="/">JARVIA</a></div></div><div class="state">'+esc(msg)+'<br><a class="sub" href="/"><b>자비아 둘러보기</b></a></div>';}
  var g=(new URLSearchParams(location.search).get('g')||'').trim();
  if(!/^[A-Za-z0-9_-]{6,20}$/.test(g)){fail('링크가 올바르지 않아요.');return;}
  fetch(FN+'?g='+encodeURIComponent(g)).then(function(r){return r.json();}).then(function(d){
    if(!d||!d.ok){fail((d&&d.error)||'선물을 찾을 수 없어요.');return;}
    var name=(d.sender&&d.sender.name)||'회원';
    var code=(d.sender&&d.sender.code)||'';
    var reg='/?gift='+encodeURIComponent(g)+(code?'&ref='+encodeURIComponent(code):'')+'&page=register';
    var login='/?gift='+encodeURIComponent(g)+'&page=login';
    var date=(d.date||'').replace(/-/g,'.');
    document.title=(d.title||'자비아 콘텐츠')+' — 자비아 선물';
    var DOCD={tax_weekly:'예규 해설 · 계산 예시 · 상담 시나리오',case_report:'고객 상황 분석 · 클로징 화법',master_guide:'주제별 핵심 정리 · 실무 사례',medical_weekly:'병의원 경영 · 세무 포인트'};
    var items=[['doc','콘텐츠 전문',DOCD[d.type]||'핵심 해설 · 실무 정리']];
    if(d.hasAudio)items.push(['audio','오디오 강좌','이동 중에 듣는 해설']);
    if(d.hasCards)items.push(['cards','카드뉴스','고객 설명용 카드']);
    document.getElementById('app').innerHTML=
      '<div class="top"><div class="bar"><a class="logo" href="/">JARVIA</a><a class="login" href="'+login+'">로그인</a></div>'+
      '<div class="from"><div class="av">'+esc(name.slice(0,1))+'</div><div><div class="k">'+GIFT+'선물이 도착했어요</div><div class="n">'+esc(name)+' 컨설턴트님의 선물</div></div></div>'+
      (d.thumb?'<div class="thumb"><img src="'+esc(d.thumb)+'" alt=""></div>':'')+
      '<div class="ser">'+esc(d.series||'')+(date?' · '+esc(date):'')+'</div><h1 class="tt">'+esc(d.title||'')+'</h1></div>'+
      '<div class="body">'+
      (d.summary?'<div class="h3">핵심 요약</div><div class="sum">'+esc(d.summary)+'</div>':'')+
      '<div class="h3" style="margin-top:26px">이 콘텐츠에 담긴 것</div><div class="list">'+
      items.map(function(it){return '<div class="row"><div class="ic">'+ICONS[it[0]]+'</div><div><div class="t">'+it[1]+'</div><div class="d">'+it[2]+'</div></div><div class="lk">'+LOCK+'</div></div>';}).join('')+'</div>'+
      '<div class="ok" style="margin-top:20px">'+CHECK+'무료 가입만 하면 이 콘텐츠를 끝까지 볼 수 있어요</div>'+
      '<div class="ok">'+CHECK+'선물 열람은 한 달 1편, 총 5편 · 연 콘텐츠는 30일 동안 다시 볼 수 있어요</div>'+
      '<a class="cta" href="'+reg+'">'+GIFT.replace(/#C9A45C/g,'#0B1B3A').replace('width="14" height="14"','width="20" height="20"')+'무료 가입하고 선물 열기</a>'+
      '<a class="sub" href="'+login+'">이미 회원이세요? <b>로그인하고 열기</b></a>'+
      '<div class="foot"><div class="l">JARVIA</div><p>보험·재무 컨설턴트를 위한 프리미엄 콘텐츠 플랫폼<br>클로징 리포트 · 택스컨설팅 위클리 · 마스터가이드 · 메디컬 위클리</p></div>'+
      '</div>';
  }).catch(function(){fail('잠시 후 다시 시도해 주세요.');});
})();
</script>
</body>
</html>
