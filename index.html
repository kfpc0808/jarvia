  <style>

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh;-webkit-font-smoothing:antialiased}
.header{position:fixed;top:0;left:0;right:0;z-index:100;background:var(--primary-dk);border-bottom:1px solid rgba(255,255,255,.08)}.header-inner{max-width:1400px;margin:0 auto;padding:0 24px;height:60px;display:flex;align-items:center;justify-content:space-between}.logo{text-decoration:none;display:flex;align-items:baseline;gap:8px}.logo-text{font-family:var(--font-d);font-size:24px;font-weight:800;color:#fff;letter-spacing:-.5px}.logo-sub{font-size:11px;color:rgba(255,255,255,.5);font-weight:300}.header-nav{display:flex;align-items:center;gap:8px}.btn-h{background:none;border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.8);padding:6px 14px;border-radius:6px;cursor:pointer;font-size:13px;transition:var(--tr);font-family:var(--font)}.btn-h:hover{background:rgba(255,255,255,.1);color:#fff}.btn-h-logout{border-color:rgba(231,76,60,.4);color:rgba(231,76,60,.8)}.btn-h-logout:hover{background:rgba(231,76,60,.15);color:#E74C3C}.hdr-name{color:rgba(255,255,255,.9);font-size:13px;font-weight:500;padding:0 4px}.exp-badge{padding:4px 12px;border-radius:20px;font-size:13px;font-weight:600;white-space:nowrap}.exp-ok{background:var(--success);color:#fff}.exp-warn{background:var(--warning);color:#333}.exp-expired{background:var(--danger);color:#fff}.mob-menu-btn{display:none;background:none;border:none;color:#fff;font-size:24px;cursor:pointer}.mob-menu{background:var(--primary-dk);padding:12px 24px 16px;display:flex;flex-direction:column;gap:8px}.mob-menu a{color:rgba(255,255,255,.8);text-decoration:none;padding:8px 0;font-size:14px;border-bottom:1px solid rgba(255,255,255,.05);cursor:pointer}
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(135deg,var(--primary-dk),var(--primary),var(--accent))}.auth-card{background:var(--bg-card);border-radius:var(--radius-lg);padding:40px;width:100%;max-width:420px;box-shadow:var(--shadow-lg)}.auth-logo{font-family:var(--font-d);font-size:32px;font-weight:800;color:var(--primary);text-align:center;margin-bottom:4px}.auth-sub{text-align:center;color:var(--text-lt);font-size:13px;margin-bottom:28px}
.fg{margin-bottom:16px;flex:1}.fg label{display:block;font-size:13px;font-weight:500;color:var(--text);margin-bottom:6px}.fg input,.fg select,.fg textarea{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:8px;font-size:14px;font-family:var(--font);transition:var(--tr);background:#fff;color:var(--text)}.fg input:focus,.fg select:focus,.fg textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}.fg input.ro{background:#f5f5f5;color:#999}.fr{display:flex;gap:16px}
.btn{background:var(--primary);color:#fff;border:none;padding:10px 24px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;transition:var(--tr);font-family:var(--font)}.btn:hover{background:var(--primary-lt);transform:translateY(-1px);box-shadow:var(--shadow)}.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}.btn-full{width:100%}
.container{max-width:1200px;margin:0 auto;padding:80px 24px 40px}.container-sm{max-width:720px}.pg-title{font-size:28px;font-weight:700;color:var(--primary);margin-bottom:24px;padding-bottom:12px;border-bottom:2px solid var(--border-lt)}
.hero{text-align:center;padding:24px 0 32px}.hero h1{font-family:var(--font-d);font-size:36px;font-weight:700;color:var(--primary);margin-bottom:8px}.hero p{color:var(--text-lt);font-size:15px}
.filter-bar{display:flex;gap:12px;margin-bottom:28px;flex-wrap:wrap}.filter-bar input,.filter-bar select{padding:10px 16px;border:1px solid var(--border);border-radius:8px;font-size:14px;font-family:var(--font);background:#fff;flex:1;min-width:180px}.filter-bar input:focus,.filter-bar select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
.sec{margin-bottom:32px}.sec-title{font-size:20px;font-weight:600;color:var(--primary);margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}.card{background:var(--bg-card);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);transition:var(--tr);cursor:pointer;border:1px solid var(--border-lt)}.card:hover{transform:translateY(-4px);box-shadow:0 4px 20px rgba(27,58,92,.15);border-color:var(--accent)}.card-thumb{width:100%;height:160px;background:linear-gradient(135deg,var(--primary),var(--accent));display:flex;align-items:center;justify-content:center;background-size:cover;background-position:center}.card-icon{font-size:40px;color:rgba(255,255,255,.8)}.card-body{padding:16px}.card-body h3{font-size:16px;font-weight:600;margin-bottom:6px;line-height:1.4;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}.card-body p{font-size:13px;color:var(--text-lt);margin-bottom:12px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}.card-foot{display:flex;justify-content:space-between;align-items:center}
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;text-transform:uppercase}.badge-doc{background:#E8F5E9;color:#2E7D32}.badge-ppt{background:#FFF3E0;color:#E65100}.badge-html{background:#E3F2FD;color:#1565C0}.badge-video{background:#FCE4EC;color:#C62828}
.cd h2{font-size:24px;color:var(--primary);margin-bottom:8px}.cd-meta{display:flex;gap:12px;align-items:center;margin-bottom:16px;flex-wrap:wrap}.cd-cat,.cd-date{color:var(--text-lt);font-size:13px}.cd-summary{color:var(--text-lt);margin-bottom:20px;line-height:1.7}.cd-notice{background:#FFF8E1;border-left:4px solid var(--warning);padding:12px 16px;border-radius:4px;font-size:13px;color:#795548;margin-bottom:20px}.cd-actions{display:flex;gap:12px}.fav-btn{background:none;border:1px solid var(--border);padding:10px 20px;border-radius:8px;cursor:pointer;font-size:14px;transition:var(--tr)}.fav-btn.active{border-color:var(--warning);color:var(--warning);background:#FFFDE7}
.viewer-hdr{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;background:var(--primary-dk);color:#fff}.viewer-hdr span{font-size:15px;font-weight:500}.viewer-body{flex:1;overflow:auto;background:#fff;user-select:none;-webkit-user-select:none}.viewer-body iframe{width:100%;height:100%;border:none}
.modal{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center}.mdl-bg{position:absolute;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(4px)}.mdl-box{position:relative;background:var(--bg-card);border-radius:var(--radius-lg);padding:32px;max-width:500px;width:90%;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lg);z-index:1}.mdl-lg{max-width:720px}.mdl-full{width:100vw!important;height:100vh!important;max-width:100vw!important;max-height:100vh!important;border-radius:0!important;display:flex;flex-direction:column}.mdl-x{position:absolute;top:12px;right:16px;background:none;border:none;font-size:28px;color:var(--text-lt);cursor:pointer;z-index:2}
.tbl{width:100%;border-collapse:collapse;font-size:13px}.tbl th{background:var(--primary);color:#fff;padding:10px 12px;text-align:left;font-weight:500;white-space:nowrap}.tbl td{padding:10px 12px;border-bottom:1px solid var(--border-lt)}.tbl tbody tr:hover{background:var(--accent-glow)}.tbl .ov{max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tbl-wrap{overflow-x:auto}.tc{text-align:center}
.tabs{display:flex;gap:4px;margin-bottom:20px;flex-wrap:wrap}.tab{padding:10px 20px;border:none;background:var(--border-lt);border-radius:8px 8px 0 0;cursor:pointer;font-size:14px;font-weight:500;color:var(--text-lt);transition:var(--tr);font-family:var(--font)}.tab.active{background:var(--primary);color:#fff}.tp{min-height:200px}
.info-form{background:var(--bg-card);padding:24px;border-radius:var(--radius);box-shadow:var(--shadow)}.t-free{color:var(--success);font-weight:500}
.exp-card{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:24px;border-radius:var(--radius-lg);margin-bottom:24px;color:#fff}.exp-card-ok{background:linear-gradient(135deg,var(--primary-dk),var(--accent))}.exp-card-exp{background:linear-gradient(135deg,#7f1d1d,var(--danger))}.exp-card span,.exp-card strong{color:#fff}.exp-card strong{font-size:22px;font-weight:700}
.notice-item{background:var(--bg-card);border-radius:var(--radius);padding:16px 20px;margin-bottom:12px;border-left:4px solid var(--accent);cursor:pointer;box-shadow:var(--shadow);transition:var(--tr)}.notice-item:hover{transform:translateX(4px)}.notice-item h3{font-size:16px;margin-bottom:4px}.nd{font-size:12px;color:var(--text-lt)}.nb{padding:16px 0;white-space:pre-wrap;line-height:1.7}
.toast{position:fixed;bottom:32px;left:50%;transform:translateX(-50%);background:var(--primary-dk);color:#fff;padding:12px 28px;border-radius:8px;font-size:14px;z-index:9999;box-shadow:var(--shadow-lg)}.toast-success{background:var(--success)}.toast-error{background:var(--danger)}.toast-warning{background:var(--warning);color:#333}
.hidden{display:none!important}.empty{text-align:center;padding:48px;color:var(--text-lt);font-size:15px}.mt{margin-top:16px}
@media(max-width:768px){.header-nav{display:none}.mob-menu-btn{display:block}.fr{flex-direction:column;gap:0}.auth-card{padding:24px}.hero h1{font-size:24px}.grid{grid-template-columns:1fr}.filter-bar{flex-direction:column}.filter-bar input,.filter-bar select{min-width:100%}.tbl{font-size:12px}.tbl th,.tbl td{padding:8px 6px}.mdl-box{padding:20px}}
  </style>
</head>
<body>

<header id="app-header" class="header hidden">
  <div class="header-inner">
    <a href="#" class="logo" onclick="nav('main')">
      <span class="logo-text">JAVIA</span>
      <span class="logo-sub">Intelligent Advisor</span>
    </a>
    <nav class="header-nav" id="header-nav">
      <span id="hdr-exp" class="exp-badge exp-ok"></span>
      <button class="btn-h" onclick="nav('notices')">공지사항</button>
      <button class="btn-h" onclick="nav('mypage')">마이페이지</button>
      <span id="hdr-name" class="hdr-name"></span>
      <button class="btn-h btn-h-logout" onclick="doLogout()">로그아웃</button>
    </nav>
    <button class="mob-menu-btn" onclick="document.getElementById('mob-menu').classList.toggle('hidden')">☰</button>
  </div>
  <div id="mob-menu" class="mob-menu hidden">
    <span id="mob-exp" class="exp-badge exp-ok"></span>
    <a onclick="nav('main')">메인</a>
    <a onclick="nav('notices')">공지사항</a>
    <a onclick="nav('mypage')">마이페이지</a>
    <a onclick="doLogout()">로그아웃</a>
  </div>
</header>

<section id="pg-login" class="page">
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-logo">JAVIA</div>
      <p class="auth-sub">Just A Rather Very Intelligent Advisor</p>
      <form onsubmit="doLogin(event)">
        <div class="fg"><label>아이디</label><input id="li-id" required placeholder="아이디를 입력하세요"></div>
        <div class="fg"><label>비밀번호</label><input id="li-pw" type="password" required placeholder="비밀번호를 입력하세요"></div>
        <button type="submit" class="btn btn-full">로그인</button>
      </form>
    </div>
  </div>
</section>

<section id="pg-main" class="page hidden">
  <div class="container">
    <div class="hero"><h1>콘텐츠 허브</h1><p>보험·법인영업 컨설팅에 필요한 모든 자료를 한곳에서</p></div>
    <div id="expired-banner" class="hidden" style="background:var(--danger);color:#fff;padding:16px 24px;border-radius:var(--radius);margin-bottom:24px;text-align:center;font-weight:600">⚠️ 이용 기간이 만료되었습니다. 관리자에게 연장을 요청하세요.</div>
    <div class="filter-bar">
      <input id="f-keyword" placeholder="키워드로 검색..." oninput="filterList()">
      <select id="f-cat" onchange="filterList()"><option value="">전체 카테고리</option></select>
      <select id="f-type" onchange="filterList()"><option value="">전체 유형</option><option value="doc">문서</option><option value="ppt">PPT</option><option value="html">HTML</option><option value="video">영상</option></select>
    </div>
    <div id="recent-sec" class="sec hidden"><h2 class="sec-title">최근 열람</h2><div id="recent-grid" class="grid"></div></div>
    <div class="sec"><h2 class="sec-title">전체 콘텐츠</h2><div id="all-grid" class="grid"></div><div id="no-content" class="empty hidden">등록된 콘텐츠가 없습니다.</div></div>
  </div>
</section>

<section id="pg-mypage" class="page hidden">
  <div class="container">
    <h1 class="pg-title">마이페이지</h1>
    <div class="tabs">
      <button class="tab active" data-t="mp-info" onclick="mpTab(this)">내 정보</button>
      <button class="tab" data-t="mp-usage" onclick="mpTab(this)">이용 내역</button>
      <button class="tab" data-t="mp-fav" onclick="mpTab(this)">즐겨찾기</button>
    </div>
    <div id="mp-info" class="tp">
      <div id="mp-exp-card" class="exp-card exp-card-ok"><span>이용 기간</span><strong id="mp-exp">-</strong></div>
      <form class="info-form" onsubmit="doUpdateProfile(event)">
        <div class="fr"><div class="fg"><label>이름</label><input id="mp-name" readonly class="ro"></div><div class="fg"><label>아이디</label><input id="mp-lid" readonly class="ro"></div></div>
        <div class="fr"><div class="fg"><label>소속사</label><input id="mp-comp"></div><div class="fg"><label>직함</label><input id="mp-ttl"></div></div>
        <div class="fr"><div class="fg"><label>연락처</label><input id="mp-phone"></div><div class="fg"><label>이메일</label><input id="mp-email" readonly class="ro"></div></div>
        <div class="fg"><label>주소</label><input id="mp-addr"></div>
        <button type="submit" class="btn">정보 수정</button>
      </form>
    </div>
    <div id="mp-usage" class="tp hidden"><table class="tbl"><thead><tr><th>날짜</th><th>콘텐츠</th></tr></thead><tbody id="tb-usage"></tbody></table></div>
    <div id="mp-fav" class="tp hidden"><div id="fav-grid" class="grid"></div><div id="no-fav" class="empty hidden">즐겨찾기한 콘텐츠가 없습니다.</div></div>
  </div>
</section>

<section id="pg-notices" class="page hidden">
  <div class="container container-sm">
    <h1 class="pg-title">공지사항</h1>
    <div id="notice-list"></div>
  </div>
</section>

<div id="mdl-detail" class="modal hidden">
  <div class="mdl-bg" onclick="closeM('mdl-detail')"></div>
  <div class="mdl-box mdl-lg"><button class="mdl-x" onclick="closeM('mdl-detail')">×</button><div id="detail-inner"></div></div>
</div>
<div id="mdl-viewer" class="modal hidden">
  <div class="mdl-bg"></div>
  <div class="mdl-box mdl-full">
    <div class="viewer-hdr"><span id="v-title"></span><button class="mdl-x" onclick="closeViewer()">×</button></div>
    <div id="v-body" class="viewer-body" oncontextmenu="return false" onselectstart="return false" ondragstart="return false"></div>
  </div>
</div>
<div id="mdl-terms" class="modal hidden">
  <div class="mdl-bg" onclick="closeM('mdl-terms')"></div>
  <div class="mdl-box mdl-lg"><button class="mdl-x" onclick="closeM('mdl-terms')">×</button><div id="terms-body"></div></div>
</div>
<div id="toast" class="toast hidden"></div>

<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import{getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import{getFirestore,collection,doc,getDoc,getDocs,setDoc,updateDoc,deleteDoc,query,where,orderBy,limit,serverTimestamp,increment,Timestamp}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const FC={apiKey:"AIzaSyCf7CsUTgfIWY-RW_mvTJOhczDtk1xM9sA",authDomain:"kfpc-company-support-project.firebaseapp.com",projectId:"kfpc-company-support-project",storageBucket:"kfpc-company-support-project.firebasestorage.app",messagingSenderId:"1012609333373",appId:"1:1012609333373:web:7b6c207c81ff10d156d914",measurementId:"G-CMW6QQ470G"};
const app=initializeApp(FC);
const auth=getAuth(app);
const db=getFirestore(app,'javia-db');

const $=id=>document.getElementById(id);
const gid=()=>Date.now().toString(36)+Math.random().toString(36).substr(2,9);
const fdate=t=>{if(!t)return'-';const d=t.toDate?t.toDate():new Date(t);return d.toLocaleDateString('ko-KR');};
const fdatetime=t=>{if(!t)return'-';const d=t.toDate?t.toDate():new Date(t);return d.toLocaleDateString('ko-KR')+' '+d.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});};
const esc=s=>{if(!s)return'';const d=document.createElement('div');d.textContent=s;return d.innerHTML;};

let _tt;function toast(m,t=''){const e=$('toast');e.textContent=m;e.className='toast'+(t?' toast-'+t:'');e.classList.remove('hidden');clearTimeout(_tt);_tt=setTimeout(()=>e.classList.add('hidden'),3000);}

let me=null,meData=null,allContents=[],allCats=[],myFavSet=new Set(),isExpired=false;

const PAGES=['login','main','mypage','notices'];
function nav(p){PAGES.forEach(x=>$('pg-'+x).classList.add('hidden'));$('pg-'+p).classList.remove('hidden');$('mob-menu').classList.add('hidden');window.scrollTo(0,0);if(p==='main')loadMain();if(p==='mypage')loadMyPage();if(p==='notices')loadNotices();}
function openM(id){$(id).classList.remove('hidden');}
function closeM(id){$(id).classList.add('hidden');}
function mpTab(btn){btn.parentElement.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));btn.classList.add('active');document.querySelectorAll('#pg-mypage .tp').forEach(t=>t.classList.add('hidden'));$(btn.dataset.t).classList.remove('hidden');if(btn.dataset.t==='mp-usage')loadUsage();if(btn.dataset.t==='mp-fav')loadFavorites();}

function typeIcon(t){return{doc:'📄',ppt:'📊',html:'🌐',video:'🎬'}[t]||'📁';}
function typeBadge(t){const l={doc:'문서',ppt:'PPT',html:'HTML',video:'영상'};return`<span class="badge badge-${t}">${l[t]||t}</span>`;}
function cardHTML(c){const th=c.thumbnailUrl?`style="background-image:url('${c.thumbnailUrl}');background-size:cover;background-position:center"`:'';return`<div class="card" onclick="showDetail('${c.contentId}')"><div class="card-thumb" ${th}>${!c.thumbnailUrl?`<span class="card-icon">${typeIcon(c.type)}</span>`:''}</div><div class="card-body"><h3>${esc(c.title)}</h3><p>${esc(c.summary||'')}</p><div class="card-foot">${typeBadge(c.type)}</div></div></div>`;}

// 이용기간 체크
function checkExpiry(){
  if(!meData||!meData.expiresAt)return true;
  const exp=meData.expiresAt.toDate?meData.expiresAt.toDate():new Date(meData.expiresAt);
  const now=new Date();
  isExpired=now>exp;
  const diff=Math.ceil((exp-now)/(1000*60*60*24));
  const expStr=fdate(meData.expiresAt);
  if(isExpired){
    $('hdr-exp').textContent='기간만료';$('hdr-exp').className='exp-badge exp-expired';
    $('mob-exp').textContent='기간만료';$('mob-exp').className='exp-badge exp-expired';
  }else if(diff<=7){
    $('hdr-exp').textContent=expStr+'까지 ('+diff+'일 남음)';$('hdr-exp').className='exp-badge exp-warn';
    $('mob-exp').textContent=diff+'일 남음';$('mob-exp').className='exp-badge exp-warn';
  }else{
    $('hdr-exp').textContent=expStr+'까지';$('hdr-exp').className='exp-badge exp-ok';
    $('mob-exp').textContent=expStr;$('mob-exp').className='exp-badge exp-ok';
  }
  return isExpired;
}

// ═══ AUTH ═══
async function doLogin(e){
  e.preventDefault();
  const lid=$('li-id').value.trim(),pw=$('li-pw').value;
  if(!lid||!pw)return toast('입력값을 확인하세요.','error');
  try{
    toast('로그인 중...');
    // 관리자 체크
    const aSnap=await getDocs(query(collection(db,'admins'),where('loginId','==',lid),limit(1)));
    if(!aSnap.empty){
      const ad=aSnap.docs[0].data();
      if(ad.status!=='active')return toast('정지된 관리자 계정입니다.','error');
      const email=lid+'@javia-admin.internal';
      try{await signInWithEmailAndPassword(auth,email,pw);}
      catch(err){throw err;}
      await updateDoc(aSnap.docs[0].ref,{lastLoginAt:serverTimestamp()});
      window.location.href='admin.html';return;
    }
    // 무료사용자 체크
    const uSnap=await getDocs(query(collection(db,'users'),where('loginId','==',lid),limit(1)));
    if(uSnap.empty)return toast('존재하지 않는 아이디입니다.','error');
    const ud=uSnap.docs[0].data();
    if(ud.status==='suspended')return toast('정지된 계정입니다.','error');
    await signInWithEmailAndPassword(auth,ud.email,pw);
    await updateDoc(uSnap.docs[0].ref,{lastLoginAt:serverTimestamp()});
  }catch(err){
    if(err.code==='auth/wrong-password'||err.code==='auth/invalid-credential')toast('비밀번호가 올바르지 않습니다.','error');
    else if(err.code==='auth/too-many-requests')toast('시도가 너무 많습니다. 잠시 후 다시 시도하세요.','error');
    else toast('로그인 실패: '+err.message,'error');
  }
}
async function doLogout(){await signOut(auth);me=null;meData=null;nav('login');$('app-header').classList.add('hidden');}
async function refreshMe(){if(!me)return;const d=await getDoc(doc(db,'users',me.uid));if(d.exists()){meData=d.data();checkExpiry();}}

let _authWait=false;
onAuthStateChanged(auth,async u=>{
  if(u){
    me=u;
    if(u.email&&u.email.endsWith('@javia-admin.internal')){window.location.href='admin.html';return;}
    let d=await getDoc(doc(db,'users',u.uid));
    if(!d.exists()&&!_authWait){_authWait=true;await new Promise(r=>setTimeout(r,1500));d=await getDoc(doc(db,'users',u.uid));_authWait=false;}
    if(d.exists()){
      meData=d.data();
      if(meData.status==='suspended'){toast('정지된 계정입니다.','error');doLogout();return;}
      $('app-header').classList.remove('hidden');
      $('hdr-name').textContent=meData.name+'님';
      checkExpiry();nav('main');
    }
  }else{me=null;meData=null;$('app-header').classList.add('hidden');nav('login');}
});

// ═══ MAIN PAGE ═══
async function loadMain(){
  try{
    allCats=[];allContents=[];
    const catSnap=await getDocs(query(collection(db,'categories'),where('isActive','==',true),orderBy('sortOrder')));
    allCats=catSnap.docs.map(d=>d.data());
    const cSnap=await getDocs(query(collection(db,'contents'),where('isActive','==',true),orderBy('sortOrder')));
    allContents=cSnap.docs.map(d=>d.data());
    if(me){const fSnap=await getDocs(query(collection(db,'favorites'),where('userId','==',me.uid)));myFavSet=new Set(fSnap.docs.map(d=>d.data().contentId));}
    const sel=$('f-cat');sel.innerHTML='<option value="">전체 카테고리</option>';
    allCats.forEach(c=>{sel.innerHTML+=`<option value="${c.categoryId}">${esc(c.name)}</option>`;});
    if(isExpired){$('expired-banner').classList.remove('hidden');}else{$('expired-banner').classList.add('hidden');}
    await loadRecent();renderGrid(allContents);
  }catch(err){console.error(err);toast('콘텐츠 로딩 실패','error');}
}
function renderGrid(list){const g=$('all-grid'),n=$('no-content');if(!list.length){g.innerHTML='';n.classList.remove('hidden');return;}n.classList.add('hidden');g.innerHTML=list.map(c=>cardHTML(c)).join('');}
function filterList(){const kw=$('f-keyword').value.toLowerCase(),cat=$('f-cat').value,tp=$('f-type').value;let f=allContents;if(kw)f=f.filter(c=>c.title.toLowerCase().includes(kw)||(c.summary||'').toLowerCase().includes(kw));if(cat)f=f.filter(c=>c.categoryId===cat);if(tp)f=f.filter(c=>c.type===tp);renderGrid(f);}
async function loadRecent(){if(!me)return;const snap=await getDocs(query(collection(db,'view_logs'),where('userId','==',me.uid),orderBy('createdAt','desc'),limit(8)));if(snap.empty){$('recent-sec').classList.add('hidden');return;}const seen=new Set(),ids=[];snap.docs.forEach(d=>{const id=d.data().contentId;if(!seen.has(id)){seen.add(id);ids.push(id);}});const items=allContents.filter(c=>ids.includes(c.contentId)).slice(0,4);if(!items.length){$('recent-sec').classList.add('hidden');return;}$('recent-sec').classList.remove('hidden');$('recent-grid').innerHTML=items.map(c=>cardHTML(c)).join('');}

// ═══ DETAIL & VIEW ═══
function showDetail(cid){
  const c=allContents.find(x=>x.contentId===cid);if(!c)return;
  const cat=allCats.find(x=>x.categoryId===c.categoryId);const isFav=myFavSet.has(cid);
  $('detail-inner').innerHTML=`<div class="cd"><h2>${esc(c.title)}</h2><div class="cd-meta">${typeBadge(c.type)} ${cat?`<span class="cd-cat">${esc(cat.name)}</span>`:''} <span class="cd-date">업데이트: ${fdate(c.updatedAt)}</span></div><p class="cd-summary">${esc(c.summary||'')}</p>${isExpired?'<div class="cd-notice">⚠️ 이용 기간이 만료되어 열람할 수 없습니다. 관리자에게 연장을 요청하세요.</div>':''}<div class="cd-actions">${isExpired?'<button class="btn" disabled>기간만료 — 열람불가</button>':`<button class="btn" id="btn-view" onclick="doView('${cid}')">열람하기</button>`}<button class="fav-btn ${isFav?'active':''}" onclick="doFav('${cid}',this)">${isFav?'★ 즐겨찾기 해제':'☆ 즐겨찾기'}</button></div></div>`;
  openM('mdl-detail');
}

let _viewing=false;
async function doView(cid){
  if(_viewing||isExpired)return;_viewing=true;
  const btn=$('btn-view');if(btn){btn.disabled=true;btn.textContent='처리중...';}
  try{
    if(!me||!meData)return toast('로그인이 필요합니다.','error');
    const cDoc=await getDoc(doc(db,'contents',cid));
    if(!cDoc.exists())throw new Error('콘텐츠 없음');
    const cd=cDoc.data();
    // 열람 로그 기록
    const logId=gid();
    await setDoc(doc(db,'view_logs',logId),{logId,userId:me.uid,contentId:cid,createdAt:serverTimestamp()});
    await updateDoc(doc(db,'contents',cid),{viewCount:increment(1)});
    closeM('mdl-detail');
    openViewer(cd.url,cd.title);
  }catch(err){toast('열람 오류: '+err.message,'error');}
  finally{_viewing=false;if(btn){btn.disabled=false;btn.textContent='열람하기';}}
}

function openViewer(url,title){$('v-title').textContent=title||'콘텐츠 열람';$('v-body').innerHTML=`<iframe src="${url}" sandbox="allow-scripts allow-same-origin" style="width:100%;height:100%;border:none"></iframe>`;openM('mdl-viewer');}
function closeViewer(){$('v-body').innerHTML='';closeM('mdl-viewer');}

async function doFav(cid,btn){
  if(!me)return;
  const snap=await getDocs(query(collection(db,'favorites'),where('userId','==',me.uid),where('contentId','==',cid),limit(1)));
  if(snap.empty){
    const fid=gid();await setDoc(doc(db,'favorites',fid),{favoriteId:fid,userId:me.uid,contentId:cid,createdAt:serverTimestamp()});
    myFavSet.add(cid);btn.classList.add('active');btn.textContent='★ 즐겨찾기 해제';toast('즐겨찾기 추가','success');
  }else{
    await deleteDoc(snap.docs[0].ref);
    myFavSet.delete(cid);btn.classList.remove('active');btn.textContent='☆ 즐겨찾기';toast('즐겨찾기 해제');
  }
}

// ═══ MYPAGE ═══
async function loadMyPage(){
  if(!me||!meData)return;await refreshMe();
  const exp=meData.expiresAt?(meData.expiresAt.toDate?meData.expiresAt.toDate():new Date(meData.expiresAt)):null;
  if(isExpired){$('mp-exp-card').className='exp-card exp-card-exp';$('mp-exp').textContent='만료됨 ('+fdate(meData.expiresAt)+')';}
  else if(exp){const diff=Math.ceil((exp-new Date())/(1000*60*60*24));$('mp-exp-card').className='exp-card exp-card-ok';$('mp-exp').textContent=fdate(meData.expiresAt)+' 까지 ('+diff+'일 남음)';}
  else{$('mp-exp').textContent='설정 안됨';}
  $('mp-name').value=meData.name||'';$('mp-lid').value=meData.loginId||'';
  $('mp-comp').value=meData.company||'';$('mp-ttl').value=meData.title||'';
  $('mp-phone').value=meData.phone||'';$('mp-email').value=meData.email||'';
  $('mp-addr').value=meData.address||'';
}
async function doUpdateProfile(e){
  e.preventDefault();
  await updateDoc(doc(db,'users',me.uid),{company:$('mp-comp').value.trim(),title:$('mp-ttl').value.trim(),phone:$('mp-phone').value.trim(),address:$('mp-addr').value.trim(),updatedAt:serverTimestamp()});
  await refreshMe();toast('정보가 수정되었습니다.','success');
}
async function loadUsage(){
  const snap=await getDocs(query(collection(db,'view_logs'),where('userId','==',me.uid),orderBy('createdAt','desc'),limit(50)));
  const logs=snap.docs.map(d=>d.data());
  if(!logs.length){$('tb-usage').innerHTML='<tr><td colspan="2" class="tc">이용 내역이 없습니다.</td></tr>';return;}
  const cMap={};
  for(const l of logs){if(!cMap[l.contentId]){const d=await getDoc(doc(db,'contents',l.contentId));cMap[l.contentId]=d.exists()?d.data().title:l.contentId;}}
  $('tb-usage').innerHTML=logs.map(l=>`<tr><td>${fdatetime(l.createdAt)}</td><td>${esc(cMap[l.contentId])}</td></tr>`).join('');
}
async function loadFavorites(){
  const snap=await getDocs(query(collection(db,'favorites'),where('userId','==',me.uid)));
  const favs=snap.docs.map(d=>d.data());
  if(!favs.length){$('fav-grid').innerHTML='';$('no-fav').classList.remove('hidden');return;}
  $('no-fav').classList.add('hidden');const items=[];
  for(const f of favs){const d=await getDoc(doc(db,'contents',f.contentId));if(d.exists())items.push(d.data());}
  $('fav-grid').innerHTML=items.map(c=>cardHTML(c)).join('');
}

// ═══ NOTICES ═══
async function loadNotices(){
  const snap=await getDocs(query(collection(db,'notices'),where('isActive','==',true),orderBy('createdAt','desc')));
  const list=snap.docs.map(d=>d.data());
  if(!list.length){$('notice-list').innerHTML='<div class="empty">등록된 공지사항이 없습니다.</div>';return;}
  $('notice-list').innerHTML=list.map(n=>`<div class="notice-item" onclick="this.querySelector('.nb').classList.toggle('hidden')"><h3>${esc(n.title)}</h3><span class="nd">${fdate(n.createdAt)}</span><div class="nb hidden">${esc(n.body)}</div></div>`).join('');
}

document.addEventListener('keydown',e=>{if(!$('mdl-viewer').classList.contains('hidden')){if((e.ctrlKey||e.metaKey)&&['s','p','c'].includes(e.key.toLowerCase()))e.preventDefault();}});

window.nav=nav;window.openM=openM;window.closeM=closeM;window.mpTab=mpTab;
window.doLogin=doLogin;window.doLogout=doLogout;
window.showDetail=showDetail;window.doView=doView;window.doFav=doFav;
window.doUpdateProfile=doUpdateProfile;
window.filterList=filterList;window.closeViewer=closeViewer;
window._javiaFC=FC;
</script>
