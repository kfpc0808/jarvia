<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>내 맞춤 자료 | JARVIA</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<!-- ★ [2026-11-05] 내 맞춤 자료 모아보기 — 알림톡 버튼 연결 화면
     · 주소 ?k=날짜YYYYMMDD.uid.서명 → 서버 myPickView 가 서명을 확인하고 그 회원의 맞춤 자료를 돌려준다 (로그인 불필요 · 28일 유효)
     · 코드가 없거나 형식이 다르면 안내 화면 -->
<style>
:root{--navy:#1B2A4A;--blue:#1F4FD8;--ink:#1A2233;--sub:#4A5365;--line:#E4E7EC;--bg:#F5F6F8}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,-apple-system,sans-serif;-webkit-text-size-adjust:100%;word-break:keep-all;overflow-wrap:anywhere}
.wrap{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
header{background:var(--navy);color:#fff;padding:18px 20px 24px}
.brand{font-size:15px;font-weight:800;letter-spacing:.5px}
h1{margin:14px 0 6px;font-size:22px;line-height:1.4;font-weight:800}
.lead{margin:0;font-size:14px;line-height:1.6;color:#C9D2E3}
.field{display:inline-block;margin-top:10px;background:rgba(255,255,255,.12);border-radius:6px;padding:6px 10px;font-size:13px;line-height:1.5;color:#fff;max-width:100%}
main{flex:1;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 16px;min-width:0}
.card h2{margin:0 0 8px;font-size:16px;font-weight:700}
.card p{margin:0;font-size:14px;line-height:1.7;color:var(--sub)}
.badge{display:inline-block;font-size:12px;font-weight:700;color:var(--blue);background:#EAF0FF;border-radius:4px;padding:3px 8px;margin-bottom:10px}
ul.plain{margin:8px 0 0;padding-left:18px;font-size:14px;line-height:1.8;color:var(--sub)}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.item{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line);text-decoration:none;color:inherit;min-width:0}
.list .item:first-child{border-top:0;padding-top:4px}
.tag{flex-shrink:0;font-size:11.5px;font-weight:700;color:#334155;background:#F1F5F9;border-radius:4px;padding:3px 7px;margin-top:2px;white-space:nowrap}
.it-body{flex:1;min-width:0}
.it-title{font-size:15px;font-weight:600;line-height:1.5;color:var(--ink)}
.it-meta{margin-top:3px;font-size:12px;color:#7A8794}
.star{color:var(--blue);font-weight:700}
.arrow{flex-shrink:0;color:#9AA4B2;font-size:18px;line-height:1.3}
.empty{font-size:14px;color:var(--sub);line-height:1.7;padding:6px 0}
.btn{display:flex;align-items:center;justify-content:center;min-height:48px;border-radius:10px;background:var(--blue);color:#fff;font-size:15px;font-weight:700;text-decoration:none;text-align:center;padding:0 12px}
.btn.sec{background:#fff;color:var(--blue);border:1px solid var(--blue)}
.note{font-size:12.5px;color:#7A8794;line-height:1.6;padding:0 4px}
.loading{padding:40px 0;text-align:center;color:var(--sub);font-size:14px}
footer{padding:8px 20px 28px;font-size:12px;color:#7A8794;text-align:center;line-height:1.6}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">JARVIA</div>
    <h1 id="hd-title">내 맞춤 자료</h1>
    <p class="lead" id="hd-lead">회원님이 선택하신 관심 분야에 맞는 자료를 한곳에 모아 보여드리는 화면입니다.</p>
    <div id="hd-field"></div>
  </header>
  <main id="main"><div class="loading">불러오는 중입니다…</div></main>
  <footer>본 화면은 JARVIA 회원 전용 콘텐츠 안내 화면입니다.<br>(주)한국FP센터 · 고객센터 02-567-9295 (평일 09:00~18:00)</footer>
</div>
<script>
(function(){
  var API='https://asia-northeast3-jarvia-platform.cloudfunctions.net/myPickView';
  var HOME='https://jarvia.co.kr/', LOGIN='https://jarvia.co.kr/?page=login';
  var $=function(id){return document.getElementById(id);};
  function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function md(ymd){var p=String(ymd||'').split('-');if(p.length<3)return '';var w=['일','월','화','수','목','금','토'][new Date(Date.UTC(+p[0],+p[1]-1,+p[2])).getUTCDay()];return (+p[1])+'월 '+(+p[2])+'일('+w+')';}
  function btns(){return '<a class="btn" href="'+HOME+'">자비아 바로가기</a><a class="btn sec" href="'+LOGIN+'">로그인하고 콘텐츠 보기</a>';}
  function guide(){   /* 코드 없이 열었을 때 — 기존 안내 화면 */
    $('main').innerHTML='<section class="card"><span class="badge">2026년 11월 27일부터</span><h2>알림톡에서 바로 열리는 맞춤 자료</h2>'
      +'<p>콘텐츠 발행 안내 알림톡의 「내 맞춤 자료 모아보기」 버튼을 누르시면 이곳에서 다음 자료를 바로 보실 수 있습니다.</p>'
      +'<ul class="plain"><li>오늘 발행된 콘텐츠 중 회원님 분야와 맞는 자료</li><li>고객층에 맞는 오늘의 영업주제 카드</li><li>최근 4주간의 지난 맞춤 자료</li></ul></section>'
      +'<section class="card"><h2>관심 분야 설정</h2><p>맞춤 자료는 회원님이 선택하신 주요 고객층·주력 상품군·관심 분야를 기준으로 골라 드립니다. 관심 분야는 자비아 마이페이지에서 언제든지 바꾸실 수 있습니다.</p></section>'+btns();
  }
  function fail(msg){$('main').innerHTML='<section class="card"><h2>열 수 없는 주소입니다</h2><p>'+esc(msg||'잠시 후 다시 시도해 주세요.')+'</p></section>'+btns();}
  function itemHtml(x,showStar){
    var meta=md(x.date)+(showStar&&x.match?' · <span class="star">★ 맞춤</span>':'');
    var inner='<span class="tag">'+esc(x.label)+'</span><span class="it-body"><span class="it-title">'+esc(x.title)+'</span><span class="it-meta" style="display:block">'+meta+'</span></span>';
    return x.url?'<li><a class="item" href="'+esc(x.url)+'">'+inner+'<span class="arrow" aria-hidden="true">›</span></a></li>':'<li><div class="item">'+inner+'</div></li>';
  }
  function render(d){
    var nm=d.name?esc(d.name)+'님의 ':'';
    $('hd-title').innerHTML=nm+'맞춤 자료';
    if(!d.hasNeeds){
      $('hd-lead').textContent='관심 분야를 설정하시면 회원님께 맞는 자료를 골라 보여드립니다.';
      $('main').innerHTML='<section class="card"><h2>관심 분야를 먼저 설정해 주세요</h2><p>자비아에 로그인하신 뒤 마이페이지의 「🎯 관심 분야 (맞춤 자료)」에서 고객층·상품군·관심 분야를 선택하시면, 다음 알림톡부터 맞춤 자료를 함께 안내해 드립니다.</p></section>'+btns();
      return;
    }
    $('hd-lead').textContent=md(d.date)+' 기준으로 회원님 분야에 맞는 자료입니다.';
    if(d.field)$('hd-field').innerHTML='<span class="field">선택하신 분야: '+esc(d.field)+'</span>';
    var today=(d.today||[]), recent=(d.recent||[]);
    var h='<section class="card"><h2>'+esc(md(d.date))+' 자료</h2>';
    h+=today.length?'<ul class="list">'+today.map(function(x){return itemHtml(x,true);}).join('')+'</ul>':'<div class="empty">이날 발행된 자료가 없습니다.</div>';
    h+='</section><section class="card"><h2>최근 4주 맞춤 자료</h2>';
    h+=recent.length?'<ul class="list">'+recent.map(function(x){return itemHtml(x,false);}).join('')+'</ul>':'<div class="empty">최근 4주 안에 회원님 분야와 맞는 자료가 아직 없습니다.</div>';
    h+='</section><p class="note">콘텐츠는 자비아 로그인 후 열립니다. 영업주제 카드는 로그인 없이 바로 열립니다. 관심 분야는 자비아 마이페이지에서 바꾸실 수 있습니다.</p>'+btns();
    $('main').innerHTML=h;
  }
  var k=new URLSearchParams(location.search).get('k')||'';
  if(!/^\d{8}\.[A-Za-z0-9]{10,40}\.[0-9a-f]{16}$/.test(k)){guide();return;}
  var first=true;try{var sk='jv_mp_'+k.slice(-16);first=!sessionStorage.getItem(sk);sessionStorage.setItem(sk,'1');}catch(_e){}
  var ctl=('AbortController' in window)?new AbortController():null;var tm=setTimeout(function(){if(ctl)ctl.abort();},25000);
  fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({data:{k:k,first:first}}),signal:ctl?ctl.signal:undefined})
    .then(function(r){return r.json();})
    .then(function(j){clearTimeout(tm);var d=j&&j.result;if(!d){fail(j&&j.error&&j.error.message);return;}if(!d.ok){fail(d.error);return;}render(d);})
    .catch(function(){clearTimeout(tm);fail('잠시 후 다시 시도해 주세요.');});
})();
</script>
</body>
</html>
