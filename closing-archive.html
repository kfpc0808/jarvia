<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>보험계약 클로징 Report 아카이브</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&family=Noto+Serif+KR:wght@400;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0F2440;--navy-lt:#1E3458;--navy-mid:#2A4670;
  --gold:#C9A84C;--gold-lt:#E0B846;
  --bg:#F7F9FC;--bg-card:#fff;--bg-warm:#F1F5F9;
  --ink:#0F172A;--ink-mid:#334155;--ink-lt:#64748B;--ink-sub:#94A3B8;
  --border:#E2E8F0;--border-lt:#F1F5F9;
  --red:#DC2626;--green:#1a7a4a;--blue:#1565C0;
  --shadow:0 2px 8px rgba(15,36,64,.08);--shadow-md:0 4px 16px rgba(15,36,64,.12);
  --radius:16px;--radius-sm:10px;
  --font:'Noto Sans KR',-apple-system,sans-serif;
  --font-d:'Outfit','Noto Sans KR',sans-serif;
  --font-s:'Noto Serif KR',serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:var(--font);background:var(--bg);color:var(--ink);line-height:1.7;-webkit-font-smoothing:antialiased}

/* ── 헤더 ── */
.hd{background:linear-gradient(135deg,var(--navy),var(--navy-lt));position:relative}
.hd::after{content:'';position:absolute;bottom:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--gold),var(--gold-lt),var(--gold))}
.hd-inner{max-width:860px;margin:0 auto;padding:20px 20px 24px;display:flex;align-items:center;justify-content:space-between}
.hd-badge{font-size:10px;font-weight:800;color:var(--gold-lt);letter-spacing:1px;margin-bottom:2px}
.hd-title{font-family:var(--font-d);font-size:20px;font-weight:800;color:#fff}
.hd-sub{font-size:12px;color:rgba(255,255,255,.5);margin-top:1px}
.hd-back{padding:8px 16px;border-radius:8px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.85);font-size:13px;font-weight:600;text-decoration:none;transition:all .2s;white-space:nowrap}
.hd-back:hover{background:rgba(255,255,255,.2)}

/* ── 탭 ── */
.tab-wrap{max-width:860px;margin:-16px auto 0;padding:0;position:relative;z-index:2}
.tab-inner{background:var(--bg-card);box-shadow:var(--shadow-md);padding:10px 20px;display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tab-inner::-webkit-scrollbar{display:none}
.tab-btn{flex-shrink:0;padding:8px 16px;border-radius:20px;border:1px solid var(--border);background:var(--bg);font-size:13px;font-weight:600;color:var(--ink-lt);cursor:pointer;transition:all .2s;font-family:var(--font);white-space:nowrap}
.tab-btn:hover{border-color:var(--navy);color:var(--navy);background:#E8F0FE}
.tab-btn.active{background:var(--navy);color:#fff;border-color:var(--navy)}

/* ── 검색/필터 바 ── */
.filter-bar{max-width:860px;margin:16px auto 0;padding:0 20px}
.filter-inner{background:var(--bg-card);border-radius:var(--radius-sm);padding:12px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;box-shadow:var(--shadow)}
.filter-inner input{flex:1;min-width:160px;padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-family:var(--font);font-size:13px;color:var(--ink);background:var(--bg)}
.filter-inner input:focus{outline:none;border-color:var(--navy)}
.filter-sel{padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-family:var(--font);font-size:13px;color:var(--ink);background:var(--bg);cursor:pointer}

/* ── 콘텐츠 영역 ── */
.content{max-width:860px;margin:0 auto;padding:16px 20px 80px}
.loading{text-align:center;padding:60px 0;color:var(--ink-lt)}
.spin{width:32px;height:32px;border:3px solid var(--border);border-top:3px solid var(--navy);border-radius:50%;animation:sp .7s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}

/* ── 카드 그리드 ── */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.tw-card{background:var(--bg-card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--border-lt);overflow:hidden;cursor:pointer;transition:all .2s}
.tw-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);border-color:var(--navy-lt)}

/* 카드 헤더 */
.tc-header{padding:14px 16px;background:linear-gradient(135deg,var(--navy),var(--navy-lt));color:#fff;position:relative}
.tc-badge{position:absolute;top:10px;right:12px;font-size:9px;font-weight:800;color:var(--gold-lt);letter-spacing:1px;border:1px solid rgba(224,184,70,.4);padding:2px 6px;border-radius:4px}
.tc-type{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;margin-bottom:6px}
.tc-type.personal{background:rgba(232,240,254,.2);color:#a8d0ff}
.tc-type.corporate{background:rgba(232,245,233,.2);color:#a8e6a3}
.tc-title{font-size:14px;font-weight:700;line-height:1.4;color:#fff;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;padding-right:40px}
.tc-date{font-size:11px;color:rgba(255,255,255,.5);margin-top:6px}

/* 카드 바디 */
.tc-body{padding:12px 16px}
.tc-summary{font-size:12px;color:var(--ink-mid);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tc-formats{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.tc-fmt{font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px}
.tc-fmt.html{background:#EFF6FF;color:var(--blue)}
.tc-fmt.pdf{background:#FEF2F2;color:var(--red)}
.tc-fmt.audio{background:#FAF5FF;color:#6D28D9}

/* ── 상세 모달 ── */
.modal{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center}
.mdl-bg{position:absolute;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(4px)}
.mdl-box{position:relative;background:var(--bg-card);border-radius:var(--radius);padding:28px;max-width:520px;width:92%;max-height:90vh;overflow-y:auto;box-shadow:0 8px 40px rgba(0,0,0,.2);z-index:1}
.mdl-x{position:absolute;top:12px;right:16px;background:none;border:none;font-size:26px;color:var(--ink-lt);cursor:pointer}
.mdl-x:hover{color:var(--ink)}

/* 상세 내용 */
.det-badge{display:inline-block;padding:4px 12px;border-radius:6px;font-size:11px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--navy),var(--navy-lt));letter-spacing:.5px;margin-bottom:12px}
.det-title{font-family:var(--font-s);font-size:18px;font-weight:700;color:var(--ink);line-height:1.4;margin-bottom:10px}
.det-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.det-tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:4px}
.det-tag.personal{background:#E8F0FE;color:#1A5276}
.det-tag.corporate{background:#E8F5E9;color:#1B5E20}
.det-date{font-size:11px;color:var(--ink-sub);margin-left:auto}
.det-summary{font-size:13px;color:var(--ink-mid);line-height:1.7;margin-bottom:16px;padding:10px 14px;background:var(--bg-warm);border-radius:8px;border-left:3px solid var(--gold)}
.det-notice{padding:8px 12px;background:#FFF8E1;border-left:3px solid var(--gold);border-radius:0 6px 6px 0;font-size:12px;color:var(--ink-mid);margin-bottom:12px}
.value-banner{display:flex;gap:11px;align-items:center;background:#0F2440;border-radius:10px;padding:15px 18px;margin:0 0 18px}
.value-banner-ic{color:#C9A84C;font-size:14px;flex-shrink:0}
.value-banner p{margin:0;font-size:14px;line-height:1.6;color:#e8edf5}
.value-banner b{font-weight:600;color:#E5C97A}
.det-value{display:flex;gap:10px;align-items:flex-start;background:#0F2440;border-radius:8px;padding:14px 16px;margin:0 0 14px}
.det-value-ic{color:#C9A84C;font-size:13px;flex-shrink:0;margin-top:3px}
.det-value>span:last-child{font-size:13.5px;line-height:1.6;color:#e8edf5}
.det-value b{font-weight:600;color:#E5C97A}
.det-actions{display:flex;flex-wrap:wrap;gap:8px}
.det-actions>.det-btn{flex:1 1 calc(50% - 4px);min-width:0}
.det-btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;border-radius:10px;font-size:14px;font-weight:600;border:none;cursor:pointer;transition:all .2s;font-family:var(--font)}
.det-btn.primary{background:linear-gradient(135deg,var(--navy),var(--navy-lt));color:#fff}
.det-btn.primary:hover{opacity:.9}
.det-btn.secondary{background:var(--bg-warm);border:1px solid var(--border);color:var(--ink)}
.det-btn.secondary:hover{border-color:var(--navy);color:var(--navy)}
.det-btn.gold{background:linear-gradient(135deg,#8B6914,var(--gold-lt));color:#fff}
.fav-btn{background:none;border:1px solid var(--border);border-radius:8px;padding:8px 16px;font-size:13px;color:var(--ink-lt);cursor:pointer;font-family:var(--font);transition:all .2s;margin-top:4px;width:100%}
.fav-btn:hover,.fav-btn.active{border-color:var(--gold);color:#8B6914}

/* ── 페이저 ── */
.pager{display:flex;justify-content:center;gap:6px;margin-top:24px;flex-wrap:wrap}
.pg-btn{padding:6px 12px;border-radius:8px;border:1px solid var(--border);background:var(--bg-card);font-size:12px;font-weight:600;color:var(--ink-lt);cursor:pointer;transition:all .2s;font-family:var(--font)}
.pg-btn:hover{border-color:var(--navy);color:var(--navy)}
.pg-btn.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.pg-btn:disabled{opacity:.4;cursor:not-allowed}

/* ── 빈 상태 ── */
.empty{text-align:center;padding:60px 20px;color:var(--ink-lt)}
.empty-icon{font-size:48px;margin-bottom:12px}
.empty h3{font-size:18px;color:var(--ink);margin-bottom:6px}

/* ── 토스트 ── */
.hidden{display:none!important}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#1a1a2e;color:#fff;padding:10px 20px;border-radius:10px;font-size:13px;font-weight:600;opacity:0;transition:all .3s;z-index:999;white-space:nowrap;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:520px){
  .hd-inner{flex-direction:column;gap:10px;text-align:center}
  .card-grid{grid-template-columns:1fr}
  .tab-btn{font-size:12px;padding:6px 12px}
  .mdl-box{padding:20px 16px}
  .filter-inner input{flex:1 1 100%;min-width:0}
  .filter-sel{flex:1 1 0;min-width:0}
}
</style>
</head>
<body>

<!-- 헤더 -->
<header class="hd">
  <div class="hd-inner">
    <div>
      <div class="hd-badge">INSURANCE CLOSING REPORT</div>
      <div class="hd-title">클로징 Report 아카이브</div>
      <div class="hd-sub">보험계약 클로징 영업 보고서 · 평일 매일 게시</div>
    </div>
    <a class="hd-back" href="./index.html">← 메인</a>
  </div>
</header>

<!-- 탭 -->
<div class="tab-wrap">
  <div class="tab-inner">
    <button class="tab-btn active" onclick="switchTab('all',this)">📋 전체</button>
    <button class="tab-btn" onclick="switchTab('법인',this)">🏢 법인</button>
    <button class="tab-btn" onclick="switchTab('개인',this)">👤 개인</button>
  </div>
</div>

<!-- 필터 바 -->
<div class="filter-bar">
  <div class="filter-inner">
    <input type="text" id="kw-input" placeholder="제목 또는 내용으로 검색..." oninput="onSearch()">
    <select id="sort-sel" class="filter-sel" onchange="onSearch()">
      <option value="date_desc">발행일 ↓ (최신)</option>
      <option value="date_asc">발행일 ↑ (오래된)</option>
    </select>
  </div>
</div>

<!-- 가치 강조 배너 -->
<div class="value-banner">
  <span class="value-banner-ic">◆</span>
  <p>JARVIA 클로징 Report는 단순 정보 전달을 넘어, 고객의 결정적 니즈를 <b>보험계약·법인 컨설팅 체결</b>로 연결하는 데 초점을 맞춰 설계된 고품격 영업 자료입니다.</p>
</div>

<!-- 콘텐츠 -->
<div class="content">
  <div id="main"><div class="loading"><div class="spin"></div><p>아카이브를 불러오는 중...</p></div></div>
</div>

<!-- 상세 모달 -->
<div class="modal hidden" id="mdl-detail">
  <div class="mdl-bg" onclick="closeDetail()"></div>
  <div class="mdl-box">
    <button class="mdl-x" onclick="closeDetail()">×</button>
    <div id="det-inner"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import{getFirestore,collection,query,where,getDocs,doc,getDoc,setDoc,updateDoc,increment,serverTimestamp}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
import{getAuth,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';

const FC={apiKey:"AIzaSyBD9p-bf162RiiD1Y3BsY-NvbYjpOSrzmg",authDomain:"jarvia-platform.firebaseapp.com",projectId:"jarvia-platform",storageBucket:"jarvia-platform.firebasestorage.app",messagingSenderId:"388025068900",appId:"1:388025068900:web:09ba8e12e9e9e2ec49de71"};
const app=initializeApp(FC);
const db=getFirestore(app,'javia-db');
const auth=getAuth(app);

// ── 전역 상태 ──
let allContents=[];
let filtered=[];
let me=null;
let meData=null;
let myFavSet=new Set();
let curTab='all';
let curPage=1;
const PER=12;

// ── 인증 ──
onAuthStateChanged(auth,async u=>{
  me=u;
  if(u){
    try{
      let snap=await getDoc(doc(db,'users',u.uid));
      if(snap.exists()){meData=snap.data();}
      else{snap=await getDoc(doc(db,'admins',u.uid));if(snap.exists())meData=snap.data();}
      const favSnap=await getDocs(query(collection(db,'favorites'),where('userId','==',u.uid)));
      favSnap.docs.forEach(d=>{if(d.data().contentId)myFavSet.add(d.data().contentId);});
    }catch(e){}
  }
  loadContents();
});

// ── 데이터 로드 (type='case_report' 단일 조건 쿼리 + 클라이언트 필터) ──
async function loadContents(){
  try{
    /* ★ 메인(index.html)과 동일하게 case_reports 컬렉션에서 로드 — 데이터 소스 일치 */
    const snap=await getDocs(collection(db,'case_reports'));
    const isAdminUser=!!(me&&me.email&&me.email.endsWith('@javia-admin.internal'))
                    ||!!(meData&&(meData.role==='admin'||meData.role==='superadmin'));
    let docs=snap.docs.map(d=>{const x=d.data();return{
      id:'cr_'+(x.reportId||d.id),
      contentId:'cr_'+(x.reportId||d.id),
      type:'case_report',
      title:x.title||x.topicLabel||'클로징 Report',
      summary:x.summary||x.topicLabel||'',
      url:(x.step5&&x.step5.htmlUrl)||x.url||'',
      audioUrl:(x.step6&&x.step6.audioMp3Url)||x.audioUrl||'',
      pdfUrl:(x.step5&&x.step5.pdfUrl)||x.pdfUrl||'',
      topicSlug:x.topicSlug||'',
      subType:x.subType||x.corpType||'',
      price:2000,
      isActive:x.isActive!==false,
      adminOnly:x.adminOnly||false,
      createdAt:x.publishedAt||x.createdAt||null
    };});
    docs=docs.filter(c=>c.isActive!==false);
    docs=docs.filter(c=>!c.adminOnly||isAdminUser);
    docs.sort((a,b)=>{
      const at=a.createdAt?.toMillis?a.createdAt.toMillis():0;
      const bt=b.createdAt?.toMillis?b.createdAt.toMillis():0;
      return bt-at;
    });
    allContents=docs;
    console.log('[CR] 클로징리포트:',allContents.length,'건');
    applyFilter();
  }catch(e){
    console.error('[CR] loadContents 실패:',e);
    $('main').innerHTML=`<div class="empty"><div class="empty-icon">⚠️</div><h3>로드 실패</h3><p>${esc(e.message)}</p></div>`;
  }
}

// ── 정렬 기준 날짜 (밀리초) ──
function _ms(c){
  if(c.publishedAt?.toMillis)return c.publishedAt.toMillis();
  if(c.createdAt?.toMillis)return c.createdAt.toMillis();
  return 0;
}

// ── 필터·검색 ──
function applyFilter(){
  const kw=$('kw-input').value.toLowerCase().trim();
  filtered=allContents.filter(c=>{
    if(curTab!=='all'&&(c.subType||'')!==curTab)return false;
    if(kw&&!(c.title||'').toLowerCase().includes(kw)&&!(c.summary||'').toLowerCase().includes(kw))return false;
    return true;
  });
  const sortMode=$('sort-sel')?.value||'date_desc';
  const dir=sortMode.endsWith('_asc')?1:-1;
  filtered.sort((a,b)=>(_ms(a)-_ms(b))*dir);
  curPage=1;
  render();
}

window.switchTab=function(tab,btn){
  curTab=tab;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  if(btn)btn.classList.add('active');
  applyFilter();
  window.scrollTo({top:160,behavior:'smooth'});
};
window.onSearch=function(){applyFilter();};

// ── 렌더링 ──
function render(){
  if(!filtered.length){
    $('main').innerHTML=`<div class="empty"><div class="empty-icon">📋</div><h3>콘텐츠가 없습니다</h3><p>아직 게시된 클로징 Report 가 없습니다.</p></div>`;
    return;
  }
  const total=filtered.length;
  const pages=Math.ceil(total/PER);
  if(curPage>pages)curPage=pages;
  const slice=filtered.slice((curPage-1)*PER,curPage*PER);

  let html=`<div style="font-size:12px;color:var(--ink-sub);margin-bottom:12px">총 ${total}건</div>`;
  html+='<div class="card-grid">';
  for(const c of slice){
    const subType=c.subType||'';
    const subClass=subType==='법인'?'corporate':'personal';
    const hasAudio=!!c.audioUrl;
    const hasPdf=!!c.pdfUrl;
    const dateStr=fdate(c.publishedAt||c.createdAt);
    html+=`<div class="tw-card" onclick="openDetail('${c.contentId||c.id}')">
      <div class="tc-header">
        <div class="tc-badge">보험계약</div>
        <div class="tc-type ${subClass}">${esc(subType||'클로징')}</div>
        <div class="tc-title">${esc(c.title)}</div>
        <div class="tc-date">${dateStr}</div>
      </div>
      <div class="tc-body">
        <div class="tc-summary">${esc(c.summary||'보험계약 클로징 영업 보고서')}</div>
        <div class="tc-formats">
          ${c.url?'<span class="tc-fmt html">HTML</span>':''}
          ${hasPdf?'<span class="tc-fmt pdf">PDF</span>':''}
          ${hasAudio?'<span class="tc-fmt audio">오디오</span>':''}
        </div>
      </div>
    </div>`;
  }
  html+='</div>';

  if(pages>1){
    html+='<div class="pager">';
    html+=`<button class="pg-btn" onclick="goPage(${curPage-1})" ${curPage===1?'disabled':''}>‹</button>`;
    const start=Math.max(1,curPage-2),end=Math.min(pages,curPage+2);
    if(start>1)html+=`<button class="pg-btn" onclick="goPage(1)">1</button>${start>2?'<span style="padding:0 4px;color:var(--ink-sub)">…</span>':''}`;
    for(let i=start;i<=end;i++)html+=`<button class="pg-btn ${i===curPage?'active':''}" onclick="goPage(${i})">${i}</button>`;
    if(end<pages)html+=`${end<pages-1?'<span style="padding:0 4px;color:var(--ink-sub)">…</span>':''}<button class="pg-btn" onclick="goPage(${pages})">${pages}</button>`;
    html+=`<button class="pg-btn" onclick="goPage(${curPage+1})" ${curPage===pages?'disabled':''}>›</button>`;
    html+='</div>';
  }
  $('main').innerHTML=html;
}

window.goPage=function(p){if(p<1)return;curPage=p;render();window.scrollTo({top:200,behavior:'smooth'});};

// ── 상세 모달 ──
window.openDetail=function(cid){
  const c=allContents.find(x=>(x.contentId||x.id)===cid);
  if(!c)return;
  if(!me){toast('로그인이 필요합니다.');return;}

  const subType=c.subType||'';
  const subClass=subType==='법인'?'corporate':'personal';
  const hasAudio=!!c.audioUrl;
  const hasPdf=!!c.pdfUrl;
  const isFav=myFavSet.has(cid);
  const dateStr=fdate(c.publishedAt||c.createdAt);

  $('det-inner').innerHTML=`
    <div class="det-badge">INSURANCE CLOSING REPORT</div>
    <div class="det-title">${esc(c.title)}</div>
    <div class="det-meta">
      <span class="det-tag ${subClass}">${esc(subType||'클로징')}</span>
      <span class="det-date">${dateStr}</span>
    </div>
    <div class="det-summary">${esc(c.summary||'보험계약 클로징 영업 보고서')}</div>
    <div class="det-value"><span class="det-value-ic">◆</span><span>이 Report는 각 사례의 핵심 페인포인트를 정확히 짚어, 고객이 <b>보험계약·법인 컨설팅의 필요성을 스스로 납득</b>하도록 정교하게 구성했습니다. 클로징의 마지막 한 걸음을 위한 고품격 자료입니다.</span></div>
    <div class="det-actions">
      ${c.url?`<button class="det-btn primary" onclick="crOpen('${cid}','html')">📄 HTML 열람</button>`:''}
      ${hasPdf?`<button class="det-btn gold" onclick="crOpen('${cid}','pdf')">📑 PDF 보기</button>`:''}
      ${hasAudio?`<button class="det-btn secondary" onclick="crOpen('${cid}','audio')">🎧 오디오 듣기</button>`:''}
    </div>
    <button class="fav-btn ${isFav?'active':''}" onclick="doFav('${cid}',this)">${isFav?'★ 즐겨찾기 해제':'☆ 즐겨찾기'}</button>
  `;
  document.getElementById('mdl-detail').classList.remove('hidden');
};

// ── 열람 (무료 — 결제 게이트 없음, 조회 로그만 기록) ──
window.crOpen=async function(cid,action){
  const c=allContents.find(x=>(x.contentId||x.id)===cid);if(!c)return;
  if(me){
    try{await setDoc(doc(db,'view_logs',gid()),{logId:gid(),userId:me.uid,contentId:cid,price:0,txId:'free',createdAt:serverTimestamp()});}catch(e){}
    try{await updateDoc(doc(db,'contents',cid),{viewCount:increment(1)});}catch(e){}
  }
  if(action==='html')openHtmlViewer(cid);
  else if(action==='pdf')window.open(c.pdfUrl,'_blank');
  else if(action==='audio')openAudio(cid);
};

window.closeDetail=function(){document.getElementById('mdl-detail').classList.add('hidden');};

// ── 즐겨찾기 ──
window.doFav=async function(cid,btn){
  if(!me){toast('로그인이 필요합니다.');return;}
  try{
    if(myFavSet.has(cid)){
      myFavSet.delete(cid);
      btn.textContent='☆ 즐겨찾기';btn.classList.remove('active');
      toast('즐겨찾기에서 제거했습니다.');
    }else{
      myFavSet.add(cid);
      btn.textContent='★ 즐겨찾기 해제';btn.classList.add('active');
      await setDoc(doc(db,'favorites',me.uid+'_'+cid),{userId:me.uid,contentId:cid,createdAt:serverTimestamp()},{merge:true});
      toast('즐겨찾기에 추가했습니다.');
    }
  }catch(e){toast('처리 실패: '+e.message);}
};

// ── HTML 풀스크린 뷰어 (iframe) ──
window.openHtmlViewer=function(cid){
  const c=allContents.find(x=>(x.contentId||x.id)===cid);
  if(!c||!c.url)return;
  closeDetail();
  const old=document.getElementById('cr-html-viewer');if(old)old.remove();
  const wrap=document.createElement('div');
  wrap.id='cr-html-viewer';
  wrap.style.cssText='position:fixed;inset:0;z-index:400;background:#fff;display:flex;flex-direction:column';
  wrap.innerHTML=`
    <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:linear-gradient(135deg,#0F2440,#1E3458);flex-shrink:0">
      <div style="flex:1;min-width:0;font-size:13px;font-weight:700;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(c.title)}</div>
      <button onclick="document.getElementById('cr-html-viewer').remove()" style="background:rgba(255,255,255,.15);border:none;color:#fff;font-size:20px;width:36px;height:36px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-left:12px">×</button>
    </div>
    <iframe src="${c.url}" style="flex:1;width:100%;border:none" allowfullscreen></iframe>`;
  document.body.appendChild(wrap);
};

// ── 오디오 플레이어 ──
window.openAudio=function(cid){
  const c=allContents.find(x=>(x.contentId||x.id)===cid);
  if(!c||!c.audioUrl)return;
  closeDetail();
  const old=document.getElementById('cr-audio-modal');if(old)old.remove();
  const wrap=document.createElement('div');
  wrap.id='cr-audio-modal';
  wrap.style.cssText='position:fixed;inset:0;z-index:300;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.6)';
  wrap.innerHTML=`
    <div style="width:100%;max-width:520px;background:#fff;border-radius:20px 20px 0 0;padding:24px 20px 36px;box-shadow:0 -8px 40px rgba(0,0,0,.2)">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
        <div>
          <div style="font-size:10px;font-weight:800;color:#C9A84C;letter-spacing:1px;margin-bottom:2px">INSURANCE CLOSING REPORT</div>
          <div style="font-size:14px;font-weight:700;color:#1a1a2e;line-height:1.3;max-width:340px">${esc(c.title)}</div>
        </div>
        <button onclick="document.getElementById('cr-audio-modal').remove()" style="background:none;border:none;font-size:24px;color:#999;cursor:pointer;padding:4px">×</button>
      </div>
      <audio id="cr-audio-el" src="${c.audioUrl}" preload="metadata" style="display:none"></audio>
      <div style="margin-bottom:10px">
        <input id="cr-seek" type="range" min="0" max="100" value="0"
          style="width:100%;height:40px;cursor:pointer;accent-color:#0F2440;-webkit-appearance:none;appearance:none;background:transparent"
          oninput="crSeek(this.value)" ontouchstart="event.stopPropagation()">
        <style>#cr-seek::-webkit-slider-runnable-track{height:8px;background:linear-gradient(to right,#0F2440 var(--pct,0%),#e0ddd6 var(--pct,0%));border-radius:4px}#cr-seek::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#0F2440;margin-top:-10px;box-shadow:0 2px 6px rgba(0,0,0,.3)}#cr-seek::-moz-range-track{height:8px;background:#e0ddd6;border-radius:4px}#cr-seek::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:#0F2440;border:none}</style>
        <div style="display:flex;justify-content:space-between;font-size:12px;color:#888;margin-top:2px">
          <span id="cr-cur">0:00</span><span id="cr-dur">0:00</span>
        </div>
      </div>
      <div style="display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:16px">
        <button onclick="crSkip(-15)" style="background:#f2f0eb;border:none;width:44px;height:44px;border-radius:50%;font-size:18px;cursor:pointer" title="-15초">⏮</button>
        <button id="cr-play-btn" onclick="crToggle()" style="background:#0F2440;border:none;width:60px;height:60px;border-radius:50%;font-size:24px;cursor:pointer;color:#fff">▶</button>
        <button onclick="crSkip(15)" style="background:#f2f0eb;border:none;width:44px;height:44px;border-radius:50%;font-size:18px;cursor:pointer" title="+15초">⏭</button>
      </div>
      <div style="display:flex;justify-content:center;gap:6px">
        ${['0.75','1','1.25','1.5','2'].map(s=>`<button onclick="crSpeed(${s},this)" style="padding:6px 12px;border-radius:16px;border:1px solid #e0ddd6;background:${s==='1'?'#0F2440':'#fff'};color:${s==='1'?'#fff':'#666'};font-size:12px;font-weight:600;cursor:pointer">${s}x</button>`).join('')}
      </div>
    </div>`;
  document.body.appendChild(wrap);
  wrap.addEventListener('click',e=>{if(e.target===wrap)wrap.remove();});

  const audio=document.getElementById('cr-audio-el');
  const seek=document.getElementById('cr-seek');
  function fmt(s){const m=Math.floor(s/60),sec=Math.floor(s%60);return m+':'+String(sec).padStart(2,'0');}
  audio.addEventListener('loadedmetadata',()=>{document.getElementById('cr-dur').textContent=fmt(audio.duration);});
  audio.addEventListener('timeupdate',()=>{
    if(!audio.duration)return;
    const pct=(audio.currentTime/audio.duration)*100;
    seek.value=pct;seek.style.setProperty('--pct',pct+'%');
    document.getElementById('cr-cur').textContent=fmt(audio.currentTime);
  });
  audio.addEventListener('ended',()=>{document.getElementById('cr-play-btn').textContent='▶';});
  window.crToggle=function(){if(audio.paused){audio.play();document.getElementById('cr-play-btn').textContent='⏸';}else{audio.pause();document.getElementById('cr-play-btn').textContent='▶';}};
  window.crSkip=function(sec){audio.currentTime=Math.max(0,Math.min(audio.duration||0,audio.currentTime+sec));};
  window.crSeek=function(val){if(audio.duration)audio.currentTime=(val/100)*audio.duration;};
  window.crSpeed=function(rate,btn){audio.playbackRate=rate;document.querySelectorAll('#cr-audio-modal button[onclick^="crSpeed"]').forEach(b=>{b.style.background='#fff';b.style.color='#666';});btn.style.background='#0F2440';btn.style.color='#fff';};
  audio.play().then(()=>{document.getElementById('cr-play-btn').textContent='⏸';}).catch(()=>{});
};

// ── 유틸 ──
function $(id){return document.getElementById(id);}
function esc(s){return s?String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'):''}
function gid(){return Math.random().toString(36).slice(2)+Date.now().toString(36);}
function fdate(ts){
  if(!ts)return '';
  try{const d=ts.toDate?ts.toDate():new Date(ts);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
  catch(e){return String(ts).slice(0,10);}
}
let _toastTimer;
function toast(msg){
  const el=$('toast');if(!el)return;
  el.textContent=msg;el.classList.add('show');
  clearTimeout(_toastTimer);_toastTimer=setTimeout(()=>el.classList.remove('show'),3000);
}
</script>
</body>
</html>
