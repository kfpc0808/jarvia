<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1B3A5C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>업무일지 — JARVIA</title>
<!-- ═══════════════════════════════════════════════════════════
     📋 업무일지 (독립 프로그램) — 2026-08-26
     · 저장: javia-db / fc_activities (본인 uid 전용, 보안규칙 배포됨)
     · 고객: fc_clients 연동 (생년월일 보완 → 생일·상령일 자동 관리 합류)
     · 게이트: WL_ALLOWED 5등급 + WL_TEST_IDS(테스트: gildong)
     · 진입: index.html 퀵버튼 → 이동 / 직접 URL / 홈 화면 추가
     ═══════════════════════════════════════════════════════════ -->
<style>
:root{--navy:#1B3A5C;--navy2:#12507A;--ink:#1B2A44;--sub:#5A6478;--mut:#8A93A6;--line:#E2E8F0;--bg:#F4F6FA;--card:#fff;--blue:#0C447C;--blueBg:#E9F2FE;--amber:#633806;--amberBg:#FDF3DC;--green:#0F5132;--greenBg:#E7F6EC;--purp:#5B3A82;--purpBg:#EFE7F6;--red:#C0392B;--redBg:#FDECEC}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif;color:var(--ink)}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:16px}   /* ★ 16px = iOS 자동 확대 방지 */
mark{background:#FFF3BF;border-radius:2px;padding:0 1px}

/* ── 상단 고정 헤더 ── */
.hd{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;gap:6px;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top,0px));background:var(--navy);color:#fff}
.hd .bk{background:none;border:none;color:#fff;font-size:14.5px;padding:8px 10px;display:none;font-weight:600}
.hd .tt{flex:1;font-size:16px;font-weight:800;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hd .hm{background:rgba(255,255,255,.14);border:none;color:#fff;font-size:12px;font-weight:700;padding:8px 12px;border-radius:16px}
.hd.sub .bk{display:block}
.hd.sub .hm{display:none}

/* ── 본문 ── */
#bd{max-width:640px;margin:0 auto;padding:calc(62px + env(safe-area-inset-top,0px)) 14px calc(96px + env(safe-area-inset-bottom,0px))}

/* ── 게이트 화면 ── */
.gate{text-align:center;padding:80px 24px}
.gate .ic{font-size:44px}
.gate h2{font-size:17px;margin:14px 0 8px}
.gate p{font-size:13.5px;color:var(--sub);line-height:1.7;margin:0 0 22px}
.gate button{padding:13px 30px;border:none;border-radius:11px;background:var(--navy);color:#fff;font-size:15px;font-weight:800}

/* ── 하단 고정 새 기록 버튼 ── */
#fab{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:10px 14px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 40%);max-width:640px;margin:0 auto;display:none}
#fab button{width:100%;padding:15px;border:none;border-radius:13px;background:var(--navy);color:#fff;font-size:16px;font-weight:800;box-shadow:0 4px 14px rgba(27,58,92,.28)}

/* ── 목록 ── */
.toolbar{display:grid;grid-template-columns:1fr 118px;gap:7px;margin-bottom:8px}
.toolbar input,.toolbar select{padding:11px 12px;border:1px solid #D8DEE8;border-radius:10px;background:#fff;width:100%;color:var(--ink)}
.frow{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.frow::-webkit-scrollbar{display:none}
.flab{font-size:11px;color:var(--mut);flex-shrink:0;align-self:center}
.chip{padding:9px 15px;border-radius:18px;font-size:13px;background:#fff;border:1px solid #D8DEE8;color:var(--sub);white-space:nowrap;flex-shrink:0;min-height:38px}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:700}
.cnt{font-size:11.5px;color:var(--mut);margin:4px 2px 10px}
.item{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:13px 14px;margin-bottom:9px}
.item:active{background:#F0F4FA}
.ir{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.dt{font-size:12px;color:var(--mut);flex-shrink:0}
.nm{font-size:14.5px;font-weight:700;color:var(--ink);text-decoration:underline;text-decoration-color:#C9D4E4;text-underline-offset:3px;padding:2px 0}
.bg{font-size:11px;font-weight:700;padding:3px 8px;border-radius:5px}
.bprod{background:var(--blueBg);color:var(--blue)}
.bstage{background:var(--amberBg);color:var(--amber)}
.bcorp{background:var(--purpBg);color:var(--purp)}
.bnew{background:var(--greenBg);color:var(--green)}
.meta{font-size:11.5px;color:var(--mut);margin-left:auto;flex-shrink:0}
.sum{margin-top:6px;font-size:13px;color:var(--sub);line-height:1.65;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sum.full{display:block;-webkit-line-clamp:unset;overflow:visible}
.nxt{margin-top:6px;font-size:12px;color:var(--blue)}
.nxt.over{color:var(--red);font-weight:700}
.empty{padding:52px 16px;text-align:center;color:var(--mut);font-size:14px;line-height:1.8}
.empty b{color:var(--ink)}

/* ── 폼 ── */
.ct{display:flex;gap:7px;margin-bottom:15px}
.ct button{flex:1;padding:12px;border-radius:11px;border:1px solid #D8DEE8;background:#fff;color:var(--sub);font-size:14.5px}
.ct button.on{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:800}
.fg{margin-bottom:15px}
.fg>label{display:flex;align-items:center;font-size:13px;font-weight:700;color:#2A3444;margin-bottom:7px}
.fg>label i{color:var(--red);font-style:normal;margin-left:3px}
.fg>label small{font-weight:400;color:var(--mut);font-size:11px;margin-left:6px}
.fg input,.fg select,.fg textarea{width:100%;padding:12px 13px;border:1px solid #D8DEE8;border-radius:10px;background:#fff;color:var(--ink)}
.fg textarea{min-height:104px;resize:vertical;line-height:1.7}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.hint{margin-top:6px;font-size:11.5px;color:var(--mut);line-height:1.6}
textarea.ag{overflow:hidden;min-height:48px}
#fSum.ag{min-height:104px}
.pickbtn{width:100%;padding:12px 13px;border:1px solid #D8DEE8;border-radius:10px;background:#fff;color:var(--ink);font-size:16px;text-align:left;display:flex;align-items:center;gap:6px}
.pickbtn span{margin-left:auto;color:var(--mut);font-size:13px}
.pickbtn.ph{color:var(--mut)}
#ckOv{position:fixed;inset:0;z-index:80;background:rgba(15,23,40,.45);display:none;align-items:flex-end;justify-content:center}
#ckOv.show{display:flex}
.ckP{background:#fff;width:100%;max-width:640px;border-radius:16px 16px 0 0;max-height:78vh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px);animation:ckUp .18s ease}
@keyframes ckUp{from{transform:translateY(24px);opacity:.6}}
.ckH{display:flex;align-items:center;padding:14px 16px 11px;font-weight:800;font-size:15px;border-bottom:1px solid var(--line);flex-shrink:0}
.ckH button{margin-left:auto;background:none;border:none;font-size:17px;color:var(--mut);padding:4px 8px}
.ckL{overflow-y:auto;padding:2px 0 10px;-webkit-overflow-scrolling:touch}
.ckG{font-size:11px;font-weight:800;color:var(--mut);background:var(--bg);padding:8px 16px 6px;position:sticky;top:0}
.ckI{padding:12px 16px;font-size:14.5px;color:var(--ink);display:flex;align-items:center;border-bottom:1px solid #F1F4F9}
.ckI:active{background:#F0F4FA}
.ckI.on{color:var(--navy);font-weight:800}
.ckI.on::after{content:'✓';margin-left:auto;color:var(--navy)}
#enrich{background:#FBF6EA;border:1px solid #EAD9AE;border-radius:11px;padding:11px 13px;margin-bottom:15px;font-size:12.5px;color:#5A4A1E;display:none}
.enr{line-height:1.75}
.enr+.enr{margin-top:5px}
.enr.miss{color:#8A5A00;font-weight:600}
.enfill{display:flex;gap:6px;margin-top:6px;align-items:center}
.enfill input{flex:1;max-width:190px;padding:9px 10px;border:1px solid #D8C48A;border-radius:8px;font-size:14px}
.sbtn{border:none;background:var(--navy);color:#fff;font-size:12.5px;font-weight:700;padding:9px 14px;border-radius:9px;flex-shrink:0}
.save{width:100%;padding:15px;border:none;border-radius:12px;background:var(--navy);color:#fff;font-size:16px;font-weight:800;margin-top:4px}
.del{width:100%;margin-top:9px;padding:12px;border:1px solid #F0C4C4;border-radius:12px;background:#fff;color:var(--red);font-size:13px}

/* ── 고객 이력 ── */
.ch{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px;margin-bottom:10px;position:relative}
.chNm{font-size:19px;font-weight:800}
.chSub{font-size:12px;color:var(--mut);font-weight:400;margin-left:5px}
.chBgs{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.newbtn{position:absolute;top:14px;right:14px}
.note{background:#FBF6EA;border:1px solid #EAD9AE;border-radius:12px;padding:11px 13px;margin-bottom:10px;font-size:12.5px;color:#5A4A1E}
.note b{font-size:11.5px}
.note textarea{width:100%;margin:7px 0;padding:10px 11px;border:1px solid #E3D4A4;border-radius:9px;font-size:14px;min-height:52px;resize:vertical;line-height:1.65;background:#fff}
.note.miss{background:var(--redBg);border-color:#F0C4C4;color:#8B1A1A}
.pend{background:var(--redBg);border:1px solid #F0C4C4;border-radius:12px;padding:11px 13px;margin-bottom:10px;font-size:13px;color:#6B1515}
.pend b{font-size:11.5px;color:#8B1A1A}
.prow{display:flex;gap:9px;align-items:flex-start;margin-top:8px;line-height:1.6}
.prow input{width:19px;height:19px;margin-top:1px;flex-shrink:0}
.prow span{color:#B35555;font-size:11.5px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px;margin-bottom:14px}
.stats>div{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:10px 12px}
.stats span{display:block;font-size:10.5px;color:var(--mut)}
.stats b{font-size:12.5px}
.tlh{font-size:14px;font-weight:800;margin:4px 0 10px}
.tlh span{font-weight:400;font-size:11px;color:var(--mut)}
.tl{border-left:2px solid #C9D4E4;padding-left:14px;display:flex;flex-direction:column;gap:14px}
.tli{position:relative}
.tli::before{content:'';position:absolute;left:-19px;top:6px;width:8px;height:8px;border-radius:50%;background:var(--navy)}
.elink{border:none;background:none;color:#2E86AB;font-size:12px;padding:4px;flex-shrink:0}

/* ── 토스트 ── */
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:99;background:rgba(20,28,42,.92);color:#fff;font-size:13.5px;padding:11px 20px;border-radius:22px;max-width:86vw;text-align:center;opacity:0;pointer-events:none;transition:opacity .25s}
#toast.show{opacity:1}

@media(min-width:641px){body{background:#E9EDF3}#bd,#fab{max-width:640px}.hd{max-width:640px;left:50%;transform:translateX(-50%)}}
</style>
</head>
<body>

<div class="hd" id="hd">
  <button type="button" class="bk" onclick="goList()">‹ 목록</button>
  <div class="tt" id="hTitle">📋 업무일지</div>
  <button type="button" class="hm" onclick="location.href='index.html'">메인</button>
</div>

<div id="bd">
  <!-- 게이트/로딩 -->
  <div id="vGate" class="gate"><div class="ic">📋</div><h2>업무일지</h2><p id="gateMsg">불러오는 중…</p><button type="button" id="gateBtn" style="display:none" onclick="location.href='index.html'">자비아 메인으로</button></div>

  <!-- ① 목록 -->
  <div id="vList" style="display:none">
    <div class="toolbar">
      <input type="search" placeholder="🔍 고객·내용·상품 검색" oninput="wlSearch(this.value)">
      <select onchange="wlSortSet(this.value)">
        <option value="dateDesc">최신순</option>
        <option value="dateAsc">오래된순</option>
        <option value="name">고객명순</option>
        <option value="premDesc">보험료순</option>
        <option value="nextAsc">할 일 임박순</option>
      </select>
    </div>
    <div class="frow" id="fP"></div>
    <div class="frow" id="fS"></div>
    <div class="cnt" id="cnt"></div>
    <div id="list"></div>
  </div>

  <!-- ② 입력 폼 -->
  <div id="vForm" style="display:none">
    <div class="ct">
      <button type="button" id="ctP" onclick="wlCtSet('personal')">개인고객</button>
      <button type="button" id="ctC" onclick="wlCtSet('corp')">기업고객</button>
    </div>
    <div class="row2 fg">
      <div><label>날짜</label><input type="date" id="fDate"></div>
      <div><label>방식</label><div class="chips" id="fChan"></div></div>
    </div>
    <div id="pBox">
      <div class="fg"><label>고객 <i>*</i></label>
        <select id="fClient" onchange="wlClientChanged()"></select>
        <div id="fClientNewW" style="display:none;margin-top:7px"><input type="text" id="fClientNew" placeholder="신규 고객 이름"></div>
      </div>
      <div id="enrich"></div>
    </div>
    <div id="cBox" style="display:none">
      <div class="row2 fg">
        <div><label>기업명 <i>*</i></label><input type="text" id="fCorp" placeholder="한성정밀(주)"></div>
        <div><label>담당자 <small>선택</small></label><input type="text" id="fCorpC" placeholder="김철수 대표"></div>
      </div>
    </div>
    <div class="fg" id="prodRow"><label>상품 종류 <small>복수 선택</small></label>
      <div class="chips" id="fProd"></div>
      <div id="fProdCW" style="display:none;margin-top:7px"><input type="text" id="fProdC" placeholder="상품명 직접 입력"></div>
    </div>
    <div class="fg" id="consultRow" style="display:none"><label>기업컨설팅 종류 <i>*</i></label>
      <button type="button" class="pickbtn ph" id="fConsultBtn" onclick="wlConsultOpen()">컨설팅 종류 선택<span>▾</span></button>
      <div id="fConsultCW" style="display:none;margin-top:7px"><input type="text" id="fConsultC" placeholder="컨설팅 종류 직접 입력"></div>
    </div>
    <div class="fg" style="max-width:230px"><label>예상보험료 <small>월납 · 선택</small></label>
      <input type="text" id="fPrem" inputmode="numeric" placeholder="300,000" oninput="wlPremLive(this)">
    </div>
    <div class="fg"><label>대화 내용 <i>*</i></label>
      <textarea id="fSum" class="ag" oninput="agIn(this)" placeholder="어떤 대화를 나눴는지 자유롭게"></textarea>
      <div class="hint">📱 휴대폰은 키패드 아래 <b>마이크(🎤) 버튼</b>으로 말로 바로 입력할 수 있어요</div>
    </div>
    <div class="fg"><label>고객 요청사항 <small>이번 상담에서 받은 요청</small></label>
      <textarea id="fReq" class="ag" rows="1" oninput="agIn(this)" placeholder="예: 실손 갱신 견적 / 어린이보험 비교표"></textarea>
    </div>
    <div class="fg" id="fMemoW" style="display:none"><label>고객 특이사항 <small>고객 정보에 저장 · 다음에도 자동 표시</small></label>
      <textarea id="fMemo" class="ag" rows="1" oninput="agIn(this)" placeholder="예: 골프 좋아함 · 통화는 오후 선호"></textarea>
    </div>
    <div class="fg"><label>진행 단계</label>
      <div class="chips" id="fStage"></div>
      <div id="fStageCW" style="display:none;margin-top:7px"><input type="text" id="fStageC" placeholder="단계 직접 입력"></div>
    </div>
    <div class="row2 fg">
      <div><label>다음 할 일 <small>선택</small></label><input type="text" id="fNextA" placeholder="견적 지참 재방문"></div>
      <div><label>예정일</label><input type="date" id="fNextD"></div>
    </div>
    <button type="button" class="save" onclick="wlSave()">기록 저장</button>
    <button type="button" class="del" id="delBtn" onclick="wlDel()" style="display:none">이 기록 삭제</button>
  </div>

  <!-- ③ 고객 전체 이력 -->
  <div id="vClient" style="display:none"><div id="clientBody"></div></div>
</div>

<div id="fab"><button type="button" onclick="wlShowForm()">＋ 오늘 상담 기록하기</button></div>
<div id="ckOv" onclick="if(event.target===this)wlConsultClose()">
  <div class="ckP">
    <div class="ckH">기업컨설팅 종류<button type="button" onclick="wlConsultClose()" aria-label="닫기">✕</button></div>
    <div class="ckL" id="ckList"></div>
  </div>
</div>
<div id="toast"></div>

<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import{getAuth,onAuthStateChanged,setPersistence,browserLocalPersistence}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import{getFirestore,doc,getDoc,setDoc,updateDoc,deleteDoc,collection,query,where,getDocs,serverTimestamp}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const FC={apiKey:"AIzaSyBD9p-bf162RiiD1Y3BsY-NvbYjpOSrzmg",authDomain:"jarvia-platform.firebaseapp.com",projectId:"jarvia-platform",storageBucket:"jarvia-platform.firebasestorage.app",messagingSenderId:"388025068900",appId:"1:388025068900:web:09ba8e12e9e9e2ec49de71"};
const app=initializeApp(FC);
const db=getFirestore(app,'javia-db');
const auth=getAuth(app);
setPersistence(auth,browserLocalPersistence).catch(()=>{});   // index.html과 동일 — 세션 공유

const $=id=>document.getElementById(id);
let _t=null;
function toast(m){const el=$('toast');el.textContent=m;el.classList.add('show');clearTimeout(_t);_t=setTimeout(()=>el.classList.remove('show'),2400);}

/* ═══ 상수 ═══ */
const WL_ALLOWED=['jarvia_member','inner_circle','free_user','con_homepage','branch_manager'];
const WL_TEST_IDS=['gildong'];   // ★ 테스트 단계 — 전체 오픈 시 빈 배열 []로 변경
const WL_CHANNELS=['대면','전화','카톡','문자'];
const WL_PRODUCTS=['종신','정기','건강·질병','암','치아','운전자','실손','자동차','연금','저축','변액','화재·재물','법인','기타'];
const WL_STAGES=['첫상담','PT','클로징','고객관리','소개','기타'];
const WL_CONSULT=[
 ['법인 재무·지배구조',['CEO플랜(퇴직플랜)','정관 정비','임원 보수·상여 설계','배당 정책','가지급금 정리','명의신탁주식 환원','자사주 매입·이익소각','증자·감자','법인전환']],
 ['승계·상속',['가업승계','상속·증여 설계','주식이동·양도']],
 ['세무·재무',['세무진단','재무제표 분석','절세 컨설팅','신용등급 관리']],
 ['보험·복리후생',['경영인정기보험','단체보험','퇴직연금(DB·DC)','화재·배상책임','복리후생 설계']],
 ['정부지원·인증',['정부지원사업·정책자금','기업인증(벤처·이노비즈 등)','연구소·R&D 설립']],
 ['노무·기타',['노무진단','4대보험 최적화','기업 M&A·매각','부동산·자산관리','기타']]
];

/* ═══ 상태 ═══ */
let me=null,_clients=null,_cache=null,_editId=null;
let _sel={ct:'personal',chan:'대면',prods:[],stage:'',consult:''};
let _q='',_sort='dateDesc',_fp='',_fs='',_view='list';

function ag(el){if(!el)return;el.style.height='auto';el.style.height=Math.min(el.scrollHeight,340)+'px';}
window.agIn=el=>ag(el);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseInt(String(v||'').replace(/[^0-9]/g,''),10);return isNaN(n)?null:n;};
const comma=n=>(n==null||n==='')?'':Number(n).toLocaleString('ko-KR');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const prodsOf=a=>{const p=(a.products||[]).filter(x=>x!=='__c');if(a.productCustom)p.push(a.productCustom);return p;};
const stageOf=a=>a.stage==='__c'?(a.stageCustom||'직접입력'):(a.stage||'');
const ckey=a=>a.clientType==='corp'?('k:'+(a.corpName||'')):(a.clientId?('c:'+a.clientId):('n:'+(a.clientName||'')));

/* ═══ 인증 + 게이트 ═══ */
onAuthStateChanged(auth,async user=>{
  if(!user){
    $('gateMsg').innerHTML='자비아 <b>로그인 후</b> 이용할 수 있습니다.<br>메인에서 로그인해 주세요.';
    $('gateBtn').style.display='';return;
  }
  me=user;
  try{
    const ud=await getDoc(doc(db,'users',user.uid));
    const u=ud.exists()?(ud.data()||{}):{};
    const pass=WL_ALLOWED.includes(u.role)&&(!WL_TEST_IDS.length||WL_TEST_IDS.includes(u.loginId||''));
    if(!pass){
      $('gateMsg').innerHTML='업무일지는 <b>정규회원 전용</b> 기능입니다.';
      $('gateBtn').style.display='';return;
    }
    $('gateMsg').textContent='기록 불러오는 중…';
    await Promise.all([loadClients(),loadActs()]);
    $('vGate').style.display='none';
    goList();
  }catch(e){
    console.error(e);
    $('gateMsg').textContent='불러오기에 실패했습니다. 네트워크 확인 후 새로고침해 주세요.';
    $('gateBtn').style.display='';
  }
});

async function loadClients(){
  const snap=await getDocs(query(collection(db,'fc_clients'),where('fcAuthUid','==',me.uid)));
  _clients=[];snap.forEach(x=>_clients.push({id:x.id,...x.data()}));
}
async function loadActs(){
  const snap=await getDocs(query(collection(db,'fc_activities'),where('uid','==',me.uid)));
  _cache=[];snap.forEach(x=>_cache.push({id:x.id,...x.data()}));
}

/* ═══ 뷰 전환 ═══ */
function setView(v,title){
  _view=v;
  ['vList','vForm','vClient'].forEach(x=>$(x).style.display=(x===v)?'':'none');
  $('hTitle').textContent=title;
  $('hd').classList.toggle('sub',v!=='vList');
  $('fab').style.display=(v==='vList')?'block':'none';   /* ★ ''는 CSS기본(none)으로 회귀 — block 명시 */
  window.scrollTo(0,0);
}
window.goList=function(){
  setView('vList','📋 업무일지');
  buildFilters();renderList();
};

/* ═══ ① 목록 ═══ */
function buildFilters(){
  const _lbl=v=>v==='__c'?'직접입력':(v||'전체');
  $('fP').innerHTML='<span class="flab">상품</span>'+[''].concat(WL_PRODUCTS,['__c']).map(v=>`<button type="button" class="chip${v===_fp?' on':''}" onclick="wlFP('${v}')">${_lbl(v)}</button>`).join('');
  $('fS').innerHTML='<span class="flab">단계</span>'+[''].concat(WL_STAGES,['__c']).map(v=>`<button type="button" class="chip${v===_fs?' on':''}" onclick="wlFS('${v}')">${_lbl(v)}</button>`).join('');
}
window.wlFP=v=>{_fp=v;buildFilters();renderList();};
window.wlFS=v=>{_fs=v;buildFilters();renderList();};
window.wlSearch=v=>{_q=(v||'').trim().toLowerCase();renderList();};
window.wlSortSet=v=>{_sort=v;renderList();};

const hay=a=>[a.clientName,a.corpName,a.corpContact,a.summary,a.request,a.nextAction,prodsOf(a).join(' '),stageOf(a),a.consultType,a.consultTypeCustom,a.channel].filter(Boolean).join(' ').toLowerCase();
function filtered(){
  let L=(_cache||[]).slice();
  if(_q)L=L.filter(a=>hay(a).includes(_q));
  if(_fp==='__c')L=L.filter(a=>(a.products||[]).includes('__c')||a.productCustom);
  else if(_fp)L=L.filter(a=>prodsOf(a).includes(_fp));
  if(_fs==='__c')L=L.filter(a=>a.stage==='__c');
  else if(_fs)L=L.filter(a=>stageOf(a)===_fs||a.stage===_fs);
  const dir={dateDesc:-1,dateAsc:1}[_sort];
  if(dir)L.sort((a,b)=>((a.date||'')<(b.date||'')?-1:1)*dir);
  else if(_sort==='name')L.sort((a,b)=>String(a.clientName||a.corpName||'').localeCompare(String(b.clientName||b.corpName||''),'ko'));
  else if(_sort==='premDesc')L.sort((a,b)=>(b.premium||0)-(a.premium||0));
  else if(_sort==='nextAsc'){const k=x=>x.nextDate&&!x.done?x.nextDate:'9999-12-31';L.sort((a,b)=>k(a)<k(b)?-1:1);}
  return L;
}
function hi(t){
  const e=esc(t);if(!_q)return e;
  try{const re=new RegExp(_q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');return e.replace(re,m=>'<mark>'+m+'</mark>');}catch(x){return e;}
}
function renderList(){
  const L=filtered(),td=today();
  $('cnt').textContent=(_cache||[]).length?('전체 '+(_cache||[]).length+'건 중 '+L.length+'건'):'';
  if(!L.length){$('list').innerHTML='<div class="empty">'+((_cache||[]).length?'조건에 맞는 기록이 없습니다.':'아직 기록이 없습니다.<br><b>아래 버튼</b>으로 오늘 상담을 남겨보세요 🙂')+'</div>';return;}
  $('list').innerHTML=L.map(a=>{
    const nm=a.clientType==='corp'?(a.corpName||'(기업)'):(a.clientName||'(고객)');
    const ps=prodsOf(a),st=stageOf(a);
    const over=a.nextDate&&!a.done&&a.nextDate<td;
    return `<div class="item" onclick="wlShowForm('${a.id}')">
      <div class="ir">
        <span class="dt">${esc((a.date||'').slice(5))}</span>
        ${a.clientType==='corp'?'<span class="bg bcorp">기업</span>':''}
        <span class="nm" onclick="event.stopPropagation();wlShowClient('${esc(ckey(a))}')">${hi(nm)}</span>
        ${ps.slice(0,2).map(x=>`<span class="bg bprod">${hi(x)}</span>`).join('')}${ps.length>2?`<span class="bg bprod">+${ps.length-2}</span>`:''}
        ${st?`<span class="bg bstage">${hi(st)}</span>`:''}
        <span class="meta">${esc(a.channel||'')}${a.premium?' · 월 '+comma(a.premium):''}</span>
      </div>
      ${a.summary?`<div class="sum">${hi(a.summary)}</div>`:''}
      ${(a.request&&!a.done)||a.nextDate?`<div class="nxt${over?' over':''}">${a.request&&!a.done?'🙋 '+hi(a.request):''}${a.nextDate?' ⏰ '+esc(a.nextDate.slice(5))+(over?' 지남':''):''}</div>`:''}
    </div>`;
  }).join('');
}

/* ═══ ② 입력 폼 ═══ */
window.wlShowForm=function(id){
  _editId=id||null;
  const a=id?(_cache||[]).find(x=>x.id===id):null;
  _sel={ct:a?.clientType||'personal',chan:a?.channel||'대면',prods:(a?.products||[]).slice(),stage:a?.stage||''};
  setView('vForm',id?'기록 수정':'새 기록');
  $('fDate').value=a?.date||today();
  const cs=$('fClient');
  const cls=(_clients||[]).slice().sort((x,y)=>String(x.name||'').localeCompare(String(y.name||''),'ko'));
  cs.innerHTML='<option value="">고객 선택</option>'+cls.map(c=>`<option value="${esc(c.id)}">${esc(c.name||'')}${c.company?' ('+esc(c.company)+')':''}</option>`).join('')+'<option value="__new">＋ 직접 입력(신규)</option>';
  cs.value=a?.clientId||'';
  $('fClientNew').value=(a&&!a.clientId)?(a.clientName||''):'';
  $('fCorp').value=a?.corpName||'';$('fCorpC').value=a?.corpContact||'';
  $('fConsultC').value=a?.consultTypeCustom||'';$('fProdC').value=a?.productCustom||'';$('fStageC').value=a?.stageCustom||'';
  $('fPrem').value=a?.premium?comma(a.premium):'';
  $('fSum').value=a?.summary||'';$('fReq').value=a?.request||'';
  $('fNextA').value=a?.nextAction||'';$('fNextD').value=a?.nextDate||'';
  $('delBtn').style.display=id?'':'none';
  _sel.consult=a?.consultType||'';
  ctRender();chipsRender();consultSync();
  wlClientChanged();
  ag($('fSum'));ag($('fReq'));
};
window.wlCtSet=v=>{_sel.ct=v;ctRender();};
function ctRender(){
  const c=_sel.ct==='corp';
  $('ctP').classList.toggle('on',!c);$('ctC').classList.toggle('on',c);
  $('pBox').style.display=c?'none':'';$('cBox').style.display=c?'':'none';
  $('prodRow').style.display=c?'none':'';$('consultRow').style.display=c?'':'none';
}
function chipsRender(){
  $('fChan').innerHTML=WL_CHANNELS.map(v=>`<button type="button" class="chip${_sel.chan===v?' on':''}" onclick="wlChan('${v}')">${v}</button>`).join('');
  const pc=_sel.prods.includes('__c');
  $('fProd').innerHTML=WL_PRODUCTS.map(v=>`<button type="button" class="chip${_sel.prods.includes(v)?' on':''}" onclick="wlProd('${v}')">${v}</button>`).join('')+`<button type="button" class="chip${pc?' on':''}" onclick="wlProd('__c')">직접입력 ✎</button>`;
  $('fProdCW').style.display=pc?'':'none';
  const sc=_sel.stage==='__c';
  $('fStage').innerHTML=WL_STAGES.map(v=>`<button type="button" class="chip${_sel.stage===v?' on':''}" onclick="wlStage('${v}')">${v}</button>`).join('')+`<button type="button" class="chip${sc?' on':''}" onclick="wlStage('__c')">직접입력 ✎</button>`;
  $('fStageCW').style.display=sc?'':'none';
}
window.wlChan=v=>{_sel.chan=v;chipsRender();};
window.wlProd=v=>{const i=_sel.prods.indexOf(v);if(i>=0)_sel.prods.splice(i,1);else _sel.prods.push(v);chipsRender();};
window.wlStage=v=>{_sel.stage=(_sel.stage===v)?'':v;chipsRender();};
function consultSync(){
  const b=$('fConsultBtn');if(!b)return;
  const lab=_sel.consult==='__c'?'직접입력 ✎':(_sel.consult||'컨설팅 종류 선택');
  b.innerHTML=esc(lab)+'<span>▾</span>';
  b.classList.toggle('ph',!_sel.consult);
  $('fConsultCW').style.display=(_sel.consult==='__c')?'':'none';
}
window.wlConsultOpen=function(){
  $('ckList').innerHTML=WL_CONSULT.map(g=>`<div class="ckG">${esc(g[0])}</div>`+g[1].map(v=>`<div class="ckI${_sel.consult===v?' on':''}" onclick="wlConsultPick(this.dataset.v)" data-v="${esc(v)}">${esc(v)}</div>`).join('')).join('')
    +`<div class="ckG">기타</div><div class="ckI${_sel.consult==='__c'?' on':''}" onclick="wlConsultPick('__c')" data-v="__c">직접입력 ✎</div>`;
  $('ckOv').classList.add('show');
};
window.wlConsultClose=function(){$('ckOv').classList.remove('show');};
window.wlConsultPick=function(v){
  _sel.consult=v;consultSync();wlConsultClose();
  if(v==='__c')setTimeout(()=>{try{$('fConsultC').focus();}catch(e){}},60);
};
window.wlPremLive=el=>{const n=num(el.value);el.value=n==null?'':comma(n);};   /* 입력 즉시 3자리 콤마 */

/* 고객 선택 → 기존 정보 자동 표시 + 누락 보완 */
window.wlClientChanged=function(){
  const v=$('fClient').value;
  $('fClientNewW').style.display=(v==='__new')?'':'none';
  const box=$('enrich');
  if(_sel.ct==='corp'||!v||v==='__new'){box.style.display='none';box.innerHTML='';const mw=$('fMemoW');if(mw)mw.style.display='none';return;}
  const c=(_clients||[]).find(x=>x.id===v);
  const mw=$('fMemoW');
  if(c&&mw){mw.style.display='';$('fMemo').value=c.memo||'';ag($('fMemo'));}else if(mw){mw.style.display='none';}
  if(!c){box.style.display='none';return;}
  const P=[];
  if(c.birthDate&&c.birthDate.length===10){
    P.push(`<div class="enr">🎂 생년월일 <b>${esc(c.birthDate)}</b> · 상령일 자동 관리 중</div>`);
  }else{
    P.push(`<div class="enr miss">⚠️ 생년월일 미등록 — 알고 계시면 지금 채워두세요 (상령일 자동 관리)
      <span class="enfill"><input type="date" id="enBirth"><button type="button" class="sbtn" onclick="wlSaveBirth('${esc(c.id)}')">저장</button></span></div>`);
  }
  const cts=c.contracts||[];
  if(cts.length){
    P.push('<div class="enr">📄 등록 계약 '+cts.length+'건 — '+cts.slice(0,3).map(t=>esc(t.productName||t.insurer||'계약')+(t.maturityDate?'('+esc(String(t.maturityDate).slice(2,7))+' 만기)':'')).join(' · ')+(cts.length>3?' 외':'')+'</div>');
  }else{
    P.push('<div class="enr">📄 등록된 계약 없음 — 계약 추가는 채널의 <b>내 고객</b>에서 (만기 알림 자동 연동)</div>');
  }
  box.innerHTML=P.join('');box.style.display='block';
};
window.wlSaveBirth=async function(cid){
  const v=($('enBirth')?.value||'').trim();
  if(v.length!==10){toast('생년월일을 선택해주세요');return;}
  try{
    await updateDoc(doc(db,'fc_clients',cid),{birthDate:v,updatedAt:serverTimestamp()});
    const c=(_clients||[]).find(x=>x.id===cid);if(c)c.birthDate=v;
    toast('저장 완료 — 생일·상령일 리스트에 자동 반영됩니다');
    if(_view==='vForm')wlClientChanged();
  }catch(e){toast('저장 실패');}
};

/* 저장·삭제·완료 */
window.wlSave=async function(){
  const corp=_sel.ct==='corp';
  const selV=$('fClient').value;
  const cli=(!corp&&selV&&selV!=='__new')?(_clients||[]).find(x=>x.id===selV):null;
  const clientName=corp?'':(cli?(cli.name||''):$('fClientNew').value.trim());
  const corpName=corp?$('fCorp').value.trim():'';
  if(corp&&!corpName){toast('기업명을 입력해주세요');return;}
  if(!corp&&!clientName){toast('고객을 선택하거나 입력해주세요');return;}
  const summary=$('fSum').value.trim();
  if(!summary){toast('대화 내용을 입력해주세요');return;}
  if(corp&&!_sel.consult){toast('기업컨설팅 종류를 선택해주세요');return;}
  const d={
    uid:me.uid,
    date:$('fDate').value||today(),
    clientType:corp?'corp':'personal',
    clientId:(!corp&&cli)?cli.id:'',
    clientName,corpName,
    corpContact:corp?$('fCorpC').value.trim():'',
    channel:_sel.chan,
    products:corp?[]:_sel.prods.slice(),
    productCustom:(!corp&&_sel.prods.includes('__c'))?$('fProdC').value.trim():'',
    consultType:corp?_sel.consult:'',
    consultTypeCustom:(corp&&_sel.consult==='__c')?$('fConsultC').value.trim():'',
    premium:num($('fPrem').value),
    summary,
    request:$('fReq').value.trim(),
    stage:_sel.stage,
    stageCustom:(_sel.stage==='__c')?$('fStageC').value.trim():'',
    nextAction:$('fNextA').value.trim(),
    nextDate:$('fNextD').value||'',
    updatedAt:serverTimestamp()
  };
  try{
    if(_editId){
      await updateDoc(doc(db,'fc_activities',_editId),d);
      const i=(_cache||[]).findIndex(x=>x.id===_editId);
      if(i>=0)_cache[i]={..._cache[i],...d};
      toast('수정되었습니다');
    }else{
      d.done=false;d.createdAt=serverTimestamp();
      const ref=doc(collection(db,'fc_activities'));
      await setDoc(ref,d);
      (_cache=_cache||[]).push({id:ref.id,...d});
      toast('저장되었습니다 ✅');
    }
    /* 고객 특이사항 — 바뀐 경우에만 fc_clients에 함께 저장 (실패해도 기록 저장은 유지) */
    if(!corp&&cli&&$('fMemoW').style.display!=='none'){
      const nv=$('fMemo').value.trim();
      if(nv!==String(cli.memo||'').trim()){
        try{await updateDoc(doc(db,'fc_clients',cli.id),{memo:nv,updatedAt:serverTimestamp()});cli.memo=nv;}catch(e){}
      }
    }
    goList();
  }catch(e){console.error(e);toast('저장 실패 — 네트워크를 확인해주세요');}
};
window.wlDel=async function(){
  if(!_editId)return;
  if(!confirm('이 기록을 삭제할까요?'))return;
  try{
    await deleteDoc(doc(db,'fc_activities',_editId));
    _cache=(_cache||[]).filter(x=>x.id!==_editId);
    toast('삭제되었습니다');goList();
  }catch(e){toast('삭제 실패');}
};
window.wlToggleDone=async function(id,ev){
  if(ev)ev.stopPropagation();
  const a=(_cache||[]).find(x=>x.id===id);if(!a)return;
  try{
    await updateDoc(doc(db,'fc_activities',id),{done:!a.done,updatedAt:serverTimestamp()});
    a.done=!a.done;
    if(_view==='vClient')wlShowClient(a._ck||ckey(a));else renderList();
  }catch(e){toast('처리 실패');}
};

/* ═══ ③ 고객 전체 이력 — 전부 펼침 ═══ */
window.wlShowClient=function(key){
  const acts=(_cache||[]).filter(a=>ckey(a)===key).sort((a,b)=>(a.date||'')<(b.date||'')?1:-1);
  const corp=key.startsWith('k:');
  const cli=(!corp&&key.startsWith('c:'))?(_clients||[]).find(x=>x.id===key.slice(2)):null;
  const name=corp?key.slice(2):(cli?.name||acts[0]?.clientName||key.slice(2));
  setView('vClient',name+'님 전체 이력');
  const td=today();
  let h=`<div class="ch">
    <div class="chNm">${esc(name)}<span class="chSub">${corp?'기업':esc(cli?.company||'')}${cli?.phone?' · '+esc(cli.phone):''}</span></div>
    <div class="chBgs">
      <span class="bg bprod">상담 ${acts.length}회</span>
      ${acts.length?`<span class="bg bstage">첫 접점 ${esc((acts[acts.length-1].date||'').slice(0,7))}</span>`:''}
      ${acts.length&&stageOf(acts[0])?`<span class="bg bnew">현재: ${esc(stageOf(acts[0]))}</span>`:''}
    </div>
    <button type="button" class="sbtn newbtn" onclick="wlNewFor('${esc(key)}')">＋ 새 기록</button>
  </div>`;
  if(cli){
    h+=`<div class="note"><b>📌 특이사항</b>
      <textarea id="memoTa" oninput="agIn(this)" style="overflow:hidden" placeholder="예: 골프 좋아함 · 통화는 오후 선호">${esc(cli.memo||'')}</textarea>
      <button type="button" class="sbtn" onclick="wlSaveMemo('${esc(cli.id)}')">저장</button></div>`;
    if(!(cli.birthDate&&cli.birthDate.length===10)){
      h+=`<div class="note miss">⚠️ 생년월일 미등록<span class="enfill"><input type="date" id="enBirth"><button type="button" class="sbtn" onclick="wlSaveBirth('${esc(cli.id)}');wlShowClient('${esc(key)}')">저장</button></span></div>`;
    }
  }
  const pend=acts.filter(a=>a.request&&!a.done);
  if(pend.length){
    h+='<div class="pend"><b>🙋 미처리 요청 '+pend.length+'건</b>'+pend.map(a=>`<label class="prow"><input type="checkbox" onchange="wlToggleDone('${a.id}',event)"><span style="color:#6B1515;font-size:13px">${esc(a.request)} <span>(${esc((a.date||'').slice(5))} 요청${a.nextDate?' · ⏰'+esc(a.nextDate.slice(5)):''})</span></span></label>`).join('')+'</div>';
  }
  const topics={};acts.forEach(a=>{prodsOf(a).forEach(p=>topics[p]=(topics[p]||0)+1);const ct=a.consultType==='__c'?a.consultTypeCustom:a.consultType;if(ct)topics[ct]=(topics[ct]||0)+1;});
  const top=Object.entries(topics).sort((a,b)=>b[1]-a[1]).slice(0,3).map(x=>x[0]+' '+x[1]).join(' · ');
  const psum=acts.reduce((s,a)=>s+(a.premium||0),0);
  h+=`<div class="stats">
    <div><span>다뤄온 주제</span><b>${esc(top||'—')}</b></div>
    <div><span>제안 보험료 합</span><b>${psum?'월 '+comma(psum)+'원':'—'}</b></div>
    <div><span>마지막 접촉</span><b>${acts.length?esc(acts[0].date||''):'—'}</b></div>
  </div>`;
  h+='<div class="tlh">전체 이력 '+acts.length+'건 <span>최신순 · 전부 펼침</span></div><div class="tl">'+
    acts.map(a=>{
      const ps=prodsOf(a),st=stageOf(a);
      const over=a.nextDate&&!a.done&&a.nextDate<td;
      return `<div class="tli">
        <div class="ir">
          <span class="dt">${esc(a.date||'')}</span>
          ${a.clientType==='corp'?`<span class="bg bcorp">기업${a.consultType?' · '+esc(a.consultType==='__c'?a.consultTypeCustom:a.consultType):''}</span>`:ps.map(x=>`<span class="bg bprod">${esc(x)}</span>`).join('')}
          ${st?`<span class="bg bstage">${esc(st)}</span>`:''}
          <span class="meta">${esc(a.channel||'')}${a.premium?' · 월 '+comma(a.premium):''}</span>
          <button type="button" class="elink" onclick="wlShowForm('${a.id}')">수정</button>
        </div>
        ${a.summary?`<div class="sum full">${esc(a.summary)}</div>`:''}
        ${a.request?`<div class="nxt${over?' over':''}">🙋 ${esc(a.request)}${a.done?' ✅':''}${a.nextDate?' ⏰ '+esc(a.nextDate.slice(5))+(over?' 지남':''):''}</div>`:(a.nextDate?`<div class="nxt${over?' over':''}">⏰ ${esc(a.nextDate.slice(5))}${over?' 지남':''}</div>`:'')}
      </div>`;
    }).join('')+'</div>';
  $('clientBody').innerHTML=h;
  acts.forEach(a=>a._ck=key);
};
window.wlNewFor=function(key){
  wlShowForm();
  if(key.startsWith('c:')){$('fClient').value=key.slice(2);wlClientChanged();}
  else if(key.startsWith('k:')){wlCtSet('corp');$('fCorp').value=key.slice(2);}
};
window.wlSaveMemo=async function(cid){
  const v=($('memoTa')?.value||'').trim();
  try{
    await updateDoc(doc(db,'fc_clients',cid),{memo:v,updatedAt:serverTimestamp()});
    const c=(_clients||[]).find(x=>x.id===cid);if(c)c.memo=v;
    toast('특이사항 저장 완료');
  }catch(e){toast('저장 실패');}
};
</script>
</body>
</html>
