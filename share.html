<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>JARVIA Daily Report</title>
<style>
body{margin:0;background:#F7F9FC;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif}
.box{text-align:center;padding:40px 20px}
.spin{width:32px;height:32px;border:3px solid #E1E8EE;border-top:3px solid #2E86AB;border-radius:50%;animation:sp .7s linear infinite;margin:0 auto 16px}
@keyframes sp{to{transform:rotate(360deg)}}
p{font-size:14px;color:#7F8C8D;margin:0}
.err{color:#E74C3C}
a{color:#2E86AB;text-decoration:none;font-weight:600}
</style>
</head>
<body>
<div class="box" id="msg">
  <div class="spin"></div>
  <p>리포트를 불러오는 중...</p>
</div>
<script>
(function(){
  var params=new URLSearchParams(location.search);
  var dr=params.get('dr');
  var el=document.getElementById('msg');
  if(!dr){
    el.innerHTML='<p class="err">잘못된 링크입니다.</p><p style="margin-top:12px"><a href="https://jarvia.co.kr">JARVIA 메인으로</a></p>';
    return;
  }
  var url='https://storage.googleapis.com/kfpc-company-support-project.firebasestorage.app/daily-reports/'+dr+'_daily-report.html?share=1';
  location.replace(url);
})();
</script>
</body>
</html>
