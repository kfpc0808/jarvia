<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>JARVIA Daily Report</title>
<style>
body{margin:0;background:#F7F9FC;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif}
.loading{display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center;padding:40px 20px}
.spin{width:32px;height:32px;border:3px solid #E1E8EE;border-top:3px solid #2E86AB;border-radius:50%;animation:sp .7s linear infinite;margin:0 auto 16px}
@keyframes sp{to{transform:rotate(360deg)}}
p{font-size:14px;color:#7F8C8D;margin:0}
.err{color:#E74C3C}
a{color:#2E86AB;text-decoration:none;font-weight:600}
</style>
</head>
<body>
<div class="loading" id="msg">
  <div><div class="spin"></div><p>리포트를 불러오는 중...</p></div>
</div>
<script>
(function(){
  var params=new URLSearchParams(location.search);
  var dr=params.get('dr');
  var el=document.getElementById('msg');
  if(!dr){
    el.innerHTML='<div><p class="err">잘못된 링크입니다.</p><p style="margin-top:12px"><a href="https://jarvia.co.kr">JARVIA 메인으로</a></p></div>';
    return;
  }
  var url='https://firebasestorage.googleapis.com/v0/b/kfpc-company-support-project.firebasestorage.app/o/daily-reports%2F'+dr+'_daily-report.html?alt=media';
  fetch(url).then(function(res){
    if(!res.ok)throw new Error(res.status);
    return res.text();
  }).then(function(html){
    history.replaceState(null,'',location.pathname+'?dr='+dr+'&share=1');
    document.open();
    document.write(html);
    document.close();
  }).catch(function(){
    el.innerHTML='<div><p class="err">리포트를 찾을 수 없습니다.</p><p style="margin-top:12px"><a href="https://jarvia.co.kr">JARVIA 메인으로</a></p></div>';
  });
})();
</script>
</body>
</html>
