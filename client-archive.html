<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>금융 브리핑 아카이브</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1A1A2E;--ink-mid:#3D3D5C;--ink-lt:#6B6B8D;--ink-sub:#9E9EB8;
  --bg:#FAFAF7;--bg-warm:#F5F3EE;--bg-card:#FFFFFF;
  --accent:#2563EB;--accent-lt:#DBEAFE;
  --green:#059669;--green-lt:#D1FAE5;--red:#DC2626;--red-lt:#FEE2E2;
  --orange:#EA580C;--orange-lt:#FFF7ED;--purple:#7C3AED;--purple-lt:#EDE9FE;
  --border:#E8E6E1;--border-lt:#F0EEE9;
  --shadow:0 2px 8px rgba(26,26,46,.08);--shadow-md:0 4px 16px rgba(26,26,46,.12);
  --radius:16px;--radius-sm:10px;
  --font:'Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;
  --font-d:'Outfit','Noto Sans KR',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:var(--font);background:var(--bg);color:var(--ink);line-height:1.7;-webkit-font-smoothing:antialiased}

/* Header */
.hd{background:linear-gradient(135deg,#1E293B,#334155);position:relative}
.hd::after{content:'';position:absolute;bottom:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--purple),var(--accent))}
.hd-inner{max-width:720px;margin:0 auto;padding:20px 20px 24px;display:flex;align-items:center;justify-content:space-between}
.hd-left div{display:flex;flex-direction:column;gap:2px}
.hd-title{font-family:var(--font-d);font-size:20px;font-weight:800;color:#fff}
.hd-sub{font-size:12px;color:rgba(255,255,255,.5)}
.hd-back{padding:8px 16px;border-radius:8px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.8);font-size:13px;font-weight:600;text-decoration:none;transition:all .2s}
.hd-back:hover{background:rgba(255,255,255,.2)}

/* Tabs */
.tab-wrap{max-width:720px;margin:-16px auto 0;padding:0;position:relative;z-index:2}
.tab-inner{background:var(--bg-card);border-radius:0;box-shadow:var(--shadow-md);padding:10px 20px;display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}.tab-inner::-webkit-scrollbar{display:none}
.tab-btn{flex-shrink:0;padding:8px 16px;border-radius:20px;border:1px solid var(--border);background:var(--bg);font-size:13px;font-weight:600;color:var(--ink-lt);cursor:pointer;transition:all .2s;font-family:var(--font);white-space:nowrap}
.tab-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-lt)}
.tab-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}

/* Content */
.content{max-width:720px;margin:0 auto;padding:20px 20px 60px}
.loading{text-align:center;padding:60px 0;color:var(--ink-lt)}
.spin{width:32px;height:32px;border:3px solid var(--border);border-top:3px solid var(--accent);border-radius:50%;animation:sp .7s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}

/* Report Card (전체보기) */
.report-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.report-card{background:var(--bg-card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--border-lt);overflow:hidden;cursor:pointer;transition:all .2s;text-decoration:none;display:block;color:inherit}
.report-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);border-color:var(--accent)}
.report-card.today{border:1px solid #E9C46A;box-shadow:0 2px 12px rgba(212,160,60,.15)}
.report-card.today .rc-date{background:linear-gradient(90deg,#D4A03C,#F0D78C,#D4A03C,#F0D78C);background-size:300% 100%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:goldShimmer 3s ease-in-out infinite;font-size:16px}
@keyframes goldShimmer{0%{background-position:100% 0}100%{background-position:-100% 0}}
.rc-header{padding:14px 16px;background:linear-gradient(135deg,#1E293B,#334155);color:#fff;display:flex;justify-content:space-between;align-items:center}
.rc-date{font-family:var(--font-d);font-size:14px;font-weight:700}
.rc-badge{font-size:10px;padding:3px 10px;border-radius:12px;background:rgba(255,255,255,.15);color:rgba(255,255,255,.8)}
.rc-body{padding:12px 16px}
.rc-inds{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.rc-ind{font-size:10px;padding:2px 8px;border-radius:4px;background:var(--bg-warm);border:1px solid var(--border-lt);font-family:var(--font-mono);color:var(--ink-lt)}
.rc-news{font-size:13px;color:var(--ink-mid);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rc-dots{display:flex;gap:4px;margin-top:8px}
.rc-dot{width:8px;height:8px;border-radius:50%;opacity:.6}

/* Section Timeline (섹션별) */
.sec-timeline{display:flex;flex-direction:column;gap:14px}
.sec-item{background:var(--bg-card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--border-lt);overflow:hidden}
.si-date{padding:12px 16px;background:var(--bg-warm);border-bottom:1px solid var(--border-lt);font-size:13px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:8px}
.si-date span{font-size:11px;color:var(--ink-lt);font-weight:400}
.si-body{padding:14px 16px}

/* Market Grid */
.m-grid{display:grid;grid-template-columns:repeat(2,1fr);border:1px solid var(--border-lt);border-radius:var(--radius-sm);overflow:hidden}
.m-item{padding:10px 12px;border-bottom:1px solid var(--border-lt)}
.m-item:nth-child(odd){border-right:1px solid var(--border-lt)}
.m-item:nth-last-child(-n+2){border-bottom:none}
.m-label{font-size:11px;color:var(--ink-lt);font-weight:500;margin-bottom:2px}
.m-val{font-family:var(--font-mono);font-size:14px;font-weight:700;color:var(--ink)}
.m-chg{font-size:10px;font-weight:600;margin-top:1px}
.up{color:var(--red)}.down{color:var(--accent)}.flat{color:var(--ink-sub)}
.m-insight{margin-top:8px;padding:10px 12px;background:var(--accent-lt);border-radius:var(--radius-sm);font-size:12px;color:var(--ink-mid);line-height:1.6}

/* Article */
.article{margin-bottom:12px;padding:12px;background:var(--bg-warm);border-radius:var(--radius-sm)}.article:last-child{margin-bottom:0}
.article-tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:700;margin-bottom:4px}
.tag-economy{background:var(--accent-lt);color:var(--accent)}.tag-tax{background:var(--purple-lt);color:var(--purple)}
.tag-insurance{background:var(--green-lt);color:var(--green)}.tag-policy{background:var(--orange-lt);color:var(--orange)}
.tag-life{background:#FDF2F8;color:#DB2777}.tag-hot{background:var(--red-lt);color:var(--red)}
.article-title{font-size:14px;font-weight:700;color:var(--ink);margin-bottom:4px;line-height:1.4}
.article-body{font-size:13px;color:var(--ink-mid);line-height:1.7}
.article-body strong{color:var(--ink);font-weight:600}
.article-body em{font-style:normal;background:linear-gradient(transparent 60%,rgba(37,99,235,.12) 60%);font-weight:600}
.takeaway{margin-top:6px;font-size:11px;color:var(--ink-lt);padding:6px 10px;background:rgba(0,0,0,.03);border-radius:6px;line-height:1.5}

/* Deep Dive */
.deep{padding:12px;background:#F5F3FF;border-radius:var(--radius-sm);border-left:3px solid #6366F1}
.deep-title{font-size:14px;font-weight:700;color:var(--ink);margin-bottom:6px}
.deep-summary{font-size:12px;color:var(--ink-mid);line-height:1.6;margin-bottom:6px}
.deep-q{font-size:13px;font-weight:700;color:#6366F1;margin:8px 0 4px}
.deep-a{font-size:12px;color:var(--ink-mid);line-height:1.7;margin-bottom:8px}

/* Hot Issue */
.hot{padding:12px;background:var(--red-lt);border-radius:var(--radius-sm);border-left:3px solid var(--red)}
.hot-title{font-size:14px;font-weight:700;color:var(--ink);margin-bottom:4px}
.hot-body{font-size:13px;color:var(--ink-mid);line-height:1.7}
.hot-body strong{color:var(--ink);font-weight:600}

/* Empty / Pager */
.empty{text-align:center;padding:60px 20px;color:var(--ink-lt)}
.empty h3{font-size:18px;color:var(--ink);margin-bottom:8px}
.pager{display:flex;justify-content:center;gap:6px;margin-top:20px}
.pg-btn{padding:6px 12px;border-radius:8px;border:1px solid var(--border);background:var(--bg-card);font-size:12px;font-weight:600;color:var(--ink-lt);cursor:pointer;transition:all .2s;font-family:var(--font)}
.pg-btn:hover{border-color:var(--accent);color:var(--accent)}
.pg-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.pg-btn:disabled{opacity:.4;cursor:not-allowed}

@media(max-width:480px){
  .hd-inner{flex-direction:column;gap:10px;text-align:center}
  .report-grid{grid-template-columns:1fr}
  .tab-btn{font-size:12px;padding:6px 12px}
}
</style>
</head>
<body>
<header class="hd">
  <div class="hd-inner">
    <div class="hd-left"><div>
      <div class="hd-title">금융 브리핑 아카이브</div>
      <div class="hd-sub">지난 브리핑을 섹션별로 모아보세요</div>
    </div></div>
    <a class="hd-back" id="backBtn" href="#">← 오늘 브리핑</a>
  </div>
</header>
<div class="tab-wrap">
  <div class="tab-inner" id="tabBar">
    <button class="tab-btn active" onclick="switchTab('all')">📋 전체보기</button>
    <button class="tab-btn" onclick="switchTab('indicators')">📊 경제지표</button>
    <button class="tab-btn" onclick="switchTab('news')">📰 뉴스</button>
    <button class="tab-btn" onclick="switchTab('deepdive')">🔍 딥다이브</button>
    <button class="tab-btn" onclick="switchTab('hotissue')">🔥 핫이슈</button>
  </div>
</div>
<div class="content">
  <div id="main"><div class="loading"><div class="spin"></div><p>아카이브를 불러오는 중...</p></div></div>
</div>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import{getFirestore,collection,query,orderBy,limit,getDocs}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const app=initializeApp({apiKey:"AIzaSyCf7CsUTgfIWY-RW_mvTJOhczDtk1xM9sA",authDomain:"kfpc-company-support-project.firebaseapp.com",projectId:"kfpc-company-support-project",storageBucket:"kfpc-company-support-project.firebasestorage.app",messagingSenderId:"1012609333373",appId:"1:1012609333373:web:7b6c207c81ff10d156d914"});
const db=getFirestore(app,'javia-db');

const params=new URLSearchParams(location.search);
const fcId=params.get('fc')||'';
let allReports=[];
// 오늘 날짜 KST (YYYYMMDD)
const _kst=new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Seoul'}));
const todayFd=String(_kst.getFullYear())+String(_kst.getMonth()+1).padStart(2,'0')+String(_kst.getDate()).padStart(2,'0');

let currentTab='all';
let currentPage=1;
const PER_PAGE=6;

document.getElementById('backBtn').href=`./client-daily.html?fc=${fcId}`;

async function loadReports(){
  try{
    const snap=await getDocs(query(collection(db,'client_daily_reports'),orderBy('createdAt','desc'),limit(60)));
    allReports=snap.docs.filter(d=>d.data().status==='published').map(d=>d.data());
    if(!allReports.length){
      document.getElementById('main').innerHTML='<div class="empty"><h3>아직 브리핑이 없어요</h3><p>내일부터 매일 아침 브리핑이 쌓여요!</p></div>';
      return;
    }
    render();
  }catch(e){
    document.getElementById('main').innerHTML='<div class="empty"><h3>데이터를 불러올 수 없어요</h3><p>'+esc(e.message)+'</p></div>';
  }
}

window.switchTab=function(tab){
  currentTab=tab;currentPage=1;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  const idx={all:0,indicators:1,news:2,deepdive:3,hotissue:4}[tab]||0;
  document.querySelectorAll('.tab-btn')[idx].classList.add('active');
  if(tab==='all') render(); else renderSection(tab);
  window.scrollTo({top:160,behavior:'smooth'});
};

// ── 전체보기 ──
function render(){
  const total=allReports.length;const pages=Math.ceil(total/PER_PAGE);
  if(currentPage>pages)currentPage=pages;
  const start=(currentPage-1)*PER_PAGE;
  const slice=allReports.slice(start,start+PER_PAGE);

  let html='<div class="report-grid">';
  for(const r of slice){
    const fd=r.fileDate||'';
    const inds=r.indicators||[];const news=r.news||[];
    const headline=news[0]?.title||r.indicatorInsight||'';
    const hasI=inds.length>0,hasN=news.length>0,hasD=!!(r.deepdive&&r.deepdive.title),hasH=!!(r.hotissue&&r.hotissue.title);
    const isToday=fd===todayFd;
    html+=`<a class="report-card${isToday?' today':''}" href="./client-daily.html?fc=${fcId}&d=${fd}">
      <div class="rc-header"><div class="rc-date">${esc(r.date||fd)}</div><div class="rc-badge">Daily Briefing</div></div>
      <div class="rc-body">
        <div class="rc-inds">${inds.slice(0,3).map(i=>`<span class="rc-ind">${esc(i.label)} ${esc(i.value)}</span>`).join('')}</div>
        <div class="rc-news">${esc(headline)}</div>
        <div class="rc-dots">
          ${hasI?'<div class="rc-dot" style="background:var(--accent)"></div>':''}
          ${hasN?'<div class="rc-dot" style="background:var(--green)"></div>':''}
          ${hasD?'<div class="rc-dot" style="background:#6366F1"></div>':''}
          ${hasH?'<div class="rc-dot" style="background:var(--red)"></div>':''}
        </div>
      </div></a>`;
  }
  html+='</div>';
  if(pages>1){
    html+='<div class="pager">';
    html+=`<button class="pg-btn" onclick="window._pg(${currentPage-1})" ${currentPage===1?'disabled':''}>‹</button>`;
    for(let i=1;i<=pages;i++)html+=`<button class="pg-btn ${i===currentPage?'active':''}" onclick="window._pg(${i})">${i}</button>`;
    html+=`<button class="pg-btn" onclick="window._pg(${currentPage+1})" ${currentPage===pages?'disabled':''}>›</button></div>`;
  }
  document.getElementById('main').innerHTML=html;
}
window._pg=function(p){if(p<1)return;currentPage=p;render();window.scrollTo({top:160,behavior:'smooth'});};

// ── 섹션별 타임라인 ──
function renderSection(sec){
  const map={
    indicators:{key:'indicators',title:'경제지표',icon:'📊',fn:renderMarketSec},
    news:{key:'news',title:'1분 뉴스',icon:'📰',fn:renderNewsSec},
    deepdive:{key:'deepdive',title:'딥다이브',icon:'🔍',fn:renderDeepSec},
    hotissue:{key:'hotissue',title:'핫이슈',icon:'🔥',fn:renderHotSec},
  };
  const cfg=map[sec];if(!cfg)return;
  const filtered=allReports.filter(r=>{
    const d=r[cfg.key];if(!d)return false;
    if(Array.isArray(d))return d.length>0;
    if(typeof d==='object')return !!(d.title||Object.keys(d).length>0);
    return false;
  });
  if(!filtered.length){
    document.getElementById('main').innerHTML=`<div class="empty"><h3>${cfg.icon} ${cfg.title}</h3><p>해당 섹션 데이터가 없습니다.</p></div>`;
    return;
  }
  let html='<div class="sec-timeline">';
  for(const r of filtered){
    html+=`<div class="sec-item"><div class="si-date">${cfg.icon} ${esc(r.date||r.fileDate)} <span>${cfg.title}</span></div><div class="si-body">${cfg.fn(r)}</div></div>`;
  }
  html+='</div>';
  document.getElementById('main').innerHTML=html;
}

// ── 섹션 렌더 함수들 ──
function renderMarketSec(r){
  const inds=r.indicators||[];const prevInds=r.prevInds||null;
  let grid=inds.map(ind=>{
    let chg='';
    if(prevInds){const prev=prevInds.find(p=>p.label===ind.label);
      if(prev){const t=parseFloat(String(ind.value).replace(/,/g,'')),y=parseFloat(String(prev.value).replace(/,/g,''));
        if(!isNaN(t)&&!isNaN(y)&&y!==0){const d=t-y,p=((d/y)*100).toFixed(2);
          if(Math.abs(d)>0.001){const c=d>0?'up':'down',a=d>0?'▲':'▼',s=d>0?'+':'';
            chg=`<div class="m-chg ${c}">${a} ${s}${Math.abs(d)<1?d.toFixed(3):d.toFixed(2)} (${s}${p}%)</div>`;
          }else{chg='<div class="m-chg flat">— 보합</div>';}}}}
    const u=(ind.unit&&!ind.unit.includes('='))?' '+ind.unit:'';
    return `<div class="m-item"><div class="m-label">${esc(ind.label)}</div><div class="m-val">${esc(ind.value)}${u}</div>${chg}</div>`;
  }).join('');
  const insight=r.indicatorInsight?`<div class="m-insight">💡 ${esc(r.indicatorInsight)}</div>`:'';
  return `<div class="m-grid">${grid}</div><div style="text-align:right;margin-top:4px;font-size:10px;color:var(--ink-sub)">${esc(r.date||'')} 기준 · 한국은행 ECOS</div>${insight}`;
}

function renderNewsSec(r){
  return (r.news||[]).map(n=>{const tc=n.tagClass||'tag-economy';
    return `<div class="article"><span class="article-tag ${esc(tc)}">${esc(n.tag)}</span><div class="article-title">${esc(n.title)}</div><div class="article-body">${n.body||''}</div>${n.takeaway?`<div class="takeaway">📌 ${esc(n.takeaway).replace(/^📌\s*/,'')}</div>`:''}</div>`;
  }).join('');
}

function renderDeepSec(r){
  const d=r.deepdive;if(!d||!d.title)return '';
  const summary=(d.summary_3lines||[]).map(l=>'• '+esc(l)).join('<br>');
  const qas=(d.questions||[]).map(qa=>`<div class="deep-q">Q. ${esc(qa.q)}</div><div class="deep-a">${qa.a||''}</div>`).join('');
  return `<div class="deep"><div class="deep-title">🔍 ${esc(d.title)}</div>${summary?`<div class="deep-summary">${summary}</div>`:''}${qas}${d.takeaway?`<div class="takeaway">📌 ${esc(d.takeaway).replace(/^📌\s*/,'')}</div>`:''}</div>`;
}

function renderHotSec(r){
  const h=r.hotissue;if(!h||!h.title)return '';
  return `<div class="hot"><div class="hot-title">🔥 ${esc(h.title)}</div><div class="hot-body">${h.body||''}</div>${h.takeaway?`<div class="takeaway">📌 ${esc(h.takeaway).replace(/^📌\s*/,'')}</div>`:''}</div>`;
}

function esc(s){return s?String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'):'';}

loadReports();
</script>
</body>
</html>
