<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>지난 브리핑 보기</title>
<meta property="og:title" content="금융 브리핑 아카이브">
<meta property="og:description" content="매일 아침 전해드리는 금융 인사이트 — 지난호 모아보기">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --ink:#1A1A2E;--ink-mid:#3D3D5C;--ink-lt:#6B6B8D;--ink-sub:#9E9EB8;
  --bg:#FAFAF7;--bg-warm:#F5F3EE;--bg-card:#FFFFFF;
  --accent:#2563EB;--accent-lt:#DBEAFE;
  --green:#059669;--green-lt:#D1FAE5;--red:#DC2626;--red-lt:#FEE2E2;
  --orange:#EA580C;--orange-lt:#FFF7ED;--purple:#7C3AED;--purple-lt:#EDE9FE;
  --yellow:#D97706;--yellow-lt:#FFFBEB;
  --border:#E8E6E1;--border-lt:#F0EEE9;
  --shadow-sm:0 1px 3px rgba(26,26,46,.06);--shadow:0 2px 8px rgba(26,26,46,.08);
  --radius:16px;--radius-sm:10px;--radius-xs:6px;
  --font:'Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;
  --font-d:'Outfit','Noto Sans KR',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:var(--font);background:var(--bg);color:var(--ink);line-height:1.75;-webkit-font-smoothing:antialiased}
.wrap{max-width:640px;margin:0 auto;padding:0 20px}

/* ═══ Loading / Error ═══ */
.page-loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;color:var(--ink-lt)}
.page-loading .spin{width:32px;height:32px;border:3px solid var(--border);border-top:3px solid var(--accent);border-radius:50%;animation:sp .7s linear infinite;margin-bottom:12px}
@keyframes sp{to{transform:rotate(360deg)}}
.page-error{text-align:center;padding:80px 20px;color:var(--ink-lt)}
.page-error h2{font-size:20px;color:var(--ink);margin-bottom:8px}

/* ═══ Header ═══ */
.arc-header{border-bottom:1px solid var(--border);padding:14px 0;position:sticky;top:0;z-index:50;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);background:rgba(255,255,255,.92)}
.arc-header .wrap{display:flex;align-items:center;justify-content:space-between}
.arc-back{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--accent);text-decoration:none;padding:6px 12px;border-radius:8px;transition:all .15s}
.arc-back:hover{background:var(--accent-lt)}
.arc-back svg{width:18px;height:18px}
.arc-title-bar{font-family:var(--font-d);font-size:15px;font-weight:700;color:var(--ink)}

/* ═══ Page Title ═══ */
.page-hero{padding:28px 0 20px}
.page-hero h1{font-family:var(--font-d);font-size:24px;font-weight:800;color:var(--ink);margin-bottom:4px}
.page-hero p{font-size:14px;color:var(--ink-lt)}

/* ═══ Accordion ═══ */
.acc-item{background:var(--bg-card);border-radius:var(--radius);border:1px solid var(--border);margin-bottom:12px;overflow:hidden;transition:all .2s}
.acc-item:hover{border-color:#D0CEC9;box-shadow:var(--shadow-sm)}
.acc-trigger{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;cursor:pointer;user-select:none;-webkit-user-select:none}
.acc-date{font-size:16px;font-weight:700;color:var(--ink)}
.acc-meta{display:flex;align-items:center;gap:8px}
.acc-badges{display:flex;gap:4px}
.acc-badge{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.acc-arrow{width:20px;height:20px;color:var(--ink-sub);transition:transform .25s;flex-shrink:0}
.acc-item.open .acc-arrow{transform:rotate(180deg)}
.acc-body{display:none;border-top:1px solid var(--border-lt)}
.acc-item.open .acc-body{display:block}

/* ═══ Section Inside Accordion ═══ */
.arc-sec{padding:16px 20px;border-bottom:1px solid var(--border-lt)}
.arc-sec:last-child{border-bottom:none}
.arc-sec-head{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.arc-sec-num{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--font-d);font-size:11px;font-weight:700;color:#fff;flex-shrink:0}
.arc-sec-title{font-size:14px;font-weight:700;color:var(--ink)}

/* Market Grid (재사용) */
.market-strip{border:1px solid var(--border-lt);border-radius:var(--radius-sm);overflow:hidden;margin-bottom:8px}
.market-grid{display:grid;grid-template-columns:repeat(2,1fr)}
.market-item{padding:12px 14px;border-bottom:1px solid var(--border-lt)}
.market-item:nth-child(odd){border-right:1px solid var(--border-lt)}
.market-item:nth-last-child(-n+2){border-bottom:none}
.mi-label{font-size:11px;color:var(--ink-lt);font-weight:500;margin-bottom:2px}
.mi-val{font-family:var(--font-mono);font-size:15px;font-weight:700;color:var(--ink)}
.mi-change{font-size:10px;font-weight:600;margin-top:1px;white-space:nowrap}
.mi-change.up{color:var(--red)}.mi-change.down{color:var(--accent)}.mi-change.flat{color:var(--ink-sub)}
.market-note{padding:8px 14px;background:var(--bg-warm);font-size:10px;color:var(--ink-lt);text-align:right}
.indicator-insight{background:var(--accent-lt);border-radius:var(--radius-sm);padding:12px 14px;margin-top:8px}
.indicator-insight-title{font-size:11px;font-weight:700;color:var(--accent);margin-bottom:4px}
.indicator-insight p{font-size:13px;color:var(--ink-mid);line-height:1.6}

/* News (재사용, 축소) */
.arc-news{margin-bottom:12px;padding:12px 14px;background:var(--bg-warm);border-radius:var(--radius-sm)}
.arc-news-tag{display:inline-flex;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:700;margin-bottom:6px}
.tag-economy{background:var(--accent-lt);color:var(--accent)}.tag-tax{background:var(--purple-lt);color:var(--purple)}
.tag-insurance{background:var(--green-lt);color:var(--green)}.tag-policy{background:var(--orange-lt);color:var(--orange)}
.tag-market{background:var(--yellow-lt);color:var(--yellow)}.tag-life{background:#FDF2F8;color:#DB2777}
.tag-hot{background:var(--red-lt);color:var(--red)}
.arc-news-title{font-size:14px;font-weight:700;color:var(--ink);margin-bottom:4px;line-height:1.4}
.arc-news-body{font-size:13px;color:var(--ink-mid);line-height:1.7}
.arc-news-body strong{color:var(--ink);font-weight:600}
.arc-news-body em{font-style:normal;background:linear-gradient(transparent 60%,rgba(37,99,235,.12) 60%);font-weight:600}

/* Deep Dive (축소) */
.arc-deep{padding:14px;background:#F5F3FF;border-radius:var(--radius-sm);border-left:3px solid #6366F1;margin-bottom:12px}
.arc-deep-title{font-size:14px;font-weight:700;color:var(--ink);margin-bottom:8px}
.arc-deep-summary{font-size:13px;color:var(--ink-mid);line-height:1.6;margin-bottom:8px}
.arc-deep-qa{margin-top:8px}
.arc-deep-q{font-size:13px;font-weight:700;color:#6366F1;margin-bottom:4px}
.arc-deep-a{font-size:13px;color:var(--ink-mid);line-height:1.7;margin-bottom:10px}

/* Hot Issue (축소) */
.arc-hot{padding:14px;background:var(--red-lt);border-radius:var(--radius-sm);border-left:3px solid var(--red);margin-bottom:8px}
.arc-hot-title{font-size:14px;font-weight:700;color:var(--ink);margin-bottom:6px}
.arc-hot-body{font-size:13px;color:var(--ink-mid);line-height:1.7}
.arc-hot-body strong{color:var(--ink);font-weight:600}

/* Takeaway */
.arc-takeaway{font-size:12px;color:var(--ink-lt);margin-top:8px;padding:8px 10px;background:rgba(0,0,0,.03);border-radius:6px;line-height:1.5}

/* Toast */
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 24px;border-radius:10px;font-size:13px;font-weight:500;opacity:0;transition:all .3s;z-index:100;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* Empty */
.empty-state{text-align:center;padding:60px 20px;color:var(--ink-lt)}
.empty-state h3{font-size:18px;color:var(--ink);margin-bottom:8px}

@media(max-width:480px){
  .page-hero h1{font-size:20px}
  .acc-date{font-size:15px}
  .acc-trigger{padding:14px 16px}
}
</style>
</head>
<body>

<!-- Loading -->
<div id="loadingState" class="page-loading">
  <div class="spin"></div>
  <p>아카이브를 불러오는 중...</p>
</div>

<!-- Error -->
<div id="errorState" class="page-error" style="display:none"></div>

<!-- Main -->
<div id="mainContent" style="display:none">

  <!-- Header -->
  <header class="arc-header">
    <div class="wrap">
      <a class="arc-back" id="backBtn" href="#">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
        오늘의 브리핑
      </a>
      <div class="arc-title-bar">📚 아카이브</div>
    </div>
  </header>

  <!-- Page Title -->
  <div class="wrap">
    <div class="page-hero">
      <h1>지난 브리핑 모아보기</h1>
      <p id="heroSub">최근 브리핑을 날짜별로 확인할 수 있어요</p>
    </div>
  </div>

  <!-- Accordion List -->
  <div class="wrap">
    <div id="accList"></div>
    <div id="emptyState" class="empty-state" style="display:none">
      <h3>아직 브리핑이 없어요</h3>
      <p>내일부터 매일 아침 브리핑이 쌓여요!</p>
    </div>
  </div>

  <div style="height:40px"></div>
</div>

<div class="toast" id="toast"></div>

<!-- ═══ Firebase + Logic ═══ -->
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import{getFirestore,doc,getDoc,collection,query,orderBy,limit,getDocs}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const FC={apiKey:"AIzaSyCf7CsUTgfIWY-RW_mvTJOhczDtk1xM9sA",authDomain:"kfpc-company-support-project.firebaseapp.com",projectId:"kfpc-company-support-project",storageBucket:"kfpc-company-support-project.firebasestorage.app",messagingSenderId:"1012609333373",appId:"1:1012609333373:web:7b6c207c81ff10d156d914"};
const app=initializeApp(FC);
const db=getFirestore(app,'javia-db');

const params=new URLSearchParams(location.search);
const fcId=params.get('fc')||'';

// ═══ Init ═══
async function init(){
  try{
    if(!fcId){
      showError('잘못된 접근이에요','링크를 다시 확인해주세요.');
      return;
    }

    // 뒤로가기 링크 설정
    document.getElementById('backBtn').href=`./client-daily.html?fc=${fcId}`;

    // 아카이브 데이터 로드
    const snap=await getDocs(query(
      collection(db,'client_daily_reports'),
      orderBy('createdAt','desc'),
      limit(60)
    ));
    const published=snap.docs.filter(d=>d.data().status==='published');

    if(published.length===0){
      document.getElementById('loadingState').style.display='none';
      document.getElementById('mainContent').style.display='block';
      document.getElementById('emptyState').style.display='block';
      return;
    }

    document.getElementById('heroSub').textContent=`최근 ${published.length}일간의 브리핑을 확인할 수 있어요`;

    // 아코디언 렌더링
    const listEl=document.getElementById('accList');
    listEl.innerHTML=published.map((docSnap,idx)=>{
      const d=docSnap.data();
      const fd=d.fileDate||docSnap.id;
      const dateLabel=d.date||fd;
      // 섹션 존재 여부 뱃지
      const hasInds=(d.indicators&&d.indicators.length>0);
      const hasNews=(d.news&&d.news.length>0);
      const hasDeep=!!(d.deepdive&&d.deepdive.title);
      const hasHot=!!(d.hotissue&&d.hotissue.title);

      return `<div class="acc-item" data-idx="${idx}" data-fd="${fd}">
        <div class="acc-trigger" onclick="toggleAcc(${idx})">
          <div class="acc-date">${esc(dateLabel)}</div>
          <div class="acc-meta">
            <div class="acc-badges">
              ${hasInds?'<div class="acc-badge" style="background:var(--accent)" title="경제지표"></div>':''}
              ${hasNews?'<div class="acc-badge" style="background:var(--green)" title="뉴스"></div>':''}
              ${hasDeep?'<div class="acc-badge" style="background:#6366F1" title="딥다이브"></div>':''}
              ${hasHot?'<div class="acc-badge" style="background:var(--red)" title="핫이슈"></div>':''}
            </div>
            <svg class="acc-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
          </div>
        </div>
        <div class="acc-body" id="accBody-${idx}">${renderAccContent(d,published,idx)}</div>
      </div>`;
    }).join('');

    document.getElementById('loadingState').style.display='none';
    document.getElementById('mainContent').style.display='block';

  }catch(e){
    console.error('archive init error:',e);
    showError('데이터를 불러올 수 없어요',e.message);
  }
}

function showError(title,msg){
  document.getElementById('loadingState').style.display='none';
  const el=document.getElementById('errorState');
  el.innerHTML=`<h2>${esc(title)}</h2><p>${esc(msg)}</p>`;
  el.style.display='block';
}

// ═══ Accordion Toggle ═══
window.toggleAcc=function(idx){
  const item=document.querySelector(`.acc-item[data-idx="${idx}"]`);
  if(!item)return;
  item.classList.toggle('open');
};

// ═══ Render Accordion Content ═══
function renderAccContent(d,allDocs,idx){
  let html='';

  // Section 1: 경제지표
  const inds=d.indicators||[];
  if(inds.length){
    // 전일비 계산 (이전 날짜 문서 참조)
    let prevInds=d.prevInds||null;
    if(!prevInds&&idx+1<allDocs.length){
      prevInds=allDocs[idx+1].data().indicators||null;
    }

    const grid=inds.map(ind=>{
      let changeHtml='';
      if(prevInds){
        const prev=prevInds.find(p=>p.label===ind.label);
        if(prev){
          const tVal=parseFloat(String(ind.value).replace(/,/g,''));
          const yVal=parseFloat(String(prev.value).replace(/,/g,''));
          if(!isNaN(tVal)&&!isNaN(yVal)&&yVal!==0){
            const diff=tVal-yVal;
            const pct=((diff/yVal)*100).toFixed(2);
            if(Math.abs(diff)>0.001){
              const cls=diff>0?'up':'down';
              const arrow=diff>0?'▲':'▼';
              const sign=diff>0?'+':'';
              changeHtml=`<div class="mi-change ${cls}">${arrow} ${sign}${Math.abs(diff)<1?diff.toFixed(3):diff.toFixed(2)} (${sign}${pct}%)</div>`;
            }else{
              changeHtml=`<div class="mi-change flat">— 보합</div>`;
            }
          }
        }
      }
      return `<div class="market-item">
        <div class="mi-label">${esc(ind.label)}</div>
        <div class="mi-val">${esc(ind.value)}${ind.unit&&!ind.unit.includes('=')?` ${esc(ind.unit)}`:''}</div>
        ${changeHtml}
      </div>`;
    }).join('');

    const insight=d.indicatorInsight?
      `<div class="indicator-insight"><div class="indicator-insight-title">💡 한 줄 해석</div><p>${esc(d.indicatorInsight)}</p></div>`:'';

    html+=`<div class="arc-sec">
      <div class="arc-sec-head"><div class="arc-sec-num" style="background:var(--accent)">1</div><div class="arc-sec-title">경제지표</div></div>
      <div class="market-strip"><div class="market-grid">${grid}</div>
      <div class="market-note">${esc(d.date||'')} 기준 · 한국은행 ECOS</div></div>
      ${insight}
    </div>`;
  }

  // Section 2: 뉴스
  const news=d.news||[];
  if(news.length){
    const articles=news.map(n=>{
      const tagClass=n.tagClass||'tag-economy';
      return `<div class="arc-news">
        <span class="arc-news-tag ${esc(tagClass)}">${esc(n.tag)}</span>
        <div class="arc-news-title">${esc(n.title)}</div>
        <div class="arc-news-body">${n.body||''}</div>
        ${n.takeaway?`<div class="arc-takeaway">📌 ${esc(n.takeaway).replace(/^📌\s*/,'')}</div>`:''}
      </div>`;
    }).join('');

    html+=`<div class="arc-sec">
      <div class="arc-sec-head"><div class="arc-sec-num" style="background:var(--green)">2</div><div class="arc-sec-title">1분 뉴스</div></div>
      ${articles}
    </div>`;
  }

  // Section 3: 딥다이브
  const deep=d.deepdive;
  if(deep&&deep.title){
    const summary=(deep.summary_3lines||[]).map(l=>`• ${esc(l)}`).join('<br>');
    const qas=(deep.questions||[]).map(qa=>
      `<div class="arc-deep-q">Q. ${esc(qa.q)}</div><div class="arc-deep-a">${qa.a||''}</div>`
    ).join('');

    html+=`<div class="arc-sec">
      <div class="arc-sec-head"><div class="arc-sec-num" style="background:#6366F1">3</div><div class="arc-sec-title">딥다이브</div></div>
      <div class="arc-deep">
        <div class="arc-deep-title">🔍 ${esc(deep.title)}</div>
        ${summary?`<div class="arc-deep-summary">${summary}</div>`:''}
        <div class="arc-deep-qa">${qas}</div>
        ${deep.takeaway?`<div class="arc-takeaway">📌 ${esc(deep.takeaway).replace(/^📌\s*/,'')}</div>`:''}
      </div>
    </div>`;
  }

  // Section 4: 핫이슈
  const hot=d.hotissue;
  if(hot&&hot.title){
    html+=`<div class="arc-sec">
      <div class="arc-sec-head"><div class="arc-sec-num" style="background:var(--red)">4</div><div class="arc-sec-title">핫이슈</div></div>
      <div class="arc-hot">
        <div class="arc-hot-title">🔥 ${esc(hot.title)}</div>
        <div class="arc-hot-body">${hot.body||''}</div>
        ${hot.takeaway?`<div class="arc-takeaway">📌 ${esc(hot.takeaway).replace(/^📌\s*/,'')}</div>`:''}
      </div>
    </div>`;
  }

  if(!html) html='<div style="padding:20px;text-align:center;color:var(--ink-sub)">해당일 데이터가 없습니다</div>';

  // 전체 보기 링크
  html+=`<div style="padding:12px 20px;text-align:center;border-top:1px solid var(--border-lt)">
    <a href="./client-daily.html?fc=${fcId}&d=${d.fileDate||''}" style="font-size:13px;font-weight:600;color:var(--accent);text-decoration:none">📄 이 날 전체 브리핑 보기 →</a>
  </div>`;

  return html;
}

// ═══ Util ═══
function esc(s){return s?String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'):'';}

// ═══ Start ═══
init();
</script>
</body>
</html>
