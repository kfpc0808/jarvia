<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>JARVIA 회원별 관리</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<!-- ★ [2026-11-19] CRM 담당(내부 직원) 전용 화면 — 「회원별 관리」만 보입니다. 관리자 메뉴·데이터는 규칙(firestore.rules)으로 막혀 있습니다. -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',-apple-system,sans-serif;background:#F7F9FC;color:#2C3E50;line-height:1.5;overflow-x:hidden;-webkit-font-smoothing:antialiased}
.hd{background:#0F2440;color:#fff;height:52px;display:flex;align-items:center;padding:0 16px;gap:10px}
.hd b{font-size:20px;font-weight:800}.hd span{font-size:11px;opacity:.6}.hd button{margin-left:auto;background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:7px;padding:5px 12px;font-size:12.5px;cursor:pointer;font-family:inherit}
.main{max-width:1500px;margin:0 auto;padding:16px 16px 40px}
.login{max-width:360px;margin:60px auto;background:#fff;border:1px solid #E1E8EE;border-radius:14px;padding:28px 24px;box-shadow:0 2px 12px rgba(27,58,92,.08)}
.login h1{font-size:20px;color:#1B3A5C;margin-bottom:4px}.login p{font-size:12.5px;color:#7F8C8D;margin-bottom:18px;word-break:keep-all}
.login label{display:block;font-size:12.5px;color:#5c6b78;margin:10px 0 4px}.login input{width:100%;border:1px solid #E1E8EE;border-radius:8px;padding:10px 12px;font-size:14px;font-family:inherit}
.login button{width:100%;margin-top:18px;background:#1B3A5C;color:#fff;border:none;border-radius:8px;padding:11px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.login .err{color:#C0392B;font-size:12.5px;margin-top:10px;min-height:18px;word-break:keep-all}
.wait{padding:60px 16px;text-align:center;color:#7F8C8D}
</style>
</head>
<body>
<div class="hd"><b>JARVIA</b><span>회원별 관리</span><button id="lo" style="display:none">로그아웃</button></div>
<div class="main" id="main"><div class="wait">확인 중...</div></div>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import{getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut,setPersistence,browserLocalPersistence}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import{getFirestore,collection,doc,getDoc,getDocs,updateDoc,query,where,limit,serverTimestamp}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
const FC={apiKey:"AIzaSyBD9p-bf162RiiD1Y3BsY-NvbYjpOSrzmg",authDomain:"jarvia-platform.firebaseapp.com",projectId:"jarvia-platform",storageBucket:"jarvia-platform.firebasestorage.app",messagingSenderId:"388025068900",appId:"1:388025068900:web:09ba8e12e9e9e2ec49de71"};
const app=initializeApp(FC);const auth=getAuth(app);setPersistence(auth,browserLocalPersistence).catch(()=>{});
const db=getFirestore(app,'javia-db');
const CRM='@javia-crm.internal',ADM='@javia-admin.internal';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function showLogin(msg){
  $('lo').style.display='none';
  $('main').innerHTML=`<form class="login" id="lf"><h1>🗂 회원별 관리</h1><p>CRM 담당 계정으로 로그인하세요. (관리자는 관리자 화면의 「회원별 관리」 메뉴를 이용합니다)</p>
   <label>아이디</label><input id="lid" autocomplete="username" required><label>비밀번호</label><input id="lpw" type="password" autocomplete="current-password" required>
   <button type="submit" id="lb">로그인</button><div class="err" id="le">${esc(msg||'')}</div></form>`;
  $('lf').onsubmit=async e=>{e.preventDefault();const lid=$('lid').value.trim(),pw=$('lpw').value;if(!lid||!pw)return;$('lb').disabled=true;$('lb').textContent='로그인 중...';$('le').textContent='';
    try{await signInWithEmailAndPassword(auth,lid.toLowerCase()+CRM,pw);}
    catch(err){$('le').textContent=(err.code==='auth/invalid-credential'||err.code==='auth/wrong-password'||err.code==='auth/user-not-found')?'아이디 또는 비밀번호가 맞지 않습니다.':'로그인 실패: '+err.message;$('lb').disabled=false;$('lb').textContent='로그인';}};
}
$('lo').onclick=async()=>{await signOut(auth);location.replace('crm.html');};
onAuthStateChanged(auth,async u=>{
  if(!u||!u.email){showLogin();return;}
  const em=u.email.toLowerCase();let me=null;
  try{
    if(em.endsWith(CRM)){
      const st=await getDoc(doc(db,'crm_staff',u.uid));
      if(!st.exists()||st.data().status!=='active'){await signOut(auth);showLogin('사용이 중지되었거나 등록되지 않은 계정입니다. 관리자에게 문의하세요.');return;}
      const lid=em.slice(0,-CRM.length);const a=await getDocs(query(collection(db,'admins'),where('authUid','==',u.uid),limit(1)));
      const ad=a.empty?null:a.docs[0];
      if(!ad||ad.data().status!=='active'){await signOut(auth);showLogin('사용이 중지된 계정입니다. 관리자에게 문의하세요.');return;}
      me={id:ad.id,name:ad.data().name||lid,role:'crm',uid:u.uid};
      updateDoc(ad.ref,{lastLoginAt:serverTimestamp()}).catch(()=>{});
    }else if(em.endsWith(ADM)){
      const lid=em.slice(0,-ADM.length);const a=await getDocs(query(collection(db,'admins'),where('loginId','==',lid),limit(1)));
      if(a.empty){showLogin('등록되지 않은 계정입니다.');return;}
      me={id:a.docs[0].id,name:a.docs[0].data().name||lid,role:a.docs[0].data().role||'admin',uid:u.uid};
    }else{showLogin('회원 계정으로는 이 화면을 쓸 수 없습니다. CRM 담당 계정으로 로그인하세요.');return;}
  }catch(e){showLogin('계정 확인 실패: '+e.message);return;}
  $('lo').style.display='';
  $('main').innerHTML='<div id="crm-root"></div>';
  const m=await import('./jv-crm.js?v=20261119');
  m.mountCrm({db,root:$('crm-root'),me});
});
</script>
</body>
</html>
