<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ICM INSIGHT · 기업경영연구소</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600;700&display=swap">
<!--
  ★ [2026-10-01] 브로슈어 리포트 — 고객용 화면
  주소: ebook.icm.re.kr/{아이디}/report?r={리포트 id}[&c={맞춤 링크 코드}]   (_redirects 가 이 파일로 연결)
  · 서버 함수 brochureReport 로 게시중·지난 리포트만 받는다 (작성중·승인대기·반려 글은 열리지 않음)
  · 상담 신청은 브로슈어와 같은 brochureRequest 를 부른다 → 전문위원 알림톡·고객 접수 안내 흐름 동일
  · 고객 화면이므로 자비아·이너서클·한국FP센터 표기를 쓰지 않는다
-->
<style>
:root{--ink:#2A231D;--ink2:#3B332C;--gold:#D9BE87;--gold2:#A8844A;--gold3:#7A5C2C;--cream:#F5EFE6;--paper:#F4ECDF;--line:#E3D8C6;--mut:#5E5145}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:'Noto Sans KR',-apple-system,'Malgun Gothic',sans-serif;background:#E9E0D2;color:var(--ink);word-break:keep-all}
a{color:inherit}
.sf{font-family:'Noto Serif KR','Nanum Myeongjo',Georgia,serif}
.pg{max-width:560px;margin:0 auto;background:var(--cream);min-height:100vh;min-height:100dvh;padding-bottom:env(safe-area-inset-bottom,0px)}
.tb{position:sticky;top:0;z-index:5;height:calc(56px + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) 8px 0;background:var(--ink);border-bottom:1px solid rgba(217,190,135,.3);display:flex;align-items:center;justify-content:space-between}
.tb .bk{display:inline-flex;align-items:center;gap:4px;height:44px;padding:0 10px;color:var(--gold);font-size:14px;text-decoration:none}
.tb .lg{display:flex;align-items:center;gap:8px}
.tb .lg i{width:28px;height:28px;border:1.5px solid var(--gold);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-style:normal;font-weight:700;color:var(--gold);letter-spacing:1px}
.tb .lg b{font-size:14px;color:var(--paper)}
.tb .sh{width:44px;height:44px;border:none;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer}
.hero{background:var(--ink);padding:34px 24px 30px}
.hero .lb{font-size:12px;font-weight:700;letter-spacing:.24em;color:var(--gold)}
.hero .lb span{letter-spacing:0;color:#CFC3B2;font-weight:400;margin-left:10px}
.hero h1{font-size:29px;font-weight:700;line-height:1.4;color:var(--paper);margin:16px 0 14px;letter-spacing:-.02em}
.hero p{font-size:15px;line-height:1.7;color:#D8CDBD}
.au{display:flex;align-items:center;gap:12px;margin-top:18px;padding-top:16px;border-top:1px solid rgba(217,190,135,.25)}
.au i{width:40px;height:40px;border-radius:50%;background:var(--gold);color:var(--ink);display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:700;font-size:17px;flex-shrink:0}
.au b{display:block;font-size:14px;color:var(--paper)}
.au span{font-size:12px;color:#BFB2A0}
.bd{padding:32px 24px 8px}
.sc{margin-bottom:28px}
.sc h2{display:flex;align-items:baseline;gap:12px;font-size:20px;font-weight:700;line-height:1.45;color:var(--ink);margin-bottom:12px}
.sc h2 em{font-style:normal;font-size:30px;font-weight:700;color:var(--gold2);line-height:1;flex-shrink:0}
.sc p{font-size:16px;line-height:1.85;color:var(--ink2);white-space:pre-wrap}
.qt{background:var(--ink);border-radius:6px;padding:22px;margin:0 0 28px;font-size:20px;font-weight:600;line-height:1.6;color:var(--paper)}
.ky{background:#fff;border:1px solid var(--line);border-radius:6px;padding:20px 22px;margin-bottom:28px}
.ky b{display:block;font-size:13px;letter-spacing:.14em;color:var(--gold3);margin-bottom:10px}
.ky div{font-size:15px;line-height:1.65;padding:3px 0;display:flex;gap:10px}
.ky div::before{content:'·';color:var(--gold2);font-weight:700}
.ct{margin:2px 24px 0;padding:26px 22px;background:var(--ink);border-radius:8px}
.ct h3{font-size:21px;font-weight:700;line-height:1.45;color:var(--paper);margin-bottom:10px}
.ct p{font-size:14px;line-height:1.7;color:#D8CDBD;margin-bottom:14px}
.ct button{display:block;width:100%;border-radius:8px;font-family:inherit;font-weight:700;cursor:pointer}
.ct .b1{height:52px;border:none;background:var(--gold);color:#231D17;font-size:16px}
.ct .b2{height:48px;margin-top:10px;border:1px solid rgba(217,190,135,.6);background:transparent;color:var(--gold);font-size:15px;font-weight:500}
.ac{margin:18px 24px 0;padding:20px;background:#fff;border:1px solid var(--line);border-radius:8px}
.ac .hd{display:flex;align-items:center;gap:14px}
.ac .hd i{width:56px;height:56px;border-radius:50%;background:#E8DDCB;color:var(--gold3);display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:700;font-size:22px;flex-shrink:0}
.ac .hd b{display:block;font-size:16px}
.ac .hd span{font-size:13px;color:var(--mut)}
.ac .bt{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.ac .bt a{height:44px;border-radius:8px;background:var(--cream);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#5C4420;text-decoration:none}
.ac .bt a:only-child{grid-column:1/-1}
.pv{margin:30px 24px 0}
.pv>b{display:block;font-size:13px;letter-spacing:.14em;color:var(--gold3);padding-bottom:8px}
.pv a{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 0;border-top:1px solid var(--line);text-decoration:none}
.pv a:last-child{border-bottom:1px solid var(--line)}
.pv a span{font-size:15px;font-weight:500;line-height:1.5}
.pv a small{font-size:12px;color:#6B5E51;flex-shrink:0}
.ft{margin-top:30px;padding:26px 24px 34px;background:#E9E0D2;font-size:12px;line-height:1.7;color:var(--mut)}
.ft b{display:block;font-size:13px;color:var(--ink2);margin-bottom:6px}
.msg{padding:120px 28px;text-align:center;color:var(--mut);font-size:15px;line-height:1.7}
.msg a{display:inline-flex;margin-top:18px;height:46px;align-items:center;padding:0 22px;border-radius:8px;background:var(--ink);color:var(--gold);text-decoration:none;font-weight:700}
.tst{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:rgba(20,16,12,.9);color:#fff;font-size:14px;padding:11px 18px;border-radius:22px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60}
.tst.on{opacity:1}
/* 상담 신청 — 브로슈어와 같은 항목·문구 */
.dim{position:fixed;inset:0;z-index:50;background:rgba(20,16,12,.55);display:none;align-items:flex-end;justify-content:center}
.dim.on{display:flex}
.md{width:100%;max-width:560px;max-height:92vh;max-height:92dvh;overflow-y:auto;background:#fff;border-radius:22px 22px 0 0;padding:24px 22px calc(22px + env(safe-area-inset-bottom,0px));position:relative}
.md h3{font-size:21px;font-weight:700;color:#231D17}
.md .sub{font-size:13.5px;color:#7A6F64;margin:6px 0 18px}
.md .x{position:absolute;right:12px;top:12px;width:44px;height:44px;border:none;background:none;font-size:26px;color:#5E5145;cursor:pointer}
.fl{margin-bottom:14px}
.fl label{display:block;font-size:14px;font-weight:700;color:#3B332C;margin-bottom:7px}
.fl label i{font-style:normal;font-weight:400;color:#8B7F70}
.fl input,.fl select,.fl textarea{width:100%;height:50px;border:1px solid #DCD3C6;border-radius:10px;background:#FAF8F5;padding:0 14px;font-size:16px;font-family:inherit;color:#231D17}
.fl textarea{height:90px;padding:12px 14px;resize:none;line-height:1.6}
.fl input:focus,.fl select:focus,.fl textarea:focus{outline:none;border-color:var(--gold2);background:#fff}
.rw{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ag{display:flex;gap:10px;align-items:flex-start;background:#F3F0EB;border-radius:10px;padding:14px;margin:4px 0 12px;font-size:13px;line-height:1.6;color:#5E5145}
.ag input{width:22px;height:22px;flex-shrink:0;margin-top:1px;accent-color:#3A332C}
.er{display:none;color:#A93B33;font-size:13.5px;margin-bottom:10px}
.go{width:100%;height:54px;border:none;border-radius:12px;background:#3A332C;color:var(--gold);font-size:17px;font-weight:700;font-family:inherit;cursor:pointer}
.go:disabled{opacity:.6}
.dn{display:none;text-align:center;padding:10px 0 4px}
.dn .ok{width:56px;height:56px;border-radius:50%;background:#3A332C;color:var(--gold);font-size:28px;display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
.dn p{font-size:14.5px;line-height:1.7;color:#5E5145;margin:10px 0 18px}
@media(max-width:380px){.hero h1{font-size:26px}.rw{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="pg">
  <div class="tb">
    <a class="bk" id="bk" href="#"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#D9BE87" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>브로슈어</a>
    <div class="lg"><i>ICM</i><b>기업경영연구소</b></div>
    <button class="sh" id="sh" type="button" aria-label="리포트 공유"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#D9BE87" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg></button>
  </div>
  <div id="main"><div class="msg">리포트를 불러오는 중입니다…</div></div>
</div>

<div class="dim" id="dim" role="dialog" aria-modal="true" aria-label="전문가 상담 신청">
  <div class="md">
    <button class="x" type="button" id="mx" aria-label="닫기">&times;</button>
    <div id="fm">
      <h3>전문가 상담 신청</h3>
      <p class="sub">남겨주신 정보는 담당 전문위원에게 바로 전달됩니다</p>
      <div class="fl"><label for="f-area">상담 분야</label><select id="f-area"></select></div>
      <div class="rw">
        <div class="fl"><label for="f-name">성명</label><input id="f-name" type="text" maxlength="20" placeholder="홍길동" autocomplete="name"></div>
        <div class="fl"><label for="f-tel">연락처</label><input id="f-tel" type="tel" maxlength="20" placeholder="010-0000-0000" autocomplete="tel"></div>
      </div>
      <div class="fl"><label for="f-comp">회사명 <i>(선택)</i></label><input id="f-comp" type="text" maxlength="40" placeholder="(주)대한산업" autocomplete="organization"></div>
      <div class="fl"><label for="f-memo">문의 내용 <i>(선택)</i></label><textarea id="f-memo" maxlength="300" placeholder="궁금한 점을 간단히 적어주세요"></textarea></div>
      <div class="ag"><input id="f-ok" type="checkbox"><label for="f-ok">상담 연락을 위한 <b>개인정보 수집·이용</b>에 동의합니다. 수집 항목은 성명·연락처·회사명·문의내용이며, 상담 종료 후 지체 없이 파기합니다.</label></div>
      <div class="er" id="f-er"></div>
      <button class="go" id="f-go" type="button">신청하기</button>
    </div>
    <div class="dn" id="dn">
      <div class="ok">&#10003;</div>
      <h3>신청이 접수되었습니다</h3>
      <p>담당 전문위원에게 전달되었습니다.<br>영업일 기준 1일 이내에 연락드립니다.</p>
      <button class="go" type="button" id="dn-go">리포트 계속 보기</button>
    </div>
  </div>
</div>
<div class="tst" id="tst"></div>

<script>
(function(){
  'use strict';
  var API = 'https://asia-northeast3-jarvia-platform.cloudfunctions.net/';
  var AREAS = ['세무','관세','법률','특허','M&A','기업신용평가','부동산','감정평가','법무·행정','비용절감','기업금융','기업인증·R&D','노무',
               '경영컨설팅·자산관리','법정의무교육·기업교육','의료·건강','기타'];   /* 서버 BROCHURE_AREAS 와 같은 목록 */
  function $(id){ return document.getElementById(id); }
  function esc(s){ var d=document.createElement('div'); d.textContent = (s==null?'':String(s)); return d.innerHTML; }
  function toast(m){ var t=$('tst'); t.textContent=m; t.classList.add('on'); clearTimeout(toast._t); toast._t=setTimeout(function(){ t.classList.remove('on'); }, 2400); }

  var seg = location.pathname.split('/').filter(Boolean);
  var MID = seg.length > 1 ? decodeURIComponent(seg[0]) : '';
  var Q = new URLSearchParams(location.search);
  var RID = Q.get('r') || '', CODE = Q.get('c') || '';
  if (!/^[A-Za-z0-9]{6,12}$/.test(CODE)) CODE = '';   /* 브로슈어 맞춤 링크 코드와 같은 형식만 */
  var base = '/' + encodeURIComponent(MID) + '/';
  var keep = CODE ? 'c=' + encodeURIComponent(CODE) + (Q.get('f') === '1' ? '&f=1' : '') : '';   /* 브로슈어로 돌아갈 때 맞춤 링크(공유 여부 포함)를 그대로 */
  $('bk').href = base + (keep ? '?' + keep : '');
  var REP = null;

  async function callFn(name, data){
    var res = await fetch(API + name, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ data: data }) });
    var js = await res.json().catch(function(){ return {}; });
    if (!res.ok || js.error) throw new Error((js.error && js.error.message) || '서버 오류');
    return js.result || {};
  }

  function fail(m){
    $('main').innerHTML = '<div class="msg">' + esc(m || '리포트를 찾을 수 없습니다.') + '<br><a href="' + esc($('bk').getAttribute('href')) + '">브로슈어 보기</a></div>';
  }

  function render(r){
    var rep = r.report, au = r.author || {};
    REP = rep;
    document.title = rep.title + ' · ICM INSIGHT';
    var secs = (rep.sections || []).filter(function(s){ return s && (s.h || s.b); });
    var h = '';
    h += '<div class="hero"><div class="lb">ICM INSIGHT' + (rep.topic ? '<span>' + esc(rep.topic) + '</span>' : '') + '</div>'
      + '<h1 class="sf">' + esc(rep.title) + '</h1>' + (rep.summary ? '<p>' + esc(rep.summary) + '</p>' : '')
      + '<div class="au"><i class="sf">' + esc(String(au.name || '').slice(0,1) || '·') + '</i><div><b>' + esc(au.name || '') + ' 전문위원</b><span>경영컨설팅 부문' + (rep.date ? ' · ' + esc(rep.date) : '') + '</span></div></div></div>';
    h += '<div class="bd">';
    secs.forEach(function(s, i){
      h += '<div class="sc"><h2><em class="sf">' + String(i+1).padStart(2,'0') + '</em>' + esc(s.h) + '</h2><p>' + esc(s.b) + '</p></div>';
      if (i === 1 && rep.quote) h += '<div class="qt sf">“' + esc(rep.quote) + '”</div>';
    });
    if (secs.length < 2 && rep.quote) h += '<div class="qt sf">“' + esc(rep.quote) + '”</div>';
    var keys = (rep.keys || []).filter(Boolean);
    if (keys.length) h += '<div class="ky"><b>핵심 정리</b>' + keys.map(function(k){ return '<div>' + esc(k) + '</div>'; }).join('') + '</div>';
    h += '</div>';
    h += '<div class="ct"><h3 class="sf">이 주제로 상담이 필요하신가요?</h3><p>세무·법률·노무 분야 전문가 그룹과 함께 대표님 회사에 맞는 방법을 찾아드립니다.</p>'
      + '<button class="b1" type="button" id="go-c">상담 신청하기</button><button class="b2" type="button" id="go-s">지인 대표님께 공유하기</button></div>';
    h += '<div class="ac"><div class="hd"><i class="sf">' + esc(String(au.name || '').slice(0,1) || '·') + '</i><div><b>' + esc(au.name || '') + ' 전문위원</b><span>ICM 기업경영연구소 · 경영컨설팅 부문</span></div></div><div class="bt">'
      + (/^https?:\/\//i.test(au.homeUrl || '') ? '<a href="' + esc(au.homeUrl) + '" target="_blank" rel="noopener">전문위원 홈페이지</a>' : '')
      + '<a href="' + esc($('bk').getAttribute('href')) + '">브로슈어 보기</a></div></div>';
    if ((r.prev || []).length){
      h += '<div class="pv"><b>이전 리포트</b>' + r.prev.map(function(p){
        return '<a href="' + base + 'report?r=' + encodeURIComponent(p.id) + (keep ? '&' + keep : '') + '"><span>' + esc(p.title) + '</span><small>' + esc(p.month || '') + '</small></a>';
      }).join('') + '</div>';
    }
    h += '<div class="ft"><b>ICM 기업경영연구소</b>본 리포트는 일반적인 정보 제공을 위한 자료이며, 개별 기업의 상황에 대한 세무·법률 자문이 아닙니다. 구체적인 판단은 상담을 통해 확인하시기 바랍니다.</div>';
    $('main').innerHTML = h;
    $('go-c').onclick = openForm;
    $('go-s').onclick = share;
  }

  /* 공유 — 받은 분이 열어도 같은 리포트. 맞춤 링크 코드(c)는 넘기지 않는다(받은 분의 열람이 보낸 분 기록에 섞이지 않게) */
  async function share(){
    var url = location.origin + base + 'report?r=' + encodeURIComponent(RID);
    var title = REP ? REP.title : 'ICM INSIGHT';
    try{
      if (navigator.share){ await navigator.share({ title: title, text: title + ' — ICM 기업경영연구소', url: url }); return; }
    }catch(e){ if (e && e.name === 'AbortError') return; }
    try{ await navigator.clipboard.writeText(url); toast('링크를 복사했습니다. 메시지에 붙여 넣어 보내세요.'); }
    catch(_){ prompt('아래 링크를 복사해 보내세요', url); }
  }

  /* 상담 신청 — 브로슈어 상담 팝업과 같은 항목·검사·서버 함수 */
  function openForm(){
    var sel = $('f-area');
    if (!sel.options.length){
      sel.innerHTML = '<option value="">상담 분야를 선택해 주세요</option>' + AREAS.map(function(a){ return '<option>' + esc(a) + '</option>'; }).join('');
    }
    if (REP && AREAS.indexOf(REP.topic) >= 0) sel.value = REP.topic;
    if (REP && !$('f-memo').value) $('f-memo').value = '「' + REP.title + '」 리포트를 보고 문의드립니다.';
    $('fm').style.display = ''; $('dn').style.display = 'none'; $('f-er').style.display = 'none';
    $('dim').classList.add('on');
  }
  function closeForm(){ $('dim').classList.remove('on'); }
  function err(m){ var e=$('f-er'); e.textContent=m; e.style.display='block'; }
  async function send(){
    var area = $('f-area').value, name = $('f-name').value.trim(), tel = $('f-tel').value.trim(),
        comp = $('f-comp').value.trim(), memo = $('f-memo').value.trim();
    $('f-er').style.display = 'none';
    if (!area) return err('상담 분야를 선택해 주세요.');
    if (!name) return err('성명을 입력해 주세요.');
    if (!/^0\d{1,2}-?\d{3,4}-?\d{4}$/.test(tel.replace(/\s/g,''))) return err('연락처를 정확히 입력해 주세요.');
    if (!$('f-ok').checked) return err('개인정보 수집·이용에 동의해 주세요.');
    var b = $('f-go'); b.disabled = true; b.textContent = '전송 중…';
    try{
      var r = await callFn('brochureRequest', { id: MID, c: CODE, area: area, name: name, phone: tel, company: comp, memo: memo, agree: true });
      if (!r || r.ok !== true) throw new Error((r && r.message) || '전송에 실패했습니다.');
      $('fm').style.display = 'none'; $('dn').style.display = 'block';
      ['f-name','f-tel','f-comp','f-memo'].forEach(function(id){ $(id).value = ''; }); $('f-ok').checked = false;
    }catch(e){ err((e && e.message) || '전송에 실패했습니다. 잠시 후 다시 시도해 주세요.'); }
    b.disabled = false; b.textContent = '신청하기';
  }
  $('f-go').onclick = send; $('mx').onclick = closeForm; $('dn-go').onclick = closeForm;
  $('dim').addEventListener('click', function(e){ if (e.target === $('dim')) closeForm(); });
  $('sh').onclick = share;
  if (!MID || !RID){ fail(); return; }
  callFn('brochureReport', { id: MID, r: RID }).then(function(r){
    if (!r || r.ok !== true || !r.report) return fail(r && r.message);
    render(r);
  }).catch(function(){ fail('잠시 후 다시 시도해 주세요.'); });
})();
</script>
</body>
</html>
