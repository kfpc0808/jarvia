<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>이너서클 브리핑</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&family=Noto+Serif+KR:wght@700&display=swap" rel="stylesheet">
<style>
/* ── 이너 Platform(inner.html) 과 같은 헤더 톤 ── */
:root{--navy:#0E2438;--navy-2:#16324D;--ink:#141A24;--gray:#3A4353;--gray-l:#6B7585;--line:#E4E8EE;--paper:#F7F8FA;--gold:#C9A96E;--gold-dk:#9E7F45;--gold-bg:#FBF6EC;--ok:#1B7A5A;--ok-bg:#EAF5F0;--red:#B42318;--red-bg:#FEF3F2;--green:#0F6B4F;--green-bg:#EAF6F1;--green-line:#BFE0D1;--primary:#1B3A5C;--primary-dk:#0F2440;--safe-t:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',-apple-system,sans-serif;color:var(--ink);background:var(--paper);line-height:1.8;font-size:16px;word-break:keep-all;padding-bottom:40px}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
a{color:var(--primary)}
.hdwrap{position:sticky;top:0;z-index:60;background:var(--navy);padding-top:var(--safe-t)}
.tb{display:flex;align-items:center;height:56px;padding:0 16px;gap:12px;max-width:1180px;margin:0 auto;color:#fff}
.tb .lg{font-weight:800;font-size:15px;display:flex;align-items:center;gap:8px}.tb .lg .dot{width:8px;height:8px;border-radius:50%;background:var(--gold)}.tb .lg .sub{font-weight:400;font-size:11px;color:#B8C6D8;margin-left:4px;letter-spacing:.06em}
.tb .sp{flex:1}.tb .who{font-size:13px;color:#B8C6D8}.tb .out{font-size:13px;color:#fff;border:1px solid rgba(255,255,255,.3);padding:5px 10px;border-radius:6px}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 0}
/* 회차 선택 */
.picker{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.picker select,.picker input{padding:8px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:14px;background:#fff}
.picker .chip{font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:6px;background:var(--gold);color:var(--primary-dk)}
.picker .chip.tax{background:var(--green);color:#fff}
.empty{text-align:center;padding:60px 20px;color:var(--gray-l)}
/* 회차 헤드 */
.head{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px 22px;margin-bottom:16px}
.head h1{font-size:23px;font-weight:800;line-height:1.35;letter-spacing:-.02em}
.head .meta{margin-top:8px;font-size:13.5px;color:var(--gray-l)}
.head .pre{margin-top:14px;padding:12px 14px;background:var(--gold-bg);border-radius:10px;font-size:14px}
.head .open{display:inline-block;margin-top:14px;padding:11px 18px;background:var(--primary);color:#fff;border-radius:9px;font-weight:700;text-decoration:none;font-size:15px}
/* ── Tax Master 본문 (STEP4 HTML 조각) — v2 규격 ── */
.sec{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px 22px;margin-bottom:16px}
.sec h2{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:800;line-height:1.35;margin-bottom:14px}
.num{width:28px;height:28px;border-radius:50%;background:var(--gold-bg);color:var(--gold-dk);font-size:13px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.sec p{margin-bottom:14px}.sec p:last-child{margin-bottom:0}.sec h3{font-size:16.5px;font-weight:700;margin:22px 0 8px}.sec h4{font-size:15px;font-weight:700;margin:16px 0 6px;color:var(--primary)}
.rule{border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:12px;padding:18px 18px 16px;margin:14px 0 18px;background:#FFFDF9}
.rule-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}.rule-no{font-size:12px;font-weight:800;color:#fff;background:var(--gold-dk);padding:3px 10px;border-radius:5px}.rule-doc{font-size:12.5px;font-weight:700;color:var(--gold-dk)}
.rule h3{margin:4px 0 10px;font-size:17px}
.one{margin:18px 0 0;padding:14px 18px;background:var(--primary-dk);color:#fff;border-radius:12px;font-size:16px;line-height:1.7}.one small{display:block;font-size:12px;color:var(--gold);font-weight:700;margin-bottom:4px}
.big{margin:12px 0;padding:18px 20px;background:var(--gold-bg);border-radius:12px}.big .n{font-size:30px;font-weight:800;color:var(--primary);line-height:1.2}.big .l{font-size:14px;color:var(--gray-l);margin-top:4px}
details{margin:10px 0;border:1px solid var(--line);border-radius:10px;background:#FAFAFB}summary{cursor:pointer;padding:12px 16px;font-size:14.5px;font-weight:600;color:var(--primary);list-style:none;display:flex;align-items:center;gap:8px}summary::-webkit-details-marker{display:none}summary::before{content:"▸";font-size:12px}details[open] summary::before{transform:rotate(90deg)}details .in{padding:0 16px 16px;font-size:14.5px}
.calc{white-space:pre-wrap;font-size:13.5px;line-height:1.75;color:#374151}
table{width:100%;border-collapse:collapse;margin:10px 0;font-size:14.5px}th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{font-size:12.5px;color:var(--gray-l);font-weight:600}td.r{text-align:right;white-space:nowrap}tr:last-child td{border-bottom:0}
.cards{display:grid;grid-template-columns:1fr;gap:12px;margin:12px 0}.card{border:1px solid var(--line);border-radius:12px;padding:16px;background:#fff}.card.no{background:#F9FAFB;color:var(--gray-l)}.card .t{font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px;margin-bottom:8px}.card .t i{font-style:normal;font-size:11px;padding:2px 8px;border-radius:4px;background:var(--gold-bg);color:var(--gold-dk);font-weight:700}.card .t i.ng{background:var(--red-bg);color:var(--red)}.card .t i.ok{background:var(--green-bg);color:var(--green)}.card .v{font-size:24px;font-weight:800;color:var(--primary);line-height:1.2;margin:6px 0 2px}.card.no .v{color:var(--gray-l)}.card .d{font-size:13.5px;color:var(--gray-l)}.card .d b{color:var(--ink)}
.traps{list-style:none}.traps li{position:relative;padding:14px 0 14px 34px;border-top:1px solid var(--line)}.traps li:first-child{border-top:0;padding-top:0}.traps li::before{content:"!";position:absolute;left:0;top:14px;width:22px;height:22px;border-radius:50%;background:var(--red-bg);color:var(--red);font-weight:800;text-align:center;line-height:22px;font-size:13px}.traps li:first-child::before{top:0}.traps b{display:block;font-size:15.5px;margin-bottom:4px}.traps span{font-size:14.5px;color:#374151}
.dlg{margin:10px 0 18px}.dlg p{margin:0 0 10px;padding-left:14px;border-left:3px solid var(--line);font-size:15px}.dlg p.d{border-left-color:var(--red);color:#374151}.dlg p.c{border-left-color:var(--primary)}.dlg p b{font-size:12px;display:block;color:var(--gray-l);margin-bottom:2px}
#it-s6{background:var(--gold-bg);border-color:#EFE3C9}.ask{display:block;font-family:'Noto Serif KR',serif;font-size:21px;font-weight:700;line-height:1.55;color:var(--primary-dk);margin:10px 0 14px}
.branch{display:grid;gap:10px;margin:10px 0}.branch div{padding:12px 14px;background:#fff;border-radius:10px;font-size:14.5px}.branch b{display:block;color:var(--gold-dk);margin-bottom:4px}
.chk{list-style:none;margin:8px 0}.chk li{padding:8px 0 8px 30px;position:relative;font-size:15px}.chk li::before{content:"";position:absolute;left:2px;top:13px;width:16px;height:16px;border:2px solid var(--primary);border-radius:4px}
.type{display:inline-block;font-size:12px;font-weight:700;color:var(--gold-dk);background:var(--gold-bg);padding:3px 10px;border-radius:4px;margin:18px 0 4px}
.qa details{background:#fff;margin:8px 0}.qa summary{font-size:15px;font-weight:700;color:var(--ink);padding:14px 16px}.qa summary::before{content:"“";color:var(--gold);font-size:18px;line-height:0}.qa details[open] summary::before{transform:none}.qa .in{font-size:15px;color:#374151;padding-top:2px}.qa .tip{font-size:13px;color:var(--gray-l);margin-top:8px;padding-left:10px;border-left:2px solid var(--gold)}
mark.cm-check{background:#FFF3C4;padding:0 4px;border-radius:3px}
/* ── CEO 전달본 ── */
.ceo{background:var(--green-bg);border:1px solid var(--green-line);border-radius:16px;padding:24px 22px;margin-bottom:16px}
.ceo h2{color:var(--green);display:flex;align-items:center;gap:10px;font-size:19px;font-weight:800;margin-bottom:10px}.ceo .num{background:#fff;color:var(--green)}
.ceo-prev{background:#fff;border-radius:12px;padding:16px;margin:12px 0}
.ceo-prev .c{display:flex;gap:12px;align-items:center;padding:12px;background:var(--green-bg);border-radius:10px;margin-bottom:12px}.ceo-prev .av{width:42px;height:42px;border-radius:50%;background:#CFE6DB;display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--green);flex-shrink:0;overflow:hidden}.ceo-prev .av img{width:100%;height:100%;object-fit:cover}
.ceo-prev .c b{display:block;font-size:15px}.ceo-prev .c span{font-size:13px;color:var(--gray-l)}.ceo-prev .c em{display:block;font-style:normal;font-size:13px;margin-top:3px}
.ceo-prev ol{margin:8px 0 0 20px;font-size:14.5px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.btns button{padding:10px 16px;border-radius:9px;font-size:14px;font-weight:700;background:#fff;border:1px solid var(--green-line);color:var(--green)}.btns button.pri{background:var(--green);color:#fff;border-color:var(--green)}
.cnt{display:inline-block;min-width:20px;padding:0 6px;border-radius:10px;background:var(--green);color:#fff;font-size:11.5px;text-align:center;margin-left:4px}
.note{font-size:13.5px;color:var(--gray-l)}
/* 모달 */
.modal{position:fixed;inset:0;background:rgba(14,36,56,.5);z-index:80;display:none;align-items:center;justify-content:center;padding:16px}.modal.show{display:flex}
.modal-in{background:#fff;border-radius:14px;padding:22px;width:100%;max-width:520px;max-height:90vh;overflow:auto}.modal-in.wide{max-width:780px}
.modal-in h3{font-size:17px;margin:0 0 8px;color:var(--green)}
.modal-in label{display:block;font-size:13.5px;font-weight:700;margin:12px 0 4px}.modal-in label small{font-weight:400;color:var(--gray-l);margin-left:6px}
.modal-in input[type=text],.modal-in textarea{display:block;width:100%;margin-top:6px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:14.5px;line-height:1.6;font-weight:400}
.lock{margin:12px 0 4px;padding:10px 12px;background:#F3F4F6;border-radius:8px;font-size:13.5px;color:var(--gray-l)}
.opts{display:flex;gap:16px;flex-wrap:wrap;margin:14px 0 4px}.opts label{display:inline-flex;align-items:center;gap:6px;margin:0;font-weight:500}
.log-bar{display:flex;gap:12px;align-items:center;margin:10px 0}.log-bar input{flex:1;margin:0;padding:9px 12px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:14px}
.log-wrap{overflow-x:auto}table.log{font-size:14px;margin:0}
table.log td.views b{color:#0f6b4f}table.log td.views small{color:#6b7280;margin-left:2px}table.log td.views .dim{color:#9ca3af}   /* ★ [2026-09-09] 열람 표시 */
table.log th{cursor:pointer;user-select:none;white-space:nowrap;color:var(--ink);font-weight:700}table.log th.on::after{content:" ▾";color:var(--green)}table.log th.on.asc::after{content:" ▴"}table.log td{white-space:nowrap}table.log td.topic{white-space:normal;min-width:160px}table.log .del{color:#9CA3AF;font-size:16px;padding:0 6px}table.log .del:hover{color:var(--red)}table.log .empty{text-align:center;color:var(--gray-l);padding:24px}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--primary-dk);color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;z-index:99;box-shadow:0 6px 20px rgba(0,0,0,.2);opacity:0;transition:opacity .2s;pointer-events:none}
@media(min-width:900px){body{font-size:17px}.wrap{max-width:860px;padding:24px 24px 0}.head,.sec,.ceo{padding:32px 40px;margin-bottom:20px}.head h1{font-size:28px}.sec h2{font-size:22px}.cards{grid-template-columns:1fr 1fr}.branch{grid-template-columns:1fr 1fr 1fr}.big .n{font-size:36px}.ask{font-size:25px}table{font-size:15.5px}.one{font-size:17px;padding:18px 24px}}
</style>
</head>
<body>
<div class="hdwrap"><div class="tb"><div class="lg"><span class="dot"></span>이너서클 브리핑<span class="sub">INNER CIRCLE</span></div><span class="sp"></span><span class="who" id="hd-me"></span><button class="out" id="hd-out">나가기</button></div></div>
<main class="wrap">
  <div class="picker"><select id="pick"></select><span id="kind" class="chip" hidden></span></div>
  <div id="view"><div class="empty">불러오는 중…</div></div>
</main>

<!-- 편집 -->
<div id="mEdit" class="modal"><div class="modal-in">
  <h3>CEO 전달본 편집</h3>
  <label>카드 문장 <small>기본값을 그대로 쓰거나 고치세요</small><input type="text" id="e_card" maxlength="80"></label>
  <label>개인 메시지 <small>선택 · 대표 이름을 부르면 개인 편지가 됩니다</small><textarea id="e_msg" rows="2" maxlength="600" placeholder="예: 김 대표님, 지난번 말씀하신 가지급금 건 정리해서 보내드립니다."></textarea></label>
  <label>본문 1<textarea id="e_b1" rows="4" maxlength="3000"></textarea></label>
  <div class="lock">📋 예규 근거 <small>고정 · 수정 불가</small></div>
  <label>본문 2<textarea id="e_b2" rows="3" maxlength="3000"></textarea></label>
  <label>본문 3<textarea id="e_b3" rows="2" maxlength="3000"></textarea></label>
  <label>하단 카드 문구 <small>상담 버튼 옆 한 줄 · 준비물과 시간</small><input type="text" id="e_cta" maxlength="80"></label>
  <div class="opts"><label><input type="checkbox" id="o_basis" checked> 예규 근거</label><label><input type="checkbox" id="o_table" checked> 비교표</label><label><input type="checkbox" id="o_chk" checked> 체크리스트</label></div>
  <div class="btns"><button class="pri" type="button" onclick="ceoSave()">저장</button><button type="button" onclick="ceoReset()">원본으로 되돌리기</button><button type="button" onclick="mClose('mEdit')">닫기</button></div>
  <p class="note" style="margin-top:10px">예규 인용문과 면책 문구는 고정입니다. 저장하면 미리보기·링크에 반영되고, 이 회차의 링크를 받은 대표는 고친 버전을 봅니다.</p>
</div></div>

<!-- 링크 발급 -->
<div id="mSend" class="modal"><div class="modal-in">
  <h3>누구에게 보내시나요?</h3>
  <p class="note">이름·회사만 적으시면 주제와 날짜는 자동으로 기록됩니다.</p>
  <label>이름<input type="text" id="s_name" placeholder="김철수" maxlength="30"></label>
  <label>회사명<input type="text" id="s_co" placeholder="○○정밀" maxlength="40"></label>
  <div class="btns"><button class="pri" type="button" onclick="ceoSend(true)">기록하고 링크 복사</button><button type="button" onclick="ceoSend(false)">기록 없이 복사만</button><button type="button" onclick="mClose('mSend')">닫기</button></div>
</div></div>

<!-- 발송 현황 -->
<div id="mLog" class="modal"><div class="modal-in wide">
  <h3>발송 현황</h3>
  <div class="log-bar"><input id="l_q" placeholder="이름 · 회사 · 주제 검색" oninput="logRender()"><span id="l_sum" class="note"></span></div>
  <div class="log-wrap"><table class="log"><thead><tr><th data-k="no" onclick="logSort('no')">No</th><th data-k="name" onclick="logSort('name')">이름</th><th data-k="company" onclick="logSort('company')">회사명</th><th data-k="topic" onclick="logSort('topic')">주제</th><th data-k="date" onclick="logSort('date')">전송일</th><th data-k="views" onclick="logSort('views')">열람</th><th></th></tr></thead><tbody id="l_body"></tbody></table></div>
  <div class="btns"><button type="button" onclick="mClose('mLog')">닫기</button></div>
</div></div>
<div id="toast"></div>

<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import{getAuth,onAuthStateChanged,setPersistence,browserLocalPersistence,signOut}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import{getFirestore,collection,doc,getDoc,getDocs,setDoc,deleteDoc,query,where,orderBy,limit,serverTimestamp}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
import{getFunctions,httpsCallable}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-functions.js';
const FC={apiKey:"AIzaSyBD9p-bf162RiiD1Y3BsY-NvbYjpOSrzmg",authDomain:"jarvia-platform.firebaseapp.com",projectId:"jarvia-platform",storageBucket:"jarvia-platform.firebasestorage.app",messagingSenderId:"388025068900",appId:"1:388025068900:web:09ba8e12e9e9e2ec49de71"};
const app=initializeApp(FC);const auth=getAuth(app);setPersistence(auth,browserLocalPersistence).catch(()=>{});
const db=getFirestore(app,'javia-db');const fns=getFunctions(app,'asia-northeast3');
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let me=null,meData=null,prof={},ISSUES=[],CUR=null,BASE=null,MEMO=null,LOG=[],sortK='date',sortAsc=false;
function toast(m){const t=$('toast');t.textContent=m;t.style.opacity=1;clearTimeout(t._h);t._h=setTimeout(()=>t.style.opacity=0,2200);}
window.mClose=id=>{$(id).classList.remove('show');};
const mOpen=id=>{$(id).classList.add('show');};

onAuthStateChanged(auth,async u=>{
  if(!u){location.href='./index.html';return;}me=u;
  try{
    if(u.email&&u.email.endsWith('@javia-admin.internal'))meData={role:'admin',name:'관리자'};
    else{const d=await getDoc(doc(db,'users',u.uid));if(!d.exists()){location.href='./index.html';return;}meData=d.data();}
  }catch(e){$('view').innerHTML='<div class="empty">불러오지 못했습니다</div>';return;}
  if(!['inner_circle','admin'].includes(meData.role)){alert('이너서클 회원 전용 서비스입니다.');location.href='./index.html';return;}
  $('hd-me').textContent=(meData.name||'')+' 님';
  try{if(meData.loginId){const c=await getDoc(doc(db,'consultants',String(meData.loginId)));if(c.exists())prof=c.data();}}catch(_){}
  await loadIssues();
});
$('hd-out').onclick=()=>signOut(auth).then(()=>location.href='./index.html');

async function loadIssues(){
  const s=await getDocs(query(collection(db,'innerIssues'),orderBy('sendDate','desc'),limit(30)));
  ISSUES=s.docs.map(d=>({id:d.id,...d.data()}));
  const want=new URLSearchParams(location.search).get('d')||new URLSearchParams(location.search).get('id');
  $('pick').innerHTML=ISSUES.map(i=>`<option value="${esc(i.id)}">${esc(i.sendDate)} · ${i.kind==='tax_deep'?'Tax Master':'법인Master'} · ${esc((i.title||i.entry?.title||'').slice(0,40))}</option>`).join('')||'<option>게시된 회차 없음</option>';
  const first=ISSUES.find(i=>i.id===want||i.sendDate===want)||ISSUES[0];
  if(first){$('pick').value=first.id;show(first.id);}else $('view').innerHTML='<div class="empty">게시된 회차가 없습니다</div>';
}
$('pick').onchange=e=>show(e.target.value);

async function show(id){
  CUR=ISSUES.find(i=>i.id===id);if(!CUR)return;
  history.replaceState(null,'',`?id=${encodeURIComponent(id)}`);
  const isTax=CUR.kind==='tax_deep';
  $('kind').hidden=false;$('kind').textContent=isTax?'Tax Master · 수요일':'법인Master · 금요일';$('kind').className='chip'+(isTax?' tax':'');
  let h=`<div class="head"><h1>${esc(CUR.title||CUR.entry?.title||'')}</h1><div class="meta">${esc(CUR.sendDate)} 발송 · 이너서클 회원 전용</div>`;
  if(isTax){
    if(CUR.twUrl)h+=`<div class="pre">📎 먼저 읽을 것 · <a href="${esc(CUR.twUrl)}" target="_blank">택스위클리 같은 주제 편</a> — 제도·용어·FAQ는 그쪽에 있고 여기서 반복하지 않습니다.</div>`;
    h+=`</div>`+(CUR.html||'<div class="empty">본문 없음</div>');
  }else{
    h+=`<a class="open" href="${esc(CUR.htmlUrl||'#')}" target="_blank">브리핑 열기 ↗</a></div>`;
  }
  $('view').innerHTML=h;
  await renderCeo();   /* ★ [2026-09-09] 법인Master 도 CEO 전달본 — ceoJson 없는 회차는 renderCeo 가 스스로 건너뜀 */
}

/* ═══ CEO 전달본 ═══ */
async function renderCeo(){
  BASE=null;try{BASE=CUR.ceoJson?JSON.parse(CUR.ceoJson):null;}catch(_){}
  if(!BASE)return;
  MEMO=null;try{const m=await getDoc(doc(db,'innerCeoMemo',`${CUR.id}_${me.uid}`));if(m.exists())MEMO=m.data();}catch(_){}
  await logLoad();
  const card=(MEMO?.cardLine)||BASE.cardLine||'';
  const av=prof.photoUrl?`<img src="${esc(prof.photoUrl)}" alt="">`:esc((prof.name||meData.name||'?')[0]);
  const sub=[prof.title,prof.company].filter(Boolean).join(' · ');
  const box=document.createElement('section');box.className='ceo';box.id='ceo';
  box.innerHTML=`<h2><span class="num">📨</span>CEO 전달본 — 대표에게 보낼 요약</h2>
  <p style="font-size:14.5px">이 편의 내용 중 <b>대표가 알아둘 것만</b> 추린 별도 페이지입니다. 화법·반론·함정·보험 연결은 들어가지 않습니다. 회원님 명의로 발송되고, 대표가 열면 상단에 프로필 카드와 [재무상담 신청] 버튼이 붙습니다.</p>
  <div class="ceo-prev"><div class="c"><div class="av">${av}</div><div><b>${esc(prof.name||meData.name||'')}</b><span>${esc(sub)}</span><em id="ceoCardLine">“${esc(card)}”</em></div></div>
  <b>${esc(BASE.subtitle||'')}</b><ol><li>${esc(BASE.b1?.h||'')}${BASE.basis?' — 예규 근거 1건':''}</li><li>${esc(BASE.b2?.h||'')}${BASE.b2?.table?' — 개략 비교표':''}</li><li>${esc(BASE.b3?.h||'')}${BASE.b3?.checks?` — 자가 체크 ${BASE.b3.checks.length}항목`:''}</li></ol></div>
  <div class="btns"><button class="pri" type="button" onclick="ceoPreview()">미리보기</button><button type="button" onclick="ceoEditOpen()">편집</button><button type="button" onclick="ceoSendOpen()">링크 복사</button><button type="button" onclick="logOpen()">발송 현황 <span class="cnt" id="logCnt">${LOG.length}</span></button></div>
  <p class="note" style="margin-top:10px">${MEMO?'✏️ 편집본이 저장돼 있습니다 — 링크를 받은 대표는 편집본을 봅니다.':'[편집]에서 카드 문장·개인 메시지·본문을 고칠 수 있습니다. 예규 인용문과 면책 문구는 고정입니다.'}</p>`;
  $('view').appendChild(box);
}
function ceoFill(){$('e_card').value=MEMO?.cardLine||BASE.cardLine||'';$('e_cta').value=MEMO?.ctaLine||BASE.ctaLine||'';$('e_msg').value=MEMO?.message||'';$('e_b1').value=MEMO?.b1||BASE.b1?.p||'';$('e_b2').value=MEMO?.b2||BASE.b2?.p||'';$('e_b3').value=MEMO?.b3||BASE.b3?.p||'';$('o_basis').checked=MEMO?.basisOn!==false;$('o_table').checked=MEMO?.tableOn!==false;$('o_chk').checked=MEMO?.checksOn!==false;}
window.ceoEditOpen=()=>{ceoFill();mOpen('mEdit');};
window.ceoSave=async()=>{
  const data={uid:me.uid,issueId:CUR.id,cardLine:$('e_card').value.trim().slice(0,80),ctaLine:$('e_cta').value.trim().slice(0,80),message:$('e_msg').value.trim().slice(0,600),b1:$('e_b1').value.trim().slice(0,3000),b2:$('e_b2').value.trim().slice(0,3000),b3:$('e_b3').value.trim().slice(0,3000),basisOn:$('o_basis').checked,tableOn:$('o_table').checked,checksOn:$('o_chk').checked,updatedAt:serverTimestamp()};
  if(/jarvia|자비아/i.test(data.message+data.cardLine+data.ctaLine))return toast('브랜드명은 대표에게 보내는 메모에 쓸 수 없습니다');
  try{await setDoc(doc(db,'innerCeoMemo',`${CUR.id}_${me.uid}`),data);MEMO=data;$('ceoCardLine').textContent='“'+(data.cardLine||BASE.cardLine)+'”';mClose('mEdit');toast('저장했습니다 — 미리보기·링크에 반영됩니다');}
  catch(e){toast('저장 실패: '+(e.message||e));}
};
window.ceoReset=async()=>{try{await deleteDoc(doc(db,'innerCeoMemo',`${CUR.id}_${me.uid}`));}catch(_){}MEMO=null;ceoFill();$('ceoCardLine').textContent='“'+(BASE.cardLine||'')+'”';toast('원본으로 되돌렸습니다');};
window.ceoPreview=async()=>{try{const r=await httpsCallable(fns,'itCeoIssueLink')({issueId:CUR.id,preview:true});window.open(r.data.url,'_blank');}catch(e){toast('미리보기 실패: '+(e.message||e));}};
window.ceoSendOpen=()=>{$('s_name').value='';$('s_co').value='';mOpen('mSend');setTimeout(()=>$('s_name').focus(),60);};
window.ceoSend=async(record)=>{
  const name=record?$('s_name').value.trim():'',company=record?$('s_co').value.trim():'';
  if(record&&!name&&!company){$('s_name').focus();return toast('이름 또는 회사명을 적어주세요');}
  try{const r=await httpsCallable(fns,'itCeoIssueLink')({issueId:CUR.id,name,company});const url=r.data.url;
    try{await navigator.clipboard.writeText(url);}catch(_){prompt('링크를 복사하세요',url);}
    mClose('mSend');if(record){await logLoad();$('logCnt').textContent=LOG.length;toast((name||company)+' 님 기록 · 링크 복사 완료');}else toast('링크를 복사했습니다');
  }catch(e){toast('링크 발급 실패: '+(e.message||e));}
};
/* 발송 현황 */
async function logLoad(){try{const s=await getDocs(query(collection(db,'innerCeoSend'),where('uid','==',me.uid),orderBy('sentAt','desc'),limit(200)));LOG=s.docs.map((d,i)=>({id:d.id,...d.data(),date:d.data().sentAt?.toDate?.()?.toISOString?.().slice(0,10)||'',views:Number(d.data().views||0),viewed:d.data().lastViewedAt?.toDate?.()?.toISOString?.().slice(5,10).replace('-','/')||''}));LOG.forEach((r,i)=>r.no=LOG.length-i);}catch(e){LOG=[];}}
window.logOpen=async()=>{await logLoad();$('l_q').value='';logRender();mOpen('mLog');};
window.logSort=k=>{if(sortK===k)sortAsc=!sortAsc;else{sortK=k;sortAsc=(k!=='no'&&k!=='date');}logRender();};
window.logDel=async id=>{if(!confirm('이 기록을 삭제할까요?'))return;try{await deleteDoc(doc(db,'innerCeoSend',id));await logLoad();$('logCnt').textContent=LOG.length;logRender();}catch(e){toast('삭제 실패');}};
window.logRender=()=>{
  const q=($('l_q').value||'').trim().toLowerCase();
  let a=LOG.filter(r=>!q||[r.name,r.company,r.topic].some(v=>String(v||'').toLowerCase().includes(q)));
  a.sort((x,y)=>{let vx=x[sortK],vy=y[sortK];if(typeof vx==='string'){vx=vx.toLowerCase();vy=String(vy||'').toLowerCase();}return(vx<vy?-1:vx>vy?1:0)*(sortAsc?1:-1);});
  document.querySelectorAll('table.log th[data-k]').forEach(th=>{th.classList.toggle('on',th.dataset.k===sortK);th.classList.toggle('asc',th.dataset.k===sortK&&sortAsc);});
  $('l_body').innerHTML=a.length?a.map(r=>`<tr><td>${r.no}</td><td>${esc(r.name)||'—'}</td><td>${esc(r.company)||'—'}</td><td class="topic">${esc(r.topic)}</td><td>${esc(r.date)}</td><td class="views">${r.views?`<b>${r.views}회</b><small> ${esc(r.viewed)}</small>`:'<span class="dim">미열람</span>'}</td><td><button type="button" class="del" onclick="logDel('${esc(r.id)}')" title="삭제">×</button></td></tr>`).join(''):'<tr><td colspan="7" class="empty">아직 발송 기록이 없습니다</td></tr>';
  $('l_sum').textContent=`${a.length}건${q?' (검색)':''}`;
};
</script>
</body>
