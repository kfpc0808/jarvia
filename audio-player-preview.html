<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>오디오 플레이어 미리보기</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800&family=Poppins:wght@600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1B3A5C;--navy-lt:#2E5A88;--navy-dk:#0F2440;
  --accent:#2E86AB;--accent-lt:#48A6CB;--accent-glow:rgba(46,134,171,.12);
  --gold:#D4A03C;--gold-lt:#F0D78C;--gold-bg:rgba(212,160,60,.06);
  --font:'Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;
  --font-d:'Poppins','Noto Sans KR',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
  --radius:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:#F7F9FC;-webkit-font-smoothing:antialiased}

.dr-topbar{max-width:720px;margin:0 auto;padding:10px 20px;display:flex;justify-content:space-between}
.dr-topbar a{font-size:13px;font-weight:600;color:rgba(255,255,255,.7);text-decoration:none;padding:6px 14px;border-radius:6px;border:1px solid rgba(255,255,255,.15);transition:all .2s}
.dr-topbar a:hover{background:rgba(255,255,255,.1);color:#fff}
.dr-header{background:linear-gradient(135deg,var(--navy-dk) 0%,var(--navy) 40%,var(--navy-lt) 100%);padding:0;overflow:hidden;position:relative}
.dr-header::after{content:'';position:absolute;bottom:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--accent),var(--gold),var(--accent))}
.dr-header-inner{max-width:720px;margin:0 auto;padding:28px 20px 32px;position:relative;z-index:1}
.dr-header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.dr-logo{font-family:var(--font-d);font-size:15px;font-weight:700;color:rgba(255,255,255,.5);letter-spacing:2px;text-transform:uppercase}
.dr-date-badge{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);padding:4px 14px;border-radius:20px;font-size:12px;color:rgba(255,255,255,.7);font-weight:500}
.dr-title-area{text-align:center;margin-bottom:8px;position:relative}
.dr-title{font-family:var(--font-d);font-size:28px;font-weight:800;color:#fff;margin-bottom:4px;letter-spacing:-0.5px;display:inline-block}
.dr-audio-icon{display:inline-block;vertical-align:middle;margin-left:12px;position:relative;top:-2px;width:28px;height:28px;border-radius:50%;background:rgba(212,160,60,.25);border:1px solid rgba(212,160,60,.4);color:var(--gold-lt);font-size:13px;cursor:pointer;transition:all .3s;line-height:28px;text-align:center}
.dr-audio-icon:hover{background:rgba(212,160,60,.4);transform:scale(1.1)}
.dr-subtitle{font-size:14px;color:rgba(255,255,255,.55);font-weight:400}
.dr-dateline{text-align:center;font-size:13px;color:rgba(255,255,255,.4);font-weight:300;margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.08)}
.dr-dateline strong{color:rgba(255,255,255,.7);font-weight:600}

.dr-audio-bar{display:none;max-width:720px;margin:0 auto;padding:0 20px}
.dr-audio-bar.open{display:block;animation:audioSlide .3s ease}
@keyframes audioSlide{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.dr-ab-inner{background:rgba(255,255,255,.08);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:10px 16px;display:flex;align-items:center;gap:12px;margin-top:10px}
.dr-ab-play{width:32px;height:32px;border-radius:50%;background:var(--gold);color:var(--navy-dk);border:none;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s;font-weight:700}
.dr-ab-play:hover{transform:scale(1.08);background:var(--gold-lt)}
.dr-ab-play.playing{background:var(--accent-lt)}
.dr-ab-info{font-size:11px;color:rgba(255,255,255,.6);white-space:nowrap;flex-shrink:0}
.dr-ab-info strong{color:rgba(255,255,255,.9);font-weight:600}
.dr-ab-track{flex:1;min-width:0;display:flex;align-items:center;gap:8px}
.dr-ab-progress{flex:1;height:4px;background:rgba(255,255,255,.12);border-radius:2px;cursor:pointer;position:relative;overflow:hidden}
.dr-ab-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--accent-lt));border-radius:2px;width:0%;transition:width .2s}
.dr-ab-time{font-size:10px;font-family:var(--font-mono);color:rgba(255,255,255,.4);white-space:nowrap}

.note{max-width:720px;margin:40px auto;padding:0 20px;text-align:center;color:#7F8C8D;font-size:13px;line-height:1.8}
.note strong{color:var(--navy)}
</style>
</head>
<body>

<div style="background:var(--navy-dk)">
  <div class="dr-topbar">
    <a href="#">← JARVIA 메인</a>
    <a href="#">📋 전체 아카이브</a>
  </div>
</div>

<header class="dr-header">
  <div class="dr-header-inner">
    <div class="dr-header-top">
      <div class="dr-logo">JARVIA</div>
      <div class="dr-date-badge">Vol.003</div>
    </div>
    <div class="dr-title-area">
      <h1 class="dr-title">Daily Report</h1><span class="dr-audio-icon" id="icon" onclick="toggleBar()" title="오디오로 듣기">🎧</span>
      <p class="dr-subtitle">보험·재무 컨설턴트를 위한 5분 인사이트</p>
    </div>
    <div class="dr-dateline">
      <strong>2026년 3월 7일 (토)</strong> · 한국FP센터 JARVIA 리서치
    </div>
    <div class="dr-audio-bar" id="bar">
      <div class="dr-ab-inner">
        <button class="dr-ab-play" id="playBtn" onclick="playPause()">▶</button>
        <div class="dr-ab-info"><strong>오늘의 리포트 듣기</strong></div>
        <div class="dr-ab-track">
          <div class="dr-ab-progress" id="prog" onclick="seek(event)">
            <div class="dr-ab-fill" id="fill"></div>
          </div>
          <div class="dr-ab-time"><span id="cur">0:00</span> / <span id="tot">5:32</span></div>
        </div>
      </div>
    </div>
  </div>
</header>

<div class="note">
  <p>☝️ <strong>"Daily Report"</strong> 옆 🎧 아이콘을 클릭해보세요!</p>
  <p>▶ 버튼을 누르면 재생 시뮬레이션이 됩니다.</p>
  <br>
  <p>💡 audioUrl이 없으면 🎧 아이콘 자체가 보이지 않습니다.</p>
</div>

<script>
function toggleBar(){
  document.getElementById('bar').classList.toggle('open');
}
var playing=false,pct=0,interval=null;
function playPause(){
  var btn=document.getElementById('playBtn');
  if(playing){
    btn.textContent='▶';btn.classList.remove('playing');
    clearInterval(interval);interval=null;playing=false;
  }else{
    btn.textContent='■';btn.classList.add('playing');
    var bar=document.getElementById('bar');
    if(!bar.classList.contains('open'))bar.classList.add('open');
    interval=setInterval(function(){
      pct+=0.3;if(pct>100)pct=0;
      document.getElementById('fill').style.width=pct+'%';
      var secs=Math.floor(pct/100*332);
      var m=Math.floor(secs/60),s=secs%60;
      document.getElementById('cur').textContent=m+':'+(s<10?'0':'')+s;
    },300);
    playing=true;
  }
}
function seek(e){
  var bar=document.getElementById('prog');
  var r=bar.getBoundingClientRect();
  pct=((e.clientX-r.left)/r.width)*100;
  document.getElementById('fill').style.width=pct+'%';
}
</script>
</body>
</html>
