<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>JARVIA 금융·경제통계</title>
<meta name="description" content="한국은행 경제통계시스템 기반 실시간 금융·경제 지표 대시보드">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-annotation/3.0.1/chartjs-plugin-annotation.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-datalabels/2.2.0/chartjs-plugin-datalabels.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
/* ═══════════════════════════════════════════
   CSS 변수 및 리셋
   ═══════════════════════════════════════════ */
:root {
  --primary: #1a6fb5;
  --primary-light: #e8f4fd;
  --primary-dark: #0d4f82;
  --bg: #f5f7fa;
  --card-bg: #ffffff;
  --text: #1a1a2e;
  --text-secondary: #6b7280;
  --text-muted: #9ca3af;
  --border: #e5e7eb;
  --border-light: #f0f1f3;
  --sidebar-bg: #ffffff;
  --sidebar-width: 260px;
  --header-height: 56px;
  --accent-blue: #1a6fb5;
  --accent-orange: #e8a838;
  --accent-green: #2aaa8a;
  --accent-red: #e74c3c;
  --accent-purple: #9b59b6;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
  --shadow-lg: 0 8px 24px rgba(0,0,0,0.12);
  --radius: 8px;
  --radius-lg: 12px;
  --transition: 0.2s ease;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { font-size: 14px; -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
body {
  font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
}
a { color: var(--primary); text-decoration: none; }
button { cursor: pointer; border: none; background: none; font-family: inherit; touch-action: manipulation; }
input, select { font-size: 16px; /* iOS 자동줌 방지 */ }

/* ═══════════════════════════════════════════
   헤더
   ═══════════════════════════════════════════ */
.snap-header {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  height: var(--header-height);
  background: #fff;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center;
  padding: 0 20px;
  box-shadow: var(--shadow-sm);
}
.snap-header__logo {
  display: flex; align-items: center; gap: 10px;
  font-weight: 700; font-size: 1.1rem; color: var(--primary);
}
.snap-header__logo svg { width: 28px; height: 28px; }
.snap-header__divider {
  width: 1px; height: 24px; background: var(--border); margin: 0 16px;
}
.snap-header__title {
  font-size: 0.95rem; color: var(--text-secondary); font-weight: 400;
}
.snap-header__right {
  margin-left: auto; display: flex; align-items: center; gap: 12px;
}
.snap-header__update {
  font-size: 0.78rem; color: var(--text-muted);
  background: var(--bg); padding: 4px 10px; border-radius: 4px;
}
.snap-header__back {
  font-size: 0.85rem; color: var(--primary);
  padding: 6px 14px; border-radius: 6px;
  border: 1px solid var(--primary);
  transition: var(--transition);
}
.snap-header__back:hover { background: var(--primary); color: #fff; }

/* ═══════════════════════════════════════════
   사이드바
   ═══════════════════════════════════════════ */
.snap-sidebar {
  position: fixed; top: var(--header-height); left: 0; bottom: 0;
  width: var(--sidebar-width);
  background: var(--sidebar-bg);
  border-right: 1px solid var(--border);
  overflow-y: auto; z-index: 50;
  padding: 12px 0;
  scrollbar-width: thin;
  scrollbar-color: #d1d5db transparent;
}
.snap-sidebar::-webkit-scrollbar { width: 5px; }
.snap-sidebar::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 3px; }

.snap-sidebar__group { margin-bottom: 4px; }
.snap-sidebar__group-title {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 16px; font-size: 0.82rem; font-weight: 600;
  color: var(--text-secondary); cursor: pointer;
  user-select: none; transition: var(--transition);
}
.snap-sidebar__group-title:hover { color: var(--primary); }
.snap-sidebar__group-title .arrow {
  font-size: 0.65rem; transition: transform 0.2s;
}
.snap-sidebar__group-title .arrow.open { transform: rotate(90deg); }
.snap-sidebar__group-title .icon {
  width: 18px; height: 18px; display: flex; align-items: center;
  justify-content: center; font-size: 0.9rem;
}

.snap-sidebar__items { padding-left: 0; }
.snap-sidebar__item {
  display: block; width: 100%;
  padding: 7px 16px 7px 42px;
  font-size: 0.82rem; color: var(--text);
  text-align: left; transition: var(--transition);
  border-left: 3px solid transparent;
  position: relative;
}
.snap-sidebar__item:hover {
  background: var(--primary-light); color: var(--primary);
}
.snap-sidebar__item.active {
  background: var(--primary-light);
  color: var(--primary); font-weight: 600;
  border-left-color: var(--primary);
}
.snap-sidebar__item .badge {
  position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
  font-size: 0.65rem; padding: 1px 5px; border-radius: 3px;
  background: #fef3c7; color: #92400e;
}

/* 모바일 사이드바 토글 */
.snap-sidebar-toggle {
  display: none;
  position: fixed; bottom: 20px; left: 20px; z-index: 200;
  width: 48px; height: 48px; border-radius: 50%;
  background: var(--primary); color: #fff;
  box-shadow: var(--shadow-lg);
  font-size: 1.2rem;
  align-items: center; justify-content: center;
}

/* ═══════════════════════════════════════════
   메인 콘텐츠 영역
   ═══════════════════════════════════════════ */
.snap-main {
  margin-left: var(--sidebar-width);
  margin-top: var(--header-height);
  padding: 24px;
  min-height: calc(100vh - var(--header-height));
}

/* 카테고리 헤더 */
.snap-category-header {
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 20px; padding-bottom: 12px;
  border-bottom: 3px solid var(--primary);
}
.snap-category-header h2 {
  font-size: 1.3rem; font-weight: 700; color: var(--primary);
}
.snap-category-header .breadcrumb {
  font-size: 0.8rem; color: var(--text-muted);
}

/* 차트 그리드 */
.snap-chart-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 20px;
}

/* ═══════════════════════════════════════════
   차트 카드
   ═══════════════════════════════════════════ */
.snap-card {
  background: var(--card-bg);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--border-light);
  overflow: hidden;
  transition: box-shadow 0.3s;
}
.snap-card:hover { box-shadow: var(--shadow-md); }

/* 카드 헤더 */
.snap-card__header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 16px 0;
}
.snap-card__title {
  font-size: 0.95rem; font-weight: 600; color: var(--text);
  display: flex; align-items: center; gap: 6px;
}
.snap-card__title .dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--primary); flex-shrink: 0;
}
.snap-card__actions {
  display: flex; align-items: center; gap: 4px;
}
.snap-card__action-btn {
  width: 30px; height: 30px; border-radius: 4px;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-muted); font-size: 0.75rem;
  transition: var(--transition);
  /* 모바일 터치 타겟 확보 (최소 44px) */
  min-width: 44px; min-height: 44px;
  padding: 7px;
}
.snap-card__action-btn:hover {
  background: var(--bg); color: var(--primary);
}
.snap-card__action-btn svg { width: 16px; height: 16px; }

/* 카드 - 기간 선택 바 */
.snap-card__period-bar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 16px; border-bottom: 1px solid var(--border-light);
}
.snap-card__zoom-btns {
  display: flex; align-items: center; gap: 2px;
}
.snap-card__zoom-label {
  font-size: 0.72rem; color: var(--text-muted); margin-right: 6px;
}
.snap-card__zoom-btn {
  padding: 3px 8px; font-size: 0.72rem; border-radius: 3px;
  color: var(--text-secondary); transition: var(--transition);
  font-weight: 500;
}
.snap-card__zoom-btn:hover { background: var(--bg); }
.snap-card__zoom-btn.active {
  color: var(--primary); font-weight: 700;
}
.snap-card__date-range {
  font-size: 0.72rem; color: var(--accent-green);
}

/* 범례 */
.snap-card__legend {
  display: flex; flex-wrap: wrap; gap: 10px;
  padding: 8px 16px 4px;
}
.snap-card__legend-item {
  display: flex; align-items: center; gap: 5px;
  font-size: 0.73rem; color: var(--text-secondary);
}
.snap-card__legend-line {
  width: 16px; height: 2px; border-radius: 1px;
}
.snap-card__legend-marker {
  font-size: 0.7rem; font-weight: 400; letter-spacing: -1px;
}
.snap-card__legend-dot {
  width: 8px; height: 8px; border-radius: 50%;
}

/* 차트 영역 */
.snap-card__chart-wrap {
  position: relative; padding: 8px 12px;
  height: 260px;
}
.snap-card__chart-wrap canvas { width: 100% !important; }

/* 유닛 레이블 */
.snap-card__unit-left,
.snap-card__unit-right {
  position: absolute; top: 6px; font-size: 0.65rem; color: var(--text-muted);
}
.snap-card__unit-left { left: 12px; }
.snap-card__unit-right { right: 12px; }

/* 로딩 & 에러 */
.snap-card__loading, .snap-card__error {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.85rem; color: var(--text-muted);
  background: rgba(255,255,255,0.9);
}
.snap-card__error { color: var(--accent-red); }
.snap-card__loading .spinner {
  width: 24px; height: 24px; border: 2.5px solid var(--border);
  border-top-color: var(--primary); border-radius: 50%;
  animation: spin 0.8s linear infinite; margin-right: 8px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* 카드 푸터 (주석, 출처) */
.snap-card__footer {
  padding: 10px 16px 14px; border-top: 1px solid var(--border-light);
}
.snap-card__notes {
  font-size: 0.7rem; color: var(--text-muted);
  line-height: 1.5;
}
.snap-card__notes p { margin-bottom: 2px; }
.snap-card__source {
  font-size: 0.7rem; color: var(--text-muted);
  margin-top: 4px; font-weight: 500;
}

/* 툴팁 (한국은행 원본 스타일: 흰 배경 + 빨간 테두리) */
.snap-card__chart-wrap canvas { cursor: crosshair; }

/* ═══════════════════════════════════════════
   풀스크린 모달
   ═══════════════════════════════════════════ */
.snap-modal-overlay {
  position: fixed; inset: 0; z-index: 1000;
  background: rgba(0,0,0,0.5);
  display: none; align-items: center; justify-content: center;
  backdrop-filter: blur(2px);
}
.snap-modal-overlay.show { display: flex; }
.snap-modal {
  background: #fff; border-radius: var(--radius-lg);
  width: 90vw; max-width: 1000px; max-height: 85vh;
  overflow: auto; box-shadow: var(--shadow-lg);
}
.snap-modal__header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 20px; border-bottom: 1px solid var(--border);
}
.snap-modal__title { font-size: 1.05rem; font-weight: 600; }
.snap-modal__close {
  width: 32px; height: 32px; border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.2rem; color: var(--text-muted);
}
.snap-modal__close:hover { background: var(--bg); }
.snap-modal__body { padding: 20px; }
.snap-modal__chart-wrap { height: 450px; position: relative; }

/* ═══════════════════════════════════════════
   데이터 부재 / 외부 API 안내
   ═══════════════════════════════════════════ */
.snap-card__placeholder {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; height: 200px; color: var(--text-muted);
  font-size: 0.85rem; gap: 8px;
}
.snap-card__placeholder .icon { font-size: 2rem; opacity: 0.4; }

/* ═══════════════════════════════════════════
   하단 출처 고지
   ═══════════════════════════════════════════ */
.snap-footer {
  margin-top: 40px; padding: 20px;
  border-top: 1px solid var(--border);
  text-align: center;
  font-size: 0.75rem; color: var(--text-muted);
  line-height: 1.6;
}

/* ═══════════════════════════════════════════
   검색바 (모바일용)
   ═══════════════════════════════════════════ */
.snap-search {
  display: none;
  padding: 12px 16px;
  background: #fff;
}
.snap-search__input-wrap {
  display: flex; align-items: center;
  background: #f5f7fa; border: 1px solid var(--border);
  border-radius: 24px; padding: 0 16px;
  height: 44px;
}
.snap-search__input {
  flex: 1; border: none; background: transparent;
  font-size: 16px; color: var(--text); outline: none;
  font-family: 'Noto Sans KR', sans-serif;
}
.snap-search__input::placeholder { color: var(--text-muted); }
.snap-search__btn {
  width: 36px; height: 36px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  background: var(--primary); color: #fff; flex-shrink: 0;
}
.snap-search__btn svg { width: 18px; height: 18px; }

/* ═══════════════════════════════════════════
   모바일 카테고리 아코디언 (한국은행 원본 스타일)
   ═══════════════════════════════════════════ */
.snap-mobile-nav {
  display: none;
}
.snap-mobile-nav__group-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 20px;
  background: linear-gradient(135deg, #4a9dd9, #2a7bbf);
  color: #fff; font-weight: 600; font-size: 0.95rem;
  cursor: pointer; touch-action: manipulation;
  border-bottom: 1px solid rgba(255,255,255,0.15);
}
.snap-mobile-nav__group-header .arrow-icon {
  font-size: 0.8rem; transition: transform 0.3s;
}
.snap-mobile-nav__group-header .arrow-icon.open { transform: rotate(180deg); }
.snap-mobile-nav__group-items {
  background: #fff;
}
.snap-mobile-nav__cat-btn {
  display: block; width: 100%;
  padding: 12px 20px 12px 24px;
  font-size: 0.88rem; color: var(--text);
  text-align: left; border-bottom: 1px solid var(--border-light);
  touch-action: manipulation;
  transition: var(--transition);
}
.snap-mobile-nav__cat-btn:active { background: var(--primary-light); }
.snap-mobile-nav__cat-btn.active {
  color: var(--primary); font-weight: 600;
  background: var(--primary-light);
  border-left: 3px solid var(--primary);
}

/* ═══════════════════════════════════════════
   기간 드롭다운 (모바일)
   ═══════════════════════════════════════════ */
.snap-card__period-select {
  display: none;
  padding: 3px 8px; font-size: 0.78rem;
  border: 1px solid var(--border); border-radius: 4px;
  background: #fff; color: var(--text);
  font-family: 'Noto Sans KR', sans-serif;
  font-weight: 600;
  -webkit-appearance: none;
  appearance: none;
  background-image: url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%236b7280' fill='none' stroke-width='1.5'/%3E%3C/svg%3E");
  background-repeat: no-repeat;
  background-position: right 8px center;
  padding-right: 22px;
}

/* ═══════════════════════════════════════════
   반응형
   ═══════════════════════════════════════════ */
@media (max-width: 1024px) {
  .snap-chart-grid { grid-template-columns: 1fr; }
}
@media (max-width: 768px) {
  :root { --sidebar-width: 0px; --header-height: 52px; }

  /* 헤더: 모바일 스타일 */
  .snap-header {
    padding: 0 12px;
    padding-left: max(12px, env(safe-area-inset-left));
    padding-right: max(12px, env(safe-area-inset-right));
  }
  .snap-header__logo { font-size: 1rem; }
  .snap-header__logo svg { width: 24px; height: 24px; }
  .snap-header__divider { display: none; }
  .snap-header__title { display: none; }
  .snap-header__update { display: none; }
  .snap-header__back { font-size: 0.78rem; padding: 5px 10px; }

  /* PC 사이드바 숨기기 */
  .snap-sidebar { display: none !important; }
  .snap-sidebar-toggle { display: none !important; }

  /* 모바일 검색바 & 네비게이션 표시 */
  .snap-search { display: block; margin-top: var(--header-height); }
  .snap-mobile-nav { display: block; }

  /* 메인 콘텐츠 */
  .snap-main {
    margin-left: 0;
    margin-top: 0; /* 검색바+아코디언 아래 자연 배치 */
    padding: 12px;
    padding-left: max(12px, env(safe-area-inset-left));
    padding-right: max(12px, env(safe-area-inset-right));
    padding-bottom: max(20px, env(safe-area-inset-bottom));
  }

  /* 카테고리 헤더 */
  .snap-category-header { margin-bottom: 14px; padding-bottom: 10px; }
  .snap-category-header h2 { font-size: 1.1rem; }

  /* 차트 카드 */
  .snap-card { border-radius: 8px; }
  .snap-card__header { padding: 12px 12px 0; }
  .snap-card__title { font-size: 0.88rem; }
  .snap-card__chart-wrap { height: 240px; padding: 6px 8px; }
  .snap-card__footer { padding: 8px 12px 12px; }

  /* 기간: 드롭다운 표시, 버튼 숨기기 */
  .snap-card__period-bar { padding: 8px 12px; }
  .snap-card__zoom-btns .snap-card__zoom-btn { display: none; }
  .snap-card__zoom-btns .snap-card__zoom-label { display: none; }
  .snap-card__period-select { display: inline-block; }
  .snap-card__date-range { font-size: 0.7rem; }

  /* 범례 */
  .snap-card__legend { padding: 6px 12px 4px; gap: 8px; }
  .snap-card__legend-item { font-size: 0.7rem; }

  /* 모달 */
  .snap-modal { width: 96vw; max-height: 90vh; }
  .snap-modal__chart-wrap { height: 300px; }

  /* 푸터 */
  .snap-footer { padding-bottom: max(20px, env(safe-area-inset-bottom)); }
}
/* ── 100대 통계지표 테이블 ── */
.snap-sidebar__keystat-btn {
  display: flex; align-items: center; gap: 8px;
  width: calc(100% - 24px); margin: 12px 12px 8px;
  padding: 10px 14px; border-radius: 8px;
  background: linear-gradient(135deg, #1a3a5c, #2563eb);
  color: #fff; font-size: 0.82rem; font-weight: 600;
  cursor: pointer; transition: var(--transition);
  border: none; text-align: left;
}
.snap-sidebar__keystat-btn:hover { opacity: 0.9; }
.snap-sidebar__keystat-btn.active { box-shadow: 0 0 0 2px #60a5fa; }

.keystat-table-wrap {
  overflow-x: auto; -webkit-overflow-scrolling: touch;
}
.keystat-table {
  width: 100%; border-collapse: collapse; font-size: 0.82rem;
  background: #fff; border-radius: 8px; overflow: hidden;
  box-shadow: 0 1px 3px rgba(0,0,0,.06);
}
.keystat-table thead th {
  position: sticky; top: 0; z-index: 2;
  background: var(--primary); color: #fff;
  padding: 10px 12px; font-weight: 600; text-align: left;
  white-space: nowrap; font-size: 0.78rem;
}
.keystat-table tbody td {
  padding: 8px 12px; border-bottom: 1px solid #f1f3f5;
  color: var(--text); vertical-align: middle;
}
.keystat-table tbody tr:hover { background: #f0f7ff; }
.keystat-table .td-class { color: var(--text-secondary); font-size: 0.75rem; white-space: nowrap; }
.keystat-table .td-name { font-weight: 500; min-width: 160px; }
.keystat-table .td-value { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--primary); white-space: nowrap; }
.keystat-table .td-unit { color: var(--text-secondary); font-size: 0.75rem; white-space: nowrap; }

function getDateRange(range) {
  const now = new Date();
  const end = now.toISOString().slice(0,10).replace(/-/g,'');
  let start;
  if (range === '1Y') start = new Date(now.getFullYear()-1, now.getMonth(), now.getDate());
  else if (range === '5Y') start = new Date(now.getFullYear()-5, now.getMonth(), now.getDate());
  else if (range === '10Y') start = new Date(now.getFullYear()-10, now.getMonth(), now.getDate());
  else start = new Date(1990, 0, 1); // Max
  return { start: start.toISOString().slice(0,10).replace(/-/g,''), end };
}

function formatDate(dateStr) {
  if (!dateStr) return '';
  // ECOS 날짜: YYYYMMDD, YYYYMM, YYYY, 2025Q1 등
  if (dateStr.length === 8) return `${dateStr.slice(0,4)}-${dateStr.slice(4,6)}-${dateStr.slice(6,8)}`;
  if (dateStr.length === 6 && dateStr[4] === 'Q') return `${dateStr.slice(0,4)} ${dateStr.slice(4)}`;
  if (dateStr.length === 6) return `${dateStr.slice(0,4)}-${dateStr.slice(4,6)}`;
  if (dateStr.length === 5 && dateStr[4] === 'Q') return `${dateStr.slice(0,4)} ${dateStr.slice(4)}`;
  return dateStr;
}

function formatNumber(val) {
  if (val === null || val === undefined) return '-';
  const n = parseFloat(val);
  if (isNaN(n)) return val;
  if (Math.abs(n) >= 1e12) return (n/1e12).toFixed(1) + '조';
  if (Math.abs(n) >= 1e8) return (n/1e8).toFixed(1) + '억';
  if (Math.abs(n) >= 1e4) return (n/1e4).toFixed(1) + '만';
  return n.toLocaleString('ko-KR', {maximumFractionDigits: 2});
}

let latestDataDate = ''; // ECOS 응답에서 가장 최신 데이터 날짜 추적

async function fetchEcosData(apiCfg, range) {
  let { start, end } = getDateRange(range);
  // ECOS API: cycle별 날짜 형식 변환
  const cy = apiCfg.cycle;
  if (cy === 'M') {
    start = start.slice(0,6); end = end.slice(0,6); // YYYYMM
  } else if (cy === 'Q') {
    const qStart = Math.ceil(parseInt(start.slice(4,6))/3);
    const qEnd = Math.ceil(parseInt(end.slice(4,6))/3);
    start = start.slice(0,4) + 'Q' + qStart; // YYYYQ1
    end = end.slice(0,4) + 'Q' + qEnd;
  } else if (cy === 'A') {
    start = start.slice(0,4); end = end.slice(0,4); // YYYY
  }
  // D, W는 YYYYMMDD 그대로 사용
  const params = new URLSearchParams({
    statCode: apiCfg.stat,
    itemCode1: apiCfg.item,
    cycle: apiCfg.cycle,
    startDate: start,
    endDate: end,
  });
  if (apiCfg.item2) params.set('itemCode2', apiCfg.item2);
  if (apiCfg.item3) params.set('itemCode3', apiCfg.item3);
  try {
    const resp = await fetch(`${CONFIG.PROXY_URL}?${params}`);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const data = await resp.json();
    // 프록시가 전달한 ECOS 에러 메시지 캡처
    if (data._error) {
      console.warn(`ECOS [${apiCfg.stat}/${apiCfg.item}]: ${data._error}`);
      const result = [];
      result._error = data._error;
      return result;
    }
    if (data.StatisticSearch && data.StatisticSearch.row) {
      const rows = data.StatisticSearch.row;
      // 최신 데이터 날짜 추적
      if (rows.length > 0) {
        const lastRow = rows[rows.length - 1];
        if (lastRow.TIME && lastRow.TIME > latestDataDate) {
          latestDataDate = lastRow.TIME;
          const el = document.getElementById('lastUpdate');
          if (el) el.textContent = `데이터 기준: ${formatDate(latestDataDate)}`;
        }
      }
      return rows.map(r => ({
        date: r.TIME,
        value: parseFloat(r.DATA_VALUE),
        label: formatDate(r.TIME)
      }));
    }
    return [];
  } catch(e) {
    console.error('ECOS fetch error:', e);
    return [];
  }
}

// 날짜 기반 데이터 정렬 (BUG-1 핵심 수정)
function alignSeriesData(dataArrays) {
  const numSeries = dataArrays.length;
  if (numSeries === 0) return { labels: [], datasets: [] };

  // 모든 시리즈의 주기가 동일한지 체크 (빠른 경로)
  const lengths = dataArrays.map(a => a.length);
  const allSameLength = lengths.every(l => l === lengths[0]);
  const allSameDates = allSameLength && dataArrays.every((arr, si) =>
    si === 0 || arr.every((d, di) => d.date === dataArrays[0][di]?.date)
  );

  if (allSameDates && dataArrays[0].length > 0) {
    // 날짜가 완전 일치 → 정렬 불필요 (빠른 경로)
    return {
      labels: dataArrays[0].map(d => d.label),
      datasets: dataArrays.map(arr => arr.map(d => d.value))
    };
  }

  // 날짜 불일치 → 날짜 기반 병합
  const dateMap = new Map();
  dataArrays.forEach((arr, si) => {
    arr.forEach(d => {
      if (!dateMap.has(d.date)) {
        dateMap.set(d.date, { label: d.label, values: new Array(numSeries).fill(null) });
      }
      dateMap.get(d.date).values[si] = d.value;
    });
  });

  const sorted = [...dateMap.entries()].sort((a, b) => a[0].localeCompare(b[0]));
  return {
    labels: sorted.map(([, d]) => d.label),
    datasets: Array.from({ length: numSeries }, (_, i) => sorted.map(([, d]) => d.values[i]))
  };
}

      // 전체 computed 차트 (yield-spread, us-spread)
      const cs = COMPUTED_SOURCES[chart.id];
      const sourceData = await Promise.all(cs.sources.map(s => fetchEcosData(s.api, range)));
      // 소스 데이터를 정렬한 뒤 compute
      const aligned = alignSeriesData(sourceData);
      // compute 함수에 정렬된 소스 데이터 전달
      const alignedSourceArrays = sourceData; // compute는 원본 배열 사용
      const computedArrays = cs.compute(alignedSourceArrays);
      allSeriesDefs = chart.series;
      allDataArrays = computedArrays;

    } else {
      // API 시리즈 로드
      const apiSeries = chart.series.filter(s => s.api && !s.computed);
      if (apiSeries.length === 0) {
        if (loadingEl) loadingEl.style.display = 'none';
        return;
      }
      const apiResults = await Promise.all(apiSeries.map(s => fetchEcosData(s.api, range)));

      if (hasComputed) {
        // 부분 computed (bank-rate 등) — 여신금리 - 수신금리
        const computedResults = [];
        const finalDefs = [];
        let apiIdx = 0;
        chart.series.forEach(s => {
          if (s.computed && s.type === 'bar' && chart.id === 'bank-rate') {
            // 여수신 금리차 = 여신금리(apiIdx 0) - 수신금리(apiIdx 1)
            const spread = apiResults[0].map((d, i) => ({
              date: d.date,
              value: d.value - (apiResults[1]?.[i]?.value ?? 0),
              label: d.label
            }));
            computedResults.push(spread);
            finalDefs.push(s);
          } else if (s.api) {
            computedResults.push(apiResults[apiIdx]);
            finalDefs.push(s);
            apiIdx++;
          }
        });
        allSeriesDefs = finalDefs;
        allDataArrays = computedResults;
      } else {
        allSeriesDefs = apiSeries;
        allDataArrays = apiResults;
      }
    }

    if (loadingEl) loadingEl.style.display = 'none';

    // 빈 데이터 체크
    if (allDataArrays.every(a => !a || a.length === 0)) {
      if (loadingEl) {
        loadingEl.style.display = 'flex';
        // 에러 메시지 수집
        const errors = allDataArrays.filter(a => a && a._error).map(a => a._error);
        if (errors.length > 0) {
          loadingEl.innerHTML = `<div class="snap-card__error">API 오류: ${errors[0]}</div>`;
        } else {
          loadingEl.innerHTML = `<div class="snap-card__error">데이터가 없습니다</div>`;
        }
      }
      return;
    }

    renderChart(chart, allSeriesDefs, allDataArrays);

  } catch (e) {
    console.error(`Chart ${chart.id} load error:`, e);
    if (loadingEl) {
      loadingEl.style.display = 'flex';
      loadingEl.innerHTML = `<div class="snap-card__error">데이터 로드 실패: ${e.message}</div>`;
    }
  }
}

// ═══════════════════════════════════════════
// Chart.js 렌더링
// ═══════════════════════════════════════════

// 차트별 원본 config 저장 (모달 복제용, BUG-4 수정)

function renderChart(chart, seriesDefs, dataArrays) {
  const canvas = document.getElementById(`chart-${chart.id}`);
  if (!canvas) return;
  const ctx = canvas.getContext('2d');

  // 이전 인스턴스 제거
  if (chartInstances[chart.id]) {
    try { chartInstances[chart.id].destroy(); } catch(e){}
  }

  // 날짜 기반 정렬
  const aligned = alignSeriesData(dataArrays);
  const labels = aligned.labels;
  const alignedData = aligned.datasets;

  // 데이터 밀도 판단: 30개 이하면 데이터 라벨 표시
  const isLowDensity = labels.length <= 30;
  // 포인트 표시: 50개 이하면 마커 표시
  const showPoints = labels.length <= 50;

  // 이중축 여부
  const hasRightAxis = seriesDefs.some(s => s.yAxis === 1);

  // 데이터셋 구성
  const datasets = seriesDefs.map((s, i) => {
    const data = alignedData[i] || [];
    const isBar = s.type === 'bar' || (chart.chartType === 'bar' && !s.type);

    const ds = {
      label: s.name,
      data: data,
      borderColor: isBar ? 'transparent' : s.color,
      backgroundColor: isBar ? s.color : (chart.chartType === 'area' ? s.color : 'transparent'),
      borderWidth: isBar ? 0 : 2,
      // 포인트 마커: 한국은행 원본 스타일 (빈 원형)
      pointRadius: isBar ? 0 : (showPoints ? 3.5 : 0),
      pointHoverRadius: isBar ? 0 : 5,
      pointBackgroundColor: '#fff',
      pointBorderColor: s.color,
      pointBorderWidth: isBar ? 0 : 2,
      pointStyle: 'circle',
      tension: chart.stepped ? 0 : 0.1,
      stepped: chart.stepped && !isBar ? 'before' : false,
      fill: chart.chartType === 'area' ? (i === 0 ? false : '-1') : false,
      type: isBar ? 'bar' : 'line',
      yAxisID: s.yAxis === 1 ? 'y1' : 'y',
      borderDash: s.style === 'dashed' ? [5, 3] : s.style === 'dotted' ? [2, 2] : [],
      order: isBar ? 1 : 0,
      // 데이터 라벨 설정 (시리즈별)
      datalabels: {
        display: isLowDensity && !isBar,
        color: s.color,
        font: { size: 10, weight: '600', family: 'Noto Sans KR' },
        anchor: 'end',
        align: 'top',
        offset: 2,
        formatter: function(value) {
          if (value === null || value === undefined) return '';
          return Number.isInteger(value) ? value : value.toFixed(1);
        },
      },
    };

    // bar 이중축 조정
    if (isBar && hasRightAxis) {
      ds.barPercentage = 0.6;
      ds.categoryPercentage = 0.8;
    }

    // bar 데이터라벨: 바 위에 숫자
    if (isBar && isLowDensity) {
      ds.datalabels = {
        display: true,
        color: '#333',
        font: { size: 9, weight: '600', family: 'Noto Sans KR' },
        anchor: 'end',
        align: 'top',
        offset: -2,
        formatter: function(value) {
          if (value === null || value === undefined) return '';
          return formatNumber(value);
        },
      };
    }

    return ds;
  });

  // 스케일
  const scales = {
    x: {
      grid: { color: 'rgba(0,0,0,0.04)' },
      ticks: {
        font: { size: 10, family: 'Noto Sans KR' },
        color: '#9ca3af',
        maxTicksLimit: 8,
        maxRotation: 0,
      }
    },
    y: {
      position: 'left',
      grid: { color: 'rgba(0,0,0,0.04)' },
      ticks: {
        font: { size: 10, family: 'Noto Sans KR' },
        color: '#9ca3af',
        callback: function(v) { return formatNumber(v); },
      }
    }
  };

  if (hasRightAxis) {
    scales.y1 = {
      position: 'right',
      grid: { display: false },
      ticks: {
        font: { size: 10, family: 'Noto Sans KR' },
        color: '#9ca3af',
        callback: function(v) { return formatNumber(v); },
      }
    };
  }

  if (chart.chartType === 'area') {
    scales.y.stacked = true;
  }

  // 레퍼런스 라인
  const annotations = {};
  if (chart.refLines) {
    chart.refLines.forEach((rl, i) => {
      annotations[`line${i}`] = {
        type: 'line', yMin: rl.v, yMax: rl.v, yScaleID: 'y',
        borderColor: rl.color, borderWidth: 1.5, borderDash: [4, 3],
        label: {
          display: true, content: rl.label,
          position: 'end', font: { size: 10 },
          backgroundColor: 'transparent', color: rl.color,
        }
      };
    });
  }

  const chartType = chart.chartType === 'bar' ? 'bar' : 'line';

  const config = {
    type: chartType,
    data: { labels, datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      // 클릭/터치 시 툴팁 고정 (sticky tooltip)
      onClick: function(evt, elements, chart) {
        // 터치/클릭 시 툴팁 표시 유지 (내부적으로 Chart.js가 처리)
      },
      plugins: {
        legend: { display: false },
        tooltip: {
          enabled: true,
          // 한국은행 원본 스타일: 흰 배경 + 빨간 테두리
          backgroundColor: 'rgba(255,255,255,0.96)',
          titleColor: '#333',
          bodyColor: '#333',
          borderColor: '#e74c3c',
          borderWidth: 1.5,
          titleFont: { size: 11, weight: '600', family: 'Noto Sans KR' },
          bodyFont: { size: 11, family: 'Noto Sans KR' },
          padding: { top: 8, right: 12, bottom: 8, left: 12 },
          cornerRadius: 4,
          boxPadding: 4,
          usePointStyle: true,
          // 컬러 점 표시
          callbacks: {
            label: function(ctx) {
              const val = ctx.parsed.y;
              return ` ${ctx.dataset.label}: ${formatNumber(val)}`;
            }
          }
        },
        annotation: { annotations },
        // 데이터 라벨 전역 설정 (비활성 기본 — 개별 dataset에서 override)
        datalabels: {
          display: false,
        }
      },
      scales,
    },
    plugins: [ChartDataLabels], // datalabels 플러그인 등록
  };

  // 원본 config 저장 (모달용)
  chartConfigs[chart.id] = config;

  chartInstances[chart.id] = new Chart(ctx, config);
}

// 확대 (모달)
// ═══════════════════════════════════════════
function expandChart(chartId) {
  const chart = CHARTS.find(c => c.id === chartId);
  if (!chart) return;
  document.getElementById('modalTitle').textContent = chart.title;
  document.getElementById('chartModal').classList.add('show');
  document.getElementById('modalFooter').innerHTML = `
    <div class="snap-card__notes">${chart.notes.map((n,i) => `<p>주: ${i+1}) ${n}</p>`).join('')}</div>
    <div class="snap-card__source">${chart.source}</div>
  `;

  const modalCanvas = document.getElementById('modalChart');
  if (window._modalChart) { try { window._modalChart.destroy(); } catch(e){} }

  // 정적 차트: 플레이스홀더 표시
  if (chart.static) {
    const ctx = modalCanvas.getContext('2d');
    ctx.clearRect(0, 0, modalCanvas.width, modalCanvas.height);
    ctx.fillStyle = '#9ca3af';
    ctx.font = '14px Noto Sans KR';
    ctx.textAlign = 'center';
    ctx.fillText('이 차트는 정적 데이터로 별도 관리됩니다', modalCanvas.width / 2, modalCanvas.height / 2);
    return;
  }

  // 저장된 원본 config로 모달 차트 생성
  const savedConfig = chartConfigs[chartId];
  if (!savedConfig) return;

  const modalConfig = {
    type: savedConfig.type,
    data: {
      labels: [...savedConfig.data.labels],
      datasets: savedConfig.data.datasets.map(ds => ({
        ...ds,
        data: [...ds.data]
      }))
    },
    options: {
      ...savedConfig.options,
      maintainAspectRatio: false,
    },
    plugins: savedConfig.plugins || [],
  };

  window._modalChart = new Chart(modalCanvas.getContext('2d'), modalConfig);
}

function closeModal() {
  document.getElementById('chartModal').classList.remove('show');
  if (window._modalChart) { try { window._modalChart.destroy(); } catch(e){} }
}

// ═══════════════════════════════════════════
// DATA 다운로드 (CSV — iOS Safari 호환)
// ═══════════════════════════════════════════
function downloadData(chartId) {
  const inst = chartInstances[chartId];
  if (!inst) return alert('차트 데이터가 아직 로드되지 않았습니다.');

  const chart = CHARTS.find(c => c.id === chartId);
  const labels = inst.data.labels;
  const datasets = inst.data.datasets;

  const csvEscape = (val) => {
    const str = String(val ?? '');
    return str.includes(',') || str.includes('"') ? `"${str.replace(/"/g, '""')}"` : str;
  };

  let csv = '\uFEFF날짜,' + datasets.map(d => csvEscape(d.label)).join(',') + '\n';
  labels.forEach((label, i) => {
    csv += csvEscape(label) + ',' + datasets.map(d => d.data[i] ?? '').join(',') + '\n';
  });

  // iOS Safari 호환 다운로드
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
  if (isIOS) {
    // iOS: 새 탭에 CSV 표시 (길게 눌러 저장 가능)
    const w = window.open('', '_blank');
    if (w) {
      w.document.write('<pre>' + csv.replace(/</g,'&lt;') + '</pre>');
      w.document.title = chart.title + '.csv';
      w.document.close();
    }
  } else {
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `${chart.title}.csv`;
    a.click(); URL.revokeObjectURL(url);
  }
}

// ═══════════════════════════════════════════
// 이미지 다운로드 (iOS Safari 호환)

function downloadImage(chartId) {
  const card = document.getElementById(`card-${chartId}`);

    if (isIOS) {

        w.document.write(`<img src="${dataUrl}" style="max-width:100%">`);
        w.document.title = CHARTS.find(c => c.id === chartId).title;
        w.document.close();
      }
    } else {
      const url = canvas.toDataURL('image/png');
      const a = document.createElement('a');
      a.href = url; a.download = `${CHARTS.find(c => c.id === chartId).title}.png`;
      a.click();
    }
  });
}

// ═══════════════════════════════════════════
// 검색 기능
// ═══════════════════════════════════════════
function handleSearch(query) {
  const q = query.trim().toLowerCase();
  if (!q) return;

  // 차트 타이틀, 카테고리명, 시리즈명에서 검색
  const match = CHARTS.find(ch => {
    if (ch.title.toLowerCase().includes(q)) return true;
    if (ch.series.some(s => s.name.toLowerCase().includes(q))) return true;
    const cat = CATEGORIES.find(c => c.id === ch.category);
    if (cat && cat.name.toLowerCase().includes(q)) return true;
    return false;
  });

  if (match) {
    selectCategory(match.category);
    // 해당 카드로 스크롤
    setTimeout(() => {
      const card = document.getElementById(`card-${match.id}`);
      if (card) card.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 300);
  }
}

async function renderKeyStatsContent() {
  Object.values(chartInstances).forEach(c => { try { c.destroy(); } catch(e){} });
  chartInstances = {};
  chartConfigs = {};

  const main = document.getElementById('mainContent');
  main.innerHTML = `
    <div class="snap-category-header">
      <h2>┃ 100대 통계지표</h2>
      <span class="breadcrumb">한국은행 경제통계시스템(ECOS) 100대 주요 통계지표</span>
    </div>
    <div class="keystat-loading" id="keystatLoading">
      <div class="spinner"></div>
      <p style="margin-top:12px">100대 통계지표를 불러오는 중...</p>
    </div>
    <div class="snap-footer">
      본 데이터는 한국은행 경제통계시스템(ECOS)에서 제공하는 자료를 활용하였습니다.<br>
      데이터의 정확성 및 최신 현황은 한국은행 경제통계시스템(ecos.bok.or.kr)을 통해 확인하시기 바랍니다.
    </div>
  `;

  try {
    const resp = await fetch(`${CONFIG.PROXY_URL}?action=keystat`);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const data = await resp.json();

    let rows = [];
    if (data.KeyStatisticList && data.KeyStatisticList.row) {
      rows = data.KeyStatisticList.row;
    }

    if (rows.length === 0) {
      document.getElementById('keystatLoading').innerHTML = '<p style="color:#e74c3c">데이터를 불러올 수 없습니다.</p>';
      return;
    }

    // 분류별 그룹핑
    const groups = {};
    rows.forEach(r => {
      const cls = r.CLASS_NAME || '기타';
      if (!groups[cls]) groups[cls] = [];
      groups[cls].push(r);
    });

    let tableHTML = `<div class="keystat-table-wrap"><table class="keystat-table">
      <thead><tr>
        <th>분류</th><th>지표명</th><th>수치</th><th>단위</th><th>기간</th>
      </tr></thead><tbody>`;

    Object.keys(groups).forEach(cls => {
      tableHTML += `<tr class="keystat-class-header"><td colspan="5">${cls}</td></tr>`;
      groups[cls].forEach(r => {
        const val = r.DATA_VALUE || '-';
        const unit = r.UNIT_NAME || '';
        const cycle = r.CYCLE || '';
        const time = r.TIME || '';
        const cycleName = cycle === 'D' ? '일' : cycle === 'M' ? '월' : cycle === 'Q' ? '분기' : cycle === 'A' ? '연' : cycle;
        const displayTime = time.length === 8 ? `${time.slice(0,4)}.${time.slice(4,6)}.${time.slice(6,8)}` :
                           time.length === 6 ? `${time.slice(0,4)}.${time.slice(4,6)}` :
                           time.length === 5 ? `${time.slice(0,4)} ${time.slice(4)}Q` : time;
        tableHTML += `<tr>
          <td class="td-class">${cls}</td>
          <td class="td-name">${r.KEYSTAT_NAME || ''}</td>
          <td class="td-value">${val}</td>
          <td class="td-unit">${unit}</td>
          <td class="td-period">${displayTime} (${cycleName})</td>
        </tr>`;
      });
    });

    tableHTML += '</tbody></table></div>';
    document.getElementById('keystatLoading').outerHTML = tableHTML;

  } catch (err) {
    console.error('KeyStat fetch error:', err);
    document.getElementById('keystatLoading').innerHTML = `<p style="color:#e74c3c">데이터 로드 실패: ${err.message}</p>`;
  }
}

function refreshCurrentCharts() {
  lastRefreshTime = Date.now();
  const charts = CHARTS.filter(ch => ch.category === activeCategory && !ch.static);
  charts.forEach(ch => loadChartData(ch));
  // 업데이트 시간 갱신
  const now = new Date();
  document.getElementById('lastUpdate').textContent = 
    `최종 업데이트: ${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
}

// URL 해시 기반 네비게이션
if (window.location.hash) {
  const hash = window.location.hash.slice(1);
  if (CATEGORIES.find(c => c.id === hash)) {
    activeCategory = hash;
    const cat = CATEGORIES.find(c => c.id === hash);
    if (cat) {
      openGroups[cat.parent] = true;
      mobileOpenGroups[cat.parent] = true;
    }
  }
}

// ═══════════════════════════════════════════
// 전체 API 진단
// ═══════════════════════════════════════════
async function runDiagnostic() {
  const apiCharts = CHARTS.filter(ch => !ch.static);
  const main = document.getElementById('mainContent');
  main.innerHTML = `
    <div class="snap-category-header">
      <h2>┃ API 전체 진단</h2>
      <span class="breadcrumb">전체 ${apiCharts.length}개 차트의 API 시리즈 테스트</span>
    </div>
    <div id="diagResult" style="padding:16px">
      <div class="keystat-loading" id="diagLoading">
        <div class="spinner"></div>
        <p style="margin-top:12px" id="diagProgress">진단 시작 중...</p>
      </div>
    </div>`;

  const results = [];
  let done = 0;
  const allSeries = [];

  apiCharts.forEach(ch => {
    ch.series.filter(s => s.api && !s.computed).forEach(s => {
      allSeries.push({ chartId: ch.id, chartTitle: ch.title, seriesName: s.name, api: s.api });
    });
  });

  const total = allSeries.length;

  for (const item of allSeries) {
    const { chartId, chartTitle, seriesName, api } = item;
    try {
      const data = await fetchEcosData(api, '5Y');
      const count = data ? data.length : 0;
      const err = data && data._error ? data._error : null;
      results.push({ chartId, chartTitle, seriesName, stat: api.stat, item: api.item, cycle: api.cycle, count, error: err });
    } catch (e) {
      results.push({ chartId, chartTitle, seriesName, stat: api.stat, item: api.item, cycle: api.cycle, count: 0, error: e.message });
    }
    done++;
    const el = document.getElementById('diagProgress');
    if (el) el.textContent = `진단 중... ${done}/${total}`;
  }

  const fail = results.filter(r => r.count === 0);
  const pass = results.filter(r => r.count > 0);

  // 실패한 통계표별 유효 항목코드 자동 조회
  const failStats = [...new Set(fail.map(r => r.stat))];
  const itemListMap = {};
  const el2 = document.getElementById('diagProgress');
  if (el2) el2.textContent = `항목코드 조회 중... (${failStats.length}개 통계표)`;

  for (const stat of failStats) {
    try {
      const resp = await fetch(`${CONFIG.PROXY_URL}?action=itemlist&statCode=${stat}`);
      const data = await resp.json();
      if (data.StatisticItemList && data.StatisticItemList.row) {
        itemListMap[stat] = data.StatisticItemList.row.map(r => ({
          code: r.ITEM_CODE, name: r.ITEM_NAME,
          pcode: r.P_ITEM_CODE || '', pname: r.P_ITEM_NAME || '',
          cycle: r.CYCLE || ''
        }));
      }
    } catch (e) {
      console.warn(`ItemList 조회 실패: ${stat}`, e);
    }
  }

  let html = `<h3 style="color:#27ae60;margin:16px 0 8px">✅ 성공: ${pass.length}개 시리즈</h3>`;
  html += `<h3 style="color:#e74c3c;margin:16px 0 8px">❌ 실패: ${fail.length}개 시리즈</h3>`;

  if (fail.length > 0) {
    html += `<div class="keystat-table-wrap"><table class="keystat-table">
      <thead><tr><th>차트</th><th>시리즈</th><th>stat</th><th>현재 item</th><th>cycle</th><th>오류</th><th>유효 항목코드 (후보)</th></tr></thead><tbody>`;
    fail.forEach(r => {
      const items = itemListMap[r.stat] || [];
      // 현재 item과 유사한 항목 찾기
      const kw = r.seriesName.replace(/[\(\)]/g,'').split(/[\s,]+/).filter(w => w.length > 1);
      const matches = items.filter(it => kw.some(w => (it.name||'').includes(w) || (it.pname||'').includes(w)));
      const candidates = (matches.length > 0 ? matches : items.slice(0, 5))
        .map(it => `<span style="background:#e8f4fd;padding:1px 4px;border-radius:3px;margin:1px;display:inline-block;font-size:0.7rem">${it.code} ${it.name}${it.pcode ? ' ('+it.pname+')' : ''} [${it.cycle}]</span>`)
        .join('');
      html += `<tr>
        <td class="td-name">${r.chartTitle}</td>
        <td>${r.seriesName}</td>
        <td style="font-family:monospace;font-size:0.75rem">${r.stat}</td>
        <td style="font-family:monospace;font-size:0.75rem;color:#e74c3c">${r.item}</td>
        <td>${r.cycle}</td>
        <td style="color:#e74c3c;font-size:0.72rem">${r.error || '빈 결과'}</td>
        <td style="max-width:400px">${candidates || '<span style="color:#999">조회 실패</span>'}</td>
      </tr>`;
    });
    html += '</tbody></table></div>';

    // 통계표별 전체 항목코드 목록
    html += `<h3 style="margin:24px 0 8px">📋 실패 통계표별 전체 항목코드</h3>`;
    for (const stat of failStats) {
      const items = itemListMap[stat];
      if (!items || items.length === 0) continue;
      html += `<details style="margin:8px 0"><summary style="cursor:pointer;font-weight:600;font-size:0.85rem">${stat} (${items.length}개 항목)</summary>`;
      html += `<div class="keystat-table-wrap" style="margin-top:4px"><table class="keystat-table">
        <thead><tr><th>코드</th><th>항목명</th><th>부모코드</th><th>부모항목명</th><th>주기</th></tr></thead><tbody>`;
      items.forEach(it => {
        html += `<tr>
          <td style="font-family:monospace;font-size:0.75rem">${it.code}</td>
          <td>${it.name}</td>
          <td style="font-family:monospace;font-size:0.75rem">${it.pcode}</td>
          <td>${it.pname}</td>
          <td>${it.cycle}</td>
        </tr>`;
      });
      html += '</tbody></table></details>';
    }
  }

  if (pass.length > 0) {
    html += `<details style="margin-top:16px"><summary style="cursor:pointer;font-weight:600;color:#27ae60">성공 목록 보기</summary>`;
    html += `<div class="keystat-table-wrap"><table class="keystat-table">
      <thead><tr><th>차트</th><th>시리즈</th><th>stat</th><th>item</th><th>cycle</th><th>건수</th></tr></thead><tbody>`;
    pass.forEach(r => {
      html += `<tr>
        <td class="td-name">${r.chartTitle}</td>
        <td>${r.seriesName}</td>
        <td style="font-family:monospace;font-size:0.75rem">${r.stat}</td>
        <td style="font-family:monospace;font-size:0.75rem">${r.item}</td>
        <td>${r.cycle}</td>
        <td class="td-value">${r.count}</td>
      </tr>`;
    });
    html += '</tbody></table></details>';
  }

  console.log('=== ECOS API 진단 결과 ===');
  console.log(`성공: ${pass.length}, 실패: ${fail.length}`);
  fail.forEach(r => console.log(`❌ ${r.chartTitle} > ${r.seriesName} [${r.stat}/${r.item}/${r.cycle}]: ${r.error || '빈 결과'}`));

  document.getElementById('diagResult').innerHTML = html;
}

window.addEventListener('DOMContentLoaded', init);
</script>
