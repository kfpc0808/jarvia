<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>금융·경제 정보 받아보기</title>
<meta property="og:title" content="금융·경제 정보, 카카오톡으로 받기">
<meta property="og:description" content="담당 컨설턴트가 골라 보내드리는 리포트와 금융·자산관리 정보를 카카오톡으로 받아보세요.">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════
   sub.html — 고객 수신 동의 요청 전용 페이지  [2026-09-14 신규]

   컨설턴트가 링크를 복사해 카톡·문자로 뿌리고, 고객이 눌러 바로 신청한다.
   종전에는 리포트를 이미 받아본 고객만 신청할 수 있어 모객 속도가 느렸다.

   설계 원칙
   · 링크에 인증키를 넣지 않는다 — ?fc= 식별자만. 카카오 미리보기 크롤러가 긁어도 무해하다.
   · 실물을 먼저 보여준다 — 말로 설명하기보다 오늘 자 리포트를 한 번 여는 편이 빠르다.
   · 두 칸만 받는다 — 이름·번호. 그 이상은 이탈을 부른다.
   · 동의 문구·버전은 client-daily.html 과 같은 값을 쓴다(rpt-2.0). 두 곳이 어긋나면
     "무엇에 동의했는지"가 기록마다 달라진다.
   ═══════════════════════════════════════════════════════════════ */
:root{
  --ink:#1C2024;--ink-mid:#33383E;--ink-lt:#565D66;--ink-sub:#8A9098;
  --bg:#F6F5F1;--bg-card:#FFF;
  --gold:#C9A05C;--gold-lt:#F6EFDC;--gold-dk:#96701F;
  --accent:#1E2226;--green:#0A7B61;--red:#C0392B;
  --border:#DFE2EA;--border-lt:#ECEEF3;
  --font:'Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.8;
 word-break:keep-all;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;background:#fff;min-height:100vh}
a{color:inherit}
button{font-family:inherit;cursor:pointer}

/* 로딩 · 오류 */
.state{padding:80px 24px;text-align:center;color:var(--ink-sub);font-size:14px;line-height:1.8}
.state b{display:block;color:var(--ink);font-size:16px;font-weight:800;margin-bottom:8px}
.spin{width:26px;height:26px;border:3px solid var(--border);border-top-color:var(--gold);
 border-radius:50%;margin:0 auto 14px;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* 1. 컨설턴트 */
.hd{display:flex;align-items:center;gap:11px;background:var(--accent);color:#fff;
 padding:calc(16px + var(--safe-t)) 18px 16px}
.hd .av{width:42px;height:42px;border-radius:50%;background:var(--gold);color:var(--accent);
 display:flex;align-items:center;justify-content:center;font-weight:900;font-size:16px;
 flex-shrink:0;overflow:hidden}
.hd .av img{width:100%;height:100%;object-fit:cover;display:block}
.hd .who b{display:block;font-size:15px;font-weight:800}
.hd .who b span{font-weight:500;font-size:13px;opacity:.85;margin-left:3px}
.hd .co{display:block;font-size:11.5px;color:rgba(255,255,255,.66);margin-top:1px}

/* 2. 히어로 */
.hero{padding:28px 18px 24px}
.hero .rule{width:36px;height:2px;background:var(--gold);margin-bottom:15px}
.hero h1{font-size:23px;font-weight:900;line-height:1.48;letter-spacing:-.02em}
.hero p{font-size:13.5px;color:var(--ink-lt);margin-top:13px;line-height:1.8}

/* 공통 섹션 */
.sec{padding:26px 18px;border-top:1px solid var(--border-lt)}
.tag{font-size:11px;letter-spacing:.12em;font-weight:800;color:var(--ink-sub)}
.tag.gold{color:var(--gold-dk)}
h2{font-size:19px;font-weight:900;letter-spacing:-.02em;margin-top:6px}
.cap{font-size:13px;color:var(--ink-lt);margin-top:5px}

/* 3. 샘플 */
.smp{display:flex;align-items:center;gap:12px;margin-top:13px;padding:12px;
 border:1px solid var(--border);border-radius:12px;background:#fff;text-decoration:none;color:inherit}
.smp:active{background:var(--bg)}
.smp .thumb{width:62px;height:74px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;
 justify-content:center;text-align:center;font-size:10.5px;font-weight:800;line-height:1.45;color:#fff;padding:4px}
.smp .thumb.d1{background:linear-gradient(150deg,#1E2226,#3A4148)}
.smp .thumb.d2{background:linear-gradient(150deg,#14213D,#2A4166)}
.smp .thumb.d2 span{color:var(--gold-lt)}
.smp .tx{flex:1;min-width:0}
.smp .tx b{display:block;font-size:14.5px;font-weight:800}
.smp .tx span{display:block;font-size:12px;color:var(--ink-lt);margin-top:2px}
.smp .tx em{display:block;font-style:normal;font-size:11.5px;color:var(--ink-sub);margin-top:4px}
.smp .go{font-size:20px;color:#C3C8D0;flex-shrink:0}
.smp.off{opacity:.5;pointer-events:none}

/* 4. 받게 되는 것 */
.list{margin-top:12px;list-style:none}
.list li{font-size:13.5px;color:var(--ink-mid);line-height:1.95;padding-left:14px;position:relative}
.list li::before{content:'';position:absolute;left:2px;top:12px;width:4px;height:4px;border-radius:50%;background:var(--gold)}
.list li:last-child{color:var(--gold-dk);font-weight:700}
.note{font-size:11.5px;color:var(--ink-sub);line-height:1.75;margin-top:12px;
 padding-top:11px;border-top:1px solid var(--border-lt)}

/* 5. 신청 */
.form{padding:26px 18px calc(24px + var(--safe-b));border-top:1px solid var(--border-lt);background:var(--bg)}
.fld{margin-top:12px}
.fld label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-lt);margin-bottom:5px}
.fld input{width:100%;height:48px;padding:0 13px;border:1px solid var(--border);border-radius:10px;
 font-family:inherit;font-size:15px;background:#fff;color:var(--ink)}
.fld input:focus{outline:none;border-color:var(--gold)}
.consent{margin-top:16px;background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px}
.ci{display:flex;gap:9px;align-items:flex-start;margin-bottom:11px;cursor:pointer}
.ci:last-child{margin-bottom:0}
.cb{width:20px;height:20px;border:1.5px solid #C3C8D0;border-radius:5px;flex-shrink:0;margin-top:1px;
 display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;font-weight:900}
.ci.on .cb{background:var(--accent);border-color:var(--accent)}
.ci.on .cb::before{content:'✓'}
.ci .l{font-size:12.5px;line-height:1.55;color:var(--ink)}
.ci .l b{font-weight:800}
.req{color:var(--red);font-weight:800;font-size:11px;margin-right:3px}
.opt{color:var(--ink-sub);font-weight:800;font-size:11px;margin-right:3px}
.lead2{font-size:11.5px;color:var(--ink-lt);line-height:1.65;margin-top:4px;font-weight:400}
.det{font-size:11px;color:var(--ink-lt);line-height:1.6;margin-top:4px}
.det div{display:flex;gap:6px}
.det span:first-child{color:var(--ink-sub);flex-shrink:0;width:54px}
.more{background:none;border:0;padding:5px 0 0;font-size:11px;font-weight:700;color:var(--ink-sub);text-decoration:underline}
.more i{font-style:normal;display:inline-block;transition:transform .15s}
.more.on i{transform:rotate(180deg)}
.sub-list{display:none;margin-top:6px;padding:9px 11px;background:rgba(0,0,0,.03);border-radius:8px}
.sub-list.on{display:block}
.sub-list li{list-style:none;font-size:11px;color:var(--ink-lt);line-height:1.7;padding-left:9px;position:relative}
.sub-list li::before{content:'·';position:absolute;left:1px;color:var(--ink-sub)}
.sub-list .n2{font-size:10.5px;color:var(--ink-sub);line-height:1.6;margin-top:7px;padding-top:7px;border-top:1px solid rgba(0,0,0,.07)}
.go-btn{width:100%;height:52px;border:0;border-radius:12px;background:#FEE500;color:#191919;
 font-size:15px;font-weight:800;margin-top:16px}
.go-btn:disabled{opacity:.45}
.priv{font-size:10.5px;color:var(--ink-sub);text-align:center;margin-top:10px;line-height:1.6}
.ft{padding:20px 18px calc(26px + var(--safe-b));font-size:11.5px;color:var(--ink-sub);
 text-align:center;border-top:1px solid var(--border-lt);line-height:1.7}
.ft b{color:var(--ink-lt)}

/* 소개 카드 — 낯선 링크를 받은 고객이 가장 먼저 묻는 건 "이 사람 누구지"다.
   명함만으로는 부족해 소개 카드로 넘어갈 자리를 둔다. */
.intro{display:flex;align-items:center;gap:12px;margin-top:13px;padding:14px;
 border:1px solid var(--border);border-radius:12px;background:#fff;text-decoration:none;color:inherit}
.intro:active{background:var(--bg)}
.intro .ph{width:52px;height:52px;border-radius:50%;flex-shrink:0;overflow:hidden;background:var(--gold);
 color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px}
.intro .ph img{width:100%;height:100%;object-fit:cover;display:block}
.intro .tx{flex:1;min-width:0}
.intro .tx b{display:block;font-size:14.5px;font-weight:800}
.intro .tx span{display:block;font-size:12.5px;color:var(--ink-lt);margin-top:3px;line-height:1.6}
.intro .go{font-size:20px;color:#C3C8D0;flex-shrink:0}

/* 공유 — 고객이 지인에게 넘기면 그 지인도 같은 컨설턴트의 고객이 된다 */
.share{padding:22px 18px;border-top:1px solid var(--border-lt);text-align:center;background:#fff}
.share p{font-size:13px;color:var(--ink-lt);line-height:1.75}
.share button{width:100%;height:48px;margin-top:12px;border:1px solid var(--border);border-radius:12px;
 background:#fff;font-size:14px;font-weight:800;color:var(--ink)}
.share button:active{background:var(--bg)}

/* 완료 */
.done{padding:60px 24px;text-align:center}
.done .ck{width:62px;height:62px;border-radius:50%;background:var(--green);color:#fff;font-size:30px;
 font-weight:900;display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
.done h3{font-size:20px;font-weight:900}
.done p{font-size:13.5px;color:var(--ink-lt);margin-top:10px;line-height:1.8}

/* ═══ 컨설턴트 미리보기 띠 — 본인이 로그인한 상태로 자기 링크를 열면 뜬다.
   고객에게는 보이지 않는다. 링크를 뿌리기 전에 자기 화면을 확인하고 사진을 바꾸는 자리다. ═══ */
.pvbar{background:#111826;color:#fff;padding:11px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pvbar .t{flex:1;min-width:0;font-size:12.5px;line-height:1.6}
.pvbar .t b{display:block;font-weight:800;font-size:13px}
.pvbar .t span{color:#9AA6BC;font-size:11.5px}
.pvbar button{border:0;border-radius:8px;padding:9px 14px;font-size:12.5px;font-weight:800;
 background:var(--gold);color:#111826;white-space:nowrap}
.pvbar button.ghost{background:transparent;color:#C9D3E4;border:1px solid rgba(255,255,255,.28)}
.hd .av.editable{cursor:pointer;position:relative}
.hd .av.editable::after{content:'';position:absolute;inset:0;border:2px dashed rgba(255,255,255,.5);border-radius:50%}
.phint{font-size:11px;color:rgba(255,255,255,.62);margin-top:3px}

/* 개인정보처리방침 — terms/ 컬렉션의 최신 활성본을 그대로 보여준다.
   별도 페이지(/privacy)는 존재하지 않아 404 가 떴다. 관리자 화면에서 고치면 여기도 같이 바뀐다. */
.tm-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:120;display:none;align-items:flex-end}
.tm-bg.on{display:flex}
.tm{background:#fff;width:100%;max-width:560px;margin:0 auto;border-radius:16px 16px 0 0;
 max-height:86vh;display:flex;flex-direction:column}
.tm h3{font-size:16px;font-weight:900;padding:18px 18px 12px;border-bottom:1px solid var(--border-lt)}
.tm .bd{flex:1;overflow-y:auto;padding:16px 18px;font-size:12.5px;line-height:1.85;color:var(--ink-mid);white-space:pre-wrap;word-break:keep-all}
.tm .ft2{padding:12px 18px calc(16px + var(--safe-b));border-top:1px solid var(--border-lt)}
.tm .ft2 button{width:100%;height:46px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-size:14px;font-weight:800}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--accent);color:#fff;
 font-size:13.5px;font-weight:600;padding:11px 20px;border-radius:24px;z-index:99;display:none;max-width:88%}
</style>
</head>
<body>

<div class="wrap" id="root">
  <div class="state"><div class="spin"></div>불러오는 중…</div>
</div>
<div class="toast" id="toast"></div>
<div class="tm-bg" id="tmBg" onclick="if(event.target===this)tmClose()">
  <div class="tm"><h3>개인정보처리방침</h3><div class="bd" id="tmBody">불러오는 중…</div>
  <div class="ft2"><button type="button" onclick="tmClose()">닫기</button></div></div>
</div>

<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import{getFirestore,doc,getDoc,setDoc,serverTimestamp,collection,query,where,orderBy,limit,getDocs,documentId}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
import{getFunctions,httpsCallable}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-functions.js';
import{getAuth,signInAnonymously,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import{getStorage,ref as storageRef,uploadBytes,getDownloadURL}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js';

const FC={apiKey:"AIzaSyBD9p-bf162RiiD1Y3BsY-NvbYjpOSrzmg",authDomain:"jarvia-platform.firebaseapp.com",projectId:"jarvia-platform",storageBucket:"jarvia-platform.firebasestorage.app",messagingSenderId:"388025068900",appId:"1:388025068900:web:09ba8e12e9e9e2ec49de71"};
const app=initializeApp(FC);
const db=getFirestore(app,'javia-db');   /* ★ 운영 DB 는 기본이 아니라 javia-db — client-daily.html·consensus.html 과 동일 */
const fns=getFunctions(app,'asia-northeast3');
const auth=getAuth(app);
const storage=getStorage(app);

/* 동의 문구·버전은 client-daily.html 과 반드시 같아야 한다 */
const CONSENT_VERSION='rpt-2.0';
const CONTENT_LIST=[
  '고객 데일리 리포트',
  '모닝 컨센서스 및 국내·외 금융시장 동향',
  '경제·금융 주요 이슈 및 전망',
  '자산관리 리포트',
  '세금·상속·증여·가업승계 관련 정보',
  '법인 및 기업경영 관련 주요 정보',
  '부동산·금리·환율 등 자산시장 주요 이슈',
  '정부 정책 및 제도 변경 안내',
  '향후 새롭게 제공되는 금융·경제·자산관리 리포트 및 콘텐츠',
];
const CONTENT_NOTE='콘텐츠의 종류와 발송 주기는 제공되는 서비스에 따라 달라질 수 있으며, 새로운 리포트나 콘텐츠가 추가될 수 있습니다. 필요한 정보를 선별하여 알림톡·문자 등으로 안내해 드립니다.';
const SEL_TEXT='담당 컨설턴트의 고객관리·상담 안내, 보험·연금·노후 준비 및 투자·펀드 관련 안내, 행사 초대. 동의하지 않아도 리포트는 정상 발송됩니다.';

const esc=(s)=>s?String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'):'';
const $=(id)=>document.getElementById(id);
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',2600);}

const FCID=(new URLSearchParams(location.search).get('fc')||'').trim();
let FC_DATA=null;
let IS_OWNER=false;   /* 컨설턴트 본인이 로그인한 상태로 자기 링크를 열었는가 */
const subPhoto=(fc)=>(fc&&(fc.subPhotoUrl||fc.photoUrl))||'';

function consentLines(n){
  return [
    ['발신','마이파트너 카카오톡 채널 (담당 컨설턴트 '+n+')'],
    ['내용','금융·경제·자산관리 정보와 리포트 (아래 「제공 내용 자세히」 참고)'],
    ['주기','담당 컨설턴트가 보낼 때 (비정기) · 콘텐츠에 따라 발송 주기가 다를 수 있습니다'],
    ['수신 중단',"리포트 하단 '카카오톡 수신 설정' 또는 담당 컨설턴트에게 요청 시 즉시"],
    ['보관','이름·휴대폰 번호, 수신 중단 시까지 (6개월간 발송이 없으면 자동 삭제)'],
  ];
}
/* 동의 기록 원문 — 화면에 보인 그대로 남긴다. 나중에 「무엇에 동의했는지」의 근거가 된다 */
function consentText(n){
  return '[필수] 금융·경제·자산관리 정보 및 리포트 카카오톡 수신 동의\n'
    + consentLines(n).map(x=>'- '+x[0]+': '+x[1]).join('\n')
    + '\n- 제공 내용: '+CONTENT_LIST.join(' / ')
    + '\n- 콘텐츠의 종류와 발송 주기는 제공 서비스에 따라 달라질 수 있으며, 새로운 리포트나 콘텐츠가 추가될 수 있습니다.'
    + '\n[선택] 상담·상품 안내 수신 동의 - '+SEL_TEXT
    + '\n(신청 경로: 수신 동의 요청 링크)';
}

/* terms 는 type·isActive·version 으로 최신본을 고른다. 복합 색인이 없을 수 있어
   admin.html 과 같이 전체를 읽고 코드에서 거르는 폴백을 함께 둔다. */
/* ★ [2026-09-14] 최신 1건 — 정렬 필드로 먼저 찾고, 비거나 실패하면 문서 ID 역순으로 재시도한다.
   Firestore 는 정렬 필드가 없는 문서를 결과에서 통째로 제외한다. 옛 문서에 createdAt 이 없으면
   최신 것이 있어도 빈 결과가 돌아와 샘플이 "준비 중" 으로만 보인다.
   두 컬렉션 모두 문서 ID 가 날짜(YYYYMMDD / YYYY-MM-DD)라 ID 역순이 곧 최신순이다.
   휴일에도 마지막 발행분이 잡히므로 "오늘 자가 없어 빈 화면" 이 되지 않는다. */
async function latestDoc(col, sortField){
  try{
    const s=await getDocs(query(collection(db,col),orderBy(sortField,'desc'),limit(1)));
    if(!s.empty)return s.docs[0];
    console.warn('[sub] '+col+' — '+sortField+' 정렬 결과 없음, 문서 ID 역순으로 재시도');
  }catch(e){ console.warn('[sub] '+col+' '+sortField+' 조회 실패:', e&&e.message); }
  try{
    const s=await getDocs(query(collection(db,col),orderBy(documentId(),'desc'),limit(1)));
    if(!s.empty)return s.docs[0];
    console.warn('[sub] '+col+' — 문서가 없습니다');
  }catch(e){ console.warn('[sub] '+col+' ID 역순 조회도 실패:', e&&e.message); }
  return null;
}

async function init(){
  if(!/^[A-Za-z0-9_-]{1,40}$/.test(FCID)){
    errView('링크가 올바르지 않습니다','담당 컨설턴트에게 다시 요청해 주세요.');return;
  }
  /* ★ Firestore 규칙이 인증을 요구한다 — client-daily.html 과 같이 익명 로그인 먼저.
     이게 없으면 프로필·리포트 조회가 전부 permission-denied 로 막힌다.
     이미 로그인한 컨설턴트가 자기 링크를 열었다면 그 세션을 그대로 쓴다(익명 전환 금지). */
  await new Promise((res)=>{
    let done=false;
    onAuthStateChanged(auth, async (u)=>{
      if(done)return; done=true;
      if(!u){ try{ await signInAnonymously(auth); }catch(e){ console.warn('anon auth', e); } }
      res();
    });
    setTimeout(()=>{ if(!done){done=true;res();} },4000);   /* 인증이 늦어도 화면은 뜬다 */
  });

  let fc=null, daily=null, mc=null, userDoc=null;
  try{
    /* consultants 문서 ID 가 로그인 ID 인 경우가 대부분이지만, 등록되지 않은 회원도 있다.
       client-daily.html 과 같이 users 에서 loginId 로 한 번 더 찾는다. */
    const [fcSnap,uSnap]=await Promise.allSettled([
      getDoc(doc(db,'consultants',FCID)),
      getDocs(query(collection(db,'users'),where('loginId','==',FCID),limit(1))),
    ]);
    if(fcSnap.status==='fulfilled'&&fcSnap.value.exists())fc=fcSnap.value.data();
    if(uSnap.status==='fulfilled'&&!uSnap.value.empty)userDoc=uSnap.value.docs[0].data();
    [daily,mc]=await Promise.all([
      latestDoc('client_daily_reports','createdAt'),
      latestDoc('morning_consensus','fileDate'),
    ]);
  }catch(e){ console.warn('init',e); }

  /* consultants 문서가 없으면 users 의 이름·소속으로 최소 프로필을 만든다.
     사진이 없는 상태이므로 이니셜로 표시되지만, 페이지 자체는 정상 동작한다. */
  if(!fc && userDoc){
    fc={ name:userDoc.name||FCID, title:userDoc.title||'', company:userDoc.company||'', phone:userDoc.phone||'' };
    console.warn('[sub] consultants 문서 없음 — users 프로필로 대체:', FCID);
  }
  if(!fc){ errView('담당 컨설턴트를 찾을 수 없습니다','링크를 다시 확인해 주세요.'); return; }
  FC_DATA=fc;

  /* ★ 미리보기 모드 판정 — 익명이 아닌 로그인 사용자면 컨설턴트로 본다.
     consultants 문서 ID 는 로그인 ID(gildong) 이고 Firebase uid 는 별개 값이라
     uid 비교로는 본인을 절대 못 맞춘다. client-daily.html 의 _jvOwner 와 같은 기준을 쓴다.
     사진 쓰기는 어차피 Firestore 규칙이 막으므로, 여기서 넓게 잡아도 권한이 새지 않는다. */
  const u=auth.currentUser;
  IS_OWNER = !!(u && !u.isAnonymous);

  render(fc,daily,mc);
}

/* ═══ 컨설턴트 전용 — 사진 교체 · 링크 복사 ═══ */
/* 정사각 512 로 줄여 올린다. 원본을 그대로 올리면 폰 사진 한 장이 5MB 를 넘어
   고객 화면 로딩이 느려진다. client-daily.html 의 방식과 같다. */
function square512(file){
  return new Promise((res,rej)=>{
    const img=new Image(), url=URL.createObjectURL(file);
    img.onload=()=>{
      const S=512, c=document.createElement('canvas'); c.width=S; c.height=S;
      const g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,S,S);
      const side=Math.min(img.width,img.height);
      g.drawImage(img,(img.width-side)/2,(img.height-side)/2,side,side,0,0,S,S);
      URL.revokeObjectURL(url);
      c.toBlob(b=>b?res(b):rej(new Error('이미지 변환 실패')),'image/jpeg',.88);
    };
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('이미지를 읽지 못했습니다'));};
    img.src=url;
  });
}
async function uploadSubPhoto(file){
  const u=auth.currentUser;
  if(!u||u.isAnonymous){toast('로그인 후 이용할 수 있습니다');return;}
  if(file.size>10*1024*1024){toast('사진 크기는 10MB 이하로 해주세요');return;}
  try{
    toast('사진 올리는 중…');
    const blob=await square512(file);
    const sr=storageRef(storage,'consultants/'+u.uid+'/sub.jpg');
    await uploadBytes(sr,blob,{contentType:'image/jpeg'});
    const url=await getDownloadURL(sr);
    /* 프로필 사진(photoUrl)은 건드리지 않는다 — 이 페이지 전용 필드에만 저장한다 */
    await setDoc(doc(db,'consultants',FCID),{subPhotoUrl:url,updatedAt:serverTimestamp()},{merge:true});
    if(u.uid!==FCID){ try{ await setDoc(doc(db,'consultants',u.uid),{subPhotoUrl:url,updatedAt:serverTimestamp()},{merge:true}); }catch(_e){} }
    FC_DATA.subPhotoUrl=url;
    const box=$('avBox'); if(box)box.innerHTML='<img src="'+esc(url)+'" alt="">';
    toast('사진이 바뀌었습니다');
  }catch(e){
    toast('사진 변경 실패: '+(e&&e.code==='permission-denied'?'본인 링크에서만 가능합니다':((e&&e.message)||'오류')));
  }
}
function pickPhoto(){
  const i=document.createElement('input');
  i.type='file'; i.accept='image/*'; i.style.display='none';
  i.onchange=async()=>{ const f=i.files&&i.files[0]; try{ if(f)await uploadSubPhoto(f); }finally{ try{i.remove();}catch(_e){} } };
  document.body.appendChild(i);   /* 인앱 브라우저 호환 — DOM 미부착 input 은 click 이 무시된다 */
  i.click();
  setTimeout(()=>{try{i.remove();}catch(_e){}},120000);
}
/* 지인 전달 — 기본 공유창(카톡·문자·메일)을 먼저 띄우고, 안 되는 기기에서만 복사로 떨어진다.
   카카오 공유 SDK 는 앱 키·도메인 등록이 필요하고 인앱 브라우저에서 자주 실패한다. */
async function shareLink(){
  const url=location.origin+location.pathname+'?fc='+encodeURIComponent(FCID);
  const n=(FC_DATA&&FC_DATA.name)||'담당 컨설턴트';
  const data={
    title:'금융·경제 정보 받아보기',
    text:n+' 컨설턴트가 매일 아침 시장 정리해서 보내드립니다. 저는 받아보고 있는데 도움이 되어 전해드립니다.',
    url,
  };
  if(navigator.share){
    try{ await navigator.share(data); return; }
    catch(e){ if(e&&e.name==='AbortError')return; }   /* 사용자가 취소한 것 — 복사로 떨어뜨리지 않는다 */
  }
  const done=()=>toast('링크를 복사했습니다 — 카톡이나 문자에 붙여넣어 전달하세요');
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(done).catch(()=>fallback(url,done));
  }else fallback(url,done);
}

function copyLink(){
  const url=location.origin+location.pathname+'?fc='+encodeURIComponent(FCID);
  const done=()=>toast('링크를 복사했습니다 — 카톡이나 문자에 붙여넣으세요');
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(done).catch(()=>fallback(url,done));
  }else fallback(url,done);
}
function fallback(url,done){
  const t=document.createElement('textarea');
  t.value=url; t.style.position='fixed'; t.style.opacity='0';
  document.body.appendChild(t); t.select();
  try{ document.execCommand('copy'); done(); }catch(_e){ toast('복사하지 못했습니다'); }
  t.remove();
}

function wire(){
  const sb=$('shareBtn'); if(sb)sb.onclick=shareLink;
  if(IS_OWNER){
    const box=$('avBox'); if(box)box.onclick=pickPhoto;
    const cb=$('copyBtn'); if(cb)cb.onclick=copyLink;
  }
  $('c1').onclick=(e)=>{ if(e.target.closest('#moreBtn'))return; $('c1').classList.toggle('on'); };
  $('c2').onclick=()=>$('c2').classList.toggle('on');
  $('moreBtn').onclick=(e)=>{
    e.stopPropagation();
    const l=$('subList'),b=$('moreBtn');
    const on=l.classList.toggle('on'); b.classList.toggle('on',on);
    b.firstChild.nodeValue = on ? '제공 내용 접기 ' : '제공 내용 자세히 ';
  };
  const ph=$('f_phone');
  ph.oninput=()=>{ /* 010-0000-0000 형태로 자동 정리 */
    let v=ph.value.replace(/\D/g,'').slice(0,11);
    if(v.length>7)v=v.slice(0,3)+'-'+v.slice(3,7)+'-'+v.slice(7);
    else if(v.length>3)v=v.slice(0,3)+'-'+v.slice(3);
    ph.value=v;
  };
  $('goBtn').onclick=submit;
}

let BUSY=false;
async function submit(){
  if(BUSY)return;
  const name=($('f_name').value||'').trim();
  const phone=($('f_phone').value||'').replace(/\D/g,'');
  if(name.length<1||name.length>20){toast('이름을 확인해 주세요');return;}
  if(!/^010\d{8}$/.test(phone)){toast('휴대폰 번호 11자리를 정확히 입력해 주세요');return;}
  if(!$('c1').classList.contains('on')){toast('필수 항목에 동의해 주세요');return;}

  BUSY=true;
  const btn=$('goBtn'); btn.disabled=true; btn.textContent='신청 중…';
  try{
    await httpsCallable(fns,'reportSubscribe')({
      fc:FCID, name, phone,
      reportOptIn:true,
      marketingOptIn:$('c2').classList.contains('on'),
      consentVersion:CONSENT_VERSION,
      consentText:consentText(FC_DATA&&FC_DATA.name||'담당 컨설턴트'),
      cid:'',
      source:'sub_link',   /* 어느 경로로 들어왔는지 — 링크 모객 효과를 나중에 볼 수 있다 */
    });
    doneView(name);
  }catch(e){
    BUSY=false; btn.disabled=false; btn.textContent='카카오톡으로 받기';
    toast('신청하지 못했습니다: '+((e&&e.message)||'오류'));
  }
}

function doneView(name){
  const n=FC_DATA&&FC_DATA.name||'담당 컨설턴트';
  $('root').innerHTML=`
  <header class="hd">
    <div class="av">${subPhoto(FC_DATA)?'<img src="'+esc(subPhoto(FC_DATA))+'" alt="">':esc(String(n).slice(0,1))}</div>
    <div class="who"><b>${esc(n)}</b><span class="co">${esc([FC_DATA.company,FC_DATA.phone].filter(Boolean).join(' · '))}</span></div>
  </header>
  <div class="done">
    <div class="ck">✓</div>
    <h3>신청되었습니다</h3>
    <p>${esc(name)} 님, 다음 발송분부터 카카오톡으로 보내드립니다.<br>수신은 언제든 중단하실 수 있습니다.</p>
  </div>
  <section class="share">
    <p>주변에 도움이 될 분이 계신가요?<br>방금 보신 안내를 그대로 전달하실 수 있습니다.</p>
    <button type="button" id="shareBtn2">🔗 지인에게 전달하기</button>
  </section>
  <footer class="ft">담당 컨설턴트 <b>${esc(n)}</b>이 보내드립니다</footer>`;
  const b=$('shareBtn2'); if(b)b.onclick=shareLink;   /* 방금 신청한 사람이 가장 잘 전달한다 */
}

init();
</script>
</body>
</html>
