<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JAVIA — 초기 설정</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Noto Sans KR',sans-serif;background:#f7f9fc;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
    .card{background:#fff;border-radius:16px;padding:40px;max-width:640px;width:100%;box-shadow:0 8px 32px rgba(0,0,0,.08)}
    h1{color:#1B3A5C;margin-bottom:8px} p{color:#666;margin-bottom:20px;line-height:1.6}
    .btn{background:#1B3A5C;color:#fff;border:none;padding:14px 28px;border-radius:8px;font-size:15px;cursor:pointer;margin:4px;font-weight:600}
    .btn:hover{background:#2E5A88} .btn-sm{padding:10px 16px;font-size:13px}
    .log{background:#1a1a2e;border-radius:8px;padding:16px;margin-top:20px;font-size:13px;max-height:400px;overflow-y:auto;white-space:pre-wrap;font-family:monospace;color:#ccc}
    .ok{color:#27AE60} .err{color:#E74C3C} .warn{color:#F39C12}
    .note{margin-top:20px;padding:16px;background:#EBF5FB;border-radius:8px;border-left:4px solid #2E86AB;font-size:14px;line-height:1.8}
    .note code{background:#ddd;padding:2px 8px;border-radius:4px;font-weight:600}
  </style>
</head>
<body>
  <div class="card">
    <h1>🚀 JAVIA 초기 설정</h1>
    <p>Firebase에 기본 데이터를 생성합니다. <strong>최초 1회만</strong> 실행하세요.</p>
    <div>
      <button class="btn" onclick="setupAll()">🔧 전체 초기 설정 실행</button>
    </div>
    <div style="margin-top:12px">
      <button class="btn btn-sm" onclick="setupAdmin()">관리자만</button>
      <button class="btn btn-sm" onclick="setupCategories()">카테고리만</button>
      <button class="btn btn-sm" onclick="setupChargeOptions()">충전옵션만</button>
      <button class="btn btn-sm" onclick="setupTerms()">약관만</button>
      <button class="btn btn-sm" onclick="setupSampleContent()">샘플콘텐츠</button>
    </div>
    <div class="log" id="log">준비 완료. 버튼을 클릭하세요.</div>
    <div class="note">
      <strong>설정 완료 후:</strong><br>
      ① index.html → <code>admin</code> / <code>kfpc0808</code> 로 로그인<br>
      ② admin.html로 자동 이동 → 회원관리/콘텐츠관리 시작
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script>
  const firebaseConfig={apiKey:"AIzaSyCf7CsUTgfIWY-RW_mvTJOhczDtk1xM9sA",authDomain:"kfpc-company-support-project.firebaseapp.com",projectId:"kfpc-company-support-project",storageBucket:"kfpc-company-support-project.firebasestorage.app",messagingSenderId:"1012609333373",appId:"1:1012609333373:web:7b6c207c81ff10d156d914"};
  firebase.initializeApp(firebaseConfig);
  const auth=firebase.auth();
  const db=firebase.firestore();
  const SRV=firebase.firestore.FieldValue;
  function gid(){return Date.now().toString(36)+Math.random().toString(36).substr(2,9)}
  function log(m,t=''){const el=document.getElementById('log');const s=document.createElement('span');s.className=t;s.textContent=m+'\n';el.appendChild(s);el.scrollTop=el.scrollHeight}

  async function setupAdmin(){
    log('▶ 총괄관리자 생성 중...');
    try{
      const ex=await db.collection('jv_admins').where('loginId','==','admin').get();
      if(!ex.empty){log('⚠️ 총괄관리자(admin)가 이미 존재합니다.','warn');return}
      let au;
      try{au=await auth.createUserWithEmailAndPassword('admin@javia-admin.internal','kfpc0808')}
      catch(e){if(e.code==='auth/email-already-in-use'){au=await auth.signInWithEmailAndPassword('admin@javia-admin.internal','kfpc0808');log('⚠️ Auth 계정 기존 사용','warn')}else throw e}
      const id=gid();
      await db.collection('jv_admins').doc(id).set({adminId:id,loginId:'admin',name:'총괄관리자',role:'superadmin',status:'active',createdBy:'system',lastLoginAt:null,createdAt:SRV.serverTimestamp()});
      await auth.signOut();
      log('✅ 총괄관리자 생성 완료 (admin / kfpc0808)','ok');
    }catch(e){log('❌ '+e.message,'err')}
  }

  async function setupCategories(){
    log('▶ 카테고리 생성 중...');
    const list=[{name:'법인영업',s:0},{name:'세무/노무',s:1},{name:'제안서/PPT',s:2},{name:'계약클로징',s:3},{name:'교육자료',s:4},{name:'영상',s:5}];
    for(const c of list){const id=gid();await db.collection('jv_categories').doc(id).set({categoryId:id,name:c.name,sortOrder:c.s,isActive:true});log('  ✓ '+c.name)}
    log('✅ 카테고리 완료','ok');
  }

  async function setupChargeOptions(){
    log('▶ 충전 옵션 생성 중...');
    const list=[{p:10000,c:10000,l:'10,000원',s:0},{p:30000,c:30000,l:'30,000원',s:1},{p:50000,c:55000,l:'50,000원 (+5,000 보너스)',s:2},{p:100000,c:120000,l:'100,000원 (+20,000 보너스)',s:3}];
    for(const o of list){const id=gid();await db.collection('jv_charge_options').doc(id).set({optionId:id,paidAmount:o.p,chargeAmount:o.c,label:o.l,sortOrder:o.s,isActive:true});log('  ✓ '+o.l)}
    log('✅ 충전 옵션 완료','ok');
  }

  async function setupTerms(){
    log('▶ 약관 생성 중...');
    const tos=`JAVIA 서비스 이용약관\n\n제1조 (목적)\n본 약관은 JAVIA가 제공하는 콘텐츠 서비스의 이용 조건을 규정합니다.\n\n제2조 (서비스 내용)\n1. 보험/법인영업 관련 교육 콘텐츠를 유료로 제공합니다.\n2. 크레딧 차감 방식으로 열람합니다.\n3. 결제 후 30일간 재열람 가능합니다.\n4. 다운로드 불가, 웹 뷰어 열람만 가능합니다.\n\n제3조 (회원가입)\n서비스 이용은 회원가입 후 로그인이 필요합니다.\n\n제4조 (크레딧)\n1. 정해진 금액 단위로 충전 가능합니다.\n2. 사용한 크레딧 환불은 불가합니다.\n\n제5조 (저작권)\n모든 콘텐츠의 저작권은 JAVIA에 있으며 무단 복제/배포를 금지합니다.`;
    const pp=`JAVIA 개인정보처리방침\n\n1. 수집 항목: 이름, 이메일, 연락처, 소속사, 직함 (선택: 주소)\n2. 이용 목적: 서비스 제공, 회원관리, 결제처리\n3. 보유기간: 회원 탈퇴 시까지\n4. 제3자 제공: 원칙적 미제공\n5. 파기: 보유기간 경과 시 지체없이 파기`;
    const id1=gid();await db.collection('jv_terms').doc(id1).set({termId:id1,type:'terms_of_service',content:tos,version:1,isActive:true,updatedBy:'system',createdAt:SRV.serverTimestamp(),updatedAt:SRV.serverTimestamp()});log('  ✓ 이용약관');
    const id2=gid();await db.collection('jv_terms').doc(id2).set({termId:id2,type:'privacy_policy',content:pp,version:1,isActive:true,updatedBy:'system',createdAt:SRV.serverTimestamp(),updatedAt:SRV.serverTimestamp()});log('  ✓ 개인정보처리방침');
    log('✅ 약관 완료','ok');
  }

  async function setupSampleContent(){
    log('▶ 샘플 콘텐츠 생성 중...');
    const cats=await db.collection('jv_categories').orderBy('sortOrder').limit(6).get();
    if(cats.empty){log('❌ 카테고리를 먼저 생성하세요.','err');return}
    const cids=cats.docs.map(d=>d.data().categoryId);
    const samples=[
      {title:'[샘플] 법인영업 기초 가이드',type:'doc',price:1000,ci:0,sum:'법인영업의 기본 개념과 접근 방법을 다루는 입문 자료입니다.'},
      {title:'[샘플] 법인세 절세 전략',type:'html',price:2000,ci:1,sum:'법인세 절세를 위한 핵심 전략과 실무 팁을 제공합니다.'},
      {title:'[샘플] 계약 클로징 PPT 템플릿',type:'ppt',price:2000,ci:2,sum:'고객 대상 프레젠테이션에 바로 사용할 수 있는 PPT 템플릿입니다.'},
      {title:'[샘플] 보험 상품 비교 분석',type:'doc',price:1000,ci:3,sum:'주요 보험 상품의 비교 분석 자료입니다.'},
      {title:'[샘플] 법인영업 실전 교육 영상',type:'video',price:2000,ci:4,sum:'현장 교육 영상으로 실전 법인영업 노하우를 배울 수 있습니다.'},
    ];
    for(let i=0;i<samples.length;i++){const s=samples[i];const id=gid();
      await db.collection('jv_contents').doc(id).set({contentId:id,categoryId:cids[s.ci]||cids[0],type:s.type,title:s.title,summary:s.sum,price:s.price,url:'https://example.com/sample',thumbnailUrl:null,isActive:true,viewCount:0,sortOrder:i,createdAt:SRV.serverTimestamp(),updatedAt:SRV.serverTimestamp()});
      log('  ✓ '+s.title)}
    log('✅ 샘플 콘텐츠 완료','ok');
  }

  async function setupAll(){
    log('═══════════════════════════════');
    log('▶▶▶ 전체 초기 설정 시작');
    log('═══════════════════════════════');
    await setupAdmin();
    await setupCategories();
    await setupChargeOptions();
    await setupTerms();
    await setupSampleContent();
    log('═══════════════════════════════');
    log('✅✅✅ 전체 설정 완료!','ok');
    log('index.html → admin / kfpc0808 로그인','ok');
    log('═══════════════════════════════');
  }
  </script>
</body>
</html>
