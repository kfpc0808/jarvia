<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>이너 Platform</title>
<link rel="icon" href="data:,">
<style>
:root{
  --navy:#1B3A5C; --navy-d:#0F2740; --gold:#D4A03C;
  --ink:#141B2D; --gray:#5A6484; --gray-l:#9099AD;
  --line:#E5E8EF; --bg:#F1F3F7;
  --ok:#138A5E; --warn:#C87A0A; --danger:#C0392B;
  --font:-apple-system,BlinkMacSystemFont,'Malgun Gothic','맑은 고딕',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:var(--font);background:var(--bg);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit}

/* ── 헤더 ── */
.hd{background:var(--navy);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:50}
.hd .bk{font-size:19px;opacity:.7;cursor:pointer;line-height:1}
.hd .ti{font-size:16px;font-weight:800;letter-spacing:-.3px;flex:1}
.hd .me{font-size:12px;color:#B8C8D8;white-space:nowrap}

/* ── 탭 ── */
.tabs{display:flex;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:47px;z-index:40}
.tabs button{flex:1;background:none;border:none;padding:12px 6px 10px;font-size:13.5px;font-weight:700;
  color:var(--gray-l);cursor:pointer;position:relative;white-space:nowrap}
.tabs button.on{color:var(--navy)}
.tabs button.on::after{content:'';position:absolute;left:14%;right:14%;bottom:-1px;height:2.5px;background:var(--gold);border-radius:3px}
.tabs .bdg{display:inline-block;background:var(--danger);color:#fff;font-size:10px;font-weight:800;
  padding:1px 6px;border-radius:9px;margin-left:4px;vertical-align:1px}

.wrap{max-width:720px;margin:0 auto;padding:14px 14px 60px}
.pane{display:none}
.pane.on{display:block}

/* ── 공통 ── */
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}
.srch{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);
  border-radius:10px;padding:10px 13px}
.srch input{flex:1;border:none;outline:none;font-size:14px;color:var(--ink);background:none}
.srch input::placeholder{color:var(--gray-l)}
.hqbar{display:flex;align-items:center;gap:10px;background:#FFF8EC;border:1px solid #F0DFBB;
  border-radius:10px;padding:11px 13px;margin-top:10px;cursor:pointer}
.hqbar b{font-size:12.5px;color:#8A6A20;display:block}
.hqbar span{font-size:11px;color:#A08850}

.ftabs{display:flex;gap:5px;overflow-x:auto;margin:14px 0 10px;padding-bottom:3px;scrollbar-width:none}
.ftabs::-webkit-scrollbar{display:none}
.ftabs span{flex-shrink:0;font-size:12.5px;padding:6px 13px;border-radius:16px;border:1px solid var(--line);
  background:#fff;color:var(--gray);cursor:pointer;white-space:nowrap}
.ftabs span.on{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chips span{font-size:12px;padding:5px 11px;border-radius:14px;background:#fff;border:1px solid var(--line);
  color:var(--gray);cursor:pointer}
.chips span.on{background:#FFF6E4;border-color:var(--gold);color:#8A6A20;font-weight:700}

.ecard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px;display:flex;gap:12px;
  margin-bottom:9px;cursor:pointer}
.ecard .ph{width:48px;height:48px;border-radius:50%;background:#EEF1F6;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:17px;color:#8FA3BC;font-weight:700;
  background-size:cover;background-position:center}
.ecard .nm{font-size:14px;font-weight:800}
.ecard .nm em{font-style:normal;font-weight:400;color:var(--gray);font-size:12.5px;margin-left:3px}
.ecard .tp{font-size:11.5px;color:var(--gray);margin-top:3px;line-height:1.55}
.ecard .mt{font-size:11px;color:var(--gray-l);margin-top:4px}

.tag{display:inline-block;font-size:10px;font-weight:800;padding:2px 8px;border-radius:10px}
.t-ok{background:#E4F5EC;color:var(--ok)}
.t-busy{background:#FDF0E0;color:var(--warn)}
.t-off{background:#EEF0F4;color:var(--gray)}
.t-run{background:#E7EEF7;color:var(--navy)}
.t-wait{background:#FCEBE6;color:var(--danger)}

.empty{text-align:center;padding:44px 20px;color:var(--gray-l);font-size:13.5px;line-height:1.8}
.empty b{display:block;font-size:15px;color:var(--gray);margin-bottom:6px;font-weight:700}

/* ── 목록형 표 ── */
.ltw{background:#fff;border:1px solid var(--line);border-radius:10px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.lt{border-collapse:collapse;font-size:12px;min-width:560px;width:100%}
.lt th{background:#F5F7FA;padding:9px;font-size:10.5px;color:var(--gray);font-weight:700;
  border-bottom:1px solid var(--line);white-space:nowrap;text-align:left}
.lt td{padding:10px 9px;border-bottom:1px solid #F0F2F6;white-space:nowrap}
.lt tr:last-child td{border-bottom:none}
.lt tbody tr{cursor:pointer}
.lt .no{color:var(--gray-l);font-size:11px}
.lt .sbj{font-weight:700}
.hint{font-size:10.5px;color:var(--gray-l);margin-top:6px}

.vsw{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;flex-shrink:0;background:#fff}
.vsw span{padding:5px 10px;font-size:11px;color:var(--gray-l);cursor:pointer}
.vsw span.on{background:var(--navy);color:#fff;font-weight:700}

.btn{display:block;width:100%;text-align:center;background:var(--gold);color:#fff;border:none;
  border-radius:10px;padding:13px;font-size:14.5px;font-weight:800;cursor:pointer}
.btn.nv{background:var(--navy)}
.btn.sec{background:#fff;color:var(--navy);border:1px solid #C7D2DE}
.btn:disabled{opacity:.5;cursor:default}

.load{text-align:center;padding:40px;color:var(--gray-l);font-size:13px}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:var(--ink);color:#fff;
  font-size:13px;padding:11px 18px;border-radius:22px;z-index:200;max-width:88%;text-align:center;
  opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
</style>
</head>
<body>

<div class="hd">
  <span class="bk" onclick="location.href='./index.html'">‹</span>
  <span class="ti">🤝 이너 Platform</span>
  <span class="me" id="hd-me"></span>
</div>

<div class="tabs">
  <button id="tb-find" class="on" onclick="icTab('find')">전문가 찾기</button>
  <button id="tb-my" onclick="icTab('my')">내 상담 현황<span class="bdg" id="my-bdg" style="display:none"></span></button>
  <button id="tb-hq" onclick="icTab('hq')">본사 문의</button>
</div>

<div class="wrap">

  <!-- ═══ 전문가 찾기 ═══ -->
  <div id="pane-find" class="pane on">
    <div class="srch">
      <span style="color:var(--gray-l)">🔍</span>
      <input id="q" placeholder="어떤 문제인가요? 예: 가지급금" oninput="icRenderExperts()">
      <span id="q-clr" style="display:none;color:var(--gray-l);cursor:pointer;font-size:15px" onclick="icClearQ()">×</span>
    </div>

    <div class="hqbar" onclick="icTab('hq')">
      <div style="flex:1">
        <b>어느 분야인지 모르겠어요</b>
        <span>본사 담당자가 확인해 드립니다</span>
      </div>
      <span style="color:#C4A96A">›</span>
    </div>

    <div class="ftabs" id="ftabs"></div>
    <div class="chips" id="chips"></div>

    <div id="exp-cnt" style="font-size:11.5px;color:var(--gray);margin-bottom:9px"></div>
    <div id="exp-list"><div class="load">불러오는 중...</div></div>
  </div>

  <!-- ═══ 내 상담 현황 ═══ -->
  <div id="pane-my" class="pane">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
      <div class="ftabs" id="my-ftabs" style="margin:0;flex:1"></div>
      <div class="vsw">
        <span id="vw-list" class="on" onclick="icView('list')">목록</span>
        <span id="vw-card" onclick="icView('card')">카드</span>
      </div>
    </div>
    <p class="hint" style="margin:0 0 11px">행을 누르면 상세로 이동합니다</p>
    <div id="my-alert"></div>
    <div id="my-list"><div class="load">불러오는 중...</div></div>
  </div>

  <!-- ═══ 본사 문의 ═══ -->
  <div id="pane-hq" class="pane">
    <div class="card" style="margin-bottom:12px">
      <div style="font-size:15px;font-weight:800;line-height:1.5">어떤 전문가가 필요한지<br>본사가 확인해 드립니다</div>
      <div style="font-size:12.5px;color:var(--gray);margin-top:8px;line-height:1.7">
        담당자가 내용을 검토해 적합한 전문가를 찾고, 사전 협의를 거쳐 연결해 드립니다.
        보통 1영업일 안에 회신합니다.</div>
    </div>
    <div class="card">
      <div class="empty" style="padding:30px 10px">
        <b>준비 중입니다</b>
        문의 접수 기능은 곧 열립니다.<br>
        그전까지는 담당자에게 직접 연락 주십시오.
        <div style="margin-top:16px"><a href="tel:010-5244-1467" style="color:var(--navy);font-weight:800;font-size:15px;text-decoration:none">박신제 본부장 010-5244-1467</a></div>
      </div>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import{getAuth,onAuthStateChanged,setPersistence,browserLocalPersistence}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import{getFirestore,collection,doc,getDoc,getDocs,query,where}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const FC={apiKey:"AIzaSyBD9p-bf162RiiD1Y3BsY-NvbYjpOSrzmg",authDomain:"jarvia-platform.firebaseapp.com",projectId:"jarvia-platform",storageBucket:"jarvia-platform.firebasestorage.app",messagingSenderId:"388025068900",appId:"1:388025068900:web:09ba8e12e9e9e2ec49de71"};
const app=initializeApp(FC);
const auth=getAuth(app);
setPersistence(auth,browserLocalPersistence).catch(()=>{});
const db=getFirestore(app,'javia-db');

const $=id=>document.getElementById(id);
const esc=s=>{if(s===0)return'0';if(!s)return'';const d=document.createElement('div');d.textContent=s;return d.innerHTML;};
let _tt;const toast=m=>{const e=$('toast');e.textContent=m;e.classList.add('on');clearTimeout(_tt);_tt=setTimeout(()=>e.classList.remove('on'),2600);};

/* 이 페이지 전용 상태 */
let me=null, meData=null;
let FIELDS=[], EXPERTS=[], CASES=[];
let curField='', curTopic='', curView='list', curMyFilter='all';

const ST={available:['상담 가능','t-ok'],busy:['상담 지연','t-busy'],off:['상담 중지','t-off']};
const CST={received:['접수','t-wait'],ongoing:['진행중','t-run'],
  done_pending:['완료','t-off'],done_confirmed:['완료','t-off'],closed:['종료','t-off']};

/* ═══ 진입 게이트 ═══ */
onAuthStateChanged(auth, async u=>{
  if(!u){location.href='./index.html';return;}
  me=u;
  try{
    /* 관리자 계정(@javia-admin.internal)은 users 문서가 없다 — index.html refreshMe 와 동일 처리 */
    if(u.email&&u.email.endsWith('@javia-admin.internal')){
      meData={role:'admin',name:'관리자'};
    }else{
      const d=await getDoc(doc(db,'users',u.uid));
      if(!d.exists()){location.href='./index.html';return;}
      meData=d.data();
    }
  }catch(e){
    $('exp-list').innerHTML='<div class="empty"><b>불러오지 못했습니다</b>잠시 후 다시 시도해 주세요.</div>';
    return;
  }
  const ok=['inner_circle','admin'].includes(meData.role);
  if(!ok){alert('이너서클 회원 전용 서비스입니다.');location.href='./index.html';return;}
  $('hd-me').textContent=(meData.name||'')+'님';
  await icLoadFields();
  await icLoadExperts();
  icLoadCases();
});

/* ═══ 탭 ═══ */
function icTab(t){
  ['find','my','hq'].forEach(x=>{
    $('pane-'+x).classList.toggle('on',x===t);
    $('tb-'+x).classList.toggle('on',x===t);
  });
  window.scrollTo(0,0);
}
window.icTab=icTab;

/* ═══ 분야·주제 ═══ */
async function icLoadFields(){
  try{
    const s=await getDocs(collection(db,'innerFields'));
    FIELDS=s.docs.map(d=>({id:d.id,...d.data()}))
      .filter(f=>f.active!==false)
      .sort((a,b)=>(a.order||99)-(b.order||99));
  }catch(e){FIELDS=[];}
  icRenderFieldTabs();
}

function icRenderFieldTabs(){
  const w=$('ftabs');
  if(!FIELDS.length){w.innerHTML='';$('chips').innerHTML='';return;}
  w.innerHTML='<span class="'+(curField?'':'on')+'" data-f="">전체</span>'
    +FIELDS.map(f=>'<span class="'+(curField===f.id?'on':'')+'" data-f="'+esc(f.id)+'">'+esc(f.name)+'</span>').join('');
  w.querySelectorAll('span').forEach(el=>el.onclick=()=>{
    curField=el.dataset.f;curTopic='';
    icRenderFieldTabs();icRenderExperts();
  });
  icRenderChips();
}

function icRenderChips(){
  const w=$('chips');
  const f=FIELDS.find(x=>x.id===curField);
  if(!f||!(f.topics||[]).length){w.innerHTML='';return;}
  const tp=(f.topics||[]).slice().sort((a,b)=>(a.order||99)-(b.order||99));
  w.innerHTML=tp.map(t=>'<span class="'+(curTopic===t.name?'on':'')+'" data-t="'+esc(t.name)+'">'+esc(t.name)+'</span>').join('');
  w.querySelectorAll('span').forEach(el=>el.onclick=()=>{
    curTopic=(curTopic===el.dataset.t)?'':el.dataset.t;
    icRenderChips();icRenderExperts();
  });
}

/* ═══ 전문가 ═══ */
async function icLoadExperts(){
  try{
    const s=await getDocs(collection(db,'innerExperts'));
    EXPERTS=s.docs.map(d=>({id:d.id,...d.data()}))
      .filter(e=>e.active!==false)
      .sort((a,b)=>(a.order||99)-(b.order||99));
  }catch(e){EXPERTS=[];}
  icRenderExperts();
}

function icClearQ(){$('q').value='';icRenderExperts();}
window.icClearQ=icClearQ;

function icRenderExperts(){
  const kw=($('q').value||'').trim().toLowerCase();
  $('q-clr').style.display=kw?'':'none';
  const fname=id=>(FIELDS.find(f=>f.id===id)||{}).name||'';

  let list=EXPERTS.filter(e=>{
    if(curField&&e.field!==curField)return false;
    if(curTopic&&!(e.subTopics||[]).includes(curTopic))return false;
    if(!kw)return true;
    const hay=[e.name,e.title,e.org,e.region,fname(e.field),
      (e.subTopics||[]).join(' '),(e.tags||[]).join(' ')].join(' ').toLowerCase();
    return hay.includes(kw);
  });
  /* 상담 가능 → 지연 → 중지 순으로 */
  const rank={available:0,busy:1,off:2};
  list.sort((a,b)=>(rank[a.status||'available']-rank[b.status||'available'])||((a.order||99)-(b.order||99)));

  const cnt=$('exp-cnt');
  const w=$('exp-list');

  if(!EXPERTS.length){
    cnt.textContent='';
    w.innerHTML='<div class="empty"><b>등록된 전문가가 없습니다</b>준비가 끝나는 대로 안내드리겠습니다.</div>';
    return;
  }
  if(!list.length){
    cnt.textContent='';
    w.innerHTML='<div class="empty"><b>찾으시는 전문가가 없습니다</b>'
      +'다른 말로 검색해 보시거나,<br>「어느 분야인지 모르겠어요」로 문의해 주세요.'
      +'<div style="margin-top:16px"><button class="btn sec" style="width:auto;padding:10px 20px;font-size:13px" onclick="icTab(\'hq\')">본사에 문의하기</button></div></div>';
    return;
  }

  cnt.textContent=(curTopic?curTopic+' 상담 가능 · ':'')+list.length+'명';
  w.innerHTML=list.map(e=>{
    const st=ST[e.status||'available']||ST.available;
    const ph=e.photoUrl
      ?'<div class="ph" style="background-image:url('+esc(e.photoUrl)+')"></div>'
      :'<div class="ph">'+esc((e.name||'?').charAt(0))+'</div>';
    const dim=(e.status==='off')?'opacity:.5':'';
    return '<div class="ecard" style="'+dim+'" data-id="'+esc(e.id)+'">'+ph
      +'<div style="flex:1;min-width:0">'
      +'<div class="nm">'+esc(e.name)+'<em>'+esc(e.title||'')+'</em> <span class="tag '+st[1]+'">'+st[0]+'</span></div>'
      +'<div class="tp">'+((e.subTopics||[]).map(esc).join(' · ')||esc(fname(e.field)))+'</div>'
      +'<div class="mt">'+[esc(e.region||''),esc(e.method||'')].filter(Boolean).join(' · ')+'</div>'
      +'</div></div>';
  }).join('');
  w.querySelectorAll('.ecard').forEach(el=>el.onclick=()=>{
    location.href='./ic-expert.html?e='+encodeURIComponent(el.dataset.id);
  });
}
window.icRenderExperts=icRenderExperts;

/* ═══ 내 상담 현황 ═══ */
const _ms=t=>{if(!t)return 0;try{return t.toDate?t.toDate().getTime():new Date(t).getTime();}catch(_){return 0;}};
const _md=t=>{const m=_ms(t);if(!m)return'-';const d=new Date(m);return(d.getMonth()+1)+'/'+d.getDate();};
const _days=t=>{const m=_ms(t);if(!m)return 0;return Math.floor((Date.now()-m)/86400000);};

async function icLoadCases(){
  try{
    const s=await getDocs(query(collection(db,'innerConsults'),where('fcUid','==',me.uid)));
    CASES=s.docs.map(d=>({id:d.id,...d.data()}))
      .sort((a,b)=>_ms(b.createdAt)-_ms(a.createdAt));
  }catch(e){CASES=[];}
  icRenderMyTabs();
  icRenderCases();
  const run=CASES.filter(c=>['received','ongoing'].includes(c.status)).length;
  const b=$('my-bdg');
  if(run){b.textContent=run;b.style.display='';}else{b.style.display='none';}
}

function icRenderMyTabs(){
  const n=k=>CASES.filter(c=>k==='all'?true:(k==='run'?['received','ongoing'].includes(c.status):!['received','ongoing'].includes(c.status))).length;
  const w=$('my-ftabs');
  w.innerHTML=[['all','전체'],['run','진행중'],['end','완료']]
    .map(([k,l])=>'<span class="'+(curMyFilter===k?'on':'')+'" data-k="'+k+'">'+l+' '+n(k)+'</span>').join('');
  w.querySelectorAll('span').forEach(el=>el.onclick=()=>{curMyFilter=el.dataset.k;icRenderMyTabs();icRenderCases();});
}

function icView(v){
  curView=v;
  $('vw-list').classList.toggle('on',v==='list');
  $('vw-card').classList.toggle('on',v==='card');
  icRenderCases();
}
window.icView=icView;

function icRenderCases(){
  const w=$('my-list'), al=$('my-alert');
  if(!CASES.length){
    al.innerHTML='';
    w.innerHTML='<div class="empty"><b>아직 신청한 상담이 없습니다</b>'
      +'전문가를 찾아 상담을 신청해 보세요.'
      +'<div style="margin-top:16px"><button class="btn sec" style="width:auto;padding:10px 20px;font-size:13px" onclick="icTab(\'find\')">전문가 찾기</button></div></div>';
    return;
  }
  const stale=CASES.filter(c=>['received','ongoing'].includes(c.status)&&_days(c.updatedAt||c.createdAt)>=7);
  al.innerHTML=stale.length
    ?'<div style="background:#FFF8EC;border:1px solid #F0DFBB;border-radius:10px;padding:11px 13px;'
      +'font-size:12px;color:#8A6A20;margin-bottom:11px;line-height:1.6"><b>'+stale.length+'건</b>이 '
      +'일주일 넘게 업데이트가 없습니다. 진행 상황을 남겨 주세요.</div>':'';

  const list=CASES.filter(c=>curMyFilter==='all'?true
    :(curMyFilter==='run'?['received','ongoing'].includes(c.status):!['received','ongoing'].includes(c.status)));
  if(!list.length){w.innerHTML='<div class="empty">해당하는 상담이 없습니다.</div>';return;}

  if(curView==='card'){
    w.innerHTML=list.map(c=>{
      const st=CST[c.status]||CST.received;
      return '<div class="card" style="margin-bottom:9px;cursor:pointer" data-id="'+esc(c.id)+'">'
        +'<div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start">'
        +'<div><div style="font-size:14px;font-weight:800">'+esc(c.topic||'-')+'</div>'
        +'<div style="font-size:12px;color:var(--gray);margin-top:2px">'
        +esc(c.company||c.clientName||'-')+' · '+esc(c.expertName||'배정 대기')+'</div></div>'
        +'<span class="tag '+st[1]+'">'+st[0]+'</span></div>'
        +'<div style="font-size:11.5px;color:var(--gray-l);margin-top:8px">'
        +_md(c.createdAt)+' 접수'+(c.lastNote?' · '+esc(c.lastNote):'')+'</div></div>';
    }).join('');
  }else{
    w.innerHTML='<div class="ltw"><table class="lt"><thead><tr>'
      +'<th style="width:30px">No</th><th style="width:112px">주제</th><th style="width:82px">고객</th>'
      +'<th style="width:100px">전문가</th><th style="width:60px">상태</th>'
      +'<th style="width:54px">접수</th><th style="width:48px">경과</th><th style="width:120px">최근 진행</th>'
      +'</tr></thead><tbody>'
      +list.map((c,i)=>{
        const st=CST[c.status]||CST.received;
        const dy=['received','ongoing'].includes(c.status)?_days(c.updatedAt||c.createdAt):null;
        const dyTx=dy===null?'—':(dy>=7?'<b style="color:var(--danger)">'+dy+'일</b>':dy+'일');
        return '<tr data-id="'+esc(c.id)+'">'
          +'<td class="no">'+(list.length-i)+'</td>'
          +'<td class="sbj">'+esc(c.topic||'-')+'</td>'
          +'<td>'+esc(c.company||c.clientName||'-')+'</td>'
          +'<td>'+esc(c.expertName||'배정 대기')+'</td>'
          +'<td><span class="tag '+st[1]+'">'+st[0]+'</span></td>'
          +'<td>'+_md(c.createdAt)+'</td><td>'+dyTx+'</td>'
          +'<td style="color:var(--gray)">'+esc(c.lastNote||'-')+'</td></tr>';
      }).join('')
      +'</tbody></table></div><p class="hint">↔ 좌우로 밀어 나머지 항목을 보실 수 있습니다</p>';
  }
  w.querySelectorAll('[data-id]').forEach(el=>el.onclick=()=>{
    location.href='./ic-case.html?c='+encodeURIComponent(el.dataset.id);
  });
}
</script>
</body>
</html>
