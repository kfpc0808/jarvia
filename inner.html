<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>이너 Platform</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --navy:#0E2438; --navy-2:#16324D;
  --ink:#141A24; --gray:#5B6577; --gray-l:#98A1B0;
  --line:#E4E8EE; --line-2:#EEF1F5;
  --paper:#F7F8FA; --gold:#A8862F; --gold-bg:#FCFBF7; --gold-line:#EDE6D5;
  --ok:#1B7A5A; --ok-bg:#EAF5F0; --warn:#96701C; --warn-bg:#FBF2E4;
  --danger:#A93B33; --danger-bg:#F9EDEB;
  --f:'Pretendard',-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--f);background:var(--paper);color:var(--ink);line-height:1.6;
  -webkit-font-smoothing:antialiased;font-feature-settings:'tnum'}
button,input,select,textarea{font-family:inherit;color:inherit}

/* ═══════════ 헤더 ═══════════ */
.hdwrap{position:sticky;top:0;z-index:60;background:var(--navy);padding-top:var(--safe-t)}
.tb{display:flex;align-items:center;height:56px;padding:0 16px;gap:12px;max-width:1180px;margin:0 auto}
.tb .bk{display:none;color:#fff;opacity:.7;font-size:20px;line-height:1;padding:4px 4px 6px;cursor:pointer;flex-shrink:0}
.tb .lg{font-size:15px;font-weight:700;color:#fff;letter-spacing:-.02em;display:flex;align-items:center;gap:9px;flex-shrink:0}
.tb .lg .dot{width:5px;height:5px;border-radius:50%;background:var(--gold);flex-shrink:0}
.tb .lg .sub{font-size:10.5px;font-weight:400;color:#7E93AC;letter-spacing:.05em;padding-left:9px;
  border-left:1px solid rgba(255,255,255,.15)}
.tb .pt{display:none;font-size:15.5px;font-weight:700;color:#fff;letter-spacing:-.02em;flex:1;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dnav{display:flex;gap:2px;margin-left:16px}
.dnav button{background:none;border:none;font-size:13.5px;color:#A9BACC;padding:8px 14px;border-radius:6px;
  cursor:pointer;position:relative;white-space:nowrap}
.dnav button:hover{color:#fff}
.dnav button.on{color:#fff;font-weight:600}
.dnav button.on::after{content:'';position:absolute;left:14px;right:14px;bottom:-18px;height:2px;background:var(--gold)}
.dnav .bdg{background:var(--gold);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:9px;margin-left:5px}
.tb .sp{flex:1}
.tb .who{font-size:12.5px;color:#B9C7D6;white-space:nowrap}
.tb .out{font-size:12px;color:#7E93AC;border:1px solid rgba(255,255,255,.16);border-radius:6px;
  padding:5px 11px;cursor:pointer;background:none;white-space:nowrap}
.tb .out:hover{color:#fff;border-color:rgba(255,255,255,.3)}

.mnav{display:none;background:#fff;border-bottom:1px solid var(--line)}
.mnav button{flex:1;background:none;border:none;padding:13px 4px 11px;font-size:13.5px;font-weight:600;
  color:var(--gray-l);cursor:pointer;position:relative;white-space:nowrap}
.mnav button.on{color:var(--navy);font-weight:700}
.mnav button.on::after{content:'';position:absolute;left:20%;right:20%;bottom:-1px;height:2px;background:var(--gold)}
.mnav .bdg{background:var(--gold);color:#fff;font-size:10px;font-weight:700;padding:1px 5px;border-radius:8px;margin-left:3px}

/* ═══════════ 페이지 ═══════════ */
.pg{max-width:1180px;margin:0 auto;padding:26px 26px 80px}
.view{display:none}
.view.on{display:block}
.two{display:grid;grid-template-columns:236px minmax(0,1fr);gap:26px;align-items:start}
.two.det{grid-template-columns:minmax(0,1fr) 320px}
.crumb{font-size:12.5px;color:var(--gray-l);margin-bottom:16px}
.crumb span{margin:0 7px}

/* 사이드(분야) */
.side{background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 0;position:sticky;top:100px}
.side .h{font-size:10.5px;font-weight:700;color:var(--gray-l);letter-spacing:.08em;padding:14px 18px 8px}
.side a{display:flex;justify-content:space-between;align-items:center;padding:9px 18px;font-size:13.5px;
  color:var(--gray);cursor:pointer;border-left:2px solid transparent}
.side a:hover{background:var(--line-2);color:var(--ink)}
.side a.on{color:var(--navy);font-weight:700;border-left-color:var(--gold);background:var(--gold-bg)}
.side a em{font-style:normal;font-size:11px;color:var(--gray-l)}
.side .div{height:1px;background:var(--line-2);margin:8px 0}
.side a.hq{color:var(--gold);font-weight:600}

/* 검색 */
.search{display:flex;align-items:center;gap:11px;background:#fff;border:1px solid var(--line);
  border-radius:10px;padding:13px 17px;margin-bottom:14px}
.search .ic{color:var(--gray-l);font-size:15px;flex-shrink:0}
.search input{flex:1;border:none;outline:none;font-size:16px;min-width:0;background:none}
.search input::placeholder{color:var(--gray-l)}
.search .clr{color:var(--gray-l);cursor:pointer;font-size:17px;flex-shrink:0;padding:0 2px}

.tps{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.tps span{font-size:12.5px;padding:6px 13px;border-radius:15px;border:1px solid var(--line);
  background:#fff;color:var(--gray);cursor:pointer;transition:border-color .12s,color .12s}
.tps span:hover{border-color:var(--gray-l);color:var(--ink)}
.tps span.on{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:600}

.rowhd{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:13px;gap:12px}
.rowhd h3{font-size:16px;font-weight:700;letter-spacing:-.02em}
.rowhd .n{font-size:12px;color:var(--gray-l);white-space:nowrap}

/* 전문가 카드 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:14px}
.ec{background:#fff;border:1px solid var(--line);border-radius:10px;padding:20px;cursor:pointer;
  transition:border-color .14s,box-shadow .14s,transform .14s}
.ec:hover{border-color:#C9D0DA;box-shadow:0 6px 22px rgba(16,24,40,.07);transform:translateY(-1px)}
.ec .top{display:flex;gap:13px;align-items:center;margin-bottom:14px}
.av{width:52px;height:52px;border-radius:50%;flex-shrink:0;background:#EDF0F4;color:#8C99AB;
  display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;
  border:1px solid var(--line);background-size:cover;background-position:center}
.av.lg{width:82px;height:82px;font-size:26px}
.ec .nm{font-size:15.5px;font-weight:700;letter-spacing:-.02em}
.ec .nm span{font-size:12.5px;font-weight:400;color:var(--gray);margin-left:5px}
.ec .org{font-size:11.5px;color:var(--gray-l);margin-top:2px}
.ec .tp{font-size:12.5px;color:var(--gray);line-height:1.75;border-top:1px solid var(--line-2);
  padding-top:12px;min-height:52px}
.ec .ft{display:flex;align-items:center;justify-content:space-between;margin-top:13px;gap:8px}
.ec .mt{font-size:11.5px;color:var(--gray-l)}

.st{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:3px;letter-spacing:.02em;white-space:nowrap}
.st-ok{background:var(--ok-bg);color:var(--ok)}
.st-bs{background:var(--warn-bg);color:var(--warn)}
.st-of{background:#F0F2F5;color:var(--gray)}
.st-rn{background:#EAF0F7;color:var(--navy-2)}
.st-wt{background:var(--danger-bg);color:var(--danger)}

/* 카드·프로필 */
.dcard{background:#fff;border:1px solid var(--line);border-radius:10px;padding:26px}
.dcard+.dcard,.dcard+.letter,.letter+.dcard{margin-top:14px}
.lbl{font-size:10.5px;font-weight:700;color:var(--gray-l);letter-spacing:.08em;margin-bottom:12px}
.kv{font-size:13.5px}
.kv .r{display:flex;gap:16px;padding:8px 0;border-bottom:1px solid var(--line-2);line-height:1.85}
.kv .r:last-child{border-bottom:none}
.kv .r b{width:86px;flex-shrink:0;color:var(--gray-l);font-weight:500;font-size:12.5px}
.kv .r span{flex:1;min-width:0}

.prof{background:#fff;border:1px solid var(--line);border-radius:10px;padding:24px;text-align:center;
  position:sticky;top:100px}
.prof .av{margin:0 auto 14px}
.prof .nm{font-size:19px;font-weight:700;letter-spacing:-.03em}
.prof .ti{font-size:13px;color:var(--gray);margin-top:3px}
.prof .org{font-size:12px;color:var(--gray-l);margin-top:12px;padding-top:12px;
  border-top:1px solid var(--line-2);line-height:1.7}
.prof .fine{font-size:11px;color:var(--gray-l);line-height:1.65;margin-top:11px}

.letter{background:var(--gold-bg);border:1px solid var(--gold-line);border-radius:10px;padding:26px 28px}
.letter .q{font-size:26px;color:var(--gold);line-height:1;margin-bottom:10px;font-family:Georgia,serif}
.letter .tx{font-size:14px;line-height:2;color:#2E3644;letter-spacing:-.01em;white-space:pre-line}
.letter .sg{text-align:right;font-size:13px;font-weight:600;color:var(--gold);margin-top:18px;
  padding-top:14px;border-top:1px solid var(--gold-line)}

.cases{list-style:none}
.cases li{font-size:13.5px;color:#3A4353;line-height:1.8;padding:11px 0 11px 16px;position:relative;
  border-bottom:1px solid var(--line-2)}
.cases li:last-child{border-bottom:none}
.cases li::before{content:'';position:absolute;left:0;top:19px;width:4px;height:4px;border-radius:50%;background:var(--gold)}

/* 표 */
.tblw{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:560px}
.tbl th{text-align:left;font-size:11px;font-weight:600;color:var(--gray-l);letter-spacing:.04em;
  padding:0 14px 11px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:15px 14px;border-bottom:1px solid var(--line-2);white-space:nowrap}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover td{background:#FBFCFD}
.tbl .no{color:var(--gray-l);font-size:11.5px}
.tbl .sb{font-weight:600}
.tbl .mu{color:var(--gray)}
.tbl tr.own td{background:var(--gold-bg)}

.bnr{display:flex;align-items:flex-start;gap:11px;background:var(--gold-bg);border:1px solid var(--gold-line);
  border-radius:8px;padding:14px 17px;font-size:13px;color:#6A5A2E;margin-bottom:16px;line-height:1.7}
.bnr .di{color:var(--gold);flex-shrink:0}
.bnr b{color:#4E4220}

/* 목록(전문가 접수현황) */
.list{border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#fff}
.li{padding:13px 15px;border-bottom:1px solid var(--line-2)}
.li:last-child{border-bottom:none}
.li.mine{background:var(--gold-bg);cursor:pointer}
.li .t1{font-size:13.5px;font-weight:600;display:flex;justify-content:space-between;gap:10px;align-items:center}
.li .t2{font-size:11.5px;color:var(--gray-l);margin-top:4px}
.li .own{color:var(--gold);font-weight:700;font-size:11.5px;margin-left:6px}

/* 폼 */
.fld{margin-bottom:16px}
.fld label{display:block;font-size:12px;font-weight:600;color:var(--gray);margin-bottom:6px}
.fld label i{color:var(--danger);font-style:normal}
.fld label em{font-style:normal;font-weight:400;color:var(--gray-l);font-size:11px}
.fld input,.fld textarea,.fld select{width:100%;border:1px solid var(--line);border-radius:8px;
  padding:12px 14px;font-size:16px;background:#fff;outline:none;transition:border-color .12s}
.fld textarea{min-height:112px;resize:vertical;line-height:1.75}
.fld input:focus,.fld textarea:focus,.fld select:focus{border-color:var(--gold)}
.fld .hint{font-size:11.5px;color:var(--gray-l);margin-top:6px;line-height:1.6}
.notice{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:13px 15px;
  font-size:12.5px;color:var(--gray);line-height:1.75;margin-bottom:16px}
.notice b{color:var(--ink)}

/* 버튼 */
.btn{display:block;width:100%;text-align:center;background:var(--navy);color:#fff;border:none;
  border-radius:8px;padding:15px;font-size:15px;font-weight:700;cursor:pointer;letter-spacing:-.01em}
.btn:hover{background:var(--navy-2)}
.btn.sec{background:#fff;color:var(--navy);border:1px solid var(--line);font-weight:600;font-size:13.5px;padding:13px}
.btn.sec:hover{background:var(--line-2)}
.btn:disabled{background:#C9CFD8;cursor:default}
.btn+.btn{margin-top:8px}
.btn.sm{width:auto;display:inline-block;padding:11px 22px;font-size:13.5px}

/* 타임라인 */
.tl{position:relative;padding-left:20px}
.tl::before{content:'';position:absolute;left:5px;top:7px;bottom:7px;width:1px;background:var(--line)}
.tl .ev{position:relative;padding-bottom:20px}
.tl .ev:last-child{padding-bottom:0}
.tl .ev::before{content:'';position:absolute;left:-19px;top:6px;width:9px;height:9px;border-radius:50%;
  background:#fff;border:2px solid var(--gold)}
.tl .ev.sys::before{border-color:#C9D0DA}
.tl .dt{font-size:11px;color:var(--gray-l)}
.tl .who{font-size:12px;color:var(--navy);font-weight:700;margin-top:2px}
.tl .tx{font-size:13.5px;margin-top:3px;line-height:1.8;white-space:pre-line}
.fileb{display:flex;align-items:center;gap:10px;background:var(--paper);border:1px solid var(--line);
  border-radius:8px;padding:11px 14px;font-size:13px;margin-top:8px}
.fileb .exp{margin-left:auto;font-size:11px;color:var(--warn);font-weight:700;white-space:nowrap}

.empty{text-align:center;padding:56px 20px;color:var(--gray-l);font-size:13.5px;line-height:1.85}
.empty b{display:block;font-size:16px;color:var(--gray);margin-bottom:8px;font-weight:700;letter-spacing:-.02em}
.load{text-align:center;padding:52px;color:var(--gray-l);font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(34px + var(--safe-b));transform:translateX(-50%);
  background:var(--ink);color:#fff;font-size:13.5px;padding:12px 20px;border-radius:8px;z-index:300;
  max-width:88%;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}

/* 모바일 하단 고정 CTA */
.fixcta{display:none;position:fixed;left:0;right:0;bottom:0;z-index:70;background:#fff;
  border-top:1px solid var(--line);padding:12px 16px calc(12px + var(--safe-b))}

/* ═══════════ 태블릿·모바일 ═══════════ */
@media(max-width:1023px){
  .dnav{display:none}
  .tb .who{display:none}
  .tb .out{display:none}
  .mnav{display:flex}
  .tb{height:52px;padding:0 14px}
  .pg{padding:14px 14px 80px}
  .two,.two.det{grid-template-columns:minmax(0,1fr);gap:12px}
  .crumb{display:none}
  .side{position:static;display:flex;overflow-x:auto;padding:0;gap:6px;border:none;
    background:none;border-radius:0;scrollbar-width:none;margin-bottom:12px}
  .side::-webkit-scrollbar{display:none}
  .side .h,.side .div{display:none}
  .side a{flex-shrink:0;border:1px solid var(--line);border-left:1px solid var(--line);
    background:#fff;border-radius:15px;padding:6px 13px;font-size:12.5px;white-space:nowrap}
  .side a.on{background:var(--navy);border-color:var(--navy);color:#fff}
  .side a em{display:none}
  .side a.hq{border-color:var(--gold-line);background:var(--gold-bg)}
  .grid{grid-template-columns:minmax(0,1fr);gap:10px}
  .ec{padding:15px}
  .ec .tp{min-height:0;padding-top:11px}
  .dcard{padding:18px}
  .letter{padding:20px 18px}
  .letter .tx{font-size:13.5px;line-height:1.95}
  .prof{position:static;padding:22px 18px;order:-1}
  .two.det>aside{order:-1}
  .tbl td{padding:13px 12px}
  .body-cta .btn{display:none}
  .fixcta.on{display:block}
  .view.has-cta{padding-bottom:20px}
}
@media(max-width:400px){
  .mnav button{font-size:12.5px;padding:12px 2px 10px}
  .search{padding:12px 14px}
  .ec .nm{font-size:15px}
}
@media(min-width:1024px){
  .tb .bk{display:none!important}
  .tb .pt{display:none!important}
}
</style>
</head>
<body>

<div class="hdwrap">
  <div class="tb">
    <span class="bk" id="hd-bk">‹</span>
    <div class="lg" id="hd-lg"><span class="dot"></span>이너 Platform<span class="sub">INNER CIRCLE</span></div>
    <div class="pt" id="hd-pt"></div>
    <nav class="dnav" id="dnav">
      <button data-v="find" class="on">전문가</button>
      <button data-v="my">내 상담<span class="bdg" id="d-bdg" style="display:none"></span></button>
      <button data-v="hq">본사 문의</button>
    </nav>
    <span class="sp"></span>
    <span class="who" id="hd-me"></span>
    <button class="out" id="hd-out">나가기</button>
  </div>
  <div class="mnav" id="mnav">
    <button data-v="find" class="on">전문가</button>
    <button data-v="my">내 상담<span class="bdg" id="m-bdg" style="display:none"></span></button>
    <button data-v="hq">본사 문의</button>
  </div>
</div>

<div class="pg">

  <!-- ═══ 전문가 찾기 ═══ -->
  <div id="v-find" class="view on">
    <div class="two">
      <aside class="side" id="side"></aside>
      <div>
        <div class="search">
          <span class="ic">&#9906;</span>
          <input id="q" placeholder="어떤 문제인가요  ·  예: 대표가 회사 돈을 가져갔는데">
          <span class="clr" id="q-clr" style="display:none">&times;</span>
        </div>
        <div class="tps" id="tps"></div>
        <div class="rowhd"><h3 id="exp-hd">전문가</h3><span class="n" id="exp-n"></span></div>
        <div id="exp-list"><div class="load">불러오는 중</div></div>
      </div>
    </div>
  </div>

  <!-- ═══ 전문가 상세 ═══ -->
  <div id="v-expert" class="view">
    <div class="crumb" id="ex-crumb"></div>
    <div class="two det">
      <div id="ex-main"></div>
      <aside id="ex-side"></aside>
    </div>
  </div>

  <!-- ═══ 상담 신청 ═══ -->
  <div id="v-apply" class="view"><div style="max-width:640px" id="ap-body"></div></div>

  <!-- ═══ 내 상담 현황 ═══ -->
  <div id="v-my" class="view">
    <div class="rowhd" style="margin-bottom:18px">
      <h3 style="font-size:19px">내 상담 현황</h3>
      <span class="n" id="my-n"></span>
    </div>
    <div id="my-alert"></div>
    <div class="tps" id="my-filter"></div>
    <div id="my-list"><div class="load">불러오는 중</div></div>
  </div>

  <!-- ═══ 케이스 상세 ═══ -->
  <div id="v-case" class="view"><div style="max-width:760px" id="cs-body"></div></div>

  <!-- ═══ 본사 문의 ═══ -->
  <div id="v-hq" class="view"><div style="max-width:640px" id="hq-body"></div></div>

</div>

<div class="fixcta" id="fixcta"></div>
<div class="toast" id="toast"></div>

<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import{getAuth,onAuthStateChanged,setPersistence,browserLocalPersistence}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import{getFirestore,collection,doc,getDoc,getDocs,query,where}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
import{getFunctions,httpsCallable}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-functions.js';

const FC={apiKey:"AIzaSyBD9p-bf162RiiD1Y3BsY-NvbYjpOSrzmg",authDomain:"jarvia-platform.firebaseapp.com",projectId:"jarvia-platform",storageBucket:"jarvia-platform.firebasestorage.app",messagingSenderId:"388025068900",appId:"1:388025068900:web:09ba8e12e9e9e2ec49de71"};
const app=initializeApp(FC);
const auth=getAuth(app);
setPersistence(auth,browserLocalPersistence).catch(()=>{});
const db=getFirestore(app,'javia-db');
const functions=getFunctions(app,'asia-northeast3');
const call=(name,data)=>httpsCallable(functions,name)(data||{}).then(r=>r.data||{});

const $=id=>document.getElementById(id);
const esc=s=>{if(s===0)return'0';if(!s)return'';const d=document.createElement('div');d.textContent=s;return d.innerHTML;};
const nl=s=>esc(s).replace(/\n/g,'<br>');
let _tt;
const toast=m=>{const e=$('toast');e.textContent=m;e.classList.add('on');clearTimeout(_tt);_tt=setTimeout(()=>e.classList.remove('on'),2600);};

const _ms=t=>{if(!t)return 0;try{return t.toDate?t.toDate().getTime():new Date(t).getTime();}catch(_){return 0;}};
const _md=t=>{const m=_ms(t);if(!m)return'-';const d=new Date(m);return(d.getMonth()+1)+'월 '+d.getDate()+'일';};
const _dt=t=>{const m=_ms(t);if(!m)return'';const d=new Date(m);
  return _md(t)+'  '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');};
const _days=t=>{const m=_ms(t);if(!m)return 0;return Math.floor((Date.now()-m)/86400000);};
const _won=n=>(Number(n)||0).toLocaleString('ko-KR');

const ST={available:['상담 가능','st-ok'],busy:['상담 지연','st-bs'],off:['상담 중지','st-of']};
const CST={received:['접수','st-wt'],ongoing:['진행중','st-rn'],
  done_pending:['완료','st-of'],done_confirmed:['완료','st-of'],closed:['종료','st-of']};
const ROLE={fc:'나',expert:'전문가',admin:'본사'};

let me=null,meData=null;
let FIELDS=[],EXPERTS=[],CASES=[];
let curField='',curTopic='',curMyFilter='all',curExpertId='',curCaseId='';

const TABV=['find','my','hq'];
const ALLV=['find','expert','apply','my','case','hq'];
const TITLE={expert:'전문가',apply:'상담 신청',case:'상담 상세'};

/* ═══════════ 라우터 ═══════════ */
function go(v,opt){
  opt=opt||{};
  ALLV.forEach(x=>$('v-'+x).classList.toggle('on',x===v));
  const isTab=TABV.includes(v);
  $('mnav').style.display='';
  document.querySelectorAll('#mnav button,#dnav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  $('hd-bk').style.display=isTab?'':'inline-block';
  $('hd-lg').style.display=isTab?'':'none';
  $('hd-pt').style.display=isTab?'':'';
  $('hd-pt').textContent=isTab?'':(TITLE[v]||'');
  if(isTab){$('hd-lg').style.display='';$('hd-pt').textContent='';}
  setCta(null);

  const p=new URLSearchParams();
  if(v!=='find')p.set('v',v);
  if(opt.e)p.set('e',opt.e);
  if(opt.c)p.set('c',opt.c);
  const url=location.pathname+(p.toString()?'?'+p.toString():'');
  if(opt.replace)history.replaceState({v:v},'',url); else history.pushState({v:v},'',url);
  window.scrollTo(0,0);
}
function setCta(html){
  const w=$('fixcta');
  if(!html){w.innerHTML='';w.classList.remove('on');return;}
  w.innerHTML=html;w.classList.add('on');
}
function routeFromUrl(){
  const p=new URLSearchParams(location.search);
  const v=p.get('v')||'find', e=p.get('e')||'', c=p.get('c')||'';
  if(v==='expert'&&e){curExpertId=e;go('expert',{e:e,replace:true});renderExpert();return;}
  if(v==='apply'&&e){curExpertId=e;go('apply',{e:e,replace:true});renderApply();return;}
  if(v==='case'&&c){curCaseId=c;go('case',{c:c,replace:true});loadCase(c);return;}
  if(v==='hq'){go('hq',{replace:true});renderHq();return;}
  if(v==='my'){go('my',{replace:true});return;}
  go('find',{replace:true});
}
window.addEventListener('popstate',routeFromUrl);

/* ═══════════ 진입 ═══════════ */
onAuthStateChanged(auth,async u=>{
  if(!u){location.href='./index.html';return;}
  me=u;
  try{
    if(u.email&&u.email.endsWith('@javia-admin.internal')){
      meData={role:'admin',name:'관리자'};
    }else{
      const d=await getDoc(doc(db,'users',u.uid));
      if(!d.exists()){location.href='./index.html';return;}
      meData=d.data();
    }
  }catch(err){
    $('exp-list').innerHTML='<div class="empty"><b>불러오지 못했습니다</b>잠시 후 다시 시도해 주세요.</div>';return;
  }
  if(!['inner_circle','admin'].includes(meData.role)){
    alert('이너서클 회원 전용 서비스입니다.');location.href='./index.html';return;
  }
  $('hd-me').textContent=(meData.name||'')+' 님';
  await loadFields();
  await loadExperts();
  await loadCases();
  routeFromUrl();
});

/* ═══════════ 분야·주제 ═══════════ */
async function loadFields(){
  try{
    const s=await getDocs(collection(db,'innerFields'));
    FIELDS=s.docs.map(d=>({id:d.id,...d.data()})).filter(f=>f.active!==false)
      .sort((a,b)=>(a.order||99)-(b.order||99));
  }catch(e){FIELDS=[];}
  renderSide();
}
const fname=id=>(FIELDS.find(f=>f.id===id)||{}).name||'';
const ecount=fid=>EXPERTS.filter(e=>!fid||e.field===fid).length;

function renderSide(){
  const w=$('side');
  w.innerHTML='<div class="h">분야</div>'
    +'<a class="'+(curField?'':'on')+'" data-f="">전체 <em>'+ecount('')+'</em></a>'
    +FIELDS.map(f=>'<a class="'+(curField===f.id?'on':'')+'" data-f="'+esc(f.id)+'">'
      +esc(f.name)+' <em>'+ecount(f.id)+'</em></a>').join('')
    +'<div class="div"></div><a class="hq" data-hq="1">어느 분야인지 모르겠어요</a>';
  w.querySelectorAll('a').forEach(el=>el.onclick=()=>{
    if(el.dataset.hq){go('hq');renderHq();return;}
    curField=el.dataset.f;curTopic='';renderSide();renderTps();renderExperts();
  });
  renderTps();
}
function renderTps(){
  const w=$('tps'), f=FIELDS.find(x=>x.id===curField);
  if(!f||!(f.topics||[]).length){w.innerHTML='';return;}
  const tp=(f.topics||[]).slice().sort((a,b)=>(a.order||99)-(b.order||99));
  w.innerHTML=tp.map(t=>'<span class="'+(curTopic===t.name?'on':'')+'" data-t="'+esc(t.name)+'">'+esc(t.name)+'</span>').join('');
  w.querySelectorAll('span').forEach(el=>el.onclick=()=>{
    curTopic=(curTopic===el.dataset.t)?'':el.dataset.t;renderTps();renderExperts();
  });
}

/* ═══════════ 전문가 목록 ═══════════ */
async function loadExperts(){
  try{
    const s=await getDocs(collection(db,'innerExperts'));
    EXPERTS=s.docs.map(d=>({id:d.id,...d.data()})).filter(e=>e.active!==false)
      .sort((a,b)=>(a.order||99)-(b.order||99));
  }catch(e){EXPERTS=[];}
  renderSide();renderExperts();
}
const avEl=(e,lg)=>{
  const c='av'+(lg?' lg':'');
  return e.photoUrl
    ?'<div class="'+c+'" style="background-image:url('+esc(e.photoUrl)+')"></div>'
    :'<div class="'+c+'">'+esc((e.name||'?').charAt(0))+'</div>';
};

function renderExperts(){
  const kw=($('q').value||'').trim().toLowerCase();
  $('q-clr').style.display=kw?'':'none';
  let list=EXPERTS.filter(e=>{
    if(curField&&e.field!==curField)return false;
    if(curTopic&&!(e.subTopics||[]).includes(curTopic))return false;
    if(!kw)return true;
    return [e.name,e.title,e.org,e.region,fname(e.field),
      (e.subTopics||[]).join(' '),(e.tags||[]).join(' ')].join(' ').toLowerCase().includes(kw);
  });
  const rank={available:0,busy:1,off:2};
  list.sort((a,b)=>(rank[a.status||'available']-rank[b.status||'available'])||((a.order||99)-(b.order||99)));

  $('exp-hd').textContent=curTopic?(curTopic+' 상담 가능'):(curField?fname(curField):'전체 전문가');
  const w=$('exp-list');
  if(!EXPERTS.length){
    $('exp-n').textContent='';
    w.innerHTML='<div class="empty"><b>등록된 전문가가 없습니다</b>준비가 끝나는 대로 안내드리겠습니다.</div>';return;
  }
  if(!list.length){
    $('exp-n').textContent='';
    w.innerHTML='<div class="empty"><b>찾으시는 전문가가 없습니다</b>'
      +'다른 말로 검색해 보시거나, 본사에 문의해 주세요.'
      +'<div style="margin-top:20px"><button class="btn sec sm" id="e-hq">본사에 문의하기</button></div></div>';
    const b=$('e-hq');if(b)b.onclick=()=>{go('hq');renderHq();};
    return;
  }
  $('exp-n').textContent=list.length+'명';
  w.innerHTML='<div class="grid">'+list.map(e=>{
    const st=ST[e.status||'available']||ST.available;
    return '<div class="ec" style="'+(e.status==='off'?'opacity:.62':'')+'" data-id="'+esc(e.id)+'">'
      +'<div class="top">'+avEl(e)+'<div style="min-width:0">'
      +'<div class="nm">'+esc(e.name)+'<span>'+esc(e.title||'')+'</span></div>'
      +(e.org?'<div class="org">'+esc(e.org)+'</div>':'')
      +'</div></div>'
      +'<div class="tp">'+((e.subTopics||[]).map(esc).join(' · ')||esc(fname(e.field)))+'</div>'
      +'<div class="ft"><span class="mt">'+[esc(e.region||''),esc(e.method||'')].filter(Boolean).join(' · ')
      +'</span><span class="st '+st[1]+'">'+st[0]+'</span></div></div>';
  }).join('')+'</div>';
  w.querySelectorAll('.ec').forEach(el=>el.onclick=()=>{
    curExpertId=el.dataset.id;go('expert',{e:curExpertId});renderExpert();
  });
}

async function loadExpertCases(eid){
  const w=$('ecase');if(!w)return;
  let rows=[];
  try{
    const s=await getDocs(query(collection(db,'innerCaseIndex'),where('expertId','==',eid)));
    rows=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>_ms(b.createdAt)-_ms(a.createdAt)).slice(0,20);
  }catch(e){
    w.innerHTML='<div class="empty" style="padding:26px">접수 현황을 불러오지 못했습니다.</div>';return;
  }
  if(!rows.length){w.innerHTML='<div class="empty" style="padding:30px">아직 접수된 상담이 없습니다.</div>';return;}
  const mine=new Set(CASES.map(c=>c.id));
  w.innerHTML='<div class="list">'+rows.map(r=>{
    const st=CST[r.status]||CST.received;
    const own=mine.has(r.id);
    return '<div class="li'+(own?' mine':'')+'"'+(own?' data-cid="'+esc(r.id)+'"':'')+'>'
      +'<div class="t1"><span>'+esc(fname(r.field)||r.field||'')+' · '+esc(r.topic||'')
      +(own?'<span class="own">내 상담</span>':'')+'</span>'
      +'<span class="st '+st[1]+'">'+st[0]+'</span></div>'
      +'<div class="t2">'+_md(r.createdAt)+' 접수</div></div>';
  }).join('')+'</div>';
  w.querySelectorAll('[data-cid]').forEach(el=>el.onclick=()=>{
    curCaseId=el.dataset.cid;go('case',{c:curCaseId});loadCase(curCaseId);
  });
}

/* ═══════════ 상담 신청 ═══════════ */
function renderApply(){
  const e=EXPERTS.find(x=>x.id===curExpertId);
  const w=$('ap-body');
  if(!e){w.innerHTML='<div class="empty"><b>전문가를 찾을 수 없습니다</b></div>';return;}
  /* 상담 주제는 회원이 고른다. 전문가의 '상담 가능 주제'는 프로필 표시·검색용일 뿐
     회원의 선택지를 좁히지 않는다 — 그 분야의 주제 전체를 보여준다. */
  const f=FIELDS.find(x=>x.id===e.field);
  const topics=((f&&f.topics)||[]).slice().sort((a,b)=>(a.order||99)-(b.order||99)).map(t=>t&&t.name).filter(Boolean);

  w.innerHTML='<div class="dcard">'
    +'<div style="display:flex;gap:13px;align-items:center;padding-bottom:18px;margin-bottom:20px;'
    +'border-bottom:1px solid var(--line-2)">'+avEl(e)
    +'<div><div style="font-size:15.5px;font-weight:700;letter-spacing:-.02em">'+esc(e.name)
    +'<span style="font-size:12.5px;font-weight:400;color:var(--gray);margin-left:5px">'+esc(e.title||'')+'</span></div>'
    +'<div style="font-size:12px;color:var(--gray-l);margin-top:2px">'+esc(fname(e.field))+'</div></div></div>'

    +'<div class="fld"><label>고객 기업 · 고객명 <i>*</i></label>'
    +'<input id="ap-company" placeholder="A제조 주식회사"></div>'

    +'<div class="fld"><label>상담 주제 <i>*</i></label>'
    +'<select id="ap-topic"><option value="">선택하세요</option>'
    +topics.map(n=>'<option value="'+esc(n)+'">'+esc(n)+'</option>').join('')+'</select></div>'

    +'<div class="fld"><label>어떤 상황인가요 <i>*</i></label>'
    +'<textarea id="ap-problem" placeholder="편하게 말하듯 적으셔도 됩니다"></textarea>'
    +'<div class="hint">부족한 내용은 전문가가 통화로 확인합니다</div></div>'

    +'<div class="fld"><label>업종 <em>선택</em></label><input id="ap-industry" placeholder="기계부품 제조"></div>'

    +'<div class="fld"><label>희망 시기 <em>선택</em></label>'
    +'<div class="tps" id="ap-urg" style="margin:0">'
    +['보통','이번 주 안에','급함'].map((u,i)=>'<span class="'+(i===0?'on':'')+'" data-u="'+u+'">'+u+'</span>').join('')
    +'</div></div>'

    +'<div class="notice">신청하시면 전문가에게 <b>회원님 성함과 연락처</b>가 전달됩니다. '
    +'고객 기업명과 대표자명은 전달되지 않습니다.</div>'

    +'<div class="body-cta"><button class="btn" id="ap-go">상담 신청하기</button></div></div>';

  const ug=$('ap-urg');
  ug.querySelectorAll('span').forEach(el=>el.onclick=()=>{
    ug.querySelectorAll('span').forEach(x=>x.classList.remove('on'));el.classList.add('on');
  });
  $('ap-go').onclick=submitApply;
  setCta('<button class="btn" id="ap-go-fix">상담 신청하기</button>');
  const fx=$('ap-go-fix');if(fx)fx.onclick=submitApply;
}
async function submitApply(){
  const company=($('ap-company').value||'').trim();
  const topic=$('ap-topic').value;
  const problem=($('ap-problem').value||'').trim();
  if(!company)return toast('고객 기업·고객명을 입력해 주세요');
  if(!topic)return toast('상담 주제를 선택해 주세요');
  if(!problem)return toast('상황을 적어 주세요');
  const urg=(document.querySelector('#ap-urg span.on')||{}).dataset;
  const btns=[$('ap-go'),$('ap-go-fix')].filter(Boolean);
  btns.forEach(b=>{b.disabled=true;b.textContent='신청 중';});
  try{
    const r=await call('icCreateConsult',{
      expertId:curExpertId, topic, company, problem,
      industry:($('ap-industry').value||'').trim(),
      urgency:(urg&&urg.u)||'보통'
    });
    if(!r.success){toast(r.error||'신청에 실패했습니다');return;}
    await loadCases();
    alert('상담 신청이 접수되었습니다.\n\n'+(r.no||'')+'\n\n전문가가 직접 연락드립니다.\n통화 후 진행 상황을 남겨 주세요.');
    curCaseId=r.caseId;go('case',{c:r.caseId,replace:true});loadCase(r.caseId);
  }catch(e){
    toast('신청 중 오류가 발생했습니다');
  }finally{
    btns.forEach(b=>{b.disabled=false;b.textContent='상담 신청하기';});
  }
}

/* ═══════════ 내 상담 현황 ═══════════ */
const isRun=c=>['received','ongoing'].includes(c.status);

async function loadCases(){
  try{
    const s=await getDocs(query(collection(db,'innerConsults'),where('fcUid','==',me.uid)));
    CASES=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>_ms(b.createdAt)-_ms(a.createdAt));
  }catch(e){CASES=[];}
  const run=CASES.filter(isRun).length;
  ['d-bdg','m-bdg'].forEach(id=>{
    const b=$(id);if(!b)return;
    if(run){b.textContent=run;b.style.display='';}else{b.style.display='none';}
  });
  renderMyFilter();renderCases();
}

function renderMyFilter(){
  const n=k=>CASES.filter(c=>k==='all'?true:(k==='run'?isRun(c):!isRun(c))).length;
  $('my-n').textContent='전체 '+n('all')+' · 진행중 '+n('run')+' · 완료 '+n('end');
  $('my-filter').innerHTML=[['all','전체'],['run','진행중'],['end','완료']]
    .map(function(x){return '<span class="'+(curMyFilter===x[0]?'on':'')+'" data-k="'+x[0]+'">'
      +x[1]+' '+n(x[0])+'</span>';}).join('');
  $('my-filter').querySelectorAll('span').forEach(el=>el.onclick=()=>{
    curMyFilter=el.dataset.k;renderMyFilter();renderCases();
  });
}

function renderCases(){
  const w=$('my-list'), al=$('my-alert');
  if(!CASES.length){
    al.innerHTML='';$('my-filter').innerHTML='';
    w.innerHTML='<div class="empty"><b>아직 신청한 상담이 없습니다</b>전문가를 찾아 상담을 신청해 보세요.'
      +'<div style="margin-top:20px"><button class="btn sec sm" id="m-find">전문가 찾기</button></div></div>';
    const b=$('m-find');if(b)b.onclick=()=>go('find');
    return;
  }
  const stale=CASES.filter(c=>isRun(c)&&_days(c.updatedAt||c.createdAt)>=7);
  al.innerHTML=stale.length
    ?'<div class="bnr"><span class="di">&#9670;</span><span><b>'+stale.length+'건</b>이 '
      +'일주일 넘게 업데이트가 없습니다. 진행 상황을 남겨 주세요.</span></div>':'';

  const list=CASES.filter(c=>curMyFilter==='all'?true:(curMyFilter==='run'?isRun(c):!isRun(c)));
  if(!list.length){w.innerHTML='<div class="empty">해당하는 상담이 없습니다.</div>';return;}

  w.innerHTML='<div class="dcard" style="padding:22px 12px"><div class="tblw"><table class="tbl"><thead><tr>'
    +'<th style="width:44px">No</th><th style="width:150px">주제</th><th style="width:104px">고객</th>'
    +'<th style="width:134px">전문가</th><th style="width:84px">상태</th>'
    +'<th style="width:84px">접수일</th><th style="width:66px">경과</th><th>최근 진행</th>'
    +'</tr></thead><tbody>'
    +list.map(function(c,i){
      const st=CST[c.status]||CST.received;
      const dy=isRun(c)?_days(c.updatedAt||c.createdAt):null;
      const late=dy!==null&&dy>=7;
      return '<tr data-cid="'+esc(c.id)+'"><td class="no">'+(list.length-i)+'</td>'
        +'<td class="sb">'+esc(c.topic||'-')+'</td>'
        +'<td class="mu">'+esc(c.company||c.clientName||'-')+'</td>'
        +'<td class="mu">'+esc(c.expertName||'배정 대기')+'</td>'
        +'<td><span class="st '+st[1]+'">'+st[0]+'</span></td>'
        +'<td class="mu">'+_md(c.createdAt)+'</td>'
        +'<td'+(late?' style="color:var(--danger);font-weight:700"':' class="mu"')+'>'
        +(dy===null?'—':dy+'일')+'</td>'
        +'<td'+(late?' style="color:var(--danger);font-weight:600"':' class="mu"')+'>'
        +esc(c.lastNote||(late?'기록이 필요합니다':'-'))+'</td></tr>';
    }).join('')+'</tbody></table></div></div>';
  w.querySelectorAll('[data-cid]').forEach(el=>el.onclick=()=>{
    curCaseId=el.dataset.cid;go('case',{c:curCaseId});loadCase(curCaseId);
  });
}

/* ═══════════ 케이스 상세 ═══════════ */
async function loadCase(cid){
  const w=$('cs-body');
  w.innerHTML='<div class="load">불러오는 중</div>';
  let c=null,tl=[],fl=[];
  try{
    const d=await getDoc(doc(db,'innerConsults',cid));
    if(!d.exists()){w.innerHTML='<div class="empty"><b>상담을 찾을 수 없습니다</b>목록에서 다시 선택해 주세요.</div>';return;}
    c={id:d.id,...d.data()};
  }catch(e){
    w.innerHTML='<div class="empty"><b>열람 권한이 없습니다</b>본인이 신청한 상담만 확인하실 수 있습니다.</div>';return;
  }
  try{
    const s=await getDocs(collection(db,'innerConsults',cid,'timeline'));
    tl=s.docs.map(x=>x.data()).sort((a,b)=>_ms(b.createdAt)-_ms(a.createdAt));
  }catch(_){}
  try{
    const s2=await getDocs(collection(db,'innerConsults',cid,'files'));
    fl=s2.docs.map(x=>x.data());
  }catch(_){}

  const st=CST[c.status]||CST.received;
  w.innerHTML='<div class="dcard">'
    +'<div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start">'
    +'<div><div style="font-size:19px;font-weight:700;letter-spacing:-.03em">'
    +esc(c.company||c.clientName||'-')+'</div>'
    +'<div style="font-size:13px;color:var(--gray);margin-top:4px">'
    +[esc(fname(c.field)),esc(c.topic||''),esc(c.expertName||'배정 대기')].filter(Boolean).join(' · ')+'</div>'
    +(c.no?'<div style="font-size:11px;color:var(--gray-l);margin-top:6px">'+esc(c.no)+'</div>':'')
    +'</div><span class="st '+st[1]+'">'+st[0]+'</span></div>'

    +(c.problem?'<div style="margin-top:20px"><div class="lbl">상담 내용</div>'
      +'<div style="font-size:13.5px;line-height:1.95;white-space:pre-line;color:#2E3644">'
      +esc(c.problem)+'</div></div>':'')

    +(c.paid==='yes'&&c.amount?'<div style="margin-top:20px"><div class="lbl">계약</div>'
      +'<div class="kv"><div class="r"><b>컨설팅</b><span>'+esc(c.consultType||'-')+'</span></div>'
      +'<div class="r"><b>계약금액</b><span style="font-weight:700">'+_won(c.amount)+'원</span></div>'
      +((c.shareRate&&c.shareRate.fc)?'<div class="r"><b>내 배분</b><span>'
        +_won(Math.round(c.amount*c.shareRate.fc/100))+'원 ('+c.shareRate.fc+'%)</span></div>':'')
      +'</div></div>':'')

    +(fl.length?'<div style="margin-top:20px"><div class="lbl">첨부 자료</div>'
      +fl.map(function(f){
        const left=f.deleteAt?Math.max(0,Math.ceil((_ms(f.deleteAt)-Date.now())/86400000)):null;
        return '<div class="fileb"><span>'+esc(f.name||'파일')+'</span>'
          +(left!==null?'<span class="exp">D-'+left+'</span>':'')+'</div>';
      }).join('')
      +'<p style="font-size:11.5px;color:var(--gray-l);margin-top:8px">자료는 보관 기한이 지나면 자동 삭제됩니다</p></div>':'')
    +'</div>'

    +'<div class="dcard"><div class="lbl">진행 기록</div>'
    +(tl.length
      ?'<div class="tl">'+tl.map(function(ev){
        return '<div class="ev'+(ev.actorRole==='system'?' sys':'')+'">'
          +'<div class="dt">'+_dt(ev.createdAt)+'</div>'
          +(ev.actorRole==='system'?''
            :'<div class="who">'+esc(ev.actorRole==='fc'?'나':(ev.actorName||ROLE[ev.actorRole]||''))+'</div>')
          +'<div class="tx"'+(ev.actorRole==='system'?' style="color:var(--gray)"':'')+'>'
          +esc(ev.text||'')+'</div></div>';}).join('')+'</div>'
      :'<div class="empty" style="padding:30px">아직 기록이 없습니다.</div>')
    +(['done_confirmed','closed'].includes(c.status)
      ?'<div style="margin-top:20px;padding-top:20px;border-top:1px solid var(--line-2);'
       +'font-size:12.5px;color:var(--gray-l);text-align:center">종료된 상담입니다</div>'
      :'<div style="margin-top:20px;padding-top:20px;border-top:1px solid var(--line-2)">'
       +'<div class="lbl">진행 상황 남기기</div>'
       +'<div style="font-size:12px;color:var(--gray);margin-bottom:7px">전문가와 통화하셨나요</div>'
       +'<div class="tps" id="cs-call">'
       +['통화 완료','연결 안 됨','일정 잡음'].map(function(u){
           return '<span data-v="'+u+'">'+u+'</span>';}).join('')+'</div>'
       +'<div style="font-size:12px;color:var(--gray);margin:12px 0 7px">다음 단계는</div>'
       +'<div class="tps" id="cs-next">'
       +['자료 준비','고객 미팅','검토 대기','종결'].map(function(u){
           return '<span data-v="'+u+'">'+u+'</span>';}).join('')+'</div>'
       +'<div class="fld" style="margin:12px 0 14px"><textarea id="cs-memo" '
       +'placeholder="메모 (선택)" style="min-height:80px"></textarea></div>'
       +'<button class="btn" id="cs-save">기록 남기기</button></div>')
    +'</div>';

  if(!['done_confirmed','closed'].includes(c.status)){
    ['cs-call','cs-next'].forEach(function(id){
      const g=$(id);if(!g)return;
      g.querySelectorAll('span').forEach(el=>el.onclick=()=>{
        const was=el.classList.contains('on');
        g.querySelectorAll('span').forEach(x=>x.classList.remove('on'));
        if(!was)el.classList.add('on');
      });
    });
    $('cs-save').onclick=()=>saveNote(cid);
  }
}

async function saveNote(cid){
  const pick=id=>{const el=document.querySelector('#'+id+' span.on');return el?el.dataset.v:'';};
  const callResult=pick('cs-call'), nextStep=pick('cs-next');
  const memo=($('cs-memo').value||'').trim();
  if(!callResult&&!nextStep&&!memo)return toast('남길 내용을 선택해 주세요');
  const b=$('cs-save');b.disabled=true;b.textContent='저장 중';
  try{
    const r=await call('icAddTimeline',{caseId:cid,callResult,nextStep,memo});
    if(!r.success){toast(r.error||'저장에 실패했습니다');return;}
    toast('기록을 남겼습니다');
    await loadCases();
    loadCase(cid);
  }catch(e){
    toast('저장 중 오류가 발생했습니다');
  }finally{
    if($('cs-save')){b.disabled=false;b.textContent='기록 남기기';}
  }
}

/* ═══════════ 본사 문의 ═══════════
   전문가를 고르지 못한 경우의 창구. 담당자가 이 내용만 보고 전문가를 선정해
   사전 협의까지 해야 하므로, 전문가 지목 신청보다 항목이 많다.
   필수는 고객 구분·이름·상황 셋. 나머지는 담당자가 통화로 확인한다.        */
let hqType='corp';

function renderHq(){
  $('hq-body').innerHTML='<div class="dcard">'
    +'<div style="font-size:19px;font-weight:700;letter-spacing:-.03em;line-height:1.45">'
    +'어떤 전문가가 필요한지<br>본사가 확인해 드립니다</div>'
    +'<div style="font-size:13.5px;color:var(--gray);margin-top:12px;line-height:1.85">'
    +'담당자가 내용을 검토해 적합한 전문가를 찾고, 사전 협의를 거쳐 연결해 드립니다. '
    +'보통 1영업일 안에 회신합니다.</div></div>'

    +'<div class="dcard">'
    +'<div class="fld"><label>어떤 고객인가요 <i>*</i></label>'
    +'<div class="tps" id="hq-type" style="margin:0">'
    +'<span class="on" data-t="corp">법인</span><span data-t="person">개인</span></div></div>'
    +'<div id="hq-fields"></div>'

    +'<div class="fld"><label>어떤 상황인가요 <i>*</i></label>'
    +'<textarea id="hq-problem" placeholder="판단이 어려운 부분을 그대로 적어 주세요"></textarea></div>'
    +'<div class="fld"><label>고객이 원하는 것 <em>선택</em></label>'
    +'<textarea id="hq-wants" style="min-height:76px"></textarea></div>'
    +'<div class="fld"><label>이미 진행한 것이 있나요 <em>선택</em></label>'
    +'<textarea id="hq-prior" style="min-height:76px"></textarea></div>'
    +'<div class="fld"><label>희망 시기 <em>선택</em></label>'
    +'<input id="hq-when" placeholder="이번 달 안"></div>'
    +'<div class="fld"><label>긴급도 <em>선택</em></label>'
    +'<div class="tps" id="hq-urg" style="margin:0">'
    +['보통','이번 주 안에','급함'].map(function(u,i){
        return '<span class="'+(i===0?'on':'')+'" data-u="'+u+'">'+u+'</span>';}).join('')
    +'</div></div>'

    +'<div class="notice">담당자가 확인 후 <b>직접 연락</b>드립니다. '
    +'자료가 필요하면 그때 요청드리겠습니다.</div>'
    +'<div class="body-cta"><button class="btn" id="hq-go">문의 남기기</button></div></div>'

    +'<div class="dcard"><div class="empty" style="padding:26px 16px">'
    +'급하신 건은 담당자에게 직접 연락 주십시오.'
    +'<div style="margin-top:16px"><a href="tel:010-5244-1467" '
    +'style="color:var(--navy);font-weight:700;font-size:16px;text-decoration:none;letter-spacing:-.02em">'
    +'박신제 본부장 010-5244-1467</a></div></div></div>';

  const tg=$('hq-type');
  tg.querySelectorAll('span').forEach(el=>el.onclick=()=>{
    tg.querySelectorAll('span').forEach(x=>x.classList.remove('on'));
    el.classList.add('on');hqType=el.dataset.t;renderHqFields();
  });
  const ug=$('hq-urg');
  ug.querySelectorAll('span').forEach(el=>el.onclick=()=>{
    ug.querySelectorAll('span').forEach(x=>x.classList.remove('on'));el.classList.add('on');
  });
  renderHqFields();
  $('hq-go').onclick=submitHq;
  setCta('<button class="btn" id="hq-go-fix">문의 남기기</button>');
  const fx=$('hq-go-fix');if(fx)fx.onclick=submitHq;
}

function renderHqFields(){
  const w=$('hq-fields');if(!w)return;
  const F=(id,lb,ph,req)=>'<div class="fld"><label>'+lb+(req?' <i>*</i>':' <em>선택</em>')
    +'</label><input id="'+id+'" placeholder="'+(ph||'')+'"></div>';
  if(hqType==='corp'){
    w.innerHTML=F('hq-company','기업명','G정밀 주식회사',1)
      +F('hq-industry','업종','기계부품 제조')
      +F('hq-revenue','연매출','약 45억')
      +F('hq-employees','임직원','28명')
      +F('hq-ceo','대표자','정재훈')
      +F('hq-ceoage','대표자 연령','58')
      +F('hq-region','소재지','인천 남동구')
      +F('hq-share','지분 구조','대표 60 · 형 25 · 배우자 15');
  }else{
    w.innerHTML=F('hq-clientname','고객명','정○○',1)
      +F('hq-clientage','연령','64')
      +F('hq-job','직업 · 소득원','임대업')
      +F('hq-residence','거주지','경기 성남')
      +F('hq-family','가족 관계','배우자, 자녀 2명')
      +F('hq-assets','주요 자산','상가 2건, 아파트 1채');
  }
}

async function submitHq(){
  const V=id=>{const el=$(id);return el?(el.value||'').trim():'';};
  const problem=V('hq-problem');
  const name=hqType==='corp'?V('hq-company'):V('hq-clientname');
  if(!name)return toast((hqType==='corp'?'기업명':'고객명')+'을 입력해 주세요');
  if(!problem)return toast('상황을 적어 주세요');
  const urg=(document.querySelector('#hq-urg span.on')||{}).dataset;
  const p={
    clientType:hqType, problem,
    clientWants:V('hq-wants'), priorHistory:V('hq-prior'),
    desiredTime:V('hq-when'), urgency:(urg&&urg.u)||'보통'
  };
  if(hqType==='corp'){
    Object.assign(p,{company:name,industry:V('hq-industry'),revenue:V('hq-revenue'),
      employees:V('hq-employees'),ceo:V('hq-ceo'),ceoAge:V('hq-ceoage'),
      region:V('hq-region'),shareStructure:V('hq-share')});
  }else{
    Object.assign(p,{clientName:name,clientAge:V('hq-clientage'),job:V('hq-job'),
      residence:V('hq-residence'),family:V('hq-family'),assets:V('hq-assets')});
  }
  const btns=[$('hq-go'),$('hq-go-fix')].filter(Boolean);
  btns.forEach(b=>{b.disabled=true;b.textContent='접수 중';});
  try{
    const r=await call('icCreateHqInquiry',p);
    if(!r.success){toast(r.error||'접수에 실패했습니다');return;}
    await loadCases();
    alert('문의가 접수되었습니다.\n\n'+(r.no||'')+'\n\n담당자가 확인 후 직접 연락드립니다.');
    go('my');
  }catch(e){
    toast('접수 중 오류가 발생했습니다');
  }finally{
    btns.forEach(b=>{b.disabled=false;b.textContent='문의 남기기';});
  }
}

/* ═══════════ 이벤트 ═══════════ */
$('q').oninput=renderExperts;
$('q-clr').onclick=()=>{$('q').value='';renderExperts();};
$('hd-out').onclick=()=>{location.href='./index.html';};
$('hd-bk').onclick=()=>history.back();
document.querySelectorAll('#mnav button,#dnav button').forEach(b=>b.onclick=()=>{
  const v=b.dataset.v;
  /* go() 가 setCta(null) 로 하단 고정 버튼을 비우므로 render 는 반드시 go 다음에 부른다.
     순서를 뒤집으면 모바일에서 「문의 남기기」 버튼이 사라진다. */
  go(v);
  if(v==='hq')renderHq();
});
