<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>수료증 · JARVIA</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:#F0F3F7;color:#1B2A41;padding:24px 16px 60px}
.wrap{max-width:900px;margin:0 auto}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.bar h1{font-size:19px;font-weight:700;margin-right:auto}
button{font-family:inherit;font-size:14px;font-weight:600;border:0;border-radius:8px;padding:10px 18px;cursor:pointer}
.btn{background:#1B3A5C;color:#fff}.btn:hover{background:#2E5580}
.btn-sec{background:#fff;color:#1B3A5C;border:1px solid #CBD5E1}
.btn:disabled,.btn-sec:disabled{opacity:.5;cursor:default}
.card{background:#fff;border:1px solid #E2E8F0;border-radius:12px;padding:22px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
label{font-size:13px;color:#5B6B82;font-weight:600}
select,input{font-family:inherit;font-size:14px;padding:9px 12px;border:1px solid #CBD5E1;border-radius:8px;background:#fff}
.msg{font-size:14px;color:#5B6B82;padding:10px 0}
.err{color:#C0392B}
.tbl{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}
.tbl th,.tbl td{border-bottom:1px solid #EDF1F5;padding:9px 6px;text-align:left}
.tbl th{color:#5B6B82;font-weight:600;font-size:13px}
/* ── 수료증 본문 (A4 세로) ── */
#sheet{width:794px;min-height:1123px;margin:0 auto;background:#fff;padding:78px 76px 64px;position:relative;
 border:1px solid #E2E8F0;box-shadow:0 10px 30px rgba(0,0,0,.08)}
#sheet .edge{position:absolute;left:26px;right:26px;top:26px;height:1071px;border:2px solid #1B3A5C;pointer-events:none}
#sheet .edge:before{content:'';position:absolute;inset:6px;border:1px solid #C9A24A}
.doc-no{position:relative;text-align:right;font-size:12px;color:#5B6B82;letter-spacing:.02em}
.doc-t{position:relative;text-align:center;font-size:44px;font-weight:800;letter-spacing:.34em;margin:54px 0 10px;color:#12243A}
.doc-sub{position:relative;text-align:center;font-size:13px;color:#7C8CA5;letter-spacing:.24em;margin-bottom:44px}
.doc-info{position:relative;width:100%;font-size:15px;line-height:2.1;margin:0 auto 34px;max-width:520px}
.doc-info div{display:flex;gap:14px}
.doc-info span{width:86px;color:#5B6B82}
.doc-info b{font-weight:700}
.doc-body{position:relative;font-size:15.5px;line-height:2;text-align:center;margin:26px 0 30px;color:#22344B}
.doc-period{position:relative;text-align:center;font-size:14px;color:#5B6B82;margin-bottom:26px}
.doc-list{position:relative;border-top:1px solid #DBE3EC;padding-top:16px;margin-bottom:26px}
.doc-list h3{font-size:12px;color:#7C8CA5;letter-spacing:.14em;margin-bottom:10px}
.doc-list .li{display:flex;gap:12px;font-size:13.5px;line-height:1.9;padding:3px 0}
.doc-list .li i{font-style:normal;color:#C9A24A;font-weight:700;flex:0 0 auto}
.doc-list .li em{font-style:normal;color:#7C8CA5;margin-left:auto;flex:0 0 auto;font-size:12.5px}
.doc-foot{position:relative;margin-top:36px;text-align:center}
.doc-date{font-size:15px;letter-spacing:.06em;margin-bottom:22px}
.doc-org{display:inline-flex;align-items:center;position:relative;font-size:21px;font-weight:800;letter-spacing:.04em}
.doc-org img{position:absolute;right:-46px;top:50%;transform:translateY(-50%);width:78px;height:78px;opacity:.88}
.doc-qr{position:absolute;right:76px;bottom:64px;text-align:center}
.doc-qr canvas,.doc-qr img{width:78px;height:78px}
.doc-qr p{font-size:10px;color:#7C8CA5;margin-top:5px;line-height:1.5}
@media print{
  body{background:#fff;padding:0}
  .bar,.card.setup{display:none!important}
  #sheet{width:auto;min-height:auto;box-shadow:none;border:0;margin:0}
  @page{size:A4;margin:0}
}
@media (max-width:860px){ #sheet{width:100%;padding:44px 26px} .doc-t{font-size:32px} }
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <h1>수료증</h1>
    <button class="btn-sec" onclick="location.href='./index.html'">자비아로</button>
    <button class="btn-sec" id="btn-print" style="display:none" onclick="window.print()">인쇄</button>
    <button class="btn" id="btn-pdf" style="display:none" onclick="savePdf()">PDF 다운로드</button>
  </div>

  <!-- 발급 화면 -->
  <div class="card setup" id="setup">
    <div id="setup-msg" class="msg">불러오는 중...</div>
    <div id="setup-form" style="display:none">
      <div class="row">
        <label>발급 기간</label>
        <select id="f-from"></select>
        <span>~</span>
        <select id="f-to"></select>
        <button class="btn-sec" onclick="doPreview()">미리보기</button>
      </div>
      <div class="msg">기간은 월 단위로 선택하며, 지난달까지 발급할 수 있습니다. 이미 발급한 달은 자동으로 빠집니다.</div>
      <div id="pv" style="display:none;border-top:1px solid #EDF1F5;padding-top:14px;margin-top:6px">
        <div id="pv-body"></div>
        <div class="row" style="margin-top:16px">
          <label>본인 확인 · 생년월일 6자리</label>
          <input id="f-birth" inputmode="numeric" maxlength="6" placeholder="예: 750101" style="width:130px">
          <button class="btn" id="btn-issue" onclick="doIssue()">수료증 발급</button>
        </div>
        <div class="msg">입력하신 생년월일은 본인 확인에만 사용하며 저장하지 않습니다.</div>
      </div>
    </div>
    <div id="hist" style="display:none;border-top:1px solid #EDF1F5;margin-top:18px;padding-top:14px">
      <h3 style="font-size:14px;margin-bottom:6px">발급 이력</h3>
      <table class="tbl"><thead><tr><th>번호</th><th>기간</th><th>발급일</th><th>과정</th><th></th></tr></thead>
      <tbody id="hist-b"></tbody></table>
    </div>
  </div>

  <!-- 수료증 본문 -->
  <div id="sheet" style="display:none">
    <div class="edge"></div>
    <div class="doc-no" id="d-no"></div>
    <div class="doc-t">수 료 증</div>
    <div class="doc-sub">CERTIFICATE OF COMPLETION</div>
    <div class="doc-info">
      <div><span>성 명</span><b id="d-name"></b></div>
      <div><span>소 속</span><b id="d-comp"></b></div>
      <div><span>연 락 처</span><b id="d-phone"></b></div>
    </div>
    <div class="doc-body">
      위 사람은 당사가 운영하는 교육과정을<br>아래와 같이 성실히 이수하였기에 이 증서를 수여합니다.
    </div>
    <div class="doc-period" id="d-period"></div>
    <div class="doc-list">
      <h3>이수 내역</h3>
      <div id="d-items"></div>
    </div>
    <div class="doc-foot">
      <div class="doc-date" id="d-date"></div>
      <div class="doc-org">(주)한국FP센터<img id="d-seal" src="./assets/seal.png" alt=""></div>
    </div>
    <div class="doc-qr"><div id="d-qr"></div><p>학습 내역 확인</p></div>
  </div>
</div>

<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import{getAuth,onAuthStateChanged,setPersistence,browserLocalPersistence}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import{getFunctions,httpsCallable}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-functions.js';

const app=initializeApp({apiKey:"AIzaSyBD9p-bf162RiiD1Y3BsY-NvbYjpOSrzmg",authDomain:"jarvia-platform.firebaseapp.com",projectId:"jarvia-platform",storageBucket:"jarvia-platform.firebasestorage.app",messagingSenderId:"388025068900",appId:"1:388025068900:web:09ba8e12e9e9e2ec49de71"});
const auth=getAuth(app);
setPersistence(auth,browserLocalPersistence).catch(()=>{});
const fns=getFunctions(app,'asia-northeast3');
const callCert=httpsCallable(fns,'lmsCert');
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const VERIFY='https://jarvia.co.kr/cert-verify.html?no=';
const certNo=new URLSearchParams(location.search).get('no')||'';

onAuthStateChanged(auth,async u=>{
  if(!u){ $('setup-msg').innerHTML='로그인이 필요합니다. <a href="./index.html">자비아 로그인</a>'; return; }
  if(certNo){ await showCert(certNo); }
  else { await showSetup(); }
});

/* ── 발급 화면 ── */
async function showSetup(){
  try{
    const r=(await callCert({action:'months'})).data;
    if(!r.ok){ $('setup-msg').innerHTML='<span class="err">'+esc(r.error)+'</span>'; return; }
    const usable=r.months.filter(m=>!m.issued);
    if(!usable.length){
      $('setup-msg').textContent='발급할 수 있는 이수 내역이 없습니다. 강좌를 80% 이상 들으시면 그 달부터 발급할 수 있습니다.';
    }else{
      $('setup-msg').style.display='none';
      $('setup-form').style.display='';
      const opt=m=>'<option value="'+m.ym+'">'+esc(m.label)+'</option>';
      $('f-from').innerHTML=usable.map(opt).join('');
      $('f-to').innerHTML=usable.map(opt).join('');
      $('f-to').value=usable[usable.length-1].ym;
    }
    await loadHist();
  }catch(e){ $('setup-msg').innerHTML='<span class="err">불러오지 못했습니다. 잠시 후 다시 시도해 주세요.</span>'; }
}
async function loadHist(){
  try{
    const r=(await callCert({action:'list'})).data;
    if(!r.ok||!r.list.length)return;
    $('hist').style.display='';
    $('hist-b').innerHTML=r.list.map(c=>'<tr><td>'+esc(c.certNo)+'</td><td>'+ymT(c.from)+' ~ '+ymT(c.to)+'</td><td>'
      +dT(c.issuedAt)+'</td><td>'+(c.courseCount+c.dailyCount)+'건</td>'
      +'<td><button class="btn-sec" onclick="location.href=\'./cert.html?no='+encodeURIComponent(c.certNo)+'\'">보기</button></td></tr>').join('');
  }catch(_e){}
}
const ymT=v=>v?(+v.slice(0,4))+'.'+(+v.slice(4,6)):'';
const dT=v=>v?(+v.slice(0,4))+'.'+(+v.slice(4,6))+'.'+(+v.slice(6,8)):'';

window.doPreview=async function(){
  const from=$('f-from').value,to=$('f-to').value;
  if(from>to){alert('시작 월이 종료 월보다 늦습니다.');return;}
  $('pv').style.display='';
  $('pv-body').innerHTML='<div class="msg">확인 중...</div>';
  const r=(await callCert({action:'preview',from,to})).data;
  if(!r.ok){ $('pv-body').innerHTML='<div class="msg err">'+esc(r.error)+'</div>'; return; }
  let h='<div class="msg">아래 내용으로 발급됩니다. 총 <b>'+r.total+'건</b></div>';
  if(r.skipped.length) h+='<div class="msg">이미 발급된 달은 제외되었습니다 — '+r.skipped.map(ymT).join(', ')+'</div>';
  if(r.courses.length){
    h+='<table class="tbl"><thead><tr><th>과정</th><th style="width:110px">이수일</th></tr></thead><tbody>'
     +r.courses.map(c=>'<tr><td>'+esc(c.title)+'</td><td>'+dT(c.completedAt)+'</td></tr>').join('')+'</tbody></table>';
  }
  if(r.groups.length){
    h+='<table class="tbl" style="margin-top:10px"><thead><tr><th>정기 콘텐츠</th><th style="width:150px">이수</th></tr></thead><tbody>'
     +r.groups.map(g=>'<tr><td>'+esc(g.label)+'</td><td>'+esc(g.text)+'</td></tr>').join('')+'</tbody></table>';
  }
  $('pv-body').innerHTML=h;
};
window.doIssue=async function(){
  const birth6=($('f-birth').value||'').replace(/[^0-9]/g,'');
  if(birth6.length!==6){alert('생년월일 6자리를 입력해 주세요.');return;}
  const b=$('btn-issue'); b.disabled=true; b.textContent='발급 중...';
  const r=(await callCert({action:'issue',from:$('f-from').value,to:$('f-to').value,birth6})).data;
  b.disabled=false; b.textContent='수료증 발급';
  if(!r.ok){alert(r.error||'발급하지 못했습니다.');return;}
  location.href='./cert.html?no='+encodeURIComponent(r.certNo);
};

/* ── 수료증 출력 ── */
async function showCert(no){
  const r=(await callCert({action:'get',certNo:no})).data;
  if(!r.ok){ $('setup-msg').innerHTML='<span class="err">'+esc(r.error)+'</span>'; return; }
  const c=r.cert;
  $('setup').style.display='none';
  $('sheet').style.display='';
  $('btn-print').style.display=''; $('btn-pdf').style.display='';
  $('d-no').textContent='수료증 번호  '+c.certNo;
  $('d-name').textContent=c.name||'';
  $('d-comp').textContent=c.company||'';
  $('d-phone').textContent=c.phone||'';
  $('d-period').textContent='교육 기간  '+ymT(c.from)+' ~ '+ymT(c.to);
  $('d-date').textContent=dT(c.issuedAt);
  const items=[];
  (c.courses||[]).forEach(x=>items.push('<div class="li"><i>·</i><span>'+esc(x.title)+'</span><em>'+dT(x.completedAt)+'</em></div>'));
  (c.groups||[]).forEach(g=>items.push('<div class="li"><i>·</i><span>'+esc(g.label)+' — '+esc(g.text)+'<br><span style="color:#7C8CA5;font-size:12px">'+esc(g.dayText)+'</span></span></div>'));
  $('d-items').innerHTML=items.join('');
  try{ new QRCode($('d-qr'),{text:VERIFY+encodeURIComponent(c.certNo),width:78,height:78,correctLevel:QRCode.CorrectLevel.M}); }catch(_e){}
  document.title='수료증 '+c.certNo+' · JARVIA';
  window._certNo=c.certNo;
}
window.savePdf=function(){
  const el=$('sheet');
  html2pdf().set({
    margin:0, filename:'수료증_'+($('d-name').textContent||'')+'_'+(window._certNo||'')+'.pdf',
    image:{type:'jpeg',quality:0.98}, html2canvas:{scale:2,useCORS:true},
    jsPDF:{unit:'mm',format:'a4',orientation:'portrait'}, pagebreak:{mode:['css','legacy']}
  }).from(el).save();
};
</script>
</body>
</html>
