<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>자산관리 정보</title>
<style>
:root{--navy:#12263F;--navy-lt:#1B3A5C;--gold:#B8860B;--ink:#1F2733;--ink-sub:#5A6474;--ink-lt:#8B94A3;--line:#E4E8EF;--bg:#F4F6F9;--card:#FFFFFF;--warn-bg:#FFFBEB;--warn-bd:#F2E2B0;--font:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',-apple-system,sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px calc(40px + env(safe-area-inset-bottom))}
.fcbar{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:14px}
.fcavatar{width:44px;height:44px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0;overflow:hidden}
.fcavatar img{width:100%;height:100%;object-fit:cover}
.fcname{font-size:15px;font-weight:700;color:var(--ink)}
.fcrole{font-size:12px;color:var(--ink-sub);margin-top:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 18px}
.badge{display:inline-block;background:#EEF2F8;color:var(--navy-lt);font-size:11.5px;font-weight:700;border-radius:5px;padding:3px 9px;margin-right:6px}
.badge.type{background:#F5EFDD;color:#7C5C1A}
.title{font-size:18px;font-weight:700;line-height:1.45;color:var(--ink);margin:10px 0 14px}
.body{font-size:14.5px;line-height:1.8;color:#37404E;background:var(--warn-bg);border:1px solid var(--warn-bd);border-radius:10px;padding:14px 16px;margin-bottom:16px;white-space:pre-line}
.tbl-box{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:16px;background:#FAFBFD}
.tbl-title{font-size:12.5px;font-weight:700;color:var(--navy-lt);margin-bottom:8px}
.tbl-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:12px;min-width:280px}
th{background:var(--navy);color:#fff;font-weight:600;padding:7px 8px;text-align:center;white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:center;color:#37404E;white-space:nowrap}
tr:last-child td{border-bottom:none}
.tbl-src{font-size:11px;color:var(--ink-lt);margin-top:7px;text-align:right}
.btn{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;border-radius:10px;padding:13px;font-size:14px;font-weight:700;text-decoration:none;cursor:pointer;font-family:var(--font);border:none;margin-bottom:9px}
.btn.primary{background:var(--navy);color:#fff}
.btn.line{background:#fff;color:var(--navy-lt);border:1px solid #C7D2DE}
.disclaim{font-size:11px;line-height:1.65;color:var(--ink-lt);margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.foot{text-align:center;font-size:11px;color:var(--ink-lt);padding:22px 0 8px;line-height:1.7}
.state{text-align:center;padding:70px 20px;color:var(--ink-sub);font-size:14px;line-height:1.8}
.spin{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--navy);border-radius:50%;margin:0 auto 14px;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">
  <div id="app"><div class="state"><div class="spin"></div>자료를 불러오고 있습니다…</div></div>
  <div id="jvNotice" class="foot" style="display:none">이 페이지는 담당 컨설턴트의 고객 안내 목적에 한해 열람 여부가 기록됩니다.</div>
</div>

<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import{getFirestore,doc,getDoc}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const FC={apiKey:"AIzaSyBD9p-bf162RiiD1Y3BsY-NvbYjpOSrzmg",authDomain:"jarvia-platform.firebaseapp.com",projectId:"jarvia-platform",storageBucket:"jarvia-platform.firebasestorage.app",messagingSenderId:"388025068900",appId:"1:388025068900:web:09ba8e12e9e9e2ec49de71"};
const app=initializeApp(FC);
const db=getFirestore(app,'javia-db');

/* ═══ URL 파라미터 ═══ */
const params=new URLSearchParams(location.search);
const sigId=(params.get('id')||'').trim();
const fcId=(params.get('fc')||'').trim();

/* ═══ 고객 식별 토큰(c) — client-daily와 동일한 localStorage 맵 방식 ═══ */
let _jvCID='';
if(fcId){
  try{
    const _cParam=(params.get('c')||'').trim();
    let _cmap={};
    try{_cmap=JSON.parse(localStorage.getItem('jv_cid')||'{}')||{};}catch(_e){_cmap={};}
    if(/^[A-Za-z0-9_-]{1,40}$/.test(_cParam)){_cmap[fcId]=_cParam;localStorage.setItem('jv_cid',JSON.stringify(_cmap));}
    _jvCID=_cmap[fcId]||'';
  }catch(e){_jvCID='';}
}

/* ═══ 열람 비콘 — client-daily와 동일 엔드포인트, page:'signal' ═══ */
const JV_EP='https://asia-northeast3-jarvia-platform.cloudfunctions.net/logView';
let _jvQ=[],_jvVK=null,_jvNew=false;
if(fcId){
  try{
    _jvVK=localStorage.getItem('jv_vk');
    if(!_jvVK){_jvVK=Math.random().toString(36).slice(2)+Date.now().toString(36);localStorage.setItem('jv_vk',_jvVK);_jvNew=true;}
  }catch(e){_jvVK='na';}
}
function jvTrack(t,id){if(!fcId)return;_jvQ.push(id?{t:t,id:id}:{t:t});}
function jvFlush(){
  if(!fcId||!_jvQ.length)return;
  const ev=_jvQ.splice(0);
  try{navigator.sendBeacon(JV_EP,new Blob([JSON.stringify({fcLoginId:fcId,viewerKey:_jvVK,isNew:_jvNew,clientId:_jvCID||undefined,page:'signal',events:ev})],{type:'text/plain'}));}catch(e){}
}
window.addEventListener('pagehide',jvFlush);
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden')jvFlush();});
try{if(_jvCID){document.getElementById('jvNotice').style.display='block';}}catch(e){}

/* ═══ 헬퍼 ═══ */
const esc=s=>{const d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML;};
/* 고객 화면용 카테고리 라벨 (내부 카테고리명 그대로 노출하지 않음) */
const CAT_LABEL={rate:'금리 정보',policy:'제도 안내',dispute:'분쟁·판례 정보',stats:'건강 통계',tax:'세금 정보'};
/* [판례]/[예규] 등 유형 접두 태그 분리 */
function splitTypeTag(title){
  const m=String(title||'').match(/^\[([^\]]{1,10})\]\s*(.*)$/);
  return m?{tag:m[1],text:m[2]}:{tag:'',text:String(title||'')};
}

/* ═══ 렌더 ═══ */
function renderError(msg,sub){
  document.getElementById('app').innerHTML=
    '<div class="state">'+esc(msg)+(sub?'<br><span style="font-size:12.5px;color:var(--ink-lt)">'+esc(sub)+'</span>':'')+'</div>';
}
function render(s,fc){
  const fcName=(fc&&fc.name)?fc.name:'담당 컨설턴트';
  const fcTitle=(fc&&fc.title)?fc.title:'';
  const initial=fcName.slice(0,3);
  const avatar=(fc&&fc.photoUrl)
    ?'<img src="'+esc(fc.photoUrl)+'" alt="" onerror="this.parentNode.textContent=\''+esc(initial)+'\'">'
    :esc(initial);
  const tt=splitTypeTag(s.title);
  const cat=CAT_LABEL[s.category]||'안내 자료';

  /* 본문 = clientMessage (고객용 존댓말 멘트 — 생성 시점에 브랜드 무노출·전문가 확인 문구 보장) */
  const body=(s.clientMessage||'').trim();

  /* 근거 표 */
  let tbl='';
  const t=s.tableData;
  if(t&&Array.isArray(t.headers)&&Array.isArray(t.rows)&&t.headers.length&&t.rows.length){
    tbl='<div class="tbl-box"><div class="tbl-title">📊 '+esc(t.title||'상세 자료')+'</div>'
      +'<div class="tbl-scroll"><table><thead><tr>'
      +t.headers.map(h=>'<th>'+esc(h)+'</th>').join('')
      +'</tr></thead><tbody>'
      +t.rows.map(r=>'<tr>'+(r.cells||[]).map(c=>'<td>'+esc(c)+'</td>').join('')+'</tr>').join('')
      +'</tbody></table></div>'
      +'<div class="tbl-src">자료: '+esc(s.sourceName||'공공기관 공시')+'</div></div>';
  }

  /* 버튼: SMS 상담(전화번호 있을 때) + 원문 보기(생성 카드는 숨김 — index와 동일 규칙) */
  let btns='';
  if(fc&&fc.phone){
    const prefill='안녕하세요, \''+tt.text.slice(0,40)+'\' 자료 보고 연락드렸습니다.';
    btns+='<a class="btn primary" href="sms:'+esc(fc.phone)+'?body='+encodeURIComponent(prefill)+'">💬 '+esc(fcName)+' 컨설턴트에게 문의하기</a>';
  }
  if(s.sourceUrl&&!s.generated){
    btns+='<a class="btn line" href="'+esc(s.sourceUrl)+'" target="_blank" rel="noopener">🔎 관련 원문 보기</a>';
  }

  document.getElementById('app').innerHTML=
    '<div class="fcbar"><div class="fcavatar">'+avatar+'</div><div>'
      +'<div class="fcname">'+esc(fcName)+(fcTitle?' <span style="font-weight:500;color:var(--ink-sub);font-size:12px">'+esc(fcTitle)+'</span>':'')+'</div>'
      +'<div class="fcrole">보내드리는 자산관리 정보</div></div></div>'
    +'<div class="card">'
      +'<div><span class="badge">'+esc(cat)+'</span>'+(tt.tag?'<span class="badge type">'+esc(tt.tag)+'</span>':'')+'</div>'
      +'<div class="title">'+esc(tt.text)+'</div>'
      +(body?'<div class="body">'+esc(body)+'</div>':'')
      +tbl
      +btns
      +'<div class="disclaim">본 자료는 정보 제공 목적으로 안내되며, 특정 상품의 가입 권유가 아닙니다. 개별 상황에 대한 판단은 세무·법률 등 관련 전문가 확인이 필요합니다.</div>'
    +'</div>'
    +'<div class="foot">'+esc(fcName)+(fcTitle?' · '+esc(fcTitle):'')+'</div>';
  document.title=tt.text||'자산관리 정보';
}

/* ═══ 로딩 ═══ */
(async function(){
  if(!sigId){renderError('자료 주소가 올바르지 않습니다','담당 컨설턴트에게 링크를 다시 요청해 주세요.');return;}
  try{
    const[sigSnap,fcSnap]=await Promise.all([
      getDoc(doc(db,'biz_signals',sigId)),
      fcId?getDoc(doc(db,'consultants',fcId)):Promise.resolve(null),
    ]);
    if(!sigSnap.exists()){renderError('자료를 찾을 수 없습니다','내용이 갱신되었거나 삭제되었을 수 있습니다. 담당 컨설턴트에게 문의해 주세요.');return;}
    const fc=(fcSnap&&fcSnap.exists&&fcSnap.exists())?fcSnap.data():null;
    render(sigSnap.data(),fc);
    /* 열람 기록 — 서버 집계가 인식하는 card 유형, '자료·제목' 키 (고객활동·열람현황 표시용) */
    try{
      const _tt=splitTypeTag(sigSnap.data().title||'');
      jvTrack('card','자료·'+(_tt.text||sigId).slice(0,30));
      jvFlush();
    }catch(_e){}
  }catch(e){
    console.error(e);
    renderError('자료를 불러오지 못했습니다','네트워크 상태를 확인한 뒤 다시 열어주세요.');
  }
})();
</script>
</body>
</html>
