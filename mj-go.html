<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- ★ [2026-11-28] MyJai → 자비아 자동 로그인 (jarvia.co.kr/mj-go.html#c=열쇠&to=경로)
     Claude 의 MyJai 카드 「자비아에서 보기」가 여는 중간 화면. 1회용·2분 열쇠(jv_open_jarvia)를 mjLoginRedeem 으로 바꿔
     로그인한 뒤 원래 화면으로 넘어간다. 열쇠는 주소의 # 뒤에만 있어 서버 기록·다른 사이트로 넘어가지 않고, 읽자마자 주소에서 지운다.
     Firebase 설정·로그인 유지 방식은 myjai.html 과 같다(index.html 과 로그인 공유). 동시 로그인 기기 칸 규칙은 넘어간 화면(index.html)이 그대로 적용 -->
<title>자비아로 이동 중…</title>
<meta name="robots" content="noindex">
<style>
:root{--navy:#1B3A5C;--gold:#C9A96E;--gold2:#E9C47C;--ink:#16202C;--sub:#5A6484;--soft:#F3F5F9}
*{box-sizing:border-box}
html,body{margin:0;background:var(--soft);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;-webkit-text-size-adjust:100%}
.box{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.logo{font-size:22px;font-weight:800;color:var(--navy)}.logo b{color:var(--gold)}
.sp{width:34px;height:34px;border-radius:50%;border:3px solid #D5DDE8;border-top-color:var(--navy);animation:r .8s linear infinite;margin:22px auto 14px}
@keyframes r{to{transform:rotate(360deg)}}
p{margin:0;font-size:15px;line-height:1.6;color:var(--sub);word-break:keep-all;max-width:340px}
.btn{display:inline-block;margin-top:18px;min-height:48px;padding:13px 26px;border-radius:12px;background:var(--navy);color:#fff;font-size:15px;font-weight:800;text-decoration:none}
.hide{display:none}
@media (prefers-reduced-motion:reduce){.sp{animation:none}}
</style></head>
<body><div class="box">
  <div class="logo">My<b>Jai</b> · 자비아</div>
  <div class="sp" id="sp"></div>
  <p id="msg">자비아에 들어가는 중입니다…</p>
  <a class="btn hide" id="go" href="/index.html">자비아 열기</a>
</div>
<script type="module">
const $=(i)=>document.getElementById(i);
/* 열쇠·이동할 곳 — 읽자마자 주소에서 지운다(뒤로 가기·주소 공유에 남지 않게) */
const h=new URLSearchParams((location.hash||'').replace(/^#/,''));
const code=h.get('c')||'';
let to=h.get('to')||'/index.html';
try{history.replaceState(null,'',location.pathname);}catch(_e){}
/* 같은 사이트 안의 경로만 (//다른사이트·javascript: 막기) */
if(!/^\/(?!\/)[^\s\\]*$/.test(to))to='/index.html';
$('go').href=to;
const fail=(t)=>{$('sp').classList.add('hide');$('msg').textContent=t;$('go').classList.remove('hide');};
if(!/^[A-Za-z0-9_-]{30,60}$/.test(code)){location.replace(to);}
else{
  try{
    const [{initializeApp},{getAuth,setPersistence,browserLocalPersistence,signInWithCustomToken},{getFunctions,httpsCallable}]=await Promise.all([
      import('https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js'),
      import('https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js'),
      import('https://www.gstatic.com/firebasejs/10.12.0/firebase-functions.js')]);
    const app=initializeApp({apiKey:"AIzaSyBD9p-bf162RiiD1Y3BsY-NvbYjpOSrzmg",authDomain:"jarvia-platform.firebaseapp.com",projectId:"jarvia-platform",storageBucket:"jarvia-platform.firebasestorage.app",messagingSenderId:"388025068900",appId:"1:388025068900:web:09ba8e12e9e9e2ec49de71"});
    const auth=getAuth(app);
    await setPersistence(auth,browserLocalPersistence).catch(()=>{});   // index.html 과 같은 로그인 공유
    const r=((await httpsCallable(getFunctions(app,'asia-northeast3'),'mjLoginRedeem')({c:code}))||{}).data||{};
    if(!r.ok||!r.token){
      fail(r.error==='expired'||r.error==='used'?'링크가 만료됐어요(2분 · 한 번만 쓸 수 있어요). 아래 버튼으로 자비아를 열어 주세요.':'자동 로그인을 하지 못했어요. 아래 버튼으로 자비아를 열어 주세요.');
    }else{
      await signInWithCustomToken(auth,r.token);
      location.replace(/^\/(?!\/)[^\s\\]*$/.test(r.path||'')?r.path:to);   /* 서버가 열쇠와 함께 저장한 경로 우선 */
    }
  }catch(e){fail('자동 로그인을 하지 못했어요. 아래 버튼으로 자비아를 열어 주세요.');}
}
</script>
</body></html>
