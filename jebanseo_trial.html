<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>제안서AI 무료체험</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1B2A4A; --navy-deep:#0F1830; --navy-soft:#24375f;
    --gold:#B8943E; --gold-soft:#cda85a; --gold-pale:#f3ead6;
    --ink:#222; --ink-soft:#4a5260; --bg:#F4F1EA; --card:#ffffff;
    --serif:'Nanum Myeongjo',serif; --sans:'Noto Sans KR',sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--sans); background:var(--bg); color:var(--ink);
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:24px 18px;
  }
  .wrap{ width:100%; max-width:440px; }

  .top{ text-align:center; margin-bottom:22px; }
  .eyebrow{
    display:inline-block; font-size:11.5px; letter-spacing:.16em; font-weight:700;
    color:var(--gold); background:rgba(184,148,62,.1); border:1px solid rgba(184,148,62,.35);
    padding:5px 14px; border-radius:999px; margin-bottom:14px;
  }
  .top h1{
    font-family:var(--serif); font-weight:800; color:var(--navy);
    font-size:clamp(26px,7vw,34px); margin:0 0 8px; letter-spacing:-.01em;
  }
  .top p{ margin:0; color:var(--ink-soft); font-size:14px; font-weight:300; line-height:1.65; }
  .top p b{ color:var(--navy); font-weight:600; }

  .card{
    background:var(--navy); border-radius:18px; padding:28px 24px 24px;
    box-shadow:0 18px 50px rgba(15,24,48,.22);
  }

  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12.5px; color:var(--gold-soft); font-weight:500; margin-bottom:7px; letter-spacing:.01em; }
  .in{
    width:100%; padding:14px 15px; border-radius:11px; font-size:15.5px; font-family:var(--sans);
    border:1px solid rgba(255,255,255,.18); background:rgba(255,255,255,.06); color:#fff; outline:none;
    transition:border .15s, background .15s; letter-spacing:.02em;
  }
  .in::placeholder{ color:rgba(255,255,255,.4); letter-spacing:0; }
  .in:focus{ border-color:var(--gold); background:rgba(255,255,255,.1); }
  .in:disabled{ opacity:.55; }

  .btn{
    width:100%; padding:15px; border:none; border-radius:11px; cursor:pointer;
    font-family:var(--serif); font-weight:700; font-size:16.5px; transition:background .15s, opacity .15s;
  }
  .btn-gold{ background:var(--gold); color:var(--navy); }
  .btn-gold:hover{ background:var(--gold-soft); }
  .btn-ghost{
    background:transparent; color:var(--gold-soft);
    border:1px solid rgba(205,168,90,.5); font-family:var(--sans); font-weight:600; font-size:14px; padding:12px;
  }
  .btn-ghost:hover{ background:rgba(205,168,90,.12); }
  .btn:disabled{ opacity:.5; cursor:default; }

  .row{ display:flex; gap:9px; }
  .row .in{ flex:1; }
  .row .btn{ width:auto; flex:none; white-space:nowrap; padding-left:18px; padding-right:18px; }

  .step2{ display:none; }
  .step2.show{ display:block; }

  .msg{ min-height:20px; margin-top:12px; font-size:13px; line-height:1.55; font-weight:400; text-align:center; }
  .msg.ok{ color:var(--gold-soft); }
  .msg.err{ color:#ffb4a8; }
  .msg.info{ color:rgba(255,255,255,.7); }

  .foot{
    text-align:center; margin-top:18px; font-size:12px; color:var(--ink-soft);
    font-weight:300; line-height:1.7;
  }
  .foot b{ color:var(--navy); font-weight:600; }

  /* 진행/완료 오버레이 */
  .overlay{
    position:fixed; inset:0; background:rgba(15,24,48,.96); display:none;
    align-items:center; justify-content:center; flex-direction:column; gap:18px; z-index:50; padding:24px; text-align:center;
  }
  .overlay.show{ display:flex; }
  .spinner{ width:44px; height:44px; border:3px solid rgba(205,168,90,.25); border-top-color:var(--gold); border-radius:50%; animation:spin .8s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .overlay .ot{ font-family:var(--serif); font-weight:700; color:#fff; font-size:19px; }
  .overlay .os{ color:rgba(255,255,255,.65); font-size:13.5px; line-height:1.6; }
  @media (prefers-reduced-motion: reduce){ .spinner{ animation:none; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <span class="eyebrow">무료 체험</span>
    <h1>제안서AI 직접 만들어보기</h1>
    <p>휴대폰 인증 한 번으로 <b>제안서 생성 1회</b>와<br><b>AI 슬라이드 작업 10회</b>를 무료로 체험하실 수 있습니다.</p>
  </div>

  <div class="card">
    <!-- 1단계: 휴대폰 번호 -->
    <div class="field">
      <label for="tp-phone">휴대폰 번호</label>
      <div class="row">
        <input id="tp-phone" class="in" type="tel" inputmode="numeric" maxlength="13" placeholder="01012345678" autocomplete="tel">
        <button id="tp-send" class="btn btn-gold" type="button">인증번호 받기</button>
      </div>
    </div>

    <!-- 2단계: 인증번호 -->
    <div id="tp-step2" class="step2">
      <div class="field">
        <label for="tp-code">인증번호 (문자로 받은 4자리)</label>
        <input id="tp-code" class="in" type="tel" inputmode="numeric" maxlength="4" placeholder="0000" autocomplete="one-time-code">
      </div>
      <button id="tp-start" class="btn btn-gold" type="button">인증하고 체험 시작</button>
    </div>

    <p id="tp-msg" class="msg" role="status"></p>
  </div>

  <p class="foot">
    체험은 <b>휴대폰 번호당 1회</b> 제공됩니다.<br>
    직접 편집은 횟수 제한 없이 자유롭게 사용하실 수 있습니다.
  </p>
</div>

<!-- 진행 오버레이 -->
<div id="tp-overlay" class="overlay">
  <div class="spinner" id="tp-spin"></div>
  <div class="ot" id="tp-ot">체험을 준비하고 있어요</div>
  <div class="os" id="tp-os">잠시만 기다려 주세요…</div>
  <button id="tp-go" class="btn btn-gold" type="button" style="display:none;max-width:320px;width:100%;margin-top:6px;">체험 시작하기</button>
</div>

<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
  import { getFunctions, httpsCallable } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-functions.js';
  const FC={apiKey:"AIzaSyBD9p-bf162RiiD1Y3BsY-NvbYjpOSrzmg",authDomain:"jarvia-platform.firebaseapp.com",projectId:"jarvia-platform",storageBucket:"jarvia-platform.firebasestorage.app",messagingSenderId:"388025068900",appId:"1:388025068900:web:09ba8e12e9e9e2ec49de71"};
  const app = initializeApp(FC);
  const functions = getFunctions(app, 'asia-northeast3');

  const $ = (id)=>document.getElementById(id);
  const elPhone=$('tp-phone'), elCode=$('tp-code'), elSend=$('tp-send'),
        elStart=$('tp-start'), elStep2=$('tp-step2'), elMsg=$('tp-msg');
  let verifiedSent=false, cooldown=0, timer=null;

  const setMsg=(t,cls)=>{ elMsg.textContent=t; elMsg.className='msg'+(cls?(' '+cls):''); };
  const digits=(s)=>String(s||'').replace(/[^0-9]/g,'');
  const validPhone=(d)=>/^01[016789]\d{7,8}$/.test(d);

  // 숫자만 입력 유지
  elPhone.addEventListener('input', ()=>{ elPhone.value=digits(elPhone.value); });
  elCode.addEventListener('input', ()=>{ elCode.value=digits(elCode.value); });

  function startCooldown(){
    cooldown=60; elSend.disabled=true; elSend.textContent='재발송 ('+cooldown+'s)';
    timer=setInterval(()=>{
      cooldown--;
      if(cooldown<=0){ clearInterval(timer); elSend.disabled=false; elSend.textContent='인증번호 재발송'; }
      else elSend.textContent='재발송 ('+cooldown+'s)';
    },1000);
  }

  // ── 인증번호 발송 ──
  elSend.addEventListener('click', async ()=>{
    const d=digits(elPhone.value);
    if(!validPhone(d)){ setMsg('휴대폰 번호를 정확히 입력해 주세요.','err'); return; }
    elSend.disabled=true; setMsg('인증번호를 보내는 중…','info');
    try{
      await httpsCallable(functions,'sendVerifyCode')({ phone:d });
      verifiedSent=true;
      elStep2.classList.add('show');
      elCode.focus();
      setMsg('인증번호가 발송되었습니다. 5분 이내에 입력해 주세요.','ok');
      startCooldown();
    }catch(e){
      setMsg(e.message||'인증번호 발송에 실패했습니다. 잠시 후 다시 시도해 주세요.','err');
      elSend.disabled=false;
    }
  });

  // ── 인증 확인 → 체험 신청(claimTrial) → 진입 ──
  elStart.addEventListener('click', async ()=>{
    const d=digits(elPhone.value), code=digits(elCode.value);
    if(!verifiedSent){ setMsg('먼저 인증번호를 받아 주세요.','err'); return; }
    if(code.length<4){ setMsg('문자로 받은 인증번호 4자리를 입력해 주세요.','err'); return; }
    elStart.disabled=true; setMsg('인증을 확인하는 중…','info');
    try{
      // 1) 인증번호 확인
      await httpsCallable(functions,'checkVerifyCode')({ phone:d, code });
      // 2) 체험 신청 — 1회 여부 확인 + 토큰 발급
      setMsg('체험을 준비하는 중…','info');
      const res=await httpsCallable(functions,'claimTrial')({ phone:d });
      const token=res && res.data && res.data.token;
      if(!token){ throw new Error('체험 토큰을 받지 못했습니다. 잠시 후 다시 시도해 주세요.'); }
      // 3) 인증 완료 → 24시간 안내 + 시작 버튼 (자동 이동 없이 직접 시작)
      $('tp-overlay').classList.add('show');
      $('tp-spin').style.display='none';
      $('tp-ot').textContent='✅ 인증 완료';
      $('tp-os').innerHTML='지금부터 <b style="color:var(--gold-soft)">24시간 이내</b>에 이용해 주세요.<br>자료 생성 1회 · AI 작업 10회 · 직접 편집 무제한입니다.';
      const go=$('tp-go');
      go.style.display='block';
      go.addEventListener('click', ()=>{
        location.href='jebanseo_program.html?trial='+encodeURIComponent(token);
      });
    }catch(e){
      const code2=(e && e.code)||'';
      let m=e.message||'처리 중 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.';
      if(code2.indexOf('already-exists')>=0) m='이미 이 번호로 체험을 이용하셨습니다. (번호당 1회)';
      setMsg(m,'err');
      elStart.disabled=false;
    }
  });
</script>
</body>
</html>
