<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>법인 세무 메모</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1c2230;--text:#1f2937;--muted:#6b7280;--line:#e5e7eb;--bg:#f5f6f8;--green:#0f6b4f;--green-bg:#eaf6f1;--green-line:#bfe0d1;--gold:#c9a96e;--gold-bg:#fff8ec}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',-apple-system,sans-serif;color:var(--text);background:var(--bg);line-height:1.85;font-size:16px;word-break:keep-all}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 60px}
.doc{background:#fff;border:1px solid var(--line);border-radius:16px;padding:28px 22px}
.card{display:flex;gap:14px;align-items:center;padding:16px 18px;background:var(--green-bg);border:1px solid var(--green-line);border-radius:12px;margin-bottom:22px}
.card .av{width:56px;height:56px;border-radius:50%;background:#cfe6db;flex:0 0 56px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px;color:var(--green);overflow:hidden}
.card .av img{width:100%;height:100%;object-fit:cover}
.card .tx{flex:1;min-width:0}.card .tx b{display:block;font-size:17px}.card .tx span{display:block;color:var(--muted);font-size:14px}.card .tx em{display:block;font-style:normal;margin-top:6px;font-size:14.5px}
.card button{background:var(--green);color:#fff;border-radius:9px;padding:11px 16px;font-size:14.5px;font-weight:700;white-space:nowrap}
.msg{margin:0 0 20px;padding:14px 18px;background:var(--gold-bg);border-left:4px solid var(--gold);border-radius:0 10px 10px 0;font-size:15.5px;white-space:pre-wrap}
h1{font-size:24px;font-weight:800;line-height:1.35;letter-spacing:-.02em;color:var(--ink)}
.sub{margin:6px 0 4px;font-size:16px;font-weight:700}.by{color:var(--muted);font-size:14px;margin-bottom:24px}
h3{font-size:17.5px;font-weight:700;margin:26px 0 10px;color:var(--ink)}
p{margin-bottom:14px}
.basis{border-left:4px solid var(--green);background:var(--green-bg);padding:12px 16px;margin:14px 0;border-radius:0 8px 8px 0;font-size:15px}
.basis b{color:var(--green);display:block;margin-bottom:4px}.basis q{display:block;font-style:italic;color:#374151;margin:4px 0 8px;quotes:"“" "”"}
table{width:100%;border-collapse:collapse;margin:12px 0;font-size:14.5px}th,td{border-bottom:1px solid var(--line);padding:10px 8px;text-align:left;vertical-align:top}th{font-size:12.5px;color:var(--muted);font-weight:600}
.note{font-size:13.5px;color:var(--muted)}
.chk{list-style:none;margin:8px 0 14px}.chk li{padding:8px 0 8px 30px;position:relative;font-size:15px;border-top:1px dashed var(--line)}.chk li:first-child{border-top:0}.chk li::before{content:"";position:absolute;left:2px;top:13px;width:16px;height:16px;border:2px solid var(--green);border-radius:4px}
.foot{margin-top:30px;padding-top:16px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.contact{font-size:14px;color:var(--muted);margin-top:10px}
.loading,.err{text-align:center;padding:60px 20px;color:var(--muted)}
/* 상담 폼 */
.ov{position:fixed;inset:0;background:rgba(15,36,64,.5);z-index:50;display:none;align-items:flex-end;justify-content:center}
.ov.show{display:flex}
.sheet{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:22px 20px 30px}
.sheet h2{font-size:18px;color:var(--green);margin-bottom:4px}.sheet .note{margin-bottom:14px}
.f{display:block;font-size:13.5px;font-weight:700;margin:12px 0 4px}.f small{font-weight:400;color:var(--muted);margin-left:6px}
.sheet input[type=text],.sheet input[type=tel],.sheet input[type=email],.sheet select,.sheet textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:15px;margin-top:4px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}.chips label{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border:1px solid var(--line);border-radius:20px;font-size:14px;font-weight:500;cursor:pointer}.chips label:has(input:checked){background:var(--green-bg);border-color:var(--green);color:var(--green)}
.radios{display:flex;gap:14px;margin-top:6px;font-size:14.5px}.radios label{display:inline-flex;gap:5px;align-items:center}
.consent{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;margin:16px 0 8px;color:#374151}
.btns{display:flex;gap:8px;margin-top:14px}.btns button{flex:1;padding:13px;border-radius:10px;font-size:15px;font-weight:700}
.btns .pri{background:var(--green);color:#fff}.btns .sec{background:#f3f4f6;color:var(--text)}
.done{text-align:center;padding:30px 10px}.done b{display:block;font-size:18px;color:var(--green);margin-bottom:8px}
@media(min-width:900px){body{font-size:17px}.wrap{max-width:820px;padding:32px 24px}.doc{padding:38px 40px}h1{font-size:28px}.ov{align-items:center}.sheet{border-radius:16px}}
</style>
</head>
<body>
<main class="wrap">
  <div id="view" class="doc"><div class="loading">불러오는 중…</div></div>
</main>

<div class="ov" id="ov" aria-modal="true" role="dialog">
  <div class="sheet" id="sheet">
    <h2>상담 요청</h2>
    <p class="note">보내주신 내용은 담당 컨설턴트에게만 전달됩니다.</p>
    <div id="frm">
      <label class="f">회사명<input type="text" id="c_company" placeholder="○○정밀 (주)" maxlength="40"></label>
      <div class="row">
        <label class="f">성함 <small>필수</small><input type="text" id="c_name" placeholder="홍길동" maxlength="20"></label>
        <label class="f">직함<select id="c_title"><option value="대표이사">대표이사</option><option value="대표">대표</option><option value="이사">이사</option><option value="임원">임원</option><option value="기타">기타</option></select></label>
      </div>
      <label class="f">휴대폰 <small>필수</small><input type="tel" id="c_phone" placeholder="010-0000-0000" maxlength="13" inputmode="numeric"></label>
      <label class="f">이메일 <small>선택</small><input type="email" id="c_email" placeholder="name@company.co.kr" maxlength="60"></label>
      <div class="f">상담 주제 <small>해당하는 것 모두</small><div class="chips" id="c_topics"></div></div>
      <div class="f">편한 시간<div class="radios"><label><input type="radio" name="c_time" value="오전" checked>오전</label><label><input type="radio" name="c_time" value="오후">오후</label><label><input type="radio" name="c_time" value="상관없음">상관없음</label></div></div>
      <label class="f">전하실 말씀 <small>선택</small><textarea id="c_msg" rows="3" maxlength="500" placeholder="궁금하신 점을 적어주세요"></textarea></label>
      <label class="consent"><input type="checkbox" id="c_consent"> 상담을 위해 입력한 정보를 담당 컨설턴트에게 제공하는 것에 동의합니다. (상담 목적 외 사용하지 않습니다)</label>
      <div class="btns"><button class="sec" type="button" onclick="closeForm()">닫기</button><button class="pri" type="button" id="c_submit" onclick="submitForm()">상담 요청 보내기</button></div>
    </div>
    <div id="frmDone" class="done" hidden><b>요청을 전달했습니다</b><span id="doneName"></span> 님께 곧 연락드리겠습니다.<div class="btns" style="margin-top:20px"><button class="sec" type="button" onclick="closeForm()">닫기</button></div></div>
  </div>
</div>

<script>
const FN = "https://asia-northeast3-jarvia-platform.cloudfunctions.net";
const k = (new URLSearchParams(location.search).get("k") || "").trim();
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const paras = (t) => String(t || "").split(/\n\s*\n/).filter(Boolean).map((p) => `<p>${esc(p).replace(/\n/g, "<br>")}</p>`).join("");
let D = null;

function cardHtml(c, line, big) {
  const av = c.photoUrl ? `<img src="${esc(c.photoUrl)}" alt="">` : esc((c.name || "?")[0]);
  const sub = [c.title, c.company].filter(Boolean).join(" · ");
  return `<div class="card"><div class="av">${av}</div><div class="tx">${big ? `<b>${esc(line)}</b><span>${esc(c.name)}${c.company ? " · " + esc(c.company) : ""}</span>` : `<b>${esc(c.name)}</b><span>${esc(sub)}</span>${line ? `<em>“${esc(line)}”</em>` : ""}`}</div><button type="button" onclick="openForm()">재무상담 신청</button></div>`;
}

function render(d) {
  D = d; const { ceo, consultant: c, issue } = d;
  document.title = ceo.title || "법인 세무 메모";
  const ym = issue.sendDate ? `${issue.sendDate.slice(0, 4)}년 ${Number(issue.sendDate.slice(5, 7))}월` : "";
  let h = cardHtml(c, ceo.cardLine, false);
  if (ceo.message) h += `<div class="msg">${esc(ceo.message)}</div>`;
  h += `<h1>${esc(ceo.title)}</h1><div class="sub">${esc(ceo.subtitle)}</div><div class="by">${esc(ym)}${c.name ? ` · ${esc(c.name)} 드림` : ""}</div>`;
  // 1
  h += `<h3>${esc(ceo.b1.h)}</h3>${paras(ceo.b1.p)}`;
  if (ceo.basis) h += `<div class="basis"><b>📋 근거 — ${esc(ceo.basis.doc)}</b>${ceo.basis.quote ? `<q>${esc(ceo.basis.quote)}</q>` : ""}${ceo.basis.plain ? esc(ceo.basis.plain) : ""}</div>`;
  // 2
  h += `<h3>${esc(ceo.b2.h)}</h3>${paras(ceo.b2.p)}`;
  if (ceo.b2.table && ceo.b2.table.length > 1) {
    const [head, ...rows] = ceo.b2.table;
    h += `<table><thead><tr>${head.map((x) => `<th>${esc(x)}</th>`).join("")}</tr></thead><tbody>${rows.map((r) => `<tr>${r.map((x) => `<td>${esc(x)}</td>`).join("")}</tr>`).join("")}</tbody></table><p class="note">※ 소득 수준·공제에 따라 크게 달라지는 개략치입니다. 정확한 금액은 세무사님과 확인하셔야 합니다.</p>`;
  }
  // 3
  h += `<h3>${esc(ceo.b3.h)}</h3>`;
  if (ceo.b3.checks) h += `<ul class="chk">${ceo.b3.checks.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>`;
  h += paras(ceo.b3.p);
  // 하단
  h += cardHtml(c, "어느 방법이 대표님께 맞는지, 결산서 한 부면 10분이면 압니다.", true);
  h += `<div class="contact">${esc([c.name, c.title, c.company].filter(Boolean).join(" · "))}${c.phone ? ` · ${esc(c.phone)}` : ""}</div>`;
  h += `<div class="foot">본 메모는 ${esc(ym || "현행")} 법령과 국세청 예규를 기준으로 한 일반 정보이며, 개별 세무 판단은 세무전문가와 확인하시기 바랍니다.</div>`;
  $("view").innerHTML = h;
  // 상담 주제 칩 — 메모 제목이 기본 체크
  const topics = [issue.title ? issue.title.replace(/\s*—.*$/, "").slice(0, 30) : "이 메모 내용", "임원 퇴직금 규정", "법인 자금 운용", "가업 승계", "기타"];
  $("c_topics").innerHTML = topics.map((t, i) => `<label><input type="checkbox" value="${esc(t)}"${i === 0 ? " checked" : ""}>${esc(t)}</label>`).join("");
}

async function load() {
  if (!k) return $("view").innerHTML = `<div class="err">잘못된 링크입니다.</div>`;
  try {
    const r = await fetch(`${FN}/itCeoView?k=${encodeURIComponent(k)}`); const j = await r.json();
    if (!j.ok) throw new Error(j.error || "load");
    render(j);
  } catch (e) { $("view").innerHTML = `<div class="err">메모를 불러올 수 없습니다.<br><span style="font-size:13px">링크가 만료되었거나 잘못되었습니다.</span></div>`; }
}
function openForm() { $("ov").classList.add("show"); document.body.style.overflow = "hidden"; setTimeout(() => $("c_company").focus(), 100); }
function closeForm() { $("ov").classList.remove("show"); document.body.style.overflow = ""; }
$("c_phone").addEventListener("input", (e) => { const v = e.target.value.replace(/[^0-9]/g, "").slice(0, 11); e.target.value = v.length > 7 ? `${v.slice(0, 3)}-${v.slice(3, 7)}-${v.slice(7)}` : v.length > 3 ? `${v.slice(0, 3)}-${v.slice(3)}` : v; });
async function submitForm() {
  const name = $("c_name").value.trim(), phone = $("c_phone").value.replace(/[^0-9]/g, "");
  if (!name) return alert("성함을 입력해 주세요."), $("c_name").focus();
  if (phone.length < 10) return alert("휴대폰 번호를 확인해 주세요."), $("c_phone").focus();
  if (!$("c_consent").checked) return alert("동의 항목을 확인해 주세요.");
  const btn = $("c_submit"); btn.disabled = true; btn.textContent = "전달 중…";
  const body = { k, company: $("c_company").value.trim(), name, title: $("c_title").value, phone, email: $("c_email").value.trim(),
    topics: [...document.querySelectorAll("#c_topics input:checked")].map((x) => x.value), time: document.querySelector('input[name="c_time"]:checked')?.value || "", message: $("c_msg").value.trim(), consent: true };
  try {
    const r = await fetch(`${FN}/itCeoConsult`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }); const j = await r.json();
    if (!j.ok) throw new Error(j.error || "send");
    $("frm").hidden = true; $("frmDone").hidden = false; $("doneName").textContent = name;
  } catch (e) { alert("전달에 실패했습니다. 잠시 후 다시 시도해 주세요."); btn.disabled = false; btn.textContent = "상담 요청 보내기"; }
}
$("ov").addEventListener("click", (e) => { if (e.target === $("ov")) closeForm(); });
load();
</script>
</body>
</html>
