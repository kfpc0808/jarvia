<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>법인 세무 메모</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#14213d;--text:#2b2f3a;--muted:#6b7280;--paper:#fbfaf7;--sheet:#ffffff;--rule:#d9d4c7;--rule-soft:#ebe7de;--accent:#0f6b4f;--accent-soft:#e6f1ec;--figure:#8a6d1f}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px}
body{background:var(--paper);color:var(--text);font-family:"Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;line-height:1.85;word-break:keep-all;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
.wrap{max-width:740px;margin:0 auto;padding:40px 20px 80px}
.sheet{background:var(--sheet);border:1px solid var(--rule);padding:52px 56px 44px;position:relative}
.sheet::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:var(--ink)}
/* 발신 카드 — 서명 블록 */
.sender{display:flex;align-items:center;gap:18px;padding-bottom:22px;border-bottom:1px solid var(--rule)}
.sender .av{width:60px;height:60px;border-radius:50%;background:var(--accent-soft);color:var(--accent);flex:0 0 60px;display:flex;align-items:center;justify-content:center;font-family:"Noto Serif KR",serif;font-weight:700;font-size:22px;overflow:hidden}
.sender .av img{width:100%;height:100%;object-fit:cover}
.sender .tx{flex:1;min-width:0}
.sender .tx b{display:block;font-size:17px;color:var(--ink);letter-spacing:-.01em}
.sender .tx span{display:block;font-size:13.5px;color:var(--muted);margin-top:1px}
.sender .tx em{display:block;font-style:normal;margin-top:8px;font-size:14.5px;color:var(--ink)}
.sender button{background:var(--ink);color:#fff;padding:12px 18px;font-size:14px;font-weight:700;white-space:nowrap;letter-spacing:.01em}
.sender button:hover{background:#1c2d54}
.sender button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
/* 개인 메시지 */
.msg{margin:24px 0 0;padding:16px 20px;background:var(--paper);border-left:3px solid var(--figure);font-size:15.5px;white-space:pre-wrap;color:var(--ink)}
/* 제목부 */
.head{margin:34px 0 8px}
.head .kicker{font-size:13px;font-weight:700;color:var(--accent);letter-spacing:.06em}
.head .date{font-size:13px;color:var(--muted);letter-spacing:.02em;padding-bottom:26px;border-bottom:1px solid var(--rule)}
h1{font-family:"Noto Serif KR",serif;font-weight:600;font-size:27px;line-height:1.4;letter-spacing:-.02em;color:var(--ink);margin:6px 0 10px}
.lede{font-size:16.5px;line-height:1.75;color:var(--ink);padding-bottom:26px;border-bottom:1px solid var(--rule)}
/* 본문 */
h3{font-family:"Noto Serif KR",serif;font-weight:600;font-size:18.5px;line-height:1.45;color:var(--ink);margin:38px 0 12px;letter-spacing:-.01em;display:grid;grid-template-columns:34px 1fr;gap:8px}
h3 .n{color:var(--figure);font-size:15px;padding-top:3px}
p{margin:0 0 14px;font-size:15.5px}
strong{font-weight:700;color:var(--ink)}
.after{margin-top:2px}
/* 근거 */
.basis{margin:18px 0 20px;padding:16px 20px 14px;background:var(--accent-soft);border-left:3px solid var(--accent)}
.basis .src{display:block;font-size:13px;font-weight:700;color:var(--accent);margin-bottom:6px}
.basis q{display:block;font-family:"Noto Serif KR",serif;font-size:15px;line-height:1.8;color:var(--ink);quotes:"“" "”";margin-bottom:8px}
.basis p{margin:0;font-size:14.5px}
/* 핵심 숫자 */
.figure{display:flex;align-items:baseline;gap:14px;margin:8px 0 18px;padding:14px 0;border-top:1px solid var(--rule-soft);border-bottom:1px solid var(--rule-soft)}
.figure b{font-family:"Noto Serif KR",serif;font-size:clamp(26px,7vw,34px);font-weight:600;color:var(--figure);letter-spacing:-.02em;line-height:1.1;white-space:nowrap;flex:0 0 auto}
.figure span{font-size:14px;color:var(--muted)}
/* 표 — 장부식 */
table{width:100%;border-collapse:collapse;margin:8px 0 8px;font-size:14.5px}
th,td{padding:11px 10px;text-align:left;vertical-align:top;border-bottom:1px solid var(--rule-soft)}
th{font-size:12.5px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--rule)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.total td{border-top:1px solid var(--ink);border-bottom:0;font-weight:700;color:var(--ink)}
@media (max-width:520px){
  table thead{display:none}
  table,table tbody,table tr,table td{display:block;width:100%}
  table tr{padding:10px 0;border-bottom:1px solid var(--rule-soft)}
  table td{border:0;padding:2px 0;text-align:left!important;white-space:normal}
  table td.num{font-size:17px;font-weight:700;color:var(--ink);font-family:"Noto Serif KR",serif}
  table td:first-child{font-size:12.5px;color:var(--muted)}
  table td:last-child{font-size:13.5px;color:var(--muted)}
  tr.total{border-top:1px solid var(--ink)}
  tr.total td:first-child{color:var(--ink);font-weight:700}
}
.note{font-size:13px;color:var(--muted);line-height:1.7;margin:8px 0 16px}
/* 체크 */
.chk{list-style:none;margin:8px 0 16px}
.chk li{position:relative;padding:10px 0 10px 32px;font-size:15px;border-top:1px solid var(--rule-soft)}
.chk li:first-child{border-top:0}
.chk li::before{content:"";position:absolute;left:2px;top:16px;width:15px;height:15px;border:1.5px solid var(--ink);border-radius:2px}
/* 마무리 */
.close{margin-top:34px;padding:22px 24px;background:var(--paper);border:1px solid var(--rule);display:flex;align-items:center;gap:18px}
.close .tx{flex:1}
.close .tx b{display:block;font-family:"Noto Serif KR",serif;font-weight:600;font-size:17px;color:var(--ink);line-height:1.5}
.close .tx span{display:block;font-size:13.5px;color:var(--muted);margin-top:4px}
.close button{background:var(--accent);color:#fff;padding:13px 20px;font-size:14.5px;font-weight:700;white-space:nowrap}
.close button:hover{background:#0c5740}
.close button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.contact{margin-top:16px;font-size:14px;color:var(--muted)}
.foot{margin-top:26px;padding-top:14px;border-top:1px solid var(--rule);font-size:12.5px;line-height:1.7;color:var(--muted)}
@media (max-width:640px){
  html{font-size:15.5px}
  .wrap{padding:0 0 40px}
  .sheet{border-left:0;border-right:0;padding:30px 20px 28px}
  h1{font-size:22px;line-height:1.38}h1 br{display:none}
  .lede{font-size:15.5px}
  h3{font-size:16.5px;grid-template-columns:26px 1fr;margin-top:32px}h3 .n{font-size:13.5px}
  p{font-size:15px}
  .sender{flex-wrap:wrap;gap:14px}.sender .av{width:52px;height:52px;flex-basis:52px;font-size:19px}.sender button{width:100%;padding:14px}
  .figure{flex-direction:column;align-items:flex-start;gap:6px}.figure span{font-size:13.5px;line-height:1.6}
  .close{flex-direction:column;align-items:stretch;padding:18px}.close button{padding:14px}
  .basis{padding:14px 16px 12px}.basis q{font-size:14.5px}
}
@media (min-width:900px){.sheet{padding:60px 68px 52px}h1{font-size:29px}p{font-size:16px}.lede{font-size:17px}}
@media print{body{background:#fff}.wrap{padding:0}.sheet{border:0;padding:0}.sheet::before{display:none}button{display:none}}
@media (prefers-reduced-motion:no-preference){.sender button,.close button{transition:background .15s}}

/* ══ 위클리 컨센서스 대표본 (kind:weekly) — 2026-09-10 v6 디자인, .wk 로 스코프 ══ */
.wk{--ink:#0E1730;--body:#2B3345;--muted:#6F7788;--rule:#D5D9E1;--soft:#F3F4F7;--gold:#C79A2E;--gold-deep:#8C6A16;--gold-soft:#FBF4E2;--bull:#C8262C;--bear:#1E4DB7;--flat:#8A91A0;--ok:#0B6B52;--ok-soft:#E8F3EF;--wait:#B4560F;--wait-soft:#FBEFE3;--bear-soft:#EAEFFA;--bull-soft:#FBEDED;color:var(--body);font-family:"Noto Sans KR",sans-serif;line-height:1.8}
.wk .band{background:var(--ink);color:#fff;padding:12px 44px;display:flex;justify-content:space-between;align-items:center;font-size:13px;margin:-52px -56px 0}
.wk .band b{color:var(--gold);font-weight:900;letter-spacing:.04em}.wk .band span{color:#AEB8CD}
.wk .lh{display:flex;align-items:center;gap:14px;padding:26px 0 18px;border-bottom:2px solid var(--ink)}
.wk .lh .av{width:48px;height:48px;border-radius:50%;background:var(--ink);color:var(--gold);font-family:"Noto Serif KR",serif;font-weight:700;font-size:19px;display:flex;align-items:center;justify-content:center;flex:0 0 48px;overflow:hidden}
.wk .lh .av img{width:100%;height:100%;object-fit:cover}
.wk .lh .who b{display:block;font-size:16px;color:var(--ink)}.wk .lh .who span{font-size:13px;color:var(--muted)}
.wk .lh .no{margin-left:auto;text-align:right;font-size:12.5px;color:var(--muted);line-height:1.5}.wk .lh .no b{display:block;font-family:"Noto Serif KR",serif;font-size:14px;color:var(--ink)}
.wk .lh button{background:var(--ink);color:#fff;padding:11px 16px;font-size:13.5px;font-weight:700;white-space:nowrap}
.wk h1{font-family:"Noto Serif KR",serif;font-size:34px;font-weight:900;line-height:1.28;color:var(--ink);margin:30px 0 8px;letter-spacing:-.01em}
.wk .period{font-size:13.5px;color:var(--muted)}
.wk .thermo{display:grid;grid-template-columns:auto 1fr;margin-top:26px;border:2px solid var(--ink)}
.wk .thermo .stat{padding:22px 26px;border-right:2px solid var(--ink);text-align:center;min-width:190px}
.wk .thermo.wait .stat{background:var(--wait-soft)}.wk .thermo.act .stat{background:var(--ok-soft)}.wk .thermo.hold .stat{background:var(--soft)}
.wk .thermo .stat .l{font-size:12px;font-weight:900;letter-spacing:.04em}.wk .thermo .stat .v{font-family:"Noto Serif KR",serif;font-size:38px;font-weight:900;line-height:1.1;margin:6px 0 4px}
.wk .thermo.wait .stat .l,.wk .thermo.wait .stat .v{color:var(--wait)}.wk .thermo.act .stat .l,.wk .thermo.act .stat .v{color:var(--ok)}.wk .thermo.hold .stat .l,.wk .thermo.hold .stat .v{color:var(--flat)}
.wk .thermo .stat .s{font-size:12.5px;color:var(--body)}
.wk .thermo .body{padding:18px 24px;display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:center}
.wk .thermo .why{font-size:14.5px}.wk .thermo .why b{color:var(--ink)}
.wk .rule3{display:flex;gap:6px;margin-top:10px;font-size:12px}.wk .rule3 span{padding:3px 10px;border:1px solid var(--rule);color:var(--muted)}
.wk .rule3 span.on{color:#fff;border-color:transparent;font-weight:700}.wk .thermo.wait .rule3 span.on{background:var(--wait)}.wk .thermo.act .rule3 span.on{background:var(--ok)}.wk .thermo.hold .rule3 span.on{background:var(--flat)}
.wk .trend{border-left:1px solid var(--rule);padding-left:18px}.wk .trend .cap{font-size:12px;color:var(--muted);margin-bottom:6px}
.wk .trend .wkk{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.wk .trend .wkk div{text-align:center;font-size:11.5px;color:var(--muted)}
.wk .trend .wkk i{display:block;height:34px;margin-bottom:4px;border-radius:2px;position:relative}
.wk .trend .wkk i::after{content:attr(data-l);position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-style:normal;font-weight:900;font-size:12px}
.wk .trend .go{background:var(--ok)}.wk .trend .hold{background:var(--flat)}.wk .trend .wait{background:var(--wait)}.wk .trend .wkk div.now{color:var(--ink);font-weight:700}
.wk .trend .note{font-size:12.5px;margin-top:8px;color:var(--body)}
.wk .memo{margin:24px 0 0;padding:20px 24px 18px 28px;background:var(--gold-soft);border-left:5px solid var(--gold)}
.wk .memo p{font-family:"Noto Serif KR",serif;font-size:16px;color:var(--ink);line-height:1.9;white-space:pre-wrap;margin:0}
.wk .memo small{display:block;margin-top:8px;font-size:12.5px;color:var(--gold-deep);font-weight:700}
.wk .verdict{margin:30px 0 0;padding:24px 28px;border:2px solid var(--ink);position:relative}
.wk .verdict .lab{position:absolute;top:-11px;left:20px;background:#fff;padding:0 8px;font-size:12px;color:var(--gold-deep);font-weight:900}
.wk .verdict p{font-family:"Noto Serif KR",serif;font-size:21px;font-weight:700;line-height:1.55;color:var(--ink);margin:0}
.wk .lede{margin-top:18px;font-size:15.5px}
.wk h2{display:flex;align-items:center;gap:12px;margin:46px 0 16px;font-family:"Noto Serif KR",serif;font-size:20px;font-weight:700;color:var(--ink);padding-bottom:10px;border-bottom:1px solid var(--rule)}
.wk h2 .n{width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--gold);font-size:14px;display:flex;align-items:center;justify-content:center;flex:0 0 30px;font-family:"Noto Sans KR",sans-serif;font-weight:900}
.wk h2 small{margin-left:auto;font-family:"Noto Sans KR",sans-serif;font-size:12.5px;color:var(--muted);font-weight:400}
.wk p{font-size:15.5px;margin:0 0 12px}.wk p b{color:var(--ink)}
.wk .flow{display:grid;gap:12px}.wk .flow>div{border:1px solid var(--rule);border-left:5px solid;display:grid;grid-template-columns:150px 1fr}
.wk .flow .rate{border-left-color:var(--bear)}.wk .flow .fx{border-left-color:var(--gold)}.wk .flow .liq{border-left-color:var(--ok)}
.wk .flow .hd{padding:16px 18px;background:var(--soft);border-right:1px solid var(--rule)}.wk .flow .hd b{display:block;font-family:"Noto Serif KR",serif;font-size:17px;color:var(--ink)}
.wk .flow .hd .v{font-family:"Noto Serif KR",serif;font-size:24px;font-weight:700;color:var(--ink);line-height:1.1;margin:8px 0 2px}.wk .flow .hd .w{font-size:12px;color:var(--muted)}
.wk .flow .bd{padding:14px 18px}.wk .flow .bd p{margin:0 0 8px;font-size:14.5px}
.wk .flow .do{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.wk .flow .do div{padding:10px 12px;font-size:13.5px;line-height:1.6}
.wk .flow .do .y{background:var(--ok-soft);border-left:3px solid var(--ok)}.wk .flow .do .nn{background:var(--bull-soft);border-left:3px solid var(--bull)}
.wk .flow .do b{display:block;font-size:11.5px;margin-bottom:2px}.wk .flow .do .y b{color:var(--ok)}.wk .flow .do .nn b{color:var(--bull)}
.wk .days{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.wk .days div{background:var(--soft);padding:12px 6px 10px;text-align:center;border-top:3px solid var(--rule)}
.wk .days div.hit{border-top-color:var(--bear);background:var(--bear-soft)}
.wk .days .d{font-family:"Noto Serif KR",serif;font-weight:700;color:var(--ink);font-size:15px}.wk .days .d small{display:block;font-family:"Noto Sans KR",sans-serif;font-size:11.5px;color:var(--muted);font-weight:400}
.wk .days .bar{display:flex;height:11px;margin:10px 4px 8px;overflow:hidden;border-radius:2px}.wk .days .bar i{display:block;height:100%}
.wk .days .u{background:var(--bull)}.wk .days .m{background:var(--flat)}.wk .days .dn{background:var(--bear)}.wk .days .r{font-weight:900;font-size:15px}
.wk .up{color:var(--bull)}.wk .down{color:var(--bear)}
.wk .legend{font-size:12.5px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap;margin-top:10px}.wk .legend i{display:inline-block;width:11px;height:11px;margin-right:4px;vertical-align:-1px;border-radius:2px}
.wk .watch{list-style:none;border-top:2px solid var(--ink);margin:0;padding:0}.wk .watch li{display:grid;grid-template-columns:92px 1fr;gap:16px;padding:15px 0;border-bottom:1px solid var(--rule)}
.wk .watch .d{font-family:"Noto Serif KR",serif;font-weight:700;color:#fff;background:var(--ink);text-align:center;padding:9px 6px;font-size:14.5px;line-height:1.3;align-self:start}.wk .watch li.key .d{background:var(--bull)}
.wk .watch b{display:block;color:var(--ink);font-size:15.5px;margin-bottom:2px}.wk .watch p{margin:0;font-size:14.5px}
.wk .principle{margin:46px 0 0;padding:26px 30px;background:var(--ink);color:#fff;display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:start}
.wk .principle .no{font-family:"Noto Serif KR",serif;font-size:13px;color:var(--gold);font-weight:700;letter-spacing:.06em;line-height:1.3}.wk .principle .no b{display:block;font-size:34px;line-height:1;margin-top:4px}
.wk .principle h3{font-family:"Noto Serif KR",serif;font-size:21px;font-weight:700;line-height:1.4;margin:0 0 8px;color:#fff;display:block}
.wk .principle p{font-size:14.5px;color:#DDE2EC;margin-bottom:8px}
.wk .principle .ex{margin-top:10px;padding:12px 14px;background:rgba(255,255,255,.07);border-left:3px solid var(--gold);font-size:14px;color:#F2F4F8}.wk .principle .ex b{color:var(--gold);font-size:11.5px;display:block;margin-bottom:2px}
.wk .closing{margin:46px 0 0;padding:28px 0 0;border-top:2px solid var(--ink)}.wk .closing h3{font-family:"Noto Serif KR",serif;font-size:19px;color:var(--ink);margin:0 0 12px;display:block}
.wk .closing p{white-space:pre-wrap}
.wk .sign{display:flex;align-items:center;gap:16px;margin-top:24px;padding:20px 24px;background:var(--soft)}
.wk .sign .av{width:56px;height:56px;border-radius:50%;background:var(--ink);color:var(--gold);font-family:"Noto Serif KR",serif;font-weight:700;font-size:21px;display:flex;align-items:center;justify-content:center;flex:0 0 56px;overflow:hidden}.wk .sign .av img{width:100%;height:100%;object-fit:cover}
.wk .sign .who{flex:1}.wk .sign .who b{display:block;font-size:16.5px;color:var(--ink)}.wk .sign .who span{font-size:13px;color:var(--muted)}
.wk .sign .btns{display:flex;gap:8px;margin:0}.wk .sign button{font-size:14px;font-weight:700;padding:12px 18px;border:1px solid var(--ink);background:#fff;color:var(--ink);flex:none;border-radius:0}
.wk .sign button.primary{background:var(--ink);color:#fff}
.wk .foot{padding:18px 0 0;font-size:11.5px;color:var(--muted);line-height:1.7;margin-top:18px;border-top:1px solid var(--rule)}
@media (max-width:640px){
  .wk .band{padding:10px 18px;font-size:12px;margin:-30px -20px 0}
  .wk .lh{flex-wrap:wrap}.wk .lh .no{margin-left:0;width:100%;text-align:left;margin-top:4px}.wk .lh button{width:100%}
  .wk h1{font-size:26px;margin-top:22px}
  .wk .thermo{grid-template-columns:1fr}.wk .thermo .stat{border-right:0;border-bottom:2px solid var(--ink);min-width:0}.wk .thermo .body{grid-template-columns:1fr;padding:16px}.wk .trend{border-left:0;padding-left:0;border-top:1px solid var(--rule);padding-top:14px}
  .wk .memo{padding:16px 16px 14px 18px}.wk .memo p{font-size:15.5px}
  .wk .verdict{padding:20px 16px 16px}.wk .verdict p{font-size:18px}
  .wk h2{font-size:18px;margin-top:38px;flex-wrap:wrap}.wk h2 small{margin-left:0;width:100%}
  .wk .flow>div{grid-template-columns:1fr}.wk .flow .hd{border-right:0;border-bottom:1px solid var(--rule);display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}.wk .flow .hd .v{margin:0;font-size:20px}.wk .flow .do{grid-template-columns:1fr}
  .wk .days{gap:4px}.wk .days div{padding:10px 2px 8px}.wk .days .d{font-size:13.5px}.wk .days .bar{margin:8px 2px 6px;height:9px}.wk .days .r{font-size:13px}
  .wk .watch li{grid-template-columns:72px 1fr;gap:12px}.wk .watch .d{font-size:13px;padding:8px 4px}
  .wk .principle{grid-template-columns:1fr;padding:22px 18px;gap:10px}.wk .principle h3{font-size:19px}
  .wk .sign{flex-wrap:wrap;padding:16px}.wk .sign .btns{width:100%;flex-direction:column}.wk .sign button{width:100%;padding:14px}
}
@media (min-width:900px){.wk .band{margin:-60px -68px 0;padding:12px 56px}}

/* ── 로딩·오류 ── */
.loading,.err{text-align:center;padding:60px 20px;color:var(--muted)}
/* 상담 폼 */
.ov{position:fixed;inset:0;background:rgba(20,33,61,.55);z-index:50;display:none;align-items:flex-end;justify-content:center}
.ov.show{display:flex}
.fsheet{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:22px 20px 30px}
.fsheet h2{font-size:18px;color:var(--accent);margin-bottom:4px}.fsheet .note{margin-bottom:14px}
.f{display:block;font-size:13.5px;font-weight:700;margin:12px 0 4px}.f small{font-weight:400;color:var(--muted);margin-left:6px}
.fsheet input[type=text],.fsheet input[type=tel],.fsheet input[type=email],.fsheet select,.fsheet textarea{width:100%;padding:11px 12px;border:1px solid var(--rule);border-radius:8px;font:inherit;font-size:15px;margin-top:4px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}.chips label{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border:1px solid var(--rule);border-radius:20px;font-size:14px;font-weight:500;cursor:pointer}.chips label:has(input:checked){background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.radios{display:flex;gap:14px;margin-top:6px;font-size:14.5px}.radios label{display:inline-flex;gap:5px;align-items:center}
.consent{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;margin:16px 0 8px;color:#374151}
.btns{display:flex;gap:8px;margin-top:14px}.btns button{flex:1;padding:13px;border-radius:10px;font-size:15px;font-weight:700}
.btns .pri{background:var(--accent);color:#fff}.btns .sec{background:#f3f4f6;color:var(--text)}
.done{text-align:center;padding:30px 10px}.done b{display:block;font-size:18px;color:var(--accent);margin-bottom:8px}
@media(min-width:900px){.ov{align-items:center}.fsheet{border-radius:16px}}
</style>
</head>
<body>
<main class="wrap">
  <article id="view" class="sheet"><div class="loading">불러오는 중…</div></article>
</main>

<div class="ov" id="ov" aria-modal="true" role="dialog">
  <div class="fsheet" id="sheet">
    <h2>상담 요청</h2>
    <p class="note">보내주신 내용은 담당 컨설턴트에게만 전달됩니다.</p>
    <div id="frm">
      <label class="f">회사명<input type="text" id="c_company" placeholder="○○정밀 (주)" maxlength="40"></label>
      <div class="row">
        <label class="f">성함 <small>필수</small><input type="text" id="c_name" placeholder="홍길동" maxlength="20"></label>
        <label class="f">직함<select id="c_title"><option value="대표이사">대표이사</option><option value="대표">대표</option><option value="이사">이사</option><option value="임원">임원</option><option value="기타">기타</option></select></label>
      </div>
      <label class="f">휴대폰 <small>필수</small><input type="tel" id="c_phone" placeholder="010-0000-0000" maxlength="13" inputmode="numeric"></label>
      <label class="f">이메일 <small>선택</small><input type="email" id="c_email" placeholder="name@company.co.kr" maxlength="60"></label>
      <div class="f">상담 주제 <small>해당하는 것 모두</small><div class="chips" id="c_topics"></div></div>
      <div class="f">편한 시간<div class="radios"><label><input type="radio" name="c_time" value="오전" checked>오전</label><label><input type="radio" name="c_time" value="오후">오후</label><label><input type="radio" name="c_time" value="상관없음">상관없음</label></div></div>
      <label class="f">전하실 말씀 <small>선택</small><textarea id="c_msg" rows="3" maxlength="500" placeholder="궁금하신 점을 적어주세요"></textarea></label>
      <label class="consent"><input type="checkbox" id="c_consent"> 상담을 위해 입력한 정보를 담당 컨설턴트에게 제공하는 것에 동의합니다. (상담 목적 외 사용하지 않습니다)</label>
      <div class="btns"><button class="sec" type="button" onclick="closeForm()">닫기</button><button class="pri" type="button" id="c_submit" onclick="submitForm()">상담 요청 보내기</button></div>
    </div>
    <div id="frmDone" class="done" hidden><b>요청을 전달했습니다</b><span id="doneName"></span> 님께 곧 연락드리겠습니다.<div class="btns" style="margin-top:20px"><button class="sec" type="button" onclick="closeForm()">닫기</button></div></div>
  </div>
</div>

<script>
const FN = "https://asia-northeast3-jarvia-platform.cloudfunctions.net";
const k = (new URLSearchParams(location.search).get("k") || "").trim();
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const paras = (t) => String(t || "").split(/\n\s*\n/).filter(Boolean).map((p) => `<p>${esc(p).replace(/\n/g, "<br>")}</p>`).join("");
let D = null;

function senderHtml(c, line) {
  const av = c.photoUrl ? `<img src="${esc(c.photoUrl)}" alt="">` : esc((c.name || "?")[0]);
  const sub = [c.title, c.company].filter(Boolean).join(" · ");
  return `<div class="sender"><div class="av">${av}</div><div class="tx"><b>${esc(c.name)}</b><span>${esc(sub)}</span>${line ? `<em>“${esc(line)}”</em>` : ""}</div><button type="button" onclick="openForm()">재무상담 신청</button></div>`;
}
function closeHtml(c, line) {
  return `<div class="close"><div class="tx"><b>${esc(line)}</b><span>${esc(c.name)}${c.company ? " · " + esc(c.company) : ""} · 무료 법인 세무 점검</span></div><button type="button" onclick="openForm()">재무상담 신청</button></div>`;
}
const KO_NUM = ["하나", "둘", "셋", "넷", "다섯"];
function h3(i, text) { const t = String(text || "").replace(/^\s*\d+[.)]\s*/, ""); return `<h3><span class="n">${KO_NUM[i] || i + 1}</span><span>${esc(t)}</span></h3>`; }
/* 표: 2열째가 금액이면 오른쪽 정렬, 마지막 행은 강조 */
function tableHtml(t) {
  if (!t || t.length < 2) return "";
  const [head, ...rows] = t;
  const numCol = head.findIndex((x) => /금액|부담|원/.test(String(x)));
  const cell = (x, j, tag) => `<${tag}${j === numCol ? ' class="num"' : ""}>${esc(x)}</${tag}>`;
  return `<table><thead><tr>${head.map((x, j) => cell(x, j, "th")).join("")}</tr></thead><tbody>${rows.map((r, i) => `<tr${i === rows.length - 1 ? ' class="total"' : ""}>${r.map((x, j) => cell(x, j, "td")).join("")}</tr>`).join("")}</tbody></table>`;
}

function render(d) {
  if (d.kind === "weekly" || (d.ceo && d.ceo.kind === "weekly")) return renderWeekly(d);   // ★ [2026-09-10] 위클리 컨센서스 대표본
  D = d; const { ceo, consultant: c, issue } = d;
  document.title = ceo.title || "법인 세무 메모";
  const ym = issue.sendDate ? `${issue.sendDate.slice(0, 4)}년 ${Number(issue.sendDate.slice(5, 7))}월` : "";
  let h = senderHtml(c, ceo.cardLine);
  if (ceo.message) h += `<div class="msg">${esc(ceo.message)}</div>`;
  h += `<div class="head"><div class="kicker">${esc(ceo.title || "대표님께 드리는 법인 세무 메모")}</div><h1>${esc(ceo.subtitle || "")}</h1><div class="date">${esc(ym)}${c.name ? ` · ${esc(c.name)} 드림` : ""}</div></div>`;
  // 1
  h += h3(0, ceo.b1.h) + `<div>${paras(ceo.b1.p)}</div>`;
  if (ceo.basis) h += `<div class="basis"><span class="src">근거 — ${esc(ceo.basis.doc)}</span>${ceo.basis.quote ? `<q>${esc(ceo.basis.quote)}</q>` : ""}${ceo.basis.plain ? `<p>${esc(ceo.basis.plain)}</p>` : ""}</div>`;
  // 2
  h += h3(1, ceo.b2.h) + `<div>${paras(ceo.b2.p)}</div>`;
  if (ceo.b2.table && ceo.b2.table.length > 1) {
    h += tableHtml(ceo.b2.table) + `<p class="note">소득 수준·공제·가정에 따라 크게 달라지는 개략치입니다. 정확한 금액은 세무사님과 확인하셔야 합니다.</p>`;
  }
  // 3
  h += h3(2, ceo.b3.h);
  if (ceo.b3.checks) h += `<ul class="chk">${ceo.b3.checks.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>`;
  h += `<div>${paras(ceo.b3.p)}</div>`;
  // 하단
  h += closeHtml(c, ceo.ctaLine || "어느 방법이 대표님께 맞는지, 결산서 한 부면 10분이면 압니다.");
  h += `<p class="contact">${esc([c.name, c.title, c.company].filter(Boolean).join(" · "))}${c.phone ? ` · ${esc(c.phone)}` : ""}</p>`;
  h += `<p class="foot">본 메모는 ${esc(ym || "현행")} 법령과 국세청 예규를 기준으로 한 일반 정보이며, 개별 세무 판단은 세무전문가와 확인하시기 바랍니다.</p>`;
  $("view").innerHTML = h;
  const topics = [issue.title ? issue.title.replace(/\s*—.*$/, "").slice(0, 30) : "이 메모 내용", "임원 퇴직금 규정", "법인 자금 운용", "가업 승계", "기타"];
  $("c_topics").innerHTML = topics.map((t, i) => `<label><input type="checkbox" value="${esc(t)}"${i === 0 ? " checked" : ""}>${esc(t)}</label>`).join("");
}


/* ══ 위클리 컨센서스 대표본 렌더 (kind:weekly) — 2026-09-10 ══ */
const REG = { act: { l: "행동", css: "go" }, hold: { l: "유지", css: "hold" }, wait: { l: "관망", css: "wait" } };
const pct = (v) => (v == null ? "—" : `${v > 0 ? "+" : v < 0 ? "−" : ""}${Math.abs(v).toFixed(2)}%`);
function renderWeekly(d) {
  D = d; const { ceo, consultant: c, issue } = d;
  document.title = ceo.title || "주간 시장 메모";
  const view = $("view"); view.className = "sheet wk";
  const av = c.photoUrl ? `<img src="${esc(c.photoUrl)}" alt="">` : esc((c.name || "?")[0]);
  const sub = [c.title, c.company].filter(Boolean).join(" · ");
  const t = ceo.thermo || {}; const r = REG[t.regime] || REG.hold;
  const trend = (t.trend || []).slice(-4);
  const flowCls = { rate: "rate", fx: "fx", flow: "liq" };
  const days = (ceo.days || []).map((x) => { const tot = (x.dist?.up || 0) + (x.dist?.neutral || 0) + (x.dist?.down || 0); const hit = x.chg != null && Math.abs(x.chg) >= 3;
    return `<div${hit ? ' class="hit"' : ""}><div class="d">${esc(x.dow)}<small>${esc(x.label)}</small></div><div class="bar">${tot ? `<i class="u" style="flex:${x.dist.up}"></i><i class="m" style="flex:${x.dist.neutral}"></i><i class="dn" style="flex:${x.dist.down}"></i>` : `<i class="m" style="flex:1;opacity:.3"></i>`}</div><div class="r ${x.chg > 0 ? "up" : x.chg < 0 ? "down" : ""}"${x.chg == null ? ' style="color:var(--muted)"' : ""}>${x.chg == null ? "—" : pct(x.chg)}</div></div>`; }).join("");
  const flows = (ceo.flows || []).map((f) => `<div class="${flowCls[f.key] || "liq"}"><div class="hd"><b>${esc(f.head)}</b>${f.value ? `<div class="v">${esc(f.value)}</div>` : ""}${f.sub ? `<div class="w">${esc(f.sub)}</div>` : ""}</div><div class="bd"><p>${esc(f.what)}</p><div class="do"><div class="y"><b>할 것</b>${esc(f.do)}</div><div class="nn"><b>하지 말 것</b>${esc(f.dont)}</div></div></div></div>`).join("");
  const events = (ceo.events || []).map((e, i) => `<li${i === 0 ? ' class="key"' : ""}><div class="d">${esc(e.date)}</div><div><b>${esc(e.name)}</b><p>${esc(e.text)}</p></div></li>`).join("");
  const pr = ceo.principle || {};
  let h = `<div class="band"><b>주간 시장 메모</b><span>${esc(issue.weekLabel || "")}${issue.range ? ` · ${esc(issue.range)}` : ""}</span></div>
  <header class="lh"><div class="av">${av}</div><div class="who"><b>${esc(c.name || "")}${c.title ? " " + esc(c.title) : ""}</b><span>${esc(c.company || "")}${c.company ? " · " : ""}매주 월요일 아침에 보내드립니다</span></div><div class="no"><b>${esc(issue.range || "")}</b>증권사 아침 리서치 정리</div><button type="button" onclick="openForm()">상담 요청</button></header>
  <h1>${esc(ceo.title || "")}</h1>
  <div class="period">지난주 시장을 이번 주 대출·예금·환율 결정의 관점에서 정리했습니다. 주식 매매 판단은 담지 않습니다.</div>
  <section class="thermo ${esc(t.regime || "hold")}"><div class="stat"><div class="l">이번 주 온도계 · 지난주 기준</div><div class="v">${esc(t.label || r.l)}</div><div class="s">${esc(t.sub || "")}</div></div>
    <div class="body"><div class="why"><b>왜 ${esc(t.label || r.l)}인가.</b> ${esc(t.note || "")}<div class="rule3"><span${t.regime === "act" ? ' class="on"' : ""}>행동</span><span${t.regime === "hold" ? ' class="on"' : ""}>유지</span><span${t.regime === "wait" ? ' class="on"' : ""}>관망</span></div></div>
    ${trend.length ? `<div class="trend"><div class="cap">최근 ${trend.length}주</div><div class="wkk">${trend.map((x, i) => `<div${i === trend.length - 1 ? ' class="now"' : ""}><i class="${(REG[x.regime] || REG.hold).css}" data-l="${(REG[x.regime] || REG.hold).l}"></i>${i === trend.length - 1 ? "지난주" : esc(String(x.weekKey || "").replace(/^\d{4}-/, ""))}</div>`).join("")}</div>${t.streak > 1 ? `<div class="note">${t.streak}주 연속 ${esc(t.label || "")}.</div>` : ""}</div>` : ""}</div></section>`;
  if (ceo.memo) h += `<aside class="memo"><p>${esc(ceo.memo)}</p><small>— ${esc(c.name || "")} 드림</small></aside>`;
  h += `<section class="verdict"><span class="lab">지난주 증권사들이 한목소리로 말한 것</span><p>${esc(ceo.verdict || "")}</p></section>${ceo.lede ? `<p class="lede">${esc(ceo.lede)}</p>` : ""}
  <h2><span class="n">1</span>돈의 흐름 세 가지<small>회사에 닿는 순서대로</small></h2><div class="flow">${flows}</div>
  <h2><span class="n">2</span>지난주 증권사들은 매일 아침 어떻게 봤나</h2><div class="days">${days}</div>
  <div class="legend"><span><i style="background:var(--bull)"></i>오른다</span><span><i style="background:var(--flat)"></i>지켜보자</span><span><i style="background:var(--bear)"></i>내린다</span><span>막대는 그날 아침 증권사 시각, 숫자는 그날 코스피</span></div>
  ${ceo.daysNote ? `<p style="margin-top:14px">${esc(ceo.daysNote)}</p>` : ""}
  ${events ? `<h2><span class="n">3</span>이번 주, 봐야 할 날짜</h2><ul class="watch">${events}</ul>` : ""}
  ${pr.title ? `<section class="principle"><div class="no">이번 호의 원칙<b>${String(pr.id || "").padStart(2, "0")}</b></div><div><h3>${esc(pr.title)}</h3><p>${esc(pr.body || "")}</p>${pr.example ? `<div class="ex"><b>지난주 사례</b>${esc(pr.example)}</div>` : ""}</div></section>` : ""}
  <section class="closing"><h3>대표님께</h3><p>${esc(ceo.closing || "")}</p>
    <div class="sign"><div class="av">${av}</div><div class="who"><b>${esc(c.name || "")}${c.title ? " " + esc(c.title) : ""}</b><span>${esc([c.company, c.phone].filter(Boolean).join(" · "))}</span></div><div class="btns"><button type="button" class="primary" onclick="openForm()">상담 요청하기</button>${c.phone ? `<a href="tel:${esc(String(c.phone).replace(/[^0-9+]/g, ""))}" style="text-decoration:none"><button type="button">전화하기</button></a>` : ""}</div></div>
    <p class="foot">${esc(ceo.foot || "")}</p></section>`;
  view.innerHTML = h;
  const topics = ["이번 주 대출·자금 결정", "환율·외화 결제", "여유자금 운용", "저축성 보험·예금", "기타"];
  $("c_topics").innerHTML = topics.map((t, i) => `<label><input type="checkbox" value="${esc(t)}"${i === 0 ? " checked" : ""}>${esc(t)}</label>`).join("");
}

async function load() {
  if (!k) return $("view").innerHTML = `<div class="err">잘못된 링크입니다.</div>`;
  try {
    const r = await fetch(`${FN}/itCeoView?k=${encodeURIComponent(k)}`); const j = await r.json();
    if (!j.ok) throw new Error(j.error || "load");
    render(j);
  } catch (e) { $("view").innerHTML = e.message === "expired" ? `<div class="err">이 메모 링크는 기간이 지나 닫혔습니다.<br><span style="font-size:13px">보내주신 분께 새 링크를 요청해 주세요.</span></div>` : `<div class="err">메모를 불러올 수 없습니다.<br><span style="font-size:13px">링크가 만료되었거나 잘못되었습니다.</span></div>`; }
}
function openForm() { $("ov").classList.add("show"); document.body.style.overflow = "hidden"; setTimeout(() => $("c_company").focus(), 100); }
function closeForm() { $("ov").classList.remove("show"); document.body.style.overflow = ""; }
$("c_phone").addEventListener("input", (e) => { const v = e.target.value.replace(/[^0-9]/g, "").slice(0, 11); e.target.value = v.length > 7 ? `${v.slice(0, 3)}-${v.slice(3, 7)}-${v.slice(7)}` : v.length > 3 ? `${v.slice(0, 3)}-${v.slice(3)}` : v; });
async function submitForm() {
  const name = $("c_name").value.trim(), phone = $("c_phone").value.replace(/[^0-9]/g, "");
  if (!name) return alert("성함을 입력해 주세요."), $("c_name").focus();
  if (phone.length < 10) return alert("휴대폰 번호를 확인해 주세요."), $("c_phone").focus();
  if (!$("c_consent").checked) return alert("동의 항목을 확인해 주세요.");
  const btn = $("c_submit"); btn.disabled = true; btn.textContent = "전달 중…";
  const body = { k, company: $("c_company").value.trim(), name, title: $("c_title").value, phone, email: $("c_email").value.trim(),
    topics: [...document.querySelectorAll("#c_topics input:checked")].map((x) => x.value), time: document.querySelector('input[name="c_time"]:checked')?.value || "", message: $("c_msg").value.trim(), consent: true };
  try {
    const r = await fetch(`${FN}/itCeoConsult`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }); const j = await r.json();
    if (!j.ok) throw new Error(j.error || "send");
    $("frm").hidden = true; $("frmDone").hidden = false; $("doneName").textContent = name;
  } catch (e) { alert("전달에 실패했습니다. 잠시 후 다시 시도해 주세요."); btn.disabled = false; btn.textContent = "상담 요청 보내기"; }
}
$("ov").addEventListener("click", (e) => { if (e.target === $("ov")) closeForm(); });
load();
</script>
</body>
</html>
