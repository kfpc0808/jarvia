<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- ★ [2026-10-19] 오늘의 이야기 — 「오늘의 영업주제」 고객용 화면 (mypb.kr/story.html)
     데이터: stStory(salesTalk.js) — 게시된 카드의 고객용 문안만 받는다. 회원용 내용(대화·귀결·준비물)은 서버가 내보내지 않는다.
     주소: story.html?s=주제코드(날짜가 드러나지 않는 코드 · 예전 YYYY-MM-DD_job|age 도 가능)&fc=회원아이디&x=cd,mc,bz(함께 볼 자료)&mk=컨센서스 서명키&c=고객구분
     고객 화면 — 플랫폼 이름을 쓰지 않는다. -->
<title>오늘의 이야기</title>
<meta name="robots" content="noindex">
<script>window.JV_CUST="https://mypb.kr";</script>   <!-- 고객에게 가는 링크의 주소(중립 도메인) — 바꿀 때는 이 한 줄만 -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&family=Noto+Serif+KR:wght@700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0C2147;--gold:#C9A96E;--gold2:#E3C58B;--ink:#1B2433;--ink2:#56607A;--line:#E4E7EE;--bg:#F3F4F8}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);font-family:'Noto Sans KR',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;color:var(--ink);line-height:1.7;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere}
.wrap{max-width:560px;margin:0 auto;background:#fff;min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
.hero{background:linear-gradient(160deg,#0C2147 0%,#16325E 100%);color:#fff;padding:26px 22px 28px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-80px;top:-80px;width:260px;height:260px;border-radius:50%;border:1px solid rgba(201,169,110,.35);pointer-events:none}
.kick{font-size:12px;font-weight:800;letter-spacing:3px;color:var(--gold2)}
.date{font-size:12.5px;color:#AFC0D8;margin-top:2px}
.hero h1{font-family:'Noto Serif KR',serif;font-size:26px;line-height:1.4;margin:14px 0 12px;letter-spacing:-.5px}
.lead{font-size:15.5px;color:#DCE4F0;margin:0}.lead b{color:var(--gold2)}
.from{display:flex;align-items:center;gap:10px;margin-top:20px;padding-top:16px;border-top:1px solid rgba(255,255,255,.15)}
.av{flex:none;width:40px;height:40px;border-radius:50%;border:2px solid var(--gold);background:#22406E center 22%/cover no-repeat;display:flex;align-items:center;justify-content:center;color:var(--gold2);font-weight:800}
.from div{font-size:13px;color:#C8D3E3}.from b{color:#fff;font-size:14px}
.sec{padding:26px 22px 4px}
.sh{font-size:12px;font-weight:800;letter-spacing:2px;color:var(--gold);margin-bottom:6px}
.st{font-size:19px;font-weight:800;margin:0 0 14px;letter-spacing:-.3px;line-height:1.45}
.pt{display:flex;gap:12px;margin-bottom:16px}
.pt i{flex:none;width:28px;height:28px;border-radius:50%;background:var(--navy);color:var(--gold2);font-style:normal;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:14px;margin-top:2px}
.pt h3{font-size:16px;margin:0 0 3px;line-height:1.5}.pt p{margin:0;font-size:14.5px;color:var(--ink2)}
.law{display:inline-block;margin-top:6px;font-size:12px;color:#2C5AA0;background:#EEF3FB;border-radius:6px;padding:2px 8px}
.num{border:1px solid var(--line);border-radius:14px;overflow:hidden}
.nr{display:flex;justify-content:space-between;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);font-size:14.5px}.nr b{white-space:nowrap}
.nt{background:var(--navy);color:#fff;border:0}.nt b{color:var(--gold2);font-size:17px}
.cap{font-size:12px;color:#8A93A8;margin:8px 2px 0}
.ck{background:#FBF7EE;border:1px solid #EADBB9;border-radius:14px;padding:14px 16px 4px}
.ckn{font-size:13.5px;color:#7A5A1E;font-weight:700;margin:2px 0 10px}
.ck label{display:flex;gap:10px;align-items:flex-start;font-size:15px;margin-bottom:12px;cursor:pointer}
.ck input{flex:none;width:20px;height:20px;margin:3px 0 0;accent-color:var(--navy)}
.ckr{display:none;margin:0 0 12px;font-size:13.5px;font-weight:700;color:var(--navy)}
.how{background:linear-gradient(135deg,#F6F8FC,#EEF2F9);border-radius:14px;padding:18px 16px}.how p{margin:0;font-size:15px}
.cta{padding:24px 22px 8px}
.card{border:1.5px solid var(--gold);border-radius:18px;padding:16px;display:flex;gap:14px;align-items:center}
.card .av{width:64px;height:64px;font-size:24px}
.card .nm{font-size:17px;font-weight:800}.card .nm small{font-size:13px;color:#A8854A;margin-left:6px}
.card .co{font-size:13px;color:var(--ink2)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.b{display:block;border:0;border-radius:12px;padding:14px 0;font-size:15px;font-weight:800;text-align:center;text-decoration:none;font-family:inherit;line-height:1.35}
.b1{grid-column:1/-1;background:var(--navy);color:#fff}.b1 small{display:block;font-size:12px;font-weight:500;color:var(--gold2);margin-top:2px}
.b2{background:#F1F3F7;color:var(--navy)}
.kmsg{margin:10px 0 0;background:#FBF7EE;border-left:3px solid var(--gold);border-radius:0 10px 10px 0;padding:10px 12px;font-size:14.5px;font-weight:700;color:#5B4416}
/* 상담 신청서 (고객 레터와 같은 구성) */
.form{display:none;margin-top:12px;border:1px solid var(--line);border-radius:16px;padding:16px}
.form.on{display:block}
.form h3{margin:0 0 4px;font-size:16px}.form .fs{margin:0 0 12px;font-size:13px;color:var(--ink2)}
.fl{display:block;font-size:13px;font-weight:700;color:var(--ink2);margin-bottom:12px}
.fl input,.fl textarea{display:block;width:100%;margin-top:6px;font:inherit;font-size:16px;font-weight:400;color:var(--ink);border:1px solid #D5DBE5;border-radius:10px;padding:11px 12px;background:#fff}
.fl small{font-weight:400;color:#8A93A8}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}
.slot{border:1px solid #D5DBE5;background:#fff;border-radius:10px;padding:10px 0;font:inherit;font-size:14px;font-weight:700;color:var(--ink2)}
.slot[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.ckmine{background:#FBF7EE;border-radius:10px;padding:9px 12px;font-size:13px;color:#7A5A1E;margin-bottom:12px;display:none}
.agree{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:10px;background:#F6F8FC;margin-bottom:10px}
.agree input{flex:none;width:20px;height:20px;margin:2px 0 0;accent-color:var(--navy)}
.agree label{font-size:13px;font-weight:700;line-height:1.55}
.agree .mo{border:0;background:none;padding:0;margin-left:4px;font:inherit;font-size:12px;color:var(--ink2);text-decoration:underline}
.agree ul{display:none;margin:8px 0 0;padding-left:16px;font-size:12px;line-height:1.65;color:var(--ink2)}.agree ul.on{display:block}
.ferr{display:none;color:#C62828;font-size:13px;font-weight:700;margin-bottom:8px}.ferr.on{display:block}
.submit{width:100%;border:0;border-radius:12px;background:var(--navy);color:#fff;font:inherit;font-size:16px;font-weight:800;padding:15px 0}
.submit:disabled{opacity:.6}
.done{display:none;margin-top:12px;text-align:center;border:1.5px solid var(--gold);border-radius:16px;padding:22px 16px}
.done.on{display:block}.done .ok{width:46px;height:46px;border-radius:50%;background:var(--navy);color:var(--gold2);font-size:24px;display:flex;align-items:center;justify-content:center;margin:0 auto 10px}
.done b{display:block;font-size:17px}.done span{font-size:14px;color:var(--ink2)}
.letter{margin:20px 22px 0;background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px 12px;box-shadow:0 2px 10px rgba(12,33,71,.05)}
.letter .to{font-size:14px;font-weight:800;color:var(--navy);margin-bottom:6px}
.letter p{margin:0;font-size:15px;line-height:1.8;white-space:pre-line}
.letter .sign{margin-top:8px;text-align:right;font-size:13px;font-weight:700;color:#9E7F45}
.pvbar{position:sticky;top:0;z-index:20;background:#FFF4CC;color:#6B5300;font-size:12px;font-weight:700;text-align:center;padding:7px 12px;line-height:1.5}
.more{padding:22px 22px 6px}
.tile{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;text-decoration:none;color:var(--ink)}
.tile .ic{flex:none;width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px}
.tile b{display:block;font-size:15px}.tile span{font-size:12.5px;color:var(--ink2)}.tile em{margin-left:auto;font-style:normal;color:var(--gold);font-weight:800;font-size:18px}
.note{margin:18px 22px 0;background:#FFF5F4;border-radius:12px;padding:12px 14px;font-size:12.5px;color:#7A2E26;line-height:1.65}
.note p{margin:0}.note p+p{margin-top:4px}
.foot{padding:16px 22px 40px;font-size:11.5px;color:#9AA2B4;line-height:1.6}
.msg{padding:80px 24px;text-align:center;color:var(--ink2);font-size:15px}
.sk{height:14px;border-radius:7px;background:linear-gradient(90deg,#EEF0F4,#F7F8FA,#EEF0F4);background-size:200% 100%;animation:sk 1.2s infinite;margin:10px 22px}
@keyframes sk{to{background-position:-200% 0}}
</style></head>
<body><div class="wrap" id="app">
  <div class="hero" style="min-height:220px"><div class="kick">TODAY'S STORY</div></div>
  <div class="sk" style="width:40%;margin-top:26px"></div><div class="sk"></div><div class="sk" style="width:80%"></div>
</div>
<script>
(function(){
  var API='https://asia-northeast3-jarvia-platform.cloudfunctions.net/stStory';
  var q=new URLSearchParams(location.search);
  var sid=q.get('s')||'', fcId=q.get('fc')||'', cId=q.get('c')||'', mk=q.get('mk')||'';
  var xs=(q.get('x')===null?'cd':q.get('x')).split(/[,.]/).filter(Boolean);   /* x 가 없는 예전 링크 = 고객 리포트만 */
  var CUST=window.JV_CUST||location.origin;
  var PV=q.get('pv')==='1';   /* 관리자 미리보기 — 신청은 접수하지 않는다 */
  var REQ_API='https://asia-northeast3-jarvia-platform.cloudfunctions.net/stStoryRequest';
  var app=document.getElementById('app');
  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
  function rich(s){return esc(s).replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');}   /* **구절** → 강조 */
  function fail(t){app.innerHTML='<div class="msg">'+esc(t)+'</div>';}
  if(!/^(\d{4}-\d{2}-\d{2}_(job|age)|[0-9a-z]{3,7})$/.test(sid)){fail('주소가 올바르지 않습니다.');return;}
  fetch(API+'?s='+encodeURIComponent(sid)+'&fc='+encodeURIComponent(fcId)+(PV?'&_='+Date.now():'')).then(function(r){return r.json();}).then(function(d){
    if(!d||!d.ok){fail(d&&d.error==='없는 이야기'?'지금은 볼 수 없는 이야기입니다.':'잠시 후 다시 열어 주세요.');return;}
    render(d);
  }).catch(function(){fail('잠시 후 다시 열어 주세요.');});

  function render(d){
    var c=d.cust, f=d.fc||{};
    var who=f.name?(f.name+(f.title?' '+f.title:'')):'담당 컨설턴트';
    var ini=(f.name||'✦').slice(0,1);
    var av=function(cls){return '<span class="av '+(cls||'')+'"'+(f.photoUrl?' style="background-image:url(\''+esc(f.photoUrl)+'\')"':'')+'>'+(f.photoUrl?'':esc(ini))+'</span>';};
    var title=(c&&c.hook)||d.title||'오늘의 이야기';
    document.title=title;
    var h='';
    h+='<div class="hero"><div class="kick">TODAY\'S STORY</div><div class="date">'+(c&&c.audienceLine?esc(c.audienceLine):'')+'</div>'
      +'<h1>'+esc(title)+'</h1>'
      +'<p class="lead">'+(c?rich(c.lead):'담당 컨설턴트가 고객님께 전해 드리는 오늘의 이야기입니다.<br>궁금한 점은 편하게 물어봐 주세요.')+'</p>'
      +'<div class="from">'+av()+'<div><b>'+esc(who)+'</b>'+(f.company?' · '+esc(f.company):'')+'<br>고객님께 꼭 전하고 싶은 오늘의 이야기</div></div></div>';
    /* ★ [2026-10-19] 회원이 쓴 「고객님께」 한마디 — 고객 레터의 개인 메시지와 같은 자리 */
    if(d.note&&d.note.msg)h+='<div class="letter"><div class="to">고객님께</div><p>'+esc(d.note.msg)+'</p>'+(d.note.name?'<div class="sign">'+esc(d.note.name)+' 드림</div>':'')+'</div>';
    if(c){
      h+='<div class="sec"><div class="sh">KEY POINTS</div><h2 class="st">꼭 알아 두실 '+(c.points||[]).length+'가지</h2>'
        +(c.points||[]).map(function(p,i){return '<div class="pt"><i>'+(i+1)+'</i><div><h3>'+esc(p.title)+'</h3><p>'+rich(p.body)+'</p>'+(p.law?'<span class="law">'+esc(p.law)+'</span>':'')+'</div></div>';}).join('')+'</div>';
      if(c.numbers&&c.numbers.rows&&c.numbers.rows.length){
        h+='<div class="sec"><div class="sh">IN NUMBERS</div><h2 class="st">'+esc(c.numbers.title||'숫자로 보면')+'</h2><div class="num">'
          +c.numbers.rows.map(function(r){return '<div class="nr"><span>'+esc(r.label)+'</span><b>'+esc(r.value)+'</b></div>';}).join('')
          +(c.numbers.total?'<div class="nr nt"><span>'+esc(c.numbers.total.label)+'</span><b>'+esc(c.numbers.total.value)+'</b></div>':'')
          +'</div><p class="cap">'+esc(c.numbers.caption||'이해를 돕기 위한 단순 예시입니다.')+'</p>'
          +(c.numbers.key?'<p class="kmsg">💡 '+esc(c.numbers.key)+'</p>':'')+'</div>';
      }
      if(c.checklist&&c.checklist.length){
        h+='<div class="sec"><div class="sh">SELF CHECK</div><h2 class="st">나도 해당될까요?</h2><div class="ck"><div class="ckn">하나라도 해당되면 한 번 확인해 보세요</div>'
          +c.checklist.map(function(x){return '<label><input type="checkbox">'+esc(x)+'</label>';}).join('')
          +'<div class="ckr" id="ckr">✔ 확인해 볼 만한 상황이에요. 아래에서 편하게 점검을 신청해 보세요.</div></div></div>';
      }
      if(c.how)h+='<div class="sec"><div class="sh">HOW TO CHECK</div><h2 class="st">확인은 어렵지 않습니다</h2><div class="how"><p>'+rich(c.how)+'</p></div></div>';
    }
    /* 담당자 */
    /* 담당자를 확인하지 못한 링크(d.fc 없음)는 상담·전화 버튼을 내지 않는다 */
    var tel=String(f.phone||'').replace(/[^\d]/g,''), hasFc=!!d.fc;
    var ctaMain=(c&&c.cta&&c.cta.main)||'무료 상담 신청', ctaSub=(c&&c.cta&&c.cta.sub)||'편하게 물어봐 주세요';
    if(hasFc){
      h+='<div class="cta" id="ctaBox"><div class="card">'+av()+'<div><div class="nm">'+esc(f.name||'담당 컨설턴트')+(f.title?'<small>'+esc(f.title)+'</small>':'')+'</div><div class="co">'+esc([f.company,f.phone].filter(Boolean).join(' · '))+'</div></div></div>'
        +'<div class="btns"><button type="button" class="b b1" id="ctaBtn">📋 '+esc(ctaMain)+'<small>'+esc(ctaSub)+'</small></button>'
        +(tel?'<a class="b b2" href="tel:'+tel+'">📞 전화하기</a><a class="b b2" href="sms:'+tel+'">💬 문자 보내기</a>':'')+'</div>'
        +'<form class="form" id="form" novalidate><h3>'+esc(ctaMain)+'</h3><p class="fs">'+esc(f.name||'담당')+' 컨설턴트가 직접 연락드립니다. 비용 부담 없이 짧은 통화로 시작합니다.</p>'
        +'<div class="ckmine" id="ckMine"></div>'
        +'<label class="fl">성함<input type="text" id="fName" maxlength="20" autocomplete="name"></label>'
        +'<label class="fl">연락처<input type="tel" id="fPhone" inputmode="numeric" autocomplete="tel" placeholder="010-0000-0000" maxlength="13"></label>'
        +'<div class="fl">통화 편한 시간<div class="slots" role="group" aria-label="통화 편한 시간"><button type="button" class="slot" data-slot="오전" aria-pressed="false">오전</button><button type="button" class="slot" data-slot="오후" aria-pressed="true">오후</button><button type="button" class="slot" data-slot="저녁" aria-pressed="false">저녁</button></div></div>'
        +'<label class="fl">남기실 말씀 <small>선택 · 200자</small><textarea id="fMemo" rows="3" maxlength="200"></textarea></label>'
        +'<div class="agree"><input type="checkbox" id="fAgree"><div><label for="fAgree">[필수] 개인정보 수집·이용에 동의합니다</label><button type="button" class="mo" id="agMore" aria-expanded="false">내용 보기</button>'
        +'<ul id="agBody"><li>수집 항목: 성함, 휴대폰 번호, 통화 편한 시간, 남기신 말씀, 체크하신 항목</li><li>이용 목적: 상담 신청 확인 및 상담 연락</li><li>제공 대상: 담당 '+esc(f.name||'')+' 컨설턴트</li><li>보유 기간: 상담 목적 달성 시까지 (법령에 따라 보관이 필요한 경우 그 기간)</li><li>동의하지 않으실 수 있으며, 이 경우 상담 신청은 접수되지 않습니다.</li></ul></div></div>'
        +'<div class="ferr" id="fErr" role="alert"></div><button type="submit" class="submit" id="fSubmit">신청하기</button></form>'
        +'<div class="done" id="done"><div class="ok">✓</div><b>신청이 접수되었습니다</b><span id="doneMsg"></span></div></div>';
    }
    /* 함께 보시면 좋은 자료 — 회원이 메시지에 체크한 것만 */
    var tiles=[];
    if(xs.indexOf('cd')>=0&&fcId)tiles.push({u:CUST+'/client-daily?fc='+encodeURIComponent(fcId)+(cId?'&c='+encodeURIComponent(cId):''),ic:'📰',bg:'#EEF3FB',t:'오늘의 생활·경제 리포트',s:'아침 5분, 꼭 알아야 할 소식'});
    if(xs.indexOf('mc')>=0&&fcId&&/^[0-9a-z]{1,12}\.[0-9a-f]{10}$/.test(mk))tiles.push({u:CUST+'/briefing?fc='+encodeURIComponent(fcId)+'&t=mc&k='+encodeURIComponent(mk)+(cId?'&c='+encodeURIComponent(cId):''),ic:'🧭',bg:'#F6F1E6',t:'모닝 컨센서스',s:'증권가가 보는 오늘의 시장'});
    if(xs.indexOf('bz')>=0&&/^https?:\/\//i.test(d.bz||''))tiles.push({u:d.bz,ic:'📚',bg:'#EEF7F2',t:'이번 주 아침독서',s:'이번 주 도서 요약'});
    if(tiles.length)h+='<div class="more"><div class="sh">MORE FOR YOU</div><h2 class="st" style="margin-bottom:12px">함께 보시면 좋은 자료</h2>'
      +tiles.map(function(t){return '<a class="tile" href="'+esc(t.u)+'"'+(/^https?:\/\/(www\.)?mypb\.kr/i.test(t.u)?'':' target="_blank" rel="noopener"')+'><span class="ic" style="background:'+t.bg+'">'+t.ic+'</span><div><b>'+esc(t.t)+'</b><span>'+esc(t.s)+'</span></div><em>›</em></a>';}).join('')+'</div>';
    if(c&&c.cautions&&c.cautions.length)h+='<div class="note">'+c.cautions.map(function(x){return '<p>· '+esc(x)+'</p>';}).join('')+'</div>';
    h+='<div class="foot">이 글은 일반적인 정보 제공을 위한 것으로, 개별 상황에 대한 법률·세무 자문이 아닙니다. 작성 시점의 법령·제도를 기준으로 하며, 이후 바뀔 수 있습니다.</div>';   /* ★ 날짜 표시 없음 */
    if(PV)h='<div class="pvbar">미리보기 — 고객에게는 이 띠가 보이지 않으며, 상담 신청이 접수되지 않습니다</div>'+h;
    app.innerHTML=h;
    if(PV&&window.parent!==window){   /* 회원 화면에 끼워 볼 때 — 화면 전체 높이를 알려 잘림 없이 보이게 */
      var post=function(){try{window.parent.postMessage({type:'storyH',h:document.documentElement.scrollHeight},'*');}catch(_){}};
      post();setTimeout(post,400);setTimeout(post,1500);
      try{new ResizeObserver(post).observe(document.body);}catch(_){window.addEventListener('resize',post);}
    }
    var ck=app.querySelector('.ck');
    if(ck)ck.addEventListener('change',function(){var r=document.getElementById('ckr');if(r)r.style.display=ck.querySelector('input:checked')?'block':'none';});
    if(hasFc)bindForm(f,c);
  }
  /* ★ 상담 신청 — 화면 안에서 바로 (stStoryRequest). 체크한 항목은 번호만 보내고 서버가 문장으로 바꾼다 */
  function bindForm(f,c){
    var $=function(id){return document.getElementById(id);};
    var slot='오후',sending=false,sent=false;
    function picks(){return [].slice.call(app.querySelectorAll('.ck input[type=checkbox]')).map(function(x,i){return x.checked?i:-1;}).filter(function(i){return i>=0;});}
    function ferr(t){var e=$('fErr');e.textContent=t||'';e.classList.toggle('on',!!t);}
    function open(){
      if(sent){$('done').scrollIntoView({behavior:'smooth',block:'center'});return;}
      var p=picks(),m=$('ckMine');
      if(p.length&&c&&c.checklist){m.innerHTML='✔ 체크하신 항목도 함께 전달됩니다<br>'+p.map(function(i){return '· '+esc(c.checklist[i]);}).join('<br>');m.style.display='block';}else m.style.display='none';
      $('form').classList.add('on');$('ctaBtn').style.display='none';
      $('form').scrollIntoView({behavior:'smooth',block:'start'});
      setTimeout(function(){try{$('fName').focus({preventScroll:true});}catch(_){}},350);
    }
    $('ctaBtn').addEventListener('click',open);
    app.querySelector('.slots').addEventListener('click',function(e){var b=e.target.closest('.slot');if(!b)return;slot=b.getAttribute('data-slot');[].forEach.call(app.querySelectorAll('.slot'),function(x){x.setAttribute('aria-pressed',x===b?'true':'false');});});
    $('agMore').addEventListener('click',function(){var o=$('agBody').classList.toggle('on');this.setAttribute('aria-expanded',o?'true':'false');this.textContent=o?'접기':'내용 보기';});
    $('fPhone').addEventListener('input',function(e){var d=e.target.value.replace(/\D/g,'').slice(0,11);e.target.value=d.length<4?d:d.length<8?d.slice(0,3)+'-'+d.slice(3):d.slice(0,3)+'-'+d.slice(3,d.length-4)+'-'+d.slice(-4);});
    $('form').addEventListener('submit',function(e){
      e.preventDefault();if(sending||sent)return;
      var name=$('fName').value.trim(),phone=$('fPhone').value.replace(/\D/g,''),memo=$('fMemo').value.trim();
      if(!name){ferr('성함을 입력해 주세요.');$('fName').focus();return;}
      if(!/^01\d{8,9}$/.test(phone)){ferr('휴대폰 번호를 정확히 입력해 주세요.');$('fPhone').focus();return;}
      if(!$('fAgree').checked){ferr('개인정보 수집·이용에 동의해 주세요.');$('fAgree').focus();return;}
      if(PV){ferr('미리보기 화면에서는 신청이 접수되지 않습니다.');return;}
      ferr('');sending=true;var btn=$('fSubmit');btn.disabled=true;btn.textContent='보내는 중…';
      fetch(REQ_API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({data:{s:sid,fc:fcId,c:cId,name:name,phone:phone,slot:slot,memo:memo,agree:true,checks:picks()}})})
        .then(function(r){return r.json();}).then(function(j){
          var r=(j&&j.result)||{};
          if(!r.ok){ferr(r.message||'전송에 실패했습니다. 잠시 후 다시 시도해 주세요.');return;}
          sent=true;$('form').classList.remove('on');
          $('doneMsg').textContent=(r.member||f.name||'담당')+' 컨설턴트가 '+slot+'에 연락드리겠습니다.';
          $('done').classList.add('on');$('done').scrollIntoView({behavior:'smooth',block:'center'});
        }).catch(function(){ferr('전송에 실패했습니다. 잠시 후 다시 시도해 주세요.');})
        .then(function(){sending=false;btn.disabled=false;btn.textContent='신청하기';});
    });
  }
})();
</script>
</body></html>
