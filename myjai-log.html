<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1B3A5C">
<meta name="robots" content="noindex,nofollow">
<title>내 업무 기록 — JARVIA</title>
<!-- ═══════════════════════════════════════════════════════════
     🗂 내 업무 기록 (MyJai) — 2026-11-28
     · 데이터: mj_log/{uid}/items — 커넥터(MyJai)가 쓰고, 이 화면은 mjLog 함수로만 읽는다(90일 보관 · 전화번호 없음)
     · 대기 건 처리는 내 플랫폼(fc.html) 업무함에서 한다 — 이 화면은 보기 전용
     · 진입: index.html 메인 버튼·마이페이지 탭 / fc.html 상단 버튼·업무함 「지난 기록 보기」 / MyJai 「자비아에서 보기」
     · PC: 필터 · 목록 · 상세 3칸 / 모바일(≤860px): 한 줄로 쌓이고 상세는 목록 안에서 펼침
     ═══════════════════════════════════════════════════════════ -->
<style>
:root{--navy:#1B3A5C;--gold:#C9A96E;--ink:#1E2A3C;--sub:#57637A;--mut:#96A3B8;--line:#E5EAF1;--bg:#F4F6FA;--card:#fff;
--blue:#2E5D8C;--blueBg:#EAF1F8;--amber:#8A6420;--amberBg:#FBF1DE;--green:#0E6B4A;--greenBg:#E4F2EA;--purp:#6B4A8E;--purpBg:#F1EBF6;--red:#B03A2E;--redBg:#FDECEC;--aqua:#0F6E78;--aquaBg:#E2F4F5;--gray:#5A6484;--grayBg:#EEF1F5}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif;-webkit-text-size-adjust:100%;word-break:keep-all;overflow-wrap:anywhere}
button{font-family:inherit;cursor:pointer}
.hd{background:var(--navy);color:#fff;padding:12px 16px calc(12px) ;position:sticky;top:0;z-index:20}
.hd-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.hd-t{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;min-width:0}
.hd-t b{font-size:17px}.hd-t span{font-size:12px;opacity:.78}
.hd-r{display:flex;gap:8px;align-items:center}
.mo{display:flex;align-items:center;border:1px solid rgba(255,255,255,.35);border-radius:8px;overflow:hidden}
.mo button{background:none;border:0;color:#fff;padding:5px 9px;font-size:13px}.mo span{font-size:13px;padding:0 4px;white-space:nowrap}
.hb{background:var(--gold);color:var(--navy);border:0;border-radius:8px;padding:6px 11px;font-size:12.5px;font-weight:700;text-decoration:none;white-space:nowrap}
.wrap{max-width:1180px;margin:0 auto;padding:12px 12px 40px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.tile .l{font-size:12px;color:var(--sub)}.tile .n{font-size:21px;font-weight:800;margin-top:2px}.tile .n small{font-size:12px;font-weight:600;margin-left:2px}
.tile.warn{background:var(--amberBg);border-color:#EED9AE}.tile.warn .l,.tile.warn .n{color:var(--amber)}
.sumline{font-size:12px;color:var(--sub);margin:8px 2px 0;line-height:1.6}
.pend{display:none;margin-top:10px;background:var(--amberBg);border:1px solid #EED9AE;border-radius:10px;padding:10px 12px;font-size:13px;color:var(--amber);align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.pend a{background:var(--navy);color:#fff;text-decoration:none;border-radius:8px;padding:7px 12px;font-size:12.5px;font-weight:700;white-space:nowrap}
.grid{display:grid;grid-template-columns:150px minmax(0,1.3fr) minmax(0,1fr);gap:12px;margin-top:12px;align-items:start}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px}
.flt{padding:10px 8px}
.flt .cap{font-size:11.5px;color:var(--mut);margin:2px 8px 6px}
.fi{display:flex;justify-content:space-between;width:100%;background:none;border:0;border-radius:8px;padding:7px 9px;font-size:13px;color:var(--ink);text-align:left}
.fi.on{background:var(--blueBg);color:var(--navy);font-weight:800}
.fi i{font-style:normal;color:var(--mut);font-size:12px}
.lst{padding:10px 12px 14px;min-width:0}
.srch{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;font-size:13.5px;font-family:inherit}
.day{display:flex;justify-content:space-between;align-items:center;width:100%;background:none;border:0;padding:12px 4px 4px;font-size:13px;font-weight:800;color:var(--sub)}
.day.closed + .rows{display:none}
.row{display:flex;gap:10px;align-items:center;width:100%;background:none;border:0;border-radius:9px;padding:9px 8px;text-align:left;color:var(--ink)}
.row:hover{background:#F6F8FB}.row.sel{background:var(--blueBg);box-shadow:inset 0 0 0 1px #C9D9EA}
.ic{width:30px;height:30px;flex:0 0 30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px}
.rt{flex:1;min-width:0}.rt b{display:block;font-size:13.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rt span{display:block;font-size:12px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.st{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;flex:0 0 auto}
.inl{display:none;margin:2px 4px 8px 48px;padding:10px 12px;background:#F6F8FB;border-radius:9px;font-size:12.5px;line-height:1.7;color:var(--sub)}
.det{padding:16px;position:sticky;top:70px;min-width:0}
.det h3{margin:0;font-size:15px;color:var(--navy)}
.kv{display:flex;gap:10px;font-size:13px;line-height:1.8}.kv span:first-child{flex:0 0 74px;color:var(--sub)}.kv span:last-child{flex:1;min-width:0}
.acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.acts a{flex:1;min-width:120px;text-align:center;text-decoration:none;border-radius:9px;padding:10px;font-size:13px;font-weight:700;border:1px solid var(--line);color:var(--navy);background:#fff}
.acts a.p{background:var(--navy);color:#fff;border-color:var(--navy)}
.empty{text-align:center;color:var(--sub);font-size:13.5px;padding:36px 10px;line-height:1.8}
.gate{max-width:420px;margin:60px auto;background:#fff;border:1px solid var(--line);border-radius:14px;padding:26px 22px;text-align:center;font-size:14px;line-height:1.8;color:var(--sub)}
.gate a{display:inline-block;margin-top:12px;background:var(--navy);color:#fff;text-decoration:none;border-radius:9px;padding:10px 18px;font-weight:700}
.note{font-size:11.5px;color:var(--mut);margin:14px 4px 0;line-height:1.6}
@media (max-width:860px){
  .grid{grid-template-columns:minmax(0,1fr)}
  .flt{display:flex;gap:6px;overflow-x:auto;padding:8px;-webkit-overflow-scrolling:touch}
  .flt .cap{display:none}
  .fi{width:auto;flex:0 0 auto;border:1px solid var(--line);border-radius:999px;padding:6px 12px;gap:6px;white-space:nowrap}
  .det{display:none}
  .row.sel{background:none;box-shadow:none}
  .row.sel + .inl{display:block}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:380px){.hd-t span{display:none}.tile .n{font-size:19px}}
</style>
</head>
<body>
<div class="hd"><div class="hd-in">
  <div class="hd-t"><b>🗂 내 업무 기록</b><span>MyJai가 정리하고 회원님이 처리한 일 · 90일 보관</span></div>
  <div class="hd-r">
    <div class="mo"><button type="button" id="moPrev" aria-label="이전 달">‹</button><span id="moLbl">-</span><button type="button" id="moNext" aria-label="다음 달">›</button></div>
    <a class="hb" id="goHome" href="index.html">자비아</a>
  </div>
</div></div>
<div class="wrap" id="app" style="display:none">
  <div class="tiles">
    <div class="tile"><div class="l" id="tMoL">이번 달 전체</div><div class="n"><span id="tAll">0</span><small>건</small></div></div>
    <div class="tile"><div class="l">반영·등록</div><div class="n"><span id="tApp">0</span><small>건</small></div></div>
    <div class="tile"><div class="l">자동 처리·링크</div><div class="n"><span id="tAuto">0</span><small>건</small></div></div>
    <div class="tile warn"><div class="l">업무함 대기</div><div class="n"><span id="tPend">0</span><small>건</small></div></div>
  </div>
  <div class="sumline" id="sumLine"></div>
  <div class="pend" id="pendBar"><span id="pendTxt"></span><a id="pendGo" href="#">업무함에서 처리하기 ›</a></div>
  <div class="grid">
    <div class="box flt" id="flt"></div>
    <div class="box lst"><input class="srch" id="q" placeholder="고객 이름으로 찾기" autocomplete="off"><div id="list"></div></div>
    <div class="box det" id="det"><div class="empty">왼쪽 목록에서 기록을 고르면<br>자세한 내용이 여기에 보입니다.</div></div>
  </div>
  <div class="note">· MyJai(Claude 등 AI)에서 실행한 일만 기록됩니다. 고객 연락처는 기록하지 않습니다.<br>· 원본(고객 카드·업무일지·AI 보관함·고객 요청)은 각 화면에 그대로 있습니다.</div>
</div>
<div class="gate" id="gate">불러오는 중…</div>

<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import{getAuth,onAuthStateChanged,setPersistence,browserLocalPersistence}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import{getFirestore,doc,getDoc}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
import{getFunctions,httpsCallable}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-functions.js';

const FC={apiKey:"AIzaSyBD9p-bf162RiiD1Y3BsY-NvbYjpOSrzmg",authDomain:"jarvia-platform.firebaseapp.com",projectId:"jarvia-platform",storageBucket:"jarvia-platform.firebasestorage.app",messagingSenderId:"388025068900",appId:"1:388025068900:web:09ba8e12e9e9e2ec49de71"};
const app=initializeApp(FC);
const db=getFirestore(app,'javia-db');
const auth=getAuth(app);
const fns=getFunctions(app,'asia-northeast3');
setPersistence(auth,browserLocalPersistence).catch(()=>{});   // index.html과 동일 — 세션 공유
const mjLog=httpsCallable(fns,'mjLog');

const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ST={pending:['대기','var(--amberBg)','var(--amber)'],applied:['반영됨','var(--greenBg)','var(--green)'],discarded:['버림','var(--grayBg)','var(--gray)'],done:['처리됨','var(--greenBg)','var(--green)'],auto:['자동 처리','var(--blueBg)','var(--blue)'],made:['만듦','var(--aquaBg)','var(--aqua)'],expired:['기간 지남','var(--grayBg)','var(--gray)']};
const KI={'고객 등록':['👤','var(--blueBg)'],'고객 메모':['📝','var(--amberBg)'],'통화 정리':['📞','var(--greenBg)'],'업무일지':['📋','var(--greenBg)'],'이지메모':['🗒','var(--amberBg)'],'보관함 저장':['🗄','var(--purpBg)'],'보관함':['🗄','var(--purpBg)'],'알림톡 발송':['💬','var(--purpBg)'],'예약 발송':['⏰','var(--purpBg)'],'고객 요청':['📥','var(--blueBg)'],'만기 등록':['📅','var(--amberBg)'],'제안서':['📑','var(--blueBg)'],'지원사업':['🏢','var(--greenBg)'],'이너서클':['🤝','var(--purpBg)'],'링크':['🔗','var(--aquaBg)']};
const WD='일월화수목금토';
let me=null,loginId='',ym='',data=null,kind='전체',sel='';

function kstYm(ms){const d=new Date((ms||Date.now())+9*3600000);return d.getUTCFullYear()+String(d.getUTCMonth()+1).padStart(2,'0');}
function ymShift(v,n){let y=+v.slice(0,4),m=+v.slice(4,6)+n;while(m<1){m+=12;y--;}while(m>12){m-=12;y++;}return y+String(m).padStart(2,'0');}
function kd(ms){const d=new Date(ms+9*3600000);return {md:(d.getUTCMonth()+1)+'/'+d.getUTCDate(),wd:WD[d.getUTCDay()],hm:String(d.getUTCHours()).padStart(2,'0')+':'+String(d.getUTCMinutes()).padStart(2,'0'),day:d.getUTCFullYear()+'-'+(d.getUTCMonth()+1)+'-'+d.getUTCDate()};}
function inboxUrl(){return 'fc.html?id='+encodeURIComponent(loginId)+'&mjinbox=1';}
function linksOf(it){
  if(it.status==='pending')return it.kind==='제안서'?[['제안서AI 열기','index.html',1]]:[['업무함에서 처리하기',inboxUrl(),1]];
  const k=it.kind;
  if(k==='통화 정리'||k==='업무일지')return [['업무일지 열기','worklog.html',1]];
  if(k==='고객 등록'||k==='고객 메모')return [['내 고객 열기','fc.html?id='+encodeURIComponent(loginId),1]];
  if(k==='고객 요청')return [['고객 요청 열기','index.html?action=requests',1]];
  if(k==='이지메모')return [['이지메모 열기','memo.html',1]];
  return [];
}

onAuthStateChanged(auth,async user=>{
  if(!user){$('gate').innerHTML='자비아 <b>로그인 후</b> 볼 수 있습니다.<br><a href="index.html">자비아에서 로그인</a>';return;}
  me=user;
  try{const ud=await getDoc(doc(db,'users',user.uid));loginId=((ud.exists()&&ud.data())||{}).loginId||'';}catch(_e){}
  const q=new URLSearchParams(location.search);
  ym=/^\d{6}$/.test(q.get('ym')||'')?q.get('ym'):kstYm();
  $('gate').style.display='none';$('app').style.display='';
  $('pendGo').href=inboxUrl();
  load();
});

async function load(){
  $('moLbl').textContent=+ym.slice(0,4)+'년 '+(+ym.slice(4,6))+'월';
  $('moNext').disabled=ym>=kstYm();$('moNext').style.opacity=ym>=kstYm()?.35:1;
  $('tMoL').textContent=(+ym.slice(4,6))+'월 전체';
  $('list').innerHTML='<div class="empty">불러오는 중…</div>';
  try{const r=await mjLog({action:'list',ym});data=(r&&r.data)||{items:[],counts:{},pending:0};}
  catch(e){$('list').innerHTML='<div class="empty">기록을 불러오지 못했어요.<br>잠시 후 다시 열어 주세요.</div>';return;}
  sel='';paint();
}
function paint(){
  const it=data.items||[],c=data.counts||{},bs=c.byStatus||{},bk=c.byKind||{};
  $('tAll').textContent=it.length;
  $('tApp').textContent=(bs.applied||0)+(bs.done||0);
  $('tAuto').textContent=(bs.auto||0)+(bs.made||0);
  $('tPend').textContent=data.pending||0;
  $('sumLine').textContent=Object.keys(bk).sort((a,b)=>bk[b]-bk[a]).map(k=>k+' '+bk[k]).join(' · ');
  const pb=$('pendBar');if(data.pending>0){pb.style.display='flex';$('pendTxt').textContent='업무함에 처리하지 않은 요청이 '+data.pending+'건 있어요.';}else pb.style.display='none';
  const kinds=['전체','대기'].concat(Object.keys(bk).sort((a,b)=>bk[b]-bk[a]));
  if(!kinds.includes(kind))kind='전체';
  $('flt').innerHTML='<div class="cap">종류</div>'+kinds.map(k=>'<button type="button" class="fi'+(k===kind?' on':'')+'" data-k="'+esc(k)+'"><span>'+esc(k)+'</span><i>'+(k==='전체'?it.length:k==='대기'?(bs.pending||0):bk[k])+'</i></button>').join('');
  $('flt').querySelectorAll('.fi').forEach(b=>b.onclick=()=>{kind=b.dataset.k;sel='';paint();});
  list();
}
function list(){
  const qv=$('q').value.trim();
  const it=(data.items||[]).filter(x=>(kind==='전체'||(kind==='대기'?x.status==='pending':x.kind===kind))&&(!qv||x.name.includes(qv)));
  if(!it.length){$('list').innerHTML='<div class="empty">'+((data.items||[]).length?'조건에 맞는 기록이 없어요.':'이 달에는 MyJai 기록이 없어요.<br>MyJai에서 고객 등록·통화 정리·저장을 하면 여기에 쌓입니다.')+'</div>';detail(null);return;}
  const days={};it.forEach(x=>{const d=kd(x.atMs);(days[d.day]=days[d.day]||{lbl:d.md+'('+d.wd+')',rows:[]}).rows.push(x);});
  $('list').innerHTML=Object.keys(days).map(k=>{const g=days[k];return '<button type="button" class="day"><span>'+g.lbl+' · '+g.rows.length+'건</span><span>▾</span></button><div class="rows">'+g.rows.map(row).join('')+'</div>';}).join('');
  $('list').querySelectorAll('.day').forEach(b=>b.onclick=()=>b.classList.toggle('closed'));
  $('list').querySelectorAll('.row').forEach(b=>b.onclick=()=>{sel=b.dataset.id===sel?'':b.dataset.id;$('list').querySelectorAll('.row').forEach(x=>x.classList.toggle('sel',x.dataset.id===sel));detail((data.items||[]).find(x=>x.id===sel));});
  if(!sel&&window.innerWidth>860){const f=$('list').querySelector('.row');if(f){sel=f.dataset.id;f.classList.add('sel');detail(it[0]);}}
  else detail((data.items||[]).find(x=>x.id===sel));
}
function row(x){
  const s=ST[x.status]||ST.done,k=KI[x.kind]||['•','var(--grayBg)'],d=kd(x.atMs);
  return '<button type="button" class="row'+(x.id===sel?' sel':'')+'" data-id="'+esc(x.id)+'"><span class="ic" style="background:'+k[1]+'">'+k[0]+'</span><span class="rt"><b>'+esc(x.kind)+(x.name?' · '+esc(x.name):'')+'</b><span>'+(x.title?esc(x.title)+' · ':'')+d.hm+'</span></span><span class="st" style="background:'+s[1]+';color:'+s[2]+'">'+s[0]+'</span></button>'
    +'<div class="inl">'+detBody(x)+'</div>';
}
function detBody(x){
  const s=ST[x.status]||ST.done,d=kd(x.atMs);
  let h='<div class="kv"><span>종류</span><span>'+esc(x.kind)+'</span></div>'
   +(x.name?'<div class="kv"><span>고객</span><span>'+esc(x.name)+'</span></div>':'')
   +(x.title?'<div class="kv"><span>내용</span><span>'+esc(x.title)+'</span></div>':'')
   +'<div class="kv"><span>시각</span><span>'+d.md+'('+d.wd+') '+d.hm+'</span></div>'
   +'<div class="kv"><span>상태</span><span style="color:'+s[2]+';font-weight:700">'+s[0]+(x.doneAtMs?' · '+kd(x.doneAtMs).md+' '+kd(x.doneAtMs).hm:'')+'</span></div>';
  if(x.tool==='jv_proposal_make'&&x.status==='made')h+='<div class="kv"><span>다시 보기</span><span>MyJai에게 「제안서 다시 열어줘」라고 말하면 추가 차감 없이 다시 열립니다. 자비아 서버에는 남지 않으니 내려받은 HTML·워드를 보관해 주세요.</span></div>';   /* ★ [2026-11-29] MyJai 제안서 */
  const L=linksOf(x);
  if(L.length)h+='<div class="acts">'+L.map(l=>'<a href="'+l[1]+'"'+(l[2]?' class="p"':'')+'>'+esc(l[0])+'</a>').join('')+'</div>';
  return h;
}
function detail(x){
  if(!x){$('det').innerHTML='<div class="empty">왼쪽 목록에서 기록을 고르면<br>자세한 내용이 여기에 보입니다.</div>';return;}
  $('det').innerHTML='<h3>'+esc(x.kind)+(x.name?' · '+esc(x.name):'')+'</h3><div style="height:10px"></div>'+detBody(x);
}
