<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>오늘의 금융 브리핑</title>

<!-- OG Tags — 동적으로 업데이트됨 -->
<meta property="og:type" content="article">
<meta property="og:title" id="og-title" content="오늘의 금융 브리핑">
<meta property="og:description" id="og-desc" content="매일 아침 전해드리는 금융 인사이트">
<meta property="og:image" content="https://jarvia.co.kr/client_report_share_v2.png">
<meta property="og:url" id="og-url" content="https://jarvia.co.kr/client-daily.html">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root {
  --ink:#1A1A2E;--ink-mid:#3D3D5C;--ink-lt:#6B6B8D;--ink-sub:#9E9EB8;
  --bg:#FAFAF7;--bg-warm:#F5F3EE;--bg-card:#FFFFFF;
  --accent:#2563EB;--accent-lt:#DBEAFE;
  --green:#059669;--green-lt:#D1FAE5;--red:#DC2626;--red-lt:#FEE2E2;
  --orange:#EA580C;--orange-lt:#FFF7ED;--purple:#7C3AED;--purple-lt:#EDE9FE;
  --yellow:#D97706;--yellow-lt:#FFFBEB;
  --border:#E8E6E1;--border-lt:#F0EEE9;
  --shadow-sm:0 1px 3px rgba(26,26,46,.06);--shadow:0 2px 8px rgba(26,26,46,.08);
  --radius:16px;--radius-sm:10px;--radius-xs:6px;
  --font:'Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;
  --font-d:'Outfit','Noto Sans KR',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:var(--font);background:var(--bg);color:var(--ink);line-height:1.75;-webkit-font-smoothing:antialiased}
.wrap{max-width:640px;margin:0 auto;padding:0 20px}

/* ═══ Loading / Error ═══ */
.page-loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;color:var(--ink-lt)}
.page-loading .spin{width:32px;height:32px;border:3px solid var(--border);border-top:3px solid var(--accent);border-radius:50%;animation:sp .7s linear infinite;margin-bottom:12px}
@keyframes sp{to{transform:rotate(360deg)}}
.page-error{text-align:center;padding:80px 20px;color:var(--ink-lt)}
.page-error h2{font-size:20px;color:var(--ink);margin-bottom:8px}

/* ═══ Consultant Header ═══ */
.fc-header{border-bottom:1px solid var(--border);padding:14px 0;position:sticky;top:0;z-index:50;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);background:rgba(255,255,255,.92)}
.fc-header .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px}
.fc-profile{display:flex;align-items:center;gap:12px}
.fc-avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#7C3AED);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px;flex-shrink:0;overflow:hidden}
.fc-avatar img{width:100%;height:100%;object-fit:cover}
.fc-info{line-height:1.3}
.fc-name{font-size:14px;font-weight:700;color:var(--ink)}
.fc-company{font-size:11px;color:var(--ink-sub)}
.fc-contact-btn{display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;transition:all .2s;font-family:var(--font);text-decoration:none;flex-shrink:0}
.fc-contact-btn:hover{background:#1D4ED8;transform:scale(1.08)}
.fc-contact-btn svg{width:18px;height:18px}

/* ═══ Date Hero ═══ */
.date-hero{padding:32px 0 20px}
.date-label{font-family:var(--font-d);font-size:13px;font-weight:600;color:var(--accent);letter-spacing:.5px;text-transform:uppercase;margin-bottom:4px}
.date-main{font-family:var(--font-d);font-size:28px;font-weight:800;color:var(--ink);line-height:1.2;margin-bottom:6px;display:flex;align-items:center;gap:10px}
.date-greeting{font-size:15px;color:var(--ink-lt);line-height:1.6}
.date-greeting strong{color:var(--ink);font-weight:600}

/* ═══ Special Message Icon ═══ */
.sp-msg-icon{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#FCA5A5,#F87171);cursor:pointer;animation:spPulse 1.5s ease-in-out infinite;box-shadow:0 2px 10px rgba(248,113,113,.5);flex-shrink:0;transition:transform .2s;margin-left:auto}
.sp-msg-icon:hover{transform:scale(1.15)}
.sp-msg-icon span{font-size:18px;line-height:1}
@keyframes spPulse{0%,100%{box-shadow:0 2px 10px rgba(248,113,113,.4);transform:scale(1)}50%{box-shadow:0 4px 24px rgba(220,38,38,.7);transform:scale(1.12)}}

/* ═══ Special Message Modal ═══ */
.sp-modal-bg{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:9999;align-items:center;justify-content:center;padding:20px}
.sp-modal-bg.active{display:flex}
.sp-modal{background:#fff;border-radius:20px;max-width:400px;width:100%;padding:28px 24px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.2);animation:spModalIn .3s ease}
@keyframes spModalIn{from{opacity:0;transform:scale(.9) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}}
.sp-modal-avatar{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#2563EB,#7C3AED);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:22px;margin:0 auto 12px;overflow:hidden;border:3px solid #fff;box-shadow:0 4px 12px rgba(0,0,0,.1)}
.sp-modal-avatar img{width:100%;height:100%;object-fit:cover}
.sp-modal-name{font-size:15px;font-weight:700;color:var(--ink);margin-bottom:2px}
.sp-modal-role{font-size:12px;color:var(--ink-lt);margin-bottom:16px}
.sp-modal-body{font-size:14px;color:var(--ink);line-height:1.8;text-align:left;padding:16px;background:#FEFCE8;border-radius:12px;border:1px solid #FDE68A;white-space:pre-wrap;word-break:keep-all}
.sp-modal-body strong{font-weight:700;color:#92400E}
.sp-modal-close{margin-top:16px;padding:10px 32px;border:none;background:linear-gradient(135deg,#2563EB,#3B82F6);color:#fff;border-radius:25px;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s}
.sp-modal-close:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(37,99,235,.3)}

/* ═══ Audio Player ═══ */
.audio-section{margin:0 0 28px}
.audio-card{background:linear-gradient(135deg,#1E293B,#334155);border-radius:var(--radius);padding:18px 20px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:all .25s;position:relative;overflow:hidden}
.audio-card::before{content:'';position:absolute;top:-30%;right:-10%;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.04)}
.audio-card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(30,41,59,.3)}
.audio-play-btn{width:44px;height:44px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s}
.audio-play-btn svg{width:18px;height:18px;color:#1E293B;margin-left:2px}
.audio-meta{flex:1}
.audio-title{font-size:14px;font-weight:700;color:#fff;margin-bottom:2px}
.audio-sub{font-size:12px;color:rgba(255,255,255,.55)}
.audio-dur{font-family:var(--font-mono);font-size:13px;color:rgba(255,255,255,.4);font-weight:500}
.audio-expanded{display:none;margin-top:-4px;background:#1E293B;border-radius:0 0 var(--radius) var(--radius);padding:16px 20px 18px}
.audio-expanded.show{display:block}
.audio-controls{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.audio-skip-group{display:flex;align-items:center;gap:8px}
.audio-skip-btn{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.1);border:none;color:rgba(255,255,255,.7);font-size:11px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);transition:all .15s}
.audio-skip-btn:hover{background:rgba(255,255,255,.2)}
.audio-speed-group{display:flex;gap:4px}
.audio-speed-btn{padding:4px 10px;border-radius:12px;background:rgba(255,255,255,.08);color:rgba(255,255,255,.5);font-size:11px;font-weight:600;border:none;cursor:pointer;font-family:var(--font-mono);transition:all .15s}
.audio-speed-btn:hover{background:rgba(255,255,255,.15);color:rgba(255,255,255,.7)}
.audio-speed-btn.active{background:var(--accent);color:#fff}

/* ═══ Section Divider ═══ */
.sec-divider{display:flex;align-items:center;gap:14px;margin:36px 0 20px}
.sec-num{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--font-d);font-size:14px;font-weight:700;color:#fff;flex-shrink:0}
.sec-divider-text{font-size:18px;font-weight:800;color:var(--ink)}
/* ═══ Accordion ═══ */
.sec-divider.accordion{cursor:pointer;user-select:none;-webkit-user-select:none}
.sec-divider.accordion:hover .sec-divider-text{opacity:.8}
.sec-arrow{margin-left:auto;font-size:18px;color:var(--ink-sub);transition:transform .3s ease;flex-shrink:0}
.sec-divider.accordion.open .sec-arrow{transform:rotate(180deg)}
.sec-body{overflow:hidden;max-height:0;transition:max-height .4s ease}
.sec-body.open{max-height:9999px}
.sec-preview{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 16px;margin-bottom:4px;cursor:pointer}

/* ═══ Market Indicators ═══ */
.market-strip{background:var(--bg-card);border-radius:var(--radius);border:1px solid var(--border);overflow:hidden;margin-bottom:8px}
.market-grid{display:grid;grid-template-columns:repeat(2,1fr)}
.market-item{padding:14px 16px;border-bottom:1px solid var(--border-lt)}
.market-item:nth-child(odd){border-right:1px solid var(--border-lt)}
.market-item:nth-last-child(-n+2){border-bottom:none}
.mi-label{font-size:12px;color:var(--ink-lt);font-weight:500;margin-bottom:4px;white-space:nowrap}
.mi-val{font-family:var(--font-mono);font-size:18px;font-weight:700;color:var(--ink)}
.mi-change{font-size:11px;font-weight:600;margin-top:2px;white-space:nowrap}
.mi-change.up{color:var(--red)}.mi-change.down{color:var(--accent)}.mi-change.flat{color:var(--ink-sub)}
.market-note{padding:10px 18px;background:var(--bg-warm);font-size:12px;color:var(--ink-lt);text-align:right}
.indicator-insight{background:var(--accent-lt);border-radius:var(--radius-sm);padding:16px 18px;margin-top:12px;margin-bottom:8px}
.indicator-insight-title{font-size:13px;font-weight:700;color:var(--accent);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.indicator-insight p{font-size:14px;color:var(--ink-mid);line-height:1.7}

/* ═══ News / Hot Issue / Deep Dive ═══ */
.news-article{background:var(--bg-card);border-radius:var(--radius);border:1px solid var(--border);overflow:hidden;margin-bottom:16px;transition:all .2s}
.news-article:hover{border-color:#D0CEC9;box-shadow:var(--shadow-sm)}
.news-tag-bar{padding:12px 18px 0;display:flex;align-items:center;gap:8px}
.news-tag{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:4px;font-size:11px;font-weight:700;letter-spacing:.3px}
.tag-economy{background:var(--accent-lt);color:var(--accent)}.tag-tax{background:var(--purple-lt);color:var(--purple)}
.tag-insurance{background:var(--green-lt);color:var(--green)}.tag-policy{background:var(--orange-lt);color:var(--orange)}
.tag-market{background:var(--yellow-lt);color:var(--yellow)}.tag-life{background:#FDF2F8;color:#DB2777}
.tag-hot{background:var(--red-lt);color:var(--red)}
.news-title{padding:10px 18px 0;font-size:17px;font-weight:800;color:var(--ink);line-height:1.45}
.news-body{padding:10px 18px 16px;font-size:15px;color:var(--ink-mid);line-height:1.8}
.news-body strong{color:var(--ink);font-weight:600}
.news-body em{font-style:normal;background:linear-gradient(transparent 60%,rgba(37,99,235,.12) 60%);font-weight:600}
.takeaway{margin:0 18px 16px;padding:14px 16px;background:var(--bg-warm);border-radius:var(--radius-sm);border-left:3px solid;font-size:14px;color:var(--ink-mid);line-height:1.7}
.takeaway-economy{border-left-color:var(--accent)}.takeaway-insurance{border-left-color:var(--green)}
.takeaway-policy{border-left-color:var(--orange)}.takeaway-tax{border-left-color:var(--purple)}
.takeaway-hot{border-left-color:var(--red)}.takeaway-deepdive{border-left-color:#6366F1}
.takeaway-label{font-size:12px;font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:4px}
.takeaway-economy .takeaway-label{color:var(--accent)}.takeaway-insurance .takeaway-label{color:var(--green)}
.takeaway-policy .takeaway-label{color:var(--orange)}.takeaway-tax .takeaway-label{color:var(--purple)}
.takeaway-hot .takeaway-label{color:var(--red)}.takeaway-deepdive .takeaway-label{color:#6366F1}

.deepdive{background:var(--bg-card);border-radius:var(--radius);border:1px solid var(--border);overflow:hidden;margin-bottom:16px;position:relative}
.deepdive-badge{position:absolute;top:0;right:0;background:#6366F1;color:#fff;font-size:11px;font-weight:700;padding:4px 14px 4px 18px;border-radius:0 0 0 12px}
.deepdive .news-title{padding-top:36px;font-size:19px}
.deepdive-summary{margin:12px 18px;padding:14px 16px;background:#F5F3FF;border-radius:var(--radius-sm);border-left:3px solid #6366F1}
.deepdive-summary-title{font-size:12px;font-weight:700;color:#6366F1;margin-bottom:8px}
.deepdive-summary li{font-size:14px;color:var(--ink-mid);line-height:1.6;margin-bottom:4px;list-style:none;padding-left:16px;position:relative}
.deepdive-summary li::before{content:'•';position:absolute;left:0;color:#6366F1;font-weight:700}
.deepdive-qa{margin:16px 18px 18px}
.deepdive-q{font-size:15px;font-weight:700;color:var(--ink);margin-bottom:6px;padding-left:24px;position:relative}
.deepdive-q::before{content:'Q';position:absolute;left:0;font-family:var(--font-d);font-size:14px;font-weight:800;color:#6366F1}
.deepdive-a{font-size:14px;color:var(--ink-mid);line-height:1.8;margin-bottom:20px;padding-left:24px}

.hot-issue{background:var(--bg-card);border-radius:var(--radius);border:2px solid var(--red);overflow:hidden;margin-bottom:16px;position:relative}
.hot-badge{position:absolute;top:0;right:0;background:var(--red);color:#fff;font-size:11px;font-weight:700;padding:4px 14px 4px 18px;border-radius:0 0 0 12px}
.hot-issue .news-title{padding-top:16px;font-size:19px}

/* ═══ Subscribe Button ═══ */
@keyframes shimmer{0%{background-position:200% center}100%{background-position:-200% center}}
@keyframes glow{0%,100%{box-shadow:0 0 6px rgba(212,175,55,.3),0 0 10px rgba(37,99,235,.15)}50%{box-shadow:0 0 14px rgba(212,175,55,.6),0 0 22px rgba(37,99,235,.3)}}
.sub-free-btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:6px 16px;border-radius:10px;background:linear-gradient(135deg,#1E3A8A,#D4AF37,#2563EB,#F5D060,#1E3A8A);background-size:300% auto;color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:var(--font);border:none;flex:1;text-shadow:0 1px 2px rgba(0,0,0,.3);animation:shimmer 6s linear infinite,glow 4s ease-in-out infinite;transition:transform .2s}
.sub-free-btn:hover{transform:translateY(-1px)}

/* ═══ Subscribe Popup ═══ */
.sub-modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9999;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}
.sub-modal-bg.active{display:flex}
.sub-modal{background:#fff;border-radius:20px;max-width:360px;width:100%;padding:32px 28px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.2);animation:subModalIn .3s ease;position:relative}
@keyframes subModalIn{from{opacity:0;transform:translateY(20px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
.sub-modal-close{position:absolute;top:14px;right:18px;background:none;border:none;font-size:22px;color:#9CA3AF;cursor:pointer;line-height:1}
.sub-modal-icon{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#10B981,#059669);display:flex;align-items:center;justify-content:center;font-size:24px;margin:0 auto 14px}
.sub-modal-title{font-size:17px;font-weight:800;color:#111827;margin-bottom:8px}
.sub-modal-divider{width:40px;height:3px;background:linear-gradient(90deg,#10B981,#059669);border-radius:2px;margin:0 auto 16px}
.sub-modal-body{font-size:14px;color:#374151;line-height:1.9;text-align:left;background:#F0FDF4;border:1px solid #BBF7D0;border-radius:12px;padding:16px 18px;margin-bottom:8px}
.sub-modal-body strong{color:#065F46;font-weight:700}
.sub-modal-note{font-size:12px;color:#6B7280;margin-bottom:20px;line-height:1.5}
.sub-modal-btn{width:100%;padding:13px;border-radius:12px;background:linear-gradient(135deg,#2563EB,#3B82F6);color:#fff;font-size:15px;font-weight:700;border:none;cursor:pointer;font-family:var(--font);transition:all .2s}
.sub-modal-btn:hover{background:linear-gradient(135deg,#1D4ED8,#2563EB);box-shadow:0 4px 14px rgba(37,99,235,.35)}

/* ═══ Bottom CTA ═══ */
.bottom-cta{margin:40px 0 20px;background:var(--bg-card);border-radius:var(--radius);border:1px solid var(--border);padding:24px;text-align:center}
.cta-fc{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:14px}
.cta-avatar{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#7C3AED);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:18px;overflow:hidden}
.cta-avatar img{width:100%;height:100%;object-fit:cover}
.cta-text{text-align:left;line-height:1.3}
.cta-name{font-size:16px;font-weight:700;color:var(--ink)}
.cta-role{font-size:12px;color:var(--ink-sub)}
.cta-msg{font-size:14px;color:var(--ink-lt);margin-bottom:16px;line-height:1.6}
.cta-buttons{display:flex;gap:10px;justify-content:center}
.cta-btn{display:inline-flex;align-items:center;gap:6px;padding:6px 16px;border-radius:10px;font-size:14px;font-weight:600;border:none;cursor:pointer;font-family:var(--font);transition:all .2s;text-decoration:none;flex:1;justify-content:center;white-space:nowrap}
.cta-btn:hover{transform:translateY(-1px)}
.cta-btn-phone{background:var(--accent);color:#fff}.cta-btn-phone:hover{background:#1D4ED8}
.cta-btn-kakao{background:#FEE500;color:#3C1E1E}.cta-btn-kakao:hover{background:#FDDA00}

/* ═══ Inner Links (이너서클 전용) ═══ */
.inner-links{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;margin-top:10px;padding:12px 20px 4px;border-top:1px solid var(--border);max-width:640px;margin-left:auto;margin-right:auto;width:100%;box-sizing:border-box}
.inner-link-btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;flex:1;padding:9px 10px;border-radius:10px;font-size:12px;font-weight:700;color:#5B21B6;background:linear-gradient(135deg,#F5F3FF,#EDE9FE);border:1px solid #C4B5FD;text-decoration:none;transition:all .2s;white-space:nowrap;box-shadow:0 1px 4px rgba(91,33,182,.08)}
.inner-link-btn:hover{background:linear-gradient(135deg,#EDE9FE,#DDD6FE);box-shadow:0 3px 10px rgba(91,33,182,.15);transform:translateY(-1px)}

/* ═══ Naver Search Bar ═══ */
.naver-bar-wrap{padding:16px;margin:0 auto 8px}
.naver-bar{display:flex;width:100%;margin:0 auto;align-items:center;gap:0;border-radius:10px;overflow:hidden;border:1.5px solid #03C75A;cursor:pointer;background:#fff;text-decoration:none;transition:box-shadow .2s}
.naver-bar:hover{box-shadow:0 4px 14px rgba(3,199,90,.2)}
.naver-n{width:44px;height:44px;background:#03C75A;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.naver-n span{color:#fff;font-size:22px;font-weight:900;font-family:'Arial Black',sans-serif;line-height:1}
.naver-query{flex:1;padding:0 14px;font-size:14px;font-weight:500;color:var(--ink);background:#fff}
.naver-search-icon{width:40px;height:44px;display:flex;align-items:center;justify-content:center;background:#fff;flex-shrink:0}
.naver-search-icon svg{width:18px;height:18px;color:#999}

/* ═══ Share Bar ═══ */

<!-- ═══ Firebase + Logic ═══ -->
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import{getFirestore,doc,getDoc,collection,query,where,orderBy,limit,getDocs,addDoc,serverTimestamp}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const FC={apiKey:"AIzaSyCf7CsUTgfIWY-RW_mvTJOhczDtk1xM9sA",authDomain:"kfpc-company-support-project.firebaseapp.com",projectId:"kfpc-company-support-project",storageBucket:"kfpc-company-support-project.firebasestorage.app",messagingSenderId:"1012609333373",appId:"1:1012609333373:web:7b6c207c81ff10d156d914"};
const app=initializeApp(FC);
const db=getFirestore(app,'javia-db');

// ═══ URL Parameters ═══
const params=new URLSearchParams(location.search);
const fcId=params.get('fc')||'';
const dateParam=params.get('d')||'';

// 날짜 없으면 오늘(KST)
function getTodayKST(){
  const now=new Date();
  const kst=new Date(now.getTime()+9*60*60*1000);
  return kst.getUTCFullYear()+String(kst.getUTCMonth()+1).padStart(2,'0')+String(kst.getUTCDate()).padStart(2,'0');
}
const fileDate=dateParam||getTodayKST();

// ═══ Global State ═══
let fcData=null;
let reportData=null;
let prevIndicators=null; // ★ 전일 경제지표 (전일비 표시용)
let spData=null; // ★ 컨설턴트 카톡 공유 설정 (fc_share_profiles)

// ═══ Main Init ═══
async function init(){
  try{
    // fc 파라미터 필수
    if(!fcId){
      showError('잘못된 접근이에요','링크를 다시 확인해주세요.');
      return;
    }

    // 1. 컨설턴트 프로필 조회
    const fcSnap=await getDoc(doc(db,'consultants',fcId));
    if(!fcSnap.exists()){
      showError('컨설턴트 정보를 찾을 수 없어요','링크를 다시 확인해주세요.');
      return;
    }
    fcData=fcSnap.data();

    // ★ 역할 실시간 체크 — jarvia_member, jarvia_inner만 허용
    // users 컬렉션은 uid 기반이므로 loginId 필드로 쿼리 (강등 즉시 차단)
    try{
      const userQ=await getDocs(query(collection(db,'users'),where('loginId','==',fcId),limit(1)));
      const userRole=(!userQ.empty)?userQ.docs[0].data().role:'';
      if(userRole!=='jarvia_member'&&userRole!=='jarvia_inner'){
        showError('현재 이용할 수 없는 서비스입니다','담당 컨설턴트에게 문의해주세요.');
        return;
      }
    }catch(roleErr){
      // users 조회 실패 시 차단 (안전 우선)
      console.warn('role check failed:',roleErr);
      showError('현재 이용할 수 없는 서비스입니다','담당 컨설턴트에게 문의해주세요.');
      return;
    }

    // 2. 고객 데일리리포트 조회 (오늘 없으면 최근 발행본 fallback)
    const drSnap=await getDoc(doc(db,'client_daily_reports',fileDate));
    if(drSnap.exists()&&drSnap.data().status==='published'){
      reportData=drSnap.data();
    } else {
      // 오늘 리포트 미발행 → 최근 published 리포트로 fallback
      const fallbackSnap=await getDocs(query(
        collection(db,'client_daily_reports'),
        orderBy('createdAt','desc'),
        limit(10)
      ));
      const latest=fallbackSnap.docs.find(d=>d.data().status==='published');
      if(!latest){
        showError('브리핑이 아직 준비 중이에요','조금 뒤에 다시 방문해주세요!');
        return;
      }
      reportData=latest.data();
    }

    // 2.5 ★ 전일 경제지표 로드 (전일비 표시용)
    try{
      const prevSnap=await getDocs(query(
        collection(db,'client_daily_reports'),
        orderBy('createdAt','desc'),
        limit(2)
      ));
      const prevDocs=prevSnap.docs.filter(d=>d.id!==fileDate);
      if(prevDocs.length>0){
        prevIndicators=prevDocs[0].data().indicators||null;
      }
    }catch(pe){console.warn('prev indicators load fail:',pe);}

    // 2.7 ★ 컨설턴트 카톡 공유 설정 로드 (fc_share_profiles)
    try{
      const spSnap=await getDoc(doc(db,'fc_share_profiles',fcId));
      if(spSnap.exists())spData=spSnap.data();
    }catch(spe){console.warn('share profile load fail:',spe);}

    // 3. 렌더링
    renderConsultant();
    renderDateHero();
    renderAudio();
    renderSections();
    renderCTA();

    // 4. 아카이브 로드
    loadArchive();

    // 5. 화면 전환
    document.getElementById('loadingState').style.display='none';
    document.getElementById('mainContent').style.display='block';
    document.getElementById('shareBar').style.display='flex';


  }catch(e){
    console.error('init error:',e);
    showError('데이터를 불러올 수 없어요',e.message);
  }
}

function showError(title,msg){
  document.getElementById('loadingState').style.display='none';
  const el=document.getElementById('errorState');
  el.innerHTML=`<h2>${esc(title)}</h2><p>${esc(msg)}</p><br><a href="https://jarvia.co.kr" style="color:var(--accent)">JARVIA 메인으로</a>`;
  el.style.display='block';
}

// ═══ Render: Consultant ═══
function renderConsultant(){
  const fc=fcData;
  const displayName=`${fc.company||''} ${fc.name||''} ${fc.title||''}`.trim();
  const initial=(fc.name||'?')[0];

  // Header
  const avatarEl=document.getElementById('fcAvatar');
  if(fc.photoUrl){avatarEl.innerHTML=`<img src="${esc(fc.photoUrl)}" alt="">`;}
  else{avatarEl.textContent=initial;}
  document.getElementById('fcName').textContent=displayName;
  document.getElementById('fcCompany').textContent=fc.greeting||'';

  // ★ 상단 연락하기 → 바로 전화 연결
  const contactBtn=document.getElementById('fcContactBtn');
  if(fc.phone){contactBtn.href=`tel:${fc.phone}`;}
  else if(fc.kakaoUrl){contactBtn.href=fc.kakaoUrl;contactBtn.target='_blank';}
  else{contactBtn.style.display='none';}

  // ★ 상단 카카오톡 버튼
  const kakaoBtn=document.getElementById('fcKakaoBtn');
  if(fc.kakaoUrl&&fc.phone){kakaoBtn.href=fc.kakaoUrl;kakaoBtn.style.display='inline-flex';}
  else{kakaoBtn.style.display='none';}

  // ★ 이너서클 링크 버튼 (있는 것만)
  const innerLinks=document.getElementById('innerLinks');
  const linkDefs=[
    {url:fc.expertHomeUrl,label:'🏠 홈페이지'},
    {url:fc.morningReadingUrl,label:'📖 아침독서'},
    {url:fc.brochureUrl,label:'📋 브로슈어'},
  ];
  const linkBtns=linkDefs.filter(l=>l.url).map(l=>`<a class="inner-link-btn" href="${esc(l.url)}" target="_blank">${l.label}</a>`).join('');
  if(linkBtns){innerLinks.innerHTML=linkBtns;innerLinks.style.display='flex';}

function renderIndicators(d){
  const inds=d.indicators||[];
  if(!inds.length) return '';

  const grid=inds.map(ind=>{
    // ★ 전일비 계산
    let changeHtml='';
    if(prevIndicators){
      const prev=prevIndicators.find(p=>p.label===ind.label);
      if(prev){
        const tVal=parseFloat(String(ind.value).replace(/,/g,''));
        const yVal=parseFloat(String(prev.value).replace(/,/g,''));
        if(!isNaN(tVal)&&!isNaN(yVal)&&yVal!==0){
          const diff=tVal-yVal;
          const pct=((diff/yVal)*100).toFixed(2);
          if(Math.abs(diff)>0.001){
            const cls=diff>0?'up':'down';
            const arrow=diff>0?'▲':'▼';
            const sign=diff>0?'+':'';
            changeHtml=`<div class="mi-change ${cls}">${arrow} ${sign}${Math.abs(diff)<1?diff.toFixed(3):diff.toFixed(2)} (${sign}${pct}%)</div>`;
          }else{
            changeHtml=`<div class="mi-change flat">— 보합</div>`;
          }
        }
      }
    }
    return `<div class="market-item">
      <div class="mi-label">${esc(ind.label)}</div>
      <div class="mi-val">${esc(ind.value)}${ind.unit&&!ind.unit.includes('=')?` ${esc(ind.unit)}`:''}</div>
      ${changeHtml}
    </div>`;
  }).join('');

  const insight=d.indicatorInsight?
    `<div class="indicator-insight"><div class="indicator-insight-title">💡 한 줄 해석</div><p>${esc(d.indicatorInsight)}</p></div>`:'';

  return `<div class="wrap">
    <div class="sec-divider"><div class="sec-num" style="background:var(--accent)">1</div><div class="sec-divider-text">오늘의 경제 흐름</div></div>
    <div class="market-strip"><div class="market-grid">${grid}</div>
    <div class="market-note">${esc(d.date||'')} 기준 · 한국은행 ECOS</div></div>
    ${insight}
  </div>`;
}

function renderNews(d){
  const news=d.news||[];
  if(!news.length) return '';

  // 첫 번째 기사 제목만 미리보기로 노출 (접힌 상태에서도 보임)
  const firstTitle=news.length>0?`

  return `<div class="wrap">

// ═══ Archive ═══
async function loadArchive(){
  try{
    // ★ orderBy만 사용하여 복합 인덱스 불필요 — status 필터는 JS에서 처리
    const snap=await getDocs(query(collection(db,'client_daily_reports'),orderBy('createdAt','desc'),limit(30)));
    const published=snap.docs.filter(d=>d.data().status==='published').slice(0,5);
    if(published.length<=1){return;} // 오늘 1건뿐이면 아카이브 미표시
    const dates=published.map(d=>{
      const data=d.data();
      // "2026년 3월 11일 수요일" → "3/11 수"
      const fd=data.fileDate||d.id;
      const raw=data.date||'';
      const m=raw.match(/(\d+)월\s*(\d+)일.*?([월화수목금토일])/);
      const label=m?`${m[1]}/${m[2]} ${m[3]}`:fd;
      return {fd,label};
    });
    const el=document.getElementById('archiveList');
    el.innerHTML=dates.map(d=>{
      const isCurrent=d.fd===fileDate;
      return `<a class="archive-btn${isCurrent?' current':''}" href="./client-daily.html?fc=${fcId}&d=${d.fd}">${d.label}</a>`;
    }).join('');
    document.getElementById('archiveSection').style.display='block';
    document.getElementById('archiveLink').href=`./client-archive.html?fc=${fcId}`;
  }catch(e){
    console.warn('archive load fail:',e);
  }
}

let audioOpen=false;
const audioEl=document.getElementById('audioEl');

window.toggleAudio=function(){
  const exp=document.getElementById('audioExpanded');
  const card=document.getElementById('audioCard');
  audioOpen=!audioOpen;
  exp.classList.toggle('show',audioOpen);
  card.style.borderRadius=audioOpen?'var(--radius) var(--radius) 0 0':'var(--radius)';
};
window.playPause=function(){
  if(audioEl.paused){audioEl.play();document.getElementById('playPauseBtn').textContent='⏸';}
  else{audioEl.pause();document.getElementById('playPauseBtn').textContent='▶';}
};
window.skipAudio=function(sec){audioEl.currentTime=Math.max(0,Math.min(audioEl.duration||0,audioEl.currentTime+sec));};
window.setSpeed=function(rate){
  audioEl.playbackRate=rate;
  document.querySelectorAll('.audio-speed-btn').forEach(b=>{b.classList.toggle('active',parseFloat(b.textContent)===rate);});
};
window.seekAudio=function(e){
  const wrap=document.getElementById('audioProgressWrap');
  audioEl.currentTime=(e.offsetX/wrap.offsetWidth)*(audioEl.duration||0);
};
audioEl.addEventListener('timeupdate',()=>{
  if(!audioEl.duration)return;
  document.getElementById('audioProgress').style.width=(audioEl.currentTime/audioEl.duration*100)+'%';
});
audioEl.addEventListener('ended',()=>{document.getElementById('playPauseBtn').textContent='▶';});
audioEl.addEventListener('loadedmetadata',()=>{
  const dur=audioEl.duration;
  if(dur&&isFinite(dur)){
    const m=Math.floor(dur/60);const s=Math.floor(dur%60);
    document.getElementById('audioDur').textContent=`${m}:${String(s).padStart(2,'0')}`;
  }
});
