<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>오늘의 금융 브리핑</title>

<!-- OG Tags — 동적으로 업데이트됨 -->
<meta property="og:type" content="article">
<meta property="og:title" id="og-title" content="오늘의 금융 브리핑">
<meta property="og:description" id="og-desc" content="매일 아침 전해드리는 금융 인사이트">
<meta property="og:image" content="https://jarvia.co.kr/client_report_share_v2.png">
<meta property="og:url" id="og-url" content="https://jarvia.co.kr/client-daily.html">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root {
  /* ─── Premium Navy & Gold Palette ─── */
  --ink:#141B2D;--ink-mid:#2D3652;--ink-lt:#5A6484;--ink-sub:#8B93AE;
  --bg:#F7F8FA;--bg-warm:#F0F1F5;--bg-card:#FFFFFF;
  --gold:#C9A96E;--gold-lt:#F5EFE0;--gold-dk:#A68B4B;
  --accent:#1B3A6B;--accent-lt:#E8EDF5;--accent-bright:#2D5DAE;
  --green:#0A7B61;--green-lt:#E6F5F0;--red:#C0392B;--red-lt:#FBEAE8;
  --orange:#D4760A;--orange-lt:#FEF3E2;--purple:#5B4FC4;--purple-lt:#EEEDF8;
  --yellow:#B8860B;--yellow-lt:#FDF6E3;
  --border:#DFE2EA;--border-lt:#ECEEF3;
  --shadow-sm:0 2px 8px rgba(20,27,45,.05);
  --shadow:0 4px 20px rgba(20,27,45,.07);
  --shadow-lg:0 8px 40px rgba(20,27,45,.1);
  --shadow-card:0 1px 4px rgba(20,27,45,.04),0 4px 16px rgba(20,27,45,.06);
  --radius:18px;--radius-sm:12px;--radius-xs:8px;
  --font:'Noto Sans KR',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --font-d:'Outfit','Noto Sans KR',sans-serif;
  --font-mono:'JetBrains Mono','SF Mono',monospace;
  --ease:cubic-bezier(.4,0,.2,1);
}

/* ─── Global Reset ─── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  font-family:var(--font);background:var(--bg);color:var(--ink);
  line-height:1.75;-webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  /* Subtle pattern texture */
  background-image:radial-gradient(circle at 1px 1px, rgba(20,27,45,.018) 1px, transparent 0);
  background-size:24px 24px;
}
.wrap{max-width:640px;margin:0 auto;padding:0 20px}

/* ─── Scroll Reveal Animation ─── */
@keyframes revealUp{
  from{opacity:0;transform:translateY(24px)}
  to{opacity:1;transform:translateY(0)}
}
.wrap{animation:revealUp .6s var(--ease) both}
.wrap:nth-child(2){animation-delay:.08s}
.wrap:nth-child(3){animation-delay:.16s}
.wrap:nth-child(4){animation-delay:.24s}

/* ═══ Loading / Error ═══ */
.page-loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;color:var(--ink-lt)}
.page-loading .spin{width:36px;height:36px;border:3px solid var(--border);border-top:3px solid var(--gold);border-radius:50%;animation:sp .8s linear infinite;margin-bottom:14px}
@keyframes sp{to{transform:rotate(360deg)}}
.page-error{text-align:center;padding:80px 20px;color:var(--ink-lt)}
.page-error h2{font-size:20px;color:var(--ink);margin-bottom:8px;font-weight:800}

/* ═══ Consultant Header ═══ */
.fc-header{
  padding:0;position:sticky;top:0;z-index:50;
  background:rgba(255,255,255,.88);
  backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);
  border-bottom:1px solid rgba(223,226,234,.6);
  box-shadow:0 1px 8px rgba(20,27,45,.04);
}
.fc-header .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:12px;padding-bottom:12px}
.fc-profile{display:flex;align-items:center;gap:12px}
.fc-avatar{
  width:44px;height:44px;border-radius:50%;
  background:linear-gradient(135deg,var(--accent),#2D5DAE);
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:700;font-size:16px;flex-shrink:0;overflow:hidden;
  box-shadow:0 0 0 2.5px var(--gold),0 2px 8px rgba(201,169,110,.25);
  transition:transform .2s var(--ease);
}
.fc-avatar:active{transform:scale(.95)}
.fc-avatar img{width:100%;height:100%;object-fit:cover}
.fc-info{line-height:1.35}
.fc-name{font-size:14px;font-weight:700;color:var(--ink);letter-spacing:-.2px}
.fc-company{font-size:11px;color:var(--ink-sub);font-weight:400;margin-top:1px}
.fc-contact-btn{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  width:42px;height:42px;border-radius:50%;gap:1px;line-height:1;
  background:#FEE500;color:#3C1E1E;border:none;cursor:pointer;
  transition:all .2s var(--ease);font-family:var(--font);text-decoration:none;
  flex-shrink:0;box-shadow:0 2px 10px rgba(254,229,0,.3);
  font-size:10px;font-weight:800;letter-spacing:-.5px;
}
.fc-contact-btn:hover{transform:scale(1.08);box-shadow:0 4px 16px rgba(254,229,0,.4)}

/* ═══ Date Hero ═══ */
.date-hero{padding:36px 0 24px}
.date-label{
  font-family:var(--font-d);font-size:12px;font-weight:700;
  color:var(--gold-dk);letter-spacing:1.5px;text-transform:uppercase;
  margin-bottom:6px;
}
.date-main{
  font-family:var(--font-d);font-size:30px;font-weight:800;
  color:var(--ink);line-height:1.15;margin-bottom:10px;
  display:flex;align-items:center;gap:10px;letter-spacing:-.5px;
}
.date-greeting{font-size:15px;color:var(--ink-lt);line-height:1.7;font-weight:400}
.date-greeting strong{color:var(--ink);font-weight:700}

/* ═══ Special Message Banner ═══ */
.sp-msg-icon{display:none!important}
.sp-msg-banner{
  display:flex;align-items:center;gap:8px;
  padding:10px 16px;margin-top:8px;
  background:linear-gradient(135deg,#FFFBF0,#FEF7E6);
  border:1px solid #F0E4C8;border-radius:var(--radius-sm);
  cursor:pointer;transition:all .25s var(--ease);
  font-size:14px;font-weight:600;color:var(--gold-dk);
  line-height:1.4;
}
.sp-msg-banner:hover{background:#FEF7E6;box-shadow:0 2px 10px rgba(201,169,110,.15);transform:translateY(-1px)}
.sp-msg-banner .sp-arrow{margin-left:auto;font-size:16px;font-weight:900;color:#C0392B;animation:spBlink 2s ease-in-out infinite}
@keyframes spBlink{0%,100%{opacity:1}50%{opacity:.2}}
.sp-msg-banner:hover .sp-arrow{animation:none;opacity:1}

/* ═══ Special Message Modal ═══ */
.sp-modal-bg{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(20,27,45,.5);z-index:9999;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.sp-modal-bg.active{display:flex}
.sp-modal{background:#fff;border-radius:24px;max-width:400px;width:100%;padding:32px 26px;text-align:center;box-shadow:var(--shadow-lg);animation:spModalIn .35s var(--ease)}
@keyframes spModalIn{from{opacity:0;transform:scale(.92) translateY(12px)}to{opacity:1;transform:scale(1) translateY(0)}}
.sp-modal-avatar{width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#2D5DAE);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:24px;margin:0 auto 14px;overflow:hidden;box-shadow:0 0 0 3px var(--gold),0 4px 16px rgba(201,169,110,.2)}
.sp-modal-avatar img{width:100%;height:100%;object-fit:cover}
.sp-modal-name{font-size:15px;font-weight:700;color:var(--ink);margin-bottom:2px}
.sp-modal-role{font-size:12px;color:var(--ink-lt);margin-bottom:18px}
.sp-modal-body{font-size:14px;color:var(--ink);line-height:1.85;text-align:left;padding:18px;background:#FFFBF0;border-radius:14px;border:1px solid #F5E6C4;white-space:pre-wrap;word-break:keep-all}
.sp-modal-body strong{font-weight:700;color:var(--gold-dk)}
.sp-modal-close{margin-top:18px;padding:11px 36px;border:none;background:var(--accent);color:#fff;border-radius:28px;font-size:14px;font-weight:700;cursor:pointer;transition:all .2s var(--ease);letter-spacing:.3px}
.sp-modal-close:hover{background:var(--accent-bright);transform:translateY(-1px);box-shadow:0 4px 16px rgba(27,58,107,.25)}

/* ═══ Audio Player ═══ */
.audio-section{margin:0 0 32px}
.audio-card{
  background:linear-gradient(135deg,var(--accent) 0%,#1E3F72 50%,#2D5DAE 100%);
  border-radius:var(--radius);padding:20px 22px;display:flex;align-items:center;
  gap:16px;cursor:pointer;transition:all .3s var(--ease);position:relative;overflow:hidden;
  box-shadow:0 4px 20px rgba(27,58,107,.2);
}
.audio-card::before{content:'';position:absolute;top:-40%;right:-15%;width:160px;height:160px;border-radius:50%;background:rgba(201,169,110,.08)}
.audio-card::after{content:'';position:absolute;bottom:-30%;left:-10%;width:100px;height:100px;border-radius:50%;background:rgba(255,255,255,.03)}
.audio-card:hover{transform:translateY(-2px);box-shadow:0 8px 32px rgba(27,58,107,.3)}
.audio-play-btn{
  width:48px;height:48px;border-radius:50%;
  background:rgba(255,255,255,.95);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  transition:all .2s var(--ease);box-shadow:0 2px 8px rgba(0,0,0,.1);
}
.audio-play-btn svg{width:20px;height:20px;color:var(--accent);margin-left:2px}
.audio-meta{flex:1;position:relative;z-index:1}
.audio-title{font-size:14px;font-weight:700;color:#fff;margin-bottom:3px;letter-spacing:-.2px;white-space:nowrap}
.audio-sub{font-size:12px;color:rgba(255,255,255,.6);font-weight:400}
.audio-dur{font-family:var(--font-mono);font-size:13px;color:rgba(255,255,255,.45);font-weight:500;position:relative;z-index:1}
.audio-expanded{display:none;margin-top:-4px;background:var(--accent);border-radius:0 0 var(--radius) var(--radius);padding:18px 22px 20px}
.audio-expanded.show{display:block}
.audio-controls{display:flex;align-items:center;justify-content:space-between;margin-top:12px}
.audio-skip-group{display:flex;align-items:center;gap:8px}
.audio-skip-btn{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.1);border:none;color:rgba(255,255,255,.75);font-size:11px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);transition:all .15s var(--ease)}
.audio-skip-btn:hover{background:rgba(255,255,255,.2);color:#fff}
.audio-speed-group{display:flex;gap:5px}
.audio-speed-btn{padding:5px 11px;border-radius:14px;background:rgba(255,255,255,.08);color:rgba(255,255,255,.5);font-size:11px;font-weight:600;border:none;cursor:pointer;font-family:var(--font-mono);transition:all .15s var(--ease)}
.audio-speed-btn:hover{background:rgba(255,255,255,.16);color:rgba(255,255,255,.8)}
.audio-speed-btn.active{background:var(--gold);color:var(--accent)}

/* ═══ Morning Reading Bar ═══ */
.bookzip-bar{display:none;max-width:640px;margin:0 auto;padding:0 20px}
.bookzip-bar-inner{display:flex;border-radius:10px;overflow:hidden;border:1px solid #D4C9A8}
.bookzip-bar-item{flex:1;display:flex;align-items:center;gap:8px;padding:10px 14px;text-decoration:none;cursor:pointer;transition:all .2s var(--ease)}
.bookzip-bar-item:hover{opacity:.85}
.bookzip-bar-item.bz-reading{background:linear-gradient(135deg,#F5EFE0,#EDE7D8)}
.bookzip-bar-item.bz-reading .bz-label{color:#6B5B3E}
.bookzip-bar-item.bz-reading .bz-arrow{color:#9C8B6C}
.bookzip-bar-item.bz-brochure{background:linear-gradient(135deg,#EDE8F5,#E0D9EE);border-left:1px solid #D4C9A8}
.bookzip-bar-item.bz-brochure .bz-label{color:#4A3B6B}
.bookzip-bar-item.bz-brochure .bz-arrow{color:#8B7CAA}
.bz-icon{font-size:15px;flex-shrink:0}
.bz-label{font-size:12px;font-weight:800;flex:1}
.bz-sub{font-size:10px;color:#9C8B6C;margin-top:2px}
.bz-arrow{font-size:11px;flex-shrink:0}
@keyframes bzPulse{0%,100%{opacity:1}50%{opacity:.4}}
.bz-reading.bz-monday{animation:bzPulse 2s ease-in-out infinite}

/* ═══ Section Divider ═══ */
.sec-divider{display:flex;align-items:center;gap:14px;margin:40px 0 22px}
.sec-num{
  width:30px;height:30px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-family:var(--font-d);font-size:13px;font-weight:800;
  color:#fff;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,.12);
}
.sec-divider-text{font-size:19px;font-weight:800;color:var(--ink);letter-spacing:-.3px}

/* ═══ Accordion ═══ */
.sec-divider.accordion{cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.sec-divider.accordion:hover .sec-divider-text{color:var(--accent-bright)}
.sec-arrow{margin-left:auto;font-size:16px;color:var(--ink-sub);transition:transform .35s var(--ease);flex-shrink:0}
.sec-divider.accordion.open .sec-arrow{transform:rotate(180deg)}
.sec-body{overflow:hidden;max-height:0;transition:max-height .5s var(--ease)}
.sec-body.open{max-height:9999px}
.sec-preview{
  background:var(--bg-card);border:1px solid var(--border-lt);
  border-left:4px solid var(--border);border-radius:0 var(--radius-xs) var(--radius-xs) 0;
  padding:14px 18px;margin-bottom:6px;cursor:pointer;
  box-shadow:var(--shadow-sm);transition:all .2s var(--ease);
}
.sec-preview:hover{box-shadow:var(--shadow)}

/* ═══ Market Indicators ═══ */
.market-strip{
  background:var(--bg-card);border-radius:var(--radius);
  border:1px solid var(--border);overflow:hidden;margin-bottom:12px;
  box-shadow:var(--shadow-card);
}
.market-grid{display:grid;grid-template-columns:repeat(2,1fr)}
.market-item{padding:16px 18px;border-bottom:1px solid var(--border-lt);position:relative;transition:background .2s}
.market-item:hover{background:var(--bg-warm)}
.market-item:nth-child(odd){border-right:1px solid var(--border-lt)}
.market-item:nth-last-child(-n+2){border-bottom:none}
.mi-label{font-size:12px;color:var(--ink-lt);font-weight:500;margin-bottom:5px;letter-spacing:.2px}
.mi-val{font-family:var(--font-mono);font-size:19px;font-weight:700;color:var(--ink);letter-spacing:-.5px}
.mi-change{font-size:11px;font-weight:700;margin-top:3px;white-space:nowrap;display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:6px}
.mi-change.up{color:#C0392B;background:rgba(192,57,43,.07)}
.mi-change.down{color:#1B6FB5;background:rgba(27,111,181,.07)}
.mi-change.flat{color:var(--ink-sub);background:var(--bg-warm)}
.market-note{padding:10px 18px;background:var(--bg-warm);font-size:11px;color:var(--ink-sub);text-align:right;font-weight:500;letter-spacing:.2px}
.indicator-insight{
  background:linear-gradient(135deg,#F7F3EB,#FBF8F1);
  border-radius:var(--radius-sm);padding:18px 20px;margin-top:14px;margin-bottom:10px;
  border:1px solid #E8DFC8;
  box-shadow:0 2px 8px rgba(201,169,110,.08);
}
.indicator-insight-title{font-size:13px;font-weight:800;color:var(--gold-dk);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.indicator-insight p{font-size:14px;color:var(--ink-mid);line-height:1.75}

/* ═══ News / Hot Issue / Deep Dive ═══ */
.news-article{
  background:var(--bg-card);border-radius:var(--radius);
  border:1px solid var(--border);overflow:hidden;margin-bottom:18px;
  transition:all .25s var(--ease);box-shadow:var(--shadow-sm);
}
.news-article:hover{border-color:var(--border);box-shadow:var(--shadow)}
.news-tag-bar{padding:16px 20px 0;display:flex;align-items:center;gap:8px}
.news-tag{display:inline-flex;align-items:center;gap:4px;padding:4px 12px;border-radius:6px;font-size:11px;font-weight:700;letter-spacing:.3px}
.tag-economy{background:var(--accent-lt);color:var(--accent-bright)}.tag-tax{background:var(--purple-lt);color:var(--purple)}
.tag-insurance{background:var(--green-lt);color:var(--green)}.tag-policy{background:var(--orange-lt);color:var(--orange)}
.tag-market{background:var(--yellow-lt);color:var(--yellow)}.tag-life{background:#FCE8F3;color:#BE185D}
.tag-hot{background:var(--red-lt);color:var(--red)}
.news-title{padding:12px 20px 0;font-size:17px;font-weight:800;color:var(--ink);line-height:1.45;letter-spacing:-.3px}
.news-body{padding:12px 20px 18px;font-size:15px;color:var(--ink-mid);line-height:1.85;font-weight:400}
.news-body strong{color:var(--ink);font-weight:700}
.news-body em{font-style:normal;background:linear-gradient(transparent 62%,rgba(201,169,110,.18) 62%);font-weight:600;color:var(--ink)}

/* ─── Takeaway Box (Premium) ─── */
.takeaway{
  margin:0 20px 18px;padding:16px 18px;
  background:var(--bg-card);border-radius:var(--radius-sm);
  border-left:4px solid;font-size:14px;color:var(--ink-mid);line-height:1.75;
  box-shadow:0 2px 8px rgba(20,27,45,.04);
}
.takeaway-economy{border-left-color:var(--accent-bright)}.takeaway-insurance{border-left-color:var(--green)}
.takeaway-policy{border-left-color:var(--orange)}.takeaway-tax{border-left-color:var(--purple)}
.takeaway-hot{border-left-color:var(--red)}.takeaway-deepdive{border-left-color:var(--purple)}
.takeaway-label{font-size:12px;font-weight:800;margin-bottom:6px;display:flex;align-items:center;gap:5px;letter-spacing:.2px}
.takeaway-economy .takeaway-label{color:var(--accent-bright)}.takeaway-insurance .takeaway-label{color:var(--green)}
.takeaway-policy .takeaway-label{color:var(--orange)}.takeaway-tax .takeaway-label{color:var(--purple)}
.takeaway-hot .takeaway-label{color:var(--red)}.takeaway-deepdive .takeaway-label{color:var(--purple)}

/* ─── Deep Dive (Premium) ─── */
.deepdive{
  background:var(--bg-card);border-radius:var(--radius);
  border:1px solid var(--border);overflow:hidden;margin-bottom:18px;
  position:relative;box-shadow:var(--shadow-card);
}
.deepdive-badge{position:absolute;top:0;right:0;background:var(--purple);color:#fff;font-size:11px;font-weight:800;padding:5px 16px 5px 20px;border-radius:0 0 0 14px;letter-spacing:.5px}
.deepdive .news-title{padding-top:40px;font-size:19px;font-weight:800;letter-spacing:-.3px}
.deepdive-summary{
  margin:14px 20px;padding:16px 18px;
  background:linear-gradient(135deg,#F3F1FB,#EBE9F8);
  border-radius:var(--radius-sm);border-left:4px solid var(--purple);
}
.deepdive-summary-title{font-size:12px;font-weight:800;color:var(--purple);margin-bottom:10px;letter-spacing:.3px}
.deepdive-summary li{font-size:14px;color:var(--ink-mid);line-height:1.65;margin-bottom:6px;list-style:none;padding-left:18px;position:relative}
.deepdive-summary li::before{content:'•';position:absolute;left:0;color:var(--purple);font-weight:700;font-size:16px}
.deepdive-qa{margin:18px 20px 20px}
.deepdive-q{
  font-size:15px;font-weight:700;color:var(--ink);margin-bottom:8px;
  padding:10px 14px 10px 42px;position:relative;
  background:var(--accent-lt);border-radius:var(--radius-xs);
}
.deepdive-q::before{
  content:'Q';position:absolute;left:12px;top:10px;
  font-family:var(--font-d);font-size:15px;font-weight:800;
  color:#fff;background:var(--purple);width:24px;height:24px;
  border-radius:6px;display:flex;align-items:center;justify-content:center;
}
.deepdive-a{font-size:14px;color:var(--ink-mid);line-height:1.85;margin-bottom:22px;padding-left:14px;border-left:2px solid var(--border-lt)}

/* ─── Hot Issue (Premium) ─── */
.hot-issue{
  background:var(--bg-card);border-radius:var(--radius);
  border:1px solid var(--red);overflow:hidden;margin-bottom:18px;
  position:relative;box-shadow:0 4px 16px rgba(192,57,43,.08);
  background:linear-gradient(180deg,#FFFBFA 0%,#fff 40%);
}
.hot-badge{position:absolute;top:0;right:0;background:var(--red);color:#fff;font-size:11px;font-weight:800;padding:5px 16px 5px 20px;border-radius:0 0 0 14px;letter-spacing:.5px}
.hot-issue .news-title{padding-top:18px;font-size:19px;font-weight:800;letter-spacing:-.3px}

/* ═══ Subscribe Button ═══ */
@keyframes shimmer{0%{background-position:200% center}100%{background-position:-200% center}}

// ═══ URL Parameters ═══
const params=new URLSearchParams(location.search);
const fcId=params.get('fc')||'';
const dateParam=params.get('d')||'';

// 날짜 없으면 오늘(KST)
function getTodayKST(){
  const now=new Date();
  const kst=new Date(now.getTime()+9*60*60*1000);
  return kst.getUTCFullYear()+String(kst.getUTCMonth()+1).padStart(2,'0')+String(kst.getUTCDate()).padStart(2,'0');
}
const fileDate=dateParam||getTodayKST();

// ═══ Global State ═══
let fcData=null;
let reportData=null;
let prevIndicators=null; // ★ 전일 경제지표 (전일비 표시용)
let spData=null; // ★ 컨설턴트 카톡 공유 설정 (fc_share_profiles)

// ═══ Main Init ═══
async function init(){
  try{
    // fc 파라미터 필수
    if(!fcId){
      showError('잘못된 접근이에요','링크를 다시 확인해주세요.');
      return;
    }

    // ★ 1단계: 프로필 + 역할 체크 병렬 조회
    let fcSnap,userQ;
    try{
      [fcSnap,userQ]=await Promise.all([
        getDoc(doc(db,'consultants',fcId)),
        getDocs(query(collection(db,'users'),where('loginId','==',fcId),limit(1)))
      ]);
    }catch(e){
      console.warn('init parallel-1 fail:',e);
      showError('현재 이용할 수 없는 서비스입니다','담당 컨설턴트에게 문의해주세요.');
      return;
    }
    if(!fcSnap.exists()){
      showError('컨설턴트 정보를 찾을 수 없어요','링크를 다시 확인해주세요.');
      return;
    }
    fcData=fcSnap.data();
    const userRole=(!userQ.empty)?userQ.docs[0].data().role:'';
    if(userRole!=='jarvia_member'&&userRole!=='jarvia_inner'&&userRole!=='jarvia_report'&&userRole!=='inner_circle'){
      showError('현재 이용할 수 없는 서비스입니다','담당 컨설턴트에게 문의해주세요.');
      return;
    }

    // ★ 1단계 완료 → 프로필 먼저 표시
    document.getElementById('loadingState').style.display='none';
    document.getElementById('mainContent').style.display='block';
    renderConsultant();

    // ★ 2단계: 리포트 + 전일지표 + 공유설정 병렬 조회
    const [drResult,prevResult,spResult]=await Promise.allSettled([
      getDoc(doc(db,'client_daily_reports',fileDate)),
      getDocs(query(collection(db,'client_daily_reports'),orderBy('createdAt','desc'),limit(2))),
      getDoc(doc(db,'fc_share_profiles',fcId))
    ]);

    // 2-1. 리포트 처리
    const drSnap=(drResult.status==='fulfilled')?drResult.value:null;
    if(drSnap&&drSnap.exists()&&drSnap.data().status==='published'){
      reportData=drSnap.data();
    } else {
      // 오늘 리포트 미발행 → 최근 published 리포트로 fallback
      const fallbackSnap=await getDocs(query(
        collection(db,'client_daily_reports'),
        orderBy('createdAt','desc'),
        limit(10)
      ));
      const latest=fallbackSnap.docs.find(d=>d.data().status==='published');
      if(!latest){
        showError('브리핑이 아직 준비 중이에요','조금 뒤에 다시 방문해주세요!');
        return;
      }
      reportData=latest.data();
    }

    // 2-2. 전일 경제지표
    if(prevResult.status==='fulfilled'){
      const prevDocs=prevResult.value.docs.filter(d=>d.id!==fileDate);
      if(prevDocs.length>0) prevIndicators=prevDocs[0].data().indicators||null;
    }

    // 2-3. 카톡 공유 설정
    if(spResult.status==='fulfilled'&&spResult.value.exists()) spData=spResult.value.data();

    // ★ 2단계 완료 → 나머지 렌더링
    renderDateHero();
    renderAudio();
    renderSections();
    renderCTA();

    // 4. 아카이브 로드
    loadArchive();

    // 5. 하단 공유바 표시
    document.getElementById('shareBar').style.display='flex';


  }catch(e){
    console.error('init error:',e);
    showError('데이터를 불러올 수 없어요',e.message);
  }
}

function showError(title,msg){
  document.getElementById('loadingState').style.display='none';
  const el=document.getElementById('errorState');
  el.innerHTML=`<h2>${esc(title)}</h2><p>${esc(msg)}</p><br><a href="https://jarvia.co.kr" style="color:var(--accent)">JARVIA 메인으로</a>`;
  el.style.display='block';
}

// ═══ Render: Consultant ═══
function renderConsultant(){
  const fc=fcData;
  const displayName=`${fc.company||''} ${fc.name||''} ${fc.title||''}`.trim();
  const initial=(fc.name||'?')[0];

  // Header
  const avatarEl=document.getElementById('fcAvatar');
  if(fc.photoUrl){avatarEl.innerHTML=`<img src="${esc(fc.photoUrl)}" alt="">`;}
  else{avatarEl.textContent=initial;}
  document.getElementById('fcName').textContent=displayName;
  document.getElementById('fcCompany').textContent=fc.greeting||'';

  // ★ 상단 카카오톡 오픈채팅 버튼
  const kakaoBtn=document.getElementById('fcKakaoBtn');
  if(fc.kakaoUrl){kakaoBtn.href=fc.kakaoUrl;kakaoBtn.style.display='inline-flex';}
  else{kakaoBtn.style.display='none';}

  // ★ 이너서클 링크 버튼 (커스텀1, 커스텀2만 — 있는 것만)
  const innerLinks=document.getElementById('innerLinks');
  const linkDefs=[
    {url:fc.expertHomeUrl,label:'🏠 '+(fc.expertHomeLabel||'명칭입력')},
    {url:fc.morningReadingUrl,label:'📖 '+(fc.morningReadingLabel||'명칭입력')},
  ];
  const linkBtns=linkDefs.filter(l=>l.url).map(l=>`<a class="inner-link-btn" href="${esc(l.url)}" target="_blank">${l.label}</a>`).join('');
  if(linkBtns){innerLinks.innerHTML=linkBtns;innerLinks.style.display='flex';}
  else{innerLinks.style.display='none';}

  // ★ 아침독서(bookzip) + 브로슈어 바 — 오디오 아래
  const bookzipBar=document.getElementById('bookzipBar');
  const bookzipInner=document.getElementById('bookzipBarInner');
  const bzItems=[];
  const isMonday=new Date().getDay()===1;
  if(fc.morningBookzipUrl){
    // bookzip.kr b값 자동 증가: 저장 시 기준 월요일(bookzipBaseDate)부터 매주 +1
    let bzUrl=fc.morningBookzipUrl;
    try{
      const u=new URL(bzUrl);
      const bParam=parseInt(u.searchParams.get('b')||'0');
      if(bParam>0&&fc.bookzipBaseDate){
        const baseDate=new Date(fc.bookzipBaseDate+'T00:00:00+09:00');
        const now=new Date();
        const diffMs=now-baseDate;
        const diffWeeks=Math.floor(diffMs/(7*24*60*60*1000));
        const newB=bParam+Math.max(0,diffWeeks);
        u.searchParams.set('b',newB);
        bzUrl=u.toString();
      }
    }catch(e){}
    const mondayClass=isMonday?' bz-monday':'';
    const bzSub=!fc.brochureUrl?'<div class="bz-sub">화제의 신간 · 베스트셀러 도서 요약</div>':'';
    bzItems.push(`<a class="bookzip-bar-item bz-reading${mondayClass}" href="${esc(bzUrl)}" target="_blank"><span class="bz-icon">📖</span><div class="bz-label">오늘의 아침독서${bzSub}</div><span class="bz-arrow">→</span></a>`);
  }
  if(fc.brochureUrl){
    const bzLabel=fc.brochureLinkLabel||'컨설팅 브로슈어';
    bzItems.push(`<a class="bookzip-bar-item bz-brochure" href="${esc(fc.brochureUrl)}" target="_blank"><span class="bz-icon">📋</span><span class="bz-label">${esc(bzLabel)}</span><span class="bz-arrow">→</span></a>`);
  }
  if(bzItems.length){bookzipInner.innerHTML=bzItems.join('');bookzipBar.style.display='block';}
  else{bookzipBar.style.display='none';}

  // ★ 네이버 검색창
  const naverWrap=document.getElementById('naverBarWrap');
  if(fc.naverUrl&&fc.name){
    document.getElementById('naverBarLink').href=fc.naverUrl;
    document.getElementById('naverQuery').textContent=`경영컨설턴트 ${fc.name}`;
    naverWrap.style.display='block';
  }else{naverWrap.style.display='none';}

  // CTA
  const ctaAvatarEl=document.getElementById('ctaAvatar');
  if(fc.photoUrl){ctaAvatarEl.innerHTML=`<img src="${esc(fc.photoUrl)}" alt="">`;}
  else{ctaAvatarEl.textContent=initial;}
  // 하단 CTA — 회사명(첫째줄) / 성명+직함(둘째줄)
  document.getElementById('ctaCompany').textContent=fc.company||'';
  document.getElementById('ctaName').textContent=`${fc.name||''} ${fc.title||''}`.trim();

  // CTA buttons
  let btns='';
  if(fc.phone){
    btns+=`<div style="display:flex;gap:8px;width:100%;align-items:center">
      <a href="tel:${esc(fc.phone)}" style="flex:0 0 42px;width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--accent-lt);color:var(--accent-bright);text-decoration:none;font-size:18px;transition:all .2s" title="전화연결">📞</a>
      <a href="sms:${esc(fc.phone)}" style="flex:0 0 42px;width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--accent-lt);color:var(--accent-bright);text-decoration:none;font-size:18px;transition:all .2s" title="문자전송">💬</a>
      <button class="sub-free-btn" onclick="openSubModal()" style="flex:1">무료구독</button>
    </div>`;
  }
  document.getElementById('ctaButtons').innerHTML=btns;


}

// ═══ Render: Date Hero ═══
function renderDateHero(){
  const d=reportData;
  // "2026년 3월 11일 수요일" → "3월 11일 수요일"
  const shortDate=(d.date||'').replace(/^\d{4}년\s*/,'');
  document.getElementById('dateMainText').textContent=shortDate;
  const fc=fcData;
  document.getElementById('dateGreeting').innerHTML=
    `준비한 금융 정보가 도움 되시길 바랍니다.`;
  // 특별 메시지 배너 (실제 텍스트 + 게시기간 내에만 표시)
  const spIcon=document.getElementById('spMsgIcon');
  spIcon.style.display='none';
  const _hasSpMsg=fc&&fc.specialMessage&&fc.specialMessage.replace(/<[^>]*>/g,'').trim().length>0;
  let _spInRange=false;
  if(_hasSpMsg){
    const _today=new Date();const _tStr=_today.getFullYear()+'-'+String(_today.getMonth()+1).padStart(2,'0')+'-'+String(_today.getDate()).padStart(2,'0');
    const _sD=fc.spMsgStartDate||'',_eD=fc.spMsgEndDate||'';
    _spInRange=(!_sD&&!_eD)||(_sD<=_tStr&&_tStr<=_eD);
  }
  if(_hasSpMsg&&_spInRange){
    const _fcLabel=`${fc.name||''} ${fc.title||''}`.trim();
    document.getElementById('dateGreeting').innerHTML=
      `<div class="sp-msg-banner" onclick="openSpModal()"><span>✉️ ${esc(_fcLabel)}의 메시지가 있어요</span><span class="sp-arrow">✔</span></div>`;
  }
}

// ═══ Special Message Modal ═══
function openSpModal(){
  const fc=fcData;if(!fc||!fc.specialMessage)return;
  const _txt=(fc.specialMessage||'').replace(/<[^>]*>/g,'').trim();
  if(!_txt)return;
  // 게시기간 체크
  const _today2=new Date();const _tStr2=_today2.getFullYear()+'-'+String(_today2.getMonth()+1).padStart(2,'0')+'-'+String(_today2.getDate()).padStart(2,'0');
  const _sD2=fc.spMsgStartDate||'',_eD2=fc.spMsgEndDate||'';
  if(_sD2&&_eD2&&(_tStr2<_sD2||_tStr2>_eD2))return;
  const av=document.getElementById('spModalAvatar');
  if(fc.photoUrl){av.innerHTML='<img src="'+fc.photoUrl+'" alt="">';}
  else{av.textContent=(fc.name||'?')[0];}
  document.getElementById('spModalName').textContent=(fc.company||'')+' '+(fc.name||'')+' '+(fc.title||'');
  document.getElementById('spModalRole').textContent=fc.greeting||'';
  // specialMessage는 HTML로 저장됨 (contentEditable 에디터)
  document.getElementById('spModalBody').innerHTML=fc.specialMessage||'';
  document.getElementById('spModalBg').classList.add('active');
}
function closeSpModal(){document.getElementById('spModalBg').classList.remove('active');}
window.openSpModal=openSpModal;window.closeSpModal=closeSpModal;

// ═══ Render: Sections ═══
function renderSections(){
  const d=reportData;
  const container=document.getElementById('sectionsContainer');
  let html='';

  // Section 1: 경제지표
  html+=renderIndicators(d);

  // Section 2: 1분 뉴스
  html+=renderNews(d);

  // Section 3: 딥다이브
  html+=renderDeepDive(d);

  // Section 4: 핫이슈
  html+=renderHotIssue(d);

  // Section 5: 요일별 Issue
  html+=renderWeeklyIssue(d);

  container.innerHTML=html;
}

function renderIndicators(d){
  const inds=d.indicators||[];
  if(!inds.length) return '';

  const grid=inds.map(ind=>{
    // ★ 전일비 계산
    let changeHtml='';
    if(prevIndicators){
      const prev=prevIndicators.find(p=>p.label===ind.label);
      if(prev){
        const tVal=parseFloat(String(ind.value).replace(/,/g,''));
        const yVal=parseFloat(String(prev.value).replace(/,/g,''));
        if(!isNaN(tVal)&&!isNaN(yVal)&&yVal!==0){
          const diff=tVal-yVal;
          const pct=((diff/yVal)*100).toFixed(2);
          if(Math.abs(diff)>0.001){
            const cls=diff>0?'up':'down';
            const arrow=diff>0?'▲':'▼';
            const sign=diff>0?'+':'';
            changeHtml=`<div class="mi-change ${cls}">${arrow} ${sign}${Math.abs(diff)<1?diff.toFixed(3):diff.toFixed(2)} (${sign}${pct}%)</div>`;
          }else{
            changeHtml=`<div class="mi-change flat">— 보합</div>`;
          }
        }
      }
    }
    return `<div class="market-item">
      <div class="mi-label">${esc(ind.label)}</div>
      <div class="mi-val">${esc(ind.value)}${ind.unit&&!ind.unit.includes('=')?` ${esc(ind.unit)}`:''}</div>
      ${changeHtml}
    </div>`;
  }).join('');

  const insight=d.indicatorInsight?
    `<div class="indicator-insight"><div class="indicator-insight-title">💡 한 줄 해석</div><p>${esc(d.indicatorInsight)}</p></div>`:'';

  return `<div class="wrap">
    <div class="sec-divider"><div class="sec-num" style="background:var(--accent)">1</div><div class="sec-divider-text">오늘의 경제 흐름</div></div>
    <div class="market-strip"><div class="market-grid">${grid}</div>
    <div class="market-note">${esc(d.date||'')} 기준 · 한국은행 ECOS</div></div>
    ${insight}
  </div>`;
}

function renderNews(d){
  const news=d.news||[];
  if(!news.length) return '';

  // 첫 번째 기사 제목만 미리보기로 노출 (접힌 상태에서도 보임)
  const firstTitle=news.length>0?`
    <div class="sec-preview" style="border-left-color:var(--green)">
      <span class="news-tag ${news[0].tagClass||'tag-economy'}" style="display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:4px;font-size:11px;font-weight:700;margin-bottom:6px">${esc(news[0].tag)}</span>
      <div style="font-size:15px;font-weight:700;color:var(--ink);line-height:1.45">${esc(news[0].title)}</div>
    </div>`:'';

  const articles=news.map(n=>{
    const tagClass=n.tagClass||'tag-economy';
    const takeawayClass='takeaway-'+(n.tagClass||'').replace('tag-','');
    return `<div class="news-article">
      <div class="news-tag-bar"><span class="news-tag ${esc(tagClass)}">${esc(n.tag)}</span></div>
      <div class="news-title">${esc(n.title)}</div>
      <div class="news-body">${n.body||''}</div>
      ${n.takeaway?`<div class="takeaway ${takeawayClass}"><div class="takeaway-label">📌 알아두면 좋은 포인트</div>${esc(n.takeaway).replace(/^📌\s*/,'')}</div>`:''}
    </div>`;
  }).join('');

  return `<div class="wrap">
    <div class="sec-divider accordion" onclick="toggleSec(this)">
      <div class="sec-num" style="background:var(--green)">2</div>
      <div class="sec-divider-text">1분 뉴스</div>
      <span class="sec-arrow">▼</span>
    </div>
    ${firstTitle}
    <div class="sec-body">
      ${articles}
      <div style="text-align:right;font-size:10px;color:var(--ink-sub);margin-top:-8px">출처: 네이버 뉴스 기반 AI 분석</div>
    </div>
  </div>`;
}

// ═══ Render: 요일별 Issue ═══
function renderWeeklyIssue(d){
  const wi=d.weeklyIssue;
  if(!wi||!wi.title) return '';

  // 요일별 색상: 월/수/금 오렌지, 화/목 녹색
  const dayMatch=(d.date||'').match(/([월화수목금])/);
  const dayChar=dayMatch?dayMatch[1]:'';
  const isOrange=['월','수','금'].includes(dayChar);
  const themeColor=isOrange?'#D4760A':'#22A86B';
  const themeBg=isOrange?'#FEF3E2':'#E6F9EF';

  // 본문을 단락으로 분리
  const bodyText=wi.body||'';
  const paragraphs=bodyText.split(/\n\n+/).filter(Boolean);

  // "많은 분이 모르시는 건데요" 패턴 분리
  let mainParts=[];
  let surprisePart='';
  paragraphs.forEach(p=>{
    if(p.includes('많은 분이 모르시는')||p.includes('의외의 사실')){
      surprisePart=p.replace(/^많은 분이 모르시는 건데요\s*[-—]\s*/,'').replace(/^의외의 사실[:\s]*/,'');
    }else{
      mainParts.push(p);
    }
  });

  const mainBody=mainParts.map(p=>`<div style="font-size:14px;line-height:1.75;color:var(--ink);margin-bottom:12px">${esc(p)}</div>`).join('');

  const surpriseHTML=surprisePart?
    `<div style="background:${themeBg};border-radius:var(--radius-xs);padding:14px;margin:12px 0;border-left:3px solid ${themeColor}">
      <div style="font-size:12px;font-weight:700;color:${themeColor};margin-bottom:4px">많은 분이 모르시는 건데요</div>
      <div style="font-size:13px;color:var(--ink);line-height:1.6">${esc(surprisePart)}</div>
    </div>`:'';

  return `<div class="wrap">
    <div class="sec-divider accordion" onclick="toggleSec(this)">
      <div class="sec-num" style="background:${themeColor}">5</div>
      <div class="sec-divider-text">${esc(wi.dayLabel||'요일별 Issue')}</div>
      <span class="sec-arrow">▼</span>
    </div>
    <div class="sec-preview" style="border-left-color:${themeColor}">
      <div style="font-size:15px;font-weight:700;color:var(--ink);line-height:1.45">${esc(wi.title)}</div>
    </div>
    <div class="sec-body">
      <div style="padding:0 2px">
        ${mainBody}
        ${surpriseHTML}
      </div>
      <div style="text-align:right;font-size:10px;color:var(--ink-sub);margin-top:8px">출처: 정책브리핑·네이버 뉴스 기반 AI 분석</div>
    </div>
  </div>`;
}

// ═══ Archive ═══
async function loadArchive(){
  try{
    // ★ orderBy만 사용하여 복합 인덱스 불필요 — status 필터는 JS에서 처리
    const snap=await getDocs(query(collection(db,'client_daily_reports'),orderBy('createdAt','desc'),limit(30)));
    const published=snap.docs.filter(d=>d.data().status==='published').slice(0,5);
    if(published.length<=1){return;} // 오늘 1건뿐이면 아카이브 미표시
    const dates=published.map(d=>{
      const data=d.data();
      // "2026년 3월 11일 수요일" → "3/11 수"
      const fd=data.fileDate||d.id;
      const raw=data.date||'';
      const m=raw.match(/(\d+)월\s*(\d+)일.*?([월화수목금토일])/);
      const label=m?`${m[1]}/${m[2]} ${m[3]}`:fd;
      return {fd,label};
    });
    const el=document.getElementById('archiveList');
    el.innerHTML=dates.map(d=>{
      const isCurrent=d.fd===fileDate;
      return `<a class="archive-btn${isCurrent?' current':''}" href="./client-daily.html?fc=${fcId}&d=${d.fd}">${d.label}</a>`;
    }).join('');
    document.getElementById('archiveSection').style.display='block';
    document.getElementById('archiveLink').href=`./client-archive.html?fc=${fcId}`;
  }catch(e){
    console.warn('archive load fail:',e);
  }
}

// ═══ Audio Player ═══
let audioOpen=false;
const audioEl=document.getElementById('audioEl');

window.toggleAudio=function(){
  const exp=document.getElementById('audioExpanded');
  const card=document.getElementById('audioCard');
  audioOpen=!audioOpen;
  exp.classList.toggle('show',audioOpen);
  card.style.borderRadius=audioOpen?'var(--radius) var(--radius) 0 0':'var(--radius)';
};
window.playPause=function(){
  if(audioEl.paused){audioEl.play();document.getElementById('playPauseBtn').textContent='⏸';}
  else{audioEl.pause();document.getElementById('playPauseBtn').textContent='▶';}
};
window.skipAudio=function(sec){audioEl.currentTime=Math.max(0,Math.min(audioEl.duration||0,audioEl.currentTime+sec));};
window.setSpeed=function(rate){
  audioEl.playbackRate=rate;
  document.querySelectorAll('.audio-speed-btn').forEach(b=>{b.classList.toggle('active',parseFloat(b.textContent)===rate);});
};
window.seekAudio=function(e){
  const wrap=document.getElementById('audioProgressWrap');
  const rect=wrap.getBoundingClientRect();
  const x=e.clientX!==undefined?e.clientX-rect.left:e.offsetX;
  audioEl.currentTime=Math.max(0,(x/rect.width)*(audioEl.duration||0));
};
function fmtTime(sec){if(!sec||!isFinite(sec))return'0:00';const m=Math.floor(sec/60);const s=Math.floor(sec%60);return m+':'+String(s).padStart(2,'0');}
audioEl.addEventListener('timeupdate',()=>{
  if(!audioEl.duration)return;
  const pct=audioEl.currentTime/audioEl.duration*100;
  document.getElementById('audioProgress').style.width=pct+'%';
  document.getElementById('audioCurrentTime').textContent=fmtTime(audioEl.currentTime);
  const remain=audioEl.duration-audioEl.currentTime;
  document.getElementById('audioRemainTime').textContent='-'+fmtTime(remain);
});
audioEl.addEventListener('ended',()=>{document.getElementById('playPauseBtn').textContent='▶';});
audioEl.addEventListener('loadedmetadata',()=>{
  const dur=audioEl.duration;
  if(dur&&isFinite(dur)){
    const m=Math.floor(dur/60);const s=Math.floor(dur%60);
    document.getElementById('audioDur').textContent=`${m}:${String(s).padStart(2,'0')}`;
  }
});

// ═══ Progress Bar Touch/Mouse Drag ═══
(function(){
  const wrap=document.getElementById('audioProgressWrap');
  if(!wrap)return;
  let dragging=false;
  function seek(clientX){
    const rect=wrap.getBoundingClientRect();
    const ratio=Math.max(0,Math.min(1,(clientX-rect.left)/rect.width));
    if(audioEl.duration&&isFinite(audioEl.duration)){
      audioEl.currentTime=ratio*audioEl.duration;
      document.getElementById('audioProgress').style.width=(ratio*100)+'%';
    }
  }
  wrap.addEventListener('mousedown',function(e){dragging=true;seek(e.clientX);e.preventDefault();});
  document.addEventListener('mousemove',function(e){if(dragging)seek(e.clientX);});
  document.addEventListener('mouseup',function(){dragging=false;});
  wrap.addEventListener('touchstart',function(e){dragging=true;seek(e.touches[0].clientX);e.preventDefault();},{passive:false});
  document.addEventListener('touchmove',function(e){if(dragging)seek(e.touches[0].clientX);},{passive:true});
  document.addEventListener('touchend',function(){dragging=false;});
})();

    if(navigator.clipboard){navigator.clipboard.writeText(url).then(()=>showToast('카카오 SDK 오류 — 링크를 복사했습니다.'));}
    return;
  }
  // ★ fc_share_profiles에서 컨설턴트가 설정한 제목·설명·이미지 사용

  const desc=(spData&&spData.shareDesc)||'매일 아침 전해드리는 금융 인사이트';
  const imageUrl=(spData&&spData.shareImageUrl)||'https://jarvia.co.kr/client_report_share_v2.png';

  });
};
window.copyLink=function(){
  const url=`https://jarvia.co.kr/briefing?fc=${encodeURIComponent(fcId)}`;
  if(navigator.clipboard){navigator.clipboard.writeText(url).then(()=>showToast('링크가 복사되었어요!'));}
  else{const ta=document.createElement('textarea');ta.value=url;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);showToast('링크가 복사되었어요!');}
};
window.referFriend=function(){
  const url=`https://jarvia.co.kr/briefing?fc=${encodeURIComponent(fcId)}`;

function esc(s){return s?String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'):'';}
