      '<div class="tip">이름을 고치면 고객 화면의 「○○님께」 인사말에 바로 반영됩니다. 이미 고객이 받은 카톡 미리보기 제목은 바뀌지 않습니다.</div>' +
      '<div class="fl"><span class="lb">진행 상태 (나만 보임)</span><div class="chips" id="edProg">' + PROG.slice(1).map(function (p) { return '<button type="button" data-v="' + esc(p) + '"' + (S.edit.progress === p ? ' class="on"' : '') + '>' + esc(p) + '</button>'; }).join('') + '</div></div>' +
      '<div class="fl"><label for="edMemo">내 메모 (나만 보임 · 300자)</label><textarea id="edMemo" maxlength="300" placeholder="예: 12/2 통화 — 설립 당시 차용증 있음, 다음 주 미팅">' + esc(x.memo || '') + '</textarea></div>' +
      '<div class="err" id="edErr"></div>' +
      '<div class="acts"><button class="bt pri wide" type="button" data-act="saveEdit">저장</button><button class="bt gh wide" type="button" data-act="closeSend">닫기</button></div>';
    bg.classList.add('on'); sheet.classList.add('on'); document.body.classList.add('lock');
  }
  function saveEdit() {
    var e = S.edit; if (!e) return;
    var name = (document.getElementById('edName').value || '').trim(), memo = document.getElementById('edMemo').value, err = document.getElementById('edErr');
    if (!name) { err.textContent = '고객 이름을 넣어 주세요.'; return; }
    if (/[<>]/.test(name + memo)) { err.textContent = '< > 기호는 쓸 수 없습니다.'; return; }
    callFn('ttSet', { k: e.k, custName: name, progress: e.progress, memo: memo }).then(function () {
      S.hist.forEach(function (h) { if (h.k === e.k) { h.custName = name; h.progress = e.progress; h.memo = memo.trim(); } });
      S.edit = null; closeSend(); render(); toast('저장했습니다');
    }, function (er) { err.textContent = er.message; });
  }
  function closeSend() {
    var wasSent = S.send && S.send.sent;
    sheet.classList.remove('on'); bg.classList.remove('on');
    if (!view.classList.contains('on')) document.body.classList.remove('lock');
    S.send = null; S.edit = null;
    if (wasSent && S.tab === 'hist') loadHist(true); else if (wasSent && !view.classList.contains('on')) render();
  }

  /* ── 이벤트 ── */
  document.addEventListener('click', function (e) {
    var t = e.target;
    var tab = t.closest('.tabs button'); if (tab) { S.tab = tab.getAttribute('data-tab'); render(); if (S.tab === 'hist') loadHist(true); return; }
    var op = t.closest('[data-open]'); if (op) { openTopic(op.getAttribute('data-open')); return; }
    var vb = t.closest('[data-view]'); if (vb) { S.view = vb.getAttribute('data-view'); lsSet(LS.view, S.view); render(); return; }
    var cb = t.closest('[data-cat]'); if (cb) { S.cat = cb.getAttribute('data-cat'); render(); return; }
    var hf = t.closest('[data-hf]'); if (hf) { S.hf = hf.getAttribute('data-hf'); render(); return; }
    var rs = t.closest('[data-resend]'); if (rs) {
      var x = S.hist.filter(function (h) { return h.k === rs.getAttribute('data-resend'); })[0]; if (!x) return;
      var tp = S.topics.filter(function (y) { return y.tid === x.tid; })[0] || {};
      openSend('', { k: x.k, tid: x.tid, title: x.title, custName: x.custName, hook: tp.hook || x.title, ogImage: tp.ogImage || '' });
      if (!S.send.msg) S.send.msg = x.custName + '님, 지난번 보내 드린 세무 점검 안내 링크를 다시 보내 드립니다. 편하실 때 확인해 보세요.';
      paintSend(); return;
    }
    var cp = t.closest('[data-copy]'); if (cp) { copyText(CUST_BASE + cp.getAttribute('data-copy'), '고객 링크를 복사했습니다'); return; }
    var ed = t.closest('[data-edit]'); if (ed) { openEdit(ed.getAttribute('data-edit')); return; }
    var pg = t.closest('#edProg button'); if (pg) { S.edit.progress = pg.getAttribute('data-v') === S.edit.progress ? '' : pg.getAttribute('data-v'); document.querySelectorAll('#edProg button').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-v') === S.edit.progress); }); return; }
    var dl = t.closest('[data-del]'); if (dl) {
      if (!confirm('이 발송 내역을 지울까요?\n고객이 받은 링크도 더 이상 열리지 않습니다. (이미 들어온 상담 요청은 고객 요청 목록에 남습니다)')) return;
      var k = dl.getAttribute('data-del');
      callFn('ttRemove', { k: k }).then(function () { S.hist = S.hist.filter(function (h) { return h.k !== k; }); render(); toast('지웠습니다'); }, function (er) { toast(er.message); });
      return;
    }
    var a = t.closest('[data-act]'); if (!a) return;
    var act = a.getAttribute('data-act');
    if (act === 'closeView') closeView();
    else if (act === 'custPv') custPreview('');
    else if (act === 'openSend') openSend('');
    else if (act === 'closeSend') closeSend();
    else if (act === 'docEdit') { try { vIf.contentDocument.getElementById('btnEdit').click(); } catch (er2) {} }
    else if (act === 'saveEdit') saveEdit();
    else if (act === 'pvSend') { if (S.send) { S.send.name = (document.getElementById('sdName').value || '').trim(); } var keep = S.cur; if (!S.cur && S.send) S.cur = { tid: S.send.tid }; custPreview(S.send && S.send.name); S.cur = keep; }
    else if (act === 'share' || act === 'copySend') {
      if (!sendReady()) return;
      var s = S.send, text = s.msg.trim() + '\n\n' + linkOf(s);
      issue({ k: s.k, tid: s.tid, custName: s.name });   /* 등록은 기다리지 않음 (공유창은 누른 즉시) */
      if (act === 'share' && navigator.share) {
        navigator.share({ text: text }).then(function () { afterSend(); toast('보냈습니다. 「발송 내역」에서 열람·상담 신청을 확인하세요.'); }, function () { afterSend(); });
      } else { afterSend(); copyText(text, act === 'share' ? '이 기기에서는 공유창을 열 수 없어 문구+링크를 복사했습니다. 카카오톡에 붙여 넣어 보내세요.' : '문구와 링크를 복사했습니다. 카카오톡에 붙여 넣어 보내세요.'); }
    }
  });
  document.addEventListener('keydown', function (e) {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.closest && e.target.closest('[data-open]')) { e.preventDefault(); openTopic(e.target.closest('[data-open]').getAttribute('data-open')); }
    if (e.key === 'Escape') { if (sheet.classList.contains('on')) closeSend(); else if (view.classList.contains('on')) closeView(); }
  });
  document.addEventListener('input', function (e) {
    var id = e.target && e.target.id;
    if (id === 'q') { S.qq = e.target.value; paintBody(); }   /* 입력칸은 그대로 두고 목록만 (한글 입력이 끊기지 않게) */
    else if (id === 'hq') { S.hq = e.target.value; paintBody(); }
    else if ((id === 'sdName' || id === 'sdMsg') && S.send) {
      var nm = document.getElementById('sdName').value.trim();
      if (id === 'sdName' && S.send.sent && !S.send.again && nm !== S.send.name) { S.send.k = rnd22(); S.send.sent = false; S.send.counted = false; var er = document.getElementById('sdErr'); if (er) er.textContent = ''; }   /* 보낸 뒤 이름을 바꾸면 다른 고객 → 새 링크 */
      S.send.name = nm; S.send.msg = document.getElementById('sdMsg').value; paintBubble();
    }
  });
  document.addEventListener('change', function (e) { if (e.target && e.target.id === 'sort') { S.sort = e.target.value; lsSet(LS.sort, S.sort); render(); } });
  bg.addEventListener('click', closeSend);
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') { flush(); if (S.tab === 'hist' && !S.send) loadHist(true); } });

  /* ── 시작: 자비아 로그인 이어받기 ── */
  function fail(title, msg, login) {
    main.innerHTML = '<div class="state"><b>' + esc(title) + '</b>' + esc(msg) + (login ? '<br><a class="bt nv" href="./index.html">자비아로 가기</a>' : '<br><button class="bt nv" type="button" onclick="location.reload()">다시 열기</button>') + '</div>';
  }
  Promise.all([import(FBJS + 'firebase-app.js'), import(FBJS + 'firebase-auth.js')]).then(function (m) {
    var a = m[0].getApps().length ? m[0].getApp() : m[0].initializeApp(FB_CFG), auth = m[1].getAuth(a);
    return new Promise(function (res) { var un = m[1].onAuthStateChanged(auth, function (u) { un(); res(u); }); });
  }).then(function (u) {
    if (!u || u.isAnonymous) { fail('자비아에 로그인해 주세요', '세무예규·판례 영업주제는 자비아에 로그인한 상태에서 메인 화면 버튼으로 엽니다.', true); return; }
    S.token = function () { return u.getIdToken(); };
    flush();
    return callFn('ttTopics', {}).then(function (r) {
      S.me = r.me || {}; S.topics = r.topics || [];
      render();
      var h = (location.hash || '').slice(1); if (/^no\d{2,4}$/.test(h) && S.topics.some(function (x) { return x.tid === h; })) openTopic(h);
      callFn('ttList', {}).then(function (r2) { S.hist = r2.items || []; if (S.tab === 'hist') render(); else badge(); }, function () {});
    });
  }).catch(function (e) {
    var m = (e && e.message) || '';
    if (/멤버십|회원 정보|로그인/.test(m)) fail('이용할 수 없습니다', m, true); else fail('불러오지 못했습니다', '인터넷 연결을 확인한 뒤 다시 열어 주세요. (' + m + ')');
  });
})();
</script>
</body>
</html>
