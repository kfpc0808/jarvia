<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>택스컨설팅 위클리 아카이브</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&family=Noto+Serif+KR:wght@400;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0f2545;--navy-lt:#1a3a6b;--navy-mid:#2a4a7b;
  --gold:#c9a84c;--gold-lt:#f0d080;
  --bg:#f7f5f0;--bg-card:#fff;--bg-warm:#f2f0eb;
  --ink:#1a1a2e;--ink-mid:#3d3d5c;--ink-lt:#6b6b8d;--ink-sub:#9e9eb8;
  --border:#e0ddd6;--border-lt:#ede9e1;
  --red:#c0392b;--green:#1a7a4a;--blue:#1565C0;
  --shadow:0 2px 8px rgba(15,37,69,.08);--shadow-md:0 4px 16px rgba(15,37,69,.12);
  --radius:16px;--radius-sm:10px;
  --font:'Noto Sans KR',-apple-system,sans-serif;
  --font-d:'Outfit','Noto Sans KR',sans-serif;
  --font-s:'Noto Serif KR',serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:var(--font);background:var(--bg);color:var(--ink);line-height:1.7;-webkit-font-smoothing:antialiased}

/* ── 헤더 ── */
.hd{background:linear-gradient(135deg,var(--navy),var(--navy-lt));position:relative}
.hd::after{content:'';position:absolute;bottom:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--gold),var(--gold-lt),var(--gold))}
.hd-inner{max-width:860px;margin:0 auto;padding:20px 20px 24px;display:flex;align-items:center;justify-content:space-between}
.hd-badge{font-size:10px;font-weight:800;color:var(--gold);letter-spacing:1px;margin-bottom:2px}
.hd-title{font-family:var(--font-d);font-size:20px;font-weight:800;color:#fff}
.hd-sub{font-size:12px;color:rgba(255,255,255,.5);margin-top:1px}
.hd-back{padding:8px 16px;border-radius:8px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.85);font-size:13px;font-weight:600;text-decoration:none;transition:all .2s;white-space:nowrap}
.hd-back:hover{background:rgba(255,255,255,.2)}

/* ── 탭 ── */
.tab-wrap{max-width:860px;margin:-16px auto 0;padding:0;position:relative;z-index:2}
.tab-inner{background:var(--bg-card);box-shadow:var(--shadow-md);padding:10px 20px;display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tab-inner::-webkit-scrollbar{display:none}
.tab-btn{flex-shrink:0;padding:8px 16px;border-radius:20px;border:1px solid var(--border);background:var(--bg);font-size:13px;font-weight:600;color:var(--ink-lt);cursor:pointer;transition:all .2s;font-family:var(--font);white-space:nowrap}
.tab-btn:hover{border-color:var(--navy);color:var(--navy);background:#E8F0FE}
.tab-btn.active{background:var(--navy);color:#fff;border-color:var(--navy)}

/* ── 검색/필터 바 ── */
.filter-bar{max-width:860px;margin:16px auto 0;padding:0 20px}
.filter-inner{background:var(--bg-card);border-radius:var(--radius-sm);padding:12px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;box-shadow:var(--shadow)}
.filter-inner input{flex:1;min-width:160px;padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-family:var(--font);font-size:13px;color:var(--ink);background:var(--bg)}
.filter-inner input:focus{outline:none;border-color:var(--navy)}
.filter-sel{padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-family:var(--font);font-size:13px;color:var(--ink);background:var(--bg);cursor:pointer}

/* ── 콘텐츠 영역 ── */
.content{max-width:860px;margin:0 auto;padding:16px 20px 80px}
.loading{text-align:center;padding:60px 0;color:var(--ink-lt)}
.spin{width:32px;height:32px;border:3px solid var(--border);border-top:3px solid var(--navy);border-radius:50%;animation:sp .7s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}

/* ── 카드 그리드 ── */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.tw-card{background:var(--bg-card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--border-lt);overflow:hidden;cursor:pointer;transition:all .2s}
.tw-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);border-color:var(--navy-lt)}

/* 카드 헤더 */
.tc-header{padding:14px 16px;background:linear-gradient(135deg,var(--navy),var(--navy-lt));color:#fff;position:relative}
.tc-badge{position:absolute;top:10px;right:12px;font-size:9px;font-weight:800;color:var(--gold);letter-spacing:1px;border:1px solid rgba(201,168,76,.4);padding:2px 6px;border-radius:4px}
.tc-type{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;margin-bottom:6px}
.tc-type.personal{background:rgba(232,240,254,.2);color:#a8d0ff}
.tc-type.corporate{background:rgba(232,245,233,.2);color:#a8e6a3}
.tc-title{font-size:14px;font-weight:700;line-height:1.4;color:#fff;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;padding-right:40px}
.tc-date{font-size:11px;color:rgba(255,255,255,.5);margin-top:6px}

/* 카드 바디 */
.tc-body{padding:12px 16px}
.tc-category{display:inline-block;font-size:10px;font-weight:600;padding:2px 8px;border-radius:4px;background:var(--bg-warm);border:1px solid var(--border-lt);color:var(--ink-lt);margin-bottom:8px}
.tc-summary{font-size:12px;color:var(--ink-mid);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tc-formats{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.tc-fmt{font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px}
.tc-fmt.html{background:#EFF6FF;color:var(--blue)}
.tc-fmt.audio{background:#FAF5FF;color:#6D28D9}
.tc-fmt.image{background:#FFF7ED;color:#C2410C}

/* ── 상세 모달 ── */
.modal{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center}
.mdl-bg{position:absolute;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(4px)}
.mdl-box{position:relative;background:var(--bg-card);border-radius:var(--radius);padding:28px;max-width:520px;width:92%;max-height:90vh;overflow-y:auto;box-shadow:0 8px 40px rgba(0,0,0,.2);z-index:1}
.mdl-x{position:absolute;top:12px;right:16px;background:none;border:none;font-size:26px;color:var(--ink-lt);cursor:pointer}
.mdl-x:hover{color:var(--ink)}

/* 상세 내용 */
.det-badge{display:inline-block;padding:4px 12px;border-radius:6px;font-size:11px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--navy),var(--navy-lt));letter-spacing:.5px;margin-bottom:12px}
.det-title{font-family:var(--font-s);font-size:18px;font-weight:700;color:var(--ink);line-height:1.4;margin-bottom:10px}
.det-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.det-tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:4px}
.det-tag.personal{background:#E8F0FE;color:#1A5276}
.det-tag.corporate{background:#E8F5E9;color:#1B5E20}
.det-tag.cat{background:var(--bg-warm);border:1px solid var(--border);color:var(--ink-lt)}
.det-date{font-size:11px;color:var(--ink-sub);margin-left:auto}
.det-summary{font-size:13px;color:var(--ink-mid);line-height:1.7;margin-bottom:16px;padding:10px 14px;background:var(--bg-warm);border-radius:8px;border-left:3px solid var(--gold)}

/* 액션 버튼 */
.det-notice{padding:8px 12px;background:#E8F0FE;border-left:3px solid var(--navy-lt);border-radius:0 6px 6px 0;font-size:12px;color:var(--ink-mid);margin-bottom:12px}
.det-actions{display:flex;flex-direction:column;gap:8px}
.det-btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;border-radius:10px;font-size:14px;font-weight:600;border:none;cursor:pointer;transition:all .2s;font-family:var(--font)}
.det-btn.primary{background:linear-gradient(135deg,var(--navy),var(--navy-lt));color:#fff}
.det-btn.primary:hover{opacity:.9}
.det-btn.secondary{background:var(--bg-warm);border:1px solid var(--border);color:var(--ink)}
.det-btn.secondary:hover{border-color:var(--navy);color:var(--navy)}
.det-btn.gold{background:linear-gradient(135deg,#8B6914,var(--gold));color:#fff}
.fav-btn{background:none;border:1px solid var(--border);border-radius:8px;padding:8px 16px;font-size:13px;color:var(--ink-lt);cursor:pointer;font-family:var(--font);transition:all .2s;margin-top:4px}
.fav-btn:hover,.fav-btn.active{border-color:var(--gold);color:var(--gold)}

/* ── 페이저 ── */
.pager{display:flex;justify-content:center;gap:6px;margin-top:24px;flex-wrap:wrap}
.pg-btn{padding:6px 12px;border-radius:8px;border:1px solid var(--border);background:var(--bg-card);font-size:12px;font-weight:600;color:var(--ink-lt);cursor:pointer;transition:all .2s;font-family:var(--font)}
.pg-btn:hover{border-color:var(--navy);color:var(--navy)}
.pg-btn.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.pg-btn:disabled{opacity:.4;cursor:not-allowed}

/* ── 빈 상태 ── */
.empty{text-align:center;padding:60px 20px;color:var(--ink-lt)}
.empty-icon{font-size:48px;margin-bottom:12px}
.empty h3{font-size:18px;color:var(--ink);margin-bottom:6px}

/* ── 토스트 ── */
.hidden{display:none!important}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#1a1a2e;color:#fff;padding:10px 20px;border-radius:10px;font-size:13px;font-weight:600;opacity:0;transition:all .3s;z-index:999;white-space:nowrap;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:520px){
  .hd-inner{flex-direction:column;gap:10px;text-align:center}
  .card-grid{grid-template-columns:1fr}
  .tab-btn{font-size:12px;padding:6px 12px}
  .mdl-box{padding:20px 16px}
}
</style>
</head>
<body>

<!-- 헤더 -->
<header class="hd">
  <div class="hd-inner">
    <div>
      <div class="hd-badge">TAX CONSULTING WEEKLY</div>
      <div class="hd-title">택스컨설팅 위클리 아카이브</div>
      <div class="hd-sub">국세청 예규 기반 세무 상담 시나리오 모음</div>
    </div>
    <a class="hd-back" href="./index.html">← 메인</a>
  </div>
</header>

<!-- 탭 -->
<div class="tab-wrap">
  <div class="tab-inner">
    <button class="tab-btn active" onclick="switchTab('all',this)">📋 전체</button>
    <button class="tab-btn" onclick="switchTab('personal',this)">👤 개인편 (수)</button>
    <button class="tab-btn" onclick="switchTab('corporate',this)">🏢 법인편 (목)</button>
  </div>
</div>

<!-- 필터 바 -->
<div class="filter-bar">
  <div class="filter-inner">
    <input type="text" id="kw-input" placeholder="제목 또는 분야로 검색..." oninput="onSearch()">
    <select id="cat-sel" class="filter-sel" onchange="onSearch()">
      <option value="">전체 분야</option>
      <option value="상속세">상속세</option>
      <option value="증여세">증여세</option>
      <option value="연금퇴직">연금·퇴직소득</option>
      <option value="보험세금">보험과 세금</option>
      <option value="종합소득">종합소득세</option>
      <option value="양도소득">양도소득세</option>
      <option value="기타절세">기타 절세</option>
      <option value="CEO퇴직금">CEO 퇴직금</option>
      <option value="가지급금">가지급금·가수금</option>
      <option value="법인보험">법인보험</option>
      <option value="가업승계">가업승계</option>
      <option value="비용처리">법인세 비용처리</option>
      <option value="임원보수">임원 보수·상여</option>
      <option value="자산관리">법인 자산관리</option>
    </select>
  </div>
</div>

<!-- 콘텐츠 -->
<div class="content">
  <div id="main"><div class="loading"><div class="spin"></div><p>아카이브를 불러오는 중...</p></div></div>
</div>

<!-- 상세 모달 -->
<div class="modal hidden" id="mdl-detail">
  <div class="mdl-bg" onclick="closeDetail()"></div>
  <div class="mdl-box">
    <button class="mdl-x" onclick="closeDetail()">×</button>
    <div id="det-inner"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import{getFirestore,collection,query,where,orderBy,getDocs,doc,getDoc,setDoc,updateDoc,increment,serverTimestamp,Timestamp}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
import{getAuth,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';

const FC={apiKey:"AIzaSyCf7CsUTgfIWY-RW_mvTJOhczDtk1xM9sA",authDomain:"kfpc-company-support-project.firebaseapp.com",projectId:"kfpc-company-support-project",storageBucket:"kfpc-company-support-project.firebasestorage.app",messagingSenderId:"1012609333373",appId:"1:1012609333373:web:7b6c207c81ff10d156d914"};
const app=initializeApp(FC);
const db=getFirestore(app,'javia-db');
const auth=getAuth(app);

// ── 전역 상태 ──
let allContents=[];
let filtered=[];
let me=null;
let meData=null;
let myFavSet=new Set();
let curTab='all';
let curPage=1;
const PER=12;
let _detContent=null;

// ── 인증 ──
onAuthStateChanged(auth,async u=>{
  me=u;
  if(u){
    try{
      const snap=await getDoc(doc(db,'users',u.uid));
      if(snap.exists())meData=snap.data();
      const favSnap=await getDocs(query(collection(db,'view_logs'),where('userId','==',u.uid)));
      favSnap.docs.forEach(d=>{if(d.data().contentId)myFavSet.add(d.data().contentId);});
    }catch(e){}
  }
  loadContents();
});

// ── 데이터 로드 ──
async function loadContents(){
  try{
    const snap=await getDocs(query(
      collection(db,'contents'),
      where('type','==','tax_weekly'),
      where('isActive','==',true),
      orderBy('createdAt','desc')
    ));
    allContents=snap.docs.map(d=>({id:d.id,...d.data()}));
    applyFilter();
  }catch(e){
    $('main').innerHTML=`<div class="empty"><div class="empty-icon">⚠️</div><h3>로드 실패</h3><p>${esc(e.message)}</p></div>`;
  }
}

// ── 필터·검색 ──
function applyFilter(){
  const kw=$('kw-input').value.toLowerCase().trim();
  const cat=$('cat-sel').value;
  filtered=allContents.filter(c=>{
    if(curTab==='personal'&&c.subType!=='개인')return false;
    if(curTab==='corporate'&&c.subType!=='법인')return false;
    if(cat&&!(c.category||'').includes(cat))return false;
    if(kw&&!c.title.toLowerCase().includes(kw)&&!(c.category||'').toLowerCase().includes(kw)&&!(c.summary||'').toLowerCase().includes(kw))return false;
    return true;
  });
  curPage=1;
  render();
}

window.switchTab=function(tab,btn){
  curTab=tab;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  if(btn)btn.classList.add('active');
  applyFilter();
  window.scrollTo({top:160,behavior:'smooth'});
};
window.onSearch=function(){applyFilter();};

// ── 렌더링 ──
function render(){
  if(!filtered.length){
    $('main').innerHTML=`<div class="empty"><div class="empty-icon">📋</div><h3>콘텐츠가 없습니다</h3><p>아직 발행된 택스컨설팅 위클리가 없습니다.</p></div>`;
    return;
  }
  const total=filtered.length;
  const pages=Math.ceil(total/PER);
  if(curPage>pages)curPage=pages;
  const slice=filtered.slice((curPage-1)*PER,curPage*PER);

  let html=`<div style="font-size:12px;color:var(--ink-sub);margin-bottom:12px">총 ${total}건</div>`;
  html+='<div class="card-grid">';
  for(const c of slice){
    const subClass=c.subType==='개인'?'personal':'corporate';
    const subLabel=c.subType==='개인'?'👤 개인편':'🏢 법인편';
    const hasAudio=!!c.audioUrl;
    const hasCards=!!(c.cardUrls&&c.cardUrls.length);
    const dateStr=c.scheduledDate||fdate(c.createdAt);
    html+=`<div class="tw-card" onclick="openDetail('${c.contentId||c.id}')">
      <div class="tc-header">
        <div class="tc-badge">TCW</div>
        <div class="tc-type ${subClass}">${subLabel}</div>
        <div class="tc-title">${esc(c.title)}</div>
        <div class="tc-date">${dateStr}</div>
      </div>
      <div class="tc-body">
        ${c.category?`<span class="tc-category">${esc(c.category)}</span>`:''}
        <div class="tc-summary">${esc(c.summary||'국세청 예규 기반 세무 상담 시나리오')}</div>
        <div class="tc-formats">
          <span class="tc-fmt html">HTML</span>
          ${hasAudio?'<span class="tc-fmt audio">오디오</span>':''}
          ${hasCards?'<span class="tc-fmt image">카드</span>':''}
        </div>
      </div>
    </div>`;
  }
  html+='</div>';

  if(pages>1){
    html+='<div class="pager">';
    html+=`<button class="pg-btn" onclick="goPage(${curPage-1})" ${curPage===1?'disabled':''}>‹</button>`;
    const start=Math.max(1,curPage-2),end=Math.min(pages,curPage+2);
    if(start>1)html+=`<button class="pg-btn" onclick="goPage(1)">1</button>${start>2?'<span style="padding:0 4px;color:var(--ink-sub)">…</span>':''}`;
    for(let i=start;i<=end;i++)html+=`<button class="pg-btn ${i===curPage?'active':''}" onclick="goPage(${i})">${i}</button>`;
    if(end<pages)html+=`${end<pages-1?'<span style="padding:0 4px;color:var(--ink-sub)">…</span>':''}<button class="pg-btn" onclick="goPage(${pages})">${pages}</button>`;
    html+=`<button class="pg-btn" onclick="goPage(${curPage+1})" ${curPage===pages?'disabled':''}>›</button>`;
    html+='</div>';
  }
  $('main').innerHTML=html;
}

window.goPage=function(p){if(p<1)return;curPage=p;render();window.scrollTo({top:200,behavior:'smooth'});};

// ── 상세 모달 ──
window.openDetail=async function(cid){
  const c=allContents.find(x=>(x.contentId||x.id)===cid);
  if(!c)return;
  _detContent=c;
  if(!me){toast('로그인이 필요합니다.');return;}

  const subClass=c.subType==='개인'?'personal':'corporate';
  const subLabel=c.subType==='개인'?'👤 개인편':'🏢 법인편';
  const hasAudio=!!c.audioUrl;
  const hasCards=!!(c.cardUrls&&c.cardUrls.length);
  const isFav=myFavSet.has(cid);
  const dateStr=c.scheduledDate||fdate(c.createdAt);
  /* ★ 첫 번째 콘텐츠 = 무료 샘플 */
  const twSorted=[...allContents].sort((a,b)=>{const at=a.createdAt?.toMillis?a.createdAt.toMillis():0;const bt=b.createdAt?.toMillis?b.createdAt.toMillis():0;return at-bt;});
  const sampleCid=twSorted.length?(twSorted[0].contentId||twSorted[0].id):null;
  const sampleC=sampleCid?allContents.find(x=>(x.contentId||x.id)===sampleCid):null;

  $('det-inner').innerHTML=`
    <div class="det-badge">TAX CONSULTING WEEKLY</div>
    <div class="det-title">${esc(c.title)}</div>
    <div class="det-meta">
      <span class="det-tag ${subClass}">${subLabel}</span>
      ${c.category?`<span class="det-tag cat">${esc(c.category)}</span>`:''}
      <span class="det-date">${dateStr}</span>
    </div>
    <div class="det-summary">${esc(c.summary||'국세청 예규 기반 보험·재무 컨설턴트 세무 상담 시나리오')}</div>
    <div class="det-notice">📚 본 콘텐츠는 국세청 예규/판례 기반 참고자료입니다. 실제 적용 전 세무사 확인을 권장합니다.</div>
    <div class="det-actions">
      ${c.url?`<button class="det-btn primary" onclick="archPayAndOpen('${cid}','html')">📄 HTML 열람</button>`:''}
      ${hasCards?`<button class="det-btn gold" onclick="archPayAndOpen('${cid}','cards')">🖼 카드 이미지</button>`:''}
      ${hasAudio?`<button class="det-btn secondary" onclick="archPayAndOpen('${cid}','audio')">🎧 오디오 듣기</button>`:''}
    </div>
    ${sampleC&&sampleC.url?`<button class="det-btn secondary" onclick="closeDetail();openHtmlViewer('${sampleCid}')" style="width:100%;margin-top:8px;background:#FFF8E1;border:1px solid #D4A03C;color:#8B6914">🆓 무료 샘플 보기</button>`:''}
    <button class="fav-btn ${isFav?'active':''}" onclick="doFav('${cid}',this)">${isFav?'★ 즐겨찾기 해제':'☆ 즐겨찾기'}</button>
  `;
  document.getElementById('mdl-detail').classList.remove('hidden');
};

// ── 결제 게이트 (버튼 클릭 시 결제 후 콘텐츠 열기) ──
window.archPayAndOpen=async function(cid,action){
  const c=allContents.find(x=>(x.contentId||x.id)===cid);if(!c)return;
  const role=meData?.role||'';
  const isFreeUser=role==='free_user'||role==='user';
  if(isFreeUser){
    const pt=meData?.point||0;
    if(pt<2000){toast('포인트가 부족합니다. 2,000P 필요합니다.');return;}
    if(!confirm(`택스컨설팅위클리 열람 시 2,000P가 차감됩니다.\n현재 포인트: ${pt.toLocaleString()}P\n\n계속하시겠습니까?`))return;
    try{
      await updateDoc(doc(db,'users',me.uid),{point:increment(-2000)});
      meData.point=pt-2000;
      await setDoc(doc(db,'view_logs',gid()),{logId:gid(),userId:me.uid,contentId:cid,price:2000,txId:'point',paidAt:serverTimestamp(),expiresAt:Timestamp.fromDate(new Date(Date.now()+30*24*60*60*1000)),createdAt:serverTimestamp()});
    }catch(e){toast('처리 중 오류: '+e.message);return;}
  }else{
    try{await setDoc(doc(db,'view_logs',gid()),{logId:gid(),userId:me.uid,contentId:cid,price:0,txId:'',paidAt:serverTimestamp(),expiresAt:Timestamp.fromDate(new Date(Date.now()+30*24*60*60*1000)),createdAt:serverTimestamp()});}catch(e){}
  }
  try{await updateDoc(doc(db,'contents',cid),{viewCount:increment(1)});}catch(e){}
  if(action==='html')openHtmlViewer(cid);
  else if(action==='cards')openCards(cid);
  else if(action==='audio')openAudio(cid);
};

window.closeDetail=function(){document.getElementById('mdl-detail').classList.add('hidden');};

// ── 즐겨찾기 ──
window.doFav=async function(cid,btn){
  if(!me){toast('로그인이 필요합니다.');return;}
  try{
    if(myFavSet.has(cid)){
      myFavSet.delete(cid);
      btn.textContent='☆ 즐겨찾기';btn.classList.remove('active');
      toast('즐겨찾기에서 제거했습니다.');
    }else{
      myFavSet.add(cid);
      btn.textContent='★ 즐겨찾기 해제';btn.classList.add('active');
      await setDoc(doc(db,'favorites',me.uid+'_'+cid),{userId:me.uid,contentId:cid,createdAt:serverTimestamp()},{merge:true});
      toast('즐겨찾기에 추가했습니다.');
    }
  }catch(e){toast('처리 실패: '+e.message);}
};

// ── HTML 풀스크린 뷰어 (iframe) ──
window.openHtmlViewer=function(cid){
  const c=allContents.find(x=>(x.contentId||x.id)===cid);
  if(!c||!c.url)return;
  closeDetail();
  const old=document.getElementById('tcw-html-viewer');if(old)old.remove();
  const _hasCards=!!(c.cardUrls&&c.cardUrls.length);
  const wrap=document.createElement('div');
  wrap.id='tcw-html-viewer';
  wrap.style.cssText='position:fixed;inset:0;z-index:400;background:#fff;display:flex;flex-direction:column';
  wrap.innerHTML=`
    <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:linear-gradient(135deg,#0f2545,#1a3a6b);flex-shrink:0">
      <div style="flex:1;min-width:0;font-size:13px;font-weight:700;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(c.title)}</div>
      <div style="display:flex;gap:8px;flex-shrink:0;margin-left:12px">
        ${_hasCards?`<button onclick="document.getElementById('tcw-html-viewer').remove();openCardsSeamless('${cid}')" style="background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);color:#fff;font-size:11px;font-weight:600;padding:6px 12px;border-radius:6px;cursor:pointer;white-space:nowrap">🖼 이미지</button>`:''}
        <button onclick="document.getElementById('tcw-html-viewer').remove()" style="background:rgba(255,255,255,.15);border:none;color:#fff;font-size:20px;width:36px;height:36px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center">×</button>
      </div>
    </div>
    <iframe src="${c.url}" style="flex:1;width:100%;border:none" allowfullscreen></iframe>`;
  document.body.appendChild(wrap);
};

// ── 카드 뷰어 ──
window.openCards=function(cid){
  const c=allContents.find(x=>(x.contentId||x.id)===cid);
  if(!c||!c.cardUrls||!c.cardUrls.length)return;
  const old=document.getElementById('tcw-cards-modal');
  if(old)old.remove();
  const wrap=document.createElement('div');
  wrap.id='tcw-cards-modal';
  wrap.style.cssText='position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.88);overflow-y:auto;padding:20px 16px 40px';
  const imgs=c.cardUrls.map((url,i)=>`
    <div style="margin-bottom:16px;border-radius:12px;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,.5)">
      <img src="${url}" style="width:100%;display:block" loading="lazy" alt="${i+1}번 카드" onclick="window.open('${url}','_blank')">
      <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:#1a1a2e">
        <span style="font-size:12px;color:rgba(255,255,255,.5)">${i+1} / ${c.cardUrls.length}</span>
        <a href="${url}" download="tcw_card_${String(i+1).padStart(2,'0')}.png" style="font-size:12px;color:#c9a84c;text-decoration:none;padding:4px 8px">⬇ 저장</a>
      </div>
    </div>`).join('');
  wrap.innerHTML=`
    <div style="max-width:560px;margin:0 auto">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;padding:0 4px">
        <div>
          <div style="font-size:10px;font-weight:800;color:#c9a84c;letter-spacing:1px;margin-bottom:2px">TAX CONSULTING WEEKLY</div>
          <div style="font-size:14px;font-weight:700;color:#fff;line-height:1.3">${esc(c.title)}</div>
        </div>
        <button onclick="document.getElementById('tcw-cards-modal').remove()" style="background:rgba(255,255,255,.15);border:none;color:#fff;font-size:22px;width:40px;height:40px;border-radius:50%;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center">×</button>
      </div>
      ${imgs}
    </div>`;
  document.body.appendChild(wrap);
};
// ── 카드 뷰어 (연속 스크롤 — iframe 헤더에서 호출) ──
window.openCardsSeamless=function(cid){
  const c=allContents.find(x=>(x.contentId||x.id)===cid);
  if(!c||!c.cardUrls||!c.cardUrls.length)return;
  const old=document.getElementById('tcw-cards-modal');if(old)old.remove();
  const wrap=document.createElement('div');
  wrap.id='tcw-cards-modal';
  wrap.style.cssText='position:fixed;inset:0;z-index:400;background:#fff;display:flex;flex-direction:column';
  const imgs=c.cardUrls.map(url=>`<img src="${url}" style="width:100%;display:block" loading="lazy">`).join('');
  wrap.innerHTML=`
    <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:linear-gradient(135deg,#0f2545,#1a3a6b);flex-shrink:0">
      <div style="flex:1;min-width:0;font-size:13px;font-weight:700;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(c.title)}</div>
      <button onclick="document.getElementById('tcw-cards-modal').remove()" style="background:rgba(255,255,255,.15);border:none;color:#fff;font-size:20px;width:36px;height:36px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-left:12px">×</button>
    </div>
    <div style="flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch">${imgs}</div>`;
  document.body.appendChild(wrap);
};

// ── 오디오 플레이어 ──
window.openAudio=function(cid){
  const c=allContents.find(x=>(x.contentId||x.id)===cid);
  if(!c||!c.audioUrl)return;
  closeDetail();

  // 기존 플레이어 제거
  const old=document.getElementById('tcw-audio-modal');
  if(old)old.remove();

  // 커스텀 오디오 플레이어 모달 생성
  const wrap=document.createElement('div');
  wrap.id='tcw-audio-modal';
  wrap.style.cssText='position:fixed;inset:0;z-index:300;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.6)';
  wrap.innerHTML=`
    <div style="width:100%;max-width:520px;background:#fff;border-radius:20px 20px 0 0;padding:24px 20px 36px;box-shadow:0 -8px 40px rgba(0,0,0,.2)">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
        <div>
          <div style="font-size:10px;font-weight:800;color:#c9a84c;letter-spacing:1px;margin-bottom:2px">TAX CONSULTING WEEKLY</div>
          <div style="font-size:14px;font-weight:700;color:#1a1a2e;line-height:1.3;max-width:340px">${esc(c.title)}</div>
        </div>
        <button onclick="document.getElementById('tcw-audio-modal').remove()" style="background:none;border:none;font-size:24px;color:#999;cursor:pointer;padding:4px">×</button>
      </div>
      <audio id="tcw-audio-el" src="${c.audioUrl}" preload="metadata" style="display:none"></audio>
      <!-- 진행바 (모바일 터치 최적화: 높이 40px) -->
      <div style="margin-bottom:10px">
        <input id="tcw-seek" type="range" min="0" max="100" value="0"
          style="width:100%;height:40px;cursor:pointer;accent-color:#0f2545;-webkit-appearance:none;appearance:none;background:transparent"
          oninput="tcwSeek(this.value)" ontouchstart="event.stopPropagation()">
        <style>#tcw-seek::-webkit-slider-runnable-track{height:8px;background:linear-gradient(to right,#0f2545 var(--pct,0%),#e0ddd6 var(--pct,0%));border-radius:4px}#tcw-seek::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#0f2545;margin-top:-10px;box-shadow:0 2px 6px rgba(0,0,0,.3)}#tcw-seek::-moz-range-track{height:8px;background:#e0ddd6;border-radius:4px}#tcw-seek::-moz-range-progress{height:8px;background:#0f2545;border-radius:4px}#tcw-seek::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:#0f2545;border:none}</style>
        <div style="display:flex;justify-content:space-between;font-size:12px;color:#888;margin-top:2px">
          <span id="tcw-cur">0:00</span><span id="tcw-dur">0:00</span>
        </div>
      </div>
      <!-- 메인 컨트롤 -->
      <div style="display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:16px">
        <button onclick="tcwSkip(-15)" style="background:#f2f0eb;border:none;width:44px;height:44px;border-radius:50%;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center" title="-15초">⏮</button>
        <button id="tcw-play-btn" onclick="tcwToggle()" style="background:#0f2545;border:none;width:60px;height:60px;border-radius:50%;font-size:24px;cursor:pointer;color:#fff;display:flex;align-items:center;justify-content:center">▶</button>
        <button onclick="tcwSkip(15)" style="background:#f2f0eb;border:none;width:44px;height:44px;border-radius:50%;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center" title="+15초">⏭</button>
      </div>
      <!-- 배속 선택 -->
      <div style="display:flex;justify-content:center;gap:6px">
        ${['0.75','1','1.25','1.5','2'].map(s=>`<button onclick="tcwSpeed(${s},this)" style="padding:6px 12px;border-radius:16px;border:1px solid #e0ddd6;background:${s==='1'?'#0f2545':'#fff'};color:${s==='1'?'#fff':'#666'};font-size:12px;font-weight:600;cursor:pointer">${s}x</button>`).join('')}
      </div>
    </div>`;
  document.body.appendChild(wrap);
  wrap.addEventListener('click',e=>{if(e.target===wrap)wrap.remove();});

  const audio=document.getElementById('tcw-audio-el');
  const seek=document.getElementById('tcw-seek');

  // 시간 포맷
  function fmt(s){const m=Math.floor(s/60),sec=Math.floor(s%60);return m+':'+String(sec).padStart(2,'0');}

  audio.addEventListener('loadedmetadata',()=>{
    document.getElementById('tcw-dur').textContent=fmt(audio.duration);
  });
  audio.addEventListener('timeupdate',()=>{
    if(!audio.duration)return;
    const pct=(audio.currentTime/audio.duration)*100;
    seek.value=pct;
    seek.style.setProperty('--pct',pct+'%');
    document.getElementById('tcw-cur').textContent=fmt(audio.currentTime);
  });
  audio.addEventListener('ended',()=>{document.getElementById('tcw-play-btn').textContent='▶';});

  window.tcwToggle=function(){
    if(audio.paused){audio.play();document.getElementById('tcw-play-btn').textContent='⏸';}
    else{audio.pause();document.getElementById('tcw-play-btn').textContent='▶';}
  };
  window.tcwSkip=function(sec){
    audio.currentTime=Math.max(0,Math.min(audio.duration||0,audio.currentTime+sec));
  };
  window.tcwSeek=function(val){
    if(audio.duration)audio.currentTime=(val/100)*audio.duration;
  };
  window.tcwSpeed=function(rate,btn){
    audio.playbackRate=rate;
    document.querySelectorAll('#tcw-audio-modal button[onclick^="tcwSpeed"]').forEach(b=>{
      b.style.background='#fff';b.style.color='#666';
    });
    btn.style.background='#0f2545';btn.style.color='#fff';
  };
  audio.play().then(()=>{document.getElementById('tcw-play-btn').textContent='⏸';}).catch(()=>{});
};

// ── 유틸 ──
function $(id){return document.getElementById(id);}
function esc(s){return s?String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'):''}
function gid(){return Math.random().toString(36).slice(2)+Date.now().toString(36);}
function fdate(ts){
  if(!ts)return '';
  try{const d=ts.toDate?ts.toDate():new Date(ts);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
  catch(e){return String(ts).slice(0,10);}
}
let _toastTimer;
function toast(msg){
  const el=$('toast');if(!el)return;
  el.textContent=msg;el.classList.add('show');
  clearTimeout(_toastTimer);_toastTimer=setTimeout(()=>el.classList.remove('show'),3000);
}
</script>
</body>
</html>
