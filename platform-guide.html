<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIA 마이플랫폼 사용 안내서</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@700;900&family=IBM+Plex+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --night:#0c1411; --mint:#2fb286; --mint-bright:#7defc4; --mint-dim:#1a6b50;
  --gold:#c9a85c; --paper:#f2f5f1; --paper-mute:#9bb0a5;
  --serif:'Noto Serif KR',serif; --sans:'IBM Plex Sans KR',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--sans);
  background:radial-gradient(900px 700px at 75% -10%, rgba(47,178,134,.14) 0%, transparent 55%), var(--night);
  color:var(--paper);display:flex;align-items:center;justify-content:center;overflow:hidden}

.stage{position:relative;width:min(460px,97vw);height:min(840px,97vh);
  border:1px solid rgba(47,178,134,.25);border-radius:26px;
  background:linear-gradient(165deg, rgba(19,33,27,.7), rgba(12,20,17,.95));
  box-shadow:0 40px 90px rgba(0,0,0,.6);overflow:hidden;
  display:flex;flex-direction:column;align-items:center}

.cap{position:relative;z-index:8;width:100%;padding:15px 18px 8px;text-align:center;
  background:linear-gradient(180deg,rgba(12,20,17,.96),rgba(12,20,17,0))}
.cap .ch{font-size:10.5px;letter-spacing:.3em;color:var(--mint);font-weight:600}
.cap .tt{font-family:var(--serif);font-weight:900;font-size:17px;margin-top:6px;line-height:1.35;
  opacity:0;transform:translateY(6px);transition:.45s}
.cap .tt.show{opacity:1;transform:none}
.cap .tt b{color:var(--mint-bright)}
.cap .url{font-size:11px;color:var(--paper-mute);margin-top:5px;letter-spacing:.04em;opacity:0;transition:.4s}
.cap .url.show{opacity:1}
.cap .url b{color:var(--mint-bright);font-weight:500}

.media{position:relative;z-index:4;flex:1;width:100%;display:flex;align-items:center;justify-content:center;padding:4px 12px}
.vis{display:none;position:relative}
.vis.on{display:flex;align-items:center;justify-content:center}
.phone{width:296px;height:100%;max-height:600px;border-radius:22px;overflow:hidden;background:#fff;
  border:7px solid #05201a;box-shadow:0 16px 44px rgba(0,0,0,.5)}
.phone iframe,.phone img{width:100%;height:100%;border:0;display:block;background:#fff;object-fit:cover;object-position:top}
.wide{width:100%;max-height:100%;border-radius:12px;overflow:hidden;
  border:1px solid rgba(255,255,255,.12);box-shadow:0 16px 44px rgba(0,0,0,.5);background:#fff}
.wide img{width:100%;height:auto;display:block}
.title{flex-direction:column;text-align:center;gap:14px;color:var(--paper);padding:20px}
.title .lg{font-family:var(--serif);font-weight:900;font-size:15px;letter-spacing:.34em;color:var(--gold)}
.title .big{font-family:var(--serif);font-weight:900;font-size:25px;line-height:1.45}
.title .big b{color:var(--mint-bright)}
.title .sub{font-size:13.5px;color:var(--paper-mute);font-weight:300;line-height:1.8}
.title .sub b{color:var(--mint-bright)}

.spot{position:absolute;border-radius:12px;border:2.5px solid var(--mint-bright);
  box-shadow:0 0 0 9999px rgba(6,14,11,.6), 0 0 22px rgba(125,239,196,.7);
  opacity:0;transition:opacity .45s, top .45s, left .45s, width .45s, height .45s;pointer-events:none}
.spot.show{opacity:1}
.tap{position:absolute;width:40px;height:40px;border-radius:50%;border:2px solid var(--mint-bright);
  opacity:0;pointer-events:none}
.tap.show{animation:tapPulse 1.6s ease-out infinite}
@keyframes tapPulse{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.7);opacity:0}}

.ld{position:absolute;inset:0;z-index:5;display:none;align-items:center;justify-content:center;
  background:#0c1411;color:var(--paper-mute);font-size:13px}
.ld.on{display:flex}

.gate{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:22px;
  background:rgba(8,13,11,.9);backdrop-filter:blur(7px);transition:opacity .6s,visibility .6s}
.gate.hide{opacity:0;visibility:hidden}
.gate .lg{font-family:var(--serif);font-weight:900;font-size:15px;letter-spacing:.34em;color:var(--gold)}
.gate .g-title{font-family:var(--serif);font-size:21px;font-weight:900;text-align:center;line-height:1.4}
.gate .g-sub{font-size:13px;color:var(--paper-mute);font-weight:300;line-height:1.8;text-align:center}
.play{width:90px;height:90px;border-radius:50%;border:none;cursor:pointer;
  background:linear-gradient(135deg,var(--mint-bright),var(--mint-dim));
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 16px 40px rgba(47,178,134,.38);animation:pulse 2s ease-in-out infinite;transition:transform .2s}
.play:hover{transform:scale(1.07)}.play svg{width:32px;height:32px;fill:var(--night);margin-left:5px}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(47,178,134,.3)}50%{box-shadow:0 0 0 14px rgba(47,178,134,0)}}

.bottom{position:relative;z-index:8;width:100%;padding:6px 16px 14px;
  background:linear-gradient(0deg,rgba(12,20,17,.97),rgba(12,20,17,0))}
.seek{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.seekTrack{position:relative;flex:1;height:22px;display:flex;align-items:center;cursor:pointer;touch-action:none}
.seekTrack::before{content:'';position:absolute;left:0;right:0;height:5px;border-radius:3px;background:rgba(255,255,255,.16)}
.seekFill{position:absolute;left:0;height:5px;border-radius:3px;background:var(--mint);width:0}
.seekHandle{position:absolute;width:15px;height:15px;border-radius:50%;background:var(--mint-bright);
  box-shadow:0 0 8px rgba(125,239,196,.8);transform:translateX(-50%);left:0;transition:left .12s}
.seekLabel{font-size:11px;color:var(--paper-mute);font-variant-numeric:tabular-nums;min-width:46px;text-align:right}
.ctl-row{display:flex;align-items:center;justify-content:center;gap:10px}
.ctl{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.06);color:var(--paper);
  font-size:16px;line-height:1;cursor:pointer;font-family:var(--sans);transition:.25s;padding:0}
.ctl:hover{border-color:var(--mint);color:var(--mint-bright)}
.hint{text-align:center;font-size:10.5px;color:var(--paper-mute);margin-top:8px;opacity:.8}
</style>
</head>
<body>

<div class="stage" id="stage">

  <div class="gate" id="gate">
    <div class="lg">J A R V I A</div>
    <button class="play" id="playBtn" aria-label="재생"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
    <div class="g-title">마이플랫폼 사용 안내서</div>
    <div class="g-sub">버튼을 누르면 음성 해설과 함께 시작됩니다<br>약 10분 · 차근차근 따라오세요<br><span style="font-size:11px;opacity:.7">아래 막대를 좌우로 끌어 원하는 곳으로 이동</span></div>
  </div>

  <div class="cap">
    <div class="ch" id="capCh">GUIDE</div>
    <div class="tt" id="capTt"></div>
    <div class="url" id="capUrl"><b>jarvia.co.kr/@gildong</b></div>
  </div>

  <div class="media" id="media">
    <div class="vis phone" id="liveWrap">
      <iframe id="frame" title="채널 미리보기" src="about:blank"></iframe>
      <div class="spot" id="liveSpot"></div>
      <div class="tap" id="liveTap"></div>
      <div class="ld" id="ld">실제 채널을 불러오는 중…</div>
    </div>
    <div class="vis phone" id="phoneImgWrap">
      <img id="phoneImg" alt="">
      <div class="spot pct" id="phoneSpot"></div>
    </div>
    <div class="vis wide" id="wideWrap">
      <img id="wideImg" alt="">
      <div class="spot pct" id="wideSpot"></div>
    </div>
    <div class="vis title" id="titleWrap">
      <div class="lg" id="titleLg">J A R V I A</div>
      <div class="big" id="titleBig"></div>
      <div class="sub" id="titleSub"></div>
    </div>
  </div>

  <div class="bottom">
    <div class="seek">
      <div class="seekTrack" id="seekTrack">
        <div class="seekFill" id="seekFill"></div>
        <div class="seekHandle" id="seekHandle"></div>
      </div>
      <div class="seekLabel" id="seekLabel">1 / 28</div>
    </div>
    <div class="ctl-row">
      <button class="ctl" id="prevBtn" aria-label="이전">⏮</button>
      <button class="ctl" id="pauseBtn" aria-label="정지/재개">⏸</button>
      <button class="ctl" id="muteBtn" aria-label="음성 끄기/켜기">🔊</button>
      <button class="ctl" id="nextBtn" aria-label="다음">⏭</button>
      <button class="ctl" id="replayBtn" aria-label="처음부터">↺</button>
    </div>
    <div class="hint">막대를 끌거나 화면을 좌우로 넘겨 원하는 부분으로 이동할 수 있어요</div>
  </div>
</div>

<script>
(function(){
  const DEMO_URL='https://jarvia.co.kr/fc.html?fc=gildong';

  /* 장면 정의 — media: title|live|imgPhone|imgWide
     live target: {top:0} | {sel:'#id'} | {seq:['#a','#b',...]}   img: box:[fx,fy,fw,fh] */
  const CH=[
    {ch:'시작', media:'title', big:'자비아 <b>마이플랫폼</b><br>사용 안내서', sub:'담당자에게 묻지 않아도, 혼자 다 할 수 있도록<br><b>차근차근</b> 따라오세요',
     narr:'자비아 마이플랫폼 사용 안내서입니다. 이 영상 하나면, 담당자에게 따로 묻지 않아도 내 채널을 만들고, 고객에게 보내는 모든 과정을 이해하실 수 있습니다. 순서대로 천천히 따라오세요.', dur:11000},

    {ch:'1 · 내 채널이란', tt:'이것이 <b>내 채널</b>입니다', media:'live', target:{top:0}, url:true,
     narr:'모든 컨설턴트에게는 나만의 채널 주소가 하나씩 주어집니다. 화면에 보이는 이 주소가 곧 나의 미니 홈페이지입니다. 고객은 앱을 깔 필요도, 회원가입을 할 필요도 없습니다. 링크를 누르는 순간, 내 프로필부터 매일의 콘텐츠, 진단 도구까지 전부 열립니다.', dur:12500},

    {ch:'2 · 화면 한 바퀴', tt:'맨 위 — <b>내 프로필</b>', media:'live', target:{sel:'.heroHeader'},
     narr:'채널을 위에서 아래로 한 바퀴 둘러보겠습니다. 맨 위는 내 프로필입니다. 사진, 소속, 경력, 관리 고객 수, 만족도가 표시됩니다.', dur:9500},

    {ch:'2 · 화면 한 바퀴', tt:'<b>오늘의 데일리 Report</b>', media:'live', target:{sel:'#cardDailyLink'},
     narr:'그 아래 오늘의 데일리 리포트 카드는 매일 아침 자동으로 갱신되고, 재생 버튼을 누르면 오디오 브리핑이 나옵니다.', dur:8500},

    {ch:'2 · 화면 한 바퀴', tt:'일정 · <b>미니 시뮬레이션</b>', media:'live', target:{seq:['#cardCalendar','#cardSim']},
     narr:'이어서 이달의 일정과 이벤트, 그리고 삼십 초 미니 시뮬레이션으로 은퇴자금, 상속세, 현재가치, 미래가치를 고객이 직접 계산해 볼 수 있습니다.', dur:10500},

    {ch:'2 · 화면 한 바퀴', tt:'진단 · 추천 · <b>자료실</b>', media:'live', target:{seq:['#cardQuiz','#cardCurated','#cardDashboard','#cardCert','#cardResource']},
     narr:'그 아래로는 십 문항 자가진단, 추천 콘텐츠와 재무 대시보드, 고객들이 좋아하는 아침독서 링크가 이어지고, 바로 아래로 자격증과 경력, 자료실이 놓입니다.', dur:13000},

    {ch:'2 · 화면 한 바퀴', tt:'맨 아래 — <b>신청 · 검진 · 후기</b>', media:'live', target:{seq:['.cardConsultIntro','#kmiBannerOpen','#cardReview']},
     narr:'화면 가장 아래에는 재무진단 신청 카드와 케이엠아이 종합검진 예약, 그리고 고객 후기가 있습니다. 한 페이지에 상담에 필요한 모든 것이 담겨 있습니다.', dur:12000},

    {ch:'3 · 고객에게 보내기', tt:'<b>공유 · 문자</b> 버튼', media:'live', target:{sel:'#fcBottomBar'},
     narr:'화면 맨 아래에는 항상 떠 있는 고정 바가 있습니다. 왼쪽 공유 버튼을 누르면 카카오톡 공유창이 열립니다. 대화 중인 고객에게 그대로 전송하면, 내 채널이 카드 형태로 예쁘게 전달됩니다. 옆의 문자 버튼은 문자 메시지로 링크를 보낼 때 사용합니다.', dur:11500},

    {ch:'3 · 고객에게 보내기', tt:'고객 폰에 <b>설치</b>', media:'live', target:{top:0},
     narr:'고객이 링크를 누르면 채널이 바로 열립니다. 여기서 한 가지 더. 고객 폰 홈 화면에 아이콘으로 설치하도록 안내하면, 앱처럼 한 번에 다시 들어올 수 있습니다.', dur:9500},

    {ch:'3 · 고객에게 보내기', tt:'기기별 <b>설치 방법</b>', media:'live', target:{sel:'#fcBottomBar'},
     narr:'설치 방법은 기기마다 조금 다릅니다. 아이폰은 사파리에서 화면 아래 공유 버튼을 누른 뒤 홈 화면에 추가를 선택합니다. 안드로이드는 보통 메뉴 혹은 점 세 개 버튼에서 홈 화면에 추가를 누릅니다. 카카오톡 안에서 열렸다면, 먼저 우측 메뉴에서 다른 브라우저로 열기를 선택한 뒤 설치하면 됩니다. 이 안내는 채널이 고객에게 직접 띄워 주니, 컨설턴트가 외울 필요는 없습니다.', dur:13500},

    {ch:'4 · 데일리리포트', tt:'매일 아침 <b>자동 발행</b>', media:'live', target:{sel:'#cardDailyLink'},
     narr:'데일리 리포트는 매일 아침 자동으로 새 내용으로 바뀝니다. 고객은 글로 읽어도 되고, 재생 버튼으로 오디오를 들어도 됩니다. 컨설턴트가 매일 손댈 필요가 없습니다. 채널이 알아서 채워집니다. 매일 도움 주는 사람이라는 인상이, 이렇게 자동으로 쌓입니다.', dur:11500},

    {ch:'5 · 진단·계산', tt:'고객이 <b>직접 계산</b>', media:'live', target:{sel:'#cardSim'},
     narr:'미니 시뮬레이션은 고객이 숫자를 직접 넣어 결과를 빠르게 확인하는 도구입니다. 예를 들어 은퇴자금이나 상속세를 계산하면 부족분이 눈에 보입니다. 숫자를 본 고객은 자연스럽게 궁금해집니다.', dur:10000},

    {ch:'5 · 진단·계산', tt:'<b>10문항</b> 자가진단', media:'live', target:{sel:'#cardQuiz'},
     narr:'십 문항 자가진단은 약 삼십 초면 끝납니다. 답을 마치면 점수와 함께 잘하고 계신 점과 점검이 필요한 신호가 정리됩니다. 마지막에 이름과 연락처를 남기고 확인을 누르면, 그 즉시 컨설턴트에게 문자로 알림이 갑니다. 진단이 끝난 직후가, 가장 자연스러운 상담의 출발점입니다.', dur:13000},

    {ch:'6 · 재무진단 신청', tt:'고객이 <b>신청</b>하는 곳', media:'imgPhone', img:'platform-guide-cap-b12.png', box:[0.04,0.56,0.92,0.42],
     narr:'재무진단 신청 카드는 고객이 직접 상담을 요청하는 통로입니다. 이름과 연락처, 관심 있는 진단 분야, 상속·증여, 노후·은퇴, 법인 절세 등을 고르고 신청하기를 누르면 접수됩니다. 개인정보 동의 안내도 자동으로 표시되니, 따로 준비할 게 없습니다.', dur:12500},

    {ch:'6 · 재무진단 신청', tt:'신청은 <b>여기서</b> 확인', media:'imgWide', img:'platform-guide-cap-b10.png', box:[0.005,0.46,0.99,0.14],
     narr:'그렇다면 신청한 내역은 어디서 확인할까요? 두 곳입니다. 첫째, 마이페이지의 재무진단 신청 리스트 탭에서 전체 내역을 봅니다. 둘째, 내 마이플랫폼 채널 하단에서도 실시간으로 확인됩니다. 새 신청이 들어오면 문자 알림도 함께 받으니, 놓칠 일이 없습니다.', dur:13000},

    {ch:'7 · KMI 검진', tt:'건강 혜택까지 <b>한 번에</b>', media:'live', target:{sel:'#kmiBannerOpen'},
     narr:'채널 하단의 케이엠아이 종합건강검진 배너는, 대기업 임직원 수준의 검진을 기업 특별수가로 받을 수 있는 제휴 혜택입니다. 예약하기를 누르면 전용 예약 사이트로 연결됩니다. 회원가입 후 검진을 예약하는 세 단계로 진행됩니다. 고객에게 건강 혜택까지 챙겨 주는, 채널이 고객 폰에 머무를 좋은 이유가 됩니다. 나도, 고객도 함께 혜택을 누릴 수 있습니다.', dur:14000},

    {ch:'8 · 채널 꾸미기', tt:'<b>내플랫폼 관리</b> 탭', media:'imgWide', img:'platform-guide-cap-b1.png', box:[0.0,0.135,0.13,0.07],
     narr:'이제 내 채널을 직접 꾸며 보겠습니다. 마이페이지 상단에서 내플랫폼 관리 탭을 누르면, 지금부터 보여드릴 화면이 나옵니다. 여기서 바꾼 내용은 저장하는 순간 내 채널에 바로 반영됩니다.', dur:10500},

    {ch:'8 · 채널 꾸미기', tt:'주소 복사 · <b>프로필 사진</b>', media:'imgWide', img:'platform-guide-cap-b1.png', box:[0.62,0.30,0.36,0.085],
     narr:'맨 위 마이 채널 유알엘이 내 채널 주소입니다. 복사 버튼으로 복사해 명함이나 카톡 프로필에 붙여 넣으세요. 큐알 버튼으로 큐알코드도 만들 수 있습니다. 그 아래 동그란 사진 자리를 누르면 프로필 사진을 올립니다. 사진은 올린 뒤 드래그와 확대로 원하는 부분만 잘라낼 수 있고, 십 메가 이하면 됩니다.', dur:13500},

    {ch:'8 · 채널 꾸미기', tt:'기본 정보 <b>저장</b>', media:'imgWide', img:'platform-guide-cap-b2.png', box:[0.03,0.78,0.94,0.17],
     narr:'이름과 소속사, 직함, 연락처를 채웁니다. 별표가 붙은 항목은 필수입니다. 아래 아침독서 칸에 책집 주소를 넣어 두면, 매주 월요일 책이 자동으로 한 권씩 넘어갑니다. 다 입력했으면 기본 정보 저장을 꼭 눌러 주세요. 저장해야 채널에 반영됩니다.', dur:13000},

    {ch:'8 · 채널 꾸미기', tt:'소개 · <b>신뢰 지표</b>', media:'imgWide', img:'platform-guide-cap-b3.png', box:[0.01,0.72,0.98,0.24],
     narr:'한 줄 소개에는 나를 표현하는 짧은 문구를 적습니다. 그 아래 신뢰 지표, 경력 연수와 관리 고객 수, 만족도를 적으면 채널 프로필 아래에 표시됩니다. 비워 두면 그 항목은 자동으로 숨겨지니, 채울 것만 채우면 됩니다.', dur:11000},

    {ch:'8 · 채널 꾸미기', tt:'<b>자격증 · 경력</b>', media:'imgWide', img:'platform-guide-cap-b5.png', box:[0.01,0.26,0.98,0.34],
     narr:'자격증은 입력칸에 적고 추가를 누르면 칩처럼 하나씩 붙습니다. 최대 여덟 개까지 넣을 수 있습니다. 그 아래 경력과 수상 이력은 한 줄에서 세 줄까지 자유롭게 적습니다.', dur:9500},

    {ch:'8 · 채널 꾸미기', tt:'<b>사용자 정의 버튼</b>', media:'imgWide', img:'platform-guide-cap-b6.png', box:[0.01,0.17,0.98,0.38],
     narr:'내 블로그나 홈페이지로 보내는 버튼을 직접 만들 수 있습니다. 버튼 이름과 연결할 주소를 적으면 됩니다. 하나만 넣으면 한 줄로, 두 개를 넣으면 나란히 표시됩니다.', dur:9000},

    {ch:'8 · 채널 꾸미기', tt:'<b>자료실</b> 등록', media:'imgWide', img:'platform-guide-cap-b7.png', box:[0.02,0.25,0.96,0.42],
     narr:'고객에게 전달할 자료는 자료실에 등록합니다. 제목과 주소, 종류를 고르고 자료 등록을 누르면 됩니다. 파일은 구글 드라이브에 올린 뒤 그 링크를 넣는 방식을 권장합니다. 등록한 자료는 언제든 편집하거나 삭제할 수 있고, 최대 열두 건까지 담깁니다.', dur:12500},

    {ch:'8 · 채널 꾸미기', tt:'<b>고객 후기</b>', media:'imgWide', img:'platform-guide-cap-b8.png', box:[0.01,0.20,0.98,0.40],
     narr:'후기는 두 가지 방법으로 넣습니다. 준비된 샘플 후기 서른 개에서 골라 가져오거나, 직접 내용과 작성자를 적어 등록합니다. 실명이나 세부 정보가 드러나면 동의가 필요하니, 이름은 익명으로 가공해 넣는 것을 권합니다.', dur:11500},

    {ch:'8 · 채널 꾸미기', tt:'<b>카톡 공유 카드</b> 만들기', media:'imgWide', img:'platform-guide-cap-b9.png', box:[0.01,0.42,0.42,0.46],
     narr:'앞서 본, 카톡으로 채널을 보낼 때 뜨는 그 카드를 여기서 만듭니다. 공유 제목과 설명을 적고, 가로 팔백 세로 사백 크기의 이미지를 올립니다. 다 했으면 채널 정보 저장을 누르세요. 이제 고객에게 채널을 보내면, 방금 설정한 카드 모양으로 예쁘게 전달됩니다.', dur:13000},

    {ch:'8 · 채널 꾸미기', tt:'<b>추천 콘텐츠</b> 고르기', media:'imgWide', img:'platform-guide-cap-b11.png', box:[0.005,0.36,0.99,0.24],
     narr:'채널과 고객용 데일리리포트에 노출할 추천 콘텐츠는 콘텐츠 리스트 탭에서 고릅니다. 즐겨찾기에 담아 둔 글을 추가하거나, 유튜브와 블로그 같은 외부 콘텐츠도 직접 넣을 수 있습니다. 위아래 화살표로 순서를 바꿀 수 있고, 최대 열 건까지 노출됩니다.', dur:12000},

    {ch:'8 · 채널 꾸미기', tt:'<b>들어온 신청</b> 확인', media:'imgWide', img:'platform-guide-cap-b10.png', box:[0.005,0.46,0.99,0.30],
     narr:'고객이 보낸 재무진단 신청은 재무진단 신청 리스트 탭에서 관리합니다. 신규, 연락중, 완료로 한눈에 집계되고, 신청자마다 연락처와 진단 점수, 관심 분야가 보입니다. 상태를 바꾸고 메모도 남길 수 있습니다. 새 신청은 문자로도 알려 드리니, 가능하면 하루 안에 응대하세요.', dur:13500},

    {ch:'마무리', media:'title', titleLg:'고생하셨습니다', big:'이 흐름만 <b>기억하세요</b>', sub:'공유하고 → 고객이 진단하고 → 신청이 들어오고 → 상담으로<br><br><b>jarvia.co.kr</b>',
     narr:'여기까지가 내 채널의 전부입니다. 공유하고, 고객이 진단하고, 신청이 들어오고, 상담으로 이어지는, 이 흐름만 기억하시면 됩니다. 이 영상은 언제든 다시 볼 수 있으니, 막히는 부분이 있으면 처음부터 천천히 따라오세요.', dur:11000},
  ];
  const N=CH.length;

  const $=id=>document.getElementById(id);
  const frame=$('frame'), ld=$('ld');
  const liveWrap=$('liveWrap'), phoneImgWrap=$('phoneImgWrap'), wideWrap=$('wideWrap'), titleWrap=$('titleWrap');
  const phoneImg=$('phoneImg'), wideImg=$('wideImg');
  const liveSpot=$('liveSpot'), liveTap=$('liveTap'), phoneSpot=$('phoneSpot'), wideSpot=$('wideSpot');
  const capCh=$('capCh'), capTt=$('capTt'), capUrl=$('capUrl');
  const titleLg=$('titleLg'), titleBig=$('titleBig'), titleSub=$('titleSub');
  const gate=$('gate'), playBtn=$('playBtn');
  const pauseBtn=$('pauseBtn'), muteBtn=$('muteBtn'), replayBtn=$('replayBtn'), prevBtn=$('prevBtn'), nextBtn=$('nextBtn');
  const seekTrack=$('seekTrack'), seekFill=$('seekFill'), seekHandle=$('seekHandle'), seekLabel=$('seekLabel');

  let cur=-1, timer=null, safety=null, seqTimers=[];
  let muted=false, started=false, paused=false, gen=0, curTryNext=null, dragging=false;
  let koVoice=null, ttsBroken=false, mp3Broken=false;

  function pickVoice(){const vs=speechSynthesis.getVoices();
    koVoice=vs.find(v=>/ko[-_]KR/i.test(v.lang)&&/Heami|SunHi|Google/i.test(v.name))||vs.find(v=>/ko[-_]KR/i.test(v.lang))||null;}
  if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
  function speak(t,cb){if(muted||ttsBroken||!('speechSynthesis' in window)){cb&&cb();return;}
    speechSynthesis.cancel();setTimeout(()=>{const u=new SpeechSynthesisUtterance(t);
      u.lang='ko-KR';if(koVoice)u.voice=koVoice;u.rate=0.96;u.pitch=1.0;let b=false;
      u.onstart=()=>b=true;u.onend=()=>cb&&cb();u.onerror=()=>{if(!b)ttsBroken=true;cb&&cb();};
      try{speechSynthesis.speak(u);}catch(e){ttsBroken=true;cb&&cb();}},120);}
  const AUDIO_BASE='platform-guide-';
  const aud=new Audio();aud.preload='auto';aud.playbackRate=1.0;
  function playNarr(idx,t,cb){
    if(muted){cb&&cb();return;}
    if(mp3Broken){speak(t,cb);return;}
    let done=false;const fin=()=>{if(done)return;done=true;aud.onended=aud.onerror=null;cb&&cb();};
    const fb=()=>{if(done)return;done=true;aud.onended=aud.onerror=null;speak(t,cb);};
    aud.onended=fin;aud.onerror=fb;
    try{aud.playbackRate=1.0;aud.src=AUDIO_BASE+(idx+1)+'.mp3';const p=aud.play();if(p&&p.catch)p.catch(fb);}catch(e){fb();}
  }

  function fdoc(){try{return frame.contentDocument||frame.contentWindow.document;}catch(e){return null;}}
  function fwin(){try{return frame.contentWindow;}catch(e){return null;}}
  function findEl(spec){const d=fdoc();if(!d)return null;
    if(spec.sel){try{return d.querySelector(spec.sel);}catch(e){return null;}}return null;}
  function hideSpots(){[liveSpot,phoneSpot,wideSpot].forEach(s=>s.classList.remove('show'));liveTap.classList.remove('show');}
  function showOnly(el){[liveWrap,phoneImgWrap,wideWrap,titleWrap].forEach(w=>w.classList.toggle('on',w===el));}

  /* 샘플 안내 배너(#sampleNoticeBanner) 숨김 — 안내 영상에선 불필요 */
  function dismissSampleBanner(tries){
    tries=tries||0;const d=fdoc();
    if(d){try{const b=d.getElementById('sampleNoticeBanner');if(b)b.style.display='none';}catch(e){}}
    if(tries<8)setTimeout(()=>dismissSampleBanner(tries+1),500);
  }

  function focusEl(el){
    const win=fwin();if(!win||!el)return;
    const top=el.getBoundingClientRect().top+win.scrollY;
    win.scrollTo({top:Math.max(0,top-90),behavior:'smooth'});
    setTimeout(()=>{try{const r=el.getBoundingClientRect(),pad=8;
      liveSpot.style.top=Math.max(2,r.top-pad)+'px';liveSpot.style.left=Math.max(2,r.left-pad)+'px';
      liveSpot.style.width=Math.min(frame.clientWidth-4,r.width+pad*2)+'px';liveSpot.style.height=r.height+pad*2+'px';
      liveSpot.classList.add('show');
      liveTap.style.top=(r.top+r.height/2-20)+'px';liveTap.style.left=(r.left+r.width-28)+'px';liveTap.classList.add('show');
    }catch(e){}},520);
  }
  function liveHighlight(spec,attempt){
    attempt=attempt||0;const win=fwin(),d=fdoc();
    if(!win||!d){hideSpots();return;}
    if(spec.top!==undefined){win.scrollTo({top:spec.top,behavior:'smooth'});hideSpots();return;}
    if(spec.seq){
      const my=gen;const found=spec.seq.map(s=>{try{return d.querySelector(s);}catch(e){return null;}}).filter(Boolean);
      if(!found.length){if(attempt<6)setTimeout(()=>liveHighlight(spec,attempt+1),400);else hideSpots();return;}
      const cdur=(CH[cur]&&CH[cur].dur)||10000;
      const step=Math.max(1700,(cdur-1300)/found.length);
      found.forEach((el,i)=>seqTimers.push(setTimeout(()=>{if(my!==gen)return;focusEl(el);},Math.round(i*step)+250)));
      return;
    }
    let el=null;
    if(spec.sel){try{el=d.querySelector(spec.sel);}catch(e){}}
    if(!el){if(attempt<6)setTimeout(()=>liveHighlight(spec,attempt+1),400);else hideSpots();return;}
    focusEl(el);
  }
  function boxHighlight(spotEl,box){
    if(!box){spotEl.classList.remove('show');return;}
    spotEl.style.left=(box[0]*100)+'%';spotEl.style.top=(box[1]*100)+'%';
    spotEl.style.width=(box[2]*100)+'%';spotEl.style.height=(box[3]*100)+'%';
    setTimeout(()=>spotEl.classList.add('show'),120);
  }

  function updateSeek(i){const r=N>1?i/(N-1):0;
    seekFill.style.width=(r*100)+'%';seekHandle.style.left=(r*100)+'%';seekLabel.textContent=(i+1)+' / '+N;}

  function go(i){
    if(i<0)i=0;if(i>=N)i=N-1;
    gen++;const my=gen;
    clearTimeout(timer);clearTimeout(safety);seqTimers.forEach(t=>clearTimeout(t));seqTimers=[];
    if('speechSynthesis' in window)speechSynthesis.cancel();
    aud.onended=aud.onerror=null;try{aud.pause();}catch(e){}
    hideSpots();
    cur=i;paused=false;pauseBtn.textContent='⏸';
    const c=CH[cur];
    capCh.textContent='GUIDE'+(c.ch?' · '+c.ch:'');
    capTt.classList.remove('show');capTt.innerHTML=c.tt||'';void capTt.offsetWidth;if(c.tt)capTt.classList.add('show');
    capUrl.classList.toggle('show',!!c.url);
    updateSeek(cur);

    if(c.media==='title'){
      showOnly(titleWrap);
      titleLg.textContent=c.titleLg||'J A R V I A';
      titleBig.innerHTML=c.big||'';titleSub.innerHTML=c.sub||'';
    }else if(c.media==='live'){
      showOnly(liveWrap);dismissSampleBanner(0);liveHighlight(c.target||{top:0});
    }else if(c.media==='imgPhone'){
      showOnly(phoneImgWrap);phoneSpot.classList.remove('show');
      if(phoneImg.getAttribute('src')!==c.img)phoneImg.src=c.img;
      boxHighlight(phoneSpot,c.box);
    }else if(c.media==='imgWide'){
      showOnly(wideWrap);wideSpot.classList.remove('show');
      if(wideImg.getAttribute('src')!==c.img)wideImg.src=c.img;
      boxHighlight(wideSpot,c.box);
    }

    const dur=c.dur||10000,narr=c.narr||'',isLast=cur===N-1;
    let minDone=false,speechDone=muted||!narr;
    const tryNext=()=>{if(my!==gen||paused||dragging)return;if(minDone&&speechDone&&!isLast)go(cur+1);};
    curTryNext=tryNext;
    timer=setTimeout(()=>{minDone=true;tryNext();},dur);
    if(!speechDone){playNarr(cur,narr,()=>{if(my!==gen)return;speechDone=true;setTimeout(tryNext,800);});
      safety=setTimeout(()=>{speechDone=true;tryNext();},dur+16000);}
  }

  playBtn.onclick=()=>{
    started=true;gate.classList.add('hide');
    if('speechSynthesis' in window){speechSynthesis.cancel();pickVoice();}
    if(frame.src==='about:blank'){ld.classList.add('on');frame.src=DEMO_URL;}
    setTimeout(()=>{ld.classList.remove('on');go(0);},2200);
  };
  frame.addEventListener('load',()=>{if(frame.src!=='about:blank'){ld.classList.remove('on');dismissSampleBanner(0);}});

  prevBtn.onclick=()=>{if(started)go(Math.max(0,cur-1));};
  nextBtn.onclick=()=>{if(started)go(Math.min(N-1,cur+1));};
  replayBtn.onclick=()=>{if(started)go(0);};
  pauseBtn.onclick=()=>{if(!started)return;paused=!paused;pauseBtn.textContent=paused?'▶':'⏸';
    if(paused){try{aud.pause();}catch(e){}if('speechSynthesis' in window)speechSynthesis.pause();}
    else{if(aud.src&&!aud.ended){aud.playbackRate=1.0;aud.play().catch(()=>{});}if('speechSynthesis' in window)speechSynthesis.resume();if(curTryNext)curTryNext();}};
  muteBtn.onclick=()=>{muted=!muted;muteBtn.textContent=muted?'🔇':'🔊';
    if('speechSynthesis' in window)speechSynthesis.cancel();try{aud.pause();}catch(e){}if(started&&cur>=0)go(cur);};

  function ratioFromX(x){const r=seekTrack.getBoundingClientRect();return Math.min(1,Math.max(0,(x-r.left)/r.width));}
  function previewIndex(ratio){const i=Math.round(ratio*(N-1));
    seekFill.style.width=(ratio*100)+'%';seekHandle.style.left=(ratio*100)+'%';seekLabel.textContent=(i+1)+' / '+N;return i;}
  let pendingIdx=0;
  seekTrack.addEventListener('pointerdown',e=>{if(!started)return;dragging=true;try{seekTrack.setPointerCapture(e.pointerId);}catch(_){}
    pendingIdx=previewIndex(ratioFromX(e.clientX));});
  seekTrack.addEventListener('pointermove',e=>{if(!dragging)return;pendingIdx=previewIndex(ratioFromX(e.clientX));});
  seekTrack.addEventListener('pointerup',()=>{if(!dragging)return;dragging=false;go(pendingIdx);});
  seekTrack.addEventListener('pointercancel',()=>{dragging=false;if(started)updateSeek(cur);});

  let sx=0,sy=0,sw=false;
  function swStart(e){if(!started)return;const t=e.touches?e.touches[0]:e;sx=t.clientX;sy=t.clientY;sw=true;}
  function swEnd(e){if(!sw||!started)return;sw=false;const t=e.changedTouches?e.changedTouches[0]:e;
    const dx=t.clientX-sx,dy=t.clientY-sy;
    if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.5){go(dx<0?Math.min(N-1,cur+1):Math.max(0,cur-1));}}
  [titleWrap,wideWrap,phoneImgWrap,capTt].forEach(el=>{
    el.addEventListener('touchstart',swStart,{passive:true});el.addEventListener('touchend',swEnd,{passive:true});
    el.addEventListener('pointerdown',swStart);el.addEventListener('pointerup',swEnd);
  });

  updateSeek(0);
})();
</script>
</body>
</html>
