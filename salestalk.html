<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';

import{getFunctions,httpsCallable}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-functions.js';   /* ★ [2026-10-10] 모닝 컨센서스 고객 링크 서명(mcShareKey) */

const FC={apiKey:"AIzaSyBD9p-bf162RiiD1Y3BsY-NvbYjpOSrzmg",authDomain:"jarvia-platform.firebaseapp.com",projectId:"jarvia-platform",storageBucket:"jarvia-platform.firebasestorage.app",messagingSenderId:"388025068900",appId:"1:388025068900:web:09ba8e12e9e9e2ec49de71"};
const app=initializeApp(FC);
const db=getFirestore(app,'javia-db');
const auth=getAuth(app);
const fns=getFunctions(app,'asia-northeast3');
setPersistence(auth,browserLocalPersistence).catch(()=>{});   // index.html과 세션 공유

/* ═══ 공통 ═══ */
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const WD=['일','월','화','수','목','금','토'];
const CL={pension:'연금·저축',protection:'보장성보험',corpConsult:'법인 유료컨설팅',corpInsurance:'법인 보험계약'};
const todayK=()=>new Date(Date.now()+9*3600000).toISOString().slice(0,10);
const addD=(d,n)=>{const x=new Date(d+'T00:00:00Z');x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10);};
const dow=d=>new Date(d+'T00:00:00Z').getUTCDay();
const monOf=d=>{const w=dow(d);return addD(d,w===0?-6:1-w);};
const md=d=>`${Number(d.slice(5,7))}/${Number(d.slice(8,10))}`;

/* 정화 — 서버에서 이미 정화했지만 한 번 더 (허용 태그만, 스크립트·이벤트 속성 제거) */
const PURIFY={ALLOWED_TAGS:['article','header','section','div','span','p','h2','h3','h4','ul','ol','li','dl','dt','dd','b','strong','em','i','u','small','br','hr','details','summary','button','a','table','thead','tbody','tr','th','td','caption'],
  ALLOWED_ATTR:['class','href','target','rel','open','type','colspan','rowspan','data-card-id','data-slot','data-desc','data-law','data-article','data-title','data-url','data-text','data-eff'],
  ALLOWED_URI_REGEXP:/^https:\/\//i};
const clean=html=>{
  if(!window.DOMPurify)return '<div class="empty">보안 모듈을 불러오지 못했습니다. 새로고침해 주세요.</div>';
  const out=DOMPurify.sanitize(String(html||''),PURIFY);
  const t=document.createElement('template');t.innerHTML=out;
  t.content.querySelectorAll('a').forEach(a=>{a.target='_blank';a.rel='noopener noreferrer';});
  return t.innerHTML;
};

/* ═══ 상태 ═══ */
let myName='',myLoginId='';
let loadedWeek=null;                    /* 실제로 카드를 불러온 주 (깊은 링크·즐겨찾기 열기 판단용) */
let favs=[],favsLoaded=false;          /* ★ 즐겨찾기 [{id,date,slot,segment,title,at}] — users/{uid}/private/salestalk */
let fcDoc=null,mcLink=null,mcBusy=null; /* ★ 고객 링크 재료 (consultants 문서 · 모닝 컨센서스 서명 링크) */
let msgNameVal='',mcErrDay='';           /* ★ 입력한 고객 이름(카드를 바꿔도 유지·저장 안 함) · 모닝 컨센서스 링크 실패일 */
let me=null,week=monOf(todayK()),sel=todayK(),slot='job',weekCards={},allList=null;
const today=todayK();

/* ═══ 인증 + 게이트 (memo.html 과 같은 정규회원 기준) ═══ */
const ROLES=['admin','branch_manager','inner_circle','con_homepage','jarvia_member','jarvia_inner'];
async function checkRole(user){
  if(/@javia-admin\.internal$/.test(user.email||''))return true;
  try{const d=await getDoc(doc(db,'users',user.uid));myName=d.exists()?(d.data().name||''):'';myLoginId=d.exists()?String(d.data().loginId||''):'';return ROLES.includes(d.exists()?d.data().role:'');}
  catch(e){console.warn('[salestalk] role',e);return false;}
}
function gate(html){$('app').style.display='none';$('gate').style.display='';$('gateMsg').innerHTML=html;$('gateBtn').style.display='';}
onAuthStateChanged(auth,async user=>{
  if(!user){me=null;gate('자비아 <b>로그인 후</b> 이용할 수 있습니다.<br>메인에서 로그인해 주세요.');return;}
  if(me&&me.uid===user.uid)return;
  me=user;myName='';myLoginId='';fcDoc=null;mcLink=null;favs=[];favsLoaded=false;msgNameVal='';mcErrDay='';   /* 기기 공용 시 이전 계정 값이 남지 않게 */
  if(!(await checkRole(user))){gate('오늘의 영업주제는 <b>정규회원</b> 전용입니다.<br>(지사장 · 이너서클 · 컨홈 · 자비아멤버십)');return;}
  $('gate').style.display='none';$('app').style.display='';
  logVisit(user);
  loadFavs();loadFcDoc();
  /* ★ 깊은 링크 ?d=YYYY-MM-DD&s=job|age (이지메모·공유에서 특정 카드로 바로) */
  let dl=null;try{const q=new URLSearchParams(location.search);let d=q.get('d')||'';const sl=q.get('s');
    const t=/^\d{4}-\d{2}-\d{2}$/.test(d)?new Date(d+'T00:00:00Z'):null;   /* 없는 날짜(13월·2/30)는 무시 */
    if(t&&!isNaN(t)&&t.toISOString().slice(0,10)===d&&d<=today){const w=dow(d);if(w===6)d=addD(d,-1);else if(w===0)d=addD(d,-2);dl={d,s:sl==='age'?'age':'job'};}}catch(e){}
  if(dl){await openCard(dl.d,dl.s);}else await loadWeek(week,true);
});
/* ★ [2026-10-10] 접속통계 — 관리자 「접속통계」의 영업주제 열 (service_logs.service='sales_talk', 페이지 진입 1회) */
function logVisit(user){try{const id='st_'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);setDoc(doc(db,'service_logs',id),{logId:id,userId:user.uid,userName:myName||'',service:'sales_talk',createdAt:serverTimestamp()}).catch(()=>{});}catch(e){}}

/* ═══ 주간 카드 ═══ */
async function loadWeek(mon,pickToday){
  week=mon;weekCards={};loadedWeek=null;
  $('wkNext').disabled=mon>=monOf(today);
  renderStrip();$('dayPane').innerHTML='<div class="empty">불러오는 중…</div>';
  try{
    const snap=await getDocs(query(collection(db,'st_cards'),where('status','==','published'),where('date','>=',mon),where('date','<=',addD(mon,4)),orderBy('date','desc')));
    snap.forEach(d=>{const c=d.data();(weekCards[c.date]=weekCards[c.date]||{})[c.slot]=c;});
    loadedWeek=mon;
  }catch(e){console.error('[salestalk] load',e);$('dayPane').innerHTML='<div class="empty">카드를 불러오지 못했습니다. 잠시 후 다시 열어 주세요.</div>';return;}
  if(pickToday){
    const days=Object.keys(weekCards).sort();
    sel=weekCards[today]?today:(days.filter(d=>d<=today).pop()||days.pop()||today);
  }else{const days=Object.keys(weekCards).sort();sel=days[days.length-1]||mon;}
  renderStrip();renderDay();
}
function renderStrip(){
  let h='';
  for(let i=0;i<5;i++){
    const d=addD(week,i),c=weekCards[d]||{};
    const lbl=c.job||c.age?`${c.job?c.job.segment:'-'} · ${c.age?c.age.segment:'-'}`:(d>today?'예정':'없음');
    h+=`<button type="button" class="day${d===sel?' on':''}${c.job||c.age?'':' none'}" data-d="${d}" aria-pressed="${d===sel}"><b>${WD[dow(d)]} ${md(d)}${d===today?' · 오늘':''}</b><span>${esc(lbl)}</span></button>`;
  }
  $('strip').innerHTML=h;
  const on=$('strip').querySelector('.on');if(on){const st=$('strip');st.scrollLeft=Math.max(0,on.offsetLeft-st.offsetLeft-(st.clientWidth-on.clientWidth)/2);}   /* 가로만 이동 — iOS에서 페이지 세로 튐 방지 */
}
function cardBlock(c){
  if(!c)return '';
  let h='';
  if(c.lawWatch&&c.lawWatch.changed)h+=`<div class="notice">⚠ 이 카드에 인용된 법령이 개정되었습니다 (${esc((c.lawWatch.laws||[]).join(', '))}). 최신 내용을 확인하고 사용하세요.</div>`;
  h+=clean(c.html);
  h+=`<div class="meta-line">작성 기준일 ${esc(c.date)}</div>`;
  return h;
}
function renderDay(){
  const c=weekCards[sel]||{};
  if(!c.job&&!c.age){
    $('dayPane').innerHTML=`<div class="empty">${sel>today?'아직 게시 전입니다. 평일 오전 8시에 게시됩니다.':sel===today?'오늘 카드를 준비 중입니다. 오전 8시 이후 다시 열어 주세요.':'이 날은 게시된 카드가 없습니다.'}</div>`;
    return;
  }
  if(!c[slot])slot=c.job?'job':'age';
  const pk=['job','age'].filter(k=>c[k]).map(k=>`<button type="button" class="pk${k===slot?' on':''}" data-s="${k}" aria-pressed="${k===slot}"><span class="k">${k==='job'?'직업':'연령'} · ${esc(c[k].segment||'')}</span><span class="t">${esc(c[k].title||'')}</span></button>`).join('');
  const cur=c[slot],fid=cardId(cur);
  $('dayPane').innerHTML=`<div class="pick${c.job&&c.age?'':' one'}" id="pick">${pk}</div>`
    +`<div class="cbar"><button type="button" class="fav${isFav(fid)?' on':''}" id="favBtn" aria-pressed="${isFav(fid)}">${isFav(fid)?'★ 즐겨찾기됨':'☆ 즐겨찾기'}</button><button type="button" id="ideaBtn">💡 아이디어 메모하기</button><span class="sp"></span><button type="button" class="all" id="allToggle">모두 펼치기</button></div>`
    +cardBlock(cur);
  enhance($('dayPane'),cur);
}
$('dayPane').addEventListener('click',e=>{
  const b=e.target.closest('.pk');
  if(b){if(b.dataset.s===slot)return;slot=b.dataset.s;renderDay();const p=$('pick');if(p&&p.getBoundingClientRect().top<0)p.scrollIntoView({block:'start'});return;}
  const cur=(weekCards[sel]||{})[slot];if(!cur)return;
  if(e.target.closest('#favBtn')){toggleFav(cur);return;}
  if(e.target.closest('#ideaBtn')){openIdea(cur);return;}
  if(e.target.closest('#allToggle')){toggleAll();return;}
  const cp=e.target.closest('.st-copy');if(cp){copyMsg(cur,Number(cp.dataset.i),cp);return;}
});
$('dayPane').addEventListener('change',e=>{
  const x=e.target.closest('.lk input[type=checkbox]');if(!x)return;
  const p=linkPrefs();p[x.dataset.k]=x.checked;saveLinkPrefs(p);
  if(x.dataset.k==='mc'&&x.checked)mcErrDay='';   /* 다시 체크하면 다시 시도 */
  refreshMsgs();   /* ★ 체크한 링크를 메시지 아래에 바로 보여 줌 */
});
$('dayPane').addEventListener('input',e=>{   /* ★ 고객 이름을 넣으면 메시지의 ○○ 이 바로 바뀜 */
  if(e.target.id!=='msgName')return;
  msgNameVal=e.target.value;refreshMsgs();
});
$('strip').addEventListener('click',e=>{const b=e.target.closest('.day');if(!b)return;sel=b.dataset.d;slot='job';renderStrip();renderDay();showTab('day');});
$('wkPrev').addEventListener('click',()=>loadWeek(addD(week,-7),false));
$('wkNext').addEventListener('click',()=>{if(week<monOf(today))loadWeek(addD(week,7),addD(week,7)===monOf(today));});

/* ═══ 지난 주제 찾기 ═══ */
function showTab(t){
  [['day','tabDay','dayPane'],['fav','tabFav','favPane'],['find','tabFind','findPane']].forEach(([k,tb,pn])=>{
    const on=k===t;$(tb).classList.toggle('on',on);$(tb).setAttribute('aria-selected',on);$(pn).hidden=!on;
  });
  if(t==='find')loadAll();
  if(t==='fav')renderFavs();
}
$('tabDay').addEventListener('click',()=>showTab('day'));
$('tabFav').addEventListener('click',()=>showTab('fav'));
$('tabFind').addEventListener('click',()=>showTab('find'));
async function loadAll(){
  if(allList){runFind();return;}
  $('fcnt').textContent='불러오는 중…';
  try{
    const snap=await getDocs(query(collection(db,'st_cards'),where('status','==','published'),orderBy('date','desc'),limit(600)));
    allList=snap.docs.map(d=>{const c=d.data();return{date:c.date,slot:c.slot,segment:c.segment||'',title:c.title||'',closings:c.closings||[],kw:(c.keywords||[]).join(' ')};});
    const segs=[...new Set(allList.map(x=>x.segment).filter(Boolean))].sort();
    $('fseg').innerHTML='<option value="">대상 전체</option>'+segs.map(s=>`<option>${esc(s)}</option>`).join('');
    runFind();
  }catch(e){console.error('[salestalk] list',e);$('fcnt').textContent='목록을 불러오지 못했습니다.';}
}
function runFind(){
  const q=$('fq').value.trim(),sg=$('fseg').value,cl=$('fcl').value;
  const words=q.split(/\s+/).filter(Boolean);
  const r=(allList||[]).filter(x=>(!sg||x.segment===sg)&&(!cl||x.closings.includes(cl))&&words.every(w=>(x.title+' '+x.kw+' '+x.segment).includes(w)));
  $('fcnt').textContent=`${r.length}장`;
  $('fres').innerHTML=r.slice(0,200).map(x=>`<button type="button" data-d="${esc(x.date)}" data-s="${x.slot==='age'?'age':'job'}"><span class="r1">${esc(x.date)} (${WD[dow(x.date)]}) · ${x.slot==='job'?'직업':'연령'} · ${esc(x.segment)} · ${x.closings.map(k=>esc(CL[k]||k)).join(', ')}</span><span class="r2">${esc(x.title)}</span></button>`).join('')||'<div class="empty">조건에 맞는 카드가 없습니다.</div>';
}
['fq','fseg','fcl'].forEach(id=>$(id).addEventListener('input',runFind));
$('fres').addEventListener('click',e=>{const b=e.target.closest('button[data-d]');if(b)openCard(b.dataset.d,b.dataset.s);});
/* 특정 날짜·카드 열기 (지난 주제 찾기 · 즐겨찾기 · 깊은 링크 공통) */
async function openCard(d,s){
  slot=s==='age'?'age':'job';showTab('day');sel=d;
  if(monOf(d)!==loadedWeek){await loadWeek(monOf(d),false);sel=d;}
  renderStrip();renderDay();
  window.scrollTo({top:0});
}

/* ═══ ★ [2026-10-10] 카드 순서·접힘 — 바로 쓰는 것 위로, 공부할 내용은 「더 알아보기」로
   펼침: 고객 메시지 · 숫자 · 주의사항 / 접힘: 대화 흐름 · 귀결 단계 · 더 알아보기(왜 지금·용어·근거 법령·미리 물어볼 것)
   카드 HTML 은 그대로 두고 화면에서만 재배치한다 (관리자 미리보기·내려받기는 전체 펼침 유지) ═══ */
const SEC_KEYS=['why','terms','laws','num','talk','closing','prep','caution'];
function enhance(root,c){
  const art=root.querySelector('article.st-card');if(!art)return;
  const body=art.querySelector('.st-body');if(!body)return;
  const list=[...body.querySelectorAll(':scope > details.st-sec')];
  const map={};
  list.forEach((d,i)=>{const k=SEC_KEYS.find(x=>d.classList.contains('st-s-'+x));if(k)map[k]=d;});
  const SEC_WORD={why:/왜/,terms:/용어/,laws:/법령/,num:/숫자/,talk:/대화/,closing:/귀결/,prep:/준비|물어/,caution:/주의/};
  if(!Object.keys(map).length&&list.length===8&&list.every((d,i)=>SEC_WORD[SEC_KEYS[i]].test((d.querySelector(':scope>summary')||{}).textContent||'')))list.forEach((d,i)=>{map[SEC_KEYS[i]]=d;});   /* 표식 없는 이전 카드 — 기본 8칸 순서(제목 확인) */
  if(!map.talk&&!map.num&&!map.caution)return;   /* 담당자가 구조를 크게 바꾼 카드는 그대로 표시 */
  list.forEach(d=>{const sm=d.querySelector(':scope>summary');const tn=sm&&[...sm.childNodes].find(n=>n.nodeType===3&&n.data.trim());if(tn)tn.data=tn.data.replace(/^\s*\d+\.\s*/,'');});
  const msg=buildMsgSec(c);
  const more=document.createElement('details');more.className='st-sec st-more';
  const moreKeys=['why','terms','laws','prep'].filter(k=>map[k]);
  more.innerHTML='<summary></summary><div class="st-sec-body"></div>';
  more.firstChild.textContent='더 알아보기 · '+moreKeys.map(k=>({why:'왜 지금',terms:'용어',laws:'근거 법령',prep:map.prep&&map.prep.classList.contains('st-s-prep')?'미리 물어볼 것':'준비물'})[k]).join(' · ');
  moreKeys.forEach(k=>{map[k].open=false;more.lastChild.appendChild(map[k]);});
  if(map.talk)map.talk.open=false;
  if(map.closing)map.closing.open=false;
  if(map.num)map.num.open=true;
  if(map.caution)map.caution.open=true;
  const order=[msg,map.talk,map.num,map.caution,map.closing,moreKeys.length?more:null].filter(Boolean);
  const rest=[...body.children].filter(x=>!order.includes(x)&&!moreKeys.some(k=>map[k]===x));   /* 담당자가 추가한 기타 구간은 뒤에 그대로 */
  order.concat(rest).forEach(x=>body.appendChild(x));
  syncAll();
}
function allDetails(){const a=document.querySelector('#dayPane article.st-card');return a?[...a.querySelectorAll('details')]:[];}
function syncAll(){const b=$('allToggle');if(!b)return;const ds=allDetails();b.textContent=ds.length&&ds.every(d=>d.open)?'모두 접기':'모두 펼치기';}
function toggleAll(){const ds=allDetails();const open=!ds.every(d=>d.open);ds.forEach(d=>{d.open=open;});syncAll();}
document.addEventListener('toggle',e=>{if(e.target&&e.target.closest&&e.target.closest('#dayPane'))syncAll();},true);

/* ═══ ★ [2026-10-10] 고객에게 바로 보내는 메시지 — 이름 넣기 · 링크 함께 복사 ═══ */
const MSG_LINKS=[
  {k:'cd',label:'고객 리포트',name:'매일 아침 생활·경제 리포트'},
  {k:'mc',label:'모닝 컨센서스',name:'오늘의 모닝 컨센서스'},
  {k:'bz',label:'아침독서',name:'이번 주 아침독서'},
];
function linkPrefs(){try{return JSON.parse(localStorage.getItem('st_links')||'{}')||{};}catch(e){return {};}}
function saveLinkPrefs(p){try{localStorage.setItem('st_links',JSON.stringify(p));}catch(e){}}
function linkAvail(k){return k==='bz'?!!bookzipUrl():!!myLoginId;}
function buildMsgSec(c){
  const msgs=((c&&c.sections&&c.sections.messages)||[]).filter(m=>m&&m.text);
  if(!msgs.length)return null;
  const p=linkPrefs();
  const d=document.createElement('details');d.className='st-sec st-s-msg';d.open=true;
  d.innerHTML='<summary>고객에게 바로 보내는 메시지</summary><div class="st-sec-body">'
    +'<p class="st-hint">떠오르는 고객이 있으면 이름을 넣고 복사해 카톡으로 보내 보세요</p>'
    +`<div class="msg-opts"><label class="nm">고객 이름 <input type="text" id="msgName" maxlength="20" placeholder="예: 홍길동" autocomplete="off" value="${esc(msgNameVal)}"></label>`
    +'<div class="lk"><span>함께 보낼 링크 · 체크하면 메시지 아래에 붙어 복사돼요</span>'
    +MSG_LINKS.map(l=>{const ok=linkAvail(l.k);return `<label class="${ok?'':'off'}" title="${ok?'':(l.k==='bz'?'아침독서 링크가 등록되지 않았습니다':'회원 아이디를 확인할 수 없습니다')}"><input type="checkbox" data-k="${l.k}"${ok&&p[l.k]?' checked':''}${ok?'':' disabled'}> ${esc(l.label)}</label>`;}).join('')
    +'</div></div><div class="st-msgs">'
    +msgs.map((m,i)=>`<div class="st-msg"><div class="st-msg-h"><b>${esc(m.type||'메시지')}</b><button type="button" class="st-copy" data-i="${i}">복사</button></div><div class="st-msg-t" data-i="${i}"></div><div class="st-msg-lk" hidden></div></div>`).join('')
    +'</div></div>';
  d._msgs=msgs;
  refreshMsgs(d);   /* 모닝 컨센서스가 체크돼 있으면 여기서 링크를 받아 옴 */
  return d;
}
/* ★ [2026-10-10] 화면 미리보기 — 복사될 내용과 같게: ○○ → 입력한 이름, 체크한 링크는 메시지 아래에 */
function msgNm(){return String(msgNameVal||'').trim().replace(/님$/,'');}
function linkNow(k){   /* 지금 바로 알 수 있는 주소 (모닝 컨센서스는 받아 둔 것만) */
  if(k==='cd')return myLoginId?'https://jarvia.co.kr/client-daily?fc='+encodeURIComponent(myLoginId):'';
  if(k==='bz')return bookzipUrl();
  if(k==='mc')return (mcLink&&mcLink.day===today)?mcLink.url:'';
  return '';
}
function refreshMsgs(root){
  const sec=root||document.querySelector('#dayPane .st-s-msg');if(!sec||!sec._msgs)return;
  const nm=msgNm();
  sec.querySelectorAll('.st-msg-t[data-i]').forEach(el=>{
    const m=sec._msgs[Number(el.dataset.i)];if(!m)return;
    el.innerHTML=nm?String(m.text).split('○○').map(esc).join(`<mark class="nm">${esc(nm)}</mark>`):esc(m.text);
  });
  const picks=[...sec.querySelectorAll('.lk input[type=checkbox]:checked')].map(x=>x.dataset.k);
  let h='';
  for(const l of MSG_LINKS){
    if(!picks.includes(l.k))continue;
    const u=linkNow(l.k);
    if(u)h+=`<span>· ${esc(l.name)}</span><a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(u)}</a>`;
    else if(l.k==='mc')h+=`<span>· ${esc(l.name)}</span><span class="wait">${mcErrDay===today?'링크를 만들지 못했습니다 — 복사할 때 다시 시도합니다':'링크 준비 중…'}</span>`;
  }
  sec.querySelectorAll('.st-msg-lk').forEach(el=>{el.innerHTML=h?'<b>📌 함께 보시면 좋은 자료</b>'+h:'';el.hidden=!h;});
  if(picks.includes('mc')&&!linkNow('mc')&&mcErrDay!==today)ensureMcLink().then(()=>refreshMsgs(),()=>{mcErrDay=today;refreshMsgs();});
}
async function loadFcDoc(){
  if(!myLoginId)return;
  try{const s=await getDoc(doc(db,'consultants',myLoginId));fcDoc=s.exists()?s.data():null;}catch(e){fcDoc=null;}
  /* 첫 카드가 먼저 그려졌으면 아침독서 체크 가능 여부만 다시 반영 */
  const bz=document.querySelector('#dayPane .lk input[data-k="bz"]');
  if(bz){const ok=linkAvail('bz');bz.disabled=!ok;bz.parentElement.classList.toggle('off',!ok);if(ok&&linkPrefs().bz)bz.checked=true;refreshMsgs();}
}
function bookzipUrl(){   /* index.html _mrWeekUrl 과 같은 계산 — 기준 월요일(bookzipBaseDate)부터 매주 b+1 */
  const fc=fcDoc;if(!fc||!fc.morningBookzipUrl||!/^https?:\/\//i.test(fc.morningBookzipUrl))return '';
  let u0=fc.morningBookzipUrl;
  try{const u=new URL(u0);const b=parseInt(u.searchParams.get('b')||'0');
    if(b>0&&typeof fc.bookzipBaseDate==='string'&&fc.bookzipBaseDate){const base=new Date(fc.bookzipBaseDate+'T00:00:00+09:00');const w=Math.floor((Date.now()-base)/(7*86400000));if(Number.isFinite(w)){u.searchParams.set('b',b+Math.max(0,w));u0=u.toString();}}
  }catch(e){}
  return u0;
}
function ensureMcLink(){   /* consensus.html 과 같은 방식 — 최신 발행분 서명 키(mcShareKey make) */
  if(mcLink&&mcLink.day===today)return Promise.resolve(mcLink.url);
  if(mcBusy)return mcBusy;
  mcBusy=(async()=>{
    const snap=await getDocs(query(collection(db,'morning_consensus'),orderBy('fileDate','desc'),limit(5)));
    let fd='';for(const d of snap.docs){const x=d.data();if(x.status==='done'){fd=String(x.fileDate||d.id).replace(/\D/g,'');break;}}
    if(!/^\d{8}$/.test(fd))throw new Error('발행분 없음');
    const r=await httpsCallable(fns,'mcShareKey')({mode:'make',fileDate:fd});
    const x=r&&r.data;if(!x||!x.success||!x.key||!x.loginId)throw new Error('서명 실패');
    const url='https://briefingog-cvmdsjgzxa-du.a.run.app?fc='+encodeURIComponent(x.loginId)+'&t=mc&k='+encodeURIComponent(x.key);
    mcLink={url,day:today};
    return url;
  })().finally(()=>{mcBusy=null;});
  return mcBusy;
}
async function composeMsg(m,picks){
  const nm=(($('msgName')&&$('msgName').value)||'').trim().replace(/님$/,'');
  let text=nm?m.text.split('○○').join(nm):m.text;
  const lines=[];let miss='';
  for(const l of MSG_LINKS){
    if(!picks.includes(l.k))continue;
    let url='';
    if(l.k==='cd')url=myLoginId?'https://jarvia.co.kr/client-daily?fc='+encodeURIComponent(myLoginId):'';
    else if(l.k==='bz')url=bookzipUrl();
    else if(l.k==='mc'){url=(mcLink&&mcLink.day===today)?mcLink.url:'';if(!url){try{url=await ensureMcLink();}catch(e){miss='모닝 컨센서스';}}}
    if(url)lines.push(`· ${l.name}\n${url}`);
  }
  if(lines.length)text+='\n\n📌 함께 보시면 좋은 자료\n'+lines.join('\n');
  return {text,miss};
}
async function copyMsg(c,i,btn){
  const m=((c.sections&&c.sections.messages)||[]).filter(x=>x&&x.text)[i];if(!m)return;
  const picks=[...document.querySelectorAll('#dayPane .lk input[type=checkbox]:checked')].map(x=>x.dataset.k);
  const needWait=picks.includes('mc')&&!(mcLink&&mcLink.day===today);
  const textP=composeMsg(m,picks);
  let res=null,ok=false;
  /* 링크를 받아오는 동안에도 탭 동작이 유지되도록(iOS Safari) Promise 를 그대로 클립보드에 넘긴다 */
  if(needWait&&window.ClipboardItem&&navigator.clipboard&&navigator.clipboard.write){
    try{await navigator.clipboard.write([new ClipboardItem({'text/plain':textP.then(r=>{res=r;return new Blob([r.text],{type:'text/plain'});})})]);ok=true;}catch(e){ok=false;}
  }
  if(!res)res=await textP;
  if(!ok)ok=await writeClip(res.text);
  if(!ok){$('cpText').value=res.text;$('cpModal').hidden=false;try{$('cpText').focus();$('cpText').select();}catch(e){}return;}
  btn.textContent='복사됨 ✓';btn.classList.add('done');setTimeout(()=>{btn.textContent='복사';btn.classList.remove('done');},1800);
  toast(res.miss?`${res.miss} 링크를 만들지 못해 빼고 복사했습니다`:'복사했습니다 — 카톡에 붙여 넣어 보내세요');
  refreshMsgs();   /* 복사하며 받아 온 링크를 화면에도 반영 */
}
async function writeClip(t){
  try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(t);return true;}}catch(e){}
  try{const a=document.createElement('textarea');a.value=t;a.setAttribute('readonly','');a.style.cssText='position:fixed;top:0;left:0;opacity:0';document.body.appendChild(a);a.select();a.setSelectionRange(0,t.length);const r=document.execCommand('copy');a.remove();return !!r;}catch(e){return false;}
}
$('cpClose').addEventListener('click',()=>{$('cpModal').hidden=true;});
let _tt=null;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(_tt);_tt=setTimeout(()=>t.classList.remove('on'),2400);}

/* ═══ ★ [2026-10-10] 즐겨찾기 — users/{uid}/private/salestalk (본인 전용, 폰·PC 공통) ═══ */
const cardId=c=>c?String(c.id||`${c.date}_${c.slot}`):'';
const isFav=id=>favs.some(f=>f.id===id);
async function loadFavs(){
  try{const s=await getDoc(doc(db,'users',me.uid,'private','salestalk'));favs=s.exists()&&Array.isArray(s.data().favs)?s.data().favs:[];favsLoaded=true;}
  catch(e){console.warn('[salestalk] favs',e);favs=[];favsLoaded=false;setTimeout(()=>{if(me&&!favsLoaded)loadFavs();},5000);return;}   /* 못 읽은 채 저장하면 기존 목록이 지워지므로 저장을 막고 다시 시도 */
  const b=$('favBtn');if(b){const c=(weekCards[sel]||{})[slot];const on=isFav(cardId(c));b.classList.toggle('on',on);b.textContent=on?'★ 즐겨찾기됨':'☆ 즐겨찾기';b.setAttribute('aria-pressed',on);}
  if(!$('favPane').hidden)renderFavs();
}
async function saveFavs(prev){
  try{await setDoc(doc(db,'users',me.uid,'private','salestalk'),{favs,updatedAt:serverTimestamp()},{merge:true});return true;}
  catch(e){console.warn('[salestalk] favs save',e);favs=prev;toast('즐겨찾기를 저장하지 못했습니다. 잠시 후 다시 시도해 주세요');return false;}
}
async function toggleFav(c){
  if(!favsLoaded){toast('즐겨찾기를 불러오는 중입니다. 잠시 후 다시 눌러 주세요');loadFavs();return;}
  const id=cardId(c),prev=favs.slice();
  if(isFav(id))favs=favs.filter(f=>f.id!==id);
  else{if(favs.length>=300){toast('즐겨찾기는 300개까지 저장됩니다');return;}favs=[{id,date:c.date,slot:c.slot==='age'?'age':'job',segment:c.segment||'',title:c.title||'',at:Date.now()},...favs];}
  const on=isFav(id),b=$('favBtn');
  if(b){b.classList.toggle('on',on);b.textContent=on?'★ 즐겨찾기됨':'☆ 즐겨찾기';b.setAttribute('aria-pressed',on);}
  if(await saveFavs(prev))toast(on?'즐겨찾기에 담았습니다 — 위쪽 「⭐ 즐겨찾기」에서 다시 볼 수 있어요':'즐겨찾기에서 뺐습니다');
  else if(b){const on2=isFav(id);b.classList.toggle('on',on2);b.textContent=on2?'★ 즐겨찾기됨':'☆ 즐겨찾기';}
}
function renderFavs(){
  const box=$('favList');
  if(!favsLoaded){box.innerHTML='<div class="empty">불러오는 중…</div>';return;}
  const list=favs.slice().sort((a,b)=>String(b.date).localeCompare(String(a.date))||(a.slot==='job'?-1:1));
  box.innerHTML=list.length?list.map(f=>`<div class="fi"><button type="button" data-d="${esc(f.date)}" data-s="${f.slot==='age'?'age':'job'}"><span class="r1">${esc(f.date)} (${WD[dow(f.date)]||''}) · ${f.slot==='age'?'연령':'직업'} · ${esc(f.segment)}</span><span class="r2">${esc(f.title)}</span></button><button type="button" class="rm" data-rm="${esc(f.id)}" aria-label="즐겨찾기에서 빼기">✕</button></div>`).join('')
    :'<div class="empty">아직 담은 카드가 없습니다.<br>카드 위쪽 「☆ 즐겨찾기」를 누르면 여기에 모입니다.</div>';
}
$('favList').addEventListener('click',async e=>{
  const rm=e.target.closest('[data-rm]');
  if(rm){const prev=favs.slice();favs=favs.filter(f=>f.id!==rm.dataset.rm);renderFavs();if(!(await saveFavs(prev)))renderFavs();return;}
  const b=e.target.closest('button[data-d]');if(b)openCard(b.dataset.d,b.dataset.s);
});

/* ═══ ★ [2026-10-10] 아이디어 메모하기 → 이지메모 (memo.html 이 ?st= 를 받아 「💡 영업주제 아이디어」에 추가) ═══ */
function openIdea(c){
  const s=c.slot==='age'?'age':'job';
  const t=`[${md(c.date)} ${s==='age'?'연령':'직업'}·${c.segment||''}] ${c.title||''}`;
  const u=`https://jarvia.co.kr/salestalk.html?d=${c.date}&s=${s}`;
  const url='./memo.html?st='+encodeURIComponent(JSON.stringify({t,u}));
  if(window.matchMedia('(max-width:767px)').matches)location.href=url;
  else{const w=window.open(url,'_blank');if(w){try{w.opener=null;}catch(e){}}else location.href=url;}
}

/* ═══ 용어 · 법령 (카드 HTML 의 data- 속성 기반 — 업로드 HTML 에서도 동작) ═══ */
document.addEventListener('click',e=>{
  const t=e.target.closest('.st-term');
  if(t){
    const wrap=t.parentElement;let pop=wrap.nextElementSibling;
    const same=t.getAttribute('aria-expanded')==='true';
    wrap.querySelectorAll('.st-term').forEach(x=>x.setAttribute('aria-expanded','false'));
    if(pop&&pop.classList.contains('term-pop'))pop.remove();
    if(same)return;
    t.setAttribute('aria-expanded','true');
    pop=document.createElement('div');pop.className='term-pop';
    const b=document.createElement('b');b.textContent=t.textContent;
    pop.append(b,document.createTextNode(' — '+(t.dataset.desc||'')));
    wrap.after(pop);return;
  }
  const l=e.target.closest('.st-law');
  if(l){
    $('lawTitle').textContent=`${l.dataset.law||''} ${l.dataset.article||''}${l.dataset.title?' ('+l.dataset.title+')':''}`;
    const p=l.parentElement&&l.parentElement.querySelector('p');
    $('lawText').textContent=l.dataset.text||('조문 요지 · '+(p?p.textContent:''));
    $('lawEff').textContent=l.dataset.text?(l.dataset.eff?`시행일 ${l.dataset.eff} · 법제처 원문`:'법제처 원문'):'원문을 불러오지 못해 요지를 표시합니다. 아래 버튼으로 원문을 확인하세요.';
    const u=l.dataset.url||'';
    $('lawLink').href=/^https:\/\//i.test(u)?u:'https://www.law.go.kr';
    $('lawModal').hidden=false;$('lawClose').focus();return;
  }
  if(e.target.id==='lawClose'||e.target.id==='lawModal')$('lawModal').hidden=true;
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('lawModal').hidden=true;$('cpModal').hidden=true;}});
