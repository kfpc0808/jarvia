<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=5.0" />
<meta name="theme-color" content="#FFFFFF" />
<title>자비아 이용가이드 — 재무컨설턴트를 위한 자료실</title>

<meta name="description" content="자비아(JARVIA) 상세 이용가이드. 매일 아침 시장 브리핑, 고객용 자료, 16가지 재무계산기, TaxNavi 예규/판례 통합검색까지. 법인영업·절세·법인컨설팅에 필요한 모든 도구를 한곳에서 익히세요." />
<meta name="keywords" content="자비아, JARVIA, 재무컨설턴트, 법인영업, 법인컨설팅, 절세, 상속세, 증여세, 가지급금, CEO퇴직금, TaxNavi, Daily Report, 이용가이드" />
<meta name="author" content="한국에프피센터" />

<meta property="og:type" content="website" />
<meta property="og:title" content="자비아 이용가이드" />
<meta property="og:description" content="재무컨설턴트가 매일 쓰는 자료실. 시장 브리핑, 세무 상담 사례, 재무계산기, 예규·판례 통합검색까지 한곳에." />
<meta property="og:url" content="https://jarvia.co.kr/guide.html" />
<meta property="og:site_name" content="JARVIA" />

<link rel="canonical" href="https://jarvia.co.kr/guide.html" />

<style>
:root{
  /* === 화이트 톤 베이스 === */
  --bg-base:#FFFFFF;
  --bg-soft:#FAFBFC;
  --bg-mute:#F8F9FA;
  --bg-hover:#F3F4F6;

  /* === 네이비 액센트 (브랜드) === */
  --navy-900:#0A1830;
  --navy-800:#0F2040;
  --navy-700:#1B3A5C;
  --navy-600:#264A72;
  --navy-500:#365E8C;

  /* === 골드 액센트 (브랜드) === */
  --gold:#C9A96E;
  --gold-dark:#A88B53;
  --gold-light:#E0C896;
  --gold-soft:rgba(201,169,110,.08);
  --gold-mid:rgba(201,169,110,.15);
  --gold-border:rgba(201,169,110,.35);
  --gold-glow:rgba(201,169,110,.4);

  /* === 텍스트 === */
  --text-primary:#1A2540;
  --text-body:#374151;
  --text-secondary:#6B7280;
  --text-tertiary:#9CA3AF;

  /* === 보더 === */
  --border-soft:#E5E7EB;
  --border-mid:#D1D5DB;
  --border-strong:#9CA3AF;

  /* === 그림자 (절제된 사용) === */
  --shadow-sm:0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 2px 8px rgba(0,0,0,.06);
  --shadow-lg:0 8px 24px rgba(0,0,0,.08);
  --shadow-gold:0 4px 16px rgba(201,169,110,.4);

  /* === 라디우스 === */
  --radius-sm:6px;
  --radius-md:10px;
  --radius-lg:14px;
  --radius-xl:20px;

  /* === 레이아웃 === */
  --header-h:64px;
  --hero-h-d:200px;
  --hero-h-m:160px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:160px}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif;
  background:var(--bg-base);
  color:var(--text-body);
  line-height:1.7;
  -webkit-font-smoothing:antialiased;
  font-size:15.5px;
  letter-spacing:-.01em;
  overflow-x:hidden;
}
img{max-width:100%;height:auto}
a{color:var(--gold-dark);text-decoration:none}
a:hover{text-decoration:underline}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

/* ====== HEADER ====== */
.gh{
  position:sticky;top:0;z-index:90;
  background:rgba(255,255,255,.92);
  backdrop-filter:saturate(140%) blur(12px);
  -webkit-backdrop-filter:saturate(140%) blur(12px);
  border-bottom:1px solid var(--border-soft);
  height:var(--header-h);
}
.gh-inner{
  max-width:1280px;margin:0 auto;height:100%;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 18px;
}
.gh-logo{
  display:flex;align-items:center;gap:10px;
  font-weight:700;font-size:18px;letter-spacing:.5px;color:var(--navy-800);
}
.gh-logo .dot{
  width:10px;height:10px;border-radius:50%;
  background:linear-gradient(135deg,var(--gold-light),var(--gold));
  box-shadow:0 0 12px rgba(201,169,110,.35);
}
.gh-back{
  display:inline-flex;align-items:center;gap:6px;
  padding:8px 16px;border-radius:999px;
  background:var(--gold-soft);
  color:var(--gold-dark);
  font-size:13px;font-weight:600;
  border:1px solid var(--gold-border);
  transition:all .2s ease;
}
.gh-back:hover{background:var(--gold-mid);text-decoration:none;transform:translateY(-1px)}
.gh-back:active{transform:translateY(0)}

/* ====== HERO ====== */
.hero{
  position:relative;
  min-height:var(--hero-h-d);
  display:flex;flex-direction:column;justify-content:center;
  padding:36px 18px 28px;
  text-align:center;
  background:linear-gradient(180deg,var(--bg-soft) 0%,var(--bg-base) 100%);
  border-bottom:1px solid var(--border-soft);
  overflow:hidden;
}
.hero::before{
  content:"";position:absolute;inset:-2px;
  background:radial-gradient(ellipse 60% 50% at 50% 0%,rgba(201,169,110,.12) 0%,transparent 70%);
  pointer-events:none;
}
.hero-eyebrow{
  position:relative;
  display:inline-block;margin:0 auto 12px;
  font-size:11px;font-weight:600;letter-spacing:2px;
  color:var(--gold-dark);
  padding:4px 14px;border-radius:999px;
  background:var(--gold-soft);
  border:1px solid var(--gold-border);
  text-transform:uppercase;
}
.hero h1{
  position:relative;
  margin:0 0 8px;font-size:30px;font-weight:600;
  color:var(--navy-800);
  letter-spacing:-.5px;line-height:1.25;
}
.hero h1 .accent{color:var(--gold-dark)}
.hero p{
  position:relative;
  margin:0 auto;max-width:600px;
  color:var(--text-secondary);font-size:14.5px;
}

/* ====== CHIP NAVIGATION (sticky) ====== */
.chip-nav{
  position:sticky;
  top:var(--header-h);
  z-index:80;
  background:rgba(255,255,255,.95);
  backdrop-filter:saturate(140%) blur(12px);
  -webkit-backdrop-filter:saturate(140%) blur(12px);
  border-bottom:1px solid var(--border-soft);
  padding:14px 18px 12px;
}
.chip-nav-inner{
  max-width:1280px;margin:0 auto;
}
.chip-nav-head{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:10px;
}
.chip-nav-title{
  font-size:11px;font-weight:600;letter-spacing:1.5px;
  color:var(--gold-dark);
}
.chip-nav-progress{
  font-size:12px;color:var(--text-secondary);
}
.chip-nav-progress strong{
  color:var(--navy-800);font-weight:600;
}
.chip-list{
  display:flex;flex-wrap:wrap;gap:6px;
  list-style:none;margin:0;padding:0;
}
.chip{
  display:inline-flex;align-items:center;gap:6px;
  padding:6px 12px;
  background:var(--bg-base);
  border:1px solid var(--border-soft);
  border-radius:8px;
  font-size:12.5px;
  color:var(--text-secondary);
  cursor:pointer;
  transition:all .15s ease;
  user-select:none;
  white-space:nowrap;
}
.chip:hover{
  background:var(--bg-mute);
  border-color:var(--border-mid);
  color:var(--navy-800);
}
.chip.active{
  background:var(--gold-mid);
  border-color:var(--gold);
  color:var(--navy-800);
  font-weight:600;
}
.chip-num{
  display:inline-flex;align-items:center;justify-content:center;
  width:18px;height:18px;flex-shrink:0;
  background:var(--bg-hover);
  color:var(--text-tertiary);
  border-radius:50%;
  font-size:10px;font-weight:600;
}
.chip.active .chip-num{
  background:var(--gold);
  color:#FFFFFF;
}
.chip-text{
  flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}

/* ====== MAIN ====== */
.main{
  max-width:920px;margin:0 auto;
  padding:24px 18px 60px;
}

/* ====== SECTIONS ====== */
.sec{
  margin:0 0 28px;
  background:var(--bg-base);
  border:1px solid var(--border-soft);
  border-radius:var(--radius-lg);
  overflow:hidden;
  box-shadow:var(--shadow-sm);
  scroll-margin-top:160px;
}
.sec-head{
  display:flex;align-items:center;justify-content:space-between;
  gap:14px;
  padding:18px 26px 14px;
  background:var(--bg-soft);
  border-bottom:1px solid var(--border-soft);
}
.sec-head-text{flex:1;min-width:0}
.sec-num{
  font-size:11px;font-weight:600;letter-spacing:1.5px;
  color:var(--gold-dark);
  margin-bottom:4px;
}
.sec-title{
  margin:0;font-size:20px;font-weight:600;
  color:var(--navy-800);
  letter-spacing:-.3px;line-height:1.3;
}

/* ====== TTS PLAYER (음성 플레이어 — 화이트 톤에서 잘 보이게) ====== */
.player{
  display:inline-flex;align-items:center;gap:10px;
  padding:6px 16px 6px 6px;
  background:linear-gradient(135deg,#FCF6E8 0%,#F7EBC9 100%);
  border:1px solid var(--gold);
  border-radius:999px;
  flex-shrink:0;
  transition:all .2s ease;
  box-shadow:var(--shadow-sm);
}
.player:hover{
  background:linear-gradient(135deg,#F7EBC9 0%,#F0DDA8 100%);
  box-shadow:var(--shadow-md);
}
.player-btn{
  width:36px;height:36px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  background:var(--gold);
  color:#FFFFFF;
  border-radius:50%;
  font-size:14px;
  transition:all .15s ease;
  box-shadow:0 2px 6px rgba(201,169,110,.3);
}
.player-btn:hover{
  background:var(--gold-dark);
  transform:scale(1.05);
}
.player-btn:active{transform:scale(.95)}
.player-btn .icon-play,.player-btn .icon-pause{display:block;line-height:1}
.player-btn .icon-pause{display:none}
.player.playing .icon-play{display:none}
.player.playing .icon-pause{display:block}
.player-info{
  display:flex;flex-direction:column;align-items:flex-start;
  font-size:11.5px;line-height:1.3;color:var(--navy-800);
  user-select:none;
}
.player-info .lbl{font-weight:700;letter-spacing:.5px;color:var(--navy-800)}
.player-info .time{font-variant-numeric:tabular-nums;color:var(--gold-dark);font-weight:600}

/* ====== SECTION BODY ====== */
.sec-body{padding:18px 26px 28px;color:var(--text-body)}
.sec-body :first-child{margin-top:14px}
.sec-body .lead{
  font-size:17px;line-height:1.7;
  color:var(--navy-800);font-weight:500;
  margin:0 0 18px;letter-spacing:-.2px;
}
.sec-body p{margin:0 0 14px;color:var(--text-body)}
.sec-body h3{
  margin:28px 0 12px;font-size:17px;font-weight:600;
  color:var(--gold-dark);letter-spacing:-.2px;
}
.sec-body strong{color:var(--navy-800);font-weight:700}
.sec-body em{color:var(--gold-dark);font-style:normal;font-weight:600}

/* === bodyHtml 내부 클래스 스타일 === */
.sec-body .callout{
  margin:18px 0;padding:14px 18px;
  background:var(--bg-mute);
  border:1px solid var(--border-soft);
  border-left:3px solid var(--gold);
  border-radius:var(--radius-md);
  border-top-left-radius:0;
  border-bottom-left-radius:0;
}
.sec-body .callout-gold{
  background:var(--gold-soft);
  border-color:var(--gold-border);
  border-left:3px solid var(--gold);
}
.sec-body .callout-summary{
  background:linear-gradient(135deg,rgba(201,169,110,.08),rgba(201,169,110,.03));
  border:1px solid var(--gold-border);
  border-left:3px solid var(--gold);
  margin-top:24px;
}
.sec-body .callout-label{
  font-size:11px;font-weight:700;letter-spacing:1.5px;
  color:var(--gold-dark);text-transform:uppercase;
  margin-bottom:6px;
}
.sec-body .callout p{margin:0;color:var(--text-body)}
.sec-body .callout p+p{margin-top:8px}
.sec-body .callout ul{margin:0;padding:0;list-style:none}

.sec-body .check-list{
  list-style:none;padding:0;margin:0 0 14px;
}
.sec-body .check-list li{
  position:relative;
  padding:6px 0 6px 26px;
  border-bottom:1px dashed var(--border-soft);
  color:var(--text-body);
}
.sec-body .check-list li:last-child{border-bottom:none}
.sec-body .check-list li::before{
  content:"";position:absolute;left:4px;top:13px;
  width:7px;height:11px;
  border:solid var(--gold);border-width:0 2px 2px 0;
  transform:rotate(45deg);
}
.sec-body .callout .check-list li{padding-left:22px}
.sec-body .callout .check-list li::before{left:2px}

.sec-body .step-list{margin:14px 0}
.sec-body .step{
  display:flex;align-items:flex-start;gap:14px;
  padding:12px 0;
  border-bottom:1px solid var(--border-soft);
}
.sec-body .step:last-child{border-bottom:none}
.sec-body .step-num{
  flex-shrink:0;width:32px;height:32px;
  display:flex;align-items:center;justify-content:center;
  background:var(--gold-soft);
  color:var(--gold-dark);
  border-radius:50%;
  font-size:14px;font-weight:700;
  border:1px solid var(--gold-border);
}
.sec-body .step-body{flex:1;min-width:0}
.sec-body .step-body strong{display:block;color:var(--navy-800);margin-bottom:3px;font-size:15px}
.sec-body .step-body p{margin:0;color:var(--text-secondary);font-size:14.5px}

.sec-body .two-col{
  display:grid;grid-template-columns:1fr 1fr;gap:12px;
  margin:14px 0;
}
.sec-body .col-card{
  padding:14px 16px;
  background:var(--bg-mute);
  border:1px solid var(--border-soft);
  border-radius:var(--radius-md);
}
.sec-body .col-card h4{
  margin:0 0 8px;font-size:14px;font-weight:700;
  color:var(--gold-dark);
}
.sec-body .col-card p{
  margin:0;font-size:13.5px;color:var(--text-body);
}

.sec-body ul:not(.check-list):not(.callout ul){
  padding-left:20px;margin:0 0 14px;
}
.sec-body ul:not(.check-list):not(.callout ul) li{
  margin-bottom:6px;color:var(--text-body);
}
.sec-body ol{padding-left:20px;margin:0 0 14px}
.sec-body ol li{margin-bottom:6px;color:var(--text-body)}

.sec-body table{
  width:100%;border-collapse:collapse;margin:14px 0;
  font-size:13.5px;
}
.sec-body table th,.sec-body table td{
  padding:8px 12px;
  border:1px solid var(--border-soft);
  text-align:left;
}
.sec-body table th{
  background:var(--bg-mute);
  color:var(--navy-800);
  font-weight:600;
}

/* ====== ERROR BOX ====== */
.error-box{
  margin:30px auto;padding:24px;max-width:600px;
  background:#FFF5F5;
  border:1px solid #FCA5A5;
  border-radius:var(--radius-md);
  color:#991B1B;
  text-align:center;
}

/* ====== SCROLL TO TOP BUTTON ====== */
.to-top{
  position:fixed;
  right:24px;bottom:24px;
  z-index:100;
  width:52px;height:52px;
  display:flex;align-items:center;justify-content:center;
  background:var(--gold);
  color:#FFFFFF;
  border-radius:50%;
  font-size:22px;font-weight:700;
  box-shadow:var(--shadow-gold);
  opacity:0;
  visibility:hidden;
  transform:translateY(20px) scale(.85);
  transition:all .25s cubic-bezier(.4,0,.2,1);
  pointer-events:none;
}
.to-top.visible{
  opacity:1;
  visibility:visible;
  transform:translateY(0) scale(1);
  pointer-events:auto;
}
.to-top:hover{
  background:var(--gold-dark);
  transform:translateY(-3px) scale(1.05);
  box-shadow:0 6px 20px rgba(201,169,110,.55);
}
.to-top:active{
  transform:translateY(0) scale(.95);
}
.to-top .arrow{
  display:block;line-height:1;
  margin-top:-2px;
}

/* ====== LOADING SKELETON ====== */
.skeleton{
  margin:30px auto;max-width:600px;
  padding:20px;
  background:var(--bg-mute);
  border-radius:var(--radius-md);
  text-align:center;
  color:var(--text-secondary);
  font-size:14px;
}

/* ====== RESPONSIVE ====== */
@media (max-width:768px){
  body{font-size:14.5px}
  .gh-inner{padding:0 14px}
  .gh-logo{font-size:16px}
  .gh-back{padding:6px 12px;font-size:12px}

  .hero{padding:28px 14px 22px;min-height:var(--hero-h-m)}
  .hero h1{font-size:22px}
  .hero p{font-size:13.5px}
  .hero-eyebrow{font-size:10px;letter-spacing:1.5px;padding:3px 10px}

  /* 칩 네비 — 모바일에서 한 행에 2개씩 */
  .chip-nav{padding:12px 14px 10px}
  .chip-nav-head{margin-bottom:8px}
  .chip-nav-title{font-size:10px}
  .chip-nav-progress{font-size:11px}
  .chip-list{
    display:grid;grid-template-columns:1fr 1fr;gap:6px;
  }
  .chip{
    padding:8px 10px;
    font-size:11.5px;
    width:100%;
  }
  .chip-text{
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .chip-num{width:16px;height:16px;font-size:9px}

  .main{padding:18px 14px 60px}
  .sec{margin:0 0 22px}
  .sec-head{
    flex-direction:column;
    align-items:flex-start;
    gap:12px;
    padding:16px 18px 14px;
  }
  .sec-title{font-size:18px}
  .sec-body{padding:14px 18px 22px}
  .sec-body .lead{font-size:15.5px}
  .sec-body h3{font-size:15.5px;margin:22px 0 10px}

  .sec-body .two-col{grid-template-columns:1fr;gap:8px}

  .player{padding:5px 14px 5px 5px}
  .player-btn{width:32px;height:32px;font-size:13px}
  .player-info{font-size:11px}

  /* 스크롤 투 탑 — 모바일 */
  .to-top{
    right:18px;bottom:18px;
    width:48px;height:48px;
    font-size:20px;
  }

  html{scroll-padding-top:200px}
  .sec{scroll-margin-top:200px}
}

@media (max-width:480px){
  .hero h1{font-size:20px}
  .sec-title{font-size:17px}
  .chip{font-size:11px;padding:7px 8px}
}
</style>
</head>
<body>

<!-- ============ HEADER ============ -->
<header class="gh">
  <div class="gh-inner">
    <a class="gh-logo" href="/" aria-label="자비아 메인으로">
      <span class="dot" aria-hidden="true"></span>
      <span>JARVIA</span>
    </a>
    <a class="gh-back" href="/">
      <span aria-hidden="true">←</span>
      <span>메인으로</span>
    </a>
  </div>
</header>

<!-- ============ HERO ============ -->
<section class="hero" aria-labelledby="hero-title">
  <span class="hero-eyebrow">JARVIA USER GUIDE</span>
  <h1 id="hero-title">자비아 <span class="accent">상세 이용가이드</span></h1>
  <p>매일 아침 시장 브리핑부터 16가지 재무계산기, 예규·판례 통합검색까지<br>법인영업·절세·법인컨설팅에 필요한 모든 도구를 한곳에서</p>
</section>

<!-- ============ CHIP NAVIGATION ============ -->
<nav class="chip-nav" aria-label="목차">
  <div class="chip-nav-inner">
    <div class="chip-nav-head">
      <span class="chip-nav-title">목차 · CONTENTS</span>
      <span class="chip-nav-progress">진행률 <strong id="chipProgNum">0</strong> / <span id="chipProgTotal">0</span></span>
    </div>
    <ul class="chip-list" id="chipList"></ul>
  </div>
</nav>

<!-- ============ MAIN ============ -->
<main class="main">
  <div id="sections">
    <div class="skeleton">가이드를 불러오는 중...</div>
  </div>
</main>

<!-- ============ SCROLL TO TOP ============ -->
<button type="button" class="to-top" id="toTopBtn" aria-label="페이지 맨 위로">
  <span class="arrow" aria-hidden="true">↑</span>
</button>

<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import {getFirestore,collection,query,orderBy,getDocs} from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const firebaseConfig={
  apiKey:"AIzaSyBD9p-bf162RiiD1Y3BsY-NvbYjpOSrzmg",
  authDomain:"jarvia-platform.firebaseapp.com",
  projectId:"jarvia-platform",
  storageBucket:"jarvia-platform.firebasestorage.app",
  messagingSenderId:"388025068900",
  appId:"1:388025068900:web:09ba8e12e9e9e2ec49de71"
};
const app=initializeApp(firebaseConfig);
const db=getFirestore(app,'javia-db');

const $=sel=>document.querySelector(sel);
const $$=sel=>Array.from(document.querySelectorAll(sel));
const fmtTime=sec=>{
  if(!sec||isNaN(sec))return '--:--';
  const m=Math.floor(sec/60), s=Math.floor(sec%60);
  return `${m}:${String(s).padStart(2,'0')}`;
};
const escapeHtml=str=>String(str||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ===== 섹션 데이터 로드 =====
async function loadSections(){
  try{
    const q=query(collection(db,'guide_sections'),orderBy('order','asc'));
    const snap=await getDocs(q);
    const sections=[];
    snap.forEach(doc=>sections.push({id:doc.id,...doc.data()}));
    if(sections.length===0)throw new Error('가이드 섹션이 없습니다.');
    renderAll(sections);
  }catch(err){
    console.error('[Guide] 로드 실패:',err);
    $('#sections').innerHTML=`
      <div class="error-box">
        <strong>가이드를 불러올 수 없습니다.</strong>
        <p style="margin:8px 0 0;font-size:13px">잠시 후 다시 시도해주세요.<br>문제가 계속되면 메인 사이트의 제휴 제안 메뉴로 알려주세요.</p>
      </div>`;
  }
}

// ===== 렌더링 =====
function renderAll(sections){
  renderChipNav(sections);
  renderSections(sections);
  $('#chipProgTotal').textContent=sections.length;
  setupScrollSpy();
  setupPlayers();
  setupScrollToTop();
}

function renderChipNav(sections){
  const html=sections.map((s,i)=>`
    <li>
      <button type="button" class="chip" data-target="${escapeHtml(s.id)}">
        <span class="chip-num">${i+1}</span>
        <span class="chip-text">${escapeHtml(stripPrefix(s.title))}</span>
      </button>
    </li>
  `).join('');
  $('#chipList').innerHTML=html;
}

function renderSections(sections){
  const html=sections.map((s,i)=>`
    <article class="sec" id="${escapeHtml(s.id)}" data-idx="${i}">
      <header class="sec-head">
        <div class="sec-head-text">
          <div class="sec-num">SECTION ${String(i+1).padStart(2,'0')}</div>
          <h2 class="sec-title">${escapeHtml(stripPrefix(s.title))}</h2>
        </div>
        ${renderPlayer(s)}
      </header>
      <div class="sec-body">${s.bodyHtml||''}</div>
    </article>
  `).join('');
  $('#sections').innerHTML=html;
}

function renderPlayer(s){
  if(!s.audioUrl)return '';
  return `
    <div class="player" data-audio="${escapeHtml(s.audioUrl)}" data-duration="${s.duration||0}">
      <button type="button" class="player-btn" aria-label="음성 재생">
        <span class="icon-play" aria-hidden="true">▶</span>
        <span class="icon-pause" aria-hidden="true">❚❚</span>
      </button>
      <div class="player-info">
        <span class="lbl">음성 듣기</span>
        <span class="time">${fmtTime(s.duration)}</span>
      </div>
    </div>
  `;
}

function stripPrefix(title){
  return String(title||'').replace(/^\d{1,2}\.\s*/,'');
}

// ===== TTS 플레이어 (한 번에 하나만 재생) =====
let currentAudio=null, currentBtn=null;

function setupPlayers(){
  $$('.player').forEach(p=>{
    const btn=p.querySelector('.player-btn');
    const url=p.dataset.audio;
    const dur=parseInt(p.dataset.duration,10)||0;
    const timeEl=p.querySelector('.time');

    btn.addEventListener('click',()=>{
      // 현재 재생 중이면 정지
      if(currentBtn===btn && currentAudio && !currentAudio.paused){
        currentAudio.pause();
        return;
      }
      // 다른 플레이어에서 재생 중이었으면 정지
      if(currentAudio){
        currentAudio.pause();
        if(currentBtn){
          currentBtn.closest('.player').classList.remove('playing');
          const oldTime=currentBtn.closest('.player').querySelector('.time');
          const oldDur=parseInt(currentBtn.closest('.player').dataset.duration,10)||0;
          if(oldTime)oldTime.textContent=fmtTime(oldDur);
        }
      }
      // 새 오디오 시작
      const a=new Audio(url);
      a.preload='auto';
      currentAudio=a;currentBtn=btn;
      p.classList.add('playing');

      a.addEventListener('loadedmetadata',()=>{
        if(timeEl && a.duration && !isNaN(a.duration)){
          p.dataset.duration=Math.round(a.duration);
        }
      });
      a.addEventListener('timeupdate',()=>{
        if(timeEl){
          const remaining=Math.max(0,(a.duration||dur)-a.currentTime);
          timeEl.textContent=fmtTime(remaining);
        }
      });
      a.addEventListener('ended',()=>{
        p.classList.remove('playing');
        if(timeEl)timeEl.textContent=fmtTime(a.duration||dur);
        if(currentAudio===a){currentAudio=null;currentBtn=null}
      });
      a.addEventListener('pause',()=>{
        p.classList.remove('playing');
      });
      a.addEventListener('play',()=>{
        p.classList.add('playing');
      });
      a.addEventListener('error',()=>{
        p.classList.remove('playing');
        if(timeEl)timeEl.textContent='오류';
        console.error('[Audio] 재생 실패:',url);
      });
      a.play().catch(err=>{
        console.error('[Audio] play() 실패:',err);
        p.classList.remove('playing');
      });
    });
  });
}

// ===== 스크롤 스파이 (활성 섹션 추적 + 칩 자동 강조) =====
function setupScrollSpy(){
  const sections=$$('.sec');
  const chips=$$('#chipList .chip');
  const total=sections.length;
  let activeIdx=-1;

  const setActive=(idx)=>{
    if(idx===activeIdx)return;
    activeIdx=idx;
    chips.forEach((c,i)=>c.classList.toggle('active',i===idx));

    // 진행률 업데이트
    const num=idx+1;
    $('#chipProgNum').textContent=num;
  };

  // IntersectionObserver로 현재 보이는 섹션 추적
  const obs=new IntersectionObserver(entries=>{
    let best=null,bestRatio=0;
    entries.forEach(e=>{
      if(e.isIntersecting && e.intersectionRatio>bestRatio){
        best=e.target;bestRatio=e.intersectionRatio;
      }
    });
    if(best){
      const idx=parseInt(best.dataset.idx,10);
      if(!isNaN(idx))setActive(idx);
    }
  },{rootMargin:'-25% 0px -55% 0px',threshold:[0,.25,.5,.75,1]});

  sections.forEach(s=>obs.observe(s));

  // 칩 클릭 시 부드러운 스크롤
  chips.forEach(chip=>{
    chip.addEventListener('click',e=>{
      e.preventDefault();
      const target=chip.dataset.target;
      const el=document.getElementById(target);
      if(el){
        el.scrollIntoView({behavior:'smooth',block:'start'});
      }
    });
  });

  // 첫 섹션 활성화
  setActive(0);
}

// ===== 스크롤 투 탑 버튼 =====
function setupScrollToTop(){
  const btn=$('#toTopBtn');
  if(!btn)return;

  const onScroll=()=>{
    if(window.scrollY>300){
      btn.classList.add('visible');
    }else{
      btn.classList.remove('visible');
    }
  };

  // 패시브 스크롤 리스너 (성능)
  window.addEventListener('scroll',onScroll,{passive:true});
  onScroll();

  // 클릭 시 페이지 맨 위로
  btn.addEventListener('click',()=>{
    window.scrollTo({top:0,behavior:'smooth'});
  });
}

// ===== 시작 =====
loadSections();
</script>

</body>
</html>
