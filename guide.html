<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=5.0" />
<meta name="theme-color" content="#FFFFFF" />
<title>자비아 이용가이드 — 재무컨설턴트를 위한 자료실</title>

<meta name="description" content="자비아(JARVIA) 상세 이용가이드. 매일 아침 시장 브리핑, 고객용 자료, 16가지 재무계산기, TaxNavi 예규/판례 통합검색까지. 법인영업·절세·법인컨설팅에 필요한 모든 도구를 한곳에서 익히세요." />
<meta name="keywords" content="자비아, JARVIA, 재무컨설턴트, 법인영업, 법인컨설팅, 절세, 상속세, 증여세, 가지급금, CEO퇴직금, TaxNavi, Daily Report, 이용가이드" />
<meta name="author" content="한국에프피센터" />

<meta property="og:type" content="website" />
<meta property="og:title" content="자비아 이용가이드" />
<meta property="og:description" content="재무컨설턴트가 매일 쓰는 자료실. 시장 브리핑, 세무 상담 사례, 재무계산기, 예규·판례 통합검색까지 한곳에." />
<meta property="og:url" content="https://jarvia.co.kr/guide.html" />
<meta property="og:site_name" content="JARVIA" />

<link rel="canonical" href="https://jarvia.co.kr/guide.html" />

<style>
:root{
  /* === 화이트 톤 (변수명은 보존, 값만 화이트 시스템) === */
  --navy-900:#FFFFFF;
  --navy-800:#F8F9FA;
  --navy-700:#E5E7EB;
  --navy-600:#D1D5DB;
  --navy-500:#9CA3AF;
  --gold:#C9A96E;
  --gold-light:#A88B53;
  --gold-soft:rgba(201,169,110,.18);
  --gold-border:rgba(201,169,110,.4);
  --text-primary:#1A2540;
  --text-secondary:#4B5563;
  --text-tertiary:#6B7280;
  --bg-card:#FAFBFC;
  --bg-card-hover:#F3F4F6;
  --border-soft:rgba(0,0,0,.08);
  --border-mid:rgba(0,0,0,.14);
  --shadow-card:0 1px 3px rgba(0,0,0,.06);
  --text-on-gold:#0F2040;
  --radius-sm:6px;
  --radius-md:10px;
  --radius-lg:14px;
  --radius-xl:20px;
  --side-w:260px;
  --header-h:64px;
  --hero-h-d:240px;
  --hero-h-m:180px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:160px}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif;
  background:var(--navy-900);
  color:var(--text-primary);
  line-height:1.7;
  -webkit-font-smoothing:antialiased;
  font-size:15.5px;
  letter-spacing:-.01em;
  overflow-x:hidden;
}
img{max-width:100%;height:auto}
a{color:var(--gold-light);text-decoration:none}
a:hover{text-decoration:underline}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

/* ====== HEADER (단순 헤더) ====== */
.gh{
  position:sticky;top:0;z-index:90;
  background:rgba(255,255,255,.92);
  backdrop-filter:saturate(140%) blur(12px);
  -webkit-backdrop-filter:saturate(140%) blur(12px);
  border-bottom:1px solid var(--border-soft);
  height:var(--header-h);
}
.gh-inner{
  max-width:1280px;margin:0 auto;height:100%;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 18px;
}
.gh-logo{
  display:flex;align-items:center;gap:10px;
  font-weight:700;font-size:18px;letter-spacing:.5px;color:var(--gold-light);
}
.gh-logo .dot{
  width:10px;height:10px;border-radius:50%;
  background:linear-gradient(135deg,var(--gold-light),var(--gold));
  box-shadow:0 0 12px rgba(240,215,140,.4);
}
.gh-back{
  display:inline-flex;align-items:center;gap:6px;
  padding:8px 16px;border-radius:999px;
  background:var(--gold-soft);
  color:var(--gold-light);
  font-size:13px;font-weight:600;
  border:1px solid var(--gold-border);
  transition:all .2s ease;
}
.gh-back:hover{background:rgba(201,169,110,.2);text-decoration:none;transform:translateY(-1px)}
.gh-back:active{transform:translateY(0)}

/* ====== HERO ====== */
.hero{
  position:relative;
  min-height:var(--hero-h-d);
  display:flex;flex-direction:column;justify-content:center;
  padding:48px 18px 36px;
  text-align:center;
  background:linear-gradient(180deg,var(--navy-800) 0%,var(--navy-900) 100%);
  border-bottom:1px solid var(--border-soft);
  overflow:hidden;
}
.hero::before{
  content:"";position:absolute;inset:-2px;
  background:radial-gradient(ellipse 60% 50% at 50% 0%,rgba(201,169,110,.18) 0%,transparent 70%);
  pointer-events:none;
}
.hero-eyebrow{
  position:relative;
  display:inline-block;margin:0 auto 14px;
  font-size:11px;font-weight:700;letter-spacing:2px;
  color:var(--gold-light);
  padding:5px 14px;border-radius:999px;
  background:var(--gold-soft);
  border:1px solid var(--gold-border);
  text-transform:uppercase;
}
.hero h1{
  position:relative;
  margin:0 0 10px;font-size:32px;font-weight:700;
  color:var(--text-primary);
  letter-spacing:-.5px;line-height:1.25;
}
.hero h1 .accent{color:var(--gold-light)}
.hero p{
  position:relative;
  margin:0 auto;max-width:600px;
  color:var(--text-secondary);font-size:15px;
}

/* ====== LAYOUT ====== */
.shell{
  max-width:1024px;margin:0 auto;
  display:block;
  position:relative;
}

/* ====== CHIP NAVIGATION (sticky) ====== */
.chip-nav{
  position:sticky;top:var(--header-h);z-index:80;
  background:rgba(255,255,255,.95);
  backdrop-filter:saturate(140%) blur(12px);
  -webkit-backdrop-filter:saturate(140%) blur(12px);
  border-bottom:1px solid var(--border-soft);
  padding:14px 18px 12px;
}
.chip-nav-inner{max-width:1280px;margin:0 auto}
.chip-nav-head{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:10px;
}
.chip-nav-title{
  font-size:11px;font-weight:600;letter-spacing:1.5px;color:var(--gold-light);
}
.chip-nav-progress{font-size:12px;color:var(--text-secondary)}
.chip-nav-progress strong{color:var(--text-primary);font-weight:600}
.chip-list{
  display:flex;flex-wrap:wrap;gap:6px;
  list-style:none;margin:0;padding:0;
}
.chip{
  display:inline-flex;align-items:center;gap:6px;
  padding:6px 12px;
  background:var(--bg-card);
  border:1px solid var(--border-soft);
  border-radius:8px;
  font-size:12.5px;color:var(--text-secondary);
  cursor:pointer;
  transition:all .15s ease;
  user-select:none;white-space:nowrap;
}
.chip:hover{
  background:var(--bg-card-hover);
  border-color:var(--border-mid);
  color:var(--text-primary);
}
.chip.active{
  background:var(--gold-soft);
  border-color:var(--gold);
  color:var(--text-primary);
  font-weight:600;
}
.chip-num{
  display:inline-flex;align-items:center;justify-content:center;
  width:18px;height:18px;flex-shrink:0;
  background:var(--bg-card-hover);
  color:var(--text-tertiary);
  border-radius:50%;
  font-size:10px;font-weight:600;
}
.chip.active .chip-num{background:var(--gold);color:var(--text-on-gold)}
.chip-text{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ====== SCROLL TO TOP BUTTON ====== */
.to-top{
  position:fixed;
  right:24px;bottom:24px;
  z-index:100;
  width:52px;height:52px;
  display:flex;align-items:center;justify-content:center;
  background:var(--gold);
  color:#FFFFFF;
  border-radius:50%;
  font-size:22px;font-weight:700;
  box-shadow:0 4px 16px rgba(201,169,110,.45);
  opacity:0;visibility:hidden;
  transform:translateY(20px) scale(.85);
  transition:all .25s cubic-bezier(.4,0,.2,1);
  pointer-events:none;
  border:none;cursor:pointer;
}
.to-top.visible{
  opacity:1;visibility:visible;
  transform:translateY(0) scale(1);
  pointer-events:auto;
}
.to-top:hover{
  background:var(--gold-light);
  transform:translateY(-3px) scale(1.05);
  box-shadow:0 6px 20px rgba(201,169,110,.55);
}
.to-top:active{transform:translateY(0) scale(.95)}
.to-top .arrow{display:block;line-height:1;margin-top:-2px}

/* ====== MOBILE DROPDOWN TOC (모바일 전용) ====== */
.m-toc{
  display:none;
  position:sticky;top:var(--header-h);z-index:80;
  background:rgba(255,255,255,.96);
  backdrop-filter:saturate(140%) blur(12px);
  -webkit-backdrop-filter:saturate(140%) blur(12px);
  border-bottom:1px solid var(--border-soft);
}
.m-toc-btn{
  width:100%;
  display:flex;justify-content:space-between;align-items:center;
  padding:14px 18px;
  background:none;border:none;
  font-size:14px;color:var(--text-primary);
  cursor:pointer;
  font-family:inherit;
}
.m-toc-btn .label{display:flex;align-items:center;gap:10px}
.m-toc-btn .badge{
  display:inline-flex;align-items:center;justify-content:center;
  width:24px;height:24px;background:var(--gold);color:var(--text-on-gold);
  border-radius:50%;font-size:11px;font-weight:700;
}
.m-toc-btn .m-label{flex:1;text-align:left;font-weight:600}
.m-toc-btn .arrow{
  width:10px;height:10px;
  border:1.5px solid var(--text-secondary);border-top:0;border-left:0;
  transform:rotate(45deg);transition:transform .2s ease;
  margin-bottom:4px;flex-shrink:0;
}
.m-toc-btn[aria-expanded="true"] .arrow{
  transform:rotate(-135deg);
  margin-bottom:0;margin-top:4px;
}
.m-toc-list{
  display:none;
  list-style:none;margin:0;padding:4px 0 8px;
  max-height:60vh;overflow-y:auto;
  background:#FFFFFF;
  border-top:1px solid var(--border-soft);
}
.m-toc[data-open="true"] .m-toc-list{display:block}
.m-toc-list li{margin:0}
.m-toc-link{
  display:flex;align-items:center;gap:12px;
  padding:12px 18px;
  background:none;border:none;
  width:100%;text-align:left;
  font-size:13.5px;color:var(--text-secondary);
  cursor:pointer;
  font-family:inherit;
  transition:background .15s ease;
}
.m-toc-link:hover{background:var(--bg-card)}
.m-toc-link.active{
  background:var(--gold-soft);
  color:var(--text-primary);
  font-weight:600;
}
.m-toc-num{
  display:inline-flex;align-items:center;justify-content:center;
  width:24px;height:24px;flex-shrink:0;
  background:var(--bg-card-hover);
  color:var(--text-tertiary);
  border-radius:50%;
  font-size:11px;font-weight:600;
}
.m-toc-link.active .m-toc-num{background:var(--gold);color:var(--text-on-gold)}
.m-toc-text{flex:1;min-width:0;white-space:normal;line-height:1.4}

.sec{
  margin:0 0 28px;
  background:var(--bg-card);
  border:1px solid var(--border-soft);
  border-radius:var(--radius-lg);
  scroll-margin-top:160px;
  overflow:hidden;
  transition:border-color .2s ease;
}
.sec.in-view{border-color:var(--gold-border)}

.sec-head{
  display:flex;align-items:flex-start;gap:14px;
  padding:22px 26px 0;
  flex-wrap:wrap;
}
.sec-head-text{flex:1;min-width:0}
.sec-num{
  font-size:11px;font-weight:700;letter-spacing:2px;
  color:var(--gold);text-transform:uppercase;
  margin-bottom:4px;
}
.sec-title{
  margin:0;font-size:22px;font-weight:700;
  color:var(--text-primary);line-height:1.3;
  letter-spacing:-.3px;
}

/* ====== TTS PLAYER ====== */
.player{
  display:inline-flex;align-items:center;gap:10px;
  padding:6px 16px 6px 6px;
  background:linear-gradient(135deg,#FCF6E8 0%,#F7EBC9 100%);
  border:1px solid var(--gold);
  border-radius:999px;
  flex-shrink:0;
  transition:all .2s ease;
  box-shadow:0 1px 2px rgba(0,0,0,.04);
}
.player:hover{
  background:linear-gradient(135deg,#F7EBC9 0%,#F0DDA8 100%);
  box-shadow:0 2px 8px rgba(0,0,0,.06);
}
.player-btn{
  width:34px;height:34px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  background:var(--gold);
  color:var(--text-on-gold);
  border-radius:50%;
  font-size:14px;
  transition:all .15s ease;
}
.player-btn:hover{background:var(--gold-light);transform:scale(1.05)}
.player-btn:active{transform:scale(.95)}
.player-btn .icon-play,.player-btn .icon-pause{display:block}
.player-btn .icon-pause{display:none}
.player.playing .icon-play{display:none}
.player.playing .icon-pause{display:block}
.player-info{
  display:flex;flex-direction:column;align-items:flex-start;
  font-size:11px;line-height:1.3;color:var(--gold-light);
  user-select:none;
}
.player-info .lbl{font-weight:700;letter-spacing:.5px}
.player-info .time{font-variant-numeric:tabular-nums;opacity:.85}

.sec-body{padding:18px 26px 28px;color:var(--text-primary)}
.sec-body :first-child{margin-top:14px}
.sec-body .lead{
  font-size:17px;line-height:1.7;
  color:var(--text-primary);font-weight:500;
  margin:0 0 18px;letter-spacing:-.2px;
}
.sec-body p{margin:0 0 14px;color:var(--text-primary)}
.sec-body h3{
  margin:28px 0 12px;font-size:17px;font-weight:700;
  color:var(--gold-light);letter-spacing:-.2px;
}
.sec-body strong{color:var(--text-primary);font-weight:700}
.sec-body em{color:var(--gold-light);font-style:normal}

/* === bodyHtml 내부 클래스 스타일 === */
.sec-body .callout{
  margin:18px 0;padding:14px 18px;
  background:var(--bg-card-hover);
  border:1px solid var(--border-soft);
  border-left:3px solid var(--gold);
  border-radius:var(--radius-md);
}
.sec-body .callout-gold{
  background:rgba(201,169,110,.07);
  border-color:var(--gold-border);
  border-left:3px solid var(--gold);
}
.sec-body .callout-summary{
  background:linear-gradient(135deg,rgba(201,169,110,.1),rgba(201,169,110,.04));
  border:1px solid var(--gold-border);
  border-left:3px solid var(--gold-light);
  margin-top:24px;
}
.sec-body .callout-label{
  font-size:11px;font-weight:700;letter-spacing:1.5px;
  color:var(--gold);text-transform:uppercase;
  margin-bottom:6px;
}
.sec-body .callout p{margin:0;color:var(--text-primary)}
.sec-body .callout p+p{margin-top:8px}
.sec-body .callout ul{margin:0;padding:0;list-style:none}

.sec-body .check-list{
  list-style:none;padding:0;margin:0 0 14px;
}
.sec-body .check-list li{
  position:relative;
  padding:6px 0 6px 26px;
  border-bottom:1px dashed var(--border-soft);
  color:var(--text-primary);
}
.sec-body .check-list li:last-child{border-bottom:none}
.sec-body .check-list li::before{
  content:"";position:absolute;left:4px;top:13px;
  width:7px;height:11px;
  border:solid var(--gold);border-width:0 2px 2px 0;
  transform:rotate(45deg);
}
.sec-body .callout .check-list li{padding-left:22px}
.sec-body .callout .check-list li::before{left:2px}

.sec-body .step-list{margin:14px 0}
.sec-body .step{
  display:flex;align-items:flex-start;gap:14px;
  padding:12px 0;
  border-bottom:1px solid var(--border-soft);
}
.sec-body .step:last-child{border-bottom:none}
.sec-body .step-num{
  flex-shrink:0;width:32px;height:32px;
  display:flex;align-items:center;justify-content:center;
  background:var(--gold-soft);
  color:var(--gold-light);
  border-radius:50%;
  font-size:14px;font-weight:700;
  border:1px solid var(--gold-border);
}
.sec-body .step-body{flex:1;min-width:0}
.sec-body .step-body strong{display:block;color:var(--gold-light);margin-bottom:3px;font-size:15px}
.sec-body .step-body p{margin:0;color:var(--text-secondary);font-size:14.5px}

.sec-body .two-col{
  display:grid;grid-template-columns:1fr 1fr;gap:12px;
  margin:14px 0;
}
.sec-body .col-card{
  padding:14px 16px;
  background:var(--bg-card-hover);
  border:1px solid var(--border-soft);
  border-radius:var(--radius-md);
}
.sec-body .col-tag{
  display:inline-block;
  padding:3px 10px;border-radius:999px;
  font-size:11px;font-weight:700;letter-spacing:.5px;
  margin-bottom:6px;text-transform:uppercase;
}
.sec-body .tag-personal{background:rgba(59,130,246,.1);color:#1E40AF;border:1px solid rgba(59,130,246,.3)}
.sec-body .tag-corp{background:rgba(245,158,11,.1);color:#92400E;border:1px solid rgba(245,158,11,.3)}
.sec-body .col-card p{margin:0;font-size:13.5px;color:var(--text-secondary)}

.sec-body .quote-box{
  margin:14px 0;padding:14px 18px;
  background:var(--bg-card-hover);
  border-left:3px solid var(--gold);
  border-radius:var(--radius-sm);
}
.sec-body .quote-box p{margin:0;color:var(--text-primary);font-size:14.5px}
.sec-body .quote-box p+p{margin-top:4px}

/* ====== LOADING / EMPTY ====== */
.loading{
  text-align:center;padding:80px 20px;
  color:var(--text-secondary);
}
.loading-spinner{
  display:inline-block;width:40px;height:40px;
  border:3px solid var(--border-soft);
  border-top-color:var(--gold);
  border-radius:50%;
  animation:spin .8s linear infinite;
  margin-bottom:14px;
}
@keyframes spin{to{transform:rotate(360deg)}}
.error-box{
  margin:20px 0;padding:20px;text-align:center;
  background:rgba(220,38,38,.06);
  border:1px solid rgba(220,38,38,.3);
  border-radius:var(--radius-md);color:#991B1B;
}

/* ====== FOOTER ====== */
.gf{
  margin-top:60px;padding:32px 18px;
  text-align:center;
  border-top:1px solid var(--border-soft);
  color:var(--text-tertiary);font-size:12.5px;
}
.gf a{color:var(--gold-light)}
.gf-row{margin-top:8px;font-size:11.5px}

/* ====== RESPONSIVE ====== */
@media (max-width:960px){
  :root{--side-w:0px;--hero-h-d:var(--hero-h-m)}
  .chip-nav{display:none}
  .m-toc{display:block}
  .to-top{right:18px;bottom:18px;width:48px;height:48px;font-size:20px}
  .main{padding:0 18px 60px}
  .hero{padding:32px 18px 28px;min-height:auto}
  .hero h1{font-size:24px}
  .hero p{font-size:14px}
  .hero-eyebrow{font-size:10px;padding:4px 12px;margin-bottom:10px}
  .gh-inner{padding:0 14px}
  .gh-logo{font-size:16px}
  .gh-back{padding:6px 12px;font-size:12px}
  .sec{margin-bottom:18px;border-radius:var(--radius-md)}
  .sec-head{padding:18px 18px 0;gap:10px}
  .sec-title{font-size:18px}
  .sec-num{font-size:10px}
  .sec-body{padding:14px 18px 22px;font-size:15px}
  .sec-body .lead{font-size:15.5px}
  .sec-body h3{font-size:16px;margin-top:22px}
  .sec-body .two-col{grid-template-columns:1fr}
  .sec-body .step-num{width:28px;height:28px;font-size:13px}
  .sec-body .callout{padding:12px 14px;margin:14px 0}
  .player{padding:5px 12px 5px 5px;gap:8px}
  .player-btn{width:30px;height:30px;font-size:12px}
  .player-info{font-size:10px}
  .player-info .time{display:block}
}
@media (max-width:480px){
  body{font-size:15px}
  .hero h1{font-size:21px;letter-spacing:-.3px}
  .hero p{font-size:13.5px}
  .sec-head{flex-direction:column;align-items:stretch}
  .sec-head .player{align-self:flex-start;margin-top:6px}
  .sec-title{font-size:17px;line-height:1.35}
  .sec-body{padding:12px 16px 20px}
  .sec-body .step{gap:10px;padding:10px 0}
  .sec-body .check-list li{font-size:14px;padding:5px 0 5px 22px}
  .sec-body .check-list li::before{top:10px}
  .gh-back .lbl{display:none}
}

/* ====== A11Y ====== */

        "title": "04. 택스컨설팅 위클리 (TCW)",
        "order": 4,
        "bodyHtml": "<p class=\"lead\">매주 수요일과 목요일에 올라오는 세무상담 자료예요.</p><p>세법이 복잡해서 &quot;이런 경우엔 어떻게 해야 하지?&quot; 궁금하신 적 있으실 거예요. 국세청이 실제로 판단한 예규와 법원판례를 바탕으로, 현장에서 바로 쓸 수 있는 상담 시나리오 형태로 풀어드립니다.</p><h3>어떤 내용인가요?</h3><p>개인용 (TCW-개인) — 상속세, 증여세, 양도세, 소득세 등 개인 세금 상담 사례</p><p>법인용 (TCW-법인) — 법인세, 퇴직금, 가지급금, 재무제표 등 법인 세무 상담 사례</p><p>예를 들면 이런 주제들이에요.</p><p>&quot;상속세 공제 5억, 모르고 다 냈다는 사람 수두룩합니다&quot;</p><p>&quot;CEO 퇴직금 한도 계산, 정관 없이 지급하면 전액 부인&quot;</p><p>&quot;가지급금 6.5억, 정리전략 이렇게 세우세요&quot;</p><h3>어떻게 활용하나요?</h3><p>상담 시나리오 형태로 되어 있어서, 고객과의 대화에 바로 활용하실 수 있어요. &quot;아, 이런 경우에는 이렇게 설명드리면 되겠구나&quot; 하고 감이 잡힙니다.</p><p>세법은 자주 바뀌고, 각 상황마다 국세청 판단이 달라요. 이 위클리는 실제 예규 및 법원판례에 기반하기 때문에 근거가 분명합니다. 고객에게 설명하실 때 &quot;국세청 해석에 따르면...&quot; 하고 자신있게 말씀하실 수 있어요.</p><h3>구성 형식</h3><p>각 주제는 이렇게 제공돼요.</p><p>HTML 문서 — 웹으로 바로 읽기</p><p>오디오 — 출퇴근길에 듣기</p><p>카드 이미지 — 인스타그램·카톡 공유용 이미지</p><p>필요한 형식으로 골라 쓰시면 됩니다.</p><h3>어디서 보나요?</h3><p>메인 화면 맨 위쪽에 **&quot;매주 수·목 · 국세청 예규·판례 기반 택스컨설팅 위클리&quot;**라는 배너가 있어요. 이걸 누르시면 지금까지 올라온 모든 위클리를 모아 볼 수 있는 아카이브로 이동합니다. 아카이브에서는 제목으로 검색도 가능해요.</p><div class=\"callout callout-summary\"><p>💡 한 줄 요약 매주 수·목에 올라오는 세무 상담 시나리오. 국세청 예규·판례 기반이라 근거가 확실해요. 개인/법인으로 나뉘어 있습니다.</p></div>",
        "audioUrl": "",
        "duration": 0
      },
      {
        "id": "sec-05",
        "title": "05. 특급보고서",
        "order": 5,
        "bodyHtml": "<p class=\"lead\">법인 CEO를 대상으로 한 깊이 있는 컨설팅 리포트예요.</p><p>일반적인 자료가 A4 한두 페이지라면, 특급보고서는 한 주제를 수십 페이지에 걸쳐 깊게 파고드는 보고서예요. CEO 대상 컨설팅을 준비하시거나, 법인 솔루션 제안을 앞두고 계실 때 쓰시는 자료입니다.</p><h3>어떤 주제들이 있나요?</h3><p>법인 컨설팅의 핵심 주제들이 망라되어 있어요.</p><p>가지급금 정리 전략 — 6.5억, 10억 등 규모별 시나리오</p><p>CEO 퇴직금 플래닝 — 정관 정비, 한도 계산, 지급 방식</p><p>세후소득 극대화 — 급여와 배당 구조 설계</p><p>미처분이익잉여금 관리 — 법인 자금의 합리적 활용</p><p>정관점검 및 임원퇴직금 재원확보 플래닝</p><p>재무제표 핵심점검 포인트</p><p>모두 실제 CEO가 궁금해하는 문제들이에요.</p><h3>어떤 형태로 제공되나요?</h3><p>한 보고서는 보통 여러 형식으로 제공돼요.</p><p>HTML 문서 — 온라인으로 바로 읽기</p><p>PDF 파일 — 인쇄·공유용 (10~20페이지 분량)</p><p>PPT 발표자료 — 고객 앞에서 프레젠테이션용</p><p>오디오·영상 — 출퇴근 학습용</p><p>PPT 버전에는 각 슬라이드 하단에 **발표자 노트(Speaker Notes)**가 포함되어 있어요. Yes-Set 질문, 상담 전환 포인트, 계산 근거, 주의사항 같은 상담 코칭 정보가 담겨 있어서, 발표 자료로 그대로 쓰실 수 있습니다.</p><h3>이렇게 활용해보세요</h3><p>CEO 미팅 자료로 그대로 가져가셔도 됩니다. 주제별로 체계가 잡혀 있어서, 별도 편집 없이도 설명이 가능해요.</p><p>법인 세미나를 여실 때 교재로 활용하시기 좋아요. PPT 버전을 투사하시면서 발표자 노트에 맞춰 진행하시면 됩니다.</p><p>본인의 학습 자료로도 유용해요. 가지급금 6.5억 사례 하나를 제대로 이해하면, 10억·20억 규모도 응용 가능합니다.</p><h3>어디서 찾나요?</h3><p>메인 페이지에서 카테고리 탭의 **&quot;특급보고서&quot;**를 선택하시면 모든 리포트를 보실 수 있어요. 왼쪽 상단 카드에 PDF·▶(영상) 뱃지가 붙어 있어 구분하기 쉽습니다.</p><div class=\"callout callout-summary\"><p>💡 한 줄 요약 CEO 대상 법인 컨설팅을 위한 심화 보고서. HTML·PDF·PPT·오디오·영상 다양한 형식으로 제공되고, PPT에는 발표자 노트까지 들어 있어요.</p></div>",

      {
        "id": "sec-06",
        "title": "06. 재무대시보드",
        "order": 6,
        "bodyHtml": "<p class=\"lead\">고객 한 분 한 분의 재무 상태를 한 화면에서 관리하는 공간이에요.</p><p>여러 고객을 담당하시다 보면 &quot;이 고객은 자산이 얼마였지?&quot;, &quot;누구 상담이 언제였지?&quot;, &quot;어떤 상품을 가입하셨지?&quot; 같은 걸 매번 찾아보기 번거로우셨을 거예요. 재무대시보드는 이런 정보를 고객별로 깔끔하게 정리해두는 공간입니다.</p><h3>어떤 기능이 있나요?</h3><p>고객 프로필 관리 — 이름, 연락처, 가족 정보, 자산 현황</p><p>상담 이력 — 언제 어떤 주제로 상담했는지 기록</p><p>보유 상품 목록 — 가입한 보험·펀드 한눈에 보기</p><p>자산 포트폴리오 — 부동산, 예금, 주식 등 분류별 정리</p><p>실시간 P2P 채팅 — 고객과 직접 소통</p><p>파일 전송 — 제안서, 설계서 등 주고받기</p><p>단순히 고객 정보를 저장만 하는 게 아니라, 소통과 서비스가 이어지는 허브 역할을 합니다.</p><h3>고객 쪽 화면은 어떻게 보이나요?</h3><p>고객님께 전용 링크를 공유해드리면, 고객님도 본인 화면에서 자신의 재무 상태를 확인하실 수 있어요. 양쪽에서 같은 화면을 보며 상담하실 수 있습니다.</p><p>고객 쪽에서는 이런 것들을 하실 수 있어요.</p><p>본인의 자산 현황 확인</p><p>컨설턴트에게 채팅으로 질문</p><p>상담 자료나 계약서 파일 수신</p><p>필요한 자료 요청</p><h3>이렇게 활용해보세요</h3><p>신규 계약 후 바로 재무대시보드에 프로필을 만들고 링크를 드리세요. &quot;앞으로 저와 소통은 여기서 하실 수 있어요&quot; 하고 안내하시면, 자연스럽게 지속 관리로 이어집니다.</p><p>정기 리뷰 때 대시보드를 함께 보며 상담하시면 효율적이에요. 자산 변화, 신규 이슈를 한 화면에서 검토하실 수 있어요.</p><p>고객 요청 사항은 채팅에 남겨두시면 놓치지 않아요. &quot;다음에 만날 때 이 얘기도 해야지&quot; 하고 메모해두실 수 있습니다.</p><h3>지금 어떻게 쓰나요?</h3><p>현재 재무대시보드 기능은 정식 오픈 준비 중이고, 베타버젼을 자유롭게 이용하실 수 있습니다. 헤더의 &quot;재무대시보드 NEW&quot; 버튼을 누르시면 안내 페이지를 보실 수 있습니다. 준비가 완료되면 공지사항으로 안내드릴게요.</p><div class=\"callout callout-summary\"><p>💡 한 줄 요약 고객 한 분 한 분의 재무 상태·상담 이력·채팅·파일 전송을 한 화면에서 관리하는 도구. 고객과 양방향 소통 허브로 쓰세요.</p></div>",

        "id": "sec-07",
        "title": "07. 재무계산기 (16개)",
        "order": 7,
        "bodyHtml": "<p class=\"lead\">복잡한 세금과 재무 계산을 간단하게 도와드리는 계산기예요.</p><p>상속세가 얼마나 나올지, 법인세는 어떻게 계산하는지, 퇴직금 한도는 얼마인지 — 직접 계산하려면 세법 참조하고 엑셀 돌리고 한참 걸리죠. 자비아에는 16가지 전문 계산기가 준비되어 있어 숫자만 입력하시면 바로 답이 나옵니다.</p><h3>어떤 계산기가 있나요?</h3><p>크게 세 분류로 나뉘어요.</p><p>① 세금 계산기 (5개)</p><p>상속세 계산기 — 공제 항목 반영한 정확한 세액</p><p>증여세 계산기 — 증여자·수증자별 관계 반영</p><p>양도세 계산기 — 부동산·주식 양도차익 기반</p><p>퇴직금 계산기 — 근속연수·평균임금 반영</p><p>법인세 계산기 — 과세표준 구간별 적용</p><p>② 법인 컨설팅 특화 계산기 (3개)</p><p>인정이자 계산기 — 법인 대표에게 무이자·저리 대여 시 세무 리스크</p><p>급여 vs 배당 비교 계산기 — CEO가 돈을 어떻게 받는 게 유리한지</p><p>비상장주식 평가 계산기 — 상증세법상 주식가치 평가</p><p>③ 금융 계산기 (8개)</p><p>복리 계산기</p><p>미래가치 계산기</p><p>현재가치 계산기</p><p>투자수익률 계산기</p><p>ROI 계산기</p><p>연금 계산기</p><p>은퇴 계산기</p><p>종합 재무 계산기</p><h3>이렇게 활용해보세요</h3><p>고객 상담 중에 함께 계산해보세요. 가령 &quot;이 집 상속받으면 세금이 얼마나 나올까요?&quot; 질문이 들어오면, 그 자리에서 계산기 띄우고 입력하시면 됩니다. 눈앞에서 숫자가 나오니 설득력이 달라요.</p><p>제안서 작성 전에 시뮬레이션하세요. 급여 vs 배당 계산기로 CEO에게 &quot;이 구조가 세후 ○○만 원 유리합니다&quot; 같은 구체 숫자를 뽑아낼 수 있어요.</p><p>세법 개정 대응에도 유용해요. 매년 세법이 바뀌면 계산기가 업데이트되기 때문에, 최신 세율로 자동 반영됩니다. 일일이 개정 내용 외우지 않으셔도 돼요.</p><h3>어디서 쓰나요?</h3><p>메인 화면 하단의 &quot;📊 재무계산기&quot; 버튼을 누르시면 16개 계산기 목록이 열려요. 필요한 계산기를 선택하시면 바로 입력 화면으로 이동합니다.</p><p>법인 컨설팅 특화 계산기(가지급금·급여vs배당·비상장주식)는 특히 이너서클 이상 등급에서 활용도가 높아요.</p><div class=\"callout callout-summary\"><p>💡 한 줄 요약 상속세부터 비상장주식 평가까지 16가지 계산기 제공. 고객 앞에서 직접 돌려보시면 설득력이 확 올라갑니다.</p></div>",

        "title": "08. TaxNavi 통합검색 (예규·판례)",
        "order": 8,
        "bodyHtml": "<p class=\"lead\">세무 관련 예규·판례를 한 번에 검색할 수 있는 도구예요.</p><p>세법 관련 궁금증이 생기면 국세법령정보시스템, 법고을 대법원 판례, 조세심판원, 금융감독원, 국가법령정보센터, 국세상담센터 — 이렇게 여섯 개 사이트를 각각 따로 뒤져야 하셨을 거예요. TaxNavi는 이 여섯 곳을 한 번에 검색해드립니다.</p><h3>어떻게 쓰나요?</h3><p>메인 화면 하단의 &quot;⚖️ 예규/판례 통합검색&quot; 버튼을 누르시면 검색창이 열려요. 키워드를 입력하시면, 여섯 개 사이트를 동시에 검색해서 결과를 한 화면에 정리해드립니다. 지사장, 이너서클멤버, 컨설턴트홈페이지 회원 그리고 자비아유료멤버는 매월 5건을 무료로 검색 가능합니다.</p><p>예를 들어 **&quot;상속세 배우자 공제&quot;**로 검색하시면,</p><p>국세법령정보시스템의 관련 예규</p><p>대법원의 관련 판례</p><p>조세심판원의 결정 사례</p><p>국세상담센터의 Q&amp;A</p><p>국가법령정보센터의 법령 조문</p><p>금융감독원의 관련 규정</p><p>이 모두가 한 번에 나옵니다.</p><h3>이렇게 활용해보세요</h3><p>고객이 예외 상황을 물어보실 때 바로 검색해서 근거를 찾으세요. &quot;이 경우는 세법상 어떻게 되나요?&quot; 질문이 들어오면, TaxNavi에서 판례 하나 찾아 보여드리는 것만큼 확실한 답이 없어요.</p><p>복잡한 세무 상담을 준비하실 때 참고 자료로 쓰세요. 기본 지식에 더해 최근 판례와 예규를 모아두시면, 고객 앞에서 근거 있게 설명하실 수 있습니다.</p><p>세무사와 협업하실 때도 유용해요. &quot;이 사건 판례가 있습니다&quot; 하고 링크 공유하시면 소통이 빨라집니다.</p><p>이용 방식</p><p>TaxNavi는 검색 건수에 따라 포인트가 차감되는 방식이에요. 지사장, 이너서클멤버, 컨설턴트홈페이지 회원 그리고 자비아유료멤버는 매월 5건을 무료로 검색 가능합니다. 추가이용시 한 번 검색할 때마다 소정의 포인트가 사용됩니다. 자세한 요금은 검색 전 안내 팝업으로 확인하실 수 있어요.</p><p>유료 구독 플랜도 별도로 있어서, 자주 쓰시는 분은 월정액으로 이용하시거나 충전 후 차감방식으로 이용하시면 됩니다.</p><p>검색 결과에는 원본 사이트 링크가 포함되어 있어요. 요약만 보시지 말고, 꼭 원본에서 전체 내용을 확인하세요.</p><div class=\"callout callout-summary\"><p>💡 한 줄 요약 세무 관련 6개 사이트를 한 번에 검색. 고객이 예외 상황 물어볼 때 근거 있는 답을 빠르게 찾으세요. 포인트 차감 방식입니다.</p></div>",

      {
        "id": "sec-09",
        "title": "09. 부가기능 (PPT자동생성·연구노트·기업마당·금융경제통계)",
        "order": 9,
        "bodyHtml": "<p class=\"lead\">업무 효율을 올려주는 네 가지 편의 기능이에요.</p><p>자비아 메인 하단에 버튼으로 배치된 기능들 중 앞서 소개드린 재무계산기와 예규·판례 검색을 제외한 나머지 네 가지입니다. 각각 잘 쓰면 시간 대폭 절약되는 도구들이에요.</p><p>① PPT 자동생성</p><p>주제만 입력하시면 AI가 10~15장짜리 PPT를 자동으로 만들어드려요.</p><p>예를 들면 &quot;50대 부부의 상속 플래닝&quot; 같은 주제를 넣으시면, 목차 짜고, 슬라이드별 제목과 본문 채우고, 디자인까지 맞춰서 PPT 파일로 출력됩니다.</p><p>발표자 노트도 함께 생성되고, 생성 이력은 마이페이지에서 확인·재다운로드하실 수 있어요.</p><p>이런 분께 유용해요</p><p>고객 세미나를 자주 여시는데 자료 만드는 데 시간 많이 쓰시는 분</p><p>새 주제로 발표할 때 뼈대를 빨리 잡고 싶으신 분</p><p>② 연구노트 생성</p><p>세무·재무 관련 연구 자료를 AI로 생성하는 기능이에요. 특정 주제에 대한 심화 분석 자료가 필요할 때, 키워드 몇 개만 입력하시면 구조화된 노트를 만들어드립니다.</p><p>법령 해석, 사례 분석, 쟁점 정리 같은 형식으로 제공되어서, 공부용이나 상담 참고 자료로 활용하시면 좋아요. 지사장, 이너서클멤버, 컨설턴트홈페이지 회원 그릭 자비아유료멤버는 매월 5건을 무료로 이용하실 수 있습니다.</p><p>③ 기업마당 조회</p><p>정부 지원 사업 검색 서비스예요. 기업마당(bizinfo.go.kr)의 방대한 지원사업 정보를 자비아에서 편리하게 검색하실 수 있어요.</p><p>법인 고객을 대상으로 컨설팅하실 때, &quot;이런 지원사업이 있습니다&quot; 하고 안내해드리면 고객 만족도가 크게 올라갑니다. 정책자금, 세제 혜택, 창업 지원 등 다양한 카테고리로 검색 가능해요. 지사장, 이너서클멤버, 컨설턴트홈페이지 회원 그릭 자비아유료멤버는 매월 10건을 무료로 검색 가능합니다.</p><p>④ 금융·경제통계</p><p>한국은행 ECOS 기반의 경제 지표를 한눈에 보실 수 있어요. 기준금리, 환율, 물가지수, GDP 같은 주요 지표를 실시간으로 확인하고, 과거 추이도 차트로 보실 수 있습니다.</p><p>고객 상담 중 &quot;요즘 금리가 어땠지?&quot; 같은 질문이 나올 때 바로 확인하시면 좋아요. 헤더 메뉴와 하단 버튼 양쪽에서 접근 가능합니다.</p><h3>어떤 순서로 배치되어 있나요?</h3><p>메인 화면 하단을 보시면 버튼 여섯 개가 일렬로 있어요. 왼쪽부터 기업마당조회 → 연구노트생성 → 예규/판례 통합검색 → 금융경제통계 → 재무계산기 → PPT자동생성 순서입니다.</p><div class=\"callout callout-summary\"><p>💡 한 줄 요약 PPT 자동생성, 연구노트, 기업마당 조회, 금융·경제통계 — 네 가지 편의 기능. 각자 업무 맥락에서 시간을 크게 줄여줍니다.</p></div>",

        "id": "sec-10",
        "title": "10. 콘텐츠 찾고 활용하기",
        "order": 10,
        "bodyHtml": "<p class=\"lead\">수백여개의 콘텐츠 중에서 내가 원하는 걸 빠르게 찾고, 편하게 저장·공유하는 방법이에요.</p><p>자비아에 콘텐츠가 많아질수록 &quot;어떻게 하면 원하는 걸 빨리 찾지?&quot; 하는 고민이 생기실 거예요. 이 섹션은 그 질문에 대한 답이에요. 검색, 필터, 즐겨찾기, 공유 — 네 가지 기능을 잘 쓰시면 됩니다.</p><p>① 검색 — 키워드로 찾기</p><p>콘텐츠 목록 위에 &quot;키워드로 검색...&quot; 입력창이 있어요. 여기에 찾고 싶은 단어를 입력하시면 실시간으로 결과가 좁혀집니다.</p><p>예를 들어 **&quot;가지급금&quot;**이라고 치시면 제목이나 요약에 &quot;가지급금&quot;이 들어간 모든 콘텐츠가 필터링돼요. &quot;상속&quot;, &quot;퇴직금&quot;, &quot;증여&quot; 같은 키워드로도 검색 가능합니다.</p><p>여러 단어를 공백으로 구분해 입력하시면 하나라도 매칭되는 콘텐츠가 나옵니다.</p><p>② 포맷 필터 — 형식별로 보기</p><p>콘텐츠 목록 위에 있는 탭들이에요.</p><p>전체 — 모든 콘텐츠</p><p>HTML — 웹 문서</p><p>PDF — 인쇄·공유용 PDF</p><p>PPT — 발표용 슬라이드</p><p>♪ — 오디오 파일</p><p>▶ — 영상 파일</p><p>예를 들어 운전 중에 들을 게 필요하시면 ♪ 탭을 누르세요. 인쇄할 자료가 필요하시면 PDF 탭이에요. 출근길이나 상황에 맞춰 골라 보시면 됩니다.</p><p>③ 개인·법인 필터 — 고객 유형별로 좁히기</p><p>필터 탭 오른쪽에 &quot;전체 / 개인 / 법인&quot; 버튼이 있어요. 누구를 대상으로 한 자료인지에 따라 좁혀 보실 수 있습니다.</p><p>상속·증여 관련 개인 고객 상담을 준비하실 땐 개인을, CEO 미팅을 앞두고 계실 땐 법인을 누르시면 관련 자료만 보여요.</p><p>④ 게시예정 — 앞으로 올라올 콘텐츠 미리 보기</p><p>필터 오른쪽에 &quot;📅 게시예정&quot; 버튼이 있어요. 이걸 누르시면 앞으로 자비아에 올라올 콘텐츠 목록을 미리 확인하실 수 있습니다.</p><p>&quot;이번 달에는 이런 주제들이 올라오는구나&quot; 미리 파악하시고 계획을 세우시면 좋아요.</p><p>⑤ 즐겨찾기 — 자주 쓰는 콘텐츠 저장</p><p>콘텐츠를 열어보시면 하트(♥) 버튼이 있어요. 누르시면 해당 콘텐츠가 즐겨찾기로 저장됩니다.</p><p>나중에 마이페이지 → 즐겨찾기 탭에서 저장한 콘텐츠들을 모아 보실 수 있어요. 자주 쓰는 자료, 다시 볼 만한 자료를 따로 묶어두시면 업무 속도가 빨라집니다.</p><p>⑥ 카카오톡 공유 — 고객에게 바로 보내기</p><p>각 콘텐츠 상세 페이지에는 &quot;카톡 공유&quot; 버튼이 있어요. 누르시면 카카오톡 공유창이 열리고, 보고 있던 자료를 친구·단체방·고객에게 바로 전달하실 수 있습니다.</p><p>공유 카드에는 제목, 설명, 썸네일이 자동으로 포함돼서 받으시는 분이 내용을 한눈에 파악하기 좋아요.</p><div class=\"callout callout-summary\"><p>💡 한 줄 요약 검색·필터·즐겨찾기·카톡 공유 네 기능을 익히시면 콘텐츠 활용 속도가 완전히 달라집니다.</p></div>",

      {
        "id": "sec-11",
        "title": "11. 내 계정 관리 (가입부터 관리까지)",
        "order": 11,
        "bodyHtml": "<p class=\"lead\">자비아를 쓰면서 필요한 모든 계정 관련 기능을 한곳에 모았어요.</p><p>가입부터 시작해서 등급 확인, 충전, 포인트, 추천, 공지 확인, 제휴 제안, 그리고 로그인·비밀번호 관리까지 — 내 계정과 관련된 모든 것이 이 섹션에 있습니다.</p><h3>① 마이페이지에서 뭘 할 수 있나요?</h3><p>상단 메뉴의 **&quot;마이페이지&quot;**에 들어가시면 일곱 개의 탭이 있어요.</p><p>내 정보 — 이름, 연락처, 비밀번호 변경</p><p>이용가능 콘텐츠 — 결제 후 30일간 무료로 보실 수 있는 콘텐츠 목록</p><p>이용 내역 — 지금까지 열람·구매한 기록</p><p>PPT 생성 내역 — AI로 만든 PPT 파일들 (해당 등급만)</p><p>충전 내역 — 포인트 충전·사용 이력</p><p>즐겨찾기 — 하트로 저장한 콘텐츠들</p><p>추천 현황 — 내 추천코드와 추천 성공 이력</p><p>고객리포트 프로필 — 고객용 DR에 들어갈 정보 (섹션 3 참고)</p><p>등급에 따라 일부 탭이 안 보일 수 있어요. 예를 들어 PPT 생성 기능이 없는 등급은 &quot;PPT 생성 내역&quot; 탭이 숨겨집니다.</p><p>② 멤버십 등급 (6가지)</p><p>자비아에는 여러 유형의 멤버십이 있어요..</p><p>무료회원 — 회원가입만 하신 상태. 일부 콘텐츠 열람 가능</p><p>일반회원 — 결제 시 콘텐츠별 유료 이용</p><p>리포트 회원 — Daily Report 전용 무제한 이용</p><p>JARVIA 멤버십 — 다양한 콘텐츠 폭넓게 이용</p><p>지사장/이너서클/컨홈페이지 — 한국에프피센터 멤버십</p><p>본인의 등급은 마이페이지 내 정보 탭에서 확인하실 수 있고, 등급 업그레이드는 별도 상담이 필요해요.</p><p>③ 충전과 포인트</p><p>자비아는 포인트 기반으로 일부 서비스를 이용하세요. 콘텐츠 결제, TaxNavi 검색 같은 것들이요.</p><p>헤더 오른쪽의 &quot;💰 ○○○원 | ○P | 충전&quot; 부분이 보이실 거예요. 여기의 충전 버튼을 누르시면 INNOPAY 결제 창이 열리고, 카드·계좌이체 등으로 포인트를 충전하실 수 있습니다.</p><p>1,000원 = 1,000P로 환산돼요. 콘텐츠 열람 시 포인트가 차감되고, 잔액은 실시간 반영됩니다.</p><p>④ 추천 코드로 포인트 받기</p><p>마이페이지 추천 현황 탭에 들어가시면 본인의 추천 코드가 보여요. 이 코드를 지인에게 전해주시고, 그분이 회원가입할 때 추천 코드를 입력하시면 양쪽 모두 포인트가 적립됩니다.</p><p>추천 링크를 카카오톡이나 SNS로 바로 공유하는 기능도 있어요. 추천으로 가입한 회원 목록과 적립 포인트 누계를 확인하실 수 있습니다.</p><p>⑤ 공지사항</p><p>헤더 또는 햄버거 메뉴의 **&quot;공지사항&quot;**을 누르시면 자비아 공지를 보실 수 있어요. 신규 콘텐츠 안내, 서비스 변경, 이벤트 같은 것들이 올라옵니다.</p><p>중요한 공지는 상단에 **노란 띠(티커)**로도 표시되니 놓치지 마세요.</p><p>⑥ 제휴 제안</p><p>헤더의 &quot;제휴 제안&quot; 메뉴를 누르시면 자비아와 제휴하고 싶으신 사항을 접수하실 수 있어요.</p><p>법인 단체 가입 제안</p><p>콘텐츠 파트너십</p><p>교육기관 제휴</p><p>기타 비즈니스 제안</p><p>제안 내용을 입력하시면 담당자가 검토 후 연락드립니다.</p><p>⑦ 로그인·회원가입·비밀번호</p><p>처음 가입하시려면</p><p>① 상단 &quot;회원가입&quot; 버튼 ② 이메일·비밀번호·이름 입력 ③ (선택) 추천 코드 입력하면 포인트 적립 ④ 가입 완료 → 이메일 인증 ⑤ 로그인하시면 끝</p><p>로그인이 안 될 때</p><p>로그인 화면에서 **&quot;비밀번호 찾기&quot;**를 누르시면 이메일로 재설정 링크를 받으실 수 있어요.</p><p>로그아웃은 헤더 오른쪽의 빨간 &quot;로그아웃&quot; 버튼 또는 모바일 햄버거 메뉴에서 하실 수 있습니다.</p><p>⑧ 기타 팁</p><p>추천 링크 공유 시 포인트 보너스가 있어요. 자주 활용해보세요.</p><p>이용가능 콘텐츠 유효기간은 30일이에요. 결제하셨다면 30일 안에 다 보시는 게 이득입니다.</p><div class=\"callout callout-summary\"><p>💡 한 줄 요약 가입·로그인·등급·충전·포인트·추천·공지·제휴까지. 자비아 계정 관련 모든 것은 마이페이지 일곱 개 탭과 헤더 메뉴에서 하실 수 있어요.</p></div>",

      {
        "id": "sec-12",
        "title": "12. 병의원 컨설팅 위클리",
        "order": 12,
        "bodyHtml": "<p class=\"lead\">매주 토요일에 올라오는 병의원 전문 컨설팅 자료예요.</p><p>개원의·원장님들이 가장 궁금해하시는 주제 — 병원 세무, 직원 노무관리, 의료법 이슈, 자산운용, 사업양수도, 가족승계 — 이런 내용을 매주 한 가지씩 깊이 있게 풀어드립니다. 일반 세무 자료보다 의료 분야 특화 사례에 집중해서, 의료 컨설팅을 하시는 분들께 딱 맞는 자료예요.</p><h3>어떤 주제들이 다뤄지나요?</h3><p>병의원 컨설팅은 일반 법인 컨설팅과 사뭇 다른 부분이 많아요. 의료법, 의료기기 임차, 직원 채용·퇴직, 환자 데이터 보호, 4대보험 특수성 같은 영역들이죠. 위클리는 이런 영역들을 하나씩 짚어드립니다.</p><p>예를 들면 이런 회차들이에요.</p><p>&quot;월 1억 매출 의사, 실제 손에 남는 돈은 왜 달라질까 — 세금·비용·4대보험 구조 분석&quot;</p><p>종합소득세, 부가세 신고 시 흔히 놓치는 비용 처리 포인트</p><p>개원 1년 차 의사가 반드시 알아야 할 절세 5가지</p><p>병의원 양수도 시 권리금 평가와 세무 처리</p><h3>어떤 형태로 제공되나요?</h3><p>각 주제는 이렇게 제공돼요.</p><p>HTML 문서 — 웹으로 바로 읽기</p><p>오디오 — 출퇴근길에 두 사람 대화 형식으로 듣기</p><p>카드 이미지 — 핵심 포인트를 인스타그램·카카오톡 공유용으로</p><p>원장님께 카카오톡으로 카드 이미지 한 장 보내드리고, 깊은 내용은 PDF로 정리해드리는 식으로 활용하시면 좋아요.</p><h3>이렇게 활용해보세요</h3><p>병의원 원장님과 첫 미팅 전에 위클리 한 편 읽고 가시면, 그분이 어떤 고민을 하실지 미리 감이 잡혀요. &quot;혹시 이런 건 어떻게 처리하고 계세요?&quot; 하고 자연스럽게 대화 시작하실 수 있어요.</p><p>병의원 컨설팅 영업을 시작하시는 분이라면, 매주 한 편씩 12주만 읽으셔도 의료 분야 기본기가 잡힙니다. 한 권의 책처럼 계속 쌓이는 자료예요.</p><p>세무사·노무사와 협업하실 때도 좋은 공통 언어가 돼요. 위클리에 정리된 사례를 공유하시면 소통이 빨라집니다.</p><h3>어디서 보나요?</h3><p>메인 화면 콘텐츠 카테고리에서 &quot;병의원 컨설팅&quot;을 선택하시면 모든 회차를 보실 수 있어요. 매주 토요일 오전에 새 회차가 올라옵니다.</p><h3>이용 방법</h3><p>회차당 2,000원 결제 또는 자비아멤버십·이너서클·지사장·컨홈회원이시면 무제한 열람 가능해요. 결제는 헤더 오른쪽 포인트에서 차감되는 방식입니다.</p><div class=\"callout callout-summary\"><p>💡 한 줄 요약 매주 토요일에 올라오는 병의원 전문 컨설팅 자료. 병원 세무, 노무, 의료법, 자산운용까지 의료 분야 특화 주제. HTML·오디오·카드 이미지 세 가지 형식으로 제공돼요.</p></div>",

        "id": "sec-13",
        "title": "13. 병의원 찾기",
        "order": 13,
        "bodyHtml": "<p class=\"lead\">전국 약 8만 곳의 병의원을 지역별로 검색하는 영업 분석 도구예요.</p><p>병의원 컨설팅을 하시려면 우선 어디에 어떤 병원들이 있는지 파악하셔야겠죠. &quot;강남구에 한의원이 몇 곳이지?&quot;, &quot;내 사무실 반경 3km 안에 치과는?&quot;, &quot;관할 구역에 새로 생긴 종합병원은?&quot; — 이런 질문에 바로 답을 찾으실 수 있어요.</p><h3>어디 데이터를 쓰나요?</h3><p>공식 병원정보서비스 데이터예요. 매주 자동으로 갱신되기 때문에 폐업한 병원이나 새로 개원한 병원이 빠르게 반영됩니다.</p><h3>어떻게 검색하나요?</h3><p>두 가지 방법이 있어요.</p><p>① 지역으로 찾기</p><p>시도(서울특별시·경기도 등 17개)와 시군구를 선택하신 후 검색하시면 됩니다. 종별(의원·병원·한의원·치과·요양병원 등) 필터를 추가하시면 더 좁혀 보실 수 있어요.</p><p>② 내 주변에서 찾기</p><p>&quot;내 주변&quot; 모드를 누르시면 위치 기반으로 검색해드려요. 반경 1km, 3km, 5km 중 선택하시면 그 안의 병의원들을 거리순으로 정리해드립니다. 외근 중에 근처 병원 찾으실 때 유용해요.</p><h3>어떤 정보가 나오나요?</h3><p>검색 결과에는 병원명, 종별, 정확한 도로명 주소, 대표 전화번호, 의사 수, 홈페이지(있는 경우), 개원일이 표시됩니다. 전화번호는 클릭하시면 바로 통화로 연결돼요.</p><h3>이렇게 활용해보세요</h3><p>특정 지역에 영업 활동을 시작하시기 전에 종별 분포부터 파악하세요. 한의원이 많은 지역, 치과 비중이 높은 지역은 영업 전략이 달라야겠죠.</p><p>기존 고객 분석에도 좋아요. 본인이 관리하시는 원장님들의 병원이 어디에 분포되어 있는지, 그 주변에 비슷한 의원이 몇 곳이나 더 있는지 파악하시면 신규 영업 우선순위가 잡힙니다.</p><p>세미나·교육 안내문 발송하실 때도 활용해보세요. 종별·지역으로 좁힌 후 명단을 정리하시면 효율이 올라갑니다.</p><h3>이용 규칙</h3><p>자비아멤버십·이너서클·지사장·컨홈회원 전용 도구예요. 하루 3회까지 검색하실 수 있고, 매일 자정(한국시간)에 자동으로 리셋됩니다. 관리자는 무제한이에요.</p><p>검색 버튼을 누르시면 1회가 차감되니, 검색 조건은 신중하게 정하시는 게 좋아요. 단순한 페이지 이동이나 결과 스크롤은 차감되지 않습니다.</p><h3>어디서 쓰나요?</h3><p>메인 화면에서 &quot;병의원 찾기&quot; 메뉴 또는 마이페이지에서 접근하실 수 있어요.</p><div class=\"callout callout-summary\"><p>💡 한 줄 요약 전국 8만여 곳의 병의원을 지역·종별로 검색하는 영업 분석 도구. HIRA 공식 데이터, 매주 갱신. 자비아멤버십 이상 하루 3회 이용 가능합니다.</p></div>",

      {
        "id": "sec-14",
        "title": "14. 신규 의원 검색",
        "order": 14,
        "bodyHtml": "<p class=\"lead\">최근 개원한 의원을 찾아드리는 신규 영업 발굴 전용 도구예요.</p><p>병의원 영업의 황금시간은 개원 직후 1~3개월이라고 하죠. 새로 문 연 원장님은 운영·세무·노무·자산관리 같은 다양한 고민을 한꺼번에 떠안고 계세요. 그 시기에 도움이 되는 컨설턴트를 만나시면 평생 고객이 되실 수 있습니다.</p><p>이 도구는 그 골든타임을 놓치지 않도록 도와드려요.</p><h3>어떤 정보를 보실 수 있나요?</h3><p>검색 결과 화면 상단에는 통계가 나옵니다. 총 신규 개원 건수, 시도별 분포 (상위 10), 종별 분포, 월별 분포 — 한눈에 흐름이 잡혀요.</p><p>테이블에는 가장 최근 개원한 1곳의 상세 정보(개원일·병원명·종별·지역·의사 수)가 표시되고, 그 외 신규 개원 의원 수가 함께 안내됩니다. 그날 어느 지역에 어떤 종별이 얼마나 새로 생겼는지를 빠르게 파악하실 수 있어요.</p><h3>어떻게 검색하나요?</h3><p>시도와 시군구를 필수로 선택하신 후, 검색 기간(시작일·종료일)을 정하시면 됩니다. 종별은 다중 선택이 가능해서 의원·한의원·치과 같은 카테고리를 함께 골라 검색하실 수 있어요.</p><h3>이렇게 활용해보세요</h3><p>매주 월요일에 한 번씩 검색해보시는 걸 추천드려요. 데이터가 주말에 갱신되니, 월요일 검색이 가장 따끈한 결과를 받아보실 수 있어요.</p><p>활동 지역을 좁혀서 검색하세요. &quot;내가 영업할 수 있는 시군구&quot;로 좁혀 보시면, 그 주의 신규 개원 의원이 정리됩니다. 그날 우선순위가 정해지는 셈이에요.</p><p>상세 정보가 필요하신 의원은 컨설팅 문의로 자료 요청이 가능합니다. 정확한 도로명 주소, 대표 전화번호, 홈페이지, 의료진 정보, 인접 지역 신규 의원 정보를 일괄로 받아보실 수 있어요.</p><h3>왜 하루 1회 제한인가요?</h3><p>신규 의원 정보는 영업의 핵심 자산이에요. 무제한으로 열어두면 검색만 하다 정작 영업 활동에 시간을 쓰지 못하시는 경우가 생기더라구요. 하루 1회로 제한하면 그날의 핵심 신규 의원을 집중 분석하시고, 실제 영업 활동에 시간을 쓰실 수 있습니다.</p><p>자비아멤버십·이너서클·지사장·컨홈회원 전용 도구이고, 매일 자정에 자동 리셋됩니다. 관리자는 무제한이에요.</p><h3>전체 정보가 필요하시면</h3><p>도로명 주소, 전화번호, 홈페이지, 의료진 정보, 인접 지역 신규 의원 정보가 필요하신 경우, 개별 컨설팅 문의로 일괄 자료 제공이 가능합니다.</p><p>📧 polarislkh@naver.com 으로 문의하시면 우선 응대해드려요.</p><div class=\"callout callout-summary\"><p>💡 한 줄 요약 최근 개원한 의원을 찾는 신규 영업 발굴 도구. 개원 직후가 컨설팅 골든타임. 자비아멤버십 이상 하루 1회 검색 가능합니다.</p></div>",
        "audioUrl": "",
        "duration": 0
      }
    ];
    if(sections.length===0)throw new Error('가이드 섹션이 없습니다.');

    // ===== 음성 연결 (기존 Firestore guide_sections에서 audioUrl 매칭) =====
    // 실패해도 콘텐츠는 정상 표시 (graceful degradation)
    try{
      const q=query(collection(db,'guide_sections'),orderBy('order','asc'));
      const snap=await getDocs(q);
      const audioMap={};
      snap.forEach(d=>{
        const data=d.data();
        if(data.order!=null && data.audioUrl){
          audioMap[data.order]={audioUrl:data.audioUrl, duration:data.duration||0};
        }
      });
      sections.forEach(s=>{
        const a=audioMap[s.order];
        if(a){
          s.audioUrl=a.audioUrl;
          s.duration=a.duration;
        }
      });
    }catch(audioErr){
      console.warn('[Guide] 음성 매칭 실패 (콘텐츠는 정상 표시):',audioErr);
    }

    renderAll(sections);
  }catch(err){
    console.error('[Guide] 로드 실패:',err);
    $('#sections').innerHTML=`
      <div class="error-box">
        <strong>가이드를 불러올 수 없습니다.</strong>
        <p style="margin:8px 0 0;font-size:13px">잠시 후 다시 시도해주세요.<br>문제가 계속되면 메인 사이트의 제휴 제안 메뉴로 알려주세요.</p>
      </div>`;
  }
}

// ===== 렌더링 =====
function renderAll(sections){
  renderChipNav(sections);
  renderSections(sections);
  $('#chipProgTotal').textContent=sections.length;
  setupScrollSpy();
  setupPlayers();
  setupMobileToc();
  setupScrollToTop();
}

function renderChipNav(sections){
  // 데스크톱 칩
  const chipHtml=sections.map((s,i)=>`
    <li>
      <button type="button" class="chip" data-target="${escapeHtml(s.id)}">
        <span class="chip-num">${i+1}</span>
        <span class="chip-text">${escapeHtml(stripPrefix(s.title))}</span>
      </button>
    </li>
  `).join('');
  $('#chipList').innerHTML=chipHtml;

  // 모바일 드롭다운 리스트
  const mtocHtml=sections.map((s,i)=>`
    <li>
      <button type="button" class="m-toc-link" data-target="${escapeHtml(s.id)}" data-idx="${i}">
        <span class="m-toc-num">${i+1}</span>
        <span class="m-toc-text">${escapeHtml(stripPrefix(s.title))}</span>
      </button>
    </li>
  `).join('');
  $('#mTocList').innerHTML=mtocHtml;
}

function renderSections(sections){
  const html=sections.map((s,i)=>`
    <article class="sec" id="${escapeHtml(s.id)}" data-idx="${i}">
      <header class="sec-head">
        <div class="sec-head-text">
          <div class="sec-num">SECTION ${String(i+1).padStart(2,'0')}</div>
          <h2 class="sec-title">${escapeHtml(stripPrefix(s.title))}</h2>
        </div>
        ${renderPlayer(s)}
      </header>
      <div class="sec-body">${s.bodyHtml||''}</div>
    </article>
  `).join('');
  $('#sections').innerHTML=html;
}

function renderPlayer(s){
  if(!s.audioUrl)return '';
  return `
    <div class="player" data-audio="${escapeHtml(s.audioUrl)}" data-duration="${s.duration||0}">
      <button type="button" class="player-btn" aria-label="음성 재생">
        <span class="icon-play" aria-hidden="true">▶</span>
        <span class="icon-pause" aria-hidden="true">❚❚</span>
      </button>
      <div class="player-info">
        <span class="lbl">음성 듣기</span>
        <span class="time">${fmtTime(s.duration)}</span>
      </div>
    </div>
  `;
}

function stripPrefix(title){
  // "01. 자비아 개요" → "자비아 개요"
  return String(title||'').replace(/^\d{1,2}\.\s*/,'');
}

// ===== TTS 플레이어 (한 번에 하나만 재생) =====
let currentAudio=null, currentBtn=null, currentTimer=null;

function setupPlayers(){
  $$('.player').forEach(p=>{
    const btn=p.querySelector('.player-btn');
    const url=p.dataset.audio;
    const dur=parseInt(p.dataset.duration,10)||0;
    const timeEl=p.querySelector('.time');

    btn.addEventListener('click',()=>{
      // 현재 재생 중이면 정지
      if(currentBtn===btn && currentAudio && !currentAudio.paused){
        currentAudio.pause();
        return;
      }
      // 다른 플레이어에서 재생 중이었으면 정지
      if(currentAudio){
        currentAudio.pause();
        if(currentBtn){
          currentBtn.closest('.player').classList.remove('playing');
          const oldTime=currentBtn.closest('.player').querySelector('.time');
          const oldDur=parseInt(currentBtn.closest('.player').dataset.duration,10)||0;
          if(oldTime)oldTime.textContent=fmtTime(oldDur);
        }
      }
      // 새 오디오 시작
      const a=new Audio(url);
      a.preload='auto';
      currentAudio=a;currentBtn=btn;
      p.classList.add('playing');

      a.addEventListener('loadedmetadata',()=>{
        if(timeEl && a.duration && !isNaN(a.duration)){
          // 실제 길이로 갱신
          p.dataset.duration=Math.round(a.duration);
        }
      });
      a.addEventListener('timeupdate',()=>{
        if(timeEl){
          const remaining=Math.max(0,(a.duration||dur)-a.currentTime);
          timeEl.textContent=fmtTime(remaining);
        }
      });
      a.addEventListener('ended',()=>{
        p.classList.remove('playing');
        if(timeEl)timeEl.textContent=fmtTime(a.duration||dur);
        if(currentAudio===a){currentAudio=null;currentBtn=null}
      });
      a.addEventListener('pause',()=>{
        p.classList.remove('playing');
      });
      a.addEventListener('play',()=>{
        p.classList.add('playing');
      });
      a.addEventListener('error',()=>{
        p.classList.remove('playing');
        if(timeEl)timeEl.textContent='오류';
        console.error('[Audio] 재생 실패:',url);
      });
      a.play().catch(err=>{
        console.error('[Audio] play() 실패:',err);
        p.classList.remove('playing');
      });
    });
  });
}

// ===== 스크롤 스파이 (활성 섹션 추적) =====
function setupScrollSpy(){
  const sections=$$('.sec');
  const chips=$$('#chipList .chip');
  const total=sections.length;
  let activeIdx=-1;

  const setActive=(idx)=>{
    if(idx===activeIdx)return;
    activeIdx=idx;
    chips.forEach((c,i)=>c.classList.toggle('active',i===idx));
    sections.forEach((sec,i)=>sec.classList.toggle('in-view',i===idx));
    // 모바일 드롭다운 활성 표시 + 라벨/배지 갱신
    const mtocLinks=$$('#mTocList .m-toc-link');
    mtocLinks.forEach((l,i)=>l.classList.toggle('active',i===idx));
    const activeLink=mtocLinks[idx];
    if(activeLink){
      const lblEl=$('#mTocLabel');
      const bdgEl=$('#mTocBadge');
      const t=activeLink.querySelector('.m-toc-text');
      if(lblEl && t)lblEl.textContent=t.textContent;
      if(bdgEl)bdgEl.textContent=idx+1;
    }
    const num=idx+1;
    const progEl=$('#chipProgNum');
    if(progEl)progEl.textContent=num;
  };

  const obs=new IntersectionObserver(entries=>{
    let best=null,bestRatio=0;
    entries.forEach(e=>{
      if(e.isIntersecting && e.intersectionRatio>bestRatio){
        best=e.target;bestRatio=e.intersectionRatio;
      }
    });
    if(best){
      const idx=parseInt(best.dataset.idx,10);
      if(!isNaN(idx))setActive(idx);
    }
  },{rootMargin:'-25% 0px -55% 0px',threshold:[0,.25,.5,.75,1]});

  sections.forEach(s=>obs.observe(s));

  chips.forEach(chip=>{
    chip.addEventListener('click',e=>{
      e.preventDefault();
      const target=chip.dataset.target;
      const el=document.getElementById(target);
      if(el)el.scrollIntoView({behavior:'smooth',block:'start'});
    });
  });

  setActive(0);
}

// ===== 모바일 드롭다운 토글 =====
function setupMobileToc(){
  const mToc=$('#mToc');
  const btn=$('#mTocBtn');
  if(!mToc||!btn)return;

  const close=()=>{
    mToc.setAttribute('data-open','false');
    btn.setAttribute('aria-expanded','false');
  };
  const open=()=>{
    mToc.setAttribute('data-open','true');
    btn.setAttribute('aria-expanded','true');
  };

  btn.addEventListener('click',(e)=>{
    e.stopPropagation();
    const isOpen=mToc.getAttribute('data-open')==='true';
    if(isOpen)close();else open();
  });

  // 항목 클릭 시 스크롤 + 닫기
  $$('#mTocList .m-toc-link').forEach(link=>{
    link.addEventListener('click',(e)=>{
      e.preventDefault();
      const target=link.dataset.target;
      const el=document.getElementById(target);
      if(el)el.scrollIntoView({behavior:'smooth',block:'start'});
      close();
    });
  });

  // 외부 클릭 시 닫기
  document.addEventListener('click',(e)=>{
    if(!mToc.contains(e.target))close();
  });

  // ESC 키로 닫기
  document.addEventListener('keydown',(e)=>{
    if(e.key==='Escape')close();
  });
}

// ===== 스크롤 투 탑 버튼 =====
function setupScrollToTop(){
  const btn=$('#toTopBtn');
  if(!btn)return;
  const onScroll=()=>{
    if(window.scrollY>300)btn.classList.add('visible');
    else btn.classList.remove('visible');
  };
  window.addEventListener('scroll',onScroll,{passive:true});
  onScroll();
  btn.addEventListener('click',()=>{
    window.scrollTo({top:0,behavior:'smooth'});
  });
}
