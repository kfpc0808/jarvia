<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=5.0" />
<meta name="theme-color" content="#0f2040" />
<title>자비아 이용가이드 — 재무컨설턴트를 위한 자료실</title>

<meta name="description" content="자비아(JARVIA) 상세 이용가이드. 매일 아침 시장 브리핑, 고객용 자료, 16가지 재무계산기, TaxNavi 예규/판례 통합검색까지. 법인영업·절세·법인컨설팅에 필요한 모든 도구를 한곳에서 익히세요." />
<meta name="keywords" content="자비아, JARVIA, 재무컨설턴트, 법인영업, 법인컨설팅, 절세, 상속세, 증여세, 가지급금, CEO퇴직금, TaxNavi, Daily Report, 이용가이드" />
<meta name="author" content="한국에프피센터" />

<meta property="og:type" content="website" />
<meta property="og:title" content="자비아 이용가이드" />
<meta property="og:description" content="재무컨설턴트가 매일 쓰는 자료실. 시장 브리핑, 세무 상담 사례, 재무계산기, 예규·판례 통합검색까지 한곳에." />
<meta property="og:url" content="https://jarvia.co.kr/guide.html" />
<meta property="og:site_name" content="JARVIA" />

<link rel="canonical" href="https://jarvia.co.kr/guide.html" />

<style>
:root{
  --navy-900:#0a1830;
  --navy-800:#0f2040;
  --navy-700:#1B3A5C;
  --navy-600:#264a72;
  --navy-500:#365e8c;
  --gold:#C9A96E;
  --gold-light:#F0D78C;
  --gold-soft:rgba(201,169,110,.12);
  --gold-border:rgba(201,169,110,.35);
  --text-primary:#E8E3D4;
  --text-secondary:#B8B5AA;
  --text-tertiary:#888580;
  --bg-card:rgba(255,255,255,.03);
  --bg-card-hover:rgba(255,255,255,.06);
  --border-soft:rgba(255,255,255,.08);
  --border-mid:rgba(255,255,255,.14);
  --shadow-card:0 4px 16px rgba(0,0,0,.25);
  --radius-sm:6px;
  --radius-md:10px;
  --radius-lg:14px;
  --radius-xl:20px;
  --side-w:260px;
  --header-h:64px;
  --hero-h-d:240px;
  --hero-h-m:180px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:80px}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif;
  background:var(--navy-900);
  color:var(--text-primary);
  line-height:1.7;
  -webkit-font-smoothing:antialiased;
  font-size:15.5px;
  letter-spacing:-.01em;
  overflow-x:hidden;
}
img{max-width:100%;height:auto}
a{color:var(--gold-light);text-decoration:none}
a:hover{text-decoration:underline}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

/* ====== HEADER (단순 헤더) ====== */
.gh{
  position:sticky;top:0;z-index:90;
  background:rgba(10,24,48,.92);
  backdrop-filter:saturate(140%) blur(12px);
  -webkit-backdrop-filter:saturate(140%) blur(12px);
  border-bottom:1px solid var(--border-soft);
  height:var(--header-h);
}
.gh-inner{
  max-width:1280px;margin:0 auto;height:100%;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 18px;
}
.gh-logo{
  display:flex;align-items:center;gap:10px;
  font-weight:700;font-size:18px;letter-spacing:.5px;color:var(--gold-light);
}
.gh-logo .dot{
  width:10px;height:10px;border-radius:50%;
  background:linear-gradient(135deg,var(--gold-light),var(--gold));
  box-shadow:0 0 12px rgba(240,215,140,.4);
}
.gh-back{
  display:inline-flex;align-items:center;gap:6px;
  padding:8px 16px;border-radius:999px;
  background:var(--gold-soft);
  color:var(--gold-light);
  font-size:13px;font-weight:600;
  border:1px solid var(--gold-border);
  transition:all .2s ease;
}
.gh-back:hover{background:rgba(201,169,110,.2);text-decoration:none;transform:translateY(-1px)}
.gh-back:active{transform:translateY(0)}

/* ====== HERO ====== */
.hero{
  position:relative;
  min-height:var(--hero-h-d);
  display:flex;flex-direction:column;justify-content:center;
  padding:48px 18px 36px;
  text-align:center;
  background:linear-gradient(180deg,var(--navy-800) 0%,var(--navy-900) 100%);
  border-bottom:1px solid var(--border-soft);
  overflow:hidden;
}
.hero::before{
  content:"";position:absolute;inset:-2px;
  background:radial-gradient(ellipse 60% 50% at 50% 0%,rgba(201,169,110,.18) 0%,transparent 70%);
  pointer-events:none;
}
.hero-eyebrow{
  position:relative;
  display:inline-block;margin:0 auto 14px;
  font-size:11px;font-weight:700;letter-spacing:2px;
  color:var(--gold-light);
  padding:5px 14px;border-radius:999px;
  background:var(--gold-soft);
  border:1px solid var(--gold-border);
  text-transform:uppercase;
}
.hero h1{
  position:relative;
  margin:0 0 10px;font-size:32px;font-weight:700;
  color:var(--text-primary);
  letter-spacing:-.5px;line-height:1.25;
}
.hero h1 .accent{color:var(--gold-light)}
.hero p{
  position:relative;
  margin:0 auto;max-width:600px;
  color:var(--text-secondary);font-size:15px;
}

/* ====== LAYOUT ====== */
.shell{
  max-width:1280px;margin:0 auto;
  display:grid;grid-template-columns:var(--side-w) 1fr;
  gap:0;
  position:relative;
}

/* ====== SIDEBAR (데스크탑) ====== */
.sb{
  position:sticky;top:var(--header-h);
  height:calc(100vh - var(--header-h));
  overflow-y:auto;
  padding:30px 0 30px 18px;
  border-right:1px solid var(--border-soft);
  scrollbar-width:thin;scrollbar-color:var(--navy-600) transparent;
}
.sb::-webkit-scrollbar{width:6px}
.sb::-webkit-scrollbar-thumb{background:var(--navy-600);border-radius:3px}
.sb-title{
  font-size:11px;font-weight:700;color:var(--gold-light);
  letter-spacing:1.5px;margin:0 0 14px;
  padding-left:10px;text-transform:uppercase;
}
.sb-list{list-style:none;margin:0;padding:0}
.sb-item{margin:1px 0}
.sb-link{
  display:flex;align-items:center;gap:10px;
  padding:9px 12px;
  border-radius:var(--radius-md);
  color:var(--text-secondary);
  font-size:13.5px;
  border-left:3px solid transparent;
  transition:all .15s ease;
  cursor:pointer;
  user-select:none;
}
.sb-link:hover{background:var(--bg-card);color:var(--text-primary)}
.sb-link.active{
  background:var(--gold-soft);
  color:var(--gold-light);
  border-left-color:var(--gold);
  font-weight:600;
}
.sb-num{
  display:inline-flex;align-items:center;justify-content:center;
  width:24px;height:24px;flex-shrink:0;
  background:var(--bg-card);
  color:var(--text-tertiary);
  border-radius:50%;
  font-size:11px;font-weight:600;
}
.sb-link.active .sb-num{background:var(--gold);color:var(--navy-900)}
.sb-text{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.sb-progress{
  margin:24px 12px 0;padding:14px 14px;
  background:var(--bg-card);
  border-radius:var(--radius-md);
  border:1px solid var(--border-soft);
}
.sb-progress-label{
  font-size:11px;color:var(--text-tertiary);
  text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;
}
.sb-progress-num{
  font-size:18px;font-weight:700;color:var(--gold-light);
}
.sb-progress-num small{color:var(--text-tertiary);font-weight:400;font-size:13px}
.sb-progress-bar{
  margin-top:10px;height:4px;background:var(--border-soft);
  border-radius:2px;overflow:hidden;
}
.sb-progress-fill{
  height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-light));
  width:0%;transition:width .3s ease;border-radius:2px;
}

/* ====== MAIN CONTENT ====== */
.main{padding:30px 36px 80px;min-width:0}

/* 모바일 목차 토글 (모바일에서만 보임) */
.m-toc{
  display:none;
  position:sticky;top:var(--header-h);z-index:50;
  margin:0 -18px 20px;
  background:rgba(10,24,48,.95);
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--border-soft);
}
.m-toc-btn{
  width:100%;
  display:flex;align-items:center;justify-content:space-between;
  padding:13px 18px;
  font-size:14px;font-weight:600;color:var(--text-primary);
}
.m-toc-btn .label{display:flex;align-items:center;gap:8px}
.m-toc-btn .badge{
  display:inline-flex;align-items:center;justify-content:center;
  width:22px;height:22px;background:var(--gold);color:var(--navy-900);
  border-radius:50%;font-size:11px;font-weight:700;
}
.m-toc-btn .arrow{
  width:20px;height:20px;
  border:1.5px solid var(--text-secondary);border-top:0;border-left:0;
  transform:rotate(45deg);transition:transform .2s ease;
  margin-bottom:6px;
}
.m-toc.open .m-toc-btn .arrow{transform:rotate(225deg);margin-top:6px;margin-bottom:0}
.m-toc-list{
  display:none;
  max-height:60vh;overflow-y:auto;
  padding:6px 12px 14px;
  border-top:1px solid var(--border-soft);
}
.m-toc.open .m-toc-list{display:block}
.m-toc-list .sb-link{padding:11px 12px;font-size:14px}

/* ====== SECTION CARD ====== */
.sec{
  margin:0 0 28px;
  background:var(--bg-card);
  border:1px solid var(--border-soft);
  border-radius:var(--radius-lg);
  scroll-margin-top:100px;
  overflow:hidden;
  transition:border-color .2s ease;
}
.sec.in-view{border-color:var(--gold-border)}

.sec-head{
  display:flex;align-items:flex-start;gap:14px;
  padding:22px 26px 0;
  flex-wrap:wrap;
}
.sec-head-text{flex:1;min-width:0}
.sec-num{
  font-size:11px;font-weight:700;letter-spacing:2px;
  color:var(--gold);text-transform:uppercase;
  margin-bottom:4px;
}
.sec-title{
  margin:0;font-size:22px;font-weight:700;
  color:var(--text-primary);line-height:1.3;
  letter-spacing:-.3px;
}

/* ====== TTS PLAYER ====== */
.player{
  display:inline-flex;align-items:center;gap:10px;
  padding:6px 14px 6px 6px;
  background:var(--gold-soft);
  border:1px solid var(--gold-border);
  border-radius:999px;
  flex-shrink:0;
  transition:all .2s ease;
}
.player:hover{background:rgba(201,169,110,.18)}
.player-btn{
  width:34px;height:34px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  background:var(--gold);
  color:var(--navy-900);
  border-radius:50%;
  font-size:14px;
  transition:all .15s ease;
}
.player-btn:hover{background:var(--gold-light);transform:scale(1.05)}
.player-btn:active{transform:scale(.95)}
.player-btn .icon-play,.player-btn .icon-pause{display:block}
.player-btn .icon-pause{display:none}
.player.playing .icon-play{display:none}
.player.playing .icon-pause{display:block}
.player-info{
  display:flex;flex-direction:column;align-items:flex-start;
  font-size:11px;line-height:1.3;color:var(--gold-light);
  user-select:none;
}
.player-info .lbl{font-weight:700;letter-spacing:.5px}
.player-info .time{font-variant-numeric:tabular-nums;opacity:.85}

.sec-body{padding:18px 26px 28px;color:var(--text-primary)}
.sec-body :first-child{margin-top:14px}
.sec-body .lead{
  font-size:17px;line-height:1.7;
  color:var(--text-primary);font-weight:500;
  margin:0 0 18px;letter-spacing:-.2px;
}
.sec-body p{margin:0 0 14px;color:var(--text-primary)}
.sec-body h3{
  margin:28px 0 12px;font-size:17px;font-weight:700;
  color:var(--gold-light);letter-spacing:-.2px;
}
.sec-body strong{color:var(--text-primary);font-weight:700}
.sec-body em{color:var(--gold-light);font-style:normal}

/* === bodyHtml 내부 클래스 스타일 === */
.sec-body .callout{
  margin:18px 0;padding:14px 18px;
  background:var(--bg-card-hover);
  border:1px solid var(--border-soft);
  border-left:3px solid var(--gold);
  border-radius:var(--radius-md);
}
.sec-body .callout-gold{
  background:rgba(201,169,110,.07);
  border-color:var(--gold-border);
  border-left:3px solid var(--gold);
}
.sec-body .callout-summary{
  background:linear-gradient(135deg,rgba(201,169,110,.1),rgba(201,169,110,.04));
  border:1px solid var(--gold-border);
  border-left:3px solid var(--gold-light);
  margin-top:24px;
}
.sec-body .callout-label{
  font-size:11px;font-weight:700;letter-spacing:1.5px;
  color:var(--gold);text-transform:uppercase;
  margin-bottom:6px;
}
.sec-body .callout p{margin:0;color:var(--text-primary)}
.sec-body .callout p+p{margin-top:8px}
.sec-body .callout ul{margin:0;padding:0;list-style:none}

.sec-body .check-list{
  list-style:none;padding:0;margin:0 0 14px;
}
.sec-body .check-list li{
  position:relative;
  padding:6px 0 6px 26px;
  border-bottom:1px dashed var(--border-soft);
  color:var(--text-primary);
}
.sec-body .check-list li:last-child{border-bottom:none}
.sec-body .check-list li::before{
  content:"";position:absolute;left:4px;top:13px;
  width:7px;height:11px;
  border:solid var(--gold);border-width:0 2px 2px 0;
  transform:rotate(45deg);
}
.sec-body .callout .check-list li{padding-left:22px}
.sec-body .callout .check-list li::before{left:2px}

.sec-body .step-list{margin:14px 0}
.sec-body .step{
  display:flex;align-items:flex-start;gap:14px;
  padding:12px 0;
  border-bottom:1px solid var(--border-soft);
}
.sec-body .step:last-child{border-bottom:none}
.sec-body .step-num{
  flex-shrink:0;width:32px;height:32px;
  display:flex;align-items:center;justify-content:center;
  background:var(--gold-soft);
  color:var(--gold-light);
  border-radius:50%;
  font-size:14px;font-weight:700;
  border:1px solid var(--gold-border);
}
.sec-body .step-body{flex:1;min-width:0}
.sec-body .step-body strong{display:block;color:var(--gold-light);margin-bottom:3px;font-size:15px}
.sec-body .step-body p{margin:0;color:var(--text-secondary);font-size:14.5px}

.sec-body .two-col{
  display:grid;grid-template-columns:1fr 1fr;gap:12px;
  margin:14px 0;
}
.sec-body .col-card{
  padding:14px 16px;
  background:var(--bg-card-hover);
  border:1px solid var(--border-soft);
  border-radius:var(--radius-md);
}
.sec-body .col-tag{
  display:inline-block;
  padding:3px 10px;border-radius:999px;
  font-size:11px;font-weight:700;letter-spacing:.5px;
  margin-bottom:6px;text-transform:uppercase;
}
.sec-body .tag-personal{background:rgba(120,180,255,.15);color:#9ec5ff;border:1px solid rgba(120,180,255,.3)}
.sec-body .tag-corp{background:rgba(255,180,120,.15);color:#ffc89e;border:1px solid rgba(255,180,120,.3)}
.sec-body .col-card p{margin:0;font-size:13.5px;color:var(--text-secondary)}

.sec-body .quote-box{
  margin:14px 0;padding:14px 18px;
  background:var(--bg-card-hover);
  border-left:3px solid var(--gold);
  border-radius:var(--radius-sm);
}
.sec-body .quote-box p{margin:0;color:var(--text-primary);font-size:14.5px}
.sec-body .quote-box p+p{margin-top:4px}

/* ====== LOADING / EMPTY ====== */
.loading{
  text-align:center;padding:80px 20px;
  color:var(--text-secondary);
}
.loading-spinner{
  display:inline-block;width:40px;height:40px;
  border:3px solid var(--border-soft);
  border-top-color:var(--gold);
  border-radius:50%;
  animation:spin .8s linear infinite;
  margin-bottom:14px;
}
@keyframes spin{to{transform:rotate(360deg)}}
.error-box{
  margin:20px 0;padding:20px;text-align:center;
  background:rgba(255,80,80,.1);
  border:1px solid rgba(255,80,80,.3);
  border-radius:var(--radius-md);color:#ffb8b8;
}

/* ====== FOOTER ====== */
.gf{
  margin-top:60px;padding:32px 18px;
  text-align:center;
  border-top:1px solid var(--border-soft);
  color:var(--text-tertiary);font-size:12.5px;
}
.gf a{color:var(--gold-light)}
.gf-row{margin-top:8px;font-size:11.5px}

/* ====== RESPONSIVE ====== */
@media (max-width:960px){
  :root{--side-w:0px;--hero-h-d:var(--hero-h-m)}
  .shell{grid-template-columns:1fr}
  .sb{display:none}
  .m-toc{display:block}
  .main{padding:0 18px 60px}
  .hero{padding:32px 18px 28px;min-height:auto}
  .hero h1{font-size:24px}
  .hero p{font-size:14px}
  .hero-eyebrow{font-size:10px;padding:4px 12px;margin-bottom:10px}
  .gh-inner{padding:0 14px}
  .gh-logo{font-size:16px}
  .gh-back{padding:6px 12px;font-size:12px}
  .sec{margin-bottom:18px;border-radius:var(--radius-md)}
  .sec-head{padding:18px 18px 0;gap:10px}
  .sec-title{font-size:18px}
  .sec-num{font-size:10px}
  .sec-body{padding:14px 18px 22px;font-size:15px}
  .sec-body .lead{font-size:15.5px}
  .sec-body h3{font-size:16px;margin-top:22px}
  .sec-body .two-col{grid-template-columns:1fr}
  .sec-body .step-num{width:28px;height:28px;font-size:13px}
  .sec-body .callout{padding:12px 14px;margin:14px 0}
  .player{padding:5px 12px 5px 5px;gap:8px}
  .player-btn{width:30px;height:30px;font-size:12px}
  .player-info{font-size:10px}
  .player-info .time{display:block}
}
@media (max-width:480px){
  body{font-size:15px}
  .hero h1{font-size:21px;letter-spacing:-.3px}
  .hero p{font-size:13.5px}
  .sec-head{flex-direction:column;align-items:stretch}
  .sec-head .player{align-self:flex-start;margin-top:6px}
  .sec-title{font-size:17px;line-height:1.35}
  .sec-body{padding:12px 16px 20px}
  .sec-body .step{gap:10px;padding:10px 0}
  .sec-body .check-list li{font-size:14px;padding:5px 0 5px 22px}
  .sec-body .check-list li::before{top:10px}
  .gh-back .lbl{display:none}
}

/* ====== A11Y ====== */
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
:focus-visible{outline:2px solid var(--gold-light);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>

<!-- ============ HEADER ============ -->
<header class="gh">
  <div class="gh-inner">
    <a href="/" class="gh-logo" aria-label="자비아 메인으로">
      <span class="dot" aria-hidden="true"></span>
      <span>JARVIA</span>
    </a>
    <a href="/" class="gh-back" aria-label="메인 사이트로 돌아가기">
      <span aria-hidden="true">←</span>
      <span class="lbl">메인으로</span>
    </a>
  </div>
</header>

<!-- ============ HERO ============ -->
<section class="hero" aria-labelledby="hero-title">
  <span class="hero-eyebrow">JARVIA USER GUIDE</span>
  <h1 id="hero-title">자비아 <span class="accent">상세 이용가이드</span></h1>
  <p>매일 아침 시장 브리핑부터 16가지 재무계산기, 예규·판례 통합검색까지<br>법인영업·절세·법인컨설팅에 필요한 모든 도구를 한곳에서</p>
</section>

<!-- ============ MAIN SHELL ============ -->
<div class="shell">

  <!-- 데스크탑 사이드바 -->
  <aside class="sb" aria-label="목차">
    <p class="sb-title">CONTENTS</p>
    <ul class="sb-list" id="sbList"></ul>
    <div class="sb-progress" aria-live="polite">
      <div class="sb-progress-label">진행률</div>
      <div class="sb-progress-num">
        <span id="sbProgNum">0</span><small> / <span id="sbProgTotal">11</span></small>
      </div>
      <div class="sb-progress-bar"><div class="sb-progress-fill" id="sbProgFill"></div></div>
    </div>
  </aside>

  <!-- 메인 콘텐츠 영역 -->
  <main class="main">

    <!-- 모바일 목차 토글 -->
    <div class="m-toc" id="mToc">
      <button type="button" class="m-toc-btn" id="mTocBtn" aria-expanded="false" aria-controls="mTocList">
        <span class="label">
          <span class="badge" id="mTocBadge">1</span>
          <span id="mTocLabel">목차 보기</span>
        </span>
        <span class="arrow" aria-hidden="true"></span>
      </button>
      <ul class="m-toc-list sb-list" id="mTocList"></ul>
    </div>

    <!-- 섹션 컨테이너 -->
    <div id="sections">
      <div class="loading" role="status">
        <div class="loading-spinner" aria-hidden="true"></div>
        <p>가이드를 불러오는 중입니다…</p>
      </div>
    </div>

  </main>
</div>

<footer class="gf">
  <div>© 한국에프피센터 · JARVIA — 재무컨설턴트를 위한 자료실</div>
  <div class="gf-row">
    <a href="/">jarvia.co.kr</a>
    · 문의: 헤더의 <a href="/#partner">제휴 제안</a> 메뉴
  </div>
</footer>

<!-- ============ FIREBASE / APP LOGIC ============ -->
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import {getFirestore,collection,query,orderBy,getDocs} from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const FC={apiKey:"AIzaSyBD9p-bf162RiiD1Y3BsY-NvbYjpOSrzmg",authDomain:"jarvia-platform.firebaseapp.com",projectId:"jarvia-platform",storageBucket:"jarvia-platform.firebasestorage.app",messagingSenderId:"388025068900",appId:"1:388025068900:web:09ba8e12e9e9e2ec49de71"};
const app=initializeApp(FC);
const db=getFirestore(app,'javia-db');

// ===== 유틸 =====
const $=s=>document.querySelector(s);
const $$=s=>document.querySelectorAll(s);
const fmtTime=sec=>{
  if(!sec||isNaN(sec))return '--:--';
  const m=Math.floor(sec/60), s=Math.floor(sec%60);
  return `${m}:${String(s).padStart(2,'0')}`;
};
const escapeHtml=str=>String(str||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ===== 섹션 데이터 로드 =====
async function loadSections(){
  try{
    const q=query(collection(db,'guide_sections'),orderBy('order','asc'));
    const snap=await getDocs(q);
    const sections=[];
    snap.forEach(doc=>sections.push({id:doc.id,...doc.data()}));
    if(sections.length===0)throw new Error('가이드 섹션이 없습니다.');
    renderAll(sections);
  }catch(err){
    console.error('[Guide] 로드 실패:',err);
    $('#sections').innerHTML=`
      <div class="error-box">
        <strong>가이드를 불러올 수 없습니다.</strong>
        <p style="margin:8px 0 0;font-size:13px">잠시 후 다시 시도해주세요.<br>문제가 계속되면 메인 사이트의 제휴 제안 메뉴로 알려주세요.</p>
      </div>`;
  }
}

// ===== 렌더링 =====
function renderAll(sections){
  renderSidebar(sections);
  renderSections(sections);
  $('#sbProgTotal').textContent=sections.length;
  setupScrollSpy();
  setupMobileToc();
  setupPlayers();
}

function renderSidebar(sections){
  const html=sections.map((s,i)=>`
    <li class="sb-item">
      <a class="sb-link" href="#${escapeHtml(s.id)}" data-target="${escapeHtml(s.id)}">
        <span class="sb-num">${i+1}</span>
        <span class="sb-text">${escapeHtml(stripPrefix(s.title))}</span>
      </a>
    </li>
  `).join('');
  $('#sbList').innerHTML=html;
  $('#mTocList').innerHTML=html;
}

function renderSections(sections){
  const html=sections.map((s,i)=>`
    <article class="sec" id="${escapeHtml(s.id)}" data-idx="${i}">
      <header class="sec-head">
        <div class="sec-head-text">
          <div class="sec-num">SECTION ${String(i+1).padStart(2,'0')}</div>
          <h2 class="sec-title">${escapeHtml(stripPrefix(s.title))}</h2>
        </div>
        ${renderPlayer(s)}
      </header>
      <div class="sec-body">${s.bodyHtml||''}</div>
    </article>
  `).join('');
  $('#sections').innerHTML=html;
}

function renderPlayer(s){
  if(!s.audioUrl)return '';
  return `
    <div class="player" data-audio="${escapeHtml(s.audioUrl)}" data-duration="${s.duration||0}">
      <button type="button" class="player-btn" aria-label="음성 재생">
        <span class="icon-play" aria-hidden="true">▶</span>
        <span class="icon-pause" aria-hidden="true">❚❚</span>
      </button>
      <div class="player-info">
        <span class="lbl">음성 듣기</span>
        <span class="time">${fmtTime(s.duration)}</span>
      </div>
    </div>
  `;
}

function stripPrefix(title){
  // "01. 자비아 개요" → "자비아 개요"
  return String(title||'').replace(/^\d{1,2}\.\s*/,'');
}

// ===== TTS 플레이어 (한 번에 하나만 재생) =====
let currentAudio=null, currentBtn=null, currentTimer=null;

function setupPlayers(){
  $$('.player').forEach(p=>{
    const btn=p.querySelector('.player-btn');
    const url=p.dataset.audio;
    const dur=parseInt(p.dataset.duration,10)||0;
    const timeEl=p.querySelector('.time');

    btn.addEventListener('click',()=>{
      // 현재 재생 중이면 정지
      if(currentBtn===btn && currentAudio && !currentAudio.paused){
        currentAudio.pause();
        return;
      }
      // 다른 플레이어에서 재생 중이었으면 정지
      if(currentAudio){
        currentAudio.pause();
        if(currentBtn){
          currentBtn.closest('.player').classList.remove('playing');
          const oldTime=currentBtn.closest('.player').querySelector('.time');
          const oldDur=parseInt(currentBtn.closest('.player').dataset.duration,10)||0;
          if(oldTime)oldTime.textContent=fmtTime(oldDur);
        }
      }
      // 새 오디오 시작
      const a=new Audio(url);
      a.preload='auto';
      currentAudio=a;currentBtn=btn;
      p.classList.add('playing');

      a.addEventListener('loadedmetadata',()=>{
        if(timeEl && a.duration && !isNaN(a.duration)){
          // 실제 길이로 갱신
          p.dataset.duration=Math.round(a.duration);
        }
      });
      a.addEventListener('timeupdate',()=>{
        if(timeEl){
          const remaining=Math.max(0,(a.duration||dur)-a.currentTime);
          timeEl.textContent=fmtTime(remaining);
        }
      });
      a.addEventListener('ended',()=>{
        p.classList.remove('playing');
        if(timeEl)timeEl.textContent=fmtTime(a.duration||dur);
        if(currentAudio===a){currentAudio=null;currentBtn=null}
      });
      a.addEventListener('pause',()=>{
        p.classList.remove('playing');
      });
      a.addEventListener('play',()=>{
        p.classList.add('playing');
      });
      a.addEventListener('error',()=>{
        p.classList.remove('playing');
        if(timeEl)timeEl.textContent='오류';
        console.error('[Audio] 재생 실패:',url);
      });
      a.play().catch(err=>{
        console.error('[Audio] play() 실패:',err);
        p.classList.remove('playing');
      });
    });
  });
}

// ===== 스크롤 스파이 (활성 섹션 추적) =====
function setupScrollSpy(){
  const sections=$$('.sec');
  const sbLinks=$$('#sbList .sb-link');
  const mTocLinks=$$('#mTocList .sb-link');
  const total=sections.length;
  let activeIdx=0;

  const setActive=(idx)=>{
    if(idx===activeIdx)return;
    activeIdx=idx;
    sbLinks.forEach((l,i)=>l.classList.toggle('active',i===idx));
    mTocLinks.forEach((l,i)=>l.classList.toggle('active',i===idx));
    sections.forEach((sec,i)=>sec.classList.toggle('in-view',i===idx));

    // 진행률 업데이트
    const num=idx+1;
    $('#sbProgNum').textContent=num;
    $('#sbProgFill').style.width=`${(num/total)*100}%`;

    // 모바일 목차 라벨 업데이트
    const activeLink=sbLinks[idx];
    if(activeLink){
      const activeText=activeLink.querySelector('.sb-text')?.textContent || '목차 보기';
      $('#mTocLabel').textContent=activeText;
      $('#mTocBadge').textContent=num;
    }

    // 데스크탑 사이드바 활성 항목이 보이도록 스크롤
    const sb=$('.sb');
    if(sb && sbLinks[idx]){
      const link=sbLinks[idx];
      const sbRect=sb.getBoundingClientRect();
      const linkRect=link.getBoundingClientRect();
      if(linkRect.top<sbRect.top+20 || linkRect.bottom>sbRect.bottom-20){
        link.scrollIntoView({behavior:'smooth',block:'nearest'});
      }
    }
  };

  // IntersectionObserver로 현재 보이는 섹션 추적
  const obs=new IntersectionObserver(entries=>{
    // 화면에 가장 많이 보이는 섹션을 찾음
    let best=null,bestRatio=0;
    entries.forEach(e=>{
      if(e.isIntersecting && e.intersectionRatio>bestRatio){
        best=e.target;bestRatio=e.intersectionRatio;
      }
    });
    if(best){
      const idx=parseInt(best.dataset.idx,10);
      if(!isNaN(idx))setActive(idx);
    }
  },{rootMargin:'-20% 0px -60% 0px',threshold:[0,.25,.5,.75,1]});

  sections.forEach(s=>obs.observe(s));

  // 사이드바 링크 클릭 시 부드러운 스크롤
  [...sbLinks,...mTocLinks].forEach(link=>{
    link.addEventListener('click',e=>{
      e.preventDefault();
      const target=link.dataset.target;
      const el=document.getElementById(target);
      if(el){
        el.scrollIntoView({behavior:'smooth',block:'start'});
        // 모바일이면 목차 닫기
        $('#mToc').classList.remove('open');
        $('#mTocBtn').setAttribute('aria-expanded','false');
      }
    });
  });

  // 첫 섹션 활성화
  setActive(0);
}

// ===== 모바일 목차 토글 =====
function setupMobileToc(){
  const toc=$('#mToc');
  const btn=$('#mTocBtn');
  btn.addEventListener('click',()=>{
    const open=toc.classList.toggle('open');
    btn.setAttribute('aria-expanded',open?'true':'false');
  });
  // 외부 클릭 시 닫기 (모바일에서)
  document.addEventListener('click',e=>{
    if(!toc.contains(e.target) && toc.classList.contains('open')){
      toc.classList.remove('open');
      btn.setAttribute('aria-expanded','false');
    }
  });
}

// ===== 시작 =====
loadSections();
</script>

</body>
</html>
