<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>세무예규·판례 영업주제 · 주제 등록 (관리자)</title>
<!--
  관리자 전용 임시 도구 (2026-11-26) — 주제 JSON 파일({ "topic": {...} })을 골라 서버(ttAdminPut)에 등록한다.
  · admin.html 에 관리자로 로그인한 같은 브라우저에서 연다 (로그인 정보 공유)
  · 2단계 관리자 메뉴(편성·생성·검수·업로드)가 들어가면 이 파일은 지운다
-->
<style>
body { font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; background: #eef1f6; color: #1f2937; margin: 0; padding: 24px 16px; line-height: 1.6; }
.box { max-width: 640px; margin: 0 auto; background: #fff; border-radius: 14px; padding: 22px; box-shadow: 0 4px 16px rgba(15,42,74,.08); }
h1 { font-size: 19px; color: #0f2a4a; margin: 0 0 6px; }
p { font-size: 14px; color: #4b5563; margin: 0 0 14px; }
input[type=file] { font-size: 15px; width: 100%; }
button { margin-top: 14px; min-height: 46px; padding: 0 20px; border: 0; border-radius: 12px; background: #f5a623; color: #0f2a4a; font-weight: 800; font-size: 15px; cursor: pointer; }
pre { margin-top: 14px; background: #0b1f38; color: #e2e8f0; border-radius: 10px; padding: 12px; font-size: 13px; white-space: pre-wrap; word-break: break-all; min-height: 40px; }
</style>
</head>
<body>
<div class="box">
  <h1>주제 등록 (관리자)</h1>
  <p>주제 JSON 파일을 고른 뒤 「등록」을 누르세요. 관리자 화면(admin.html)에 로그인한 브라우저에서만 됩니다. 고객 화면 내용에 회사·플랫폼 이름이 있거나 형식이 틀리면 서버가 거절합니다.</p>
  <input type="file" id="f" accept="application/json,.json">
  <button type="button" id="go">등록</button>
  <pre id="out">대기 중</pre>
</div>
<script type="module">
const FBJS = 'https://www.gstatic.com/firebasejs/10.12.0/';
const FB_CFG = { apiKey: 'AIzaSyBD9p-bf162RiiD1Y3BsY-NvbYjpOSrzmg', authDomain: 'jarvia-platform.firebaseapp.com', projectId: 'jarvia-platform', storageBucket: 'jarvia-platform.firebasestorage.app', messagingSenderId: '388025068900', appId: '1:388025068900:web:09ba8e12e9e9e2ec49de71' };
const out = document.getElementById('out');
const { initializeApp, getApps, getApp } = await import(FBJS + 'firebase-app.js');
const { getAuth, onAuthStateChanged } = await import(FBJS + 'firebase-auth.js');
const app = getApps().length ? getApp() : initializeApp(FB_CFG);
const user = await new Promise((res) => { const un = onAuthStateChanged(getAuth(app), (u) => { un(); res(u); }); });
out.textContent = user && /@javia-admin\.internal$/i.test(user.email || '') ? '관리자 로그인 확인: ' + user.email : '관리자로 로그인되어 있지 않습니다. admin.html 에서 먼저 로그인하세요.';
document.getElementById('go').onclick = async () => {
  const file = document.getElementById('f').files[0];
  if (!file) { out.textContent = '파일을 먼저 고르세요.'; return; }
  if (!user) { out.textContent = '관리자 로그인이 필요합니다.'; return; }
  try {
    const j = JSON.parse(await file.text());
    const topic = j.topic || j;
    out.textContent = '등록 중… ' + (topic.tid || '');
    const tk = await user.getIdToken();
    const r = await fetch('https://asia-northeast3-jarvia-platform.cloudfunctions.net/ttAdminPut', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + tk }, body: JSON.stringify({ data: { topic } }) });
    const x = await r.json();
    out.textContent = x.error ? '실패: ' + x.error.message : '완료: ' + JSON.stringify(x.result);
  } catch (e) { out.textContent = '실패: ' + e.message; }
};
</script>
</body>
</html>
