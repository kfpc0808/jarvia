<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>보장진단 결과</title>
<style>
  :root{--gold:#C9A96E;--gold-light:#E3C88E}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    background:linear-gradient(168deg,#0B1426 0%,#0F1B33 45%,#16294E 100%);color:#fff;min-height:100vh;
    -webkit-font-smoothing:antialiased}
  .wrap{max-width:480px;margin:0 auto;padding:22px 20px calc(40px + env(safe-area-inset-bottom));display:flex;flex-direction:column}
  .cap{}
  .head{text-align:center;margin:6px 0 4px}
  .brand{font-size:10.5px;letter-spacing:.22em;color:var(--gold);font-weight:800}
  .who{font-size:13px;color:rgba(255,255,255,.72);margin-top:7px}
  .score{font-family:'Times New Roman',serif;font-size:50px;font-weight:800;color:var(--gold-light);line-height:1.1;margin-top:8px}
  .score small{font-size:16px;font-weight:600}
  .band{font-size:13px;color:rgba(255,255,255,.65);margin-top:2px}
  .hair{height:1px;background:linear-gradient(90deg,transparent,rgba(201,169,110,.5),transparent);margin:16px 0}
  .qzAIType{font-size:21px;font-weight:900;color:var(--gold-light);text-align:center;margin:14px 0 8px;letter-spacing:-.01em}
  .qzAILead{font-size:14px;line-height:1.75;color:rgba(255,255,255,.9);margin:10px 2px 12px}
  .qzAIPeer{font-size:12.5px;color:rgba(255,255,255,.6);margin:8px 2px;text-align:center}
  .qzAILock{font-size:12.5px;color:var(--gold-light);background:rgba(201,169,110,.1);border:1px dashed rgba(201,169,110,.5);border-radius:11px;padding:13px 14px;margin-top:12px;text-align:center;line-height:1.6}
  .qzBlock{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);border-radius:13px;padding:14px 15px;margin-top:10px;font-size:13.5px;line-height:1.7;color:rgba(255,255,255,.86)}
  .qzBlock .bh{font-size:11px;font-weight:800;letter-spacing:.04em;color:var(--gold);margin-bottom:6px}
  .qzBlock.praise{background:rgba(63,107,84,.14);border-color:rgba(99,160,124,.3)}
  .qzBlock.prop{background:rgba(201,169,110,.1);border-color:rgba(201,169,110,.35)}
  .qzAIUl,.qzAIOl{margin:2px 0 0;padding-left:18px}.qzAIUl li,.qzAIOl li{margin:5px 0;line-height:1.65}
  .qzAIScen{margin-top:10px;display:flex;flex-direction:column;gap:8px}
  .qzAIScen .now,.qzAIScen .fix{border-radius:11px;padding:11px 13px;font-size:13px;line-height:1.6}
  .qzAIScen .now{background:rgba(180,80,47,.14);color:#f0c4b4}.qzAIScen .fix{background:rgba(63,107,84,.16);color:#b9dcc6}
  .sect{font-size:11px;font-weight:800;letter-spacing:.06em;color:rgba(255,255,255,.5);margin:22px 2px 2px;text-align:center}
  .goldBtn{display:block;width:100%;background:linear-gradient(135deg,var(--gold),#b08d4f);color:#1a1206;font-weight:800;font-size:15px;border:0;border-radius:13px;padding:15px;margin-top:18px;cursor:pointer;text-align:center;text-decoration:none}
  .ghostBtn{display:block;width:100%;background:rgba(255,255,255,.06);color:rgba(255,255,255,.8);font-weight:600;font-size:13.5px;border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:13px;margin-top:10px;cursor:pointer;text-align:center}
  .load{display:flex;align-items:center;gap:10px;justify-content:center;padding:60px 0;font-size:13px;color:rgba(255,255,255,.6)}
  .spin{width:18px;height:18px;border:2px solid rgba(201,169,110,.3);border-top-color:var(--gold);border-radius:50%;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .err{text-align:center;padding:54px 18px;color:rgba(255,255,255,.7);font-size:14px;line-height:1.7}
</style>
</head>
<body>
<div class="wrap">
  <div id="content"><div class="load"><span class="spin"></span>결과를 불러오는 중…</div></div>
</div>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import{getFirestore,doc,getDoc,setDoc,collection,query,where,limit,getDocs,serverTimestamp}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
const FC={apiKey:"AIzaSyBD9p-bf162RiiD1Y3BsY-NvbYjpOSrzmg",authDomain:"jarvia-platform.firebaseapp.com",projectId:"jarvia-platform",storageBucket:"jarvia-platform.firebasestorage.app",messagingSenderId:"388025068900",appId:"1:388025068900:web:09ba8e12e9e9e2ec49de71"};
const app=initializeApp(FC);
const db=getFirestore(app,'javia-db');
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ul=a=>(a||[]).map(x=>`<li>${esc(x)}</li>`).join('');
const band=s=>s>=80?'튼튼해요':s>=60?'보통이에요':s>=40?'허술해요':'위험해요';
const id=new URLSearchParams(location.search).get('id');
// ── 문의 폼(B): fc.html의 검증된 fc_consultation_requests write를 그대로 복제 ──
const QZ_AGE={'20대':'under_30','30대':'30s','40대':'40s','50대':'50s','60대 이상':'60s'};
const QZ_FIELD={coverage:'insurance',retirement:'retirement'};
const gid=()=>'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
let CUR=null; // 현재 결과 데이터(quiz_logs) 보관 — 문의 제출 시 사용

function ai1Html(x){return `
  ${x.type_line?`<div class="qzAIType">${esc(x.type_line)}</div>`:''}
  ${x.lead?`<div class="qzAILead">${esc(x.lead)}</div>`:''}
  ${(x.strengths&&x.strengths.length)?`<div class="qzBlock praise"><div class="bh">잘하고 계신 점</div><ul class="qzAIUl">${ul(x.strengths)}</ul></div>`:''}
  ${x.peer?`<div class="qzAIPeer">${esc(x.peer)}</div>`:''}
  ${(x.gaps||[]).map(g=>`<div class="qzBlock"><div class="bh">${esc(g.title||'비어 있는 곳')}</div>${esc(g.body||'')}</div>`).join('')}
  ${x.priority_verdict?`<div class="qzBlock prop"><div class="bh">그래서, 무엇부터</div>${esc(x.priority_verdict)}</div>`:''}`;}

function ai2Html(x){return `
  ${x.lead?`<div class="qzAILead">${esc(x.lead)}</div>`:''}
  ${(x.stakes&&x.stakes.length)?`<div class="qzBlock"><div class="bh">1순위가 비면</div><ul class="qzAIUl">${ul(x.stakes)}</ul></div>`:''}
  ${(x.approach&&x.approach.length)?`<div class="qzBlock"><div class="bh">보통 이렇게 접근해요</div><ol class="qzAIOl">${x.approach.map(s=>`<li>${esc(s.text||'')}</li>`).join('')}</ol></div>`:''}
  ${x.scenario?`<div class="qzAIScen"><div class="now">지금 이대로 — ${esc(x.scenario.now||'')}</div><div class="fix">메우고 나면 — ${esc(x.scenario.fixed||'')}</div></div>`:''}
  ${x.handoff?`<div class="qzBlock prop"><div class="bh">여기부터는 사람이</div>${esc(x.handoff)}</div>`:''}`;}

function err(msg){$('content').innerHTML=`<div class="err">${esc(msg)}</div>`;}

// ── 문의 폼 ── 리다이렉트 없이 이 화면에서 바로 문의 접수
function inqBlock(cn){return `<button type="button" class="goldBtn" id="inqBtn">${esc(cn)}에게 상담 문의하기</button><div id="inqBox"></div>`;}
function wireInq(cn){const b=$('inqBtn');if(b)b.onclick=()=>showInq(cn);}
function showInq(cn){
  const box=$('inqBox');if(!box)return;
  const ist='width:100%;padding:11px 12px;border-radius:9px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#fff;font-size:14px;outline:none';
  box.innerHTML=`<div class="qzBlock" style="margin-top:12px;text-align:left">
    <div class="bh" style="margin-bottom:10px">${esc(cn)}에게 문의 남기기</div>
    <div style="margin-bottom:9px"><input id="inqName" maxlength="20" placeholder="이름 (예: 홍길동)" style="${ist}"></div>
    <div style="margin-bottom:9px"><input id="inqPhone" inputmode="tel" maxlength="13" placeholder="휴대폰 (010-0000-0000)" style="${ist}"></div>
    <div style="margin-bottom:9px"><textarea id="inqMsg" maxlength="500" rows="3" style="${ist};resize:vertical">안녕하세요, 진단 결과 점검 부탁드려요.</textarea></div>
    <label style="display:flex;align-items:center;gap:8px;font-size:12.5px;color:rgba(255,255,255,.75);margin-bottom:12px;cursor:pointer"><input type="checkbox" id="inqConsent" style="width:16px;height:16px;flex:none"> 개인정보 수집·이용에 동의합니다 (필수)</label>
    <button type="button" class="goldBtn" id="inqSend" style="margin-top:0">문의 보내기</button>
    <div id="inqMsgBox" style="font-size:12.5px;color:#f0c4b4;margin-top:9px;text-align:center;min-height:1px"></div>
  </div>`;
  const ib=$('inqBtn');if(ib)ib.style.display='none';
  $('inqSend').onclick=()=>submitInq(cn);
}
function inqWarn(m){const b=$('inqMsgBox');if(b)b.textContent=m;}
async function submitInq(cn){
  const r=CUR;if(!r)return;
  const name=($('inqName').value||'').trim();
  const phone=($('inqPhone').value||'').replace(/\D/g,'');
  const msg=($('inqMsg').value||'').trim().slice(0,500);
  if(name.length<1||name.length>20){inqWarn('이름을 1~20자로 입력해주세요');return;}
  if(!/^010\d{8}$/.test(phone)){inqWarn('휴대폰 번호를 정확히 입력해주세요');return;}
  if(!$('inqConsent').checked){inqWarn('필수 동의에 체크해주세요');return;}
  inqWarn('');
  const btn=$('inqSend');btn.disabled=true;btn.textContent='전송 중...';
  try{
    // 컨설턴트 uid 해석 (fc.html과 동일: users where loginId==fcLoginId)
    let fcUid=null;
    try{const us=await getDocs(query(collection(db,'users'),where('loginId','==',r.fcLoginId),limit(1)));if(!us.empty)fcUid=us.docs[0].id;}catch(_e){}
    const reqId=gid();
    await setDoc(doc(db,'fc_consultation_requests',reqId),{
      reqId,fcAuthUid:fcUid,fcLoginId:r.fcLoginId,
      name,phone,email:null,
      ageGroup:(r.quizAnswers&&QZ_AGE[r.quizAnswers.q1])||null,assetGroup:null,
      fields:[QZ_FIELD[r.quizType]||'insurance'],fieldOther:null,
      message:msg||null,
      consentRequired:true,consentMarketing:false,
      status:'new',memo:'',lastResponseAt:null,
      createdAt:serverTimestamp(),updatedAt:serverTimestamp(),
      source:'quiz',quizType:r.quizType,quizScore:Number(r.quizScore)||0,
      quizAnswers:r.quizAnswers||{},quizSignals:r.quizSignals||[],
      quizLogId:id,
      notifiedAt:null,notifyError:null
    });
    $('inqBox').innerHTML=`<div class="qzBlock praise" style="margin-top:12px;text-align:center"><div class="bh" style="color:#b9dcc6">✓ ${esc(cn)}에게 전달되었습니다</div><div style="margin-top:4px">24시간 내 연락드리겠습니다.</div></div>`;
  }catch(e){btn.disabled=false;btn.textContent='문의 보내기';inqWarn('전송에 실패했어요. 잠시 후 다시 시도해 주세요.');}
}

function render(r){
  const cn=r.consultantName||'담당 컨설턴트';
  const sc=Number(r.quizScore)||0;
  const ai1=r.ai1,ai2=r.ai2;
  CUR=r;const hasFc=!!r.fcLoginId;
  if(!ai1){ // 진단문이 아직 없는(또는 미지원) 결과
    $('content').innerHTML=`<div class="cap" id="cap"><div class="head"><div class="brand">PRIVATE REPORT</div><div class="who">${esc(cn)}의 보장진단 결과</div><div class="score">${sc}<small> 점</small></div><div class="band">보장이 ${band(sc)}</div></div></div>
      ${hasFc?inqBlock(cn):''}`;
    wireInq(cn);
    return;
  }
  $('content').innerHTML=`
    <div class="cap" id="cap">
      <div class="head">
        <div class="brand">PRIVATE REPORT</div>
        <div class="who">${esc(cn)}의 보장진단 결과</div>
        <div class="score">${sc}<small> 점</small></div>
        <div class="band">보장이 ${band(sc)}</div>
      </div>
      <div class="hair"></div>
      ${ai1Html(ai1)}
      ${ai2?`<div class="sect">— 상세 가이드 —</div>${ai2Html(ai2)}`:''}
      ${ai1.lock_line&&!ai2?`<div class="qzAILock">🔒 ${esc(ai1.lock_line)}</div>`:''}
    </div>
    ${hasFc?inqBlock(cn):''}
    <button type="button" class="ghostBtn" id="saveBtn">📷 이미지로 저장</button>`;
  wireInq(cn);
  const sb=$('saveBtn');if(sb)sb.onclick=saveImg;
}

async function saveImg(){
  const el=$('cap');if(!el)return;
  if(!window.html2canvas){await new Promise(res=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';s.onload=res;s.onerror=res;document.head.appendChild(s);});}
  if(!window.html2canvas)return;
  try{const cv=await html2canvas(el,{backgroundColor:'#0F1B33',scale:2,useCORS:true});const a=document.createElement('a');a.download='보장진단_결과.png';a.href=cv.toDataURL('image/png');a.click();}catch(_e){}
}

async function load(){
  if(!id){err('결과 주소가 올바르지 않습니다.');return;}
  try{
    const snap=await getDoc(doc(db,'quiz_logs',id));
    if(!snap.exists()){err('결과를 찾을 수 없습니다.\n링크가 만료되었거나 잘못되었을 수 있어요.');return;}
    render(snap.data());
  }catch(_e){err('결과를 불러오지 못했습니다.\n잠시 후 다시 시도해 주세요.');}
}
load();
</script>
</body>
</html>
