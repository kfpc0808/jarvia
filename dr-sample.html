<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>JARVIA Daily Report — 오늘의 리포트</title>
<style>
body{margin:0;display:flex;align-items:center;justify-content:center;min-height:100vh;background:#F7F9FC;font-family:'Noto Sans KR',sans-serif;color:#2C3E50}
.loading{text-align:center}
.spin{width:36px;height:36px;border:3px solid #E1E8EE;border-top-color:#2E86AB;border-radius:50%;animation:s .8s linear infinite;margin:0 auto 16px}
@keyframes s{to{transform:rotate(360deg)}}
p{font-size:14px;color:#7F8C8D}
</style>
</head>
<body>
<div class="loading">
  <div class="spin"></div>
  <p>오늘의 컨설턴트 리포트를 불러오는 중...</p>
</div>
<script>
// 오늘 날짜(KST) 계산 → Storage URL로 리다이렉트
(function(){
  var now = new Date();
  var kst = new Date(now.getTime() + 9 * 60 * 60 * 1000);
  var y = kst.getUTCFullYear();
  var m = String(kst.getUTCMonth() + 1).padStart(2, '0');
  var d = String(kst.getUTCDate()).padStart(2, '0');
  var fileDate = y + m + d;

  // 평일 체크 (주말이면 직전 금요일로)
  var day = kst.getUTCDay(); // 0=일, 6=토
  if (day === 0) { // 일요일 → 금요일 (2일 전)
    kst.setUTCDate(kst.getUTCDate() - 2);
  } else if (day === 6) { // 토요일 → 금요일 (1일 전)
    kst.setUTCDate(kst.getUTCDate() - 1);
  }
  y = kst.getUTCFullYear();
  m = String(kst.getUTCMonth() + 1).padStart(2, '0');
  d = String(kst.getUTCDate()).padStart(2, '0');
  fileDate = y + m + d;

  var url = 'https://storage.googleapis.com/jarvia-platform.firebasestorage.app/daily-reports/' + fileDate + '_daily-report.html';
  window.location.replace(url);
})();
</script>
</body>
</html>
