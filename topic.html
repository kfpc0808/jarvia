<!--
  세무예규·판례 영업주제 — 고객 화면                                   ★ 2026-11-26
  · 주소: https://mypb.kr/topic.html?k=링크번호  (회원이 taxtopic.html 「고객에게 보내기」로 만든 링크)
  · 미리보기: taxtopic.html 에서 ?pv=주제번호&n=고객이름 (자비아 로그인 회원만 · 기록 안 남음 · 신청 안 됨)
  · 서버: functions/taxTopic.js ttOpen · ttRequest · ttPreview — Firebase 를 싣지 않고 fetch 로 onCall 규약 호출 (미리보기만 로그인 토큰)
  · 원칙: 회사·플랫폼 이름을 화면에 쓰지 않는다. 내용은 서버가 형식 검사한 글자만 받아 이스케이프해 그린다 (굵게는 **글자** 만)
  · 카톡 미리보기 제목·그림은 netlify/edge-functions/taxtopic.js 가 링크별로 바꿔 넣는다
-->
<style>
:root { --navy:#0f2a4a; --navy2:#1b3f6b; --amber:#f5a623; --amber-d:#b45309; --line:#e5e7eb; --soft:#f7f9fc; --sb: env(safe-area-inset-bottom); }
* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body { font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; color: #1f2937; font-size: 15.5px; line-height: 1.7; background: #e9edf3; word-break: keep-all; overflow-wrap: anywhere; -webkit-tap-highlight-color: transparent; overflow-x: hidden; }
button, input { font: inherit; }
.doc { max-width: 560px; margin: 16px auto 32px; background: #fff; border-radius: 16px; overflow: hidden; box-shadow: 0 6px 24px rgba(15,42,74,.12); }
.hero { background: linear-gradient(135deg, var(--navy) 0%, var(--navy2) 100%); color: #fff; padding: calc(26px + env(safe-area-inset-top)) 22px 24px; }
.from { font-size: 13.5px; opacity: .9; }
.from b { color: var(--amber); }
h1 { margin-top: 12px; font-size: 25px; font-weight: 900; line-height: 1.4; letter-spacing: -.4px; }
h1 .hl { color: var(--amber); }
.lead { margin-top: 10px; font-size: 15.5px; opacity: .92; }
.lead b { color: #ffd58a; }
.pvbar { background: #fef3c7; color: #7c2d12; font-size: 13px; font-weight: 700; text-align: center; padding: 8px 12px; }
.body { padding: 22px 22px 8px; }
section { margin-top: 26px; }
section:first-child { margin-top: 0; }
h2 { font-size: 17.5px; font-weight: 800; color: var(--navy); margin-bottom: 10px; }
.facts { list-style: none; display: flex; flex-direction: column; gap: 10px; }
.facts li { display: flex; gap: 12px; align-items: flex-start; background: var(--soft); border: 1px solid #dbe3ee; border-radius: 12px; padding: 12px 14px; }
.facts .n { flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--navy); color: #fff; font-weight: 800; font-size: 13px; display: flex; align-items: center; justify-content: center; margin-top: 1px; }
.facts b, .a b, .cs b { color: var(--amber-d); }
.cases { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.cs { border-radius: 12px; padding: 12px 14px; font-size: 14.5px; line-height: 1.6; min-width: 0; }
.cs.lose { background: #fef2f2; border: 1px solid #fecaca; }
.cs.win { background: #ecfdf5; border: 1px solid #a7f3d0; }
.cs .h { font-weight: 800; font-size: 13px; margin-bottom: 4px; }
.cs.lose .h { color: #b91c1c; }
.cs.win .h { color: #047857; }
.cs a { display: inline-block; margin-top: 4px; color: #1d4ed8; font-size: 12.5px; font-weight: 700; text-underline-offset: 3px; }
.cs .ct { display: block; margin-top: 4px; font-size: 12.5px; color: #6b7280; font-weight: 700; }
.swipe { display: none; font-size: 12px; color: #6b7280; margin-top: 6px; }
.faq details { border: 1px solid var(--line); border-radius: 12px; margin-bottom: 8px; background: #fff; }
.faq summary { list-style: none; cursor: pointer; padding: 13px 44px 13px 16px; font-weight: 700; font-size: 15px; color: var(--navy); position: relative; min-height: 48px; display: flex; align-items: center; }
.faq summary::-webkit-details-marker { display: none; }
.faq summary::after { content: "＋"; position: absolute; right: 16px; top: 50%; transform: translateY(-50%); color: #6b7280; }
.faq details[open] summary::after { content: "－"; }
.faq .a { padding: 0 16px 14px; font-size: 14.5px; color: #374151; }
.check { border: 2px solid var(--navy); border-radius: 14px; padding: 6px 14px 14px; }
.check label { display: flex; gap: 12px; align-items: flex-start; padding: 11px 0; border-bottom: 1px dashed var(--line); cursor: pointer; font-size: 15px; min-height: 48px; }
.check label:last-of-type { border-bottom: none; }
.check input { flex: none; width: 22px; height: 22px; margin-top: 2px; accent-color: var(--navy); }
.result { margin-top: 8px; border-radius: 10px; padding: 12px 14px; font-weight: 700; font-size: 15px; background: #f3f4f6; color: #374151; }
.result.warn { background: #fff8ec; color: #7c2d12; }
.cta { margin-top: 26px; background: var(--navy); color: #fff; border-radius: 14px; padding: 20px 18px; text-align: center; }
.cta .q { font-size: 17px; font-weight: 800; line-height: 1.5; white-space: pre-line; }
.who { margin-top: 14px; display: flex; gap: 12px; align-items: center; justify-content: center; text-align: left; }
.who img { width: 46px; height: 46px; border-radius: 50%; object-fit: cover; flex: none; border: 2px solid rgba(255,255,255,.4); }
.who .nm { font-weight: 800; font-size: 15.5px; }
.who .nm b { color: var(--amber); }
.who .og { font-size: 13px; opacity: .85; }
.cta-btns { margin-top: 16px; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.bt { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 50px; padding: 0 22px; border-radius: 12px; font-weight: 800; font-size: 15.5px; text-decoration: none; border: 0; cursor: pointer; }
.bt.req { background: var(--amber); color: var(--navy); }
.bt.call { background: #fff; color: var(--navy); }
.mbar .bt.call { background: var(--navy); color: #fff; }
.note { margin: 22px 0 6px; font-size: 12.5px; color: #6b7280; line-height: 1.6; }
.footer { background: #0b1f38; color: #cbd5e1; font-size: 12.5px; padding: 12px 22px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 6px; }
.mbar { display: none; }
.state { max-width: 560px; margin: 0 auto; padding: 80px 24px; text-align: center; color: #374151; }
.state b { display: block; font-size: 18px; color: var(--navy); margin-bottom: 8px; }
.state .bt { margin-top: 18px; background: var(--navy); color: #fff; }
.done { margin-top: 12px; background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; border-radius: 12px; padding: 12px 14px; font-weight: 700; font-size: 14.5px; text-align: left; }

/* 상담 신청 시트 */
.sheet-bg { position: fixed; inset: 0; z-index: 80; background: rgba(15,23,42,.5); display: none; }
.sheet-bg.on { display: block; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 81; background: #fff; border-radius: 18px 18px 0 0; max-height: 92vh; max-height: 92dvh; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; transform: translateY(105%); transition: transform .25s ease; padding: 8px 18px calc(18px + var(--sb)); max-width: 560px; margin: 0 auto; }
.sheet.on { transform: none; }
.sheet .grab { width: 40px; height: 4px; border-radius: 4px; background: #d1d5db; margin: 4px auto 12px; }
.sheet h3 { font-size: 18px; font-weight: 800; color: var(--navy); }
.sheet .sub { font-size: 13.5px; color: #6b7280; margin-top: 2px; }
.fl { margin-top: 14px; }
.fl > label, .fl > .lb { display: block; font-size: 13.5px; font-weight: 700; color: #374151; margin-bottom: 6px; }
.fl input[type=text], .fl input[type=tel] { width: 100%; font-size: 16px; padding: 12px 14px; min-height: 48px; border: 1px solid #cbd5e1; border-radius: 12px; background: #fff; color: #111827; -webkit-appearance: none; appearance: none; }
.fl input:focus { outline: 2px solid var(--amber); border-color: var(--amber); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips button { min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #cbd5e1; background: #fff; color: #374151; font-size: 14.5px; font-weight: 700; cursor: pointer; }
.chips button.on { background: var(--navy); border-color: var(--navy); color: #fff; }
.agree { margin-top: 16px; background: var(--soft); border: 1px solid #dbe3ee; border-radius: 12px; padding: 12px 14px; font-size: 13px; color: #374151; line-height: 1.6; }
.agree label { display: flex; gap: 10px; align-items: flex-start; font-weight: 800; font-size: 14.5px; color: #111827; cursor: pointer; margin-bottom: 6px; }
.agree input { width: 22px; height: 22px; flex: none; margin-top: 1px; accent-color: var(--navy); }
.agree dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; }
.agree dt { font-weight: 700; color: #6b7280; white-space: nowrap; }
.sheet .acts { margin-top: 16px; display: flex; gap: 8px; }
.sheet .acts .bt { flex: 1; }
.sheet .acts .x { flex: 0 0 auto; background: #f3f4f6; color: #374151; }
.err { margin-top: 10px; color: #b91c1c; font-size: 13.5px; font-weight: 700; min-height: 1em; }
body.lock { overflow: hidden; }
/* 접수 확인창 */
.cf-bg { position: fixed; inset: 0; z-index: 90; background: rgba(15,23,42,.55); display: flex; align-items: center; justify-content: center; padding: 20px; }
.cf { background: #fff; border-radius: 18px; width: 100%; max-width: 380px; padding: 24px 20px 18px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,.25); }
.cf .ic { width: 56px; height: 56px; border-radius: 50%; background: #ecfdf5; color: #047857; font-size: 28px; display: flex; align-items: center; justify-content: center; margin: 0 auto 10px; }
.cf b { display: block; font-size: 18px; color: var(--navy); }
.cf p { margin-top: 8px; font-size: 14.5px; color: #374151; line-height: 1.65; }
.cf small { display: block; margin-top: 8px; font-size: 12.5px; color: #6b7280; }
.cf .bt { margin-top: 16px; width: 100%; background: var(--navy); color: #fff; }

@media (max-width: 600px) {
  .doc { margin: 0; border-radius: 0; box-shadow: none; }
  h1 { font-size: 23px; }
  .body { padding: 20px 16px 6px; }
  .footer { padding: 12px 16px; }
  .cases { display: flex; overflow-x: auto; -webkit-overflow-scrolling: touch; scroll-snap-type: x mandatory; scrollbar-width: none; margin: 0 -16px; padding: 0 16px 4px; gap: 10px; }
  .cases::-webkit-scrollbar { display: none; }
  .cs { flex: 0 0 82%; scroll-snap-align: start; }
  .swipe { display: block; }
  .cta-btns { display: none; }
  body.has-bar { padding-bottom: calc(76px + var(--sb)); }
  .mbar { display: flex; gap: 8px; position: fixed; left: 0; right: 0; bottom: 0; z-index: 60; background: rgba(255,255,255,.97); border-top: 1px solid var(--line); padding: 10px calc(12px + env(safe-area-inset-right)) calc(10px + var(--sb)) calc(12px + env(safe-area-inset-left)); box-shadow: 0 -4px 16px rgba(15,42,74,.08); }
  .mbar .bt { flex: 1; padding: 0 10px; }
}
</style>
</head>
<body>
<div id="app"><div class="state"><b>불러오는 중…</b></div></div>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shT"></div>

<script>
(function () {
  'use strict';
  var FN_URL = 'https://asia-northeast3-jarvia-platform.cloudfunctions.net/';
  var FBJS = 'https://www.gstatic.com/firebasejs/10.12.0/';
  var FB_CFG = { apiKey: 'AIzaSyBD9p-bf162RiiD1Y3BsY-NvbYjpOSrzmg', authDomain: 'jarvia-platform.firebaseapp.com', projectId: 'jarvia-platform', storageBucket: 'jarvia-platform.firebasestorage.app', messagingSenderId: '388025068900', appId: '1:388025068900:web:09ba8e12e9e9e2ec49de71' };
  var HOW = ['전화', '카카오톡', '문자'], WHEN = ['평일 오전', '평일 오후', '평일 저녁', '주말'];
  var q = new URLSearchParams(location.search);
  var K = /^[A-Za-z0-9_-]{20,40}$/.test(q.get('k') || '') ? q.get('k') : '';
  var PV = !K && /^no\d{2,4}$/.test(q.get('pv') || '') && !/(^|\.)mypb\.kr$/.test(location.hostname) ? q.get('pv') : '';   /* 고객 주소(mypb.kr)에서는 미리보기를 켜지 않음 */
  var S = { c: {}, n: '', cust: null, checks: [], sent: false, token: null, req: { how: '전화', when: '' } };
  var app = document.getElementById('app');

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (m) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]; }); }
  function rich(s) { return esc(s).replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>'); }
  function telFmt(p) { p = String(p || '').replace(/\D/g, ''); return p.length === 11 ? p.replace(/(\d{3})(\d{4})(\d{4})/, '$1-$2-$3') : p.length === 10 ? p.replace(/(\d{2,3})(\d{3,4})(\d{4})/, '$1-$2-$3') : p; }
  function josa(w) { var c = w.charCodeAt(w.length - 1); if (c < 0xAC00 || c > 0xD7A3) return w + '이'; return w + ((c - 0xAC00) % 28 ? '이' : '가'); }
  function safeUrl(u) { return /^https:\/\/(www\.)?(law\.go\.kr|taxlaw\.nts\.go\.kr|glaw\.scourt\.go\.kr|scourt\.go\.kr|casenote\.kr)\//.test(String(u || '')) ? String(u) : ''; }

  function callFn(name, data, ka) {
    return (S.token ? S.token() : Promise.resolve(null)).then(function (tk) {
      var hd = { 'Content-Type': 'application/json' }; if (tk) hd.Authorization = 'Bearer ' + tk;
      var op = { method: 'POST', headers: hd, body: JSON.stringify({ data: data || {} }) }; if (ka) op.keepalive = true;
      return fetch(FN_URL + name, op);
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) {
        if (j && j.error) throw new Error(j.error.message || '오류');
        if (!r.ok) throw new Error('서버 응답 ' + r.status);
        return (j && j.result) || {};
      });
    });
  }

  function vState(title, msg, retry) {
    app.innerHTML = '<div class="state"><b>' + esc(title) + '</b><span>' + esc(msg) + '</span>' + (retry ? '<br><button class="bt" id="retry" type="button">다시 열기</button>' : '') + '</div>';
    var r = document.getElementById('retry'); if (r) r.onclick = function () { location.reload(); };
  }

  function render() {
    var c = S.c, cu = S.cust, who = (c.name || '담당') + ' ' + (c.title || '컨설턴트');
    var h1 = (cu.h1 || []).map(function (x, i) { return i ? '<span class="hl">' + esc(x) + '</span>' : esc(x); }).join('<br>');
    var phone = String(c.phone || '').replace(/\D/g, '');
    var hasTel = phone.length >= 9;
    var cases = cu.cases || [];
    var html = '';
    if (PV) html += '<div class="pvbar">미리보기 화면입니다 · 고객에게는 이렇게 보입니다 (신청은 되지 않습니다)</div>';
    html += '<div class="doc"><div class="hero">' +
      '<div class="from">' + (S.n ? '<b>' + esc(S.n) + '님께</b> · ' : '<b>' + esc(cu.kicker || '세무 이슈 안내') + '</b> · ') + esc(josa(who)) + ' 보낸 안내</div>' +
      '<h1>' + h1 + '</h1>' + (cu.lead ? '<div class="lead">' + rich(cu.lead) + '</div>' : '') + '</div><div class="body">';
    if ((cu.facts || []).length) html += '<section><h2>꼭 아셔야 할 ' + cu.facts.length + '가지</h2><ul class="facts">' + cu.facts.map(function (f, i) { return '<li><span class="n">' + (i + 1) + '</span><span>' + rich(f) + '</span></li>'; }).join('') + '</ul></section>';
    if (cases.length) html += '<section><h2>법원·국세청은 이렇게 판단했습니다</h2><div class="cases">' + cases.map(function (x) {
      var u = safeUrl(x.url);
      return '<div class="cs ' + (x.win ? 'win' : 'lose') + '"><div class="h">' + (x.win ? '과세가 취소된 사례' : '과세된 사례') + '</div>' + rich(x.text) +
        (u ? '<br><a href="' + esc(u) + '" target="_blank" rel="noopener">' + esc(x.cite || '원문') + ' 원문 ↗</a>' : (x.cite ? '<span class="ct">' + esc(x.cite) + '</span>' : '')) + '</div>';
    }).join('') + '</div>' + (cases.length > 1 ? '<span class="swipe">옆으로 넘겨 ' + cases.length + '가지 사례를 보세요 →</span>' : '') + '</section>';
    if ((cu.faq || []).length) html += '<section class="faq"><h2>자주 묻는 질문</h2>' + cu.faq.map(function (f) { return '<details><summary>' + esc(f.q) + '</summary><div class="a">' + rich(f.a) + '</div></details>'; }).join('') + '</section>';
    html += '<section><h2>1분 자가 점검</h2><div class="check" id="check">' + (cu.checks || []).map(function (x, i) { return '<label><input type="checkbox" data-i="' + i + '"' + (S.checks.indexOf(i) >= 0 ? ' checked' : '') + '> <span>' + esc(x) + '</span></label>'; }).join('') +
      '<div class="result" id="result"></div></div></section>';
    html += '<div class="cta"><div class="q">' + esc(cu.ctaQ || '해당되는 항목이 있다면, 편하게 문의해 주세요.') + '</div>' +
      '<div class="who">' + (c.photo ? '<img src="' + esc(c.photo) + '" alt="" referrerpolicy="no-referrer" onerror="this.remove()">' : '') + '<div><div class="nm"><b>' + esc(c.name || '담당') + '</b> ' + esc(c.title || '컨설턴트') + '</div>' + ((c.org || hasTel) ? '<div class="og">' + esc([c.org, hasTel ? telFmt(phone) : ''].filter(Boolean).join(' · ')) + '</div>' : '') + '</div></div>' +
      (S.sent ? '<div class="done">상담 신청이 접수되었습니다. 담당자가 곧 연락드립니다.</div>' : '') +
      '<div class="cta-btns"><button class="bt req" type="button" data-act="req">' + (S.sent ? '신청 내용 고치기' : '상담 신청하기') + '</button>' + (hasTel ? '<a class="bt call" href="tel:' + esc(phone) + '">📞 전화하기</a>' : '') + '</div></div>';
    html += cu.note ? '<p class="note">' + rich(cu.note) + '</p>' : '<p class="note">이 안내는 공개된 판례·해석례를 쉽게 정리한 참고 자료이며 세무 자문이 아닙니다. 실제 세액과 정리 방법은 세무 전문가 확인이 필요합니다.</p>';
    html += '</div><div class="footer"><div>세무 정보 안내</div><div>' + esc(c.org || '') + '</div></div></div>';
    html += '<div class="mbar" aria-label="문의하기"><button class="bt req" type="button" data-act="req">' + (S.sent ? '✅ 신청 완료 · 고치기' : '상담 신청하기') + '</button>' + (hasTel ? '<a class="bt call" href="tel:' + esc(phone) + '">📞 전화</a>' : '') + '</div>';
    app.innerHTML = html;
    document.body.classList.add('has-bar');
    document.title = (cu.h1 || []).join(' ') || '세무 점검 안내';
    paintResult();
  }

  function paintResult() {
    var res = document.getElementById('result'); if (!res) return;
    var n = S.checks.length;
    if (!n) { res.textContent = '해당하는 항목을 눌러 보세요.'; res.className = 'result'; }
    else { res.textContent = n + '개 해당 — ' + (S.cust.checkMsg || '점검해 보시길 권합니다.'); res.className = 'result warn'; }
  }

  /* ── 상담 신청 시트 ── */
  var sheet = document.getElementById('sheet'), bg = document.getElementById('sheetBg');
  function openSheet() {
    var c = S.c, tot = (S.cust.checks || []).length;
    sheet.innerHTML = '<div class="grab"></div><h3 id="shT">상담 신청</h3><div class="sub">' + esc((c.name || '담당') + ' ' + (c.title || '컨설턴트')) + '님이 확인 후 연락드립니다.</div>' +
      '<div class="fl"><label for="rqName">성함</label><input id="rqName" type="text" autocomplete="name" maxlength="20" value="' + esc(S.req.name != null ? S.req.name : S.n) + '"></div>' +
      '<div class="fl"><label for="rqTel">휴대폰 번호</label><input id="rqTel" type="tel" inputmode="numeric" autocomplete="tel" maxlength="13" placeholder="010-0000-0000" value="' + esc(S.req.tel || '') + '"></div>' +
      '<div class="fl"><span class="lb">연락 방법</span><div class="chips" data-g="how">' + HOW.map(function (h) { return '<button type="button" data-v="' + esc(h) + '"' + (S.req.how === h ? ' class="on"' : '') + '>' + esc(h) + '</button>'; }).join('') + '</div></div>' +
      '<div class="fl"><span class="lb">편한 시간 (선택)</span><div class="chips" data-g="when">' + WHEN.map(function (h) { return '<button type="button" data-v="' + esc(h) + '"' + (S.req.when === h ? ' class="on"' : '') + '>' + esc(h) + '</button>'; }).join('') + '</div></div>' +
      (tot ? '<div class="fl" style="font-size:13.5px;color:#374151">1분 자가 점검: <b>' + S.checks.length + '/' + tot + '개 해당</b> — 고른 항목이 함께 전달됩니다.</div>' : '') +
      '<div class="agree"><label><input type="checkbox" id="rqAgree"' + (S.req.agree ? ' checked' : '') + '> 연락을 위한 개인정보 수집·이용에 동의합니다 (필수)</label><dl>' +
      '<dt>받는 사람</dt><dd>' + esc((c.name || '담당') + ' ' + (c.title || '컨설턴트') + (c.org ? ' (' + c.org + ')' : '')) + '</dd>' +
      '<dt>목적</dt><dd>상담 연락과 일정 조율</dd><dt>항목</dt><dd>성함, 휴대폰 번호, 연락 방법·시간, 자가 점검에서 고른 항목</dd>' +
      '<dt>보관</dt><dd>휴대폰 번호는 30일 뒤 자동 삭제 · 신청 내용은 1년 또는 동의 철회 시까지</dd></dl>' +
      '<div style="margin-top:6px;color:#6b7280">동의하지 않으셔도 되며, 이 경우 온라인 신청 대신 전화로 문의하실 수 있습니다.</div></div>' +
      '<div class="err" id="rqErr"></div>' +
      '<div class="acts"><button class="bt x" type="button" data-act="close">닫기</button><button class="bt req" type="button" data-act="send" id="rqSend">' + (PV ? '미리보기 — 신청 안 됨' : '신청하기') + '</button></div>';
    bg.classList.add('on'); sheet.classList.add('on'); document.body.classList.add('lock');
  }
  function closeSheet() { saveForm(); sheet.classList.remove('on'); bg.classList.remove('on'); document.body.classList.remove('lock'); }
  function saveForm() {
    var n = document.getElementById('rqName'), t = document.getElementById('rqTel'), a = document.getElementById('rqAgree');
    if (n) S.req.name = n.value; if (t) S.req.tel = t.value; if (a) S.req.agree = a.checked;
  }
  /* 접수 확인창 — 고객에게 따로 알림 문자를 보내지 않으므로 화면에서 분명히 알려 줌 */
  function confirmBox() {
    var c = S.c, who = (c.name || '담당') + ' ' + (c.title || '컨설턴트');
    var how = S.req.how === '카카오톡' ? '카카오톡으로' : S.req.how === '문자' ? '문자로' : '전화로';
    var box = document.createElement('div'); box.className = 'cf-bg';
    box.innerHTML = '<div class="cf" role="alertdialog" aria-modal="true" aria-labelledby="cfT"><div class="ic">✓</div><b id="cfT">상담 신청이 접수되었습니다</b>' +
      '<p>' + esc(who) + '님이 확인 후<br>' + esc((S.req.when ? S.req.when + '에 ' : '') + how) + ' 연락드립니다.</p>' +
      '<small>남겨 주신 휴대폰 번호는 30일 뒤 자동으로 지워집니다.<br>내용을 바꾸려면 「신청 내용 고치기」를 누르세요.</small>' +
      '<button class="bt" type="button" id="cfOk">확인</button></div>';
    document.body.appendChild(box); document.body.classList.add('lock');
    var done = function () { box.remove(); document.body.classList.remove('lock'); var d = document.querySelector('.done'); if (d) d.scrollIntoView({ behavior: 'smooth', block: 'center' }); };
    document.getElementById('cfOk').onclick = done; document.getElementById('cfOk').focus();
    box.addEventListener('click', function (e) { if (e.target === box) done(); });
  }
  function send() {
    saveForm();
    var err = document.getElementById('rqErr'), btn = document.getElementById('rqSend');
    var tel = String(S.req.tel || '').replace(/\D/g, '');
    if (PV) { err.textContent = '미리보기에서는 신청되지 않습니다.'; return; }
    if (!/^010\d{8}$/.test(tel)) { err.textContent = '휴대폰 번호(010으로 시작하는 11자리)를 확인해 주세요.'; document.getElementById('rqTel').focus(); return; }
    if (!S.req.agree) { err.textContent = '개인정보 수집·이용에 동의해 주셔야 온라인으로 신청할 수 있습니다.'; return; }
    err.textContent = ''; btn.disabled = true; btn.textContent = '보내는 중…';
    callFn('ttRequest', { k: K, name: String(S.req.name || '').trim(), tel: tel, how: S.req.how, when: S.req.when, agree: true, checks: S.checks.slice() }, true).then(function () {
      S.sent = true; closeSheet(); render(); confirmBox();
    }, function (e) {
      btn.disabled = false; btn.textContent = '신청하기';
      err.textContent = (e && e.message) || '접수하지 못했습니다. 잠시 뒤 다시 눌러 주세요.';
    });
  }
  document.addEventListener('click', function (e) {
    var a = e.target.closest('[data-act]');
    if (a) {
      var act = a.getAttribute('data-act');
      if (act === 'req') openSheet();
      else if (act === 'close') closeSheet();
      else if (act === 'send') send();
      return;
    }
    var chip = e.target.closest('.chips button');
    if (chip) {
      var g = chip.parentNode.getAttribute('data-g'), v = chip.getAttribute('data-v');
      if (g === 'when' && S.req.when === v) v = '';   /* 시간은 다시 누르면 해제 */
      S.req[g] = v;
      chip.parentNode.querySelectorAll('button').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-v') === S.req[g]); });
    }
  });
  bg.addEventListener('click', closeSheet);
  document.addEventListener('change', function (e) {
    var cb = e.target.closest('#check input'); if (!cb) return;
    var i = Number(cb.getAttribute('data-i')), at = S.checks.indexOf(i);
    if (cb.checked && at < 0) S.checks.push(i); else if (!cb.checked && at >= 0) S.checks.splice(at, 1);
    S.checks.sort(function (x, y) { return x - y; });
    paintResult();
  });
  document.addEventListener('input', function (e) {
    if (e.target && e.target.id === 'rqTel') {   /* 숫자만 · 010-0000-0000 모양으로 */
      var d = e.target.value.replace(/\D/g, '').slice(0, 11);
      e.target.value = d.length > 7 ? d.slice(0, 3) + '-' + d.slice(3, 7) + '-' + d.slice(7) : d.length > 3 ? d.slice(0, 3) + '-' + d.slice(3) : d;
    }
  });

  function boot(r) {
    S.c = r.c || {}; S.n = String(r.n || '').slice(0, 20);
    S.cust = (r.topic && r.topic.cust) || null;
    if (!S.cust) { vState('안내를 열 수 없습니다', '보내 주신 분께 다시 요청해 주세요.'); return; }
    render();
  }

  if (K) {
    callFn('ttOpen', { k: K }).then(boot, function (e) {
      var m = (e && e.message) || '';
      vState('링크를 열 수 없습니다', /찾을 수 없|내려갔/.test(m) ? m : '인터넷 연결을 확인한 뒤 다시 열어 주세요. 계속 열리지 않으면 보내 주신 분께 다시 요청해 주세요.', !/찾을 수 없|내려갔/.test(m));
    });
  } else if (PV) {
    Promise.all([import(FBJS + 'firebase-app.js'), import(FBJS + 'firebase-auth.js')]).then(function (m) {
      var a = m[0].getApps().length ? m[0].getApp() : m[0].initializeApp(FB_CFG), auth = m[1].getAuth(a);
      return new Promise(function (res) { var un = m[1].onAuthStateChanged(auth, function (u) { un(); res(u); }); });
    }).then(function (u) {
      if (!u || u.isAnonymous) { vState('로그인이 필요합니다', '미리보기는 로그인한 회원만 볼 수 있습니다.'); return; }
      S.token = function () { return u.getIdToken(); };
      return callFn('ttPreview', { tid: PV, n: (q.get('n') || '').slice(0, 20) }).then(boot);
    }).catch(function (e) { vState('미리보기를 열 수 없습니다', (e && e.message) || '잠시 뒤 다시 열어 주세요.', true); });
  } else {
    vState('링크를 열 수 없습니다', '받으신 링크 주소가 잘렸을 수 있습니다. 보내 주신 분께 다시 요청해 주세요.');
  }
})();
</script>
</body>
</html>
