<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>공식 통계</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<!-- ═══════════════════════════════════════════════════════════════
     통계 공유 고객 화면 (stat-view.html)  [2026-10-24 신설]
     · 링크: mypb.kr/briefing?t=sx&fc=아이디&sx=공유ID[&c=고객] → ogProxy(카톡 미리보기) → 이 화면 ?s=공유ID&fc=&c=
     · 데이터: stat_shares/{s} — createStatShare(statCornerCards.js)가 보낸 시점 값으로 고정 저장 (문서 1건 읽기만 공개)
     · 출처·기준연도는 항상 표시 (없는 통계는 서버가 공유 자체를 막는다). 컨설턴트용 질문·어프로치 문구는 넣지 않는다
     · 상담 버튼은 문자 하나 (실시간 자료실 signal.html 과 같은 방식) · 열람·문의는 logView(card·call)로 기록
       ★ [2026-10-24] 전화하기 + 문자 문의 두 버튼으로 변경 (둘 다 call 기록)
     · 고객 화면이므로 자비아 표기 없음
     · ★ [2026-10-24] ?pv=1 : 컨설턴트 미리보기(stats.html 공유 창) — 상단 안내 띠, 열람·문의 기록 안 남김
     ═══════════════════════════════════════════════════════════════ -->
<style>
:root{--font:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',-apple-system,sans-serif;--gold:#E8C77E;--gold2:#C9A05C;--sub:#C9D6E6;--lt:#A9B8CC;--ink:#141B2A}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#0F1F38;color:#fff;font-family:var(--font);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
body{overflow-x:hidden;min-height:100vh;background:linear-gradient(180deg,#0F1F38 0%,#15294A 55%,#1E3A66 100%) fixed}
.wrap{max-width:520px;margin:0 auto;padding:22px 16px calc(36px + env(safe-area-inset-bottom))}
.from{text-align:center;font-size:12.5px;color:var(--sub);letter-spacing:.04em}
.kick{display:block;width:max-content;max-width:100%;margin:12px auto 0;font-size:11.5px;font-weight:800;letter-spacing:.22em;color:#0F1F38;background:var(--gold);border-radius:20px;padding:4px 12px}
.tt{text-align:center;font-size:16px;font-weight:800;margin-top:12px;color:var(--gold);word-break:keep-all;line-height:1.45}
.big{text-align:center;font-size:clamp(40px,14vw,64px);font-weight:900;letter-spacing:-.03em;margin-top:8px;line-height:1.1;word-break:keep-all;overflow-wrap:anywhere}
.sen{text-align:center;font-size:16px;font-weight:700;margin:12px 4px 0;line-height:1.65;word-break:keep-all}
.note{text-align:center;font-size:12.5px;color:var(--lt);margin:8px 6px 0;line-height:1.6;word-break:keep-all}
.nat{margin-top:18px;border-top:1px solid rgba(232,199,126,.3);padding-top:14px;font-size:14px;line-height:1.65;color:#E6ECF4;word-break:keep-all}
.nat b{color:var(--gold)}
.hl{list-style:none;margin-top:10px;display:flex;flex-direction:column;gap:6px}
.hl li{position:relative;padding-left:14px;font-size:13.5px;line-height:1.6;color:#D7E0EC;word-break:keep-all}
.hl li:before{content:'';position:absolute;left:2px;top:9px;width:5px;height:5px;border-radius:50%;background:var(--gold)}
.src{margin-top:18px;border:1px solid rgba(232,199,126,.45);border-radius:14px;padding:13px 14px;background:rgba(255,255,255,.04)}
.src h3{font-size:12.5px;font-weight:800;color:var(--gold);letter-spacing:.06em;margin-bottom:6px}
.src .s{font-size:13.5px;line-height:1.65;color:#fff;word-break:keep-all;overflow-wrap:anywhere}
.src .s a{color:var(--gold);font-weight:700;margin-left:6px;white-space:nowrap}
.src .y{font-size:12.5px;color:var(--sub);margin-top:4px}
.src .cd{font-size:12.5px;color:var(--lt);line-height:1.6;margin-top:8px;padding-top:8px;border-top:1px dashed rgba(201,214,230,.25);word-break:keep-all}
.cn{margin-top:18px;background:#fff;color:var(--ink);border-radius:14px;padding:13px;display:flex;gap:11px;align-items:center}
.cn .pf{width:46px;height:46px;border-radius:50%;background:var(--gold2);color:#fff;font-weight:900;font-size:17px;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden}
.cn .pf img{width:100%;height:100%;object-fit:cover}
.cn .w{flex:1;min-width:0}
.cn b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cn span{display:block;font-size:12px;color:#6B7585;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;margin-top:12px;border-radius:12px;padding:14px;font-size:15px;font-weight:800;text-decoration:none;background:var(--gold2);color:#fff;font-family:var(--font);word-break:keep-all;text-align:center}
.bts{display:flex;gap:8px;margin-top:12px}   /* ★ [2026-10-24] 전화·문자 */
.bts .btn{margin-top:0;flex:1;min-width:0;padding:14px 8px}
.btn.tel{background:#fff;color:#0F1F38}
.dis{margin-top:18px;font-size:11.5px;line-height:1.7;color:var(--lt);word-break:keep-all}
.foot{text-align:center;font-size:11px;color:var(--lt);padding:18px 0 4px;line-height:1.7}
.pvb{background:#E8C77E;color:#0F1F38;font-size:12.5px;font-weight:800;border-radius:10px;padding:9px 12px;margin-bottom:14px;text-align:center;line-height:1.5;word-break:keep-all}
.state{text-align:center;padding:90px 16px;color:var(--sub);font-size:14.5px;line-height:1.8}
.state small{font-size:12.5px;color:var(--lt)}
.spin{width:26px;height:26px;border:3px solid rgba(255,255,255,.18);border-top-color:var(--gold);border-radius:50%;margin:0 auto 14px;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">
  <div id="app"><div class="state"><div class="spin"></div>통계를 불러오고 있습니다…</div></div>
  <div id="jvNotice" class="foot" style="display:none">이 페이지는 담당 컨설턴트의 고객 안내 목적에 한해 열람 여부가 기록됩니다.</div>
</div>

<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import{getFirestore,doc,getDoc}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const FC={apiKey:"AIzaSyBD9p-bf162RiiD1Y3BsY-NvbYjpOSrzmg",authDomain:"jarvia-platform.firebaseapp.com",projectId:"jarvia-platform",storageBucket:"jarvia-platform.firebasestorage.app",messagingSenderId:"388025068900",appId:"1:388025068900:web:09ba8e12e9e9e2ec49de71"};
const app=initializeApp(FC);
const db=getFirestore(app,'javia-db');

/* ═══ URL 파라미터 ═══ */
const params=new URLSearchParams(location.search);
const sid=(params.get('s')||'').trim();
let fcId=(params.get('fc')||'').trim();   /* 공유 문서의 회원 아이디가 정본 — 문서를 읽은 뒤 그것으로 맞춘다 */
const PV=params.get('pv')==='1';   /* ★ [2026-10-24] 컨설턴트 미리보기(stats.html) — 열람 기록·고객 구분을 남기지 않는다 */

/* ═══ 고객 식별 토큰(c) — signal.html·client-daily와 동일한 localStorage 맵 방식 ═══ */
let _jvCID='';
function jvClient(){
  if(PV)return;
  try{
    const _cParam=(params.get('c')||'').trim();
    let _cmap={};
    try{_cmap=JSON.parse(localStorage.getItem('jv_cid')||'{}')||{};}catch(_e){_cmap={};}
    if(/^[A-Za-z0-9_-]{1,40}$/.test(_cParam)){_cmap[fcId]=_cParam;localStorage.setItem('jv_cid',JSON.stringify(_cmap));}
    _jvCID=_cmap[fcId]||'';
  }catch(e){_jvCID='';}
}

/* ═══ 열람 비콘 — signal.html 과 같은 엔드포인트 (page 는 서버에서 채널 열람으로 집계) ═══ */
const JV_EP='https://asia-northeast3-jarvia-platform.cloudfunctions.net/logView';
let _jvQ=[],_jvVK=null,_jvNew=false;
try{
  _jvVK=localStorage.getItem('jv_vk');
  if(!_jvVK){_jvVK=Math.random().toString(36).slice(2)+Date.now().toString(36);localStorage.setItem('jv_vk',_jvVK);_jvNew=true;}
}catch(e){_jvVK='na';}
function jvTrack(t,id){if(!fcId||PV)return;_jvQ.push(id?{t:t,id:id}:{t:t});}
function jvFlush(){
  if(!fcId||!_jvQ.length)return;
  const ev=_jvQ.splice(0);
  try{navigator.sendBeacon(JV_EP,new Blob([JSON.stringify({fcLoginId:fcId,viewerKey:_jvVK,isNew:_jvNew,clientId:_jvCID||undefined,page:'stat',events:ev})],{type:'text/plain'}));}catch(e){}
}
window.addEventListener('pagehide',jvFlush);
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden')jvFlush();});

/* ═══ 헬퍼 ═══ */
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sentence=h=>/다$/.test(String(h))?h+'.':h+'입니다.';   /* stats.html 과 같은 규칙 */
const yearTxt=y=>/년|월/.test(String(y))?String(y):String(y)+'년';
const safeUrl=u=>/^https:\/\//i.test(String(u||''))?String(u):'';

function renderError(msg,sub){
  document.getElementById('app').innerHTML='<div class="state">'+esc(msg)+(sub?'<br><small>'+esc(sub)+'</small>':'')+'</div>';
}
function render(x,fc){
  const c=x.card||{},p=x.p||null;
  const fcName=(fc&&fc.name)?String(fc.name):'담당 컨설턴트';
  const fcTitle=(fc&&fc.title)?String(fc.title):'';
  const fcCo=(fc&&fc.company)?String(fc.company):'';
  const initial=fcName.slice(0,1);
  const avatar=(fc&&safeUrl(fc.photoUrl))
    ?'<img src="'+esc(fc.photoUrl)+'" alt="" onerror="this.parentNode.textContent=\''+esc(initial)+'\'">'
    :esc(initial);
  const by=fcName+(fc&&fc.name?' 컨설턴트':'');
  const big=p?p.big:c.bigText;
  const main=p?p.sent:sentence(c.headline||'');
  const srcs=(c.sources||[]).map(s=>'<div class="s">'+esc(s.org)+' 「'+esc(s.name)+'」'+(safeUrl(s.url)?'<a href="'+esc(s.url)+'" target="_blank" rel="noopener">원자료 ↗</a>':'')+'</div>').join('');

  let btn='';
  if(fc&&fc.phone){
    const prefill='안녕하세요, \''+String(c.title||'통계').slice(0,40)+'\' 통계 보고 연락드렸습니다.';
    /* ★ [2026-10-24] 전화 + 문자 두 버튼 (둘 다 상담요청 call 로 기록) */
    const tel=String(fc.phone).replace(/[^0-9+]/g,'');
    btn='<div class="bts"><a class="btn tel" id="telBtn" href="tel:'+esc(tel)+'">📞 전화하기</a>'
      +'<a class="btn" id="askBtn" href="sms:'+esc(fc.phone)+'?body='+encodeURIComponent(prefill)+'">💬 문자 문의</a></div>';
  }

  document.getElementById('app').innerHTML=
    (PV?'<div class="pvb">미리보기 화면이에요 · 고객에게는 이 화면이 보이고, 여기서는 열람 기록이 남지 않아요</div>':'')
    +'<div class="from">'+esc(by)+'가 보내드린 공식 통계</div>'
    +'<span class="kick">OFFICIAL DATA</span>'
    +'<div class="tt">'+esc(c.topic||'')+(p&&p.who?' · '+esc(p.who):'')+'</div>'
    +'<div class="big">'+esc(big)+'</div>'
    +'<div class="sen">'+esc(main)+'</div>'
    +(p&&p.note?'<div class="note">'+esc(p.note)+'</div>':'')
    +(p?'<div class="nat"><b>전국 평균</b> · '+esc(sentence(c.headline||''))+'</div>':'')
    +((c.highlights||[]).length?'<ul class="hl"'+(p?'':' style="margin-top:18px"')+'>'+(c.highlights||[]).map(h=>'<li>'+esc(h)+'</li>').join('')+'</ul>':'')
    +'<div class="src"><h3>출처</h3>'+srcs
      +'<div class="y">'+esc(yearTxt(c.baseYear))+' 기준 공식 통계</div>'
      +(c.condition?'<div class="cd">'+esc(c.condition)+'</div>':'')
    +'</div>'
    +'<div class="cn"><div class="pf">'+avatar+'</div><div class="w"><b>'+esc(fcName)+(fcTitle?' '+esc(fcTitle):'')+'</b><span>'+(fcCo?esc(fcCo)+' · ':'')+'궁금한 점은 편하게 물어보세요</span></div></div>'
    +btn
    +'<div class="dis">통계는 전체 평균을 보여드리는 자료로, 고객님 개인의 상황이나 위험을 뜻하지 않습니다. 본 자료는 정보 제공 목적이며 특정 상품의 가입 권유가 아닙니다.</div>';
  document.title=(c.title||'공식 통계');
  const ab=document.getElementById('askBtn');
  if(ab)ab.addEventListener('click',function(){jvTrack('call','통계·'+String(c.title||'').slice(0,30));jvFlush();});
  const tb=document.getElementById('telBtn');
  if(tb)tb.addEventListener('click',function(){jvTrack('call','통계·'+String(c.title||'').slice(0,30));jvFlush();});
}

/* ═══ 로딩 ═══ */
(async function(){
  if(!/^[0-9a-f]{20}$/.test(sid)){renderError('통계 주소가 올바르지 않습니다','담당 컨설턴트에게 링크를 다시 요청해 주세요.');return;}
  try{
    const xs=await getDoc(doc(db,'stat_shares',sid));
    if(!xs.exists()||xs.data().status!=='active'){renderError('통계를 찾을 수 없습니다','담당 컨설턴트에게 문의해 주세요.');return;}
    const x=xs.data();
    if(x.fcLoginId)fcId=String(x.fcLoginId);
    jvClient();
    try{if(_jvCID)document.getElementById('jvNotice').style.display='block';}catch(e){}
    let fc=null;
    for(const id of [fcId,fcId.toLowerCase()].filter((v,i,a)=>v&&a.indexOf(v)===i)){
      try{const f=await getDoc(doc(db,'consultants',id));if(f.exists()){fc=f.data();break;}}catch(_e){}
    }
    render(x,fc);
    /* 열람 기록 — 서버 집계가 인식하는 card 유형, '통계·제목' 키 (고객활동·열람현황 표시용) */
    try{jvTrack('card','통계·'+String((x.card&&x.card.title)||sid).slice(0,30));jvFlush();}catch(_e){}
  }catch(e){
    console.error(e);
    renderError('통계를 불러오지 못했습니다','네트워크 상태를 확인한 뒤 다시 열어주세요.');
  }
})();
</script>
</body>
</html>
