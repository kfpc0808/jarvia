<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>기업맞춤형 정부지원사업 조회 프로그램 · 안내영상</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@700;900&family=IBM+Plex+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#14213D; --navy2:#1B3A5C; --navy3:#234B74;
  --gold:#C9A96E; --gold2:#B08D52; --goldL:#E8CFA0;
  --paper:#F2F5F8; --ink:#16243A; --mut:#8A99A8;
  --red:#C0392B; --green:#1E8E5A;
  --serif:'Noto Serif KR',serif; --sans:'IBM Plex Sans KR',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--sans);background:radial-gradient(1000px 760px at 70% -10%,rgba(201,169,110,.10),transparent 55%),linear-gradient(160deg,#0D1626 0%,#14213D 70%,#0D1626 100%);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px;overflow:hidden}
.player{width:100%;max-width:780px;display:flex;flex-direction:column;gap:10px}
.head{display:flex;align-items:center;justify-content:space-between;padding:0 4px}
.head .logo{font-family:var(--serif);font-weight:900;letter-spacing:6px;font-size:14px;color:var(--goldL)}
.head .sub{font-size:11px;color:rgba(255,255,255,.55)}
.stage{position:relative;width:100%;aspect-ratio:16/10;background:linear-gradient(170deg,#101B30,#16243E);border:1px solid rgba(201,169,110,.25);border-radius:18px;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.5)}
.scene{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:26px;opacity:0;transition:opacity .5s}
.scene.on{opacity:1}
/* ── 타이포 씬 ── */
.typo{text-align:center;max-width:600px}
.typo .lg{font-family:var(--serif);font-size:clamp(20px,3.6vw,30px);font-weight:900;line-height:1.55;word-break:keep-all}
.typo .lg b{color:var(--goldL)}
.typo .sm{margin-top:14px;font-size:clamp(12px,1.8vw,15px);color:rgba(255,255,255,.66);line-height:1.7;word-break:keep-all}
.typo .logoBig{font-family:var(--serif);font-weight:900;letter-spacing:12px;font-size:clamp(22px,4vw,34px);color:var(--goldL);margin-bottom:22px}
.bignum{font-family:var(--serif);font-size:clamp(40px,8vw,72px);font-weight:900;color:var(--goldL);line-height:1.1}
.newbadge{display:inline-block;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#fff;font-weight:800;font-size:13px;letter-spacing:2px;padding:6px 18px;border-radius:16px;margin-bottom:16px;box-shadow:0 6px 18px rgba(176,141,82,.45)}
.fadeup{animation:fu .8s both}.fadeup2{animation:fu .8s .5s both}.fadeup3{animation:fu .8s 1s both}.fadeup4{animation:fu .8s 1.6s both}
@keyframes fu{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
/* ── 목업 공통 ── */
.mock{width:100%;max-width:640px;background:var(--paper);border-radius:14px;overflow:hidden;color:var(--ink);box-shadow:0 18px 50px rgba(0,0,0,.45);font-size:13px}
.mbar{background:#E6EBF1;padding:8px 12px;display:flex;align-items:center;gap:8px}
.mbar .dot{width:9px;height:9px;border-radius:50%}
.mbar .url{flex:1;background:#fff;border-radius:7px;padding:4px 10px;font-size:10.5px;color:#7A8794}
.mbody{padding:14px 16px;background:var(--paper)}
.spot{position:relative;box-shadow:0 0 0 3px var(--gold),0 0 26px rgba(201,169,110,.65)!important;border-radius:10px;animation:sp 1.3s ease-in-out infinite}
@keyframes sp{0%,100%{box-shadow:0 0 0 3px var(--gold),0 0 18px rgba(201,169,110,.5)}50%{box-shadow:0 0 0 4px var(--gold),0 0 34px rgba(201,169,110,.85)}}
.hand{position:absolute;font-size:26px;filter:drop-shadow(0 3px 6px rgba(0,0,0,.4));animation:tap 1.2s ease-in-out infinite;z-index:5}
@keyframes tap{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(6px) scale(.92)}}
/* biz 헤더 */
.bhd{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.bhd .t{font-weight:800;color:var(--navy2);font-size:15px}
.bhd .meta{font-size:11px;color:#7F8C8D;background:#fff;border:1px solid #E1E8EE;border-radius:8px;padding:5px 10px}
.bhd .home{font-size:11px;background:var(--navy2);color:#fff;border-radius:8px;padding:5px 11px;font-weight:700}
/* 분야 칩 */
.cchips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.cc{font-size:11.5px;padding:6px 13px;border-radius:15px;border:1px solid #D5DEE8;background:#fff;color:#5A6B7B}
.cc.on{background:var(--navy2);color:#fff;border-color:var(--navy2);font-weight:700}
/* 기간 칩 */
.tch{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.tl{font-size:11px;color:#8A99A8;font-weight:700}
.tc2{font-size:11px;padding:4px 10px;border-radius:12px;border:1px solid #D5DEE8;background:#fff;color:#5A6B7B}
.tc2.on{background:var(--navy2);color:#fff;border-color:var(--navy2);font-weight:700}
/* 조건 카드 */
.cond{background:linear-gradient(180deg,#F8FBFF,#EFF5FB);border:1px solid #D8E4F0;border-radius:12px;padding:13px;box-shadow:0 4px 14px rgba(20,45,75,.07)}
.cond .ct{font-weight:800;color:var(--navy2);font-size:13px;margin-bottom:10px}
.fgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.fld label{display:block;font-size:10.5px;color:#7F8C8D;margin-bottom:3px}
.sel{background:#fff;border:1.5px solid #D5DEE8;border-radius:8px;padding:8px 10px;font-size:12.5px;display:flex;justify-content:space-between;align-items:center;color:var(--ink)}
.sel .v{font-weight:600}.sel .a{color:#9AA8B5;font-size:10px}
.gchip{display:inline-flex;align-items:center;gap:4px;background:#E8F6EE;color:var(--green);font-size:10.5px;font-weight:700;border-radius:11px;padding:4px 9px}
.ckrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.ck2{font-size:10.5px;border:1px solid #D5DEE8;border-radius:13px;padding:5px 9px;background:#fff;color:#5A6B7B}
.ck2.on{background:var(--navy2);color:#fff;border-color:var(--navy2);font-weight:700}
/* 숫자줄 */
.nline{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;font-size:13px;color:#8A99A8;margin:10px 0 4px}
.nline s{opacity:.75}.nline .ar{color:#B7C2CC}
.nline .now{font-size:21px;font-weight:800;color:var(--navy2);border-bottom:3px solid var(--gold);padding-bottom:1px}
/* 공고 행 */
.lst{background:#fff;border:1px solid #E1E8EE;border-radius:11px;overflow:hidden}
.r{display:flex;align-items:center;gap:8px;padding:9px 11px;border-bottom:1px solid #EFF3F7;font-size:12px}
.r:last-child{border-bottom:none}
.r .cat{font-size:9.5px;background:#EAF1F8;color:var(--navy2);font-weight:700;border-radius:5px;padding:2px 6px;min-width:30px;text-align:center;flex-shrink:0}
.r .nm2{flex:1;font-weight:600;line-height:1.35;word-break:keep-all;min-width:0}
.r .star{color:var(--gold2);font-weight:800}
.r .nb2{color:var(--red);font-size:9px;font-weight:800;letter-spacing:.5px}
.r .dd2{font-size:10px;font-weight:700;border-radius:9px;padding:3px 7px;flex-shrink:0}
.dd-r{background:#FDECEA;color:var(--red)}.dd-a{background:#FCF3DF;color:#96701F}.dd-g{background:#EEF2F6;color:#7F8C8D}
.fold{background:#F4F8FB;border:1px dashed #C7D4E0;border-radius:9px;text-align:center;font-size:11px;color:#5A6B7B;padding:8px;margin-top:8px}
.btnrow{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
.mb{border-radius:8px;padding:8px 13px;font-size:11.5px;font-weight:700}
.mb-g{background:#EEF2F6;color:#5A6B7B}.mb-n{background:linear-gradient(135deg,var(--navy2),#142C46);color:#fff;box-shadow:0 3px 9px rgba(27,58,92,.3)}
.savedbox{background:#fff;border:1px solid #E1E8EE;border-radius:11px;padding:10px 12px;margin-bottom:10px}
.savedbox .lab{font-size:11px;color:#7F8C8D;margin-bottom:7px}
.scc{display:inline-flex;align-items:center;gap:5px;background:#EAF1F8;color:var(--navy2);border-radius:12px;padding:5px 10px;font-size:11.5px}
.scc b{font-weight:800}.scc .ic{opacity:.8}
/* 메인 목업 요소 */
.banner{background:linear-gradient(135deg,#1A2C49,#0F1B30);border:1px solid rgba(201,169,110,.55);border-radius:10px;padding:10px 13px;display:flex;align-items:center;gap:9px;color:#fff;font-size:12px}
.banner .bb{background:var(--red);font-size:9.5px;font-weight:800;padding:2px 8px;border-radius:8px}
.banner .ar2{margin-left:auto;color:var(--goldL);font-size:11px;font-weight:700}
.alertstrip{background:#fff;border:1px solid #E1E8EE;border-radius:10px;padding:9px 12px;display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--ink)}
.alertstrip .nn{background:#FDECEA;color:var(--red);font-weight:800;font-size:10px;border-radius:9px;padding:2px 8px}
.alertstrip .go{margin-left:auto;background:var(--navy2);color:#fff;border-radius:8px;padding:4px 10px;font-size:10.5px;font-weight:700}
.grid8{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:10px}
.gb{border-radius:8px;padding:9px 4px;text-align:center;color:#fff;font-size:10px;font-weight:600}
.gb.biz{background:linear-gradient(135deg,#1a1a2e,#2d1b69);position:relative;animation:bl 3s ease-in-out infinite}
@keyframes bl{0%,70%,100%{opacity:1}78%{opacity:.45}86%{opacity:1;box-shadow:0 0 12px rgba(125,95,255,.6)}94%{opacity:.45}}
.gb.biz .nb3{position:absolute;top:-6px;right:-4px;background:var(--gold);font-size:8px;font-weight:800;padding:1px 6px;border-radius:7px}
/* KSIC 모달 목업 */
.kmod{background:#fff;border-radius:12px;box-shadow:0 14px 40px rgba(10,25,45,.25);padding:13px;max-width:420px;margin:0 auto;color:var(--ink)}
.fgrid5{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.kin{border:1.5px solid var(--navy2);border-radius:8px;padding:8px 11px;font-size:13px;display:flex;gap:7px;align-items:center;box-shadow:0 0 0 3px rgba(27,58,92,.1)}
.kres{margin-top:8px;border:1px solid #EFF3F7;border-radius:8px;overflow:hidden}
.kr{padding:8px 11px;font-size:11.5px;border-bottom:1px solid #F4F7FA;display:flex;gap:8px}
.kr:last-child{border:none}
.kr .code{color:var(--gold2);font-weight:800}
/* 확인창 */
.confirm{background:#fff;border-radius:11px;box-shadow:0 14px 40px rgba(10,25,45,.3);padding:15px;max-width:280px;text-align:center;font-size:12.5px}
.confirm .cb{display:flex;gap:8px;justify-content:center;margin-top:11px}
/* 캡션 */
.cap{position:absolute;left:0;right:0;bottom:0;padding:12px 18px;background:linear-gradient(transparent,rgba(8,14,26,.92) 40%);text-align:center}
.cap .t2{font-size:clamp(13px,2vw,16px);font-weight:700;color:#fff;word-break:keep-all}
.cap .t2 b{color:var(--goldL)}
/* 컨트롤 */
.ctrl{display:flex;align-items:center;gap:10px;padding:0 4px}
.cbtn{width:38px;height:38px;border-radius:50%;border:1px solid rgba(201,169,110,.4);background:rgba(255,255,255,.06);color:#fff;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.cbtn:hover{background:rgba(201,169,110,.18)}
.prog{font-size:11.5px;color:rgba(255,255,255,.6);min-width:46px;text-align:center}
.seek{flex:1;height:26px;display:flex;align-items:center;cursor:pointer;position:relative}
.strack{width:100%;height:5px;border-radius:3px;background:rgba(255,255,255,.14);position:relative;overflow:visible}
.sfill{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:linear-gradient(90deg,var(--gold2),var(--goldL));width:0%}
.shandle{position:absolute;top:50%;transform:translate(-50%,-50%);width:13px;height:13px;border-radius:50%;background:var(--goldL);box-shadow:0 0 8px rgba(201,169,110,.8);left:0%}
/* 시작 오버레이 */
#startOv{position:absolute;inset:0;background:rgba(10,16,28,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:20;backdrop-filter:blur(3px)}
#startOv .st{font-family:var(--serif);font-weight:900;font-size:clamp(17px,3vw,24px);text-align:center;line-height:1.5;word-break:keep-all}
#startOv .st b{color:var(--goldL)}
#startOv .ss{font-size:12px;color:rgba(255,255,255,.6)}
#startBtn{background:linear-gradient(135deg,var(--gold),var(--gold2));border:none;color:#fff;font-weight:800;font-size:15px;border-radius:13px;padding:13px 32px;cursor:pointer;box-shadow:0 8px 24px rgba(176,141,82,.5);font-family:inherit}
@media (max-width:560px){
  body{padding:10px}
  .stage{aspect-ratio:9/13}
  .scene{padding:12px 10px}
  .head .sub{display:none}
  .mock{font-size:11px;border-radius:11px}
  .mbody{padding:10px 10px}
  .fgrid{grid-template-columns:1fr 1fr}
  .grid8{grid-template-columns:repeat(2,1fr)}
  .bhd .t{font-size:13px}.bhd .meta{font-size:9.5px;padding:4px 7px}.bhd .home{font-size:9.5px;padding:4px 8px}
  .cc{font-size:10px;padding:4px 9px}
  .tc2{font-size:9.5px;padding:3px 7px}.tl{font-size:9.5px}
  .nline{font-size:11px}.nline .now{font-size:16px}
  .r{padding:7px 8px;font-size:10.5px;gap:6px}.r .cat{font-size:8.5px;min-width:26px}.r .dd2{font-size:8.5px;padding:2px 5px}
  .sel{padding:6px 8px;font-size:11px}
  .ck2{font-size:9px;padding:4px 7px}.gchip{font-size:9px}
  .scc{font-size:10px;padding:4px 8px}
  .typo .lg{font-size:18px}.typo .sm{font-size:11.5px}.bignum{font-size:42px}.typo .logoBig{font-size:20px;letter-spacing:8px}
  .kmod{padding:10px}.kin{font-size:12px}.kr{font-size:10.5px}
  .fgrid5{grid-template-columns:1fr 1fr 1fr}
  .cap{padding:9px 10px}.cap .t2{font-size:12px}
  .ctrl{gap:6px}.cbtn{width:33px;height:33px;font-size:13px}.prog{font-size:10px;min-width:38px}
  .hand{font-size:21px}
  .banner{font-size:10.5px;padding:8px 10px}.alertstrip{font-size:9.5px;flex-wrap:wrap}.alertstrip .go{margin-left:0}
}
</style>
</head>
<body>
<div class="player">
  <div class="head"><span class="logo">J A R V I A</span><span class="sub">기업맞춤형 정부지원사업 조회 프로그램 · 안내영상</span></div>
  <div class="stage" id="stage">
    <div id="startOv">
      <div class="st">기업맞춤형<br><b>정부지원사업 조회 프로그램</b></div>
      <div class="ss">약 3분 40초 · 음성과 함께 재생됩니다</div>
      <button id="startBtn">▶ &nbsp;시작하기</button>
    </div>
    <div class="scene" id="sc"></div>
    <div class="cap"><div class="t2" id="tt"></div></div>
  </div>
  <div class="ctrl">
    <button class="cbtn" id="bPrev">⏮</button>
    <button class="cbtn" id="bPlay">⏸</button>
    <button class="cbtn" id="bNext">⏭</button>
    <button class="cbtn" id="bRe">↻</button>
    <div class="seek" id="seekTrack"><div class="strack"><div class="sfill" id="seekFill"></div><div class="shandle" id="seekHandle"></div></div></div>
    <span class="prog" id="prog">1 / 20</span>
    <button class="cbtn" id="bMute">🔊</button>
  </div>
</div>

<script>
(function(){
/* ════════ 씬 정의 (씬 N = bizguide-N.mp3) ════════ */
const ROWS_GG = [
  ['금융','★','[경기] 수원시 중소기업육성자금 융자지원 계획 공고','','dd-g','상시'],
  ['기술','★','[경기] 2026년 기술닥터사업 공고','','dd-g','상시'],
  ['수출','★','[경기] 부천시 EMS 수출물류비 지원사업 모집 공고','','dd-a','D-18'],
  ['내수','','[경기] 하남시 맞춤형 온라인 마케팅 지원사업 공고','NEW','dd-r','D-7'],
];
function rows(arr){return '<div class="lst">'+arr.map(r=>`<div class="r"><span class="cat">${r[0]}</span><div class="nm2">${r[1]?'<span class="star">★</span>':''}${r[3]?'<span class="nb2">NEW </span>':''}${r[2]}</div><span class="dd2 ${r[4]}">${r[5]}</span></div>`).join('')+'</div>';}
function browser(inner,url){return `<div class="mock"><div class="mbar"><span class="dot" style="background:#F2655A"></span><span class="dot" style="background:#F6BD3B"></span><span class="dot" style="background:#43C465"></span><span class="url">${url||'jarvia.co.kr/biz-support.html'}</span></div><div class="mbody">${inner}</div></div>`;}
const bizHd = `<div class="bhd"><span class="t">🏢 고객기업 맞춤 지원사업</span><span class="meta" id="metaSpot">2026. 6. 12. 갱신 · 활성 <b>1,552건</b></span><span class="home">← JARVIA 홈</span></div>`;
const chipsAll = `<div class="cchips"><span class="cc on">전체</span><span class="cc">금융</span><span class="cc">기술</span><span class="cc">인력</span><span class="cc">수출</span><span class="cc">내수</span><span class="cc">창업</span><span class="cc">경영</span></div>`;

const SC=[
/*1*/{dur:12000,tt:'대표님이 <b>먼저 반기는 연락</b>이 매일 있다면?',html:`<div class="typo"><div class="logoBig fadeup" style="letter-spacing:1px;font-size:clamp(17px,3vw,26px)">기업맞춤형 정부지원사업 조회</div><div class="lg fadeup2">기업 고객에게, 오늘 무슨 명분으로<br><b>연락</b>하시겠습니까?</div><div class="sm fadeup3">안부 인사도, 상품 이야기도 아닌 —<br>대표님이 먼저 반기는 연락. 그게 매일 있다면 어떨까요?</div></div>`,
 narr:'기업 고객에게, 오늘은 무슨 명분으로 연락하시겠습니까? 안부 인사도, 상품 이야기도 아닌 — 대표님이 먼저 반기는 연락. 그게 매일 있다면 어떨까요?'},
/*2*/{dur:13000,tt:'<b>1,500여 건</b> 중, 내 고객 회사가 받을 수 있는 건?',html:`<div class="typo"><div class="bignum fadeup" id="cnt2">0</div><div class="lg fadeup2" style="font-size:clamp(15px,2.4vw,20px)">정부·지자체 기업 지원사업</div><div class="sm fadeup3">융자 · 보증 · 수출 · 인력 · 연구개발…</div><div class="lg fadeup4" style="margin-top:18px;font-size:clamp(15px,2.4vw,20px)">그중 <b>내 고객 회사</b>가 받을 수 있는 건?</div></div>`,

/* ════════ 플레이어 — 내레이션 주도형 (음성이 끝나면 다음 씬, 끊김 없음) ════════ */
const N=SC.length;
const $=id=>document.getElementById(id);
const stageEl=$('sc'),ttEl=$('tt'),progEl=$('prog');
let cur=0,paused=false,gen=0,safety=null,started=false,muted=false,koVoice=null,curAudio=null,seekRAF=null;

function countTo(id,from,to,ms,fmt,delay){
  const run=()=>{const el=document.getElementById(id);if(!el)return;const t0=performance.now();
    const step=(t)=>{const p=Math.min(1,(t-t0)/ms);const v=Math.round(from+(to-from)*(1-Math.pow(1-p,3)));
      el.textContent=fmt?fmt(v):v;if(p<1)requestAnimationFrame(step);};requestAnimationFrame(step);};
  if(delay)setTimeout(run,delay);else run();}
function typeText(id,txt,delay){setTimeout(()=>{const el=document.getElementById(id);if(!el)return;let i=0;
  const t=setInterval(()=>{el.textContent=txt.slice(0,++i);if(i>=txt.length)clearInterval(t);},220);},delay||0);}

function pickVoice(){if(!('speechSynthesis'in window))return;const vs=speechSynthesis.getVoices()||[];
  koVoice=vs.find(v=>/ko[-_]KR/i.test(v.lang)&&/female|여|yuna|heami|sora/i.test(v.name))||vs.find(v=>/ko[-_]KR/i.test(v.lang))||null;}
if('speechSynthesis'in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
function speak(text,cb){if(!text||!('speechSynthesis'in window)){cb&&cb();return;}
  try{speechSynthesis.cancel();}catch(e){}
  const u=new SpeechSynthesisUtterance(text);u.lang='ko-KR';u.rate=1.22;u.pitch=1.0;if(koVoice)u.voice=koVoice;
  let done=false;u.onend=u.onerror=()=>{if(done)return;done=true;cb&&cb();};
  try{speechSynthesis.speak(u);}catch(e){cb&&cb();}}
const AUDIO_PREFIX='bizguide-';   // GitHub 루트의 bizguide-1.mp3 ~ bizguide-20.mp3
function stopAudio(){try{if(curAudio){curAudio.onended=curAudio.onerror=null;curAudio.pause();curAudio.src='';curAudio=null;}}catch(e){}
  try{speechSynthesis.cancel();}catch(e){}}
// 내레이션 재생: mp3 우선 → 실패 시 브라우저 TTS. 끝나면 cb 1회 보장.
function playNarr(i,text,cb){
  let done=false;const fin=()=>{if(done)return;done=true;cb&&cb();};
  if(muted){ // 음소거: 씬 기본 길이만큼 대기 후 진행
    const g=gen;setTimeout(()=>{if(g===gen)fin();},SC[i].dur);return;}
  stopAudio();
  const a=new Audio(AUDIO_PREFIX+(i+1)+'.mp3');curAudio=a;
  a.onended=fin;
  a.onerror=()=>{if(curAudio===a){curAudio=null;speak(text,fin);}};
  const p=a.play();if(p&&p.catch)p.catch(()=>{if(curAudio===a){curAudio=null;speak(text,fin);}});
}

function show(i){
  cur=(i+N)%N;gen++;const g=gen;clearTimeout(safety);
  const s=SC[cur];
  stageEl.classList.remove('on');
  setTimeout(()=>{if(g!==gen)return;
    stageEl.innerHTML=s.html;ttEl.innerHTML=s.tt;progEl.textContent=(cur+1)+' / '+N;
    stageEl.classList.add('on');
    if(s.anim)try{s.anim();}catch(e){}
    // ★ 내레이션이 끝나는 순간 350ms 호흡 후 다음 씬 — 음성이 흐름을 끌고 간다
    playNarr(cur,s.narr,()=>{if(g!==gen||paused)return;setTimeout(()=>{if(g===gen&&!paused)show(cur+1);},350);});
    // 안전망: 음성이 '실제로 재생 중'이면 절대 발동하지 않음 — 멈춤/로딩 실패 시에만 진행
    armSafety(g);
    runSeek(g);
  },160);}

// 안전망: 주기 점검 — 음성 진행 중(오디오 or TTS)이면 4초 연장, 아니면 다음 씬
function armSafety(g){
  clearTimeout(safety);
  const chk=()=>{
    if(g!==gen||paused)return;
    const audioLive=curAudio&&!curAudio.paused&&!curAudio.ended;
    const ttsLive=('speechSynthesis'in window)&&speechSynthesis.speaking;
    if(audioLive||ttsLive){safety=setTimeout(chk,4000);return;}  // 음성 살아있음 → 연장
    show(cur+1);                                                  // 진짜 멈춤 → 진행
  };
  safety=setTimeout(chk,SC[cur].dur+8000);
}

// 시킹바: mp3면 실제 재생 위치, 아니면 dur 추정
let segT0=0;
function runSeek(g){segT0=performance.now();
  const f=$('seekFill'),h=$('seekHandle');
  const step=()=>{if(g!==gen)return;
    let frac=0;
    if(curAudio&&curAudio.duration>0)frac=Math.min(1,curAudio.currentTime/curAudio.duration);
    else frac=Math.min(1,(performance.now()-segT0)/SC[cur].dur);
    const pct=(((cur+frac)/N)*100).toFixed(2)+'%';f.style.width=pct;h.style.left=pct;
    seekRAF=requestAnimationFrame(step);};
  cancelAnimationFrame(seekRAF);seekRAF=requestAnimationFrame(step);}

$('bPrev').onclick=()=>{paused=false;$('bPlay').textContent='⏸';show(cur-1);};
$('bNext').onclick=()=>{paused=false;$('bPlay').textContent='⏸';show(cur+1);};
$('bRe').onclick=()=>{paused=false;$('bPlay').textContent='⏸';show(cur);};
$('bPlay').onclick=function(){
  paused=!paused;this.textContent=paused?'▶':'⏸';
  if(paused){clearTimeout(safety);
    if(curAudio)try{curAudio.pause();}catch(e){}
    try{speechSynthesis.pause();}catch(e){}}
  else{
    if(curAudio){try{curAudio.play();}catch(e){}}
    else if('speechSynthesis'in window&&speechSynthesis.paused){try{speechSynthesis.resume();}catch(e){}}
    else show(cur); // 재개 불가 상태면 현재 씬 재시작
    armSafety(gen);}
};
$('bMute').onclick=function(){muted=!muted;this.textContent=muted?'🔇':'🔊';
  if(muted){stopAudio();const g=gen;setTimeout(()=>{if(g===gen&&!paused)show(cur+1);},1200);}};
$('seekTrack').addEventListener('click',e=>{const r=e.currentTarget.getBoundingClientRect();
  const p=Math.min(.999,Math.max(0,(e.clientX-r.left)/r.width));paused=false;$('bPlay').textContent='⏸';show(Math.floor(p*N));});

$('startBtn').onclick=()=>{ $('startOv').style.display='none';started=true;show(0); };
})();
</script>
