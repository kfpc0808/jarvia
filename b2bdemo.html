<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>단체 관리자 화면 예시 · JARVIA</title>
<!-- ★ [2026-10-18] B2B 샘플 화면 열람 페이지 — 받는 분이 암호를 붙여넣으면 서버(b2bDemoOpen)가 확인 후 화면을 보내 준다 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:#0B1F38;font-family:'Noto Sans KR',sans-serif;color:#1F2A37}
.card{width:100%;max-width:420px;background:#FFFFFF;border-radius:18px;padding:32px 28px 26px;box-shadow:0 18px 48px rgba(0,0,0,.25)}
.tag{display:inline-block;font-size:11.5px;font-weight:600;color:#8A4B00;background:#FFF1D6;padding:3px 10px;border-radius:999px;margin-bottom:12px}
h1{margin:0 0 6px;font-size:22px;font-weight:700;color:#0B1F38;letter-spacing:-.4px}
p.sub{margin:0 0 22px;font-size:13.5px;line-height:1.6;color:#5B6878}
label{display:block;font-size:12.5px;font-weight:600;color:#3D4B5C;margin-bottom:6px}
.row{display:flex;gap:8px}
input{flex:1;min-width:0;height:48px;padding:0 14px;border:1px solid #D3DBE5;border-radius:10px;font-family:inherit;font-size:18px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:#0B1F38}
input::placeholder{letter-spacing:0;font-weight:400;font-size:14px;color:#8A96A6;text-transform:none}
input:focus{outline:2px solid #F2C14E;outline-offset:1px;border-color:#0F4C81}
.paste{height:48px;padding:0 14px;border:1px solid #D3DBE5;border-radius:10px;background:#FFFFFF;font-family:inherit;font-size:13px;color:#1F2A37;cursor:pointer;white-space:nowrap}
.go{width:100%;height:50px;margin-top:12px;border:0;border-radius:10px;background:#0F4C81;color:#FFFFFF;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer}
.go:disabled{opacity:.6;cursor:default}
.paste:focus-visible,.go:focus-visible{outline:2px solid #F2C14E;outline-offset:2px}
.msg{min-height:20px;margin:10px 0 0;font-size:13px;line-height:1.5;color:#B42318}
.foot{margin-top:18px;padding-top:14px;border-top:1px solid #EEF2F6;font-size:11.5px;line-height:1.6;color:#5B6878}
</style>
</head>
<body>
<main class="card">
  <span class="tag">예시 화면</span>
  <h1>단체 관리자 화면 예시</h1>
  <p class="sub">전달받으신 암호를 붙여넣고 「열기」를 눌러 주세요.</p>
  <form id="f" autocomplete="off">
    <label for="code">열람 암호</label>
    <div class="row">
      <input id="code" name="code" inputmode="text" autocapitalize="characters" spellcheck="false" placeholder="예) ABCD-2345" maxlength="20" required>
      <button type="button" class="paste" id="paste">붙여넣기</button>
    </div>
    <button type="submit" class="go" id="go">열기</button>
    <p class="msg" id="msg" role="alert"></p>
  </form>
  <div class="foot">이 화면은 단체(기업) 도입 시 구축해 드리는 관리자 페이지의 예시입니다. 사명·로고·이름·숫자는 모두 가상의 예시 데이터입니다.<br>powered by JARVIA</div>
</main>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import{getFunctions,httpsCallable}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-functions.js';
const FC={apiKey:"AIzaSyBD9p-bf162RiiD1Y3BsY-NvbYjpOSrzmg",authDomain:"jarvia-platform.firebaseapp.com",projectId:"jarvia-platform",storageBucket:"jarvia-platform.firebasestorage.app",messagingSenderId:"388025068900",appId:"1:388025068900:web:09ba8e12e9e9e2ec49de71"};
const open=httpsCallable(getFunctions(initializeApp(FC),'asia-northeast3'),'b2bDemoOpen');
const KEY='b2bdemo_code';
const $=id=>document.getElementById(id);
const norm=v=>String(v||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
function show(html){document.open();document.write(html);document.close();}
async function tryOpen(code,silent){
  $('go').disabled=true;$('go').textContent='확인 중…';$('msg').textContent='';
  try{
    const r=(await open({code})).data||{};
    if(r.success&&r.html){try{sessionStorage.setItem(KEY,code);}catch(e){}show(r.html);return;}
    try{sessionStorage.removeItem(KEY);}catch(e){}
    if(!silent)$('msg').textContent=r.error||'암호가 맞지 않습니다. 다시 확인해 주세요.';
  }catch(e){if(!silent)$('msg').textContent='연결이 원활하지 않습니다. 잠시 후 다시 시도해 주세요.';}
  $('go').disabled=false;$('go').textContent='열기';
}
$('f').addEventListener('submit',ev=>{ev.preventDefault();const c=norm($('code').value);if(c.length<6){$('msg').textContent='암호를 정확히 입력해 주세요.';$('code').focus();return;}tryOpen(c,false);});
$('paste').addEventListener('click',async()=>{try{const t=await navigator.clipboard.readText();if(t){const m=t.match(/암호\s*[:：]\s*([A-Za-z0-9-]{6,20})/);$('code').value=(m?m[1]:t).trim().slice(0,20);$('code').focus();}}catch(e){$('code').focus();$('msg').textContent='입력칸을 길게 눌러 직접 붙여넣어 주세요.';}});
$('code').addEventListener('paste',ev=>{const t=(ev.clipboardData||window.clipboardData)?.getData('text')||'';const m=t.match(/암호\s*[:：]\s*([A-Za-z0-9-]{6,20})/);if(m){ev.preventDefault();$('code').value=m[1];}});
let saved='';try{saved=sessionStorage.getItem(KEY)||'';}catch(e){}
if(saved)tryOpen(saved,true);
</script>
</body>
</html>
