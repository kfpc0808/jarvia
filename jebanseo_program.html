<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>제안서AI</title>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#17263A;--slate:#52606D;--mute:#8A909A;--paper:#F3F1EC;--card:#FFFFFF;--line:#E2DED5;--gold:#B0852B;--red:#C0392B;--green:#2E7058;--navy:#2A4A7F;--redbg:#FBEDEB;--greenbg:#E9F2EE;--navybg:#EAF0F8;--goldbg:#F7F0DF;--slatebg:#EDEFF1;--panel:#1C2A3E;}
  *{box-sizing:border-box;}html,body{height:100%;margin:0;}
  body{font-family:'Noto Sans KR',system-ui,sans-serif;color:var(--ink);overflow:hidden;}
  .app{display:flex;height:100vh;}
  .left{width:340px;min-width:340px;background:var(--panel);color:#E8EBF0;display:flex;flex-direction:column;transition:margin-left .25s;}
  .left.collapsed{margin-left:-340px;}
  .lhead{padding:14px 16px 12px;border-bottom:1px solid rgba(255,255,255,.08);}
  .brand{font-size:13px;font-weight:700;color:#fff;display:flex;align-items:center;gap:7px;}.brand .dot{width:7px;height:7px;border-radius:50%;background:var(--gold);}
  .topic{font-size:12px;color:#9DA8B8;margin-top:3px;}
  .gauge{margin-top:11px;}.gauge .lab{display:flex;justify-content:space-between;font-size:11px;color:#9DA8B8;margin-bottom:4px;}.gauge .lab b{color:#fff;}
  .gbar{height:6px;background:rgba(255,255,255,.1);border-radius:4px;overflow:hidden;}.gbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#D9B362);border-radius:4px;transition:width .4s;}
  .chips{padding:10px 14px 4px;display:flex;flex-wrap:wrap;gap:5px;border-bottom:1px solid rgba(255,255,255,.08);}
  .pchip{font-size:11px;background:rgba(255,255,255,.08);color:#C7D0DD;border-radius:12px;padding:3px 9px;}.pchip b{color:#fff;}
  .msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:11px;}
  .msg{font-size:13.5px;line-height:1.55;max-width:92%;}
  .msg.ai{align-self:flex-start;background:rgba(255,255,255,.07);padding:9px 12px;border-radius:3px 12px 12px 12px;}
  .msg.me{align-self:flex-end;background:var(--gold);color:#231a06;padding:9px 12px;border-radius:12px 3px 12px 12px;font-weight:500;}
  .msg.ai .q{color:#C8B98E;font-size:11px;display:block;margin-top:5px;}
  .linput{padding:11px 12px;border-top:1px solid rgba(255,255,255,.08);display:flex;gap:7px;}
  .linput input{flex:1;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);border-radius:9px;padding:10px 12px;color:#fff;font-size:14px;font-family:inherit;}
  .linput input::placeholder{color:#8896A8;}.linput input:focus{outline:none;border-color:var(--gold);}
  .linput button{background:var(--gold);border:none;border-radius:9px;width:42px;color:#231a06;font-size:16px;cursor:pointer;}
  .right{flex:1;background:var(--paper);overflow-y:auto;position:relative;}
  .rtop{position:sticky;top:0;z-index:5;background:rgba(243,241,236,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:9px 22px;display:flex;justify-content:space-between;align-items:center;}
  .rt{display:flex;gap:8px;align-items:center;}
  .tbtn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 11px;font-size:12.5px;cursor:pointer;color:var(--slate);font-family:inherit;white-space:nowrap;}.tbtn:hover{border-color:var(--navy);color:var(--navy);}
  .modal{display:none;position:fixed;inset:0;background:rgba(23,38,58,.5);z-index:50;align-items:center;justify-content:center;}.modal.on{display:flex;}
  .mbox{background:#fff;border-radius:14px;width:min(440px,90vw);max-height:80vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3);}
  .mhead{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line);font-size:15px;}
  .mx{border:none;background:none;font-size:16px;cursor:pointer;color:var(--mute);}
  .mlist{overflow-y:auto;padding:10px;}
  .litem{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;}
  .litem .li-main{flex:1;min-width:0;cursor:pointer;}.litem .li-t{font-size:14px;font-weight:600;color:var(--ink);}.litem .li-s{font-size:12px;color:var(--mute);margin-top:2px;}
  .litem .li-del{border:none;background:none;color:var(--red);cursor:pointer;font-size:13px;}
  .libempty{text-align:center;color:var(--mute);font-size:13px;padding:30px 10px;}
  @media print{
    html,body{height:auto;overflow:visible;background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    .left,.rtop,#start,.modal{display:none!important;}
    .app{display:block;height:auto;}
    .right{flex:none;overflow:visible;height:auto;background:#fff;}
    .deck{padding:0!important;}
    .slide{break-inside:avoid;page-break-inside:avoid;page-break-after:always;margin:0!important;border:none!important;border-radius:0!important;box-shadow:none!important;}
    .canvas{min-height:auto;}
    body:not(.notes-on) .notes{display:none!important;}
  }
  .rtop .lt{display:flex;align-items:center;gap:11px;font-size:13px;color:var(--slate);}
  .collapse{border:1px solid var(--line);background:var(--card);border-radius:8px;width:30px;height:30px;cursor:pointer;color:var(--slate);font-size:15px;}
  .toggle{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;font-size:13px;}.toggle button{border:none;background:var(--card);padding:6px 13px;cursor:pointer;color:var(--slate);font-family:inherit;font-size:13px;}.toggle button.on{background:var(--ink);color:#fff;}
  .deck{max-width:780px;margin:0 auto;padding:22px 22px 80px;}
  .slide{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:18px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.05);cursor:pointer;transition:border-color .2s;}
  .slide.sel{border-color:var(--navy);box-shadow:0 0 0 2px var(--navybg);}.slide.peak{border-color:#E4C9A0;}
  .slide.working{position:relative;}.slide.working .canvas{opacity:.4;}
  .slide.working::after{content:"✍️ 작성자가 작성 중…";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--navy);color:#fff;font-size:13px;font-weight:600;padding:9px 18px;border-radius:22px;z-index:4;box-shadow:0 6px 18px rgba(0,0,0,.22);animation:pulse 1.1s ease-in-out infinite;white-space:nowrap;}
  @keyframes pulse{0%,100%{opacity:.78;}50%{opacity:1;}}
  .slide.flash{animation:fl 1.2s ease;}@keyframes fl{0%{box-shadow:0 0 0 3px #E4C9A0;}100%{box-shadow:0 1px 3px rgba(0,0,0,.05);}}
  .canvas{min-height:440px;padding:32px 40px;display:flex;flex-direction:column;position:relative;}
  .stag{position:absolute;top:16px;right:20px;font-size:11px;color:var(--mute);}
  .eyebrow{font-size:11px;font-weight:700;letter-spacing:.06em;padding:3px 10px;border-radius:5px;align-self:flex-start;margin-bottom:10px;}
  .stitle{font-size:26px;font-weight:700;line-height:1.25;letter-spacing:-.01em;}.ssub{font-size:14px;color:var(--slate);margin-top:4px;}
  .concl{font-size:15.5px;font-weight:500;color:var(--navy);margin:12px 0 6px;padding-left:12px;border-left:3px solid var(--gold);line-height:1.5;}
  .cbody{flex:1;margin-top:12px;display:flex;flex-direction:column;gap:11px;}
  ul.bul{margin:0;padding:0;list-style:none;}ul.bul li{font-size:14px;color:var(--slate);margin:6px 0;padding-left:18px;position:relative;line-height:1.55;}ul.bul li::before{content:"";position:absolute;left:2px;top:8px;width:6px;height:6px;border-radius:50%;background:var(--gold);}
  .edt{cursor:text;border-radius:5px;transition:background .15s,box-shadow .15s;}
  .edt:hover{background:rgba(176,133,43,.10);box-shadow:0 0 0 3px rgba(176,133,43,.10);}
  .edt:focus{outline:2px solid var(--gold);outline-offset:2px;background:#fff;}
  .cover .edt:hover{background:rgba(255,255,255,.08);box-shadow:none;}
  .cover .edt:focus{background:rgba(255,255,255,.12);}
  table.t{width:100%;border-collapse:collapse;font-size:12.5px;}table.t th,table.t td{border:1px solid var(--line);padding:6px 10px;text-align:left;}table.t th{background:var(--slatebg);font-weight:600;}table.t td{color:var(--slate);}
  .cards{display:flex;gap:12px;}.cd{flex:1;border:1px solid var(--line);border-radius:11px;padding:15px 16px;background:var(--paper);}.cd .l{font-size:12.5px;color:var(--gold);font-weight:800;letter-spacing:.02em;}.cd .x{font-size:13px;color:var(--slate);margin-top:6px;line-height:1.55;}
  .stats{display:flex;gap:12px;margin:4px 0;}
  .stat{flex:1;background:var(--navybg);border:1px solid var(--line);border-radius:12px;padding:16px 12px;text-align:center;}
  .stat .v{font-size:27px;font-weight:800;color:var(--navy);line-height:1.05;}.stat .v .u{font-size:15px;font-weight:700;margin-left:1px;}
  .stat .l{font-size:12px;color:var(--slate);margin-top:7px;font-weight:600;}
  .stat.hl{background:var(--goldbg);border-color:#E8D9B0;}.stat.hl .v{color:var(--gold);}
  .stat.warn{background:var(--redbg);border-color:#F2D6D2;}.stat.warn .v{color:var(--red);}
  .stat.good{background:var(--greenbg);border-color:#CFE4DA;}.stat.good .v{color:var(--green);}
  .canvas.center{align-items:center;text-align:center;}
  .canvas.center .eyebrow{align-self:center;}
  .canvas.center .concl{border-left:none;padding-left:0;padding-top:9px;border-top:2px solid var(--gold);display:inline-block;}
  .canvas.center .cbody{align-items:center;width:100%;}
  .canvas.cover.center{justify-content:center;}
  .cover{background:var(--ink);}.cover .stitle{color:#fff;font-family:'Nanum Myeongjo',serif;font-weight:800;font-size:33px;line-height:1.32;letter-spacing:.005em;}.cover .ssub{color:#AEB6C2;font-size:15px;margin-top:8px;}.cover .rule{width:48px;height:3px;background:var(--gold);margin:16px 0;border-radius:2px;}.cover.center .rule{margin:16px auto;}.cover .eyebrow{background:transparent;color:#C8B98E;letter-spacing:.16em;padding-left:0;}
  .notes{display:none;background:var(--navybg);border-top:1px solid var(--line);padding:13px 20px;font-size:13px;line-height:1.7;white-space:pre-wrap;}body.notes-on .notes{display:block;}.notes .lab{font-size:11px;font-weight:700;color:var(--navy);margin-bottom:4px;}
  #present{position:fixed;inset:0;z-index:200;background:#0c1322;display:none;flex-direction:column;align-items:center;justify-content:center;}
  #present.on{display:flex;}
  #present .pstage{display:flex;align-items:center;justify-content:center;gap:16px;width:100%;flex:1;padding:16px;box-sizing:border-box;min-height:0;}
  #present #pslide{display:flex;}
  #present .slide{width:min(92vw,1180px);max-height:86vh;overflow:auto;cursor:pointer;border-radius:14px;box-shadow:0 24px 70px rgba(0,0,0,.55);margin:0;}
  #present .canvas{min-height:min(80vh,640px);}
  #present .slide .notes{display:none!important;}
  #present .pnav{background:rgba(255,255,255,.12);color:#fff;border:none;width:52px;height:52px;border-radius:50%;font-size:26px;line-height:1;cursor:pointer;flex:none;transition:background .15s;}
  #present .pnav:hover{background:rgba(255,255,255,.28);}
  #present .pnotes{display:none;max-width:min(92vw,1180px);width:100%;box-sizing:border-box;background:rgba(255,255,255,.08);color:#e6ebf5;border-radius:10px;padding:12px 16px;font-size:13px;line-height:1.6;white-space:pre-wrap;max-height:20vh;overflow:auto;}
  #present.shownotes .pnotes{display:block;}
  #present .pbar{display:flex;align-items:center;gap:14px;color:#cdd6e6;font-size:13px;padding:12px 0 16px;flex:none;}
  #present .pbar button{background:rgba(255,255,255,.1);color:#fff;border:none;padding:7px 14px;border-radius:8px;cursor:pointer;font-size:13px;}
  #present .pbar button:hover{background:rgba(255,255,255,.22);}
  #present .pbar #pcount{min-width:64px;text-align:center;font-weight:600;}
  .chart{margin:4px 0;}
  .chart .cap{font-size:12px;color:var(--slate);margin-top:5px;text-align:center;}
  .dlg{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-top:6px;}
  .dlg .di{font-size:12px;color:var(--slate);display:inline-flex;align-items:center;gap:6px;}
  .dlg .di i{width:9px;height:9px;border-radius:2px;display:inline-block;}
  .ph{max-width:780px;margin:60px auto;text-align:center;color:var(--mute);font-size:14px;}
  .nameln{width:100%;box-sizing:border-box;margin-bottom:10px;padding:11px 14px;border:1px solid var(--line);border-radius:10px;font-size:14px;background:#fff;color:var(--ink);}
  .nameln::placeholder{color:#8896A8;}.nameln:focus{outline:none;border-color:var(--gold);}
  .mic{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 12px;font-size:15px;cursor:pointer;line-height:1;}
  .mic.micsm{padding:7px 9px;font-size:14px;}
  .mic.rec{background:#FDE7E7;border-color:#E45B5B;animation:micpulse 1s ease-in-out infinite;}
  @keyframes micpulse{0%,100%{box-shadow:0 0 0 0 rgba(228,91,91,.5);}50%{box-shadow:0 0 0 6px rgba(228,91,91,0);}}
  .genload{max-width:780px;margin:90px auto;display:flex;flex-direction:column;align-items:center;gap:15px;text-align:center;}
  .genspin{width:46px;height:46px;border:4px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:spin .9s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .genmsg{font-size:16px;font-weight:600;color:var(--ink);}
  .gensub{font-size:13px;color:var(--mute);}
  .gendots::after{content:'';animation:dots 1.4s steps(4,end) infinite;}
  @keyframes dots{0%{content:'';}25%{content:'.';}50%{content:'..';}75%{content:'...';}}
  /* 시작 화면 */
  #start{position:fixed;inset:0;z-index:50;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;}
  #start .brand2{font-size:14px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:8px;}#start .brand2 .dot{width:8px;height:8px;border-radius:50%;background:var(--gold);}
  #start h1{font-family:'Nanum Myeongjo',serif;font-size:29px;color:var(--ink);margin:10px 0 4px;font-weight:800;}
  #start .sub{font-size:14px;color:var(--slate);margin-bottom:24px;text-align:center;}
  #start .domains{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap;justify-content:center;}
  #start .dom{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:13px 18px;cursor:pointer;text-align:center;min-width:108px;transition:.15s;}
  #start .dom:hover{border-color:var(--navy);}#start .dom.on{border-color:var(--gold);background:var(--goldbg);box-shadow:0 0 0 2px var(--goldbg);}
  #start .dom .ic{font-size:21px;}#start .dom .nm{font-size:13.5px;font-weight:600;color:var(--ink);margin-top:4px;}
  #start .inwrap{width:100%;max-width:560px;}
  #start .inbox{display:flex;gap:8px;align-items:flex-end;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:9px;box-shadow:0 2px 12px rgba(0,0,0,.05);}
  #start textarea{flex:1;border:none;resize:none;font-family:inherit;font-size:15px;padding:9px 11px;background:transparent;color:var(--ink);height:58px;line-height:1.5;}#start textarea:focus{outline:none;}
  #start .go{background:var(--ink);color:#fff;border:none;border-radius:10px;padding:11px 18px;font-size:14.5px;cursor:pointer;font-family:inherit;white-space:nowrap;}
  #start .ex{margin-top:11px;display:flex;gap:7px;flex-wrap:wrap;justify-content:center;}#start .ex span{font-size:12.5px;color:var(--slate);border:1px solid var(--line);background:var(--card);border-radius:16px;padding:5px 12px;cursor:pointer;}
  #start .loading{font-size:14px;color:var(--navy);margin-top:18px;display:none;}#start .loading::before{content:"✍️ ";}
  #start .warn{font-size:11.5px;color:var(--mute);margin-top:20px;max-width:460px;text-align:center;line-height:1.5;}
  #start .orrow{margin-top:14px;font-size:13px;color:var(--mute);}
  .linklike{border:none;background:none;color:var(--navy);font-size:13px;cursor:pointer;font-family:inherit;text-decoration:underline;text-underline-offset:3px;padding:2px 4px;}
  .linklike:hover{color:var(--gold);}
  .startmain{position:absolute;top:16px;left:16px;border:1px solid var(--line);background:var(--card);border-radius:18px;padding:7px 14px;font-size:13px;font-weight:600;color:var(--slate);cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:5px;}
  .startmain:hover{border-color:var(--navy);color:var(--navy);}
</style>
</head>
<body>
<div id="start">
  <button class="startmain" onclick="goMain()">🏠 메인</button>
  <div class="brand2"><span class="dot"></span> 제안서AI</div>
  <h1>어떤 상담 자료를 만들까요?</h1>
  <div class="sub">분야를 고르고 고객 정보를 자유롭게 적어주세요. 작성자가 자료를 만들어 드립니다.</div>
  <div class="domains" id="doms">
    <div class="dom" data-t="보험설계" onclick="pickDom(this)"><div class="ic">🛡️</div><div class="nm">보험설계</div></div>
    <div class="dom on" data-t="연금설계" onclick="pickDom(this)"><div class="ic">🌗</div><div class="nm">연금설계</div></div>
    <div class="dom" data-t="기업컨설팅" onclick="pickDom(this)"><div class="ic">🏢</div><div class="nm">기업컨설팅</div></div>
    <div class="dom" data-t="자산관리" onclick="pickDom(this)"><div class="ic">💎</div><div class="nm">자산관리</div></div>
  </div>
  <div class="inwrap">
    <input id="startname" class="nameln" placeholder="고객명 (선택) — 예) 김길동" autocomplete="off">
    <div class="inbox">
      <textarea id="startin" placeholder="예) 40세 남성, 월소득 500만 원, 외벌이, 65세 은퇴 희망, 금융자산 1억"></textarea>
      <button type="button" class="mic" id="micstart" title="음성 입력">🎤</button>
      <button class="go" id="gobtn" onclick="startSession()">자료 만들기 →</button>
    </div>
    <div class="ex" id="startex"></div>
  </div>
  <div class="orrow">또는 <button class="linklike" type="button" onclick="openFile()">📂 저장한 자료 열기</button><span id="resumewrap" style="display:none"> · <button class="linklike" type="button" onclick="restore('__last')">⟲ 이전 작업 이어하기</button></span></div>
  <div class="loading" id="startloading">작성자가 자료를 만드는 중입니다…</div>
  <div class="warn">※ 이 프로그램은 자비아 Cloud Function을 통해 작성자(AI)를 호출합니다. 함수가 배포되고 상단 FUNCTION_URL이 설정돼야 자료가 생성됩니다.</div>
</div>

<div class="app">
  <aside class="left" id="left">
    <div class="lhead">
      <div class="brand"><span class="dot"></span> 제안서AI · 진행자</div>
      <div class="topic" id="topic">—</div>
      <div class="gauge"><div class="lab"><span>자료 완성도</span><b id="pct">—</b></div><div class="gbar"><i id="gfill" style="width:0%"></i></div></div>
    </div>
    <div class="chips" id="pchips"></div>
    <div class="msgs" id="msgs"></div>
    <div class="linput"><input id="cmd" placeholder="지시 입력 — 예) 3번 삭제 / 2번 결론 영어로" autocomplete="off"><button type="button" class="mic micsm" id="miccmd" title="음성 입력">🎤</button><button onclick="send()">↑</button></div>
  </aside>
  <main class="right" id="right">
    <div class="rtop"><div class="lt"><button class="collapse" onclick="goMain()" title="메인으로">🏠</button><button class="collapse" onclick="toggleLeft()">⟨</button><span id="count">—</span></div>
      <div class="rt">
        <button class="tbtn" onclick="saveFile()" title="내 컴퓨터에 파일로 저장">💾 저장</button>
        <button class="tbtn" onclick="openFile()" title="저장한 파일 열기">📂 열기</button>
        <button class="tbtn" onclick="exportPDF()" title="A4 세로 2장/쪽 PDF 미리보기">📄 PDF</button>
        <input type="file" id="fileinput" accept=".html,.json,text/html,application/json" style="display:none" onchange="handleFile(event)">

<script>
let deck={slides:[]}, selectedIdx=null, topic="연금설계", params={}, calc={};
// Cloud Function 주소 (jarvia-platform · asia-northeast3). 콘솔의 함수 트리거 URL과 다르면 그 값으로 교체하세요.
const FUNCTION_URL = "https://asia-northeast3-jarvia-platform.cloudfunctions.net/jebanseoApi";
const MAIN_URL = "https://jarvia.co.kr"; // ★ 자비아 메인 주소 (필요시 교체)
function goMain(){ location.href = MAIN_URL; }

/* ===== 렌더러 ===== */
function elt(t,c){const e=document.createElement(t);if(c)e.className=c;return e;}
function renderChart(c){const wrap=elt('div','chart');const W=560,H=185,pl=46,pb=32,pt=16,pr=20,plotH=H-pb-pt,plotW=W-pl-pr,max=Math.max(...c.series.flatMap(s=>s.values),1),ns='http://www.w3.org/2000/svg';
  const svg=document.createElementNS(ns,'svg');svg.setAttribute('viewBox',`0 0 ${W} ${H}`);svg.setAttribute('width','100%');svg.style.maxWidth='520px';svg.style.display='block';svg.style.margin='0 auto';
  const pal=['#2A4A7F','#B0852B','#C0392B'],y=v=>(H-pb)-(v/max)*plotH;
  if(c.chartType==='donut'){const vals=c.series[0].values,tot=vals.reduce((a,b)=>a+(+b||0),0)||1,cx=W/2,cy=H/2+6,rad=58,sw=26,dpal=['#B0852B','#2A4A7F','#C0392B'];
    const bg=document.createElementNS(ns,'circle');bg.setAttribute('cx',cx);bg.setAttribute('cy',cy);bg.setAttribute('r',rad);bg.setAttribute('fill','none');bg.setAttribute('stroke','#ECEAE3');bg.setAttribute('stroke-width',sw);svg.appendChild(bg);
    const circ=2*Math.PI*rad;let off=0;
    vals.forEach((v,i)=>{const frac=(+v||0)/tot,seg=document.createElementNS(ns,'circle');seg.setAttribute('cx',cx);seg.setAttribute('cy',cy);seg.setAttribute('r',rad);seg.setAttribute('fill','none');seg.setAttribute('stroke',dpal[i%3]);seg.setAttribute('stroke-width',sw);seg.setAttribute('stroke-dasharray',`${frac*circ} ${circ}`);seg.setAttribute('stroke-dashoffset',-off);seg.setAttribute('transform',`rotate(-90 ${cx} ${cy})`);svg.appendChild(seg);off+=frac*circ;});
    const big=document.createElementNS(ns,'text');big.setAttribute('x',cx);big.setAttribute('y',cy-2);big.setAttribute('text-anchor','middle');big.setAttribute('font-size','22');big.setAttribute('font-weight','800');big.setAttribute('fill','#17263A');big.textContent=Math.round((vals[0]||0)/tot*100)+'%';svg.appendChild(big);
    const sub=document.createElementNS(ns,'text');sub.setAttribute('x',cx);sub.setAttribute('y',cy+16);sub.setAttribute('text-anchor','middle');sub.setAttribute('font-size','11');sub.setAttribute('fill','#52606D');sub.textContent=c.labels[0]||'';svg.appendChild(sub);
    const lg=elt('div','dlg');c.labels.forEach((lab,i)=>{const it=elt('span','di');it.innerHTML=`<i style="background:${dpal[i%3]}"></i>${lab} ${vals[i]!=null?vals[i]:''}`;lg.appendChild(it);});wrap.appendChild(svg);wrap.appendChild(lg);if(c.unit){const cap=elt('div','cap');cap.textContent='단위: '+c.unit;wrap.appendChild(cap);}return wrap;}
  const base=document.createElementNS(ns,'line');base.setAttribute('x1',pl);base.setAttribute('y1',H-pb);base.setAttribute('x2',W-pr);base.setAttribute('y2',H-pb);base.setAttribute('stroke','#E2DED5');svg.appendChild(base);
  if(c.chartType==='bar'){const g=c.labels.length,bW=Math.min(46,(plotW/g)/1.6);
    c.labels.forEach((lab,i)=>{const gx=pl+i*(plotW/g)+(plotW/g)/2,v=c.series[0].values[i]||0,x=gx-bW/2;
      const r=document.createElementNS(ns,'rect');r.setAttribute('x',x);r.setAttribute('y',y(v));r.setAttribute('width',bW);r.setAttribute('height',(H-pb)-y(v));r.setAttribute('rx',3);r.setAttribute('fill',pal[i%3]);svg.appendChild(r);
      const t=document.createElementNS(ns,'text');t.setAttribute('x',gx);t.setAttribute('y',y(v)-5);t.setAttribute('text-anchor','middle');t.setAttribute('font-size','11');t.setAttribute('font-weight','700');t.setAttribute('fill','#17263A');t.textContent=v;svg.appendChild(t);
      const lt=document.createElementNS(ns,'text');lt.setAttribute('x',gx);lt.setAttribute('y',H-pb+15);lt.setAttribute('text-anchor','middle');lt.setAttribute('font-size','11');lt.setAttribute('fill','#52606D');lt.textContent=lab;svg.appendChild(lt);});
  }else{const stepX=plotW/(c.labels.length-1||1);
    const poly=document.createElementNS(ns,'polyline');poly.setAttribute('points',c.series[0].values.map((v,i)=>`${pl+i*stepX},${y(v)}`).join(' '));poly.setAttribute('fill','none');poly.setAttribute('stroke','#2A4A7F');poly.setAttribute('stroke-width','2.5');svg.appendChild(poly);
    c.series[0].values.forEach((v,i)=>{const cx=pl+i*stepX;const d=document.createElementNS(ns,'circle');d.setAttribute('cx',cx);d.setAttribute('cy',y(v));d.setAttribute('r',i===c.series[0].values.length-1?6:4.5);d.setAttribute('fill',i===c.series[0].values.length-1?'#C0392B':'#2A4A7F');svg.appendChild(d);
      const t=document.createElementNS(ns,'text');t.setAttribute('x',cx);t.setAttribute('y',y(v)-10);t.setAttribute('text-anchor','middle');t.setAttribute('font-size','11');t.setAttribute('font-weight','700');t.setAttribute('fill','#17263A');t.textContent=v;svg.appendChild(t);
      const lt=document.createElementNS(ns,'text');lt.setAttribute('x',cx);lt.setAttribute('y',H-pb+15);lt.setAttribute('text-anchor','middle');lt.setAttribute('font-size','11');lt.setAttribute('fill','#52606D');lt.textContent=c.labels[i];svg.appendChild(lt);});}
  wrap.appendChild(svg);if(c.unit){const cap=elt('div','cap');cap.textContent='단위: '+c.unit;wrap.appendChild(cap);}return wrap;}
function renderTable(t){const tb=elt('table','t');t.rows.forEach((row,ri)=>{const tr=elt('tr');row.forEach(cell=>{const c=elt(ri===0?'th':'td');c.textContent=cell;tr.appendChild(c);});tb.appendChild(tr);});return tb;}
function renderCards(c){const w=elt('div','cards');c.cards.forEach(cd=>{const d=elt('div','cd');const l=elt('div','l');l.textContent=cd.label;const x=elt('div','x');x.textContent=cd.text;d.appendChild(l);d.appendChild(x);w.appendChild(d);});return w;}
function renderStats(c){const w=elt('div','stats');(c.items||[]).forEach(it=>{const d=elt('div','stat'+(it.tone?(' '+it.tone):''));const v=elt('div','v');v.textContent=it.value;if(it.unit){const u=elt('span','u');u.textContent=it.unit;v.appendChild(u);}const l=elt('div','l');l.textContent=it.label;d.appendChild(v);d.appendChild(l);w.appendChild(d);});return w;}
function renderContent(items,idx){const f=document.createDocumentFragment();let b=null;const fl=()=>{if(b){f.appendChild(b);b=null;}};
  (items||[]).forEach((it,k)=>{if(typeof it==='string'){if(!b)b=elt('ul','bul');const li=elt('li');li.textContent=it;if(idx!=null)mkEditable(li,v=>{deck.slides[idx].content[k]=v;});b.appendChild(li);}else if(it&&it.type==='table'){fl();f.appendChild(renderTable(it));}else if(it&&it.type==='card'){fl();f.appendChild(renderCards(it));}else if(it&&it.type==='stat'){fl();f.appendChild(renderStats(it));}else if(it&&it.type==='chart'){fl();f.appendChild(renderChart(it));}});fl();return f;}
function mkEditable(el,apply){el.setAttribute('contenteditable','true');el.spellcheck=false;el.classList.add('edt');
  el.addEventListener('mousedown',e=>e.stopPropagation());
  el.addEventListener('click',e=>e.stopPropagation());
  el.addEventListener('blur',()=>{apply(el.textContent.trim());autoSave();});
  el.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();el.blur();}});
}
const EYE={"01":["표지","slatebg","slate"],"02":["결론","goldbg","gold"],"07":["진단","redbg","red"],"08":["진단","redbg","red"],"10":["해법","goldbg","gold"]};
function ebTone(t){if(/핵심|격차|차이|부족|비용/.test(t))return['redbg','red'];if(/제안|플랜|요약|결론/.test(t))return['goldbg','gold'];if(/실행|전략|해법|방향/.test(t))return['greenbg','green'];return['navybg','navy'];}
function makeSlide(s,idx){const sl=elt('div','slide'+(s.emphasis==='peak'?' peak':'')+(idx===selectedIdx?' sel':''));sl.onclick=()=>{selectedIdx=idx;renderDeck();};
  const centered=(s.align==='center')||(s.region==='cover'&&s.align!=='left');
  const cv=elt('div','canvas'+(s.region==='cover'?' cover':'')+(centered?' center':''));const tg=elt('div','stag');tg.textContent=(idx+1);cv.appendChild(tg);
  const ebText=s.region==='cover'?null:(s.eyebrow||(EYE[s.slideNum]?EYE[s.slideNum][0]:null));
  if(ebText){const e=elt('div','eyebrow');e.textContent=ebText;const tn=ebTone(ebText);e.style.background=`var(--${tn[0]})`;e.style.color=`var(--${tn[1]})`;cv.appendChild(e);}
  const tt=elt('div','stitle');tt.textContent=s.title||'';mkEditable(tt,v=>{deck.slides[idx].title=v;});cv.appendChild(tt);
  if(s.subtitle){const su=elt('div','ssub');su.textContent=s.subtitle;mkEditable(su,v=>{deck.slides[idx].subtitle=v;});cv.appendChild(su);}
  if(s.region==='cover')cv.appendChild(elt('div','rule'));
  if(s.conclusion){const c=elt('div','concl');c.textContent=s.conclusion;mkEditable(c,v=>{deck.slides[idx].conclusion=v;});cv.appendChild(c);}
  if(s.content&&s.content.length&&s.region!=='cover'){const bd=elt('div','cbody');bd.appendChild(renderContent(s.content,idx));cv.appendChild(bd);}
  sl.appendChild(cv);
  if(s.notes){const n=elt('div','notes');const l=elt('div','lab');l.textContent='🎤 발표노트';n.appendChild(l);const p=document.createElement('div');p.textContent=s.notes;n.appendChild(p);sl.appendChild(n);}
  return sl;}
function reseq(){deck.slides.forEach((s,i)=>{s.slideNum=String(i+1).padStart(2,'0');});}
function renderDeck(){const r=document.getElementById('deck');r.innerHTML='';if(!deck.slides.length){r.innerHTML='<div class="ph">시작 화면에서 고객 정보를 입력하면 여기에 자료가 생성됩니다.</div>';}else deck.slides.forEach((s,i)=>r.appendChild(makeSlide(s,i)));document.getElementById('count').textContent=deck.slides.length?('슬라이드 '+deck.slides.length+'장'):'—';autoSave();}
function renderGenLoading(){const r=document.getElementById('deck');r.innerHTML=`<div class="genload"><div class="genspin"></div><div class="genmsg">작성자가 ${topic} 자료를 만들고 있습니다<span class="gendots"></span></div><div class="gensub">고객 정보를 분석하고 슬라이드를 구성 중입니다 · 약 30초~1분</div></div>`;document.getElementById('count').textContent='생성 중…';}
function scrollToSlide(idx){const node=document.getElementById('deck').children[idx];if(node)node.scrollIntoView({behavior:'smooth',block:'center'});}

/* ===== 발표 모드 (전체화면 · 한 장씩) ===== */
let pIdx=0;
function startPresent(){if(!deck.slides.length){return aiReply('먼저 자료를 생성하거나 저장한 자료를 열어 주세요.');}pIdx=(selectedIdx!=null?selectedIdx:0);document.getElementById('present').classList.add('on');renderPresent();}
function endPresent(){const p=document.getElementById('present');p.classList.remove('on');p.classList.remove('shownotes');}
function presentGo(d){pIdx=Math.max(0,Math.min(deck.slides.length-1,pIdx+d));renderPresent();}
function togglePnotes(){document.getElementById('present').classList.toggle('shownotes');}
function renderPresent(){const s=deck.slides[pIdx];if(!s)return;const box=document.getElementById('pslide');box.innerHTML='';const node=makeSlide(s,pIdx);node.classList.remove('sel');node.onclick=()=>presentGo(1);box.appendChild(node);document.getElementById('pcount').textContent=(pIdx+1)+' / '+deck.slides.length;document.getElementById('pnotes').textContent=s.notes||'(이 슬라이드엔 발표노트가 없습니다)';}
document.addEventListener('keydown',function(e){if(!document.getElementById('present').classList.contains('on'))return;if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();presentGo(1);}else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();presentGo(-1);}else if(e.key==='Escape'){endPresent();}else if(e.key==='Home'){pIdx=0;renderPresent();}else if(e.key==='End'){pIdx=deck.slides.length-1;renderPresent();}});

/* ===== 진행자 메시지 ===== */
const MSGS=[];
function paint(){const m=document.getElementById('msgs');m.innerHTML='';MSGS.forEach(x=>{const d=elt('div','msg '+x.who);d.innerHTML=x.html;m.appendChild(d);});m.scrollTop=m.scrollHeight;}
function aiReply(t){MSGS.push({who:'ai',html:t});paint();}

/* ===== 간이 계산 (계산엔진 대역 — 실제는 택스나비 엔진) ===== */
function lightCalc(p){
  const life=90,income=p.monthlySalary||0,retire=p.retire||60,age=p.age||40,asset=p.asset||0;
  const yIn=Math.max(1,life-retire), yTo=Math.max(1,retire-age);
  const needMonthly=Math.round(income*0.7);
  const needTotal=Math.round(needMonthly*12*yIn/10000*10)/10;
  const prepared=asset;
  const gap=Math.max(0,Math.round((needTotal-prepared)*10)/10);
  const mSave=gap>0?Math.round(gap*10000/(yTo*12)):0;
  return {필요월생활비_만원:needMonthly,은퇴후연수_년:yIn,필요총자금_억:needTotal,현재준비_억:prepared,부족액_억:gap,월적립_지금_만원:mSave,월적립_5년후_만원:Math.round(mSave*1.6),은퇴까지_년:yTo};
}

/* ===== 작성자(Claude API) — 슬라이드 한 장 생성 ===== */
async function genSlide(spec){
  const prompt=`너는 금융 컨설팅 자료의 '작성자'다. 아래 ${topic}의 "${spec.role}" 슬라이드 한 장을 JSON 객체 하나로만 출력하라(설명·코드펜스 없이 JSON만).
형식: {"slideNum":"${spec.num}"${spec.cover?',"region":"cover"':''},"title":"","subtitle":"","conclusion":"","content":[],"ment":"","bridge":"","notes":"","disclaimer":""}
content 요소는 문자열(불릿) 또는 {"type":"chart","chartType":"bar"|"line","labels":[],"series":[{"name":"","values":[]}],"unit":""} 또는 {"type":"card","cards":[{"label":"","text":""}]}.
규칙: ① 숫자는 아래 '계산결과' 값만 사용(새 숫자 생성 절대 금지). ② 공포·강매 표현 금지, 고객 대상 정중한 톤. ③ notes는 [컨설턴트 멘트] 상담 화법 2~3문장. ④ 한국어. ⑤ ${spec.hint}
고객정보: ${JSON.stringify(params)}
계산결과(이 수치만 사용): ${JSON.stringify(calc)}`;
  const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:1000,messages:[{role:"user",content:prompt}]})});
  const data=await res.json();
  let txt=(data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('').replace(/```json|```/g,'').trim();
  return JSON.parse(txt.slice(txt.indexOf('{'),txt.lastIndexOf('}')+1));
}

const SPECS=[
  {num:"01",cover:true,role:"표지",hint:"제목은 고객명+분야, subtitle 한 줄. content는 빈 배열."},
  {num:"02",role:"오늘의 결론",hint:"conclusion에 핵심 결론 1문장, content에 근거 불릿 2개."},
  {num:"07",role:"현재와 목표의 차이",hint:"conclusion으로 부족액 강조, content에 bar 차트(필요총자금·현재준비·부족액) 1개 + 불릿 1개."},
  {num:"08",role:"미루었을 때의 비용",hint:"content에 line 차트(지금/5년 후 월적립 부담) 1개 + 불릿 1개."},
  {num:"10",role:"다음 단계 안내",hint:"content에 card 2개(A안 안정형/B안 성장형) + 정중한 마무리 불릿."}
];

async function generate(){
  deck={slides:[]};renderGenLoading();
  aiReply(`입력하신 내용을 정리해 ${topic} 자료를 만들고 있어요. 작성자가 작성합니다…`);
  try{
    const r=await fetch(FUNCTION_URL,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'generate',topic,text:rawInput,clientName})});
    const data=await r.json();
    if(data.error||!data.deck) throw new Error(data.error||'덱 없음');
    if(data.params){params=data.params;fillChips(data.params);}
    if(data.calc) calc=data.calc;
    for(const s of data.deck.slides){deck.slides.push(s);renderDeck();const last=document.getElementById('deck').children[deck.slides.length-1];if(last){last.classList.add('flash');last.scrollIntoView({behavior:'smooth',block:'center'});}await new Promise(res=>setTimeout(res,350));}
    aiReply('자료가 완성됐어요. 오른쪽 슬라이드의 <b>제목·문장을 클릭하면 바로 수정</b>할 수 있고, "2번 보강해줘"·"○○ 슬라이드 추가"·"3번 삭제" 같은 지시도 됩니다. ✓');
  }catch(e){
    aiReply('자료 생성에 실패했어요. FUNCTION_URL이 올바른지, Cloud Function이 배포됐는지 확인해 주세요. ('+(e.message||e)+')');
  }
}

/* ===== 편집 ===== */
function nums(t){const m=t.match(/\d+/g);return m?m.map(n=>parseInt(n)-1):[];}
async function callWriter(slide,instruction){
  const ctx={...params}; if(clientName) ctx.clientName=clientName;
  const r=await fetch(FUNCTION_URL,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'edit',slide,instruction,ctx})});
  const data=await r.json();
  if(data.error||!data.slide) throw new Error(data.error||'편집 실패');
  return data.slide;
}
async function callAdd(instruction){
  const ctx={...params,...calc}; if(clientName) ctx.clientName=clientName;
  const r=await fetch(FUNCTION_URL,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'add',topic,instruction,ctx})});
  const data=await r.json();
  if(data.error||!data.slide) throw new Error(data.error||'추가 실패');
  return data.slide;
}
async function callRoute(message){
  const slides=deck.slides.map((s,i)=>({n:i+1,title:s.title||''}));
  const recent=MSGS.slice(-6).map(m=>(m.who==='me'?'사용자: ':'진행자: ')+(m.html||'').replace(/<[^>]+>/g,'')).join('\n');
  const r=await fetch(FUNCTION_URL,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'interpret',message,slides,topic,clientName,recent})});
  const data=await r.json();
  if(data.error||!data.route) throw new Error(data.error||'해석 실패');
  return data.route;
}
function flash(i){const nn=document.getElementById('deck').children[i];if(nn)nn.classList.add('flash');}
async function send(){
  const inp=document.getElementById('cmd');const t=inp.value.trim();if(!t)return;
  MSGS.push({who:'me',html:t});paint();inp.value='';
  if(!deck.slides.length){return aiReply('먼저 시작 화면에서 자료를 생성하거나, 저장한 자료를 열어 주세요.');}
  let route;
  try{ route=await callRoute(t); }
  catch(e){ return aiReply('이해하는 데 실패했어요. 잠시 후 다시 시도해 주세요. ('+(e.message||e)+')'); }
  const op=route.op||'edit';

function parseStart(t){const chips=[];const p={};let m;let retire=null,age=null;
  if(m=t.match(/은퇴[^\d]{0,5}(\d{2})/))retire=+m[1];else if(m=t.match(/(\d{2})\s*세[^\d]{0,3}은퇴/))retire=+m[1];
  const ages=[...t.matchAll(/(\d{2})\s*(?:세|살)/g)].map(x=>+x[1]);age=ages.find(a=>a!==retire)??(ages[0]??null);
  if(age){chips.push(['나이',age]);p.age=age;}
  if(retire){chips.push(['은퇴',retire]);p.retire=retire;}
  if(m=t.match(/(?:월\s*소득|월소득|소득|월)\s*약?\s*([\d,]+)\s*만/)){const v=+m[1].replace(/,/g,'');chips.push(['월소득',v+'만']);p.monthlySalary=v;}
  if(/자산|모아|예금|금융/.test(t)&&(m=t.match(/([\d.]+)\s*억/))){const v=+m[1];chips.push(['자산',v+'억']);p.asset=v;}
  if(/외벌이/.test(t)){chips.push(['외벌이','✓']);p.earner='외벌이';}else if(/맞벌이/.test(t)){chips.push(['맞벌이','✓']);p.earner='맞벌이';}
  const found=Object.keys(p).length;
  return {chips,params:p,pct:Math.max(60,Math.min(95,52+found*9))};
}

    '.printdoc .page:last-child{page-break-after:auto;}'+
    '.printdoc .slot{width:716px;overflow:hidden;}.printdoc .sc{width:716px;transform-origin:top center;}'+
    '.printdoc .canvas{min-height:auto!important;}'+
    '.printdoc .slide{width:716px!important;max-width:none!important;margin:0!important;border:1px solid #e6e8ee!important;border-radius:10px!important;box-shadow:none!important;overflow:hidden!important;page-break-after:auto!important;break-after:auto!important;break-inside:avoid;}'+
    '.printdoc .notes{display:none!important;}}';
  const html='<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+title+'</title>'+
    '<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">'+
    '<style>'+css+exCss+VIEWER_CSS+'</style></head><body>'+VIEWER_BAR+'<div class="exwrap"><div class="deck">'+tmp.innerHTML+'</div></div><div class="printdoc"></div>'+VIEWER_OVERLAY+
    '<script>'+VIEWER_JS+'<\/script>'+
    '<script type="application/json" id="jebdata">'+JSON.stringify(data).replace(/</g,'\\u003c')+'<\/script></body></html>';
  const safe=s=>(s||'').replace(/[\\/:*?"<>|]/g,'').trim();
  const fn=(safe(clientName)?safe(clientName)+'_':'')+(safe(topic)||'제안서')+'_'+new Date().toISOString().slice(0,10)+'.html';
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));a.download=fn;
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);
  aiReply('"'+fn+'" (HTML)로 저장했습니다. 브라우저로 열면 우측 상단 <b>▶ 발표</b>(전체화면)와 <b>📄 A4 인쇄</b> 버튼이 있고, <b>그냥 Ctrl+P(또는 "PDF로 저장")만 눌러도 A4 한 장에 슬라이드가 2개씩</b> 자동으로 들어갑니다. 📂 열기로 불러와 편집도 가능합니다. ✓');
}
function openFile(){document.getElementById('fileinput').click();}
function handleFile(e){
  const f=e.target.files&&e.target.files[0];e.target.value='';if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{try{
    let d;const txt=rd.result;
    const m=txt.match(/<script[^>]*id=["']jebdata["'][^>]*>([\s\S]*?)<\/script>/);
    d=m?JSON.parse(m[1]):JSON.parse(txt);
    if(!d.deck||!d.deck.slides||!d.deck.slides.length)throw new Error('형식 오류');
    topic=d.topic||topic;params=d.params||{};calc=d.calc||{};clientName=d.clientName||'';deck={slides:d.deck.slides};
    document.getElementById('start').style.display='none';
    document.getElementById('topic').textContent=topic+' · 고객';
    document.getElementById('pct').textContent='불러옴';document.getElementById('gfill').style.width='100%';
    fillChips(params);MSGS.length=0;aiReply('"'+f.name+'"을 불러왔습니다. 이어서 편집하실 수 있어요. ✓');renderDeck();
  }catch(err){aiReply('파일을 여는 데 실패했어요. 제안서AI에서 저장한 HTML(또는 .json) 파일이 맞는지 확인해 주세요.');}};
  rd.readAsText(f);
}
document.getElementById('cmd').addEventListener('keydown',e=>{if(e.key==='Enter')send();});
/* ===== 음성 입력 (브라우저 내장 한국어 STT) ===== */
function setupMic(targetId,btnId){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  const btn=document.getElementById(btnId);if(!btn)return;
  if(!SR){btn.style.display='none';return;}
  let rec=null,on=false,base='';
  btn.addEventListener('click',()=>{
    if(on){rec&&rec.stop();return;}
    rec=new SR();rec.lang='ko-KR';rec.interimResults=true;rec.continuous=true;
    base=(document.getElementById(targetId).value||'').trim();
    rec.onstart=()=>{on=true;btn.classList.add('rec');};
    rec.onend=()=>{on=false;btn.classList.remove('rec');};
    rec.onerror=()=>{on=false;btn.classList.remove('rec');};
    rec.onresult=(e)=>{let txt='';for(let i=0;i<e.results.length;i++)txt+=e.results[i][0].transcript;
      document.getElementById(targetId).value=(base?base+' ':'')+txt;};
    rec.start();
  });
}
setupMic('startin','micstart');setupMic('cmd','miccmd');
offerResume();
renderDeck();paintEx();
