<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>제안서AI</title>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#17263A;--slate:#52606D;--mute:#8A909A;--paper:#F3F1EC;--card:#FFFFFF;--line:#E2DED5;--gold:#B0852B;--red:#C0392B;--green:#2E7058;--navy:#2A4A7F;--redbg:#FBEDEB;--greenbg:#E9F2EE;--navybg:#EAF0F8;--goldbg:#F7F0DF;--slatebg:#EDEFF1;--panel:#1C2A3E;}
  *{box-sizing:border-box;}html,body{height:100%;margin:0;}
  body{font-family:'Noto Sans KR',system-ui,sans-serif;color:var(--ink);overflow:hidden;}
  .app{display:flex;height:100vh;}
  .left{width:340px;min-width:340px;background:var(--panel);color:#E8EBF0;display:flex;flex-direction:column;transition:margin-left .25s;}
  .left.collapsed{margin-left:calc(-1 * var(--leftw, 340px));}
  .lhead{padding:14px 16px 12px;border-bottom:1px solid rgba(255,255,255,.08);}
  .brand{font-size:13px;font-weight:700;color:#fff;display:flex;align-items:center;gap:7px;}.brand .dot{width:7px;height:7px;border-radius:50%;background:var(--gold);}
  .topic{font-size:12px;color:#9DA8B8;margin-top:3px;}
  .gauge{margin-top:11px;}.gauge .lab{display:flex;justify-content:space-between;font-size:11px;color:#9DA8B8;margin-bottom:4px;}.gauge .lab b{color:#fff;}
  .gbar{height:6px;background:rgba(255,255,255,.1);border-radius:4px;overflow:hidden;}.gbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#D9B362);border-radius:4px;transition:width .4s;}
  .chips{padding:10px 14px 4px;display:flex;flex-wrap:wrap;gap:5px;border-bottom:1px solid rgba(255,255,255,.08);}
  .pchip{font-size:11px;background:rgba(255,255,255,.08);color:#C7D0DD;border-radius:12px;padding:3px 9px;}.pchip b{color:#fff;}
  .msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:11px;}
  .msg{font-size:13.5px;line-height:1.55;max-width:92%;}
  .msg.ai{align-self:flex-start;background:rgba(255,255,255,.07);padding:9px 12px;border-radius:3px 12px 12px 12px;}
  .msg.me{align-self:flex-end;background:var(--gold);color:#231a06;padding:9px 12px;border-radius:12px 3px 12px 12px;font-weight:500;}
  .msg.ai .q{color:#C8B98E;font-size:11px;display:block;margin-top:5px;}
  .linput{padding:11px 12px;border-top:1px solid rgba(255,255,255,.08);display:flex;gap:7px;}
  .linput input{flex:1;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);border-radius:9px;padding:10px 12px;color:#fff;font-size:14px;font-family:inherit;}
  .linput input::placeholder{color:#8896A8;}.linput input:focus{outline:none;border-color:var(--gold);}
  .linput button{background:var(--gold);border:none;border-radius:9px;width:42px;color:#231a06;font-size:16px;cursor:pointer;}
  .linbtns{display:flex;flex-direction:column;gap:6px;flex:none;}
  .linbtns>button,.linbtns>.mic{width:44px;height:34px;min-height:34px;padding:0;margin:0;display:flex;align-items:center;justify-content:center;font-size:15px;line-height:1;}
  .linput textarea{min-height:74px;}
  .right{flex:1;background:var(--paper);overflow-y:auto;position:relative;}
.split{width:6px;flex:none;cursor:col-resize;background:var(--panel);position:relative;z-index:6;border-left:1px solid rgba(255,255,255,.06);}
.split:hover,.split.drag{background:var(--gold);}
.split::after{content:"";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:2px;height:30px;border-radius:2px;background:rgba(255,255,255,.4);}
  .rtop{position:sticky;top:0;z-index:5;background:rgba(243,241,236,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:9px 22px;display:flex;justify-content:space-between;align-items:center;}
  .rt{display:flex;gap:8px;align-items:center;}
  .tbtn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 11px;font-size:12.5px;cursor:pointer;color:var(--slate);font-family:inherit;white-space:nowrap;}.tbtn:hover{border-color:var(--navy);color:var(--navy);}
  .modal{display:none;position:fixed;inset:0;background:rgba(23,38,58,.5);z-index:50;align-items:center;justify-content:center;}.modal.on{display:flex;}
  .mbox{background:#fff;border-radius:14px;width:min(440px,90vw);max-height:80vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3);}
  .mhead{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line);font-size:15px;}
  .mx{border:none;background:none;font-size:16px;cursor:pointer;color:var(--mute);}
  .mlist{overflow-y:auto;padding:10px;}
  .litem{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;}
  .litem .li-main{flex:1;min-width:0;cursor:pointer;}.litem .li-t{font-size:14px;font-weight:600;color:var(--ink);}.litem .li-s{font-size:12px;color:var(--mute);margin-top:2px;}
  .litem .li-del{border:none;background:none;color:var(--red);cursor:pointer;font-size:13px;}
  .libempty{text-align:center;color:var(--mute);font-size:13px;padding:30px 10px;}
  @media print{
    html,body{height:auto;overflow:visible;background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    .left,.rtop,#start,.modal,.split{display:none!important;}
    .app{display:block;height:auto;}
    .right{flex:none;overflow:visible;height:auto;background:#fff;}
    .deck{padding:0!important;}
    .slide{break-inside:avoid;page-break-inside:avoid;page-break-after:always;margin:0!important;border:none!important;border-radius:0!important;box-shadow:none!important;}
    .canvas{min-height:auto;}
    body:not(.notes-on) .notes{display:none!important;}
  }
  .rtop .lt{display:flex;align-items:center;gap:11px;font-size:13px;color:var(--slate);}
  .collapse{border:1px solid var(--line);background:var(--card);border-radius:8px;width:30px;height:30px;cursor:pointer;color:var(--slate);font-size:15px;}
  .toggle{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;font-size:13px;}.toggle button{border:none;background:var(--card);padding:6px 13px;cursor:pointer;color:var(--slate);font-family:inherit;font-size:13px;}.toggle button.on{background:var(--ink);color:#fff;}
  .deck{max-width:780px;margin:0 auto;padding:22px 22px 80px;}
  .slide{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:18px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.05);cursor:pointer;transition:border-color .2s;}
  .slide.sel{border-color:var(--navy);box-shadow:0 0 0 2px var(--navybg);}.slide.peak{border-color:#E4C9A0;}
  .slide.working{position:relative;}.slide.working .canvas{opacity:.4;}
  .slide.working::after{content:"✍️ 작성자가 작성 중…";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--navy);color:#fff;font-size:13px;font-weight:600;padding:9px 18px;border-radius:22px;z-index:4;box-shadow:0 6px 18px rgba(0,0,0,.22);animation:pulse 1.1s ease-in-out infinite;white-space:nowrap;}
  @keyframes pulse{0%,100%{opacity:.78;}50%{opacity:1;}}
  .slide.flash{animation:fl 1.2s ease;}@keyframes fl{0%{box-shadow:0 0 0 3px #E4C9A0;}100%{box-shadow:0 1px 3px rgba(0,0,0,.05);}}
  .canvas{min-height:440px;padding:32px 40px;display:flex;flex-direction:column;position:relative;}
  .stag{position:absolute;top:16px;right:20px;font-size:11px;color:var(--mute);}
  .eyebrow{font-size:11px;font-weight:700;letter-spacing:.06em;padding:3px 10px;border-radius:5px;align-self:flex-start;margin-bottom:10px;}
  .stitle{font-size:26px;font-weight:700;line-height:1.25;letter-spacing:-.01em;}.ssub{font-size:14px;color:var(--slate);margin-top:4px;}
  .concl{font-size:15.5px;font-weight:500;color:var(--navy);margin:12px 0 6px;padding-left:12px;border-left:3px solid var(--gold);line-height:1.5;}
  .cbody{flex:1;margin-top:12px;display:flex;flex-direction:column;gap:11px;}
  ul.bul{margin:0;padding:0;list-style:none;}ul.bul li{font-size:14px;color:var(--slate);margin:6px 0;padding-left:18px;position:relative;line-height:1.55;}ul.bul li::before{content:"";position:absolute;left:2px;top:8px;width:6px;height:6px;border-radius:50%;background:var(--gold);}
  .edt{cursor:text;border-radius:5px;transition:background .15s,box-shadow .15s;}
  .edt:hover{background:rgba(176,133,43,.10);box-shadow:0 0 0 3px rgba(176,133,43,.10);}
  .edt:focus{outline:2px solid var(--gold);outline-offset:2px;background:#fff;}
  .cover .edt:hover{background:rgba(255,255,255,.08);box-shadow:none;}
  .cover .edt:focus{background:rgba(255,255,255,.12);}
  table.t{width:100%;border-collapse:collapse;font-size:12.5px;}table.t th,table.t td{border:1px solid var(--line);padding:6px 10px;text-align:left;}table.t th{background:var(--slatebg);font-weight:600;}table.t td{color:var(--slate);}
  .cards{display:flex;gap:12px;}.cd{flex:1;border:1px solid var(--line);border-radius:11px;padding:15px 16px;background:var(--paper);}.cd .l{font-size:12.5px;color:var(--gold);font-weight:800;letter-spacing:.02em;}.cd .x{font-size:13px;color:var(--slate);margin-top:6px;line-height:1.55;}
  .stats{display:flex;gap:12px;margin:4px 0;}
  .stat{flex:1;background:var(--navybg);border:1px solid var(--line);border-radius:12px;padding:16px 12px;text-align:center;}
  .stat .v{font-size:27px;font-weight:800;color:var(--navy);line-height:1.05;}.stat .v .u{font-size:15px;font-weight:700;margin-left:1px;}
  .stat .l{font-size:12px;color:var(--slate);margin-top:7px;font-weight:600;}
  .stat.hl{background:var(--goldbg);border-color:#E8D9B0;}.stat.hl .v{color:var(--gold);}
  .stat.warn{background:var(--redbg);border-color:#F2D6D2;}.stat.warn .v{color:var(--red);}
  .stat.good{background:var(--greenbg);border-color:#CFE4DA;}.stat.good .v{color:var(--green);}
  .canvas.center{text-align:center;}
  .canvas.center>.stitle,.canvas.center>.ssub,.canvas.center>.concl{align-self:stretch;}
  .al-left{text-align:left;}.al-center{text-align:center;}.al-right{text-align:right;}
  .canvas.center.edpin{justify-content:flex-start;}
  .canvas.center .eyebrow{align-self:center;}
  .canvas.center .concl{border-left:none;padding-left:0;padding-top:9px;border-top:2px solid var(--gold);display:inline-block;}
  .canvas.center .cbody{align-items:center;width:100%;}
  .canvas.cover.center{justify-content:center;}
  .cover{background:var(--ink);position:relative;}.cpresenter{position:absolute;right:36px;bottom:26px;color:#AEB6C2;font-size:13px;text-align:right;line-height:1.4;}
  .canvas.cover{align-items:center;justify-content:center;}
  .cover .csr{position:absolute;top:30px;left:36px;text-align:left;}
  .cover .csrbar{width:24px;height:2px;background:var(--gold);margin-bottom:8px;}
  .cover .csrlab{color:#DCB866;font-size:13px;letter-spacing:.2em;font-weight:500;min-width:60px;}
  .cover .cmid{text-align:center;width:100%;padding:0 26px;}
  .cover .cpre{color:#AEB6C2;font-size:15px;margin-bottom:12px;min-height:1em;}
  .cover .cttl{color:#fff;font-family:'Nanum Myeongjo',serif;font-weight:800;font-size:32px;line-height:1.3;letter-spacing:.005em;}
  .cover .culine{width:50px;height:3px;background:var(--gold);margin:16px auto 0;border-radius:2px;}
  .cover .cmeta{position:absolute;right:36px;bottom:30px;text-align:right;}
  .cover .cmeta .cmd{color:#CDD7E6;font-size:14px;font-weight:500;margin-bottom:7px;}
  .cover .cmeta .cmo,.cover .cmeta .cmb{color:#8FA1BB;font-size:12.5px;line-height:1.75;}
  .canvas.toc{background:#fff;color:var(--ink);align-items:flex-start;text-align:left;}
  .toc .tchip{display:inline-block;background:#F7ECCF;color:#8A6A1E;font-size:12px;font-weight:500;padding:3px 11px;border-radius:6px;letter-spacing:.04em;}
  .toc .thd{display:flex;align-items:baseline;gap:10px;margin-top:13px;}
  .toc .tht{font-size:26px;font-weight:800;color:var(--ink);}
  .toc .the{color:#A9A290;font-size:12px;font-weight:500;letter-spacing:.13em;}
  .toc .trule{width:44px;height:2px;background:var(--ink);margin:13px 0 8px;}
  .toc .tlist{width:100%;}
  .toc .trow{display:flex;align-items:baseline;gap:13px;padding:7px 0;border-bottom:1px solid #ECE7DC;}
  .toc .tnum{color:var(--gold);font-weight:700;font-size:14px;min-width:22px;}
  .toc .ttx{color:#243A5E;font-size:14px;flex:1;}
  .toc .tocdel{border:none;background:transparent;color:#C9C2B2;font-size:13px;cursor:pointer;padding:2px 7px;border-radius:5px;line-height:1;}
  .toc .tocdel:hover{background:#F3EFE6;color:#A33;}
  .toc .tocadd{align-self:flex-start;margin-top:13px;border:1px dashed #D8D2C4;background:transparent;color:#8A7F66;font-size:12.5px;padding:6px 13px;border-radius:7px;cursor:pointer;font-family:inherit;}
  .toc .tocadd:hover{background:#FAF7F0;}
  .toc .tfoot{margin-top:16px;color:#9AA3B2;font-size:11px;}
  .edt:empty:before{content:attr(data-ph);opacity:.38;}
  @media print{.tocadd,.tocdel{display:none!important;}}
  .jebsim{background:#0f1830;border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:15px 17px;color:#E8EBF0;margin-top:6px;}.jebsim .simh{font-weight:700;font-size:14px;margin-bottom:10px;color:#fff;}.jebsim .simrow{display:block;margin:9px 0;font-size:12.5px;}.jebsim .simrow>span{display:block;margin-bottom:4px;color:#AEB6C2;}.jebsim .simrow b{color:var(--gold);}.jebsim input[type=range]{width:100%;accent-color:#C8A75A;}.jebsim .simout{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:13px 0;}.jebsim .simcell{background:rgba(255,255,255,.06);border-radius:8px;padding:8px 10px;}.jebsim .simcell span{display:block;font-size:11px;color:#8896A8;margin-bottom:2px;}.jebsim .simcell b{font-size:16px;color:#fff;}.jebsim .simcell b.warn{color:#FF9B9B;}.jebsim .simcmprow{display:flex;align-items:center;gap:8px;font-size:12px;margin:4px 0;}.jebsim .simcmprow>span{width:30px;color:#8896A8;}.jebsim .simtrk{flex:1;height:13px;background:rgba(255,255,255,.08);border-radius:7px;overflow:hidden;}.jebsim .simtrk i{display:block;height:100%;background:var(--gold);width:0;transition:width .15s;}.jebsim .simtrk i.g{background:#5BB98C;}.jebsim .simgap{text-align:right;font-size:12px;color:#FF9B9B;margin-top:5px;}.jebsim .simfoot{font-size:11px;color:#6b7689;margin-top:9px;}.cover .stitle{color:#fff;font-family:'Nanum Myeongjo',serif;font-weight:800;font-size:33px;line-height:1.32;letter-spacing:.005em;}.cover .ssub{color:#AEB6C2;font-size:15px;margin-top:8px;}.cover .rule{width:48px;height:3px;background:var(--gold);margin:16px 0;border-radius:2px;}.cover.center .rule{margin:16px auto;}.cover .eyebrow{background:transparent;color:#C8B98E;letter-spacing:.16em;padding-left:0;}
  .notes{display:none;background:var(--navybg);border-top:1px solid var(--line);padding:13px 20px;font-size:13px;line-height:1.7;white-space:pre-wrap;}body.notes-on .notes{display:block;}.notes .lab{font-size:11px;font-weight:700;color:var(--navy);margin-bottom:4px;}
  #present{position:fixed;inset:0;z-index:200;background:#0c1322;display:none;flex-direction:column;align-items:center;justify-content:center;}
  #present.on{display:flex;}
  #present .pstage{display:flex;align-items:center;justify-content:center;gap:16px;width:100%;flex:1;padding:16px;box-sizing:border-box;min-height:0;}
  #present #pslide{display:flex;}
  #present .slide{width:min(92vw,1180px);max-height:86vh;overflow:auto;cursor:pointer;border-radius:14px;box-shadow:0 24px 70px rgba(0,0,0,.55);margin:0;}
  #present .canvas{min-height:min(80vh,640px);}
  #present .slide .notes{display:none!important;}
  #present .pnav{background:rgba(255,255,255,.12);color:#fff;border:none;width:52px;height:52px;border-radius:50%;font-size:26px;line-height:1;cursor:pointer;flex:none;transition:background .15s;}
  #present .pnav:hover{background:rgba(255,255,255,.28);}
  #present .pnotes{display:none;max-width:min(92vw,1180px);width:100%;box-sizing:border-box;background:rgba(255,255,255,.08);color:#e6ebf5;border-radius:10px;padding:12px 16px;font-size:13px;line-height:1.6;white-space:pre-wrap;max-height:20vh;overflow:auto;}
  #present.shownotes .pnotes{display:block;}
  #present .pbar{display:flex;align-items:center;gap:14px;color:#cdd6e6;font-size:13px;padding:12px 0 16px;flex:none;}
  #present .pbar button{background:rgba(255,255,255,.1);color:#fff;border:none;padding:7px 14px;border-radius:8px;cursor:pointer;font-size:13px;}
  #present .pbar button:hover{background:rgba(255,255,255,.22);}
  #present .pbar #pcount{min-width:64px;text-align:center;font-weight:600;}
  .chart{margin:4px 0;}
  .chart .cap{font-size:12px;color:var(--slate);margin-top:5px;text-align:center;}
  .dlg{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-top:6px;}
  .dlg .di{font-size:12px;color:var(--slate);display:inline-flex;align-items:center;gap:6px;}
  .dlg .di i{width:9px;height:9px;border-radius:2px;display:inline-block;}
  .ph{max-width:780px;margin:60px auto;text-align:center;color:var(--mute);font-size:14px;}
  .nameln{width:100%;box-sizing:border-box;margin-bottom:10px;padding:11px 14px;border:1px solid var(--line);border-radius:10px;font-size:14px;background:#fff;color:var(--ink);}
  .nameln::placeholder{color:#8896A8;}.nameln:focus{outline:none;border-color:var(--gold);}
  .mic{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 12px;font-size:15px;cursor:pointer;line-height:1;}
  .mic.micsm{padding:7px 9px;font-size:14px;}
  .mic.rec{background:#FDE7E7;border-color:#E45B5B;animation:micpulse 1s ease-in-out infinite;}
  @keyframes micpulse{0%,100%{box-shadow:0 0 0 0 rgba(228,91,91,.5);}50%{box-shadow:0 0 0 6px rgba(228,91,91,0);}}
  .genload{max-width:780px;margin:90px auto;display:flex;flex-direction:column;align-items:center;gap:15px;text-align:center;}
  .genspin{width:46px;height:46px;border:4px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:spin .9s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .genmsg{font-size:16px;font-weight:600;color:var(--ink);}
  .gensub{font-size:13px;color:var(--mute);}
  .gendots::after{content:'';animation:dots 1.4s steps(4,end) infinite;}
  @keyframes dots{0%{content:'';}25%{content:'.';}50%{content:'..';}75%{content:'...';}}
  /* 시작 화면 */
  #start{position:fixed;inset:0;z-index:50;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;}
  #start .brand2{font-size:14px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:8px;}#start .brand2 .dot{width:8px;height:8px;border-radius:50%;background:var(--gold);}
  #start h1{font-family:'Nanum Myeongjo',serif;font-size:29px;color:var(--ink);margin:10px 0 4px;font-weight:800;}
  #start .sub{font-size:14px;color:var(--slate);margin-bottom:24px;text-align:center;}
  #start .domains{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap;justify-content:center;}
  #start .dom{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:13px 18px;cursor:pointer;text-align:center;min-width:108px;transition:.15s;}
  #start .dom:hover{border-color:var(--navy);}#start .dom.on{border-color:var(--gold);background:var(--goldbg);box-shadow:0 0 0 2px var(--goldbg);}
  #start .dom .ic{font-size:21px;}#start .dom .nm{font-size:13.5px;font-weight:600;color:var(--ink);margin-top:4px;}
  #start .inwrap{width:100%;max-width:560px;}
  #start .inbox{display:flex;gap:8px;align-items:flex-end;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:9px;box-shadow:0 2px 12px rgba(0,0,0,.05);}
  #start textarea{flex:1;border:none;resize:none;font-family:inherit;font-size:15px;padding:9px 11px;background:transparent;color:var(--ink);min-height:58px;height:58px;max-height:200px;overflow-y:auto;line-height:1.5;}#start textarea:focus{outline:none;}

<script>
let deck={slides:[]}, selectedIdx=null, topic="연금설계", params={}, calc={};

function goMain(){ location.href = MAIN_URL; }

/* ===== 렌더러 ===== */
function elt(t,c){const e=document.createElement(t);if(c)e.className=c;return e;}
function renderChart(c){const wrap=elt('div','chart');const W=560,H=185,pl=46,pb=32,pt=16,pr=20,plotH=H-pb-pt,plotW=W-pl-pr,max=Math.max(...c.series.flatMap(s=>s.values),1),ns='http://www.w3.org/2000/svg';
  const svg=document.createElementNS(ns,'svg');svg.setAttribute('viewBox',`0 0 ${W} ${H}`);svg.setAttribute('width','100%');svg.style.maxWidth='520px';svg.style.display='block';svg.style.margin='0 auto';
  const pal=['#2A4A7F','#B0852B','#C0392B'],y=v=>(H-pb)-(v/max)*plotH;
  if(c.chartType==='donut'){const vals=c.series[0].values,tot=vals.reduce((a,b)=>a+(+b||0),0)||1,cx=W/2,cy=H/2+6,rad=58,sw=26,dpal=['#B0852B','#2A4A7F','#C0392B'];
    const bg=document.createElementNS(ns,'circle');bg.setAttribute('cx',cx);bg.setAttribute('cy',cy);bg.setAttribute('r',rad);bg.setAttribute('fill','none');bg.setAttribute('stroke','#ECEAE3');bg.setAttribute('stroke-width',sw);svg.appendChild(bg);
    const circ=2*Math.PI*rad;let off=0;
    vals.forEach((v,i)=>{const frac=(+v||0)/tot,seg=document.createElementNS(ns,'circle');seg.setAttribute('cx',cx);seg.setAttribute('cy',cy);seg.setAttribute('r',rad);seg.setAttribute('fill','none');seg.setAttribute('stroke',dpal[i%3]);seg.setAttribute('stroke-width',sw);seg.setAttribute('stroke-dasharray',`${frac*circ} ${circ}`);seg.setAttribute('stroke-dashoffset',-off);seg.setAttribute('transform',`rotate(-90 ${cx} ${cy})`);svg.appendChild(seg);off+=frac*circ;});
    const big=document.createElementNS(ns,'text');big.setAttribute('x',cx);big.setAttribute('y',cy-2);big.setAttribute('text-anchor','middle');big.setAttribute('font-size','22');big.setAttribute('font-weight','800');big.setAttribute('fill','#17263A');big.textContent=Math.round((vals[0]||0)/tot*100)+'%';svg.appendChild(big);
    const sub=document.createElementNS(ns,'text');sub.setAttribute('x',cx);sub.setAttribute('y',cy+16);sub.setAttribute('text-anchor','middle');sub.setAttribute('font-size','11');sub.setAttribute('fill','#52606D');sub.textContent=c.labels[0]||'';svg.appendChild(sub);
    const lg=elt('div','dlg');c.labels.forEach((lab,i)=>{const it=elt('span','di');it.innerHTML=`<i style="background:${dpal[i%3]}"></i>${lab} ${vals[i]!=null?vals[i]:''}`;lg.appendChild(it);});wrap.appendChild(svg);wrap.appendChild(lg);if(c.unit){const cap=elt('div','cap');cap.textContent='단위: '+c.unit;wrap.appendChild(cap);}return wrap;}
  const base=document.createElementNS(ns,'line');base.setAttribute('x1',pl);base.setAttribute('y1',H-pb);base.setAttribute('x2',W-pr);base.setAttribute('y2',H-pb);base.setAttribute('stroke','#E2DED5');svg.appendChild(base);
  if(c.chartType==='bar'){const g=c.labels.length,bW=Math.min(46,(plotW/g)/1.6);
    c.labels.forEach((lab,i)=>{const gx=pl+i*(plotW/g)+(plotW/g)/2,v=c.series[0].values[i]||0,x=gx-bW/2;

function parseStart(t){const chips=[];const p={};let m;let retire=null,age=null;
  if(m=t.match(/은퇴[^\d]{0,5}(\d{2})/))retire=+m[1];else if(m=t.match(/(\d{2})\s*세[^\d]{0,3}은퇴/))retire=+m[1];
  const ages=[...t.matchAll(/(\d{2})\s*(?:세|살)/g)].map(x=>+x[1]);age=ages.find(a=>a!==retire)??(ages[0]??null);
  if(age){chips.push(['나이',age]);p.age=age;}
  if(retire){chips.push(['은퇴',retire]);p.retire=retire;}
  if(m=t.match(/(?:월\s*소득|월소득|소득|월)\s*약?\s*([\d,]+)\s*만/)){const v=+m[1].replace(/,/g,'');chips.push(['월소득',v+'만']);p.monthlySalary=v;}
  if(/자산|모아|예금|금융/.test(t)&&(m=t.match(/([\d.]+)\s*억/))){const v=+m[1];chips.push(['자산',v+'억']);p.asset=v;}
  if(/외벌이/.test(t)){chips.push(['외벌이','✓']);p.earner='외벌이';}else if(/맞벌이/.test(t)){chips.push(['맞벌이','✓']);p.earner='맞벌이';}
  const found=Object.keys(p).length;
  return {chips,params:p,pct:Math.max(60,Math.min(95,52+found*9))};
}

function jbMeasureHeights(nodes){
  const meas=document.createElement('div');meas.style.cssText='position:absolute;left:-99999px;top:0;width:716px;';
  const clones=nodes.map(n=>{const c=n.cloneNode(true);const nn=c.querySelector('.notes');if(nn)nn.parentNode.removeChild(nn);return c;});
  clones.forEach(c=>meas.appendChild(c));document.body.appendChild(meas);
  meas.querySelectorAll('.canvas').forEach(cv=>{cv.style.minHeight=(cv.classList.contains('cover')||cv.classList.contains('toc'))?'1000px':'auto';});
  const H=clones.map(c=>c.offsetHeight);
  document.body.removeChild(meas);
  return H;

function jbBuildPrintPages(nodes,H){
  const PAGEH=1030, GAP=26, BIG=820; // BIG보다 큰 장은 단독 / 그 외 2장씩
  const groups=[];let i=0;
  const solo=n=>!!(n.querySelector&&(n.querySelector('.canvas.cover')||n.querySelector('.canvas.toc')));
  while(i<nodes.length){
    if(solo(nodes[i])){groups.push([i]);i++;}
    else if(H[i]>BIG){groups.push([i]);i++;}
    else if(i+1<nodes.length&&!solo(nodes[i+1])&&H[i+1]<=BIG){groups.push([i,i+1]);i+=2;}
    else{groups.push([i]);i++;}
  }
  return groups.map(g=>{
    const sum=g.reduce((a,idx)=>a+(H[idx]||1),0);
    const avail=PAGEH-GAP*(g.length-1)-6;            // 페이지 안에 들어갈 총 높이
    const sc=Math.min(1,avail/(sum||1));             // 한 페이지 = 한 배율(상하 통일)
    const slots=g.map(idx=>{
      const hh=Math.max(1,Math.round((H[idx]||1)*sc)); // 슬롯 높이 = 축소된 실제 높이 → 위에서부터 자연스럽게 쌓임
      return '<div class="slot" style="height:'+hh+'px"><div class="sc" style="transform:scale('+sc.toFixed(4)+')">'+nodes[idx].outerHTML+'</div></div>';
    }).join('');
    return '<div class="page">'+slots+'</div>';
  }).join('');
}

  function incMarg(b){var c=[1400,5000,8800,15000,30000,50000,100000],r=[6,15,24,35,38,40,42];for(var i=0;i<c.length;i++){if(b<=c[i])return r[i];}return 45;}
  // 누진 상속세 (억 과표 → 억 세액)
  function estTaxF(b){var br=[[1,0.10],[5,0.20],[10,0.30],[30,0.40],[1e9,0.50]];var t=0,p=0;for(var i=0;i<br.length;i++){if(b>p){t+=(Math.min(b,br[i][0])-p)*br[i][1];p=br[i][0];}else break;}return t;}

  // ── 도메인 계산기 (간이 미러 · 참고용) ──
  function calcPension(d){
    var ca=num(d.ca),ra=num(d.ra),le=num(d.le)||90,exp=num(d.exp)*MAN,asset=num(d.asset),
        rr=num(d.rate)/100,inf=num(d.infl)/100,dep=num(d.dep)*MAN,depy=num(d.depy);
    if(!inf)inf=0.025;
    var yTo=Math.max(0,ra-ca),yIn=Math.max(1,le-ra);
    var depY=Math.min(Math.max(0,depy),yTo);
    var rm=Math.pow(1+rr,1/12)-1,Nd=Math.round(depY*12);
    var assetFV=asset*Math.pow(1+rr,yTo);
    var contribEnd=rm===0?dep*Nd:dep*(Math.pow(1+rm,Nd)-1)/rm;
    var contribFV=contribEnd*Math.pow(1+rr,Math.max(0,yTo-depY));
    var corpus=assetFV+contribFV;
    var futExp=exp*Math.pow(1+inf,yTo);
    var rRecv=rr*0.7,rmY=(1+rRecv)/(1+inf)-1,rmr=Math.pow(1+rmY,1/12)-1,Nr=yIn*12;
    var recv=rmr===0?corpus/Nr:corpus*rmr/(1-Math.pow(1+rmr,-Nr));
    return {corpus:corpus,futExp:futExp,recv:recv,gap:Math.max(0,futExp-recv),years:yIn,_need:futExp,_have:recv};
  }
  function calcInsurance(d){
    var surv=num(d.surv)*MAN,supy=num(d.supy),edu=num(d.edu)*EOK,cover=num(d.cover)*EOK;
    var need=surv*12*supy+edu;var gap=Math.max(0,need-cover);
    return {needCover:need,gapCover:gap,_need:need,_have:cover};
  }
  function calcAsset(d){
    var fin=num(d.fin),oth=num(d.oth); // 만원/년
    var sep=Math.min(fin,2000),comp=Math.max(0,fin-2000);
    var sepTax=sep*0.154; // 분리과세 15.4%
    var compTax=comp>0?(incTax(oth+comp)-incTax(oth)):0; // 종합 합산분 한계 추가세
    var tax=(sepTax+compTax)*MAN;
    var marg=fin>2000?incMarg(oth+comp):15.4;
    return {taxMode:fin>2000?1:0,taxAmt:tax,margRate:marg};
  }
  function calcCorp(d){
    var ta=num(d.tasset),cash=num(d.cash),spouse=num(d.spouse);
    var ded=5+(spouse?5:0); // 일괄공제 5억 + 배우자공제(간이 5억)
    var baseB=Math.max(0,ta-ded);
    var tax=estTaxF(baseB),liq=ta*cash/100,gap=Math.max(0,tax-liq);
    return {estTax:tax*EOK,liquidity:liq*EOK,gapLiq:gap*EOK,_need:tax*EOK,_have:liq*EOK};
  }
  var DOM={
    pension:{calc:calcPension,fmt:{corpus:eok,recv:man,futExp:man,gap:man,years:yrf},barfmt:man,barpre:'월 '},
    insurance:{calc:calcInsurance,fmt:{needCover:eok,gapCover:eok},barfmt:eok,barpre:''},
    asset:{calc:calcAsset,fmt:{taxAmt:man,margRate:pctf,taxMode:function(v){return v?'종합과세 대상':'분리과세';}}},
    corporate:{calc:calcCorp,fmt:{estTax:eok,liquidity:eok,gapLiq:eok},barfmt:eok,barpre:''}
  };
  var UNIT={dep:'만원',depy:'년',rate:'%',ra:'세',exp:'만원',surv:'만원',supy:'년',edu:'억',cover:'억',fin:'만원',oth:'만원',tasset:'억',cash:'%',child:'명',spouse:''};
  function slabel(k,v){if(k==='spouse')return (+v?'있음':'없음');if(UNIT[k]==='%')return (+v).toFixed(1)+'%';if(k==='edu'||k==='cover'||k==='tasset')return (+v)+UNIT[k];return (+v).toLocaleString()+UNIT[k];}
  var VARS=['ca','ra','le','asset','infl','exp','dep','depy','rate','surv','supy','edu','cover','fin','oth','tasset','cash','child','spouse'];
  function readData(root){var d={};for(var i=0;i<VARS.length;i++){var k=VARS[i],s=q(root,'[data-k="'+k+'"]');d[k]=s?s.value:root.getAttribute('data-'+k);}return d;}
  function update(root){
    if(!root)return;
    var D=DOM[root.getAttribute('data-domain')||'pension']||DOM.pension;
    var ss=root.querySelectorAll('input[data-k]');
    for(var i=0;i<ss.length;i++){var k=ss[i].getAttribute('data-k'),lab=q(root,'[data-v="'+k+'"]');if(lab)lab.textContent=slabel(k,ss[i].value);}
    var r=D.calc(readData(root));
    for(var key in r){if(key.charAt(0)==='_')continue;var e=q(root,'[data-o="'+key+'"]');if(e){var f=D.fmt[key];e.textContent=f?f(r[key]):r[key];}}
    if(r._need!=null&&r._have!=null){var base=Math.max(r._need,r._have,1),bn=q(root,'[data-bar="need"]'),bh=q(root,'[data-bar="recv"]');
      if(bn)bn.style.width=(r._need/base*100).toFixed(1)+'%';if(bh)bh.style.width=(r._have/base*100).toFixed(1)+'%';
      var gp=q(root,'[data-o="gapnote"]');if(gp){var g=Math.max(0,r._need-r._have);gp.textContent=g>0?((D.barpre||'')+(D.barfmt||eok)(g)+' 부족'):'충족 \u2713';}}
  }
  // ── 3단계: 시나리오 그룹 링크(선택적 동기화) ──
  function peers(root){var g=root.getAttribute('data-link');if(!g)return [root];return Array.prototype.slice.call(document.querySelectorAll('.jebsim[data-link="'+g+'"]'));}
  function readState(root){var o={};for(var i=0;i<VARS.length;i++){var k=VARS[i],s=q(root,'[data-k="'+k+'"]');if(s)o[k]=s.value;}return o;}
  function applyState(root,st){for(var k in st){if(st[k]==null)continue;root.setAttribute('data-'+k,st[k]);var s=q(root,'[data-k="'+k+'"]');if(s)s.value=st[k];}}
  function sync(root){if(!root)return;var st=readState(root);var g=peers(root);for(var i=0;i<g.length;i++){applyState(g[i],st);update(g[i]);}}
  function initAll(){var ns=document.querySelectorAll('.jebsim'),seen={},i,g;for(i=0;i<ns.length;i++){g=ns[i].getAttribute('data-link');if(g&&!seen[g])seen[g]=readState(ns[i]);}for(i=0;i<ns.length;i++){g=ns[i].getAttribute('data-link');if(g&&seen[g])applyState(ns[i],seen[g]);try{update(ns[i]);}catch(e){}}}
  // 인라인 oninput에만 의존하지 않도록 document 위임 리스너(발표 복제본·환경 무관 동작)
  document.addEventListener('input',function(e){var s=e.target;if(s&&s.getAttribute&&s.getAttribute('data-k')&&s.closest){var r=s.closest('.jebsim');if(r)sync(r);}},true);
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',initAll);else initAll();
  return {calc:calcPension,dom:DOM,update:update,sync:sync,initAll:initAll};
})();
</script>
</body>
</html>
