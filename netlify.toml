[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/thumbnails/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
[[edge_functions]]
  path = "/client-daily.html"
  function = "client-daily"

[[redirects]]
  from = "/briefing"
  to = "https://briefingog-cvmdsjgzxa-du.a.run.app"
  status = 200
  force = true

[[redirects]]
  from = "/channel"
  to = "https://channelog-cvmdsjgzxa-du.a.run.app"
  status = 200
  force = true

# ── 컨설턴트 소개카드 공유 (2026-08-09) — ogProxy의 t=ch+card 분기 사용 ──
# /channel(기존 channelOg)은 기존 공유 링크 호환을 위해 그대로 둔다.
[[redirects]]
  from = "/card"
  to = "https://ogproxy-cvmdsjgzxa-du.a.run.app"
  status = 200
  force = true

# ── 지난 브리핑 아카이브 폐지 (2026-08-22) — 링크 게이트 도입과 함께 client-archive.html 삭제 ──
# 북마크 재방문을 데일리 리포트로 인계. 쿼리스트링(fc= 등)은 자동 전달되므로
# 발효일(20260824)부터는 서명 없는 접근 → 잠금 화면 → '오늘 일자 리포트 요청' 퍼널로 흡수된다.
[[redirects]]
  from = "/client-archive*"
  to = "/client-daily.html"
  status = 301
  force = true

# ── FC 전용 채널 URL — jarvia.co.kr/@gildong → fc.html?id=gildong ──
# (splat 대신 named placeholder 사용 - Netlify 매칭 안정성 향상)
[[redirects]]
  from = "/@:handle"
  to = "/fc.html?id=:handle"
  status = 200
