[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/thumbnails/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
[[edge_functions]]
  path = "/client-daily.html"
  function = "client-daily"

[[redirects]]
  from = "/briefing"
  to = "https://asia-northeast3-kfpc-company-support-project.cloudfunctions.net/ogProxy"
  status = 200
  force = true

# ── FC 전용 채널 URL — jarvia.co.kr/@gildong → fc.html?id=gildong ──
[[redirects]]
  from = "/@*"
  to = "/fc.html?id=:splat"
  status = 200
