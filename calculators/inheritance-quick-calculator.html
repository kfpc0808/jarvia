<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>간편 상속세 계산기 | JARVIA 재무계산기</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --navy:#15294a; --navy-line:#2f4570; --gold:#e0b65a; --gold-deep:#8a5a12;
  --ground:#fbf8f2; --paper:#fff; --line:#e2dccd; --line-strong:#cfc7b4;
  --ink:#15294a; --mute:#56637a; --mute-on-navy:#c3cee0; --tint:#efe9da; --off:#8792a6;
  --sans:'Pretendard','Noto Sans KR',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --serif:'Noto Serif KR','Nanum Myeongjo',serif;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{height:100%;margin:0}
body{font-family:var(--sans);color:var(--ink);background:#ece7da;-webkit-font-smoothing:antialiased;
  word-break:keep-all;overflow-wrap:anywhere}
button{font-family:inherit;cursor:pointer;color:inherit;-webkit-tap-highlight-color:transparent}
input{font-family:inherit}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--gold-deep);outline-offset:2px}

/* ── 틀: 머리(얇게) · 본문(스크롤) · 하단 버튼 ── */
.app{height:100vh;height:100dvh;max-width:480px;margin:0 auto;background:var(--ground);
  display:flex;flex-direction:column;overflow:hidden;position:relative}
@media (min-width:600px){
  body{padding:24px 0}
  .app{height:calc(100vh - 48px);height:calc(100dvh - 48px);border:1px solid var(--line-strong);border-radius:6px}
}
.head{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:env(safe-area-inset-top) 8px 0;color:var(--mute);background:var(--ground)}
.head.res{background:var(--navy);color:#fff}
.hbtn{width:44px;height:44px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;
  text-decoration:none;color:inherit;font-size:12px;font-weight:700}
.hbtn.hide{visibility:hidden}
.htitle{font-size:13px;letter-spacing:.16em;font-weight:500;white-space:nowrap}
.bar{flex:none;display:flex;gap:6px;padding:0 20px 2px;background:var(--ground)}
.bar.res{background:var(--navy)}
.bar button{flex:1;height:13px;padding:5px 0;border:0;background:transparent}
.bar i{display:block;height:3px;background:var(--line)}
.bar .on i{background:var(--navy)}
.bar.res i{background:#3d5786}
.bar.res .on i{background:var(--gold)}
.body{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.body::-webkit-scrollbar{width:0;height:0}
.foot{flex:none;display:flex;gap:10px;padding:8px 20px calc(8px + env(safe-area-inset-bottom));
  background:var(--ground);border-top:1px solid var(--line)}

@keyframes nx{from{transform:translateX(32px);opacity:0}to{transform:none;opacity:1}}
@keyframes pv{from{transform:translateX(-32px);opacity:0}to{transform:none;opacity:1}}
.pg.next{animation:nx .24s ease-out}
.pg.prev{animation:pv .24s ease-out}
@media (prefers-reduced-motion:reduce){.pg{animation:none!important}}

/* ── 입력 화면 공통 ── */
.pad{padding:18px 20px 22px;display:flex;flex-direction:column;gap:22px}
.eyebrow{font-size:12px;letter-spacing:.14em;font-weight:700;color:var(--gold-deep)}
h1{margin:8px 0 0;font-family:var(--serif);font-weight:700;font-size:26px;line-height:1.34;letter-spacing:-.01em}
h2{margin:0;font-family:var(--serif);font-size:18px;font-weight:700}
.lab{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--mute)}
.hint{font-size:12px;line-height:1.6;color:var(--mute)}
.fld{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.ctr{display:flex;align-items:center;justify-content:space-between}
.under{border-bottom:1px solid var(--navy);padding-bottom:8px}
.rnd{flex:none;width:48px;height:48px;border:1px solid var(--line-strong);border-radius:50%;background:var(--paper);
  display:flex;align-items:center;justify-content:center;font-size:22px;line-height:1}
.rnd.sm{width:44px;height:44px}
.big{border:0;background:transparent;text-align:right;font-family:var(--serif);font-weight:700;line-height:1.1;
  color:var(--ink);padding:0;min-width:0;border-radius:0}
.big:focus{outline:none}
.unit{font-size:17px;font-weight:500;color:var(--mute);white-space:nowrap}
.grid{display:grid;gap:8px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.chip{min-height:46px;padding:0 4px;border:1px solid var(--line-strong);background:var(--paper);border-radius:4px;
  font-size:15px;font-weight:700}
.chip.on{border-color:var(--navy);background:var(--navy);color:#fff}
.chip:disabled{color:var(--off);background:#f3efe5;cursor:default}
.chip.q{font-size:14px;font-weight:500}
.chip.tall{min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.chip.tall small{font-size:12px;font-weight:500;color:var(--mute)}
.chip.tall b{font-family:var(--serif);font-size:18px}
.chip.tall.on small{color:var(--mute-on-navy)}
.chip.tall.on b{color:var(--gold)}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border:1px solid var(--navy);border-radius:4px;overflow:hidden}
.seg button{min-height:48px;border:0;background:transparent;font-size:15px;font-weight:700}
.seg button.on{background:var(--navy);color:#fff}
.mode{min-height:80px;padding:13px 16px;border:1px solid var(--line-strong);background:var(--paper);border-radius:4px;
  text-align:left;display:flex;flex-direction:column;gap:6px}
.mode b{font-size:16px}
.mode span{font-size:13px;line-height:1.45;color:var(--mute)}
.mode.on{border-color:var(--navy);background:var(--navy);color:#fff}
.mode.on span{color:var(--mute-on-navy)}
.note{padding:14px 16px;background:var(--paper);border:1px solid var(--line);border-radius:4px;
  display:flex;flex-direction:column;gap:8px}
.note b{font-size:14px}
.meter{height:6px;background:var(--line)}
.meter i{display:block;height:6px;background:var(--navy)}
.meter.over i{background:var(--gold-deep)}
.link{min-height:44px;padding:0 4px;border:0;background:transparent;color:var(--mute);font-size:13px;text-decoration:underline}
.tl{display:flex;flex-direction:column;gap:10px;padding:16px;background:var(--navy);border-radius:4px;color:#fff}
.tl .ages{display:flex;justify-content:space-between;font-family:var(--serif);font-size:20px;font-weight:700}
.tl .seg3{display:flex;height:8px;gap:2px}
.tl .legs{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--mute-on-navy)}
.gold{color:var(--gold)}

/* ── 결과 화면 ── */
.hero{background:var(--navy);color:#fff;padding:10px 20px 20px;display:flex;flex-direction:column;gap:6px}
.hero .sum{font-size:13px;color:var(--mute-on-navy);line-height:1.5}
.hero .hl{font-family:var(--serif);font-size:18px;font-weight:500;line-height:1.5;padding-top:6px}
.hero .num{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;color:var(--gold);font-family:var(--serif);font-weight:700}
.hero .num b{font-size:clamp(40px,15vw,60px);line-height:1.1;letter-spacing:-.02em}
.hero .num span{font-size:22px}
.basis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));margin-top:12px;border:1px solid #5a6f96;border-radius:4px;overflow:hidden}
.basis button{min-height:44px;padding:4px;border:0;background:transparent;color:#fff;font-size:13px;font-weight:700}
.basis button.on{background:var(--gold);color:var(--navy)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--navy);color:#fff;border-top:1px solid var(--navy-line)}
.stats div{padding:12px 6px 14px 12px;min-width:0}
.stats div+div{border-left:1px solid var(--navy-line)}
.stats small{display:block;font-size:11px;color:var(--mute-on-navy);margin-bottom:6px}
.stats b{font-family:var(--serif);font-size:14px}
.stats .cap{grid-column:1/-1;border-left:0;border-top:1px solid var(--navy-line);padding:8px 12px 10px;
  font-size:11px;color:var(--mute-on-navy)}
.sec{padding:24px 20px 0;display:flex;flex-direction:column;gap:12px}
.chart{display:block;width:100%;height:auto}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:12px;color:var(--mute)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;background:var(--navy)}
.legend i.g{background:var(--gold)}
.tax{margin:24px 20px 0}
.tax .tr{display:flex;justify-content:space-between;gap:12px;font-size:13px;line-height:1.5}
.tax .tr span{color:var(--mute)}
.tax .tr b{white-space:nowrap}
.tax .tr b.no{color:var(--gold-deep)}
.tax p{margin:0;padding-top:10px;border-top:1px solid var(--line);font-size:12px;line-height:1.55;color:var(--mute)}
.cmp{display:flex;flex-direction:column;gap:6px}
.cmp .bar2{height:10px;background:var(--navy)}
.cmp.later{color:var(--mute)}
.cmp.later .bar2{background:#b8c2d4}
.cmp b{font-family:var(--serif);font-size:17px;white-space:nowrap}
.cmp .row span{font-size:13px;font-weight:700}
.say{font-size:14px;line-height:1.6;padding:12px 14px;background:var(--tint);border-radius:4px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:62px;padding:10px 14px;
  border:1px solid var(--line);background:var(--paper);text-align:left;border-radius:4px;width:100%}
.opt .t{display:flex;flex-direction:column;gap:3px;min-width:0}
.opt .t b{font-size:15px}
.opt .t span{font-size:12px;color:var(--mute)}
.opt>b{font-family:var(--serif);font-size:17px;white-space:nowrap}
.opt.on{border-color:var(--navy);background:var(--navy);color:#fff}
.opt.on .t span{color:var(--mute-on-navy)}
.opt.on>b{color:var(--gold)}
.fine{padding:20px 20px 22px;font-size:11px;line-height:1.7;color:var(--mute)}
.fine a{color:var(--mute)}

.cta{flex:1;min-width:0;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:50px;padding:0 18px;
  background:var(--navy);color:#fff;border:0;border-radius:4px;font-size:16px;font-weight:700;text-decoration:none}
.cta:disabled{background:var(--off);cursor:default}
.cta.center{justify-content:center;text-align:center;font-size:15px;padding:0 10px}
.ghost{flex:none;min-height:50px;padding:0 16px;border:1px solid var(--navy);background:transparent;border-radius:4px;
  font-size:14px;font-weight:700}
/* ── 세로 태블릿: 화면 넘김 방식 유지, 전체를 1.25배로 키움 ── */
@media (min-width:600px) and (max-width:899px) and (min-height:700px){
  .app{max-width:720px}
  .head,.bar,.foot,.body>.pg{zoom:1.25}
}
/* ── 가로로 누운 휴대폰 등 낮은 화면: 바깥 여백 제거 ── */
@media (max-height:520px){
  body{padding:0}
  .app{height:100vh;height:100dvh;border:0;border-radius:0}
}
/* ── 가로 태블릿·PC: 왼쪽 입력 / 오른쪽 결과 2단 (내용은 휴대폰과 동일) ── */
.app.wide{max-width:1240px}
.wide .bar,.wide .foot{display:none}
.wide .head{border-bottom:1px solid var(--line);padding-bottom:0}
.wide .body{overflow:hidden;display:flex}
.cols{display:flex;flex:1;min-height:0;min-width:0;width:100%}
.col-l{flex:0 0 clamp(300px,40%,460px);min-width:0;overflow-y:auto;overflow-x:hidden;border-right:1px solid var(--line);scrollbar-width:thin}
.col-r{flex:1;min-width:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin}
.col-l section+section{border-top:1px solid var(--line)}
.wide .pad{padding:22px 28px 24px;gap:20px}
.wide h1{font-size:22px}
.wide h1 br{display:none}
.wide .chart{max-width:560px}
.wide .hero{padding:22px 32px 24px}
.wide .hero .hl{font-size:20px}
.wide .hero .num b{font-size:72px}
.wide .hero .num span{font-size:26px}
.wide .stats div{padding:16px 10px 18px 32px}
.wide .stats small{font-size:12px}
.wide .stats b{font-size:17px}
.wide .stats .cap{padding:10px 32px 12px;font-size:12px}
.wide .sec{padding:28px 32px 0}
.wide .tax{margin:28px 32px 0}
.wide .fine{padding:24px 32px 12px;font-size:12px}
.more{padding:8px 32px 28px;display:flex}
.empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:40px;text-align:center}
.empty b{font-family:var(--serif);font-size:22px}
.empty span{font-size:14px;color:var(--mute);line-height:1.6}
@media (max-height:520px){
  .wide .hero .num b{font-size:52px}
  .wide .pad{padding:16px 20px 18px}
  .wide .hero,.wide .sec,.wide .fine{padding-left:22px;padding-right:22px}
  .wide .tax{margin-left:22px;margin-right:22px}
  .wide .stats div{padding-left:22px}
  .wide .stats .cap,.more{padding-left:22px;padding-right:22px}
}
.err{margin:24px 20px;padding:16px;border:1px solid var(--gold-deep);border-radius:4px;font-size:14px;line-height:1.6}

/* ── 간편 상속세 계산기 전용 ── */
.opt .t b{overflow-wrap:anywhere}
.tag{flex:none;font-size:12px;font-weight:700;white-space:nowrap}
.tag.no{color:var(--gold-deep)}
.tag.ex{color:var(--mute);font-weight:500}
.m2{display:flex;height:10px;background:var(--line);overflow:hidden}
.m2 i{display:block;height:10px;background:var(--navy)}
.m2 i.p{background:var(--gold)}
.m2.over i.p{background:var(--gold-deep)}
.use{display:flex;flex-direction:column;gap:8px}
.use .row b{font-size:14px}
.use .row span{font-size:13px;color:var(--mute);text-align:right}
.rows{display:flex;flex-direction:column}
.rows .r{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.rows .r:first-child{border-top:0;padding-top:0}
.rows .r .t{display:flex;flex-direction:column;gap:3px;min-width:0}
.rows .r .t b{font-size:14px}
.rows .r .t span{font-size:12px;color:var(--mute);line-height:1.5}
.chk{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.chk li{position:relative;padding-left:14px;font-size:13px;line-height:1.6}
.chk li::before{content:"";position:absolute;left:0;top:.72em;width:5px;height:5px;background:var(--gold-deep)}
.wide .rows .r .t b{font-size:15px}
</style>
</head>

<script src="./lib/calc-corporate.js?v=20260916"></script>
<script>
/* ============================================================
   간편 상속세 계산기 (inheritance-quick-calculator.html)
   · 재산 총액, 배우자 유무, 자녀 수로 예상 상속세와 납부 재원 부족액을 계산
   · 계산식은 공용 엔진(lib/calc-corporate.js → JarviaCalculators.calcInheritanceTax)을
     그대로 사용 (계산식 한 곳 원칙). 공제액·세율은 모두 엔진 결과에서 가져옴
   · 정밀 계산은 inheritance-tax-calculator.html 로 연결
   ============================================================ */
(function(){
'use strict';

var BASIS = '상속세 및 증여세법 현행 기준 (자비아 공용 계산 엔진) · 2026년 11월 확인';
var MAX = { total:10000000, fin:10000000, debt:10000000 };   // 만원 (1,000억원)
var KIDS_MAX = 10;
var STEP_NAMES = ['재산', '가족', '결과'];

var J = window.JarviaCalculators;
var S = { step:0, dir:'next', total:200000, fin:30000, debt:0, spouse:true, kids:2, smode:'min' };

var $ = function(id){ return document.getElementById(id); };
function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
function esc(t){ return String(t).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function num(v){ return Math.round(v).toLocaleString('ko-KR'); }
function won(v){
  var n = Math.round(v); if (!(n > 0)) return '0원';
  var eok = Math.floor(n/10000), man = n % 10000, out = '';
  if (eok > 0) out += eok.toLocaleString('ko-KR') + '억';
  if (man > 0) out += (out ? ' ' : '') + man.toLocaleString('ko-KR') + '만';
  return out + '원';
}
function bigNum(v){   // 큰 숫자 표시: [숫자, 단위]
  var n = Math.round(v), eok = Math.floor(n/10000), man = n % 10000;
  if (eok > 0 && man === 0) return [num(eok), '억원'];
  if (eok > 0) return [num(eok) + '억 ' + num(man), '만원'];
  return [num(man), '만원'];
}
function engineOk(){ return J && typeof J.calcInheritanceTax === 'function'; }
function fin(){ return Math.min(S.fin, S.total); }

/* ── 계산 (화면 금액 단위: 만원, 엔진 단위: 원) · mode = 배우자가 받는 재산 가정 ── */
function compute(mode){
  var a = { totalAssets:S.total * 1e4, debts:S.debt * 1e4, financialAssets:fin() * 1e4, hasSpouse:S.spouse, numChildren:S.kids };
  if (S.spouse && S.kids === 0) a.isSingleInheritance = true;          // 배우자만 상속받는 경우로 계산
  if (S.spouse && mode === 'legal') a.spouseInheritance = S.total * 1e4; // 법정 상속분 한도는 엔진이 계산
  var r = J.calcInheritanceTax(a), m = function(k){ return (Number(r[k]) || 0) / 1e4; };
  var o = { tax:m('finalTax'), calc:m('calculatedTax'), report:m('reportDeduction'), base:m('taxBase'), taxable:m('taxableAmount'),
            main:m('mainDeduction'), spouseDed:m('spouseDeduction'), finDed:m('financialDeduction'), totalDed:m('totalDeduction'),
            funeral:m('funeralDeduction'), lump:r.isLumpSum !== false, warnings:r.warnings || [] };
  o.capped = o.main + o.spouseDed + o.finDed > o.totalDed + 0.5;   // 공제가 과세가액을 넘어 잘린 경우
  o.short = Math.max(o.tax - fin(), 0);
  return o;
}

function go(to){
  to = clamp(to, 0, 2);
  if (to > 0 && !(S.total > 0)) to = 0;   // 재산 총액이 없으면 첫 화면에서 멈춤
  S.dir = to >= S.step ? 'next' : 'prev';
  S.step = to; render(true);
}
function set(patch){ for (var k in patch) S[k] = patch[k]; render(false); }

var ARROW = '<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#e0b65a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16M14 6l6 6-6 6"/></svg>';

/* ── 01 재산 ── */
function moneyField(k, label, size, quick, hintId){
  var v = S[k];
  return '<div class="fld"><label class="lab" for="in_' + k + '">' + label + '</label>' +
    '<div class="row under"><input class="big" id="in_' + k + '" data-k="' + k + '" type="text" inputmode="numeric" autocomplete="off" value="' + (v ? num(v) : '') + '" placeholder="0" style="flex:1;font-size:' + size + 'px">' +
    '<span class="unit">만원</span></div>' +
    '<div class="ctr"><span class="hint" id="' + hintId + '"></span><button class="link" type="button" data-act="clear" data-k="' + k + '">지우기</button></div>' +
    (quick ? '<div class="grid g4">' + quick.map(function(q){ return '<button class="chip q" type="button" data-act="add" data-k="' + k + '" data-v="' + q[0] + '">' + q[1] + '</button>'; }).join('') + '</div>' : '') + '</div>';
}
function viewAsset(){
  return '<div class="pad"><div><div class="eyebrow">01 — 재산</div><h1>상속될 재산을 <br>넣어 주세요</h1></div>' +
    moneyField('total', '재산 총액 (부동산·금융재산·보험금 등 전부)', 44, [[10000,'+1억'],[50000,'+5억'],[100000,'+10억'],[500000,'+50억']], 'koTotal') +
    moneyField('fin', '그중 금융재산 (예금·주식·보험금 등)', 30, [[1000,'+1천만'],[5000,'+5천만'],[10000,'+1억'],[50000,'+5억']], 'koFin') +
    moneyField('debt', '채무 (대출·임대보증금 등)', 30, [[1000,'+1천만'],[5000,'+5천만'],[10000,'+1억'],[50000,'+5억']], 'koDebt') +
    '<div class="hint" style="padding-top:12px;border-top:1px solid var(--line)">금융재산은 금융재산 상속공제와 납부 재원 계산에 함께 씁니다. 금융재산과 채무는 비워 두어도 됩니다.</div></div>';
}
function patchAsset(){
  var a = $('koTotal'), b = $('koFin'), c = $('koDebt'), nx = $('btnNext');
  if (a) a.textContent = S.total > 0 ? won(S.total) : '재산 총액을 입력해 주세요';
  if (b) b.textContent = S.fin > S.total && S.total > 0 ? '재산 총액보다 많아 ' + won(S.total) + '으로 계산합니다' : (S.fin > 0 ? won(S.fin) : '없으면 비워 둡니다');
  if (c) c.textContent = S.debt > 0 ? won(S.debt) : '없으면 비워 둡니다';
  if (nx && S.step === 0) nx.disabled = !(S.total > 0);
}

/* ── 02 가족 ── */
function viewFamily(){
  var h = '<div class="pad"><div><div class="eyebrow">02 — 가족</div><h1>상속받을 가족을 <br>알려 주세요</h1></div>' +
    '<div class="fld"><div class="lab">배우자</div><div class="seg">' +
      '<button type="button" class="' + (S.spouse ? 'on' : '') + '" data-act="spouse" data-v="1" aria-pressed="' + S.spouse + '">있음</button>' +
      '<button type="button" class="' + (!S.spouse ? 'on' : '') + '" data-act="spouse" data-v="0" aria-pressed="' + (!S.spouse) + '">없음</button></div></div>' +
    '<div class="fld"><div class="lab">자녀 수</div><div class="ctr under">' +
      '<button class="rnd" type="button" data-act="kids" data-d="-1" aria-label="자녀 한 명 줄이기"' + (S.kids <= 0 ? ' disabled' : '') + '>−</button>' +
      '<div class="row" style="gap:6px"><b style="font-family:var(--serif);font-size:56px;line-height:1.1">' + S.kids + '</b><span class="unit">명</span></div>' +
      '<button class="rnd" type="button" data-act="kids" data-d="1" aria-label="자녀 한 명 늘리기"' + (S.kids >= KIDS_MAX ? ' disabled' : '') + '>+</button></div>' +
      '<div class="hint">' + (S.spouse && S.kids === 0 ? '자녀가 없으면 배우자 혼자 상속받는 경우로 계산합니다. 부모 등 다른 상속인이 있으면 정밀 계산기를 이용해 주세요.'
                              : (!S.spouse && S.kids === 0 ? '부모·형제 등 다른 상속인이 받는 경우로 계산합니다.' : '미성년 자녀, 장애인 공제 등은 정밀 계산기에서 반영할 수 있습니다.')) + '</div></div>';
  if (S.spouse) h += '<div class="fld"><div class="lab">배우자가 받을 재산</div>' +
      '<button class="mode' + (S.smode === 'min' ? ' on' : '') + '" type="button" data-act="smode" data-v="min" aria-pressed="' + (S.smode === 'min') + '"><b>5억원 이하로 가정</b><span>배우자 상속공제를 최소 금액으로 계산합니다</span></button>' +
      '<button class="mode' + (S.smode === 'legal' ? ' on' : '') + '" type="button" data-act="smode" data-v="legal" aria-pressed="' + (S.smode === 'legal') + '"><b>법정 상속분만큼 받는 것으로 가정</b><span>배우자 상속공제를 한도까지 계산합니다</span></button>' +
      '<div class="hint">결과 화면에서 두 경우를 나란히 비교할 수 있습니다.</div></div>';
  return h + '</div>';
}

/* ── 03 결과 ── */
function line(label, v, sign, strong){
  return '<div class="r"><div class="t"><b' + (strong ? '' : ' style="font-weight:500"') + '>' + label + '</b></div>' +
    '<span class="tag' + (strong ? '' : ' ex') + '" style="font-size:' + (strong ? 15 : 14) + 'px">' + (sign || '') + won(v) + '</span></div>';
}
function viewResult(){
  var r = compute(S.smode), f = fin(), net = Math.max(S.total - S.debt, 0);
  var sum = '재산 ' + won(S.total) + ' · 배우자 ' + (S.spouse ? '있음' : '없음') + ' · 자녀 ' + S.kids + '명';
  var big = bigNum(r.tax);
  var h = '<div class="hero"><div class="sum">' + esc(sum) + '</div><div class="hl">예상 상속세</div>' +
    '<div class="num"><b' + (big[0].length > 6 ? ' style="font-size:clamp(30px,10.5vw,52px)"' : '') + '>' + big[0] + '</b><span>' + big[1] + '</span></div>' +
    '<div class="sum">' + (r.tax > 0 ? '채무를 뺀 재산의 약 ' + (net > 0 ? (r.tax / net * 100).toFixed(1) : '0.0') + '% · 기한 안에 신고하는 경우 기준'
                                    : '입력한 조건에서는 공제액이 과세 대상 금액보다 커서 예상 세액이 없습니다') + '</div></div>';
  h += '<div class="stats"><div><small>공제 합계</small><b>' + won(r.totalDed) + '</b></div>' +
    '<div><small>과세표준</small><b>' + won(r.base) + '</b></div>' +
    '<div><small>부족한 납부 재원</small><b class="gold">' + won(r.short) + '</b></div>' +
    '<div class="cap">부족한 납부 재원은 예상 세액에서 금융재산을 뺀 금액입니다</div></div>';

  h += '<div class="sec"><h2>계산 흐름</h2><div class="rows">' +
    line('재산 총액', S.total, '', true) +
    line('채무·장례비용', S.debt + r.funeral, '− ') +
    line('과세가액' + (S.debt + r.funeral > S.total ? ' (0원 미만은 0원)' : ''), r.taxable, '', true) +
    line(r.lump ? '일괄공제' : '기초공제·인적공제', r.main, '− ') +
    (S.spouse ? line('배우자 상속공제', r.spouseDed, '− ') : '') +
    (r.finDed > 0 ? line('금융재산 상속공제', r.finDed, '− ') : '') +
    line('과세표준', r.base, '', true) +
    line('산출세액', r.calc, '') +
    (r.report > 0 ? line('신고세액공제', r.report, '− ') : '') +
    line('예상 상속세', r.tax, '', true) + '</div>' +
    (r.capped ? '<div class="hint">공제는 과세 대상 금액까지만 적용되어 공제 합계가 각 공제의 합보다 적습니다.</div>' : '') + '</div>';

  if (r.tax > 0) {
    var w = Math.min(f / r.tax, 1) * 100;
    h += '<div class="sec"><h2>세금을 낼 재원</h2><div class="use"><div class="row"><b>예상 상속세 ' + won(r.tax) + '</b><span>금융재산 ' + won(f) + '</span></div>' +
      '<div class="m2 over" aria-hidden="true"><i style="width:' + w.toFixed(1) + '%"></i><i class="p" style="width:' + (100 - w).toFixed(1) + '%"></i></div>' +
      '<div class="legend"><span><i></i>금융재산으로 낼 수 있는 금액</span>' + (r.short > 0 ? '<span><i style="background:var(--gold-deep)"></i>부족한 금액</span>' : '') + '</div></div>' +
      '<div class="say">' + (r.short > 0 ? '금융재산을 모두 세금에 써도 <b>' + won(r.short) + '</b>이 부족한 것으로 계산됩니다. 부동산 등 다른 재산의 처분이나 별도 재원이 필요할 수 있습니다.'
                                         : '예상 세액이 금융재산 범위 안에 있습니다. 세금을 낸 뒤 남는 금융재산은 약 <b>' + won(f - r.tax) + '</b>입니다.') + '</div></div>';
  }

  if (S.spouse) {
    var a = S.smode === 'min' ? r : compute('min'), b = S.smode === 'legal' ? r : compute('legal');
    var opts = [['min', '배우자가 5억원 이하로 받는 경우', '배우자 상속공제 ' + won(a.spouseDed), a.tax], ['legal', '배우자가 법정 상속분만큼 받는 경우', '배우자 상속공제 ' + won(b.spouseDed), b.tax]];
    h += '<div class="sec" style="gap:6px"><h2 style="margin-bottom:6px">배우자가 받는 재산에 따른 차이</h2>' + opts.map(function(o){
        var on = S.smode === o[0];
        return '<button class="opt" type="button" data-act="smode" data-v="' + o[0] + '" aria-pressed="' + on + '"' + (on ? ' style="border-color:var(--navy);background:var(--navy);color:#fff"' : '') + '>' +
          '<span class="t"><b>' + o[1] + '</b><span' + (on ? ' style="color:var(--mute-on-navy)"' : '') + '>' + o[2] + (on ? ' · 현재 선택' : '') + '</span></span><b' + (on ? ' style="color:var(--gold)"' : '') + '>' + won(o[3]) + '</b></button>';
      }).join('') +
      '<div class="say" style="margin-top:6px">같은 재산에서 두 경우의 예상 세액 차이는 <b>' + won(Math.abs(a.tax - b.tax)) + '</b>입니다. 배우자 상속공제는 배우자가 실제로 받은 금액을 기준으로 하며, 정해진 기한 안에 재산을 나누어야 적용됩니다.</div></div>';
  }

  h += '<div class="sec"><h2>이 계산에 넣지 않은 것</h2><ul class="chk">' +
    '<li>사망 전 증여한 재산. 상속인에게 10년 이내, 그 밖의 사람에게 5년 이내에 준 재산은 상속 재산에 더해 계산합니다.</li>' +
    '<li>동거주택 상속공제, 가업상속공제, 영농상속공제.</li>' +
    '<li>미성년자·장애인·연로자 공제 등 가족 구성에 따른 추가 공제.</li>' +
    '<li>손자녀가 바로 상속받을 때의 할증, 최대주주 주식 할증.</li>' +
    '<li>재산 평가 방법에 따른 차이. 부동산과 비상장주식은 평가 방법에 따라 금액이 크게 달라집니다.</li>' +
    '<li>금융재산 상속공제는 금융채무를 뺀 금액 기준이지만, 이 계산은 입력한 금융재산 전액을 기준으로 했습니다.</li></ul></div>';

  h += '<div class="fine">이 화면은 상담 준비를 돕는 계산 도구이며 특정 금융상품의 권유나 광고가 아닙니다. 모든 금액은 입력값과 가정에 따른 단순 계산 예시이며 만원 미만은 반올림해 표시합니다. 실제 세액은 재산 평가, 상속인 구성, 재산 분할 내용, 사전 증여 여부에 따라 달라집니다. 세무 신고 전에는 세무 전문가의 확인이 필요하며, 이 계산은 세무·법률 자문을 대신하지 않습니다.<br>계산 기준: ' + BASIS + '<br>© KFPC Corp., Ltd. All Rights Reserved.</div>';
  return h;
}

/* 넓은 화면(가로 태블릿·PC, 가로로 누운 휴대폰)은 입력과 결과를 나란히 보여 줌 */
var MQ_WIDE = window.matchMedia('(min-width:900px), (min-width:600px) and (max-height:520px)');
function isWide(){ return MQ_WIDE.matches; }
var MORE = '<a class="cta center" href="./inheritance-tax-calculator.html">상속세 계산기로 정밀 계산</a>';
function rightHtml(){
  if (!(S.total > 0)) return '<div class="empty"><b>재산 총액을 입력해 주세요</b><span>왼쪽에 금액을 넣으면 예상 결과가 바로 계산됩니다</span></div>';
  return viewResult() + '<div class="more">' + MORE + '</div>';
}
function refreshRight(){ var r = $('colR'); if (r) { var k = r.scrollTop; r.innerHTML = rightHtml(); r.scrollTop = k; } }
function renderWide(){
  var body = $('body'), L = $('colL'), R = $('colR'), kl = L ? L.scrollTop : 0, kr = R ? R.scrollTop : 0;
  $('app').className = 'app wide';
  $('head').className = 'head';
  $('btnPrev').className = 'hbtn hide';
  $('bar').innerHTML = ''; $('foot').innerHTML = '';
  body.scrollTop = 0;
  body.innerHTML = '<div class="cols"><div class="col-l" id="colL">' +
    '<section id="secAsset">' + viewAsset() + '</section><section id="secFamily">' + viewFamily() + '</section>' +
    '</div><div class="col-r" id="colR">' + rightHtml() + '</div></div>';
  $('colL').scrollTop = kl; $('colR').scrollTop = kr;
  patchAsset();
}
function render(moved){
  if (!engineOk()) {
    $('app').className = 'app';
    $('body').innerHTML = '<div class="err">계산 엔진을 불러오지 못했습니다. 화면을 새로 고쳐 주세요. 계속되면 계산기 목록에서 다시 들어와 주세요.</div>';
    $('foot').innerHTML = '<a class="cta center" href="./index.html">계산기 목록으로</a>'; return;
  }
  if (isWide()) { renderWide(); return; }
  $('app').className = 'app';
  var res = S.step === 2;
  $('head').className = 'head' + (res ? ' res' : '');
  $('bar').className = 'bar' + (res ? ' res' : '');
  $('btnPrev').className = 'hbtn' + (S.step === 0 ? ' hide' : '');
  $('bar').innerHTML = STEP_NAMES.map(function(n, i){
    return '<button type="button" class="' + (i <= S.step ? 'on' : '') + '" data-act="go" data-v="' + i + '" aria-label="' + n + ' 화면으로 이동"' + (i === S.step ? ' aria-current="step"' : '') + '><i></i></button>';
  }).join('');
  var body = $('body'), keep = moved ? 0 : body.scrollTop;
  body.innerHTML = '<div class="pg' + (moved ? ' ' + S.dir : '') + '">' + [viewAsset, viewFamily, viewResult][S.step]() + '</div>';
  body.scrollTop = keep;
  $('foot').innerHTML = res
    ? '<button class="ghost" type="button" data-act="go" data-v="0">처음부터</button>' + MORE
    : '<button class="cta" id="btnNext" type="button" data-act="next"><span>' + ['가족 입력하기','결과 보기'][S.step] + '</span>' + ARROW + '</button>';
  if (S.step === 0) patchAsset();
}

/* ── 이벤트 ── */
document.addEventListener('click', function(ev){
  var b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  var act = b.getAttribute('data-act'), v = b.getAttribute('data-v'), k = b.getAttribute('data-k'), d = Number(b.getAttribute('data-d'));
  if (act === 'go') go(Number(v));
  else if (act === 'next') go(S.step + 1);
  else if (act === 'add') { S[k] = Math.min(S[k] + Number(v), MAX[k]); render(false); }
  else if (act === 'clear') { S[k] = 0; render(false); var a = $('in_' + k); if (a) a.focus(); }
  else if (act === 'spouse') set({ spouse: v === '1' });
  else if (act === 'kids') set({ kids: clamp(S.kids + d, 0, KIDS_MAX) });
  else if (act === 'smode') set({ smode: v });
});
$('btnPrev').addEventListener('click', function(){ go(S.step - 1); });
document.addEventListener('input', function(ev){
  var t = ev.target, k = t.getAttribute && t.getAttribute('data-k');
  if (!k || !(k in MAX)) return;
  var n = Math.min(parseInt(String(t.value).replace(/[^0-9]/g, ''), 10) || 0, MAX[k]);
  S[k] = n; t.value = n ? num(n) : ''; patchAsset();
  if (isWide()) refreshRight();
});
document.addEventListener('keydown', function(ev){
  if (ev.key === 'Enter' && ev.target.tagName === 'INPUT') { ev.preventDefault(); ev.target.blur(); if (!isWide()) go(S.step + 1); }
});
/* 좌우로 밀어 넘기기 */
var tx = null;
$('body').addEventListener('touchstart', function(ev){ var t = ev.touches[0]; tx = t ? { x:t.clientX, y:t.clientY } : null; }, { passive:true });
$('body').addEventListener('touchend', function(ev){
  var t = ev.changedTouches[0]; if (!t || !tx) return;
  var dx = t.clientX - tx.x, dy = t.clientY - tx.y; tx = null;
  if (isWide() || Math.abs(dx) < 70 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
  if (dx < 0 && S.step < 2) go(S.step + 1); else if (dx > 0 && S.step > 0) go(S.step - 1);
}, { passive:true });

if (MQ_WIDE.addEventListener) MQ_WIDE.addEventListener('change', function(){ render(true); });
else if (MQ_WIDE.addListener) MQ_WIDE.addListener(function(){ render(true); });

render(true);
})();
</script>
</body>
</html>
