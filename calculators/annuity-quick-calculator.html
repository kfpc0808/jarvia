<!DOCTYPE html>

<meta property="og:title" content="간편 연금계산기 | JARVIA 재무계산기">
<meta property="og:description" content="납입액으로 예상 연금 수령액을, 원하는 수령액으로 필요한 납입액을 3단계로 계산합니다.">

<style>
:root{
  --navy:#15294a; --navy-line:#2f4570; --gold:#e0b65a; --gold-deep:#8a5a12;
  --ground:#fbf8f2; --paper:#fff; --line:#e2dccd; --line-strong:#cfc7b4;
  --ink:#15294a; --mute:#56637a; --mute-on-navy:#c3cee0; --tint:#efe9da; --off:#8792a6;
  --sans:'Pretendard','Noto Sans KR',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --serif:'Noto Serif KR','Nanum Myeongjo',serif;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{height:100%;margin:0}
body{font-family:var(--sans);color:var(--ink);background:#ece7da;-webkit-font-smoothing:antialiased;
  word-break:keep-all;overflow-wrap:anywhere}
button{font-family:inherit;cursor:pointer;color:inherit;-webkit-tap-highlight-color:transparent}
input{font-family:inherit}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--gold-deep);outline-offset:2px}

/* ── 틀: 머리(얇게) · 본문(스크롤) · 하단 버튼 ── */
.app{height:100vh;height:100dvh;max-width:480px;margin:0 auto;background:var(--ground);
  display:flex;flex-direction:column;overflow:hidden;position:relative}
@media (min-width:600px){
  body{padding:24px 0}
  .app{height:calc(100vh - 48px);height:calc(100dvh - 48px);border:1px solid var(--line-strong);border-radius:6px}
}
.head{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:env(safe-area-inset-top) 8px 0;color:var(--mute);background:var(--ground)}
.head.res{background:var(--navy);color:#fff}
.hbtn{width:44px;height:44px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;
  text-decoration:none;color:inherit;font-size:12px;font-weight:700}
.hbtn.hide{visibility:hidden}
.htitle{font-size:13px;letter-spacing:.16em;font-weight:500;white-space:nowrap}
.bar{flex:none;display:flex;gap:6px;padding:0 20px 2px;background:var(--ground)}
.bar.res{background:var(--navy)}
.bar button{flex:1;height:13px;padding:5px 0;border:0;background:transparent}
.bar i{display:block;height:3px;background:var(--line)}
.bar .on i{background:var(--navy)}
.bar.res i{background:#3d5786}
.bar.res .on i{background:var(--gold)}
.body{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.body::-webkit-scrollbar{width:0;height:0}
.foot{flex:none;display:flex;gap:10px;padding:8px 20px calc(8px + env(safe-area-inset-bottom));
  background:var(--ground);border-top:1px solid var(--line)}

@keyframes nx{from{transform:translateX(32px);opacity:0}to{transform:none;opacity:1}}
@keyframes pv{from{transform:translateX(-32px);opacity:0}to{transform:none;opacity:1}}
.pg.next{animation:nx .24s ease-out}
.pg.prev{animation:pv .24s ease-out}
@media (prefers-reduced-motion:reduce){.pg{animation:none!important}}

/* ── 입력 화면 공통 ── */
.pad{padding:18px 20px 22px;display:flex;flex-direction:column;gap:22px}
.eyebrow{font-size:12px;letter-spacing:.14em;font-weight:700;color:var(--gold-deep)}
h1{margin:8px 0 0;font-family:var(--serif);font-weight:700;font-size:26px;line-height:1.34;letter-spacing:-.01em}
h2{margin:0;font-family:var(--serif);font-size:18px;font-weight:700}
.lab{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--mute)}
.hint{font-size:12px;line-height:1.6;color:var(--mute)}
.fld{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.ctr{display:flex;align-items:center;justify-content:space-between}
.under{border-bottom:1px solid var(--navy);padding-bottom:8px}
.rnd{flex:none;width:48px;height:48px;border:1px solid var(--line-strong);border-radius:50%;background:var(--paper);
  display:flex;align-items:center;justify-content:center;font-size:22px;line-height:1}
.rnd.sm{width:44px;height:44px}
.big{border:0;background:transparent;text-align:right;font-family:var(--serif);font-weight:700;line-height:1.1;
  color:var(--ink);padding:0;min-width:0;border-radius:0}
.big:focus{outline:none}
.unit{font-size:17px;font-weight:500;color:var(--mute);white-space:nowrap}
.grid{display:grid;gap:8px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.chip{min-height:46px;padding:0 4px;border:1px solid var(--line-strong);background:var(--paper);border-radius:4px;
  font-size:15px;font-weight:700}
.chip.on{border-color:var(--navy);background:var(--navy);color:#fff}
.chip:disabled{color:var(--off);background:#f3efe5;cursor:default}
.chip.q{font-size:14px;font-weight:500}
.chip.tall{min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.chip.tall small{font-size:12px;font-weight:500;color:var(--mute)}
.chip.tall b{font-family:var(--serif);font-size:18px}
.chip.tall.on small{color:var(--mute-on-navy)}
.chip.tall.on b{color:var(--gold)}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border:1px solid var(--navy);border-radius:4px;overflow:hidden}
.seg button{min-height:48px;border:0;background:transparent;font-size:15px;font-weight:700}
.seg button.on{background:var(--navy);color:#fff}
.mode{min-height:80px;padding:13px 16px;border:1px solid var(--line-strong);background:var(--paper);border-radius:4px;
  text-align:left;display:flex;flex-direction:column;gap:6px}
.mode b{font-size:16px}
.mode span{font-size:13px;line-height:1.45;color:var(--mute)}
.mode.on{border-color:var(--navy);background:var(--navy);color:#fff}
.mode.on span{color:var(--mute-on-navy)}
.note{padding:14px 16px;background:var(--paper);border:1px solid var(--line);border-radius:4px;
  display:flex;flex-direction:column;gap:8px}
.note b{font-size:14px}
.meter{height:6px;background:var(--line)}
.meter i{display:block;height:6px;background:var(--navy)}
.meter.over i{background:var(--gold-deep)}
.link{min-height:44px;padding:0 4px;border:0;background:transparent;color:var(--mute);font-size:13px;text-decoration:underline}
.tl{display:flex;flex-direction:column;gap:10px;padding:16px;background:var(--navy);border-radius:4px;color:#fff}
.tl .ages{display:flex;justify-content:space-between;font-family:var(--serif);font-size:20px;font-weight:700}
.tl .seg3{display:flex;height:8px;gap:2px}
.tl .legs{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--mute-on-navy)}
.gold{color:var(--gold)}

/* ── 결과 화면 ── */
.hero{background:var(--navy);color:#fff;padding:10px 20px 20px;display:flex;flex-direction:column;gap:6px}
.hero .sum{font-size:13px;color:var(--mute-on-navy);line-height:1.5}
.hero .hl{font-family:var(--serif);font-size:18px;font-weight:500;line-height:1.5;padding-top:6px}
.hero .num{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;color:var(--gold);font-family:var(--serif);font-weight:700}
.hero .num b{font-size:clamp(40px,15vw,60px);line-height:1.1;letter-spacing:-.02em}
.hero .num span{font-size:22px}
.basis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));margin-top:12px;border:1px solid #5a6f96;border-radius:4px;overflow:hidden}
.basis button{min-height:44px;padding:4px;border:0;background:transparent;color:#fff;font-size:13px;font-weight:700}
.basis button.on{background:var(--gold);color:var(--navy)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--navy);color:#fff;border-top:1px solid var(--navy-line)}
.stats div{padding:12px 6px 14px 12px;min-width:0}
.stats div+div{border-left:1px solid var(--navy-line)}
.stats small{display:block;font-size:11px;color:var(--mute-on-navy);margin-bottom:6px}
.stats b{font-family:var(--serif);font-size:14px}
.stats .cap{grid-column:1/-1;border-left:0;border-top:1px solid var(--navy-line);padding:8px 12px 10px;
  font-size:11px;color:var(--mute-on-navy)}
.sec{padding:24px 20px 0;display:flex;flex-direction:column;gap:12px}
.chart{display:block;width:100%;height:auto}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:12px;color:var(--mute)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;background:var(--navy)}
.legend i.g{background:var(--gold)}
.tax{margin:24px 20px 0}
.tax .tr{display:flex;justify-content:space-between;gap:12px;font-size:13px;line-height:1.5}
.tax .tr span{color:var(--mute)}
.tax .tr b{white-space:nowrap}
.tax .tr b.no{color:var(--gold-deep)}
.tax p{margin:0;padding-top:10px;border-top:1px solid var(--line);font-size:12px;line-height:1.55;color:var(--mute)}
.cmp{display:flex;flex-direction:column;gap:6px}
.cmp .bar2{height:10px;background:var(--navy)}
.cmp.later{color:var(--mute)}
.cmp.later .bar2{background:#b8c2d4}
.cmp b{font-family:var(--serif);font-size:17px;white-space:nowrap}
.cmp .row span{font-size:13px;font-weight:700}
.say{font-size:14px;line-height:1.6;padding:12px 14px;background:var(--tint);border-radius:4px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:62px;padding:10px 14px;
  border:1px solid var(--line);background:var(--paper);text-align:left;border-radius:4px;width:100%}
.opt .t{display:flex;flex-direction:column;gap:3px;min-width:0}
.opt .t b{font-size:15px}
.opt .t span{font-size:12px;color:var(--mute)}
.opt>b{font-family:var(--serif);font-size:17px;white-space:nowrap}
.opt.on{border-color:var(--navy);background:var(--navy);color:#fff}
.opt.on .t span{color:var(--mute-on-navy)}
.opt.on>b{color:var(--gold)}
.fine{padding:20px 20px 22px;font-size:11px;line-height:1.7;color:var(--mute)}
.fine a{color:var(--mute)}

.cta{flex:1;min-width:0;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:50px;padding:0 18px;
  background:var(--navy);color:#fff;border:0;border-radius:4px;font-size:16px;font-weight:700;text-decoration:none}
.cta:disabled{background:var(--off);cursor:default}
.cta.center{justify-content:center;text-align:center;font-size:15px;padding:0 10px}
.ghost{flex:none;min-height:50px;padding:0 16px;border:1px solid var(--navy);background:transparent;border-radius:4px;
  font-size:14px;font-weight:700}
/* ── 세로 태블릿: 화면 넘김 방식 유지, 전체를 1.25배로 키움 ── */
@media (min-width:600px) and (max-width:899px) and (min-height:700px){
  .app{max-width:720px}
  .head,.bar,.foot,.body>.pg{zoom:1.25}
}
/* ── 가로로 누운 휴대폰 등 낮은 화면: 바깥 여백 제거 ── */
@media (max-height:520px){
  body{padding:0}
  .app{height:100vh;height:100dvh;border:0;border-radius:0}
}
/* ── 가로 태블릿·PC: 왼쪽 입력 / 오른쪽 결과 2단 (내용은 휴대폰과 동일) ── */
.app.wide{max-width:1240px}
.wide .bar,.wide .foot{display:none}
.wide .head{border-bottom:1px solid var(--line);padding-bottom:0}
.wide .body{overflow:hidden;display:flex}
.cols{display:flex;flex:1;min-height:0;min-width:0;width:100%}
.col-l{flex:0 0 clamp(300px,40%,460px);min-width:0;overflow-y:auto;overflow-x:hidden;border-right:1px solid var(--line);scrollbar-width:thin}
.col-r{flex:1;min-width:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin}
.col-l section+section{border-top:1px solid var(--line)}
.wide .pad{padding:22px 28px 24px;gap:20px}
.wide h1{font-size:22px}
.wide h1 br{display:none}
.wide .chart{max-width:560px}
.wide .hero{padding:22px 32px 24px}
.wide .hero .hl{font-size:20px}
.wide .hero .num b{font-size:72px}
.wide .hero .num span{font-size:26px}
.wide .stats div{padding:16px 10px 18px 32px}
.wide .stats small{font-size:12px}
.wide .stats b{font-size:17px}
.wide .stats .cap{padding:10px 32px 12px;font-size:12px}
.wide .sec{padding:28px 32px 0}
.wide .tax{margin:28px 32px 0}
.wide .fine{padding:24px 32px 12px;font-size:12px}
.more{padding:8px 32px 28px;display:flex}
.empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:40px;text-align:center}
.empty b{font-family:var(--serif);font-size:22px}
.empty span{font-size:14px;color:var(--mute);line-height:1.6}
@media (max-height:520px){
  .wide .hero .num b{font-size:52px}
  .wide .pad{padding:16px 20px 18px}
  .wide .hero,.wide .sec,.wide .fine{padding-left:22px;padding-right:22px}
  .wide .tax{margin-left:22px;margin-right:22px}
  .wide .stats div{padding-left:22px}
  .wide .stats .cap,.more{padding-left:22px;padding-right:22px}
}
.err{margin:24px 20px;padding:16px;border:1px solid var(--gold-deep);border-radius:4px;font-size:14px;line-height:1.6}
</style>

<script src="./lib/calc-personal.js?v=20260916"></script>
<script>
/* ============================================================
   간편 연금계산기 (annuity-quick-calculator.html)
   · 세제 비적격 연금보험(저축성보험) 방식의 단순 계산
   · 계산식은 공용 엔진(lib/calc-personal.js → JarviaCalculators)의
     calculateFV / calculatePMT 를 그대로 사용 (계산식 한 곳 원칙)
   · 정밀 진단은 pension-calculator.html 로 연결
   ============================================================ */
(function(){
'use strict';

/* ── 제도 기준값: 규정 장부 연결 대상 (소득세법 시행령 제25조 제3항) ── */
var RULE = {
  monthlyLimit: 150,     // 월적립식 월 보험료 한도 (만원, 계약자 1명·전 계약 합산)
  lumpLimit: 10000,      // 일시납 등 납입 보험료 한도 (만원 = 1억원, 합산)
  minPayYears: 5,        // 월적립식 최소 납입 기간 (년)
  minKeepYears: 10,      // 최소 계약 유지 기간 (년)
  basis: '소득세법 시행령 제25조 · 2026년 11월 확인'
};
/* ── 계산 가정 (기존 은퇴·연금 설계 계산기와 동일) ── */
var INFLATION = 0.025;
var AGE_MIN = 20, AGE_MAX = 70, START_MIN = 55, START_MAX = 80;
var END_AGES = [85, 90, 95, 100], YEAR_CHOICES = [5, 10, 15, 20, 25], RATES = [[2,'보수적'],[3,'중립'],[4,'적극적']];
var STEP_NAMES = ['기본', '금액', '가정', '결과'];

var J = window.JarviaCalculators;
var S = { step:0, dir:'next', age:42, mode:'pay', payType:'m', monthly:50, lump:5000, target:100,
          years:20, startAge:65, endAge:90, rate:3, basis:'today', payout:'exp' };

var $ = function(id){ return document.getElementById(id); };
function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
function esc(t){ return String(t).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function won(v){
  var n = Math.round(v); if (!(n > 0)) return '0원';
  var eok = Math.floor(n/10000), man = n % 10000, out = '';
  if (eok > 0) out += eok.toLocaleString('ko-KR') + '억';
  if (man > 0) out += (out ? ' ' : '') + man.toLocaleString('ko-KR') + '만';
  return out + '원';
}

/* ── 입력값 정리: 서로 맞지 않는 조합을 자동으로 바로잡음 ── */
function fix(){
  S.age = clamp(Math.round(S.age) || AGE_MIN, AGE_MIN, AGE_MAX);
  if (S.mode === 'get') S.payType = 'm';
  while (S.payType === 'm' && S.years > YEAR_CHOICES[0] && S.age + S.years > START_MAX - 1) S.years -= 5;
  var payYears = S.payType === 'm' ? S.years : 1;
  S.startAge = clamp(S.startAge, Math.max(START_MIN, S.age + payYears), START_MAX);
  if (S.endAge < S.startAge + 5) S.endAge = END_AGES.filter(function(e){ return e >= S.startAge + 5; })[0] || 100;
  if (S.payout === 'p20' && S.endAge - S.startAge === 20) S.payout = 'exp';   // 두 방식이 같아지는 경우
}
function amtKey(){ return S.mode === 'pay' ? (S.payType === 'm' ? 'monthly' : 'lump') : 'target'; }
function amtMax(){ return S.mode === 'pay' ? (S.payType === 'm' ? 1000 : 100000) : 2000; }
function amount(){ return S[amtKey()]; }

/* ── 계산 (금액 단위: 만원) · shift = 시작을 몇 년 미루는지 ── */
function compute(shift){
  var age = S.age + shift, isM = S.payType === 'm';
  var years = isM ? S.years - shift : 0;
  if (isM && years < 1) return null;
  if (age >= S.startAge) return null;
  var rm = Math.pow(1 + S.rate/100, 1/12) - 1;
  var n = years * 12;
  var wait = (S.startAge - age) * 12 - n;            // 납입 종료 후 개시까지(월)
  var N = (S.endAge - S.startAge) * 12;              // 수령 기간(월)
  // 납입 1만원당 개시 시점 적립금
  var accF = isM ? J.calculateFV(rm, wait, 0, -J.calculateFV(rm, n, -1, 0)) : J.calculateFV(rm, wait, 0, -1);
  // 적립금 1만원당 월 수령액
  var f = { exp: J.calculatePMT(rm, N, -1), p20: J.calculatePMT(rm, 240, -1), inh: rm };
  var defl = Math.pow(1 + INFLATION, S.startAge - S.age);   // 오늘 가치 환산 계수(개시 첫해 기준)
  var unit, fund;
  if (S.mode === 'pay') { unit = Math.max(amount(), 0); fund = unit * accF; }
  else { fund = (S.target * defl) / f[S.payout]; unit = fund / accF; }
  var principal = isM ? unit * n : unit;

}

/* 넓은 화면(가로 태블릿·PC, 가로로 누운 휴대폰)은 입력과 결과를 나란히 보여 줌 */
var MQ_WIDE = window.matchMedia('(min-width:900px), (min-width:600px) and (max-height:520px)');
function isWide(){ return MQ_WIDE.matches; }
function rightHtml(){
  if (!(amount() > 0)) return '<div class="empty"><b>금액을 입력해 주세요</b><span>왼쪽에 금액을 넣으면 예상 결과가 바로 계산됩니다</span></div>';
  return viewResult() + '<div class="more"><a class="cta center" href="./pension-calculator.html">은퇴·연금 설계 계산기로 정밀 진단</a></div>';
}
function refreshRight(){ var r = $('colR'); if (r) { var k = r.scrollTop; r.innerHTML = rightHtml(); r.scrollTop = k; } }
function renderWide(){
  var body = $('body'), L = $('colL'), R = $('colR'), kl = L ? L.scrollTop : 0, kr = R ? R.scrollTop : 0;
  $('app').className = 'app wide';
  $('head').className = 'head';
  $('btnPrev').className = 'hbtn hide';
  $('bar').innerHTML = ''; $('foot').innerHTML = '';
  body.scrollTop = 0;
  body.innerHTML = '<div class="cols"><div class="col-l" id="colL">' +
    '<section id="secBasic">' + viewBasic() + '</section><section id="secAmount">' + viewAmount() + '</section><section id="secAssume">' + viewAssume() + '</section>' +
    '</div><div class="col-r" id="colR">' + rightHtml() + '</div></div>';
  $('colL').scrollTop = kl; $('colR').scrollTop = kr;
  patchAmount();
}

function render(moved){
  fix();
  if (J && typeof J.calculateFV === 'function' && typeof J.calculatePMT === 'function' && isWide()) { renderWide(); return; }
  $('app').className = 'app';
  var res = S.step === 3;
  if (!J || typeof J.calculateFV !== 'function' || typeof J.calculatePMT !== 'function') {
    $('body').innerHTML = '<div class="err">계산 엔진을 불러오지 못했습니다. 화면을 새로 고쳐 주세요. 계속되면 계산기 목록에서 다시 들어와 주세요.</div>';
    $('foot').innerHTML = '<a class="cta center" href="./index.html">계산기 목록으로</a>'; return;
  }
  $('head').className = 'head' + (res ? ' res' : '');
  $('bar').className = 'bar' + (res ? ' res' : '');
  $('btnPrev').className = 'hbtn' + (S.step === 0 ? ' hide' : '');
  $('bar').innerHTML = STEP_NAMES.map(function(n, i){
    return '<button type="button" class="' + (i <= S.step ? 'on' : '') + '" data-act="go" data-v="' + i + '" aria-label="' + n + ' 화면으로 이동"' + (i === S.step ? ' aria-current="step"' : '') + '><i></i></button>';
  }).join('');
  var body = $('body'), keep = moved ? 0 : body.scrollTop;
  var html = [viewBasic, viewAmount, viewAssume, viewResult][S.step]();
  body.innerHTML = '<div class="pg' + (moved ? ' ' + S.dir : '') + '">' + html + '</div>';
  body.scrollTop = keep;
  $('foot').innerHTML = res
    ? '<button class="ghost" type="button" data-act="go" data-v="0">처음부터</button><a class="cta center" href="./pension-calculator.html">은퇴·연금 설계 계산기로 정밀 진단</a>'
    : '<button class="cta" id="btnNext" type="button" data-act="next"><span>' + ['금액 입력하기','계산 가정 확인하기','결과 보기'][S.step] + '</span>' + ARROW + '</button>';
  if (S.step === 1) patchAmount();
}

/* ── 이벤트 ── */
document.addEventListener('click', function(e){
  var b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  var act = b.getAttribute('data-act'), v = b.getAttribute('data-v'), d = Number(b.getAttribute('data-d'));
  if (act === 'go') go(Number(v));
  else if (act === 'next') go(S.step + 1);
  else if (act === 'age') set({ age: clamp(S.age + d, AGE_MIN, AGE_MAX) });
  else if (act === 'mode') set({ mode: v, payout: 'exp' });
  else if (act === 'ptype') set({ payType: v });
  else if (act === 'years') set({ years: Number(v) });
  else if (act === 'start') set({ startAge: S.startAge + d });
  else if (act === 'end') set({ endAge: Number(v) });
  else if (act === 'rate') set({ rate: Number(v) });
  else if (act === 'basis') set({ basis: v });
  else if (act === 'payout') set({ payout: v });
  else if (act === 'clear') { S[amtKey()] = 0; render(false); var a = $('amt'); if (a) a.focus(); }
  else if (act === 'add') { S[amtKey()] = Math.min(amount() + Number(v), amtMax()); render(false); }
});
$('btnPrev').addEventListener('click', function(){ go(S.step - 1); });
document.addEventListener('input', function(e){
  var t = e.target, digits = String(t.value).replace(/[^0-9]/g, '');
  if (t.id === 'amt') {
    var n = Math.min(parseInt(digits, 10) || 0, amtMax());
    S[amtKey()] = n; t.value = n ? n.toLocaleString('ko-KR') : ''; patchAmount();
    if (isWide()) refreshRight();
  } else if (t.id === 'age') {
    t.value = digits.slice(0, 2);
    var a = parseInt(t.value, 10);
    if (a >= AGE_MIN && a <= AGE_MAX) {
      S.age = a;
      if (isWide()) {   // 입력 중인 칸은 그대로 두고 나머지만 다시 그림
        fix(); $('secAmount').innerHTML = viewAmount(); $('secAssume').innerHTML = viewAssume(); patchAmount(); refreshRight();
      }
    }
  }
});
document.addEventListener('focusout', function(e){ if (e.target.id === 'age') e.target.value = S.age; });
document.addEventListener('keydown', function(e){
  if (e.key === 'Enter' && e.target.tagName === 'INPUT') { e.preventDefault(); e.target.blur(); if (!isWide()) go(S.step + 1); }
});
/* 좌우로 밀어 넘기기 */
var tx = null;
$('body').addEventListener('touchstart', function(e){ var t = e.touches[0]; tx = t ? { x:t.clientX, y:t.clientY } : null; }, { passive:true });
$('body').addEventListener('touchend', function(e){
  var t = e.changedTouches[0]; if (!t || !tx) return;
  var dx = t.clientX - tx.x, dy = t.clientY - tx.y; tx = null;
  if (isWide() || Math.abs(dx) < 70 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
  if (dx < 0 && S.step < 3) go(S.step + 1); else if (dx > 0 && S.step > 0) go(S.step - 1);
}, { passive:true });

if (MQ_WIDE.addEventListener) MQ_WIDE.addEventListener('change', function(){ render(true); });
else if (MQ_WIDE.addListener) MQ_WIDE.addListener(function(){ render(true); });

render(true);
})();
</script>
</body>
</html>
