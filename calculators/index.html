  <!-- Bypass 모드 즉시 처리 -->
  <script>
    (function() {
      // URL 파라미터 즉시 체크
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('bypass') === 'true') {
        // 즉시 인증 상태 설정
        sessionStorage.setItem('userAuth', 'true');
        sessionStorage.setItem('bypassMode', 'true');
        console.log('🚀 Bypass 모드 활성화');
        
        // DOM 로드 전 스타일 적용
        document.addEventListener('DOMContentLoaded', function() {
          const loginModal = document.getElementById('loginModal');
          if (loginModal) {
            loginModal.style.display = 'none';
            loginModal.classList.remove('active');
          }
          const mainApp = document.getElementById('mainApp');
          if (mainApp) {
            mainApp.style.display = 'block';
          }
        }, { capture: true });
      }
    })();

  <style>

    .modal.bypass-hidden {

    :root {
      --bg-dark: #0a192f;
      --bg-light: #112240;
      --card-bg: #1a2c4a;
      --text-primary: #ccd6f6;
      --text-secondary: #8892b0;
      --brand: #64ffda;
      --brand-tint: rgba(100, 255, 218, 0.1);
      --border-color: rgba(136, 146, 176, 0.2);
      --shadow-color: rgba(2, 12, 27, 0.7);
      --focus-ring: rgba(100, 255, 218, 0.5);
      
      --font-sans: "Noto Sans KR", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      
      --spacing-xs: 4px;
      --spacing-sm: 8px;
      --spacing-md: 16px;
      --spacing-lg: 24px;
      --spacing-xl: 32px;
      --border-radius: 12px;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    html {
      scroll-behavior: smooth;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      height: 100%;
    }

    body {
      font-family: var(--font-sans);
      color: var(--text-primary);
      background-color: var(--bg-dark);
      background-image:
        radial-gradient(circle at 10% 20%, var(--bg-light) 0%, transparent 40%),
        radial-gradient(circle at 95% 85%, var(--bg-light) 0%, transparent 40%);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      min-height: 100%;
      min-height: -webkit-fill-available;
    }

    .wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: var(--spacing-xl) var(--spacing-md);
      padding-bottom: 80px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: var(--spacing-md);
      margin-bottom: var(--spacing-xl);
      justify-content: space-between;
      flex-wrap: wrap;
    }
    
    .brand-left {
      display: flex;
      align-items: center;
      gap: var(--spacing-md);
    }
    
    .brand img {
      filter: grayscale(30%) contrast(110%);
      border-radius: 25%;
    }
    
    .brand h1 {
      font-size: clamp(20px, 5vw, 32px);
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.5px;
      margin-bottom: var(--spacing-xs);
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    
    .brand h1 .title-en {
      font-size: clamp(16px, 4vw, 24px);
      color: var(--text-secondary);
      font-weight: 500;
    }
    
    .brand h1 .title-ko {
      font-size: clamp(20px, 5vw, 32px);
      color: var(--text-primary);
      font-weight: 700;
    }

    .brand small {
      font-size: clamp(13px, 3vw, 16px);
      color: var(--text-secondary);
      line-height: 1.5;
    }
    
    .btn-suggest {
      border: 1px solid var(--brand);
      background-color: transparent;
      border-radius: 8px;
      padding: 10px 20px;
      cursor: pointer;
      font-weight: 500;
      font-size: 14px;
      color: var(--brand);
      transition: background-color 0.2s ease, color 0.2s ease;
      white-space: nowrap;
      -webkit-tap-highlight-color: transparent;
    }
    
    .btn-logout {
      border: 1px solid var(--border-color);
      background-color: transparent;
      border-radius: 8px;
      padding: 8px 16px;
      cursor: pointer;
      font-weight: 500;
      font-size: 13px;
      color: var(--text-secondary);
      transition: background-color 0.2s ease, color 0.2s ease;
      white-space: nowrap;
      -webkit-tap-highlight-color: transparent;
      margin-left: var(--spacing-sm);
    }
    
    .btn-suggest:hover,
    .btn-suggest:focus-visible {
      background-color: var(--brand);
      color: var(--bg-dark);
      outline: none;
    }
    
    .btn-logout:hover,
    .btn-logout:focus-visible {
      background-color: var(--brand-tint);
      color: var(--brand);
      border-color: var(--brand);
      outline: none;
    }
    
    .section-title {
      font-size: clamp(18px, 4vw, 22px);
      color: var(--text-primary);
      font-weight: 700;
      margin-bottom: var(--spacing-lg);
      margin-top: var(--spacing-xl);
      padding-left: var(--spacing-md);
      border-left: 4px solid var(--brand);
    }

    .panel {
      display: flex;
      gap: var(--spacing-sm);
      background: var(--card-bg);
      border-radius: var(--border-radius);
      padding: var(--spacing-sm);
      border: 1px solid var(--border-color);
      box-shadow: 0 4px 12px var(--shadow-color);
      margin-bottom: var(--spacing-xl);
    }

    .panel input {
      flex-grow: 1;
      border: none;
      background: transparent;
      padding: 12px var(--spacing-md);
      font-size: 16px;
      outline: none;
      color: var(--text-primary);
      font-family: var(--font-sans);
      -webkit-appearance: none;
      appearance: none;
    }

    .panel input::placeholder {
      color: var(--text-secondary);
      opacity: 0.8;
    }
    
    .panel .btn-clear {
      border: 1px solid var(--border-color);
      background-color: transparent;
      border-radius: 8px;
      padding: 10px 16px;
      cursor: pointer;
      font-weight: 500;
      font-size: 14px;
      color: var(--brand);
      transition: background-color 0.2s ease, color 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }
    
    .panel .btn-clear:hover,
    .panel .btn-clear:focus-visible {
      background-color: var(--brand-tint);
      color: var(--brand);
      outline: none;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(280px, 100%), 1fr));
      gap: var(--spacing-md);
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--border-radius);
      padding: var(--spacing-lg);
      display: flex;
      gap: var(--spacing-md);
      align-items: flex-start;
      cursor: pointer;
      box-shadow: 0 4px 12px var(--shadow-color);
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
      outline: none;
      text-align: left;
      width: 100%;
      font-family: var(--font-sans);
      -webkit-tap-highlight-color: transparent;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 20px var(--shadow-color);
      border-color: var(--brand);
    }

    .card:focus-visible {
      transform: translateY(-5px);
      box-shadow: 0 0 0 4px var(--focus-ring);
      border-color: var(--brand);
    }

    .emoji {
      font-size: 32px;
      margin-top: -2px;
    }

    .card .meta {
      flex: 1;
    }

    .card .title {
      font-weight: 700;
      font-size: 17px;
      margin-bottom: 6px;
      color: var(--text-primary);
    }

    .card .desc {
      margin: 0;
      color: var(--text-secondary);
      font-size: 14px;
      line-height: 1.5;
    }
    
    .card .arrow {
      color: var(--text-secondary);
      font-size: 24px;
      font-weight: bold;
      transition: transform 0.2s ease, color 0.2s ease;
      align-self: center;
    }
    
    .card:hover .arrow,
    .card:focus-visible .arrow {
      color: var(--brand);
      transform: translateX(4px);
    }

    footer {
      max-width: 1100px;
      margin: var(--spacing-xl) auto;
      padding: 0 var(--spacing-md);
      color: var(--text-secondary);
      font-size: 13px;
      text-align: center;
    }
    footer a {
      color: var(--text-secondary);
      text-decoration: none;
    }
    footer a:hover {
      color: var(--brand);
    }
    
    .admin-link {
      cursor: pointer;
      transition: color 0.2s ease;
    }
    .admin-link:hover {
      color: var(--brand);
    }

    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      background-color: rgba(10, 25, 47, 0.95);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }

    .modal.active {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-content {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--border-radius);
      padding: var(--spacing-xl);
      width: 90%;
      max-width: 500px;
      box-shadow: 0 10px 40px var(--shadow-color);
      position: relative;
      max-height: 90vh;
      max-height: 90dvh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .modal-close {
      position: absolute;
      top: var(--spacing-md);
      right: var(--spacing-md);
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-size: 28px;
      cursor: pointer;
      transition: color 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .modal-close:hover {
      color: var(--brand);
    }

    .modal h2 {
      color: var(--text-primary);
      margin-bottom: var(--spacing-lg);
      font-size: 24px;
    }

    .form-group {
      margin-bottom: var(--spacing-lg);
    }

    .form-group label {
      display: block;
      color: var(--text-primary);
      margin-bottom: var(--spacing-sm);
      font-weight: 500;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 12px var(--spacing-md);
      background: var(--bg-dark);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 16px;
      transition: border-color 0.2s ease;
      -webkit-appearance: none;
      appearance: none;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: var(--brand);
    }

    .form-group textarea {
      resize: vertical;
      min-height: 120px;
    }

    .form-group small {
      color: var(--text-secondary);
      font-size: 12px;
    }

    .btn-submit {
      width: 100%;
      padding: 12px;
      background-color: var(--brand);
      color: var(--bg-dark);
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 16px;
      cursor: pointer;
      transition: opacity 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .btn-submit:hover {
      opacity: 0.9;
    }

    .btn-submit:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .success-message {
      text-align: center;
      padding: var(--spacing-xl);
    }

    .success-message h2 {
      color: var(--brand);
      margin-bottom: var(--spacing-md);
    }

    .success-message p {
      color: var(--text-secondary);
      margin-bottom: var(--spacing-lg);
    }

    @media (max-width: 768px) {
      .brand {
        flex-direction: column;
        align-items: flex-start;
      }
      
      .btn-suggest {
        align-self: flex-start;
      }
      
      .modal-content {
        width: 95%;
        padding: var(--spacing-lg);
      }
    }

    @supports (-webkit-touch-callout: none) {
      body {
        min-height: -webkit-fill-available;
      }
    }
  </style>
</head>
