<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>이너서클 상담</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --navy:#0E2438;--navy-2:#16324D;--ink:#141A24;--gray:#3A4353;--gray-l:#6B7585;
  --line:#E4E8EE;--line-2:#EEF1F5;--paper:#F7F8FA;--gold:#A8862F;--gold-bg:#FCFBF7;--gold-line:#EDE6D5;
  --ok:#1B7A5A;--ok-bg:#EAF5F0;--warn:#96701C;--warn-bg:#FBF2E4;--danger:#A93B33;--danger-bg:#F9EDEB;
  --f:'Pretendard',-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--f);background:var(--paper);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased;font-feature-settings:'tnum'}
button,input,textarea{font-family:inherit;color:inherit}
a{color:inherit;text-decoration:none}

.hdwrap{position:sticky;top:0;z-index:60;background:var(--navy);padding-top:var(--safe-t)}
.tb{display:flex;align-items:center;height:54px;padding:0 16px;gap:12px;max-width:1180px;margin:0 auto}
.tb .bk{display:none;color:#fff;opacity:.7;font-size:20px;line-height:1;padding:4px;cursor:pointer}
.tb .lg{font-size:15px;font-weight:700;color:#fff;letter-spacing:-.02em;display:flex;align-items:center;gap:9px;flex:1;min-width:0}
.tb .lg .dot{width:5px;height:5px;border-radius:50%;background:var(--gold);flex-shrink:0}
.tb .lg .sub{font-size:10.5px;font-weight:400;color:#7E93AC;letter-spacing:.05em;padding-left:9px;border-left:1px solid rgba(255,255,255,.15)}
.tb .who{font-size:12.5px;color:#B9C7D6;white-space:nowrap}
.tb .nav{background:none;border:1px solid rgba(255,255,255,.16);color:#B9C7D6;font-size:12px;padding:5px 11px;border-radius:6px;cursor:pointer;white-space:nowrap}
.tb .nav:hover{color:#fff}

.pg{max-width:1180px;margin:0 auto;padding:22px 22px 90px}
.view{display:none}.view.on{display:block}
.two{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:22px;align-items:start}

.dcard{background:#fff;border:1px solid var(--line);border-radius:10px;padding:24px}
.dcard+.dcard{margin-top:14px}
.lbl{font-size:10.5px;font-weight:700;color:var(--gray-l);letter-spacing:.08em;margin-bottom:12px}
.kv{font-size:13.5px}
.kv .r{display:flex;gap:16px;padding:8px 0;border-bottom:1px solid var(--line-2);line-height:1.8}
.kv .r:last-child{border-bottom:none}
.kv .r b{width:84px;flex-shrink:0;color:var(--gray-l);font-weight:500;font-size:12.5px}
.kv .r span{flex:1;min-width:0}

.st{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:3px;letter-spacing:.02em;white-space:nowrap}
.st-ok{background:var(--ok-bg);color:var(--ok)}.st-bs{background:var(--warn-bg);color:var(--warn)}
.st-of{background:#F0F2F5;color:var(--gray)}.st-rn{background:#EAF0F7;color:var(--navy-2)}
.st-wt{background:var(--danger-bg);color:var(--danger)}

.side{position:sticky;top:76px}
.contact{background:var(--gold-bg);border:1px solid var(--gold-line);border-radius:10px;padding:20px;text-align:center}
.contact .lb{font-size:10.5px;font-weight:700;color:var(--gold);letter-spacing:.08em;margin-bottom:8px}
.contact .nm{font-size:19px;font-weight:700;letter-spacing:-.03em}
.contact .ph{font-size:22px;font-weight:700;color:var(--navy);letter-spacing:-.02em;margin-top:4px;font-variant-numeric:tabular-nums}
.contact .call{display:block;background:var(--navy);color:#fff;border-radius:8px;padding:14px;font-size:15px;font-weight:700;margin-top:16px;cursor:pointer;border:none;width:100%}
.contact .call:hover{background:var(--navy-2)}
.contact .fine{font-size:11px;color:var(--gray-l);margin-top:10px;line-height:1.65}

.tps{display:flex;flex-wrap:wrap;gap:6px}
.tps span{font-size:12.5px;padding:7px 13px;border-radius:15px;border:1px solid var(--line);background:#fff;color:var(--gray);cursor:pointer}
.tps span:hover{border-color:var(--gray-l);color:var(--ink)}
.tps span.on{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:600}
.fld{margin:14px 0}
.fld textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-size:16px;min-height:88px;resize:vertical;line-height:1.75;background:#fff;outline:none}
.fld textarea:focus{border-color:var(--gold)}
.btn{display:block;width:100%;text-align:center;background:var(--navy);color:#fff;border:none;border-radius:8px;padding:14px;font-size:15px;font-weight:700;cursor:pointer}
.btn:hover{background:var(--navy-2)}
.btn.sec{background:#fff;color:var(--navy);border:1px solid var(--line);font-weight:600;font-size:13.5px;padding:12px}
.btn:disabled{background:#C9CFD8;cursor:default}
.btn+.btn{margin-top:8px}

.tl{position:relative;padding-left:20px}
.tl::before{content:'';position:absolute;left:5px;top:7px;bottom:7px;width:1px;background:var(--line)}
.tl .ev{position:relative;padding-bottom:18px}
.tl .ev:last-child{padding-bottom:0}
.tl .ev::before{content:'';position:absolute;left:-19px;top:6px;width:9px;height:9px;border-radius:50%;background:#fff;border:2px solid var(--gold)}
.tl .ev.sys::before{border-color:#C9D0DA}
.tl .dt{font-size:11px;color:var(--gray-l)}
.tl .who{font-size:12px;color:var(--navy);font-weight:700;margin-top:2px}
.tl .tx{font-size:13.5px;margin-top:3px;line-height:1.8;white-space:pre-line}

.tog{display:flex;align-items:center;gap:12px;background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:13px 15px;margin-top:14px}
.tog .t1{font-size:13px;font-weight:700}
.tog .t2{font-size:11.5px;color:var(--gray-l);margin-top:2px}
.sw{width:42px;height:24px;border-radius:12px;background:#C9CFD8;position:relative;flex-shrink:0;cursor:pointer;transition:background .15s}
.sw.on{background:var(--ok)}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}
.sw.on::after{left:21px}

.fileb{display:flex;align-items:center;gap:10px;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:11px 14px;font-size:13px;margin-top:8px;cursor:pointer}
.fileb:hover{border-color:var(--gray-l)}
.fileb .exp{font-size:11px;color:var(--warn);font-weight:700;white-space:nowrap}
.intro{background:var(--gold-bg);border:1px solid var(--gold-line);border-radius:10px;padding:18px 20px;margin-bottom:14px}
.intro .t{font-size:16px;font-weight:700;letter-spacing:-.02em}
.intro .s{font-size:13px;color:#6A5A2E;margin-top:6px;line-height:1.75}
.done{background:var(--ok-bg);border:1px solid #CFE8DA;border-radius:8px;padding:12px 16px;font-size:13px;color:var(--ok);margin-bottom:14px}
.fld label{display:block;font-size:12.5px;font-weight:600;color:var(--gray);margin-bottom:6px}
.fld label i{color:var(--danger);font-style:normal}
.fld label em{font-style:normal;font-weight:400;color:var(--gray-l);font-size:11px}
.fld input{width:100%;border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-size:16px;background:#fff;outline:none}
.fld input:focus{border-color:var(--gold)}
.fld input[readonly]{background:var(--paper);color:var(--gray)}
.fld .hint{font-size:11.5px;color:var(--gray-l);margin-top:6px;line-height:1.6}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;margin-bottom:14px}
.row2 .fld{margin-bottom:0}
.row2:last-child{margin-bottom:0}
.photo{display:flex;gap:16px;align-items:center;margin-bottom:18px}
.av{width:88px;height:88px;border-radius:50%;background:#EDF0F4;border:1px solid var(--line);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;color:#8C99AB;background-size:cover;background-position:center}
.gex{background:var(--gold-bg);border:1px solid var(--gold-line);border-radius:8px;padding:14px 16px;font-size:12.5px;color:#6A5A2E;line-height:1.85;margin-bottom:10px}
.gex b{color:#4E4220}
.ctp-h{font-size:12.5px;font-weight:600;color:var(--gray);margin:18px 0 8px}   /* ★ [2026-09-28] 주제 직접 입력 */
.ctp-h em{font-style:normal;font-weight:400;color:var(--gray-l);font-size:11px}
.ctp-r{display:flex;gap:6px;margin-bottom:6px}
.ctp-r input{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:16px;background:#fff;outline:none}
.ctp-r input:focus{border-color:var(--gold)}
.ctp-r button{width:42px;flex-shrink:0;border:1px solid var(--line);background:#fff;border-radius:8px;color:var(--gray-l);font-size:18px;cursor:pointer}
.ctp-add{display:block;width:100%;font-size:12.5px;font-weight:600;color:var(--navy);background:#fff;border:1px dashed var(--gray-l);border-radius:8px;padding:9px 14px;cursor:pointer}
.ctp-add[disabled]{opacity:.45;cursor:default}
.exb{font-size:11.5px;font-weight:600;color:var(--navy);background:#fff;border:1px solid var(--line);border-radius:6px;padding:3px 9px;margin-left:6px;cursor:pointer;vertical-align:1px}   /* ★ [2026-09-28] 예시 넣기 */
.tb .nav+.nav{margin-left:-4px}
.tblw{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:600px}
.tbl th{text-align:left;font-size:11px;font-weight:600;color:var(--gray-l);letter-spacing:.04em;padding:0 12px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:14px 12px;border-bottom:1px solid var(--line-2);white-space:nowrap}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover td{background:#FBFCFD}
.tbl tr.alert td{background:#FDF6F5}
.tbl .no{color:var(--gray-l);font-size:11.5px}.tbl .sb{font-weight:600}.tbl .mu{color:var(--gray)}
.tbl td{color:var(--ink)}
.bnr{display:flex;gap:11px;background:var(--danger-bg);border:1px solid #F0D4D0;border-radius:8px;padding:13px 16px;font-size:13px;color:#7A2F29;margin-bottom:14px;line-height:1.7}
.bnr b{color:#5E241F}

.empty{text-align:center;padding:56px 20px;color:var(--gray-l);font-size:13.5px;line-height:1.85}
.empty b{display:block;font-size:16px;color:var(--gray);margin-bottom:8px;font-weight:700}
.load{text-align:center;padding:60px;color:var(--gray-l);font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(30px + var(--safe-b));transform:translateX(-50%);background:var(--ink);color:#fff;font-size:13.5px;padding:12px 20px;border-radius:8px;z-index:300;max-width:88%;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.fixcta{display:none;position:fixed;left:0;right:0;bottom:0;z-index:70;background:#fff;border-top:1px solid var(--line);padding:12px 16px calc(12px + var(--safe-b))}

/* 폰에서도 짧은 항목은 2열 유지 — 한 화면에 더 많이 보이게 */
@media(max-width:600px){.row2{gap:10px}.fld input,.fld textarea{padding:11px 12px}}
@media(max-width:1023px){
  .tb{height:50px;padding:0 14px}
  .tb .who{display:none}
  .pg{padding:14px 14px 100px}
  .two{grid-template-columns:minmax(0,1fr);gap:12px}
  .side{position:static;order:-1}
  .dcard{padding:18px}
  .contact .call{display:none}
  .fixcta.on{display:block}
}
/* ═══ ★ [2026-09-30] 유료 컨설팅 내역 — 입력 안내 · 내역 카드 · 입력 폼 ═══ */
.sgd{position:relative;background:var(--gold-bg);border:1px solid var(--gold-line);border-radius:12px;padding:22px 24px 20px 28px;margin-bottom:16px;overflow:hidden}
.sgd::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--gold)}
.sgd h4{font-size:16.5px;font-weight:800;color:var(--navy);letter-spacing:-.03em;margin-bottom:8px}
.sgd p{font-size:13.5px;color:#4B4631;line-height:1.85}
.sgd p b{color:var(--navy)}
.sgd ul{list-style:none;margin:12px 0 0;padding:12px 0 0;border-top:1px dashed var(--gold-line);display:grid;gap:4px}
.sgd li{font-size:12.5px;color:var(--gray);padding-left:14px;position:relative;line-height:1.7}
.sgd li::before{content:'';position:absolute;left:2px;top:.75em;width:5px;height:5px;border-radius:50%;background:var(--gold)}
.sgd .ac{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:16px}
.sgd .cnt{font-size:13px;font-weight:700;color:var(--danger);background:var(--danger-bg);border:1px solid #F0D4D0;border-radius:999px;padding:7px 14px}
.sgd .go{background:var(--navy);color:#fff;border:none;border-radius:8px;padding:10px 18px;font-size:13.5px;font-weight:700;cursor:pointer}
.sgd .go:hover{background:var(--navy-2)}
.sgd .quiet{font-size:12.5px;color:var(--gray-l)}
.stl-tip{font-size:12.5px;color:#5D5131;background:var(--gold-bg);border:1px solid var(--gold-line);border-radius:8px;padding:11px 14px;margin-bottom:12px;line-height:1.75}
.stl-tip b{color:var(--navy)}
.stl-it{border:1px solid var(--line);border-radius:10px;padding:18px 18px 16px;background:#fff}
.stl-it+.stl-it{margin-top:10px}
.stl-it.me{border-color:#E6C9C4;box-shadow:0 0 0 3px #FBF1EF}
.stl-hd{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.stl-amt{font-size:22px;font-weight:800;letter-spacing:-.02em;color:var(--ink);font-variant-numeric:tabular-nums}
.stl-amt small{font-size:13px;font-weight:600;color:var(--gray);margin-left:2px}
.stl-sub{font-size:11.5px;color:var(--gray-l);margin-top:2px}
.stl-steps{display:flex;margin:16px 0 2px}
.stl-steps span{flex:1;position:relative;font-size:11.5px;color:var(--gray-l);padding-top:15px;text-align:center}
.stl-steps span::before{content:'';position:absolute;top:0;left:50%;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:#fff;border:2px solid #CDD3DC;box-sizing:border-box;z-index:1}
.stl-steps span::after{content:'';position:absolute;top:4px;left:-50%;right:50%;height:2px;background:#E1E5EB}
.stl-steps span:first-child::after{display:none}
.stl-steps span.dn{color:var(--navy);font-weight:600}
.stl-steps span.dn::before{background:var(--gold);border-color:var(--gold)}
.stl-steps span.dn::after,.stl-steps span.cur::after{background:var(--gold)}
.stl-steps span.cur{color:var(--danger);font-weight:700}
.stl-steps span.cur::before{border-color:var(--danger)}
.stl-kv{margin-top:14px;background:var(--paper);border-radius:8px;padding:8px 14px}
.stl-kv .r{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:13px;padding:5px 0}
.stl-kv .r b{font-weight:500;color:var(--gray)}
.stl-kv .r span{font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.stl-kv .r.net span{color:var(--ok)}
.stl-kv .r.sm b,.stl-kv .r.sm span{font-size:11.5px;font-weight:400;color:var(--gray-l)}
.stl-note{font-size:12.5px;color:var(--gray);margin-top:10px;line-height:1.7;white-space:pre-line}
.stl-warn{font-size:12.5px;color:var(--danger);background:var(--danger-bg);border-radius:6px;padding:8px 12px;margin-top:10px;line-height:1.6}
.stl-ac{display:flex;gap:8px;margin-top:14px}
.stl-ac button{flex:1;border-radius:8px;padding:11px;font-size:13.5px;font-weight:700;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--navy)}
.stl-ac button.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.stl-ac button:disabled{opacity:.5;cursor:default}
.stl-rv{margin-top:12px;background:var(--paper);border-radius:8px;padding:12px}
.stl-rv textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:14px;min-height:64px;resize:vertical;outline:none;background:#fff;line-height:1.7}
.stl-rv textarea:focus{border-color:var(--gold)}
.stl-rv .stl-ac{margin-top:10px}
.stl-his{margin-top:12px;font-size:12px;color:var(--gray-l)}
.stl-his summary{cursor:pointer;list-style:none;display:inline-block}
.stl-his summary::-webkit-details-marker{display:none}
.stl-his summary::after{content:' ▾';font-size:10px}
.stl-his[open] summary::after{content:' ▴'}
.stl-his ol{list-style:none;margin-top:8px;padding-left:12px;border-left:2px solid var(--line-2);display:grid;gap:5px;line-height:1.6}
.stl-his li b{color:var(--gray);font-weight:600}
.stl-add{display:inline-flex;align-items:center;gap:6px;margin-top:12px;background:#fff;border:1px solid var(--gold);color:#7A5F1C;border-radius:8px;padding:10px 16px;font-size:13.5px;font-weight:700;cursor:pointer}
.stl-add:hover{background:var(--gold-bg)}
.stl-form{border:1px dashed #D9CBA6;background:var(--gold-bg);border-radius:10px;padding:18px;margin-top:12px}
.stl-form .ti{font-size:13.5px;font-weight:700;color:var(--navy);margin-bottom:10px}
.stl-form .in{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:0 14px}
.stl-form .in:focus-within{border-color:var(--gold)}
.stl-form .in input{flex:1;border:none;outline:none;font-size:18px;font-weight:700;padding:12px 0;background:transparent;text-align:right;min-width:0;font-variant-numeric:tabular-nums}
.stl-form .in em{font-style:normal;font-size:14px;color:var(--gray)}
.stl-form textarea{width:100%;margin-top:8px;border:1px solid var(--line);border-radius:8px;padding:11px 13px;font-size:14px;min-height:64px;resize:vertical;outline:none;background:#fff;line-height:1.7}
.stl-form textarea:focus{border-color:var(--gold)}
.stl-form .calc{font-size:12.5px;color:var(--gray);margin-top:8px;min-height:1.6em}
.stl-form .calc b{color:var(--navy)}
.stl-form .fine{font-size:11.5px;color:var(--gray-l);margin-top:9px;line-height:1.7}
.stl-sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:14px}
.stl-sum div{background:#fff;padding:14px 16px}
.stl-sum b{display:block;font-size:11.5px;font-weight:500;color:var(--gray-l)}
.stl-sum span{display:block;font-size:17px;font-weight:800;color:var(--ink);margin-top:3px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stl-sum .al span{color:var(--danger)}
.stl-cb{font-size:12px;font-weight:700;padding:5px 11px;border-radius:999px;border:1px solid var(--gold);background:#fff;color:#7A5F1C;cursor:pointer;white-space:nowrap;font-family:inherit}
.stl-cb:hover{background:var(--gold-bg)}
.stl-cb.al{border-color:#E6B8B2;background:var(--danger-bg);color:var(--danger)}
.stl-cb.pulse{animation:stlPulse 1.1s ease 3}
@keyframes stlPulse{0%,100%{box-shadow:0 0 0 0 rgba(168,134,47,0)}50%{box-shadow:0 0 0 6px rgba(168,134,47,.35)}}
@media (prefers-reduced-motion:reduce){.stl-cb.pulse{animation:none;box-shadow:0 0 0 3px rgba(168,134,47,.35)}}
@media(max-width:600px){
  .sgd{padding:18px 16px 16px 20px}
  .sgd .ac{flex-direction:column;align-items:stretch}
  .sgd .go{width:100%}
  .stl-it{padding:15px 14px 14px}
  .stl-amt{font-size:19px}
  .stl-sum{grid-template-columns:1fr}
}
/* ═══ ★ [2026-10-03] 업무제휴 협약서 — 프로필 동의 · 내 의뢰 현황 보기 · 이미지 저장 ═══ */

<body>

<div class="hdwrap"><div class="tb">
  <span class="bk" id="hd-bk">‹</span>

  <button class="nav" id="hd-out" style="display:none">로그아웃</button><!-- ★ [2026-09-30] 전문가 로그인 -->
</div></div>

<div class="pg">
  <div id="v-case" class="view on"><div id="case-body"><div class="load">확인 중</div></div></div>
  <div id="v-list" class="view"><div id="list-body"><div class="load">불러오는 중</div></div></div>

</div>

<div id="agr-gate"></div><!-- ★ [2026-10-03] 협약서 입장 팝업 -->
<div id="agr-pv" role="dialog" aria-modal="true" aria-label="업무제휴 협약서 이미지"><img id="agr-pv-img" alt="업무제휴 협약서"><div class="h">다운로드가 되지 않으면 이미지를 길게 눌러 저장하세요</div><div class="a"><a id="agr-pv-dl" download="업무제휴협약서.png">이미지 다운로드</a><button type="button" id="agr-pv-x">닫기</button></div></div><!-- ★ [2026-10-03] 업무제휴 협약서 이미지 -->

<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import{getFunctions,httpsCallable}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-functions.js';

const FC={apiKey:"AIzaSyBD9p-bf162RiiD1Y3BsY-NvbYjpOSrzmg",authDomain:"jarvia-platform.firebaseapp.com",projectId:"jarvia-platform",storageBucket:"jarvia-platform.firebasestorage.app",messagingSenderId:"388025068900",appId:"1:388025068900:web:09ba8e12e9e9e2ec49de71"};
const app=initializeApp(FC);
const functions=getFunctions(app,'asia-northeast3');
const call=(name,data)=>httpsCallable(functions,name)(data||{}).then(r=>r.data||{});
const VERIFY_URL='https://asia-northeast3-jarvia-platform.cloudfunctions.net/icVerifyExpertToken';

const $=id=>document.getElementById(id);
const esc=s=>{if(s===0)return'0';if(!s)return'';const d=document.createElement('div');d.textContent=s;return d.innerHTML;};
let _tt;const toast=m=>{const e=$('toast');e.textContent=m;e.classList.add('on');clearTimeout(_tt);_tt=setTimeout(()=>e.classList.remove('on'),2600);};
const _md=ms=>{if(!ms)return'-';const d=new Date(ms);return(d.getMonth()+1)+'월 '+d.getDate()+'일';};
const _dt=ms=>{if(!ms)return'';const d=new Date(ms);return _md(ms)+'  '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');};
const _days=ms=>ms?Math.floor((Date.now()-ms)/86400000):0;
const _won=n=>(Number(n)||0).toLocaleString('ko-KR');   /* ★ [2026-09-30] */
/* ★ [2026-09-30] 전문가 로그인 세션 — expert.html 에서 저장 (30일) */
const SKEY='icx_s';
const getSess=()=>{try{const o=JSON.parse(localStorage.getItem(SKEY)||'null');return o&&o.s&&o.exp>Date.now()?o:null;}catch(_){return null;}};
const clearSess=()=>{try{localStorage.removeItem(SKEY);}catch(_){}};
let SS=null,STL_OPEN='';

const CST={received:['신규','st-wt'],ongoing:['진행중','st-rn'],done_pending:['완료','st-of'],done_confirmed:['완료','st-of'],closed:['종료','st-of']};
const STEPS=['자료 검토 중','추가자료 요청','고객 미팅 예정','검토 완료','제안서 작성','계약 협의'];
const ROLE={fc:'컨설턴트',expert:'나',admin:'본사'};

let K='',CASE=null,TL=[],FILES=[],EXPERT=null;
let PK='',PE=null,PTOPICS=[],PSEL=[],PPHOTO='',PCUST=[];   /* 프로필 화면 · ★ [2026-09-28] PCUST = 직접 입력 주제 */
let PDIRTY=false;   /* ★ [2026-09-26] 저장 안 한 프로필 변경 — 나가기 전 확인 */
window.addEventListener('beforeunload',e=>{if(PDIRTY&&$('v-prof')&&$('v-prof').classList.contains('on')){e.preventDefault();e.returnValue='';}});
const FILE_ACCEPT='.pdf,.jpg,.jpeg,.png,.gif,.webp,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.hwp,.zip';
const FILE_MAX=20*1024*1024;
const fmtSize=b=>b>1048576?(b/1048576).toFixed(1)+'MB':Math.ceil(b/1024)+'KB';
const fileLeft=ms=>ms?Math.max(0,Math.ceil((ms-Date.now())/86400000)):null;

/* ═══ 진입 ═══ */
(async function boot(){
  const p=new URLSearchParams(location.search);
  /* ?p= 프로필 링크 — 케이스 없이 프로필만 작성·수정 (본사가 보낸 링크) */
  PK=p.get('p')||'';
  if(PK){
    $('hd-nav').style.display='none';$('hd-prof').style.display='none';
    await loadProfile();agrGate();return;   /* ★ [2026-10-03] 협약서 입장 팝업 */
  }
  K=p.get('k')||'';
  STL_OPEN=['form','focus'].includes(p.get('stl'))?p.get('stl'):'';   /* ★ [2026-09-30] 목록 버튼으로 들어온 경우 */
  /* 구형 링크(?c=&t=) 하위호환 */
  if(!K&&p.get('c')&&p.get('t'))K=p.get('c')+'.'+p.get('t');
  if(!K){
    /* ★ [2026-09-30] 링크 없이 들어오면 전문가 로그인 세션으로 「내 의뢰 현황」, 세션이 없으면 로그인 화면 */
    SS=getSess();
    if(!SS){location.replace('./expert.html');return;}
    $('hd-me').textContent=(SS.name||'')+' 님';
    $('hd-out').style.display='';
    show('list');loadList();setTimeout(agrGate,0);return;   /* ★ [2026-10-03] 협약서 입장 팝업 (모듈 변수 초기화 뒤에 실행) */
  }

  try{
    const r=await fetch(VERIFY_URL+'?k='+encodeURIComponent(K)).then(x=>x.json());
    if(!r.success){fail(r.error||'확인에 실패했습니다.','본사에 문의해 주세요.\n박신제 본부장 010-5244-1467');return;}
    CASE=r.case;TL=r.timeline||[];FILES=r.files||[];EXPERT={id:r.expertId,name:r.expertName};
    if(r.profileKey){PK=r.profileKey;$('hd-prof').style.display='';}
    $('hd-me').textContent=(r.expertName||'')+' 님';
    renderCase();
    agrGate();   /* ★ [2026-10-03] 협약서 입장 팝업 */
  }catch(e){
    fail('연결에 실패했습니다.','잠시 후 다시 시도해 주세요.');
  }
})();

function fail(t,s){
  $('case-body').innerHTML='<div class="empty"><b>'+esc(t)+'</b>'+esc(s).replace(/\n/g,'<br>')+'</div>';
  $('hd-nav').style.display='none';
}

/* ═══ 화면 전환 ═══ */
function show(v){
  $('v-case').classList.toggle('on',v==='case');
  $('v-list').classList.toggle('on',v==='list');
  $('v-prof').classList.toggle('on',v==='prof');
  const sub=v!=='case';
  $('hd-bk').style.display=(sub&&K)||(v==='prof'&&SS)?'inline-block':'none';   /* ★ [2026-09-30] 로그인 모드: 프로필 → 목록 */
  $('hd-ti').textContent=v==='list'?'내 의뢰 현황':(v==='prof'?'내 프로필':'이너서클 상담');
  $('hd-nav').style.display=(v==='case'&&K)?'':'none';
  $('hd-prof').style.display=((v==='case'||(v==='list'&&SS))&&PK)?'':'none';
  if(v==='prof'){setCta(null);window.scrollTo(0,0);return;}   /* ★ [2026-09-29] 프로필 저장은 폼 맨 아래 버튼으로 — 하단 고정바 사용 안 함 */
  setCta(v==='case'&&CASE&&CASE.fcPhone
    ?'<a class="btn" href="tel:'+esc(CASE.fcPhone)+'">'+esc(CASE.fcName||'컨설턴트')+'에게 전화</a>':null);
  window.scrollTo(0,0);
}
function setCta(html){const w=$('fixcta');if(!html){w.innerHTML='';w.classList.remove('on');return;}w.innerHTML=html;w.classList.add('on');}

$('hd-nav').onclick=()=>{show('list');loadList();};
$('hd-prof').onclick=()=>{show('prof');loadProfile();};
$('hd-bk').onclick=()=>{if(PDIRTY&&$('v-prof').classList.contains('on')&&!confirm('저장하지 않은 프로필 내용이 있습니다. 나가시겠습니까?'))return;PDIRTY=false;show(K?'case':'list');};   /* ★ [2026-09-26] · ★ [2026-09-30] 로그인 모드는 목록으로 */
$('hd-out').onclick=()=>{if(!confirm('로그아웃하시겠습니까?'))return;clearSess();location.replace('./expert.html');};   /* ★ [2026-09-30] */

/* ═══ 케이스 화면 ═══ */
function renderCase(){
  const c=CASE, st=CST[c.status]||CST.received;
  const corp=(c.clientType||'corp')==='corp';
  const closed=['done_confirmed','closed'].includes(c.status);
  const R=(k,v)=>v?'<div class="r"><b>'+k+'</b><span>'+esc(v)+'</span></div>':'';

  $('case-body').innerHTML='<div class="two">'
    +'<div>'
    +'<div class="dcard">'
      +'<div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:18px">'
      +'<div><div style="font-size:19px;font-weight:700;letter-spacing:-.03em">'+esc(c.fieldName||c.field)+' · '+esc(c.topic)+'</div>'
      +(c.no?'<div style="font-size:11px;color:var(--gray-l);margin-top:5px">'+esc(c.no)+' · '+_md(c.createdAt)+' 접수</div>':'')
      +'</div><span class="st '+st[1]+'">'+st[0]+'</span></div>'
      +'<div class="lbl">고객 정보</div><div class="kv">'
      +(corp
        ?R('기업',c.company)+R('업종',c.industry)+R('설립',c.foundedYear)
         +R('연매출',c.revenue)+R('임직원',c.employees)
         +R('대표자',[c.ceo,c.ceoAge&&(c.ceoAge+'세')].filter(Boolean).join(' · '))
         +R('소재지',c.region)+R('지분 구조',c.shareStructure)
        :R('고객',[c.clientName,c.clientAge&&(c.clientAge+'세')].filter(Boolean).join(' · '))
         +R('직업',c.job)+R('거주지',c.residence)+R('가족',c.family)+R('주요 자산',c.assets))
      +R('긴급도',c.urgency)
      +'</div>'
      +'<p style="font-size:11.5px;color:var(--gray-l);margin-top:12px">회원이 신청 시 남긴 내용이 그대로 전달됩니다. 부족한 부분은 통화로 확인해 주세요.</p>'
    +'</div>'

    +(c.problem?'<div class="dcard"><div class="lbl">상담 내용</div>'
      +'<div style="font-size:14px;line-height:1.95;white-space:pre-line;color:#1F2733">'+esc(c.problem)+'</div></div>':'')

    +'<div class="dcard" id="ex-stl"><div class="load">불러오는 중</div></div>'   /* ★ [2026-09-30] 유료 컨설팅 내역 */

    +'<div class="dcard"><div class="lbl">첨부 자료</div>'
    +(FILES.length
      ?FILES.map(f=>'<div class="fileb" data-fid="'+esc(f.id)+'">'
        +'<span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis">'+esc(f.name)+'</span>'
        +'<span style="font-size:11px;color:var(--gray-l)">'+esc(f.uploadedBy==='expert'?'내가 올림':'컨설턴트')+' · '+fmtSize(f.size)+'</span>'
        +(fileLeft(f.deleteAt)!==null?'<span class="exp">D-'+fileLeft(f.deleteAt)+'</span>':'')+'</div>').join('')
      :'<div style="font-size:12.5px;color:var(--gray-l);padding:6px 0">첨부된 자료가 없습니다</div>')
    +(closed?''
      :'<div style="margin-top:10px"><input type="file" id="ex-file" accept="'+FILE_ACCEPT+'" style="display:none">'
       +'<button class="btn sec" id="ex-up" style="width:auto;display:inline-block;padding:10px 18px">자료 올리기</button>'
       +'<span id="ex-up-msg" style="font-size:12px;color:var(--gray-l);margin-left:10px"></span></div>')
    +'<p style="font-size:11.5px;color:var(--gray-l);margin-top:10px;line-height:1.7">파일을 누르면 내려받습니다. 업로드 30일, 내려받은 뒤 7일이 지나면 자동 삭제됩니다. 내려받은 파일은 보관에 유의해 주세요.</p></div>'

    +'<div class="dcard"><div class="lbl">진행 기록</div>'
    +(TL.length?'<div class="tl">'+TL.map(ev=>
        '<div class="ev'+(ev.actorRole==='system'?' sys':'')+'">'
        +'<div class="dt">'+_dt(ev.createdAt)+'</div>'
        +(ev.actorRole==='system'?'':'<div class="who">'+esc(ev.actorRole==='expert'?'나':(ev.actorName||ROLE[ev.actorRole]||''))+'</div>')
        +'<div class="tx"'+(ev.actorRole==='system'?' style="color:var(--gray)"':'')+'>'+esc(ev.text||'')+'</div></div>').join('')+'</div>'
      :'<div class="empty" style="padding:30px">아직 기록이 없습니다.</div>')

    +(closed
      ?'<div style="margin-top:20px;padding-top:20px;border-top:1px solid var(--line-2);font-size:12.5px;color:var(--gray-l);text-align:center">종료된 상담입니다</div>'
      :'<div style="margin-top:20px;padding-top:20px;border-top:1px solid var(--line-2)">'
       +'<div class="lbl">진행 상황 남기기</div>'
       +'<div class="tps" id="ex-step">'+STEPS.map(s=>'<span data-v="'+s+'">'+s+'</span>').join('')+'</div>'
       +'<div class="fld"><textarea id="ex-memo" placeholder="컨설턴트에게 전할 내용 (선택)"></textarea></div>'
       +'<button class="btn" id="ex-save">기록 남기기</button>'
       +'<p style="font-size:11.5px;color:var(--gray-l);margin-top:9px;line-height:1.7">남기신 기록은 컨설턴트와 본사가 함께 봅니다.</p></div>')
    +'</div></div>'

    +'<aside class="side">'

async function uploadFile(file,onMsg){
  if(file.size>FILE_MAX){toast('20MB 이하 파일만 올릴 수 있습니다');return false;}
  onMsg&&onMsg('준비 중');
  const r=await call('icUploadFile',{k:K,name:file.name,size:file.size,mime:file.type||'application/octet-stream'});
  if(!r.success){toast(r.error||'업로드 준비 실패');return false;}
  onMsg&&onMsg('업로드 중');
  /* 서버가 서명에 쓴 contentType 을 그대로 보낸다 — 다르면 Storage 가 403 */
  const put=await fetch(r.uploadUrl,{method:'PUT',headers:{'Content-Type':r.contentType||file.type||'application/octet-stream'},body:file});
  if(!put.ok){toast('업로드에 실패했습니다');return false;}
  onMsg&&onMsg('확인 중');
  const c=await call('icConfirmFile',{k:K,fileId:r.fileId});
  if(!c.success){toast(c.error||'업로드 확인 실패');return false;}
  return true;
}
async function downloadFile(fileId){
  const r=await call('icDownloadFile',{k:K,fileId});
  if(!r.success){toast(r.error||'다운로드 준비 실패');return;}
  window.location.href=r.url;
}

async function saveNote(){
  const el=document.querySelector('#ex-step span.on');
  const step=el?el.dataset.v:'';
  const memo=($('ex-memo').value||'').trim();
  if(!step&&!memo)return toast('남길 내용을 선택해 주세요');
  const b=$('ex-save');b.disabled=true;b.textContent='저장 중';
  try{
    const r=await call('icExpertNote',{k:K,step,memo});
    if(!r.success){toast(r.error||'저장에 실패했습니다');return;}
    toast('기록을 남겼습니다');
    /* 재조회 — 타임라인·상태 갱신 */
    const v=await fetch(VERIFY_URL+'?k='+encodeURIComponent(K)).then(x=>x.json());
    if(v.success){CASE=v.case;TL=v.timeline||[];FILES=v.files||[];renderCase();}
  }catch(e){toast('저장 중 오류가 발생했습니다');}
  finally{if($('ex-save')){b.disabled=false;b.textContent='기록 남기기';}}
}

/* ═══ 상담 받기 토글 ═══ */
async function initToggle(){
  const sw=$('ex-sw');if(!sw)return;
  /* 현재 상태는 목록 API 에서 함께 온다 — 초기 렌더 시 1회 조회 */
  try{
    const r=await call('icExpertCases',{k:K});
    if(r.success&&r.expert){EXPERT={...EXPERT,status:r.expert.status};applyToggle(r.expert.status);}
  }catch(_){}
  sw.onclick=async()=>{
    const accept=!sw.classList.contains('on');
    if(!accept&&!confirm('신규 상담을 받지 않도록 설정합니다.\n전문가 목록에 「상담 중지」로 표시됩니다.\n\n계속하시겠습니까?'))return;
    try{
      const r=await call('icExpertStatus',{k:K,accept});
      if(!r.success){toast(r.error||'변경에 실패했습니다');return;}
      applyToggle(r.status);
      toast(accept?'신규 상담을 받습니다':'신규 상담을 받지 않습니다');
    }catch(e){toast('변경 중 오류가 발생했습니다');}
  };
}
function applyToggle(status){
  const sw=$('ex-sw'),t=$('ex-tog-t');if(!sw)return;
  const on=status!=='off';
  sw.classList.toggle('on',on);
  if(t)t.textContent=status==='busy'?'본사가 「상담 지연」으로 표시 중입니다':(on?'당분간 새 상담을 받지 않으려면 끄세요':'현재 새 상담을 받지 않습니다');
}

function fmtTel(v){
  const d=String(v||'').replace(/\D/g,'').slice(0,11);
  if(d.length<4)return d;
  if(d.length<8)return d.slice(0,3)+'-'+d.slice(3);
  if(d.length<11)return d.slice(0,3)+'-'+d.slice(3,6)+'-'+d.slice(6);
  return d.slice(0,3)+'-'+d.slice(3,7)+'-'+d.slice(7);
}

   · 칸당 20자 · 최대 10개 · 빈칸 제외 · 띄어쓰기만 다른 중복 제외
   · 정식 주제(칩)와 같은 이름이면 입력칸이 아니라 칩 선택으로 옮긴다 ═══ */
const CTP_MAX=10,CTP_LEN=20;
function ctpKey(v){return String(v||'').replace(/\s+/g,'').toLowerCase();}
function ctpRow(v){
  const r=document.createElement('div');r.className='ctp-r';
  r.innerHTML='<input maxlength="'+CTP_LEN+'" placeholder="목록에 없는 주제를 입력하세요"><button type="button" aria-label="삭제">×</button>';
  const inp=r.querySelector('input');inp.value=v||'';
  inp.addEventListener('input',()=>{PDIRTY=true;});
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();ctpAdd();}});
  r.querySelector('button').onclick=()=>{
    const box=$('pf-ctp');
    if(box.children.length>1)r.remove();else inp.value='';   /* 마지막 한 칸은 비우기만 */
    PDIRTY=true;ctpSync();
  };
  return r;
}
function ctpRender(list){
  const box=$('pf-ctp');if(!box)return;box.innerHTML='';
  (list&&list.length?list:['']).slice(0,CTP_MAX).forEach(v=>box.appendChild(ctpRow(v)));
  ctpSync();
}
function ctpSync(){const b=$('pf-ctp-add'),box=$('pf-ctp');if(b&&box)b.disabled=box.children.length>=CTP_MAX;}
function ctpAdd(){
  const box=$('pf-ctp');if(!box)return;
  if(box.children.length>=CTP_MAX)return toast('직접 입력 주제는 최대 '+CTP_MAX+'개까지입니다');
  const empty=Array.from(box.querySelectorAll('input')).find(i=>!i.value.trim());
  if(empty){empty.focus();return;}   /* 빈칸이 남아 있으면 그 칸으로 */
  const r=ctpRow('');box.appendChild(r);ctpSync();r.querySelector('input').focus();
}
/* 저장용 — { list: 직접 입력 주제, toPreset: 칩과 같은 이름이라 칩 선택으로 옮길 주제 } */
function ctpCollect(){
  const box=$('pf-ctp'),list=[],toPreset=[],seen=new Set();
  if(!box)return{list,toPreset};
  box.querySelectorAll('input').forEach(i=>{
    const v=String(i.value||'').replace(/\s+/g,' ').trim().slice(0,CTP_LEN);if(!v)return;
    const k=ctpKey(v);if(seen.has(k))return;seen.add(k);
    const pre=PTOPICS.find(x=>ctpKey(x)===k);
    if(pre)toPreset.push(pre);else list.push(v);
  });
  return{list:list.slice(0,CTP_MAX),toPreset};
}
/* 저장값(「서울 · 경기」)을 칩으로 — 목록에 없는 기존 값도 칩으로 보여 줘 저장 시 사라지지 않게 한다 */
function chipsRender(boxId,list,valueStr,solo){
  const box=$(boxId);if(!box)return;
  const cur=String(valueStr||'').split(/\s*[·,\/]\s*/).map(x=>x.trim()).filter(Boolean);
  const all=list.concat(cur.filter(x=>!list.includes(x)));
  box.innerHTML=all.map(x=>'<span data-v="'+esc(x)+'" class="'+(cur.includes(x)?'on':'')+'">'+esc(x)+'</span>').join('');
  box.querySelectorAll('span').forEach(el=>el.onclick=()=>{
    const on=!el.classList.contains('on');el.classList.toggle('on',on);
    if(on&&solo)box.querySelectorAll('span').forEach(o=>{if(o!==el&&(el.dataset.v===solo||o.dataset.v===solo))o.classList.remove('on');});
    PDIRTY=true;
  });
}
function chipsValue(boxId){
  const box=$(boxId);if(!box)return '';
  return Array.from(box.querySelectorAll('span.on')).map(el=>el.dataset.v).join(' · ');
}
/* ★ [2026-09-26] 사진 위치 조정 — 원형 미리보기 안에서 끌어서 상하좌우 이동, 막대로 확대·축소 → 정사각 800px JPEG
   (프로필은 원형으로 보이므로 얼굴을 가운데로 맞출 수 있게 한다. 마우스·손가락 모두 지원) */
function cropPhoto(file){
  return new Promise((ok,no)=>{
    const url=URL.createObjectURL(file);const img=new Image();
    img.onload=()=>{
      const W=img.naturalWidth,H=img.naturalHeight;
      if(!W||!H){URL.revokeObjectURL(url);no(new Error('size'));return;}
      const V=Math.min(260,window.innerWidth-80);const base=Math.max(V/W,V/H);let s=base,x=(V-W*s)/2,y=(V-H*s)/2;
      const ov=document.createElement('div');
      ov.style.cssText='position:fixed;inset:0;background:rgba(15,23,42,.72);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px';
      ov.innerHTML='<div style="background:#fff;border-radius:14px;padding:18px 18px 16px;max-width:340px;width:100%;text-align:center">'
        +'<div style="font-weight:700;font-size:15px;margin-bottom:4px">사진 위치 조정</div>'
        +'<div style="font-size:12px;color:#6B7280;margin-bottom:12px;line-height:1.6">사진을 끌어서 얼굴을 원 가운데에 맞추고<br>아래 막대로 크기를 조절하세요</div>'
        +'<div id="cp-vp" style="width:'+V+'px;height:'+V+'px;margin:0 auto;border-radius:50%;overflow:hidden;position:relative;background:#EDF0F4;touch-action:none;cursor:grab;box-shadow:0 0 0 3px #E5E7EB"><img id="cp-img" alt="" draggable="false" style="position:absolute;left:0;top:0;max-width:none;user-select:none;-webkit-user-drag:none;pointer-events:none"></div>'
        +'<div style="display:flex;align-items:center;gap:8px;width:'+V+'px;margin:14px auto 0"><span style="font-size:12px;color:#6B7280">작게</span><input id="cp-z" type="range" min="1" max="3" step="0.01" value="1" style="flex:1"><span style="font-size:12px;color:#6B7280">크게</span></div>'
        +'<div style="display:flex;gap:8px;justify-content:center;margin-top:14px"><button type="button" class="btn sec" id="cp-no">취소</button><button type="button" class="btn" id="cp-ok">적용</button></div></div>';
      document.body.appendChild(ov);
      const vp=ov.querySelector('#cp-vp'),im=ov.querySelector('#cp-img'),zr=ov.querySelector('#cp-z');im.src=url;
      const draw=()=>{const w=W*s,h=H*s;x=Math.min(0,Math.max(V-w,x));y=Math.min(0,Math.max(V-h,y));
        im.style.width=w+'px';im.style.height=h+'px';im.style.transform='translate('+x+'px,'+y+'px)';};
      draw();
      let dr=null;
      vp.addEventListener('pointerdown',e=>{dr={px:e.clientX,py:e.clientY,x,y};try{vp.setPointerCapture(e.pointerId);}catch(_){}vp.style.cursor='grabbing';});
      vp.addEventListener('pointermove',e=>{if(!dr)return;x=dr.x+(e.clientX-dr.px);y=dr.y+(e.clientY-dr.py);draw();});
      const end=()=>{dr=null;vp.style.cursor='grab';};vp.addEventListener('pointerup',end);vp.addEventListener('pointercancel',end);
      zr.addEventListener('input',()=>{const cx=(V/2-x)/s,cy=(V/2-y)/s;s=base*(+zr.value);x=V/2-cx*s;y=V/2-cy*s;draw();});   /* 가운데 기준 확대 */
      const close=()=>{ov.remove();URL.revokeObjectURL(url);};
      ov.querySelector('#cp-no').onclick=()=>{close();no(new Error('cancel'));};
      ov.querySelector('#cp-ok').onclick=()=>{
        const O=800,c=document.createElement('canvas');c.width=O;c.height=O;const g=c.getContext('2d');
        g.fillStyle='#fff';g.fillRect(0,0,O,O);const sw=V/s;g.drawImage(img,-x/s,-y/s,sw,sw,0,0,O,O);
        close();c.toBlob(b=>b?ok(b):no(new Error('blob')),'image/jpeg',0.86);
      };
    };
    img.onerror=()=>{URL.revokeObjectURL(url);no(new Error('decode'));};
    img.src=url;
  });
}
/* ★ [2026-09-26] 사진 자동 축소 — 긴 변 800px JPEG. 회원 화면 전문가 목록이 사진 때문에 느려지지 않게 */
function shrinkPhoto(file){
  return new Promise((ok,no)=>{
    const img=new Image();const url=URL.createObjectURL(file);
    img.onload=()=>{
      const M=800;let w=img.naturalWidth,h=img.naturalHeight;
      if(!w||!h){URL.revokeObjectURL(url);no(new Error('size'));return;}
      const k=Math.min(1,M/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);
      const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
      x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);URL.revokeObjectURL(url);
      c.toBlob(b=>b?ok(b):no(new Error('blob')),'image/jpeg',0.86);
    };
    img.onerror=()=>{URL.revokeObjectURL(url);no(new Error('decode'));};
    img.src=url;
  });
}

async function uploadProfilePhoto(){
  const fi=$('pf-photo'),f=fi.files&&fi.files[0];if(!f)return;
  const msg=$('pf-photo-msg');
  if(f.size>10*1024*1024){toast('10MB 이하 이미지만 올릴 수 있습니다');fi.value='';return;}
  /* ★ [2026-09-26] 위치 조정 창 → 확정한 정사각 사진을 올린다. 취소하면 아무것도 올리지 않는다.
     조정 창을 열 수 없는 형식이면 자동 축소, 그것도 안 되면 원본 */
  let up=f;
  try{up=await cropPhoto(f);}
  catch(e){if(e&&e.message==='cancel'){fi.value='';return;}try{up=await shrinkPhoto(f);}catch(_){up=f;}}
  msg.textContent='업로드 중';
  try{
    const r=await call('icProfilePhoto',{p:PK,mime:up.type||f.type||'image/jpeg',size:up.size});
    if(!r.success){toast(r.error||'업로드 준비 실패');msg.textContent='';return;}
    const put=await fetch(r.uploadUrl,{method:'PUT',headers:{'Content-Type':r.contentType},body:up});
    if(!put.ok){toast('업로드에 실패했습니다');msg.textContent='';return;}
    PPHOTO=r.photoUrl;PDIRTY=true;
    const av=$('pf-av');av.style.backgroundImage='url('+PPHOTO+')';av.textContent='';
    msg.textContent='사진이 올라갔습니다. 저장을 눌러야 반영됩니다.';msg.style.color='var(--ok)';
  }catch(e){toast('업로드 중 오류가 발생했습니다');msg.textContent='';}
  finally{fi.value='';}
}

async function saveProfile(){

  if(!V('pf-title'))return toast('직함을 입력해 주세요');
  /* ★ [2026-09-26] 저장 전 확인 — 주제 미선택이면 회원 검색에 나오지 않음 · 번호 형식 · 인사말 길이 */

  CT.toPreset.forEach(t=>{if(!PSEL.includes(t)){PSEL.push(t);const c=document.querySelector('#pf-tps span[data-t="'+CSS.escape(t)+'"]');if(c)c.classList.add('on');}});
  if(!PSEL.length&&!CT.list.length)return toast('상담 가능 주제를 1개 이상 선택하거나 입력해 주세요 (선택·입력한 주제로 회원이 찾습니다)');
  const telOk=v=>!v||/^01[016789]-?\d{3,4}-?\d{4}$/.test(v.replace(/\s/g,''));
  if(!telOk(V('pf-phone')))return toast('연락처를 010-0000-0000 형식으로 입력해 주세요');
  if(!telOk(V('pf-alim')))return toast('알림톡 받을 번호를 010-0000-0000 형식으로 입력해 주세요');
  if(V('pf-greeting').length>1500)return toast('인사말은 1,500자 이내로 줄여 주세요');
  if(['pf-career','pf-cases','pf-greeting'].some(id=>V(id).includes(EX_MARK)))return toast('예시 문구가 남아 있습니다. 실제 내용으로 바꿔 주세요');   /* ★ [2026-09-28] */
  /* ★ [2026-10-03] 업무제휴 협약서 — 현재 버전에 동의하지 않았으면 저장하지 않는다 */
  const agrCk=$('pf-agr-ck'),agrPv=$('pf-agr-pv');
  if(!agrDone(PE&&PE.agreement,PE&&PE.feeRate)&&!(agrCk&&agrCk.checked&&agrPv&&agrPv.checked)){

    $('pf-agr').scrollIntoView({behavior:'smooth',block:'center'});
    return toast(agrCk&&agrCk.checked?'개인정보 수집·이용 및 제공에 동의해 주세요':'업무제휴 협약서에 동의해 주세요');
  }
  const b=$('pf-save-fix');if(b){b.disabled=true;b.textContent='저장 중';}
  try{
    const r=await call('icProfileSave',{
      p:PK, title:V('pf-title'), org:V('pf-org'), phone:V('pf-phone'), alimtalkPhone:V('pf-alim'),
      region:chipsValue('pf-region'), method:chipsValue('pf-method'), subTopics:PSEL, customTopics:CT.list,   /* ★ [2026-09-28] 칩 선택 → 「서울 · 경기」 · 직접 입력 주제 */
      career:V('pf-career'), certs:V('pf-certs'), cases:V('pf-cases'), greeting:V('pf-greeting'),
      photoUrl:PPHOTO,
      agreeVersion:(agrCk&&agrCk.checked)?AGR.v:'',   /* ★ [2026-10-03] 서버가 동의 일시·버전·수수료율·성명·문안을 기록 */
      agreeFee:(agrCk&&agrCk.checked)?PE.feeRate:null,   /* 화면에 보인 수수료율 — 그사이 바뀌었으면 서버가 거절 */
      agreePrivacy:!!(agrPv&&agrPv.checked)   /* ★ 개인정보 수집·이용 및 제공 동의 (별도 체크) */
    });
    if(!r.success){toast(r.error||'저장에 실패했습니다');return;}
    PDIRTY=false;AGR_ME=null;
    alert(PE&&PE.active&&PE.profileCompletedAt
      ?'저장되었습니다.\n\n회원 화면에 바로 반영됩니다.\n수정이 필요하면 이 링크로 다시 들어오시면 됩니다.'
      :'저장되었습니다.\n\n본사가 내용을 확인한 뒤 회원 화면에 공개합니다.\n수정이 필요하면 이 링크로 다시 들어오시면 됩니다.');   /* ★ [2026-09-26] 공개 여부로 안내 구분 */

/* ═══ ★ [2026-09-30] 유료 컨설팅 내역 — 입력 → 상호 확인 → 본사 승인 ═══
   me : 'fc'(이너회원) | 'expert'(전문가)
   ctx: { list(), report({amount,memo,sid}), respond(sid,action,reason), done() }  */
const STL_WHO={fc:'전문위원',expert:'전문가',admin:'본사'};
function stlStatus(it,me){
  if(it.status==='await_counter')return it.counterRole===me?['내 확인 필요','st-wt']:['상대방 확인 대기','st-bs'];
  if(it.status==='revise')return it.reportedRole===me?['수정 필요','st-wt']:['수정 요청함','st-bs'];
  if(it.status==='await_hq')return['본사 승인 대기','st-rn'];
  if(it.status==='confirmed')return['확정','st-ok'];
  return['반려','st-of'];
}
function stlSteps(it){
  const lv={await_counter:1,revise:0,await_hq:2,confirmed:3,rejected:-1}[it.status];
  return '<div class="stl-steps" aria-label="진행 단계">'+['입력','상호 확인','본사 승인'].map(function(t,i){
    return '<span class="'+(i<lv?'dn':(i===lv?'cur':''))+'">'+t+'</span>';}).join('')+'</div>';
}
function stlMine(it){
  const d=new Date(it.reportedAt||0);
  return (it.reportedName||STL_WHO[it.reportedRole]||'')+' 입력'+(it.reportedAt?' · '+(d.getMonth()+1)+'월 '+d.getDate()+'일':'');
}
function stlItem(it,me){
  const s=stlStatus(it,me);
  const myTurn=(it.status==='await_counter'&&it.counterRole===me)||((it.status==='revise'||it.status==='rejected')&&it.reportedRole===me);
  const his=(it.history||[]);
  return '<div class="stl-it'+(myTurn?' me':'')+'" data-sid="'+esc(it.id)+'">'
    +'<div class="stl-hd"><div><div class="stl-amt">'+_won(it.amount)+'<small>원</small></div>'
    +'<div class="stl-sub">'+esc(stlMine(it))+'</div></div>'
    +'<span class="st '+s[1]+'">'+s[0]+'</span></div>'
    +(it.status==='rejected'?'':stlSteps(it))
    +(it.memo?'<div class="stl-note">'+esc(it.memo)+'</div>':'')
    +(it.status==='revise'&&it.reviseReason?'<div class="stl-warn">수정 요청 사유 · '+esc(it.reviseReason)+'</div>':'')
    +(it.status==='rejected'&&it.rejectReason?'<div class="stl-warn">반려 사유 · '+esc(it.rejectReason)+'</div>':'')
    +(it.status==='await_counter'&&it.counterRole===me
      ?'<div class="stl-ac"><button data-act="revise">수정 요청</button><button class="pri" data-act="confirm">내용 확인</button></div>'
       +'<div class="stl-rv" hidden><textarea aria-label="수정 요청 사유" placeholder="수정이 필요한 내용을 적어 주세요 (예: 계약금액이 12,000,000원입니다)"></textarea>'
       +'<div class="stl-ac"><button data-act="rvcancel">취소</button><button class="pri" data-act="rvsend">수정 요청 보내기</button></div></div>':'')
    +((it.status==='revise'||it.status==='rejected')&&it.reportedRole===me
      ?'<div class="stl-ac"><button class="pri" data-act="redo">다시 입력</button></div>':'')
    +(his.length?'<details class="stl-his"><summary>처리 이력 '+his.length+'건</summary><ol>'
      +his.map(function(h){const d=new Date(h.at||0);
        return '<li>'+(d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')
          +' · <b>'+esc(h.name||STL_WHO[h.role]||'')+'</b> '+esc(h.action||'')
          +(h.amount!=null&&h.action!=='지급 완료'&&h.action!=='지급 정보 입력'?' '+_won(h.amount)+'원':'')
          +(h.note?' — '+esc(h.note):'')+'</li>';}).join('')+'</ol></details>':'')
    +'</div>';
}
function stlForm(wrap,me,rate,ctx,pre){
  const other=me==='fc'?'전문가':'전문위원';
  const ga=other==='전문위원'?'이':'가';   /* ★ [2026-10-03] 조사 — 전문위원이 / 전문가가 */
  wrap.innerHTML='<div class="stl-form">'
    +'<div class="ti">'+(pre?'내역 다시 입력':'유료 컨설팅 내역 입력')+'</div>'
    +'<div class="in"><input id="stl-amt" inputmode="numeric" autocomplete="off" placeholder="계약금액" aria-label="계약금액"><em>원</em></div>'
    +'<textarea id="stl-memo" placeholder="메모 (선택) · 예: 가업승계 자문 계약, 10월 착수" aria-label="메모"></textarea>'
    +'<div class="stl-ac"><button id="stl-cancel">취소</button><button class="pri" id="stl-save">'+(pre?'다시 입력하기':'입력하기')+'</button></div>'
    +'<div class="fine">입력하면 '+other+ga+' 내용을 확인한 뒤 본사가 최종 승인합니다.</div></div>';
  const q=sel=>wrap.querySelector(sel);   /* 화면 안에서만 찾는다 */
  const inp=q('#stl-amt'),memo=q('#stl-memo');
  const val=()=>Number(String(inp.value).replace(/\D/g,''))||0;
  inp.oninput=()=>{const v=val();inp.value=v?v.toLocaleString('ko-KR'):'';};
  if(pre){inp.value=_won(pre.amount);memo.value=pre.memo||'';}
  inp.focus();
  q('#stl-cancel').onclick=()=>{ctx.done(false);};
  q('#stl-save').onclick=async()=>{
    const v=val();
    if(!v){toast('계약금액을 입력해 주세요');inp.focus();return;}
    if(!confirm('계약금액 '+_won(v)+'원으로 입력합니다.\n'+other+ga+' 확인한 뒤 본사가 최종 승인합니다.'))return;
    const b=q('#stl-save');b.disabled=true;b.textContent='저장 중';
    try{
      const r=await ctx.report({amount:v,memo:(memo.value||'').trim(),sid:pre?pre.sid:''});
      if(!r.success){toast(r.error||'저장에 실패했습니다');b.disabled=false;b.textContent=pre?'다시 입력하기':'입력하기';return;}
      toast(pre?'다시 입력했습니다':'입력했습니다. '+other+' 확인을 기다립니다');
      ctx.done(true);
    }catch(e){toast('저장 중 오류가 발생했습니다');b.disabled=false;b.textContent=pre?'다시 입력하기':'입력하기';}
  };
}
async function stlMount(box,me,ctx){
  if(!box)return;
  let r;
  try{r=await ctx.list();}catch(e){r={success:false};}
  if(!r||!r.success){box.innerHTML='<div class="lbl">유료 컨설팅 내역</div><div style="font-size:12.5px;color:var(--gray-l)">'+esc((r&&r.error)||'내역을 불러오지 못했습니다')+'</div>';return;}
  const rate=me==='fc'?r.promoRate:r.eduRate;
  const items=r.items||[];
  box.innerHTML='<div class="lbl">유료 컨설팅 내역</div>'
    +'<div class="stl-tip">'+(me==='fc'
      ?'이 상담이 유료 컨설팅으로 이어졌다면 계약이 끝난 뒤 내역을 입력해 주세요.'
      :'유료 컨설팅 계약이 끝나면 반드시 내역을 입력해 주세요. 분야별 컨설팅 통계자료 생성에 사용됩니다.')+'</div>'
    +(items.length?items.map(function(it){return stlItem(it,me);}).join('')
      :'<div style="font-size:12.5px;color:var(--gray-l);padding:2px 0 4px">아직 입력된 내역이 없습니다.</div>')
    +(r.canReport?'<div id="stl-fw"><button class="stl-add" id="stl-add">＋ 유료 컨설팅 내역 입력</button></div>':'');
  const fw=box.querySelector('#stl-fw');
  const openForm=pre=>{stlForm(fw,me,rate,Object.assign({},ctx,{done:ok=>{if(ok)ctx.done();else stlMount(box,me,ctx);}}),pre);};
  const add=box.querySelector('#stl-add');if(add)add.onclick=()=>openForm(null);
  /* ★ 목록의 「＋ 입력」「확인 필요」 버튼으로 들어온 경우 — 입력 폼을 펼치거나 확인할 내역으로 바로 이동 */
  if(ctx.open){
    const t=ctx.open;ctx.open='';
    setTimeout(function(){
      if(t==='form'){const a=box.querySelector('#stl-add');if(a)a.click();}
      const target=(t==='focus'&&box.querySelector('.stl-it.me'))||box.querySelector('.stl-form')||box;
      target.scrollIntoView({behavior:'smooth',block:'center'});
    },80);
  }
  box.querySelectorAll('.stl-it').forEach(function(el){
    const sid=el.dataset.sid, it=items.find(x=>x.id===sid);
    el.querySelectorAll('[data-act]').forEach(function(b){b.onclick=async function(){
      const act=b.dataset.act;
      if(act==='redo'){if(fw)fw.scrollIntoView({behavior:'smooth',block:'center'});openForm({sid:sid,amount:it.amount,memo:it.memo});return;}
      /* 수정 요청 — 카카오톡 인앱 브라우저에서 prompt() 가 막히는 경우가 있어 입력칸을 펼친다 */
      const rv=el.querySelector('.stl-rv');
      if(act==='revise'){if(rv){rv.hidden=false;const t=rv.querySelector('textarea');if(t)t.focus();}return;}
      if(act==='rvcancel'){if(rv){rv.hidden=true;rv.querySelector('textarea').value='';}return;}
      let reason='';
      if(act==='rvsend'){reason=((rv&&rv.querySelector('textarea').value)||'').trim();if(!reason){toast('수정이 필요한 내용을 적어 주세요');return;}}
      if(act==='confirm'&&!confirm('계약금액 '+_won(it.amount)+'원이 맞습니까?\n확인하면 본사 승인 단계로 넘어갑니다.'))return;
      const action=act==='rvsend'?'revise':act;
      b.disabled=true;
      try{
        const x=await ctx.respond(sid,action,reason);
        if(!x.success){toast(x.error||'처리에 실패했습니다');b.disabled=false;return;}
        toast(action==='confirm'?'확인했습니다. 본사 승인을 기다립니다':'수정을 요청했습니다');
        ctx.done();
      }catch(e){toast('처리 중 오류가 발생했습니다');b.disabled=false;}
    };});
  });
}

let AGR_ME=null;   /* 내 의뢰 현황에서 쓰는 {name, feeRate, agreement} — 프로필 저장 후 비운다 */
const agrDone=(a,fee)=>!!(a&&a.version===AGR.v&&a.agreedAt&&a.feeRate===fee&&a.privacy===true);
const agrFeeChanged=(a,fee)=>!!(a&&a.version===AGR.v&&a.agreedAt&&a.feeRate!==fee);   /* 수수료율 변경 → 재동의 */

function agrHtml(name,a,fee,hl){   /* hl: 재동의 때 동의 당시 원문과 달라진 줄(Set) — 노란색 표시 */
  const nm=name||'(전문가성명)',ok=agrDone(a,fee),H=t=>hl&&hl.has(t)?' class="agr-hl"':'';
  return '<div class="agr"><div class="agr-t">'+esc(AGR.title)+'</div>'
    +'<p'+H(AGR.intro(nm,fee))+'>'+esc(AGR.intro(nm,fee))+'</p>'
    +AGR.arts(fee,nm).map(x=>'<h5'+H(x[0])+'>'+esc(x[0])+'</h5>'+x[1].map(t=>'<p'+H(t)+'>'+esc(t)+'</p>').join('')).join('')
    +'<h5'+H(AGR.pvTitle)+'>'+esc(AGR.pvTitle)+'</h5><dl class="agr-pv">'+AGR.pvRows(fee,nm).map(x=>'<dt>'+esc(x[0])+'</dt><dd'+H('· '+x[0]+' : '+x[1])+'>'+esc(x[1])+'</dd>').join('')+'</dl>'
    +'<div class="agr-sg">'+(ok?'☑ ':'☐ ')+esc(AGR.check)+'<br>'+(ok?'☑ ':'☐ ')+esc(AGR.check2)+'<br>'
    +'계약일 · '+(ok?_ymdhm(a.agreedAt)+' (전자 동의)':'동의 시 기록됩니다')+'<br>'
    +'갑 · (주)한국FP센터<br>을 · '+esc(nm)+'</div></div>';
}
function agrCard(E){
  const a=E.agreement,fee=E.feeRate,ok=agrDone(a,fee);
  return '<div class="dcard" id="pf-agr"><div class="lbl">업무제휴 협약서</div>'
    +'<div class="agr-scroll">'+agrHtml(E.name,a,fee)+'</div>'
    +(ok?'<div class="agr-ok">✓ 동의 완료 · '+_ymdhm(a.agreedAt)+' · 수수료 '+fee+'%</div>'
        :(agrFeeChanged(a,fee)?'<div style="font-size:12.5px;color:var(--danger);margin-top:12px">'+AGR_RE+' (동의 당시 '+a.feeRate+'% → 현재 '+fee+'%)</div>':'')
         +'<label class="agr-ck"><input type="checkbox" id="pf-agr-ck"><span>'+esc(AGR.check)+'<em>(필수)</em></span></label>'
         +'<label class="agr-ck" style="margin-top:8px"><input type="checkbox" id="pf-agr-pv"><span>'+esc(AGR.check2)+'<em>(필수)</em></span></label>')
    +'<button type="button" class="agr-dl" data-agr-dl>협약서 이미지로 저장</button></div>';
}
function agrBind(box,name,a,fee){
  if(!box)return;
  ['#pf-agr-ck','#pf-agr-pv'].forEach(sel=>{const ck=box.querySelector(sel);
    if(ck)ck.onchange=()=>{const lb=ck.closest('.agr-ck');if(lb)lb.classList.remove('need');};});
  const dl=box.querySelector('[data-agr-dl]');
  if(dl)dl.onclick=()=>agrImage(name,a,fee);
}
/* ★ [2026-10-03] 서버에서 협약서 문안·내 수수료율·동의 상태를 받는다 — 프로필 링크(p) · 상담 링크(k) · 로그인 세션(s) */
const agrIdent=()=>PK?{p:PK}:(K?{k:K}:(SS&&SS.s?{s:SS.s}:null));
async function agrFetch(){
  const id=agrIdent();if(!id)return null;
  let r;try{r=await call('icAgreementGet',id);}catch(e){r=null;}
  if(!r||!r.success)return null;
  agrSetTpl(r.template);
  AGR_ME={name:r.name||'',feeRate:r.feeRate,agreement:r.agreement||null,valid:!!r.valid,changes:r.changes||[],changedLines:r.changedLines||[]};
  return r;
}
/* 입장 팝업 — 동의 전·재동의 필요면 들어올 때 띄운다. [나중에]는 이 접속(탭) 동안만 다시 묻지 않는다 */
let AGR_GATE_RAN=false;
async function agrGate(){
  if(AGR_GATE_RAN)return;AGR_GATE_RAN=true;
  const r=await agrFetch();if(!r||r.valid)return;
  try{if(sessionStorage.getItem('icx_agr_later')===AGR.v)return;}catch(_){}
  const me=AGR_ME,a=me.agreement,fee=me.feeRate,box=$('agr-gate');if(!box)return;
  /* 처음 동의 = 전체 협약서만 · 재동의 = 변경 안내 + 달라진 줄 노란색 */
  const re=!!(a&&a.agreedAt),feeChg=re&&a.feeRate!==fee,verChg=re&&a.version!==AGR.v;
  const why=!re?'이너서클 전문가 활동을 위해 아래 협약서와 개인정보 수집·이용에 동의해 주세요.'
    :'동의하신 협약서가 변경되었습니다. 변경 내용을 확인하고 다시 동의해 주세요.';
  const notes=(re?(me.changes||[]):[]).map(c=>'<li><em>'+(c.at?_ymd(c.at):esc(c.version))+'</em>'+esc(c.note)+'</li>').join('')
    +(feeChg?'<li><em>수수료율</em>'+esc('동의 당시 '+a.feeRate+'% → 현재 '+fee+'%')+'</li>':'')
    +(verChg&&!(me.changes||[]).length?'<li><em>문안</em>'+esc('협약서 문안이 일부 수정되었습니다. 노란색으로 표시된 부분을 확인해 주세요.')+'</li>':'');
  const hl=re&&(me.changedLines||[]).length?new Set(me.changedLines):null;
  box.innerHTML='<div class="gi" role="dialog" aria-modal="true" aria-labelledby="agr-gate-t">'
    +'<div class="gh"><b id="agr-gate-t">'+(re?'협약서가 변경되었습니다':'업무제휴 협약서 동의')+'</b><span>'+esc(why)+'</span></div>'
    +(notes?'<div class="gn"><b>변경 안내</b><ul>'+notes+'</ul>'+(hl?'<p>아래 협약서에서 바뀐 부분은 <span class="agr-hl">노란색</span>으로 표시했습니다.</p>':'')+'</div>':'')
    +'<div class="agr-scroll">'+agrHtml(me.name,null,fee,hl)+'</div>'
    +'<label class="agr-ck"><input type="checkbox" id="gt-ck"><span>'+esc(AGR.check)+'<em>(필수)</em></span></label>'
    +'<label class="agr-ck" style="margin-top:8px"><input type="checkbox" id="gt-pv"><span>'+esc(AGR.check2)+'<em>(필수)</em></span></label>'
    +'<div class="ga"><button type="button" id="gt-later">나중에</button><button type="button" class="pri" id="gt-ok">동의하고 시작</button></div></div>';
  box.classList.add('on');document.body.style.overflow='hidden';
  if(hl){const sc=box.querySelector('.agr-scroll'),h1=sc&&sc.querySelector('.agr-hl');if(h1)sc.scrollTop=Math.max(0,h1.offsetTop-sc.offsetTop-40);}   /* 첫 변경 줄로 스크롤 */
  const close=()=>{box.classList.remove('on');box.innerHTML='';document.body.style.overflow='';};
  ['gt-ck','gt-pv'].forEach(id=>{$(id).onchange=()=>{const lb=$(id).closest('.agr-ck');if(lb)lb.classList.remove('need');};});
  $('gt-later').onclick=()=>{try{sessionStorage.setItem('icx_agr_later',AGR.v);}catch(_){}close();};
  $('gt-ok').onclick=async()=>{
    const c1=$('gt-ck'),c2=$('gt-pv');
    if(!c1.checked||!c2.checked){[c1,c2].forEach(c=>{if(!c.checked)c.closest('.agr-ck').classList.add('need');});
      return toast(c1.checked?'개인정보 수집·이용 및 제공에 동의해 주세요':'업무제휴 협약서에 동의해 주세요');}
    const b=$('gt-ok');b.disabled=true;b.textContent='저장 중';
    let x;try{x=await call('icAgreementSign',Object.assign({agreeVersion:AGR.v,agreeFee:fee,agreePrivacy:true},agrIdent()));}catch(e){x={success:false,error:'저장 중 오류가 발생했습니다'};}
    if(!x||!x.success){toast((x&&x.error)||'저장하지 못했습니다');b.disabled=false;b.textContent='동의하고 시작';return;}
    const ag=x.agreement;AGR_ME.agreement=ag;AGR_ME.valid=true;
    if(PE){PE.agreement=ag;const c=$('pf-agr');if(c){c.outerHTML=agrCard(PE);agrBind($('pf-agr'),PE.name,PE.agreement,PE.feeRate);}}   /* 프로필 화면이 열려 있으면 협약서 칸만 갱신 (입력 중 내용 보존) */
    if($('agr-in'))agrListInit();

      +'<div class="ga"><button type="button" id="gt-img">협약서 이미지로 저장</button><button type="button" class="pri" id="gt-close">시작하기</button></div>';

async function agrListInit(){

    +'<button type="button" class="agr-dl" data-agr-dl>협약서 이미지로 저장</button>'
    +(ok?'':'<button type="button" class="agr-go" id="agr-go">내 프로필에서 동의하기</button>');
  inn.querySelector('[data-agr-dl]').onclick=()=>agrImage(AGR_ME.name,AGR_ME.agreement,fee);
  const go=$('agr-go');
  if(go)go.onclick=async()=>{await loadProfile();setTimeout(()=>{const c=$('pf-agr');if(c)c.scrollIntoView({behavior:'smooth',block:'center'});},120);};
  if(!ok)$('agr-box').open=true;   /* 미동의면 펼쳐서 보여준다 */

/* 협약서 이미지 — A4 한 장(1654×2339) PNG */
async function agrImage(name,a,fee){
  const ok=agrDone(a,fee),nm=name||'(전문가성명)',FF='"Pretendard","Malgun Gothic","Apple SD Gothic Neo",sans-serif';
  try{await Promise.all([document.fonts.load('800 46px Pretendard'),document.fonts.load('700 27px Pretendard'),document.fonts.load('400 26px Pretendard')]);}catch(_){}
  /* ★ [2026-10-03] A4 한 장(200dpi · 1654×2339)에 맞춘다 — 넘치면 글자·간격을 함께 줄여 다시 배치 */
  const W=1654,H=2339,U=W/1240,M=Math.round(96*U),TW=W-M*2,cv=document.createElement('canvas'),g=cv.getContext('2d');
  const wrap=(t,font)=>{g.font=font;const out=[];let line='';
    for(const w of t.split(' ')){
      const tryL=line?line+' '+w:w;
      if(g.measureText(tryL).width<=TW){line=tryL;continue;}
      if(line)out.push(line);
      if(g.measureText(w).width<=TW){line=w;continue;}
      line='';for(const ch of w){if(g.measureText(line+ch).width>TW){out.push(line);line=ch;}else line+=ch;}
    }
    if(line)out.push(line);return out;};
  const sg=[(ok?'☑ ':'☐ ')+AGR.check,(ok?'☑ ':'☐ ')+AGR.check2,
    '계약일 : '+(ok?_ymdhm(a.agreedAt)+' (전자 동의)':'동의 전'),
    '갑 : (주)한국FP센터','을 : '+nm];
  const layout=k=>{   /* k = 글자·간격 배율 */
    const z=v=>Math.round(v*U*k);
    const L={BS:z(24),F_T:'800 '+z(44)+'px '+FF,F_H:'700 '+z(25)+'px '+FF,F_B:'400 '+z(24)+'px '+FF,F_F:'400 '+Math.max(z(18),Math.round(14*U))+'px '+FF,LH:z(40),ops:[]};
    const ops=L.ops,LH=L.LH;let y=Math.round(90*U)+z(56);
    ops.push(['t',AGR.title,y]);y+=z(84);
    wrap(AGR.intro(nm,fee),L.F_B).forEach(l=>{ops.push(['b',l,y]);y+=LH;});y+=z(12);
    AGR.arts(fee,nm).forEach(x=>{y+=z(10);ops.push(['h',x[0],y]);y+=LH;x[1].forEach(t=>{wrap(t,L.F_B).forEach(l=>{ops.push(['b',l,y]);y+=LH;});y+=z(4);});});
    y+=z(10);ops.push(['h',AGR.pvTitle,y]);y+=LH;
    AGR.pvRows(fee,nm).forEach(x=>{wrap('· '+x[0]+' : '+x[1],L.F_B).forEach(l=>{ops.push(['b',l,y]);y+=LH;});y+=z(4);});
    y+=z(18);ops.push(['line','',y]);y+=z(44);
    sg.forEach((t,n)=>{if(n===3&&ok)y+=Math.round(LH*0.55);wrap(t,L.F_B).forEach(l=>{ops.push(['s',l,y,n===3?'gap':'']);y+=LH;});});   /* n=3 「갑」 줄 — 도장 자리(위 줄과 겹치지 않게 간격) */
    y+=z(30);ops.push(['f','이너 Platform 전자 동의 기록'+(ok?' · 협약서 버전 '+a.version+' · 수수료 '+fee+'%':''),y]);
    L.end=y;return L;
  };
  const LIMIT=H-Math.round(90*U);   /* 아래 테두리 안쪽 */
  let L=null;
  for(let k=1;k>=0.5;k-=0.02){L=layout(k);if(L.end<=LIMIT)break;}
  const HH=Math.max(H,L.end+Math.round(90*U));   /* 0.5배로도 넘치면(문안이 크게 늘어난 경우) 세로만 늘린다 */
  cv.width=W;cv.height=HH;
  g.fillStyle='#fff';g.fillRect(0,0,W,HH);
  g.strokeStyle='#0E2438';g.lineWidth=Math.round(3*U);g.strokeRect(Math.round(46*U),Math.round(46*U),W-Math.round(92*U),HH-Math.round(92*U));
  g.textBaseline='alphabetic';
  /* ★ [2026-10-03] (주)한국FP센터 인감 — 동의 완료본에만, 「센터」의 '터'를 살짝 가리게 */
  const seal=ok?await new Promise(res=>{const im=new Image();im.onload=()=>res(im);im.onerror=()=>res(null);im.src=AGR_SEAL;}):null;
  L.ops.forEach(o=>{
    const [k,t,yy]=o;
    if(k==='t'){g.font=L.F_T;g.fillStyle='#0E2438';g.textAlign='center';g.fillText(t.split('').join(' '),W/2,yy);g.textAlign='left';return;}
    if(k==='h'){g.font=L.F_H;g.fillStyle='#141A24';g.fillText(t,M,yy);return;}
    if(k==='line'){g.strokeStyle='#C9D1DC';g.lineWidth=2;g.setLineDash([8,8]);g.beginPath();g.moveTo(M,yy);g.lineTo(W-M,yy);g.stroke();g.setLineDash([]);return;}
    if(k==='f'){g.font=L.F_F;g.fillStyle='#8A93A3';g.textAlign='center';g.fillText(t,W/2,yy);g.textAlign='left';return;}
    g.font=L.F_B;g.fillStyle=k==='s'?'#141A24':'#3A4353';g.fillText(t,M,yy);
    if(o[3]==='gap'&&seal){
      const tw=g.measureText(t).width,cw=g.measureText('터').width,D=Math.round(L.LH*2.05);
      const x=M+tw-cw*0.4,y0=Math.round(yy-L.BS*0.36-D/2);
      g.save();g.globalCompositeOperation='multiply';g.globalAlpha=0.92;g.drawImage(seal,x,y0,D,D);g.restore();
    }
  });
  /* ★ data URL — 카카오톡 인앱 등에서 blob: 주소는 다운로드·길게 눌러 저장이 막히는 경우가 있다 */
  let u='';try{u=cv.toDataURL('image/png');}catch(_){}
  {
    if(!u||u.length<100){toast('이미지를 만들지 못했습니다');return;}
    const pv=$('agr-pv');
    $('agr-pv-img').src=u;const d=$('agr-pv-dl');d.href=u;d.download='업무제휴협약서_'+nm.replace(/[\\/:*?"<>|\s]/g,'')+'.png';
    pv.classList.add('on');document.body.style.overflow='hidden';
    $('agr-pv-x').onclick=()=>{pv.classList.remove('on');document.body.style.overflow='';$('agr-pv-img').removeAttribute('src');};
  }
}
/* ★ [2026-09-30] 내 의뢰 현황 — 유료 컨설팅 합계(기간별) · 목록 칸 */
let STL_PERIOD='all';
function stlCell(c){
  const t=c.settle||{confirmed:[],mine:0,pending:0};
  if(t.mine)return '<button class="stl-cb al" data-sk="'+esc(c.k)+'" data-mode="focus">확인 필요</button>';
  const sum=(t.confirmed||[]).reduce((a,x)=>a+(x.amount||0),0);
  if(sum)return '<span style="font-weight:600">'+_won(sum)+'원</span>';
  if(t.pending)return '<span class="st st-rn">진행 중</span>';
  if(c.status!=='closed')return '<button class="stl-cb" data-sk="'+esc(c.k)+'" data-mode="form">＋ 입력</button>';
  return '<span class="mu">-</span>';
}
function stlInPeriod(ms){
  if(STL_PERIOD==='all')return true;
  if(!ms)return false;
  const d=new Date(ms),n=new Date();
  if(STL_PERIOD==='year')return d.getFullYear()===n.getFullYear();
  if(STL_PERIOD==='month')return d.getFullYear()===n.getFullYear()&&d.getMonth()===n.getMonth();
  const p=new Date(n.getFullYear(),n.getMonth()-1,1);   /* prev */
  return d.getFullYear()===p.getFullYear()&&d.getMonth()===p.getMonth();
}
function stlListSummary(rows){
  const all=[];rows.forEach(c=>((c.settle&&c.settle.confirmed)||[]).forEach(x=>all.push(x)));
  const mine=rows.reduce((a,c)=>a+((c.settle&&c.settle.mine)||0),0);
  const sel=all.filter(x=>stlInPeriod(x.at));
  const amt=sel.reduce((a,x)=>a+(x.amount||0),0);
  const P=[['all','전체'],['year','올해'],['month','이번 달'],['prev','지난달']];
  return '<div class="sgd" style="margin-bottom:14px"><h4>유료 컨설팅 계약 후 반드시 내역을 입력해 주세요</h4>'
    +'<p>상담 화면에서 계약금액을 입력하면 <b>분야별 유료컨설팅 현황 통계자료</b>에 자동으로 반영됩니다. 컨설턴트가 먼저 입력한 내역은 「내용 확인」만 누르시면 됩니다.</p></div>'
    +'<div class="tps" id="stl-per" style="margin-bottom:10px">'+P.map(p=>'<span data-p="'+p[0]+'"'+(STL_PERIOD===p[0]?' class="on"':'')+'>'+p[1]+'</span>').join('')+'</div>'
    +'<div class="stl-sum"><div><b>확정 계약금액</b><span>'+_won(amt)+'원</span></div>'
    +'<div'+(mine?' class="al"':'')+'><b>내 확인 필요</b><span>'+mine+'건</span></div></div>';
}
document.addEventListener('click',e=>{const t=e.target.closest&&e.target.closest('#stl-per span');if(!t)return;STL_PERIOD=t.dataset.p;loadList();});

/* ═══ 내 의뢰 현황 ═══ */
async function loadList(){
  const w=$('list-body');
  w.innerHTML='<div class="load">불러오는 중</div>';
  let r;
  try{r=await call('icExpertCases',K?{k:K}:{s:SS.s});}catch(e){w.innerHTML='<div class="empty"><b>불러오지 못했습니다</b></div>';return;}
  if(!r.success){
    if(!K){clearSess();location.replace('./expert.html');return;}   /* ★ [2026-09-30] 세션 만료 → 다시 로그인 */
    w.innerHTML='<div class="empty"><b>'+esc(r.error||'불러오지 못했습니다')+'</b></div>';return;
  }
  if(!K&&r.profileKey&&!PK){PK=r.profileKey;show('list');}
  const rows=r.cases||[];
  const isRun=c=>['received','ongoing'].includes(c.status);
  const fresh=rows.filter(c=>c.status==='received'&&!c.contacted);
  const n=(k)=>rows.filter(c=>k==='all'?true:k==='new'?c.status==='received':k==='run'?c.status==='ongoing':!isRun(c)).length;

  w.innerHTML='<div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:16px;gap:12px">'
    +'<div style="font-size:19px;font-weight:700;letter-spacing:-.03em">내 의뢰 현황</div>'
    +'<div style="font-size:12px;color:var(--gray-l)">전체 '+n('all')+' · 신규 '+n('new')+' · 진행 '+n('run')+' · 완료 '+n('end')+'</div></div>'
    +(fresh.length?'<div class="bnr"><span>•</span><span><b>'+fresh.length+'건</b>이 아직 연락 전입니다. 컨설턴트가 기다리고 있습니다.</span></div>':'')
    +stlListSummary(rows)
    +agrListBox()   /* ★ [2026-10-03] 업무제휴 협약서 보기 */
    +(rows.length
      ?'<div class="dcard" style="padding:20px 10px"><div class="tblw"><table class="tbl"><thead><tr>'
       +'<th style="width:40px">No</th><th style="width:140px">주제</th><th style="width:110px">고객</th>'
       +'<th style="width:80px">컨설턴트</th><th style="width:124px">연락처</th><th style="width:70px">상태</th>'
       +'<th style="width:110px">유료 컨설팅</th><th style="width:70px">접수</th><th>최근 진행</th></tr></thead><tbody>'
       +rows.map((c,i)=>{
          const st=CST[c.status]||CST.received;
          const nc=c.status==='received'&&!c.contacted;
          return '<tr'+(nc?' class="alert"':'')+' data-k="'+esc(c.k)+'"><td class="no">'+(rows.length-i)+'</td>'
            +'<td class="sb">'+esc(c.topic||'-')+'</td><td class="mu">'+esc(c.company||'-')+'</td>'
            +'<td class="mu">'+esc(c.fcName||'-')+'</td><td class="mu">'+esc(c.fcPhone||'-')+'</td>'
            +'<td><span class="st '+st[1]+'">'+st[0]+'</span></td><td>'+stlCell(c)+'</td><td class="mu">'+_md(c.createdAt)+'</td>'
            +'<td'+(nc?' style="color:var(--danger);font-weight:600"':' class="mu"')+'>'
            +(nc?'미연락 '+_days(c.createdAt)+'일':esc(c.lastNote||'-'))+'</td></tr>';
        }).join('')+'</tbody></table></div></div>'
       +'<p style="font-size:11px;color:var(--gray-l);margin-top:8px">행을 누르면 해당 상담으로 이동합니다</p>'
      :'<div class="empty"><b>아직 접수된 상담이 없습니다</b></div>');
  w.querySelectorAll('[data-k]').forEach(el=>el.onclick=()=>{location.href='./ic-case.html?k='+encodeURIComponent(el.dataset.k);});
  /* ★ [2026-09-30] 「＋ 입력」「확인 필요」 — 상담을 열면서 유료 컨설팅 입력 폼·확인할 내역으로 바로 이동 */
  w.querySelectorAll('[data-sk]').forEach(el=>el.onclick=e=>{e.stopPropagation();location.href='./ic-case.html?k='+encodeURIComponent(el.dataset.sk)+'&stl='+el.dataset.mode;});
  agrListInit();   /* ★ [2026-10-03] 업무제휴 협약서 — 동의 상태 표시 */
}
</script>
