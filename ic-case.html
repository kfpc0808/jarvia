<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>이너서클 상담</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --navy:#0E2438;--navy-2:#16324D;--ink:#141A24;--gray:#5B6577;--gray-l:#98A1B0;
  --line:#E4E8EE;--line-2:#EEF1F5;--paper:#F7F8FA;--gold:#A8862F;--gold-bg:#FCFBF7;--gold-line:#EDE6D5;
  --ok:#1B7A5A;--ok-bg:#EAF5F0;--warn:#96701C;--warn-bg:#FBF2E4;--danger:#A93B33;--danger-bg:#F9EDEB;
  --f:'Pretendard',-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--f);background:var(--paper);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased;font-feature-settings:'tnum'}
button,input,textarea{font-family:inherit;color:inherit}
a{color:inherit;text-decoration:none}

.hdwrap{position:sticky;top:0;z-index:60;background:var(--navy);padding-top:var(--safe-t)}
.tb{display:flex;align-items:center;height:54px;padding:0 16px;gap:12px;max-width:1180px;margin:0 auto}
.tb .bk{display:none;color:#fff;opacity:.7;font-size:20px;line-height:1;padding:4px;cursor:pointer}
.tb .lg{font-size:15px;font-weight:700;color:#fff;letter-spacing:-.02em;display:flex;align-items:center;gap:9px;flex:1;min-width:0}
.tb .lg .dot{width:5px;height:5px;border-radius:50%;background:var(--gold);flex-shrink:0}
.tb .lg .sub{font-size:10.5px;font-weight:400;color:#7E93AC;letter-spacing:.05em;padding-left:9px;border-left:1px solid rgba(255,255,255,.15)}
.tb .who{font-size:12.5px;color:#B9C7D6;white-space:nowrap}
.tb .nav{background:none;border:1px solid rgba(255,255,255,.16);color:#B9C7D6;font-size:12px;padding:5px 11px;border-radius:6px;cursor:pointer;white-space:nowrap}
.tb .nav:hover{color:#fff}

.pg{max-width:1180px;margin:0 auto;padding:22px 22px 90px}
.view{display:none}.view.on{display:block}
.two{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:22px;align-items:start}

.dcard{background:#fff;border:1px solid var(--line);border-radius:10px;padding:24px}
.dcard+.dcard{margin-top:14px}
.lbl{font-size:10.5px;font-weight:700;color:var(--gray-l);letter-spacing:.08em;margin-bottom:12px}
.kv{font-size:13.5px}
.kv .r{display:flex;gap:16px;padding:8px 0;border-bottom:1px solid var(--line-2);line-height:1.8}
.kv .r:last-child{border-bottom:none}
.kv .r b{width:84px;flex-shrink:0;color:var(--gray-l);font-weight:500;font-size:12.5px}
.kv .r span{flex:1;min-width:0}

.st{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:3px;letter-spacing:.02em;white-space:nowrap}
.st-ok{background:var(--ok-bg);color:var(--ok)}.st-bs{background:var(--warn-bg);color:var(--warn)}
.st-of{background:#F0F2F5;color:var(--gray)}.st-rn{background:#EAF0F7;color:var(--navy-2)}
.st-wt{background:var(--danger-bg);color:var(--danger)}

.side{position:sticky;top:76px}
.contact{background:var(--gold-bg);border:1px solid var(--gold-line);border-radius:10px;padding:20px;text-align:center}
.contact .lb{font-size:10.5px;font-weight:700;color:var(--gold);letter-spacing:.08em;margin-bottom:8px}
.contact .nm{font-size:19px;font-weight:700;letter-spacing:-.03em}
.contact .ph{font-size:22px;font-weight:700;color:var(--navy);letter-spacing:-.02em;margin-top:4px;font-variant-numeric:tabular-nums}
.contact .call{display:block;background:var(--navy);color:#fff;border-radius:8px;padding:14px;font-size:15px;font-weight:700;margin-top:16px;cursor:pointer;border:none;width:100%}
.contact .call:hover{background:var(--navy-2)}
.contact .fine{font-size:11px;color:var(--gray-l);margin-top:10px;line-height:1.65}

.tps{display:flex;flex-wrap:wrap;gap:6px}
.tps span{font-size:12.5px;padding:7px 13px;border-radius:15px;border:1px solid var(--line);background:#fff;color:var(--gray);cursor:pointer}
.tps span:hover{border-color:var(--gray-l);color:var(--ink)}
.tps span.on{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:600}
.fld{margin:14px 0}
.fld textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-size:16px;min-height:88px;resize:vertical;line-height:1.75;background:#fff;outline:none}
.fld textarea:focus{border-color:var(--gold)}
.btn{display:block;width:100%;text-align:center;background:var(--navy);color:#fff;border:none;border-radius:8px;padding:14px;font-size:15px;font-weight:700;cursor:pointer}
.btn:hover{background:var(--navy-2)}
.btn.sec{background:#fff;color:var(--navy);border:1px solid var(--line);font-weight:600;font-size:13.5px;padding:12px}
.btn:disabled{background:#C9CFD8;cursor:default}
.btn+.btn{margin-top:8px}

.tl{position:relative;padding-left:20px}
.tl::before{content:'';position:absolute;left:5px;top:7px;bottom:7px;width:1px;background:var(--line)}
.tl .ev{position:relative;padding-bottom:18px}
.tl .ev:last-child{padding-bottom:0}
.tl .ev::before{content:'';position:absolute;left:-19px;top:6px;width:9px;height:9px;border-radius:50%;background:#fff;border:2px solid var(--gold)}
.tl .ev.sys::before{border-color:#C9D0DA}
.tl .dt{font-size:11px;color:var(--gray-l)}
.tl .who{font-size:12px;color:var(--navy);font-weight:700;margin-top:2px}
.tl .tx{font-size:13.5px;margin-top:3px;line-height:1.8;white-space:pre-line}

.tog{display:flex;align-items:center;gap:12px;background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:13px 15px;margin-top:14px}
.tog .t1{font-size:13px;font-weight:700}
.tog .t2{font-size:11.5px;color:var(--gray-l);margin-top:2px}
.sw{width:42px;height:24px;border-radius:12px;background:#C9CFD8;position:relative;flex-shrink:0;cursor:pointer;transition:background .15s}
.sw.on{background:var(--ok)}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}
.sw.on::after{left:21px}

.fileb{display:flex;align-items:center;gap:10px;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:11px 14px;font-size:13px;margin-top:8px;cursor:pointer}
.fileb:hover{border-color:var(--gray-l)}
.fileb .exp{font-size:11px;color:var(--warn);font-weight:700;white-space:nowrap}
.tblw{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:600px}
.tbl th{text-align:left;font-size:11px;font-weight:600;color:var(--gray-l);letter-spacing:.04em;padding:0 12px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:14px 12px;border-bottom:1px solid var(--line-2);white-space:nowrap}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover td{background:#FBFCFD}
.tbl tr.alert td{background:#FDF6F5}
.tbl .no{color:var(--gray-l);font-size:11.5px}.tbl .sb{font-weight:600}.tbl .mu{color:var(--gray)}
.bnr{display:flex;gap:11px;background:var(--danger-bg);border:1px solid #F0D4D0;border-radius:8px;padding:13px 16px;font-size:13px;color:#7A2F29;margin-bottom:14px;line-height:1.7}
.bnr b{color:#5E241F}

.empty{text-align:center;padding:56px 20px;color:var(--gray-l);font-size:13.5px;line-height:1.85}
.empty b{display:block;font-size:16px;color:var(--gray);margin-bottom:8px;font-weight:700}
.load{text-align:center;padding:60px;color:var(--gray-l);font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(30px + var(--safe-b));transform:translateX(-50%);background:var(--ink);color:#fff;font-size:13.5px;padding:12px 20px;border-radius:8px;z-index:300;max-width:88%;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.fixcta{display:none;position:fixed;left:0;right:0;bottom:0;z-index:70;background:#fff;border-top:1px solid var(--line);padding:12px 16px calc(12px + var(--safe-b))}

@media(max-width:1023px){
  .tb{height:50px;padding:0 14px}
  .tb .who{display:none}
  .pg{padding:14px 14px 100px}
  .two{grid-template-columns:minmax(0,1fr);gap:12px}
  .side{position:static;order:-1}
  .dcard{padding:18px}
  .contact .call{display:none}
  .fixcta.on{display:block}
}
</style>
</head>
<body>

<div class="hdwrap"><div class="tb">
  <span class="bk" id="hd-bk">‹</span>
  <div class="lg"><span class="dot"></span><span id="hd-ti">이너서클 상담</span><span class="sub">INNER CIRCLE</span></div>
  <span class="who" id="hd-me"></span>
  <button class="nav" id="hd-nav">내 의뢰 현황</button>
</div></div>

<div class="pg">
  <div id="v-case" class="view on"><div id="case-body"><div class="load">확인 중</div></div></div>
  <div id="v-list" class="view"><div id="list-body"><div class="load">불러오는 중</div></div></div>
</div>

<div class="fixcta" id="fixcta"></div>
<div class="toast" id="toast"></div>

<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import{getFunctions,httpsCallable}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-functions.js';

const FC={apiKey:"AIzaSyBD9p-bf162RiiD1Y3BsY-NvbYjpOSrzmg",authDomain:"jarvia-platform.firebaseapp.com",projectId:"jarvia-platform",storageBucket:"jarvia-platform.firebasestorage.app",messagingSenderId:"388025068900",appId:"1:388025068900:web:09ba8e12e9e9e2ec49de71"};
const app=initializeApp(FC);
const functions=getFunctions(app,'asia-northeast3');
const call=(name,data)=>httpsCallable(functions,name)(data||{}).then(r=>r.data||{});
const VERIFY_URL='https://asia-northeast3-jarvia-platform.cloudfunctions.net/icVerifyExpertToken';

const $=id=>document.getElementById(id);
const esc=s=>{if(s===0)return'0';if(!s)return'';const d=document.createElement('div');d.textContent=s;return d.innerHTML;};
let _tt;const toast=m=>{const e=$('toast');e.textContent=m;e.classList.add('on');clearTimeout(_tt);_tt=setTimeout(()=>e.classList.remove('on'),2600);};
const _md=ms=>{if(!ms)return'-';const d=new Date(ms);return(d.getMonth()+1)+'월 '+d.getDate()+'일';};
const _dt=ms=>{if(!ms)return'';const d=new Date(ms);return _md(ms)+'  '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');};
const _days=ms=>ms?Math.floor((Date.now()-ms)/86400000):0;

const CST={received:['신규','st-wt'],ongoing:['진행중','st-rn'],done_pending:['완료','st-of'],done_confirmed:['완료','st-of'],closed:['종료','st-of']};
const STEPS=['자료 검토 중','추가자료 요청','고객 미팅 예정','검토 완료','제안서 작성','계약 협의'];
const ROLE={fc:'컨설턴트',expert:'나',admin:'본사'};

let K='',CASE=null,TL=[],FILES=[],EXPERT=null;
const FILE_ACCEPT='.pdf,.jpg,.jpeg,.png,.gif,.webp,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.hwp,.zip';
const FILE_MAX=20*1024*1024;
const fmtSize=b=>b>1048576?(b/1048576).toFixed(1)+'MB':Math.ceil(b/1024)+'KB';
const fileLeft=ms=>ms?Math.max(0,Math.ceil((ms-Date.now())/86400000)):null;

/* ═══ 진입 ═══ */
(async function boot(){
  const p=new URLSearchParams(location.search);
  K=p.get('k')||'';
  /* 구형 링크(?c=&t=) 하위호환 */
  if(!K&&p.get('c')&&p.get('t'))K=p.get('c')+'.'+p.get('t');
  if(!K){fail('잘못된 링크입니다.','알림톡으로 받으신 링크를 다시 눌러 주세요.');return;}

  try{
    const r=await fetch(VERIFY_URL+'?k='+encodeURIComponent(K)).then(x=>x.json());
    if(!r.success){fail(r.error||'확인에 실패했습니다.','본사에 문의해 주세요.\n박신제 본부장 010-5244-1467');return;}
    CASE=r.case;TL=r.timeline||[];FILES=r.files||[];EXPERT={id:r.expertId,name:r.expertName};
    $('hd-me').textContent=(r.expertName||'')+' 님';
    renderCase();
  }catch(e){
    fail('연결에 실패했습니다.','잠시 후 다시 시도해 주세요.');
  }
})();

function fail(t,s){
  $('case-body').innerHTML='<div class="empty"><b>'+esc(t)+'</b>'+esc(s).replace(/\n/g,'<br>')+'</div>';
  $('hd-nav').style.display='none';
}

/* ═══ 화면 전환 ═══ */
function show(v){
  $('v-case').classList.toggle('on',v==='case');
  $('v-list').classList.toggle('on',v==='list');
  $('hd-bk').style.display=v==='list'?'inline-block':'none';
  $('hd-ti').textContent=v==='list'?'내 의뢰 현황':'이너서클 상담';
  $('hd-nav').style.display=v==='list'?'none':'';
  setCta(v==='case'&&CASE&&CASE.fcPhone
    ?'<a class="btn" href="tel:'+esc(CASE.fcPhone)+'">'+esc(CASE.fcName||'컨설턴트')+'에게 전화</a>':null);
  window.scrollTo(0,0);
}
function setCta(html){const w=$('fixcta');if(!html){w.innerHTML='';w.classList.remove('on');return;}w.innerHTML=html;w.classList.add('on');}

$('hd-nav').onclick=()=>{show('list');loadList();};
$('hd-bk').onclick=()=>show('case');

/* ═══ 케이스 화면 ═══ */
function renderCase(){
  const c=CASE, st=CST[c.status]||CST.received;
  const corp=(c.clientType||'corp')==='corp';
  const closed=['done_confirmed','closed'].includes(c.status);
  const R=(k,v)=>v?'<div class="r"><b>'+k+'</b><span>'+esc(v)+'</span></div>':'';

  $('case-body').innerHTML='<div class="two">'
    +'<div>'
    +'<div class="dcard">'
      +'<div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:18px">'
      +'<div><div style="font-size:19px;font-weight:700;letter-spacing:-.03em">'+esc(c.field)+' · '+esc(c.topic)+'</div>'
      +(c.no?'<div style="font-size:11px;color:var(--gray-l);margin-top:5px">'+esc(c.no)+' · '+_md(c.createdAt)+' 접수</div>':'')
      +'</div><span class="st '+st[1]+'">'+st[0]+'</span></div>'
      +'<div class="lbl">고객 정보</div><div class="kv">'
      +(corp
        ?R('기업',c.company)+R('업종',c.industry)+R('설립',c.foundedYear)
         +R('연매출',c.revenue)+R('임직원',c.employees)
         +R('대표자',[c.ceo,c.ceoAge&&(c.ceoAge+'세')].filter(Boolean).join(' · '))
         +R('소재지',c.region)+R('지분 구조',c.shareStructure)
        :R('고객',[c.clientName,c.clientAge&&(c.clientAge+'세')].filter(Boolean).join(' · '))
         +R('직업',c.job)+R('거주지',c.residence)+R('가족',c.family)+R('주요 자산',c.assets))
      +R('긴급도',c.urgency)
      +'</div>'
      +'<p style="font-size:11.5px;color:var(--gray-l);margin-top:12px">회원이 신청 시 남긴 내용이 그대로 전달됩니다. 부족한 부분은 통화로 확인해 주세요.</p>'
    +'</div>'

    +(c.problem?'<div class="dcard"><div class="lbl">상담 내용</div>'
      +'<div style="font-size:14px;line-height:1.95;white-space:pre-line;color:#2E3644">'+esc(c.problem)+'</div></div>':'')

    +'<div class="dcard"><div class="lbl">첨부 자료</div>'
    +(FILES.length
      ?FILES.map(f=>'<div class="fileb" data-fid="'+esc(f.id)+'">'
        +'<span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis">'+esc(f.name)+'</span>'
        +'<span style="font-size:11px;color:var(--gray-l)">'+esc(f.uploadedBy==='expert'?'내가 올림':'컨설턴트')+' · '+fmtSize(f.size)+'</span>'
        +(fileLeft(f.deleteAt)!==null?'<span class="exp">D-'+fileLeft(f.deleteAt)+'</span>':'')+'</div>').join('')
      :'<div style="font-size:12.5px;color:var(--gray-l);padding:6px 0">첨부된 자료가 없습니다</div>')
    +(closed?''
      :'<div style="margin-top:10px"><input type="file" id="ex-file" accept="'+FILE_ACCEPT+'" style="display:none">'
       +'<button class="btn sec" id="ex-up" style="width:auto;display:inline-block;padding:10px 18px">자료 올리기</button>'
       +'<span id="ex-up-msg" style="font-size:12px;color:var(--gray-l);margin-left:10px"></span></div>')
    +'<p style="font-size:11.5px;color:var(--gray-l);margin-top:10px;line-height:1.7">파일을 누르면 내려받습니다. 업로드 30일, 내려받은 뒤 7일이 지나면 자동 삭제됩니다. 내려받은 파일은 보관에 유의해 주세요.</p></div>'

    +'<div class="dcard"><div class="lbl">진행 기록</div>'
    +(TL.length?'<div class="tl">'+TL.map(ev=>
        '<div class="ev'+(ev.actorRole==='system'?' sys':'')+'">'
        +'<div class="dt">'+_dt(ev.createdAt)+'</div>'
        +(ev.actorRole==='system'?'':'<div class="who">'+esc(ev.actorRole==='expert'?'나':(ev.actorName||ROLE[ev.actorRole]||''))+'</div>')
        +'<div class="tx"'+(ev.actorRole==='system'?' style="color:var(--gray)"':'')+'>'+esc(ev.text||'')+'</div></div>').join('')+'</div>'
      :'<div class="empty" style="padding:30px">아직 기록이 없습니다.</div>')

    +(closed
      ?'<div style="margin-top:20px;padding-top:20px;border-top:1px solid var(--line-2);font-size:12.5px;color:var(--gray-l);text-align:center">종료된 상담입니다</div>'
      :'<div style="margin-top:20px;padding-top:20px;border-top:1px solid var(--line-2)">'
       +'<div class="lbl">진행 상황 남기기</div>'
       +'<div class="tps" id="ex-step">'+STEPS.map(s=>'<span data-v="'+s+'">'+s+'</span>').join('')+'</div>'
       +'<div class="fld"><textarea id="ex-memo" placeholder="컨설턴트에게 전할 내용 (선택)"></textarea></div>'
       +'<button class="btn" id="ex-save">기록 남기기</button>'
       +'<p style="font-size:11.5px;color:var(--gray-l);margin-top:9px;line-height:1.7">남기신 기록은 컨설턴트와 본사가 함께 봅니다.</p></div>')
    +'</div></div>'

    +'<aside class="side">'
    +'<div class="contact"><div class="lb">신청 컨설턴트</div>'
      +'<div class="nm">'+esc(c.fcName||'-')+'</div>'
      +'<div class="ph">'+esc(c.fcPhone||'-')+'</div>'
      +(c.fcPhone?'<a class="call" href="tel:'+esc(c.fcPhone)+'">전화 걸기</a>':'')
      +'<div class="fine">컨설턴트가 연락을 기다리고 있습니다.<br>가능하시면 오늘 중 연락 부탁드립니다.</div></div>'
    +'<div class="tog" id="ex-tog"><div style="flex:1"><div class="t1">신규 상담 받기</div>'
      +'<div class="t2" id="ex-tog-t">당분간 새 상담을 받지 않으려면 끄세요</div></div>'
      +'<div class="sw" id="ex-sw"></div></div>'
    +'</aside></div>';

  /* 첨부 — 다운로드·업로드 */
  document.querySelectorAll('[data-fid]').forEach(el=>el.onclick=()=>downloadFile(el.dataset.fid));
  const up=$('ex-up'),fi=$('ex-file');
  if(up&&fi){
    up.onclick=()=>fi.click();
    fi.onchange=async()=>{
      const f=fi.files&&fi.files[0];if(!f)return;
      up.disabled=true;
      const ok=await uploadFile(f,m=>{$('ex-up-msg').textContent=m;});
      up.disabled=false;fi.value='';
      if(ok){toast('자료를 올렸습니다');
        const v=await fetch(VERIFY_URL+'?k='+encodeURIComponent(K)).then(x=>x.json());
        if(v.success){CASE=v.case;TL=v.timeline||[];FILES=v.files||[];renderCase();}
      }else $('ex-up-msg').textContent='';
    };
  }

  const g=$('ex-step');
  if(g)g.querySelectorAll('span').forEach(el=>el.onclick=()=>{
    const was=el.classList.contains('on');g.querySelectorAll('span').forEach(x=>x.classList.remove('on'));if(!was)el.classList.add('on');
  });
  const sv=$('ex-save');if(sv)sv.onclick=saveNote;
  initToggle();
  show('case');
}

async function uploadFile(file,onMsg){
  if(file.size>FILE_MAX){toast('20MB 이하 파일만 올릴 수 있습니다');return false;}
  onMsg&&onMsg('준비 중');
  const r=await call('icUploadFile',{k:K,name:file.name,size:file.size,mime:file.type||'application/octet-stream'});
  if(!r.success){toast(r.error||'업로드 준비 실패');return false;}
  onMsg&&onMsg('업로드 중');
  /* 서버가 서명에 쓴 contentType 을 그대로 보낸다 — 다르면 Storage 가 403 */
  const put=await fetch(r.uploadUrl,{method:'PUT',headers:{'Content-Type':r.contentType||file.type||'application/octet-stream'},body:file});
  if(!put.ok){toast('업로드에 실패했습니다');return false;}
  onMsg&&onMsg('확인 중');
  const c=await call('icConfirmFile',{k:K,fileId:r.fileId});
  if(!c.success){toast(c.error||'업로드 확인 실패');return false;}
  return true;
}
async function downloadFile(fileId){
  const r=await call('icDownloadFile',{k:K,fileId});
  if(!r.success){toast(r.error||'다운로드 준비 실패');return;}
  window.location.href=r.url;
}

async function saveNote(){
  const el=document.querySelector('#ex-step span.on');
  const step=el?el.dataset.v:'';
  const memo=($('ex-memo').value||'').trim();
  if(!step&&!memo)return toast('남길 내용을 선택해 주세요');
  const b=$('ex-save');b.disabled=true;b.textContent='저장 중';
  try{
    const r=await call('icExpertNote',{k:K,step,memo});
    if(!r.success){toast(r.error||'저장에 실패했습니다');return;}
    toast('기록을 남겼습니다');
    /* 재조회 — 타임라인·상태 갱신 */
    const v=await fetch(VERIFY_URL+'?k='+encodeURIComponent(K)).then(x=>x.json());
    if(v.success){CASE=v.case;TL=v.timeline||[];FILES=v.files||[];renderCase();}
  }catch(e){toast('저장 중 오류가 발생했습니다');}
  finally{if($('ex-save')){b.disabled=false;b.textContent='기록 남기기';}}
}

/* ═══ 상담 받기 토글 ═══ */
async function initToggle(){
  const sw=$('ex-sw');if(!sw)return;
  /* 현재 상태는 목록 API 에서 함께 온다 — 초기 렌더 시 1회 조회 */
  try{
    const r=await call('icExpertCases',{k:K});
    if(r.success&&r.expert){EXPERT={...EXPERT,status:r.expert.status};applyToggle(r.expert.status);}
  }catch(_){}
  sw.onclick=async()=>{
    const accept=!sw.classList.contains('on');
    if(!accept&&!confirm('신규 상담을 받지 않도록 설정합니다.\n전문가 목록에 「상담 중지」로 표시됩니다.\n\n계속하시겠습니까?'))return;
    try{
      const r=await call('icExpertStatus',{k:K,accept});
      if(!r.success){toast(r.error||'변경에 실패했습니다');return;}
      applyToggle(r.status);
      toast(accept?'신규 상담을 받습니다':'신규 상담을 받지 않습니다');
    }catch(e){toast('변경 중 오류가 발생했습니다');}
  };
}
function applyToggle(status){
  const sw=$('ex-sw'),t=$('ex-tog-t');if(!sw)return;
  const on=status!=='off';
  sw.classList.toggle('on',on);
  if(t)t.textContent=status==='busy'?'본사가 「상담 지연」으로 표시 중입니다':(on?'당분간 새 상담을 받지 않으려면 끄세요':'현재 새 상담을 받지 않습니다');
}

/* ═══ 내 의뢰 현황 ═══ */
async function loadList(){
  const w=$('list-body');
  w.innerHTML='<div class="load">불러오는 중</div>';
  let r;
  try{r=await call('icExpertCases',{k:K});}catch(e){w.innerHTML='<div class="empty"><b>불러오지 못했습니다</b></div>';return;}
  if(!r.success){w.innerHTML='<div class="empty"><b>'+esc(r.error||'불러오지 못했습니다')+'</b></div>';return;}
  const rows=r.cases||[];
  const isRun=c=>['received','ongoing'].includes(c.status);
  const fresh=rows.filter(c=>c.status==='received'&&!c.contacted);
  const n=(k)=>rows.filter(c=>k==='all'?true:k==='new'?c.status==='received':k==='run'?c.status==='ongoing':!isRun(c)).length;

  w.innerHTML='<div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:16px;gap:12px">'
    +'<div style="font-size:19px;font-weight:700;letter-spacing:-.03em">내 의뢰 현황</div>'
    +'<div style="font-size:12px;color:var(--gray-l)">전체 '+n('all')+' · 신규 '+n('new')+' · 진행 '+n('run')+' · 완료 '+n('end')+'</div></div>'
    +(fresh.length?'<div class="bnr"><span>•</span><span><b>'+fresh.length+'건</b>이 아직 연락 전입니다. 컨설턴트가 기다리고 있습니다.</span></div>':'')
    +(rows.length
      ?'<div class="dcard" style="padding:20px 10px"><div class="tblw"><table class="tbl"><thead><tr>'
       +'<th style="width:40px">No</th><th style="width:140px">주제</th><th style="width:110px">고객</th>'
       +'<th style="width:80px">컨설턴트</th><th style="width:124px">연락처</th><th style="width:70px">상태</th>'
       +'<th style="width:70px">접수</th><th>최근 진행</th></tr></thead><tbody>'
       +rows.map((c,i)=>{
          const st=CST[c.status]||CST.received;
          const nc=c.status==='received'&&!c.contacted;
          return '<tr'+(nc?' class="alert"':'')+' data-k="'+esc(c.k)+'"><td class="no">'+(rows.length-i)+'</td>'
            +'<td class="sb">'+esc(c.topic||'-')+'</td><td class="mu">'+esc(c.company||'-')+'</td>'
            +'<td class="mu">'+esc(c.fcName||'-')+'</td><td class="mu">'+esc(c.fcPhone||'-')+'</td>'
            +'<td><span class="st '+st[1]+'">'+st[0]+'</span></td><td class="mu">'+_md(c.createdAt)+'</td>'
            +'<td'+(nc?' style="color:var(--danger);font-weight:600"':' class="mu"')+'>'
            +(nc?'미연락 '+_days(c.createdAt)+'일':esc(c.lastNote||'-'))+'</td></tr>';
        }).join('')+'</tbody></table></div></div>'
       +'<p style="font-size:11px;color:var(--gray-l);margin-top:8px">행을 누르면 해당 상담으로 이동합니다</p>'
      :'<div class="empty"><b>아직 접수된 상담이 없습니다</b></div>');
  w.querySelectorAll('[data-k]').forEach(el=>el.onclick=()=>{location.href='./ic-case.html?k='+encodeURIComponent(el.dataset.k);});
}
</script>
