<script>
(function(){try{
  if(window.__jvErr)return; window.__jvErr={buf:[],track:{}}; window.__jvPage='daily-report';
  var push=function(o){try{if(window.__jvErr.buf.length<50)window.__jvErr.buf.push(o);}catch(e){}};
  window.addEventListener('error',function(e){push({t:'js_error',message:(e&&e.message)||'error',source:(e&&e.filename)||'',lineno:(e&&e.lineno)||0,colno:(e&&e.colno)||0,stack:(e&&e.error&&e.error.stack)||'',at:Date.now()});},true);
  window.addEventListener('unhandledrejection',function(e){var r=e&&e.reason;push({t:'promise_rejection',message:(r&&(r.message||String(r)))||'unhandledrejection',stack:(r&&r.stack)||'',source:'',lineno:0,colno:0,at:Date.now()});});
}catch(_e){}})();

<title>JARVIA Daily Report Archive</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800&family=Sora:wght@600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1E2226;--navy-lt:#3A4148;--navy-dk:#141719;
  --accent:#96701F;--accent-lt:#C9A05C;--accent-glow:rgba(201,160,92,.12);
  --gold:#C9A05C;--gold-lt:#E3C893;--gold-bg:rgba(201,160,92,.07);
  --success:#27AE60;--danger:#E74C3C;--warning:#F39C12;
  --bg:#F6F5F1;--bg-card:#FFF;--bg-section:#FAF9F6;
  --text:#1C2024;--text-lt:#565D66;--text-sub:#8A9098;
  --border:#E1E8EE;--border-lt:#F0F3F6;
  --shadow:0 2px 12px rgba(20,23,25,.06);
  --shadow-md:0 4px 20px rgba(20,23,25,.10);
  --radius:12px;--radius-sm:8px;
  --font:'Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;
  --font-d:'Sora','Noto Sans KR',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.7;-webkit-font-smoothing:antialiased}

/* Header */
.hd{background:linear-gradient(135deg,var(--navy-dk) 0%,var(--navy) 40%,var(--navy-lt) 100%);position:relative}
.hd::after{content:'';position:absolute;bottom:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--accent),var(--gold),var(--accent))}
.hd-inner{max-width:960px;margin:0 auto;padding:20px 20px 24px;display:flex;align-items:center;justify-content:space-between}
.hd-left{display:flex;align-items:center;gap:16px}
.hd-logo{font-family:var(--font-d);font-size:14px;font-weight:700;color:rgba(255,255,255,.5);letter-spacing:2px}
.hd-title{font-family:var(--font-d);font-size:22px;font-weight:800;color:#fff}
.hd-sub{font-size:12px;color:rgba(255,255,255,.45);margin-top:2px}
.hd-back{padding:8px 16px;border-radius:8px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.8);font-size:13px;font-weight:600;text-decoration:none;transition:all .2s}
.hd-back:hover{background:rgba(255,255,255,.2)}

/* Tabs */
.tab-wrap{max-width:960px;margin:-18px auto 0;padding:0 20px;position:relative;z-index:2}
.tab-inner{background:var(--bg-card);border-radius:var(--radius);box-shadow:var(--shadow-md);padding:12px 14px;display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tab-btn{flex-shrink:0;padding:8px 16px;border-radius:20px;border:1px solid var(--border);background:var(--bg);font-size:13px;font-weight:600;color:var(--text-lt);cursor:pointer;transition:all .2s;font-family:var(--font);white-space:nowrap}
.tab-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-glow)}
.tab-btn.active{background:var(--navy);color:#fff;border-color:var(--navy)}

/* Content */
.content{max-width:960px;margin:0 auto;padding:24px 20px 60px}

/* Loading */
.loading{text-align:center;padding:60px 0;color:var(--text-lt)}
.spin{width:32px;height:32px;border:3px solid var(--border);border-top:3px solid var(--accent);border-radius:50%;animation:sp .7s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}

/* Report List (전체보기 모드) */
.report-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.report-card{background:var(--bg-card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--border-lt);overflow:hidden;cursor:pointer;transition:all .2s}
.report-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);border-color:var(--accent)}
.rc-header{padding:16px 18px;background:linear-gradient(135deg,var(--navy-dk),var(--navy));color:#fff;display:flex;justify-content:space-between;align-items:center}
.rc-date{font-family:var(--font-d);font-size:15px;font-weight:700}
.rc-date.today{background:linear-gradient(90deg,#C9A05C,#E3C893,#C9A05C,#E3C893);background-size:300% 100%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:goldShimmer 3s ease-in-out infinite;font-size:16px}
@keyframes goldShimmer{0%{background-position:100% 0}100%{background-position:-100% 0}}
.rc-badge{font-size:11px;padding:3px 10px;border-radius:12px;background:rgba(255,255,255,.15);color:rgba(255,255,255,.8)}
.rc-body{padding:14px 18px}
.rc-indicators{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.rc-ind{font-size:11px;padding:2px 8px;border-radius:4px;background:var(--bg-section);border:1px solid var(--border-lt);color:var(--text-lt);font-family:var(--font-mono)}
.rc-ind.up{color:var(--danger)}.rc-ind.down{color:#2962FF}
.rc-news{font-size:13px;color:var(--text);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rc-sections{display:flex;gap:4px;margin-top:10px}
.rc-sec-dot{width:8px;height:8px;border-radius:50%;opacity:.6}

/* Section View (섹션별 모드) */
.sec-timeline{display:flex;flex-direction:column;gap:16px}
.sec-item{background:var(--bg-card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--border-lt);overflow:hidden}
.si-date{padding:12px 18px;background:var(--bg-section);border-bottom:1px solid var(--border-lt);font-size:13px;font-weight:700;color:var(--navy);display:flex;align-items:center;gap:8px}
.si-date span{font-size:11px;color:var(--text-lt);font-weight:400}
.si-body{padding:16px 18px}

/* Market Grid */
.m-grid{display:flex;gap:10px;flex-wrap:wrap}
.m-item{flex:1;min-width:100px;text-align:center;padding:10px 8px;border-radius:var(--radius-sm);background:var(--bg-section);border:1px solid var(--border-lt)}
.m-label{font-size:11px;color:var(--text-lt);font-weight:600;margin-bottom:4px}
.m-val{font-family:var(--font-mono);font-size:14px;font-weight:500;color:var(--navy)}
.m-chg{font-size:11px;font-weight:700}
.up{color:var(--danger)}.down{color:#2962FF}.flat{color:var(--text-lt)}

/* Article */
.article{margin-bottom:14px}.article:last-child{margin-bottom:0}
.article-tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:700;margin-bottom:6px}
.tag-finance{background:#E3F2FD;color:#1565C0}.tag-tax{background:#FFF3E0;color:#E65100}
.tag-insurance{background:#E8EAF6;color:#283593}.tag-hot{background:#FBE9E7;color:#BF360C}
.article-title{font-size:14px;font-weight:700;color:var(--navy);margin-bottom:6px;line-height:1.4}
.article-body{font-size:13px;color:var(--text);line-height:1.7}
.insight{margin-top:8px;padding:10px 14px;border-radius:var(--radius-sm);background:var(--accent-glow);border-left:3px solid var(--accent);font-size:12px;color:var(--navy);line-height:1.6}
.insight strong{color:var(--accent)}
.divider{height:1px;background:var(--border-lt);margin:14px 0}

/* Consult */
.consult-label{font-size:12px;font-weight:700;color:var(--accent);margin-bottom:6px}
.consult-card{padding:12px;border-radius:var(--radius-sm);background:var(--bg-section);border:1px solid var(--border-lt);margin-bottom:10px}
.consult-card h4{font-size:13px;font-weight:700;color:var(--navy);margin-bottom:4px}
.consult-card p{font-size:12px;color:var(--text);line-height:1.6}
.consult-tip{margin-top:6px;padding:6px 10px;border-radius:6px;background:#FFF8E1;border:1px solid #FFE082;font-size:11px;color:#795548;line-height:1.5}

/* Skill Steps */
.skill-name{font-size:13px;font-weight:600;color:var(--navy);margin-bottom:10px}
.skill-step{position:relative;padding:10px 12px 10px 36px;margin-bottom:8px;border-radius:var(--radius-sm);background:var(--bg-section);border:1px solid var(--border-lt)}
.skill-step::before{content:attr(data-step);position:absolute;left:10px;top:10px;width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;font-family:var(--font-d)}
.skill-step strong{display:block;font-size:13px;color:var(--navy);margin-bottom:2px}
.skill-step p{font-size:12px;color:var(--text);line-height:1.6}

/* Closing & Mindset */
.closing-box{text-align:center;padding:20px;background:linear-gradient(135deg,var(--navy-dk),var(--navy));border-radius:var(--radius);color:#fff}
.closing-quote{font-size:16px;font-weight:600;line-height:1.6;margin-bottom:8px}
.closing-src{font-size:12px;color:rgba(255,255,255,.5)}
.mindset-box{text-align:center;padding:18px;background:linear-gradient(135deg,var(--gold-bg),rgba(212,160,60,.03));border:1px solid rgba(212,160,60,.15);border-radius:var(--radius)}
.mindset-emoji{font-size:28px;margin-bottom:6px}
.mindset-text{font-size:14px;font-weight:600;color:var(--navy);line-height:1.6;margin-bottom:4px}
.mindset-sub{font-size:11px;color:var(--text-lt)}

/* Weekly Issue */
.wi-badge{display:inline-block;padding:3px 10px;border-radius:16px;font-size:11px;font-weight:700;background:linear-gradient(135deg,#7B1FA2,#9C27B0);color:#fff;margin-bottom:10px}
.wi-title{font-size:15px;font-weight:700;color:var(--navy);margin-bottom:12px}
.wi-briefing{padding:12px 14px;border-radius:var(--radius-sm);background:var(--bg-section);border:1px solid var(--border-lt);margin-bottom:12px;font-size:13px;line-height:1.8}
.wi-analysis{padding:12px 14px;border-radius:var(--radius-sm);background:#F3E5F5;border:1px solid #CE93D8;margin-bottom:12px;font-size:13px;line-height:1.8}
.wi-analysis strong{display:block;color:#6A1B9A;margin-bottom:4px}
.wi-qa-item{padding:10px 14px;border-radius:var(--radius-sm);background:var(--bg-section);border:1px solid var(--border-lt);margin-bottom:8px}
.wi-qa-q{font-size:13px;font-weight:700;color:var(--navy);margin-bottom:4px}
.wi-qa-a{font-size:13px;color:var(--text);line-height:1.7;padding-left:20px}
.wi-approach-item{padding:10px 14px;border-radius:var(--radius-sm);background:var(--bg-section);border:1px solid var(--border-lt);margin-bottom:8px}
.wi-approach-type{font-size:12px;font-weight:700;color:#7B1FA2;margin-bottom:3px}
.wi-approach-line{font-size:13px;color:var(--text);line-height:1.7}
.wi-approach-link{font-size:12px;color:var(--text-lt);margin-top:3px}
.wi-product{padding:10px 14px;border-radius:var(--radius-sm);background:var(--accent-glow);border-left:3px solid var(--accent);margin-bottom:12px;font-size:13px;line-height:1.7}
.wi-key{text-align:center;padding:14px;border-radius:var(--radius-sm);background:linear-gradient(135deg,#F3E5F5,#EDE7F6);border:1px solid #CE93D8;font-size:14px;font-weight:700;color:#4A148C;line-height:1.6;margin-bottom:8px}
.wi-compliance{font-size:11px;color:var(--text-lt);text-align:center}

/* Empty */
.empty{text-align:center;padding:60px 20px;color:var(--text-lt)}
.empty-icon{font-size:48px;margin-bottom:12px}

/* Footer */
.ft{max-width:960px;margin:0 auto;padding:20px;text-align:center;font-size:12px;color:var(--text-lt);line-height:1.8}
.ft a{color:var(--accent);text-decoration:none;font-weight:600}

/* Pager */
.pager{display:flex;justify-content:center;gap:8px;margin-top:24px}
.pg-btn{padding:8px 14px;border-radius:8px;border:1px solid var(--border);background:var(--bg-card);font-size:13px;font-weight:600;color:var(--text-lt);cursor:pointer;transition:all .2s;font-family:var(--font)}
.pg-btn:hover{border-color:var(--accent);color:var(--accent)}
.pg-btn.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.pg-btn:disabled{opacity:.4;cursor:not-allowed}

@media(max-width:600px){
  .hd-inner{flex-direction:column;gap:12px;text-align:center}
  .report-grid{grid-template-columns:1fr}
  .m-grid{flex-direction:row}.m-item{flex:1 1 30%;min-width:80px}
  .tab-btn{font-size:12px;padding:6px 12px}
  .tab-wrap{padding:0;margin-left:0;margin-right:0}
  .tab-inner{border-radius:0;padding:10px 12px}
}
</style>
</head>
<body>

<!-- Header -->
<header class="hd">
  <div class="hd-inner">
    <div class="hd-left">
      <div>
        <div class="hd-logo">JARVIA</div>
        <div class="hd-title">Daily Report Archive</div>
        <div class="hd-sub">보험·재무 컨설턴트를 위한 인사이트 아카이브</div>
      </div>
    </div>
    <a class="hd-back" href="./index.html">← 메인으로</a>
  </div>
</header>

<!-- Section Tabs -->
<div class="tab-wrap">

    <button class="tab-btn active" data-sec="all">📋 전체보기</button>
    <button class="tab-btn" data-sec="market">📊 경제지표</button>
    <button class="tab-btn" data-sec="news">📰 뉴스</button>
    <button class="tab-btn" data-sec="hotissue">🔥 핫이슈</button>
    <button class="tab-btn" data-sec="insurance">🛡 보험정보</button>

<!-- Content -->
<div class="content" id="main">
  <div class="loading"><div class="spin"></div><p>Daily Report를 불러오는 중...</p></div>
</div>

<!-- Footer -->
<footer class="ft">
  JARVIA Daily Report Archive | 한국FP센터 &copy; 2026<br>
  <span style="color:var(--text-sub)">본 콘텐츠는 AI 기반으로 자동 생성되며, 투자 권유가 아닙니다.</span><br>
  <a href="./index.html">← JARVIA 메인으로 돌아가기</a>

<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import{getAuth,onAuthStateChanged,setPersistence,browserLocalPersistence}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import{getFirestore,collection,getDocs,query,orderBy,limit,doc,getDoc}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const FC={apiKey:"AIzaSyBD9p-bf162RiiD1Y3BsY-NvbYjpOSrzmg",authDomain:"jarvia-platform.firebaseapp.com",projectId:"jarvia-platform",storageBucket:"jarvia-platform.firebasestorage.app",messagingSenderId:"388025068900",appId:"1:388025068900:web:09ba8e12e9e9e2ec49de71"};
const app=initializeApp(FC);
const auth=getAuth(app);
setPersistence(auth,browserLocalPersistence).catch(()=>{});   // ★ 로그인 유지 수정(2026-07-12): 메인(index.html)과 동일한 저장 방식으로 통일 — 이 줄이 없으면 메인에서 로그인해도 이 페이지가 로그인 정보를 못 읽어 '로그인이 필요합니다'가 뜬다
const db=getFirestore(app,'javia-db');

let allReports=[];
let currentTab='all';
const PER_PAGE=12;
let currentPage=1;

// ── 데이터 로드 ──
async function loadReports(){
  try{
    const snap=await getDocs(query(collection(db,'daily_reports'),orderBy('createdAt','desc'),limit(200)));
    allReports=snap.docs.map(d=>({id:d.id,...d.data()}));
    render();
  }catch(e){
    console.error('load error:',e);
    document.getElementById('main').innerHTML='<div class="empty"><div class="empty-icon">⚠️</div><p>데이터를 불러올 수 없습니다.</p></div>';
  }
}

// ── 탭 전환 ──
document.getElementById('tabs').addEventListener('click',e=>{
  const btn=e.target.closest('.tab-btn');
  if(!btn)return;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  currentTab=btn.dataset.sec;
  currentPage=1;
  render();
});

// ── 렌더링 분기 ──
function render(){
  if(!allReports.length){
    document.getElementById('main').innerHTML='<div class="empty"><div class="empty-icon">📭</div><p>아직 생성된 Daily Report가 없습니다.</p></div>';
    return;
  }
  if(currentTab==='all') renderAll();
  else renderSection(currentTab);
}

// ── 전체보기: 카드 그리드 ──
function renderAll(){
  const total=allReports.length;
  const pages=Math.ceil(total/PER_PAGE);
  const start=(currentPage-1)*PER_PAGE;
  const items=allReports.slice(start,start+PER_PAGE);
  
  const secColors=[
    {bg:'#1565C0'},{bg:'#2E7D32'},{bg:'#BF360C'},{bg:'#283593'},
    {bg:'#E65100'},{bg:'#00695C'},{bg:'#1E2226'},{bg:'#C9A05C'}
  ];
  
  const _now=new Date();const _days=['일','월','화','수','목','금','토'];
  const _todayStr=_now.getFullYear()+'년 '+(_now.getMonth()+1)+'월 '+_now.getDate()+'일 ('+_days[_now.getDay()]+')';
  let html='<div class="report-grid">';
  for(const r of items){
    const mkt=r.section01_market?.indicators||[];
    const mktHtml=mkt.slice(0,3).map(ind=>{
      const cleanUnit=(ind.unit&&!ind.unit.includes('='))?' '+ind.unit:'';
      return `<span class="rc-ind">${esc(ind.label)} ${esc(ind.value)}${cleanUnit}</span>`;
    }).join('');
    
    const newsTitle=(r.section02_news&&r.section02_news[0])?r.section02_news[0].title:'';
    const _drUrl='./dr-viewer.html?id='+(r.fileDate||r.id);
    const _isToday=(r.date||r.fileDate||'').includes(_todayStr)?'today':'';
    
    html+=`<div class="report-card" onclick="window.open('${esc(_drUrl)}','_blank')">
      <div class="rc-header">
        <span class="rc-date ${_isToday}">${esc(r.date||r.fileDate)}</span>
        <span class="rc-badge">Daily Report</span>
      </div>
      <div class="rc-body">
        <div class="rc-indicators">${mktHtml}</div>
        <div class="rc-news">${esc(newsTitle)}</div>
        <div class="rc-sections">
          ${secColors.map(c=>`<div class="rc-sec-dot" style="background:${c.bg}"></div>`).join('')}
        </div>
      </div>
    </div>`;
  }
  html+='</div>';
  
  // Pager
  if(pages>1){
    html+='<div class="pager">';
    html+=`<button class="pg-btn" onclick="window._pgNav(${currentPage-1})" ${currentPage===1?'disabled':''}>‹</button>`;
    for(let i=1;i<=pages;i++){
      html+=`<button class="pg-btn ${i===currentPage?'active':''}" onclick="window._pgNav(${i})">${i}</button>`;
    }
    html+=`<button class="pg-btn" onclick="window._pgNav(${currentPage+1})" ${currentPage===pages?'disabled':''}>›</button>`;
    html+='</div>';
  }
  
  document.getElementById('main').innerHTML=html;
}

window._pgNav=function(p){
  if(p<1)return;
  currentPage=p;
  render();
  window.scrollTo({top:200,behavior:'smooth'});
};

// ── 섹션별 타임라인 ──
function renderSection(sec){
  const sectionMap={
    market:{key:'section01_market',title:'경제지표 스냅샷',icon:'📊',render:renderMarket},
    news:{key:'section02_news',title:'금융·보험 뉴스',icon:'📰',render:renderNews},
    hotissue:{key:'section03_hotissue',title:'Today Hot Issue',icon:'🔥',render:renderHotIssue},
    insurance:{key:'section04_insurance',title:'보험정보',icon:'🛡',render:renderInsurance},
    consulting:{key:'section05_consulting',title:'Consulting Focus',icon:'🎯',render:renderConsulting},
    skillup:{key:'section06_skillup',title:'상담 Skill-Up',icon:'📈',render:renderSkillUp},
    closing:{key:'section07_closing',title:'Closing Talk',icon:'💬',render:renderClosing},
    mindset:{key:'section08_mindset',title:'Today Mindset',icon:'🌟',render:renderMindset},
    weeklyissue:{key:'weeklyIssue',title:'요일별 Issue',icon:'📌',render:renderWeeklyIssue}
  };
  
  const cfg=sectionMap[sec];
  if(!cfg)return;
  
  const filtered=allReports.filter(r=>r[cfg.key]);
  if(!filtered.length){
    document.getElementById('main').innerHTML=`<div class="empty"><div class="empty-icon">${cfg.icon}</div><p>${cfg.title} 데이터가 없습니다.</p></div>`;
    return;
  }
  
  let html=`<div class="sec-timeline">`;
  for(const r of filtered){
    html+=`<div class="sec-item">
      <div class="si-date">${cfg.icon} ${esc(r.date||r.fileDate)} <span>${cfg.title}</span></div>
      <div class="si-body">${cfg.render(r[cfg.key])}</div>
    </div>`;
  }
  html+='</div>';
  document.getElementById('main').innerHTML=html;
}

// ── 섹션별 렌더 함수들 ──
function renderMarket(data){
  const inds=data.indicators||[];
  return '<div class="m-grid">'+inds.map(ind=>{
    const cleanUnit=(ind.unit&&!ind.unit.includes('='))?' '+ind.unit:'';
    return `<div class="m-item"><div class="m-label">${esc(ind.label)}</div><div class="m-val">${esc(ind.value)}${cleanUnit}</div></div>`;
  }).join('')+'</div><div style="text-align:right;margin-top:6px;font-size:10px;color:#95A5A6">출처: 한국은행 ECOS</div>';
}

function renderNews(data){
  if(!Array.isArray(data))return '';
  return data.map((n,i)=>{
    const div=i<data.length-1?'<div class="divider"></div>':'';
    return `<div class="article">
      <span class="article-tag ${esc(n.tagClass||'tag-finance')}">${esc(n.tag)}</span>
      <div class="article-title">${esc(n.title)}</div>
      <div class="article-body">${n.body||''}</div>
      ${n.insight?`<div class="insight"><strong>💡 컨설턴트 포인트</strong><br>${esc(n.insight.replace(/^💡\s*/,''))}</div>`:''}
    </div>${div}`;
  }).join('')+'<div style="text-align:right;margin-top:6px;font-size:10px;color:#95A5A6">출처: 네이버 뉴스 기반 AI 분석</div>';
}

function renderHotIssue(data){
  return `<div class="article">
    <span class="article-tag tag-hot">${esc(data.tag||'오늘의 이슈')}</span>
    <div class="article-title">${esc(data.title||'')}</div>
    <div class="article-body">${data.body||''}</div>
    ${data.insight?`<div class="insight"><strong>💡 쉬운 해설</strong><br>${esc(data.insight.replace(/^💡\s*/,''))}</div>`:''}
  </div><div style="text-align:right;margin-top:6px;font-size:10px;color:#95A5A6">출처: 네이버 뉴스 기반 AI 분석</div>`;
}

function renderInsurance(data){
  return `<div class="article">
    <span class="article-tag ${esc(data.tagClass||'tag-insurance')}">${esc(data.tag||'업계동향')}</span>
    <div class="article-title">${esc(data.title||'')}</div>
    <div class="article-body">${data.body||''}</div>
    ${data.insight?`<div class="insight"><strong>💡 영업 활용 포인트</strong><br>${esc(data.insight.replace(/^💡\s*/,''))}</div>`:''}
  </div><div style="text-align:right;margin-top:6px;font-size:10px;color:#95A5A6">출처: 보험저널 기반 AI 분석</div>`;
}

function renderConsulting(data){
  const p=data.personal||{};
  const c=data.corporate||{};
  return `<div class="consult-label">👤 Personal</div>
    <div class="consult-card">
      <h4>${esc(p.title||'')}</h4>
      <p>${esc(p.description||'')}</p>
      ${p.tip?`<div class="consult-tip">${p.tip}</div>`:''}
    </div>
    <div class="consult-label" style="margin-top:12px">🏢 Corporate</div>
    <div class="consult-card">
      <h4>${esc(c.title||'')}</h4>
      <p>${esc(c.description||'')}</p>
      ${c.tip?`<div class="consult-tip">${c.tip}</div>`:''}
    </div>`;
}

function renderSkillUp(data){
  const steps=(data.steps||[]).map((s,i)=>
    `<div class="skill-step" data-step="${i+1}"><strong>${esc(s.title)}</strong><p>${esc(s.content)}</p></div>`
  ).join('');
  return `<div class="skill-name">오늘의 스킬: "${esc(data.skillName||'')}"</div>${steps}`;
}

function renderClosing(data){
  return `<div class="closing-box">
    <div class="closing-quote">${esc(data.quote||'')}</div>
    <div class="closing-src">— ${esc(data.source||'')}</div>
  </div>`;
}

function renderMindset(data){
  return `<div class="mindset-box">
    <div class="mindset-emoji">${data.emoji||'🌟'}</div>
    <div class="mindset-text">${esc(data.message||'')}</div>
    <div class="mindset-sub">— ${esc(data.subtitle||'')}</div>
  </div>`;
}

function renderWeeklyIssue(data){
  if(!data)return '';
  let html=`<div class="wi-badge">${esc(data.topic||'')}</div>
    <div class="wi-title">${esc(data.title||'')}</div>`;
  if(data.briefing) html+=`<div class="wi-briefing"><strong>📋 고객이 읽은 내용</strong><br>${esc(data.briefing)}</div>`;
  if(data.analysis) html+=`<div class="wi-analysis"><strong>🔍 컨설턴트 심화 분석</strong>${esc(data.analysis)}</div>`;
  if(data.qa&&data.qa.length){
    html+=`<div style="font-size:13px;font-weight:700;color:var(--navy);margin:12px 0 8px">💬 고객 예상 질문 & 실전 답변</div>`;
    data.qa.forEach(qa=>{
      html+=`<div class="wi-qa-item"><div class="wi-qa-q">🙋 ${esc(qa.q||'')}</div><div class="wi-qa-a">${esc(qa.a||'')}</div></div>`;
    });
  }
  if(data.approach&&data.approach.length){
    html+=`<div style="font-size:13px;font-weight:700;color:var(--navy);margin:12px 0 8px">🎯 고객 유형별 접근법</div>`;
    data.approach.forEach(ap=>{
      html+=`<div class="wi-approach-item"><div class="wi-approach-type">👤 ${esc(ap.type||'')}</div><div class="wi-approach-line">💬 "${esc(ap.firstLine||'')}"</div><div class="wi-approach-link">→ ${esc(ap.linkage||'')}</div></div>`;
    });
  }
  if(data.productLink) html+=`<div class="wi-product"><strong>🔗 상품 연계 전환 멘트</strong><br>${esc(data.productLink)}</div>`;
  if(data.keyMessage) html+=`<div class="wi-key">💡 ${esc(data.keyMessage)}</div>`;
  if(data.compliance) html+=`<div class="wi-compliance">⚠️ ${esc(data.compliance)}</div>`;
  return html;
}

function esc(s){return s?String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'):'';}
