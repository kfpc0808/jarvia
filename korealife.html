<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>단체 관리자 화면 예시 · 한국생명 샘플</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F4F6F9}
a{color:#0F4C81;text-decoration:none}a:hover{text-decoration:underline}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #F2C14E;outline-offset:2px}
.m-only{display:none}
.g2>*,.kpi>*,.exec-g>*,.tier>*,.ops>*,.qa>*,.nt>*{min-width:0}
.lnk{border:0;background:transparent;padding:0;font-family:inherit;font-size:inherit;font-weight:600;color:#0F4C81;cursor:pointer;text-align:left}
.lnk:hover{text-decoration:underline}
@media (max-width:1100px){.g2c{grid-template-columns:minmax(0,1fr)!important}}
@media (max-width:760px){
.m-only{display:block}
.hd{padding:10px 12px!important;gap:8px 10px!important}
.hd .logo{width:34px;height:34px}
.brandname{font-size:16px!important}
.adm-role{display:none}
.adm button{height:30px!important;padding:0 10px!important;font-size:12px!important}
.gnav{order:3;flex:1 0 100%;min-width:0;flex-wrap:nowrap!important;overflow-x:auto;scrollbar-width:none}
.gnav::-webkit-scrollbar{display:none}
.gnav button{flex-shrink:0;padding:7px 12px!important;font-size:13px!important}
.bn{padding:8px 12px!important;gap:6px 8px!important;font-size:12px!important;line-height:1.5}
.mn{padding:14px 12px 32px!important;gap:12px!important}
.mn h1{font-size:20px!important}
.mn h2{font-size:14.5px!important}
.mn section:not(.kpi){padding:14px!important;border-radius:12px!important}
.top{gap:10px!important}
.ctl{display:grid!important;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:6px!important;width:100%}
.seg{grid-column:1/-1;display:flex!important}
.seg button{flex:1;height:34px!important;padding:0 4px!important;font-size:12.5px!important}
.ctl label{display:flex!important;min-width:0}
.ctl .lbl{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ctl select{width:100%;min-width:0;height:34px!important;padding:0 6px!important;font-size:12.5px!important}
.xl{height:34px!important;padding:0 10px!important;font-size:12.5px!important}
.kpi{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:8px!important}
.kpi>div{padding:11px 12px!important;gap:3px!important;border-radius:11px!important}
.kpi>div>span:nth-child(1){font-size:12px!important}
.kpi>div>span:nth-child(2){font-size:22px!important}
.kpi>div>span:nth-child(3){font-size:11px!important;line-height:1.4}
.exec{gap:10px!important}
.exec-g{grid-template-columns:minmax(0,1fr)!important;gap:8px!important}
.exec-g>div{padding:11px 13px!important;gap:5px!important}
.exec-g>div>span:nth-child(2){font-size:13.5px!important;line-height:1.5!important}
.tier{grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:6px!important}
.tier>div{padding:10px 9px!important;gap:6px!important}
.tier>div>div:first-child{flex-direction:column;align-items:flex-start!important;gap:1px}
.tier>div>div:first-child b{font-size:12px!important}
.tier>div>div:nth-child(2){grid-template-columns:minmax(0,1fr)!important;gap:6px!important}
.tier>div>div:nth-child(2)>div>div{font-size:18px!important}
.tier>div>div:nth-child(2) small{font-size:11px!important}
.g2{grid-template-columns:minmax(0,1fr)!important;gap:12px!important}
.chart{height:160px}
.fn{grid-template-columns:92px minmax(0,1fr) 44px!important;gap:8px!important;font-size:12.5px}
.ft{grid-template-columns:minmax(0,1fr) auto!important;row-gap:4px!important;column-gap:8px!important}
.ft>span:nth-child(2){grid-column:1/-1;order:3}
.hm>span{height:24px!important}
.lr{grid-template-columns:84px minmax(0,1fr) 112px!important;gap:8px!important;font-size:12.5px!important}
.og{min-width:680px!important;font-size:12.5px!important}
.og>div{grid-template-columns:112px 48px 150px 66px 74px 70px 84px 64px!important}
.og>div>div{padding:8px 8px!important}
.mg{font-size:12.5px!important}
.mg>div>div{padding:8px 8px!important}
.acts button{flex:1}
.ops{grid-template-columns:minmax(0,1fr)!important;gap:10px!important}
.qa,.nt,.lc{grid-template-columns:minmax(0,1fr)!important}
.mf{display:grid!important;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px!important}
.mf>*{min-width:0}
.mf input{grid-column:1/-1}
.mf select,.mf input{width:100%;height:34px!important;font-size:12.5px!important}
}
</style>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-tpl">
<div style="box-sizing: border-box; width: 100%; min-height: 100vh; background: #F4F6F9; font-family: 'Noto Sans KR', sans-serif; color: #1F2A37; font-variant-numeric: tabular-nums">

  <header style="background: {{brand}}; color: #FFFFFF">
    <div class="hd" style="max-width: 1376px; margin: 0 auto; padding: 14px 32px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap">
      <div style="display: flex; align-items: center; gap: 14px">
        <svg class="logo" width="42" height="42" viewBox="0 0 42 42" aria-hidden="true"><rect x="0.5" y="0.5" width="41" height="41" rx="11" fill="#FFFFFF"></rect><path d="M21 8.5c5.2 2.6 9.6 3.4 12 3.6v8.3c0 7.4-4.9 12.2-12 14.6c-7.1-2.4-12-7.2-12-14.6v-8.3c2.4-.2 6.8-1 12-3.6z" fill="{{brand}}"></path><path d="M14.8 24.6l4-4.2 3.1 2.6 5.5-6.3" fill="none" stroke="#F2C14E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path><circle cx="27.4" cy="16.7" r="1.9" fill="#F2C14E"></circle></svg>
        <div style="display: flex; flex-direction: column">
          <span class="brandname" style="font-size: 19px; font-weight: 700; letter-spacing: -0.3px">한국생명 <span style="font-size: 11px; font-weight: 600; letter-spacing: 1.2px; opacity: 0.8; margin-left: 2px">KOREA LIFE</span></span>
          <span style="font-size: 11.5px; opacity: 0.85">단체 관리자 센터 · powered by JARVIA</span>
        </div>
      </div>
      <nav class="gnav" aria-label="관리 메뉴" style="display: flex; gap: 4px; flex-wrap: wrap">
        <sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
          <button type="button" aria-current="{{t.cur}}" onClick="{{t.pick}}" style="{{t.st}}">{{t.l}}<sc-if value="{{t.hasBadge}}" hint-placeholder-val="{{false}}"><span style="min-width: 18px; height: 18px; padding: 0 5px; box-sizing: border-box; border-radius: 999px; background: #F2C14E; color: #0B1F38; font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center">{{t.badge}}</span></sc-if></button>
        </sc-for>
      </nav>
      <div class="adm" style="display: flex; align-items: center; gap: 10px; font-size: 13px">
        <span class="adm-role">영업지원본부 관리자</span>
        <button type="button" onClick="{{logout}}" style="height: 34px; padding: 0 12px; border: 1px solid rgba(255,255,255,0.5); border-radius: 8px; background: transparent; color: #FFFFFF; font-family: inherit; font-size: 12.5px; cursor: pointer">로그아웃</button>
      </div>
    </div>
  </header>

  <div style="background: #FFF7E0; border-bottom: 1px solid #F1D99A">
    <div class="bn" style="max-width: 1376px; margin: 0 auto; padding: 10px 32px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 13px; color: #6B4E00">
      <b style="background: #8A6400; color: #FFFFFF; font-size: 11.5px; padding: 3px 9px; border-radius: 999px; letter-spacing: 0.3px">예시 화면</b>
      <b style="background: #0B1F38; color: #FFFFFF; font-size: 11.5px; padding: 3px 9px; border-radius: 999px; letter-spacing: 0.3px">PC 전용 버전</b>
      <span>단체(기업) 도입 시 구축해 드리는 <b>관리자 페이지의 예시 화면</b>입니다. 메뉴·기간·조직·직급을 바꾸면 화면이 바뀌며, 발송·등록 버튼은 실제로 보내지 않습니다. 사명·로고·이름·숫자는 모두 가상의 예시입니다.</span>
      <span class="m-only" style="width: 100%; font-weight: 600">PC 화면 기준으로 만든 화면이며, 모바일에서도 보실 수 있습니다. 넓은 표는 좌우로 밀어서 확인하세요.</span>
    </div>
  </div>

  <main class="mn" style="max-width: 1376px; margin: 0 auto; padding: 24px 32px 48px; display: flex; flex-direction: column; gap: 18px">

    <div class="top" style="display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap">
          <h1 style="margin: 0; font-size: 24px; font-weight: 700; color: #0B1F38; letter-spacing: -0.5px">{{tabTitle}}</h1>
          <span style="font-size: 12px; font-weight: 600; color: #8A4B00; background: #FFF1D6; padding: 3px 9px; border-radius: 999px">예시 데이터</span>
        </div>
        <span style="font-size: 12.5px; color: #5B6878">{{tabSub}}</span>
      </div>
      <sc-if value="{{showFilters}}" hint-placeholder-val="{{true}}">
      <div class="ctl" style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap">
        <sc-if value="{{isUsage}}" hint-placeholder-val="{{true}}">
        <div class="seg" role="group" aria-label="기간" style="display: inline-flex; border: 1px solid #D3DBE5; border-radius: 8px; overflow: hidden; background: #FFFFFF">
          <sc-for list="{{periods}}" as="p" hint-placeholder-count="3">
            <button type="button" onClick="{{p.pick}}" style="{{p.st}}">{{p.l}}</button>
          </sc-for>
        </div>
        </sc-if>
        <label style="display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: #5B6878"><span class="lbl">조직</span>
          <select value="{{branch}}" onChange="{{onBranch}}" style="height: 36px; padding: 0 10px; border: 1px solid #D3DBE5; border-radius: 8px; background: #FFFFFF; font-family: inherit; font-size: 13px; color: #1F2A37"><option value="all">전체 (7개 지점)</option><option value="gn">서울강남지점</option><option value="bon">서울본점</option><option value="gg">경기남부지점</option><option value="sj">세종지점</option><option value="gj">광주지점</option><option value="dj">대전지점</option><option value="bs">부산지점</option></select>
        </label>
        <label style="display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: #5B6878"><span class="lbl">직급</span>
          <select value="{{rank}}" onChange="{{onRank}}" style="height: 36px; padding: 0 10px; border: 1px solid #D3DBE5; border-radius: 8px; background: #FFFFFF; font-family: inherit; font-size: 13px; color: #1F2A37"><option value="all">전체 직급</option><option value="지점장">지점장</option><option value="팀장">팀장</option><option value="실장">실장</option><option value="설계사">설계사</option></select>
        </label>
        <button class="xl" type="button" onClick="{{excel}}" style="height: 36px; padding: 0 14px; border: 1px solid #D3DBE5; border-radius: 8px; background: #FFFFFF; font-family: inherit; font-size: 13px; color: #1F2A37; display: inline-flex; align-items: center; gap: 6px; cursor: pointer"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1A7F4B" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"></path></svg>엑셀 보고서</button>
      </div>
      </sc-if>
    </div>

    <sc-if value="{{isUsage}}" hint-placeholder-val="{{true}}">
    <div style="display: flex; flex-direction: column; gap: 18px">

    <section class="kpi" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px">
      <div style="background: #FFFFFF; border: 1px solid #E4E9F0; border-radius: 14px; padding: 16px 18px; display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 12.5px; color: #5B6878">등록 인원</span>
        <span style="font-size: 28px; font-weight: 700; color: #0B1F38; line-height: 1.1">{{k.heads}}<small style="font-size: 14px; font-weight: 500; color: #5B6878"> {{k.headsOf}}</small></span>
        <span style="font-size: 12px; color: #5B6878">첫 로그인 {{k.first}} · 미로그인 {{k.never}}명</span>
      </div>
      <div style="background: #FFFFFF; border: 1px solid #E4E9F0; border-radius: 14px; padding: 16px 18px; display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 12.5px; color: #5B6878">활성 사용자 ({{per.sh}})</span>
        <span style="font-size: 28px; font-weight: 700; color: #0B1F38; line-height: 1.1">{{k.act}}<small style="font-size: 14px; font-weight: 500; color: #5B6878">명</small></span>
        <span style="font-size: 12px; color: #5B6878">활성률 <b style="color: #1A7F4B">{{k.rate}}</b> · {{k.cmp}} <b style="{{k.trendSt}}">{{k.trend}}</b></span>
      </div>
      <div style="background: #FFFFFF; border: 1px solid #E4E9F0; border-radius: 14px; padding: 16px 18px; display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 12.5px; color: #5B6878">평일 일평균 사용자</span>
        <span style="font-size: 28px; font-weight: 700; color: #0B1F38; line-height: 1.1">{{k.wavg}}<small style="font-size: 14px; font-weight: 500; color: #5B6878">명</small></span>
        <span style="font-size: 12px; color: #5B6878">최고 {{k.wmax}} · 직전 평일 {{k.wlast}}</span>
      </div>
      <div style="background: #FFFFFF; border: 1px solid #E4E9F0; border-radius: 14px; padding: 16px 18px; display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 12.5px; color: #5B6878">1인당 사용일수 ({{per.sh}})</span>
        <span style="font-size: 28px; font-weight: 700; color: #0B1F38; line-height: 1.1">{{k.days}}<small style="font-size: 14px; font-weight: 500; color: #5B6878">일</small></span>
        <span style="font-size: 12px; color: #5B6878">주 3일 이상 사용 {{k.freq}}명</span>
      </div>
      <div style="background: #FFFFFF; border: 1px solid #E4E9F0; border-radius: 14px; padding: 16px 18px; display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 12.5px; color: #5B6878">필수교육 이수율</span>
        <span style="font-size: 28px; font-weight: 700; color: #0B1F38; line-height: 1.1">{{k.edu}}<small style="font-size: 14px; font-weight: 500; color: #5B6878">%</small></span>
        <span style="font-size: 12px; color: #5B6878">수료증 발급 {{k.cert}}건</span>
      </div>
      <div style="background: #FFFFFF; border: 1px solid #E4E9F0; border-radius: 14px; padding: 16px 18px; display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 12.5px; color: #5B6878">고객 대상 발송 ({{per.sh}})</span>
        <span style="font-size: 28px; font-weight: 700; color: #0B1F38; line-height: 1.1">{{k.sends}}<small style="font-size: 14px; font-weight: 500; color: #5B6878">건</small></span>
        <span style="font-size: 12px; color: #5B6878">발송 사용 {{k.senders}}명 · 등록 고객 {{k.clients}}명</span>
      </div>
    </section>

    <section class="exec" style="background: #0B1F38; color: #FFFFFF; border-radius: 14px; padding: 18px 22px; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap">
        <h2 style="margin: 0; font-size: 15.5px; font-weight: 700">경영 요약 · 지금 할 일 3가지 <span style="font-size: 12px; font-weight: 500; color: #A9B8CC; margin-left: 4px">{{scopeName}}</span></h2>
        <span style="font-size: 12px; color: #A9B8CC">매일 아침 자동 갱신</span>
      </div>
      <div class="exec-g" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 10px">
        <div style="background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12); border-radius: 11px; padding: 13px 15px; display: flex; flex-direction: column; gap: 8px">
          <span style="font-size: 12px; color: #F2C14E; font-weight: 700">목표 달성</span>
          <span style="font-size: 14px; line-height: 1.55">활성률 <b>{{k.rate}}</b> — {{e.goal}}</span>
          <button type="button" onClick="{{e.act1}}" style="align-self: flex-start; border: 0; background: transparent; padding: 0; font-family: inherit; font-size: 12.5px; color: #C9D5E3; cursor: pointer; text-align: left">→ 30일 미사용 {{e.unused}}명에게 활용 안내 발송 <u style="color: #F2C14E">바로 실행</u></button>
        </div>
        <div style="background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12); border-radius: 11px; padding: 13px 15px; display: flex; flex-direction: column; gap: 8px">
          <span style="font-size: 12px; color: #FF9F86; font-weight: 700">관리 필요 {{e.unitWord}}</span>
          <span style="font-size: 14px; line-height: 1.55">{{e.worstLine}}</span>
          <button type="button" onClick="{{e.act2}}" style="align-self: flex-start; border: 0; background: transparent; padding: 0; font-family: inherit; font-size: 12.5px; color: #C9D5E3; cursor: pointer; text-align: left">→ {{e.worstAct}} <u style="color: #F2C14E">일정 등록</u></button>
        </div>
        <div style="background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12); border-radius: 11px; padding: 13px 15px; display: flex; flex-direction: column; gap: 8px">
          <span style="font-size: 12px; color: #9FD8B8; font-weight: 700">교육 마감 임박</span>
          <span style="font-size: 14px; line-height: 1.55">「2026 세법 개정 핵심」 마감 D-14 · 이수 <b>{{e.taxRate}}</b>, 미시작 <b>{{e.taxNs}}명</b>.</span>
          <button type="button" onClick="{{e.act3}}" style="align-self: flex-start; border: 0; background: transparent; padding: 0; font-family: inherit; font-size: 12.5px; color: #C9D5E3; cursor: pointer; text-align: left">→ 미시작 {{e.taxNs}}명에게 알림톡 1회 안내 <u style="color: #F2C14E">바로 실행</u></button>
        </div>
      </div>
    </section>

    <section style="background: #FFFFFF; border: 1px solid #E4E9F0; border-radius: 14px; padding: 18px 20px; display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap">
        <h2 style="margin: 0; font-size: 15px; font-weight: 700; color: #0B1F38">활용도별 영업 활동 비교 · {{per.lab}}</h2>
        <span style="font-size: 12px; color: #5B6878">사용일수 기준 상위 25% · 중간 50% · 하위 25% 구성원 비교</span>
      </div>
      <div class="tier" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px">
        <div style="border: 1.5px solid {{brand}}; border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
          <div style="display: flex; justify-content: space-between; align-items: baseline"><b style="font-size: 14px; color: {{brand}}">활용 상위 25%</b><span style="font-size: 12px; color: #5B6878">{{tier.top.n}}</span></div>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px">
            <div><div style="font-size: 24px; font-weight: 700; color: #0B1F38">{{tier.top.d}}<small style="font-size: 13px; font-weight: 500; color: #5B6878">일</small></div><small style="color: #5B6878">1인 사용일</small></div>
            <div><div style="font-size: 24px; font-weight: 700; color: #0B1F38">{{tier.top.s}}<small style="font-size: 13px; font-weight: 500; color: #5B6878">건</small></div><small style="color: #5B6878">1인 고객 발송</small></div>
          </div>
        </div>
        <div style="border: 1px solid #E4E9F0; border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
