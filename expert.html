<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>전문가 로그인 · 이너서클</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<!-- ★ [2026-09-30] 이너서클 전문가 전용 로그인 — 등록된 휴대폰 번호 + 문자 인증번호 → 30일 세션 → ic-case.html(내 의뢰 현황) -->
<style>
:root{
  --navy:#0E2438;--navy-2:#16324D;--ink:#141A24;--gray:#3A4353;--gray-l:#6B7585;
  --line:#E4E8EE;--line-2:#EEF1F5;--paper:#F7F8FA;--gold:#A8862F;--gold-bg:#FCFBF7;--gold-line:#EDE6D5;
  --danger:#A93B33;--danger-bg:#F9EDEB;--ok:#1B7A5A;
  --f:'Pretendard',-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--f);background:var(--paper);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased;font-feature-settings:'tnum';min-height:100vh}
button,input{font-family:inherit;color:inherit}
.hdwrap{background:var(--navy);padding-top:var(--safe-t)}
.tb{display:flex;align-items:center;height:54px;padding:0 16px;gap:9px;max-width:1180px;margin:0 auto}
.tb .dot{width:5px;height:5px;border-radius:50%;background:var(--gold)}
.tb .lg{font-size:15px;font-weight:700;color:#fff;letter-spacing:-.02em}
.tb .sub{font-size:10.5px;color:#7E93AC;letter-spacing:.05em;padding-left:9px;border-left:1px solid rgba(255,255,255,.15)}
.wrap{max-width:440px;margin:0 auto;padding:48px 20px calc(40px + var(--safe-b))}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:32px 28px 28px;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;left:0;right:0;top:0;height:4px;background:var(--gold)}
h1{font-size:24px;font-weight:800;letter-spacing:-.04em;color:var(--navy)}
.lead{font-size:13.5px;color:var(--gray);margin-top:8px;line-height:1.8}
.fld{margin-top:22px}
.fld label{display:block;font-size:12.5px;font-weight:600;color:var(--gray);margin-bottom:7px}
.row{display:flex;gap:8px}
.fld input{flex:1;min-width:0;width:100%;border:1px solid var(--line);border-radius:9px;padding:14px 15px;font-size:17px;background:#fff;outline:none;letter-spacing:.02em}
.fld input:focus{border-color:var(--gold);box-shadow:0 0 0 3px #F6EFDC}
.fld input[readonly]{background:var(--paper);color:var(--gray)}
.fld input.code{letter-spacing:.5em;font-weight:700;text-align:center;font-size:20px}
.sbtn{flex-shrink:0;border:1px solid var(--navy);background:#fff;color:var(--navy);border-radius:9px;padding:0 14px;font-size:13.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.sbtn:disabled{border-color:var(--line);color:var(--gray-l);cursor:default}
.meta{display:flex;justify-content:space-between;font-size:12px;color:var(--gray-l);margin-top:7px}
.meta .tm{color:var(--danger);font-weight:600;font-variant-numeric:tabular-nums}
.btn{display:block;width:100%;margin-top:22px;background:var(--navy);color:#fff;border:none;border-radius:9px;padding:15px;font-size:15.5px;font-weight:700;cursor:pointer}
.btn:hover{background:var(--navy-2)}
.btn:disabled{background:#C9CFD8;cursor:default}
.msg{font-size:12.5px;margin-top:12px;line-height:1.6;min-height:1.6em}
.msg.err{color:var(--danger)}.msg.ok{color:var(--ok)}
.note{margin-top:22px;padding-top:18px;border-top:1px solid var(--line-2);font-size:12px;color:var(--gray-l);line-height:1.8}
.note b{color:var(--gray);font-weight:600}
.hide{display:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media(max-width:480px){.wrap{padding-top:28px}.card{padding:26px 20px 22px}h1{font-size:22px}}
</style>
</head>
<body>
<div class="hdwrap"><div class="tb"><span class="dot"></span><span class="lg">이너서클 상담</span><span class="sub">INNER CIRCLE</span></div></div>

<main class="wrap">
  <div class="card">
    <h1>전문가 로그인</h1>
    <p class="lead">이너서클 상담 전문가 전용 화면입니다.<br>본사에 등록된 휴대폰 번호로 로그인하시면 의뢰받은 상담과 유료 컨설팅 내역을 언제든 확인하실 수 있습니다.</p>

    <div class="fld">
      <label for="ph">휴대폰 번호</label>
      <div class="row">
        <input id="ph" type="tel" inputmode="numeric" autocomplete="tel" placeholder="010-0000-0000" maxlength="13">
        <button class="sbtn" id="send">인증번호 받기</button>
      </div>
    </div>

    <div class="fld hide" id="code-fld">
      <label for="cd">인증번호 6자리</label>
      <input id="cd" class="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="······">
      <div class="meta"><span>문자로 받으신 번호를 입력해 주세요</span><span class="tm" id="tm"></span></div>
    </div>

    <button class="btn hide" id="go">로그인</button>
    <div class="msg" id="msg" role="status" aria-live="polite"></div>

    <div class="note">
      로그인은 이 기기에서 <b>30일간</b> 유지됩니다. 공용 PC에서는 사용 후 로그아웃해 주세요.<br>
      번호가 바뀌었거나 로그인이 되지 않으면 본사로 연락해 주세요.<br>
      <b>박신제 본부장 010-5244-1467</b>
    </div>
  </div>
</main>

<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import{getFunctions,httpsCallable}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-functions.js';
const FC={apiKey:"AIzaSyBD9p-bf162RiiD1Y3BsY-NvbYjpOSrzmg",authDomain:"jarvia-platform.firebaseapp.com",projectId:"jarvia-platform",storageBucket:"jarvia-platform.firebasestorage.app",messagingSenderId:"388025068900",appId:"1:388025068900:web:09ba8e12e9e9e2ec49de71"};
const functions=getFunctions(initializeApp(FC),'asia-northeast3');
const call=(name,data)=>httpsCallable(functions,name)(data||{}).then(r=>r.data||{});
const $=id=>document.getElementById(id);
const SKEY='icx_s';

/* 이미 로그인되어 있으면 바로 이동 · ?logout=1 이면 세션 삭제 */
(function(){
  const q=new URLSearchParams(location.search);
  try{
    if(q.get('logout')){localStorage.removeItem(SKEY);return;}
    const o=JSON.parse(localStorage.getItem(SKEY)||'null');
    if(o&&o.s&&o.exp>Date.now())location.replace('./ic-case.html');
  }catch(_){}
})();

const say=(t,kind)=>{const m=$('msg');m.textContent=t||'';m.className='msg'+(kind?' '+kind:'');};
const digits=v=>String(v||'').replace(/\D/g,'');
const fmt=v=>{const d=digits(v).slice(0,11);return d.length<4?d:d.length<8?d.slice(0,3)+'-'+d.slice(3):d.slice(0,3)+'-'+d.slice(3,d.length-4)+'-'+d.slice(-4);};
$('ph').addEventListener('input',e=>{e.target.value=fmt(e.target.value);});
$('cd').addEventListener('input',e=>{e.target.value=digits(e.target.value).slice(0,6);if(e.target.value.length===6)$('go').focus();});

let timer=null,cool=null;
function startTimer(){
  let left=300;clearInterval(timer);
  const t=()=>{$('tm').textContent=left>0?Math.floor(left/60)+':'+String(left%60).padStart(2,'0'):'만료됨';if(left--<=0)clearInterval(timer);};
  t();timer=setInterval(t,1000);
}
function startCool(){
  let left=60;const b=$('send');b.disabled=true;clearInterval(cool);
  const t=()=>{b.textContent=left>0?'재발송 '+left+'초':'다시 받기';if(left--<=0){clearInterval(cool);b.disabled=false;}};
  t();cool=setInterval(t,1000);
}

$('send').onclick=async()=>{
  const p=digits($('ph').value);
  if(!/^01\d{8,9}$/.test(p)){say('휴대폰 번호를 정확히 입력해 주세요.','err');$('ph').focus();return;}
  const b=$('send');b.disabled=true;b.textContent='보내는 중';say('');
  try{
    const r=await call('icExpertLoginSend',{phone:p});
    if(!r.success){say(r.error||'인증번호를 보내지 못했습니다.','err');b.disabled=false;b.textContent='인증번호 받기';return;}
    $('code-fld').classList.remove('hide');$('go').classList.remove('hide');
    $('cd').value='';$('cd').focus();
    say('인증번호를 보냈습니다. 5분 안에 입력해 주세요.','ok');
    startTimer();startCool();
  }catch(e){say('연결에 실패했습니다. 잠시 후 다시 시도해 주세요.','err');b.disabled=false;b.textContent='인증번호 받기';}
};

async function login(){
  const p=digits($('ph').value),c=digits($('cd').value);
  if(c.length!==6){say('인증번호 6자리를 입력해 주세요.','err');$('cd').focus();return;}
  const b=$('go');b.disabled=true;b.textContent='확인 중';
  try{
    const r=await call('icExpertLoginVerify',{phone:p,code:c});
    if(!r.success){say(r.error||'로그인에 실패했습니다.','err');b.disabled=false;b.textContent='로그인';return;}
    try{localStorage.setItem(SKEY,JSON.stringify({s:r.s,exp:r.expiresAt,name:r.name||''}));}catch(_){}
    say('로그인되었습니다. 이동합니다.','ok');
    location.replace('./ic-case.html');
  }catch(e){say('연결에 실패했습니다. 잠시 후 다시 시도해 주세요.','err');b.disabled=false;b.textContent='로그인';}
}
$('go').onclick=login;
$('cd').addEventListener('keydown',e=>{if(e.key==='Enter')login();});
$('ph').addEventListener('keydown',e=>{if(e.key==='Enter')$('send').click();});
</script>
</body>
</html>
