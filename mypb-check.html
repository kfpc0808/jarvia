<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>마이PB 재무검진</title>
<meta name="description" content="답하면 바로 결과가 나오는 1분 재무검진">
<meta property="og:type" content="website">
<meta property="og:title" content="1분 재무검진">
<meta property="og:description" content="답하면 바로 결과가 나옵니다">
<meta property="og:image" content="https://mypb.kr/mypb/share_default.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="600">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F8F7F4; --surface:#FFFFFF; --soft:#FAF9F6; --ink:#121826; --ink2:#273042; --muted:#4A5364; --line:#E7E3DA; --line2:#D6CFC1;
  --navy:#0E2148; --navy-soft:#F1F4FA; --gold:#8A6A3B; --gold-line:#C9B48C; --gold-soft:#FBF7EF;
  --warn:#B9420C; --warn-soft:#FDF3EC; --green:#166534; --green-soft:#EEF7F1; --gray:#7D8697; --link:#1E47B8;
  --shadow:0 1px 2px rgba(18,24,38,.04),0 6px 20px rgba(18,24,38,.05);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);overflow-x:hidden;overflow-x:clip}
body{font-family:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:16px;line-height:1.65;-webkit-text-size-adjust:100%;word-break:keep-all;overflow-wrap:anywhere}
#app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--surface);box-shadow:0 0 0 1px var(--line)}
button{font-family:inherit;font-size:inherit;color:var(--ink);cursor:pointer;-webkit-tap-highlight-color:transparent}
.min0{min-width:0}
.serif,.q,.hero h1,.rec b,.done-ic+.q{font-family:'Noto Serif KR','Noto Sans KR',serif}
/* 머리 */
.top{position:sticky;top:0;z-index:5;height:58px;display:flex;align-items:center;gap:8px;padding:0 18px;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{font-weight:900;color:var(--navy);font-size:16px;letter-spacing:.2px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{font-weight:500;color:var(--gold)}
.chip{font-size:13px;font-weight:500;color:var(--ink2);background:var(--soft);border:1px solid var(--line);padding:5px 11px;border-radius:999px;white-space:nowrap;flex-shrink:0}
.iconbtn{border:0;background:transparent;width:40px;height:40px;margin-left:-10px;display:flex;align-items:center;justify-content:center;border-radius:10px;color:var(--navy);flex-shrink:0}
.top.jv .brand span{color:var(--muted)}
.pad{padding:22px 18px 36px}
.h2{font-size:17px;font-weight:700;margin:30px 0 12px;color:var(--navy);display:flex;align-items:center;gap:8px}
.h2::before{content:'';width:3px;height:16px;border-radius:2px;background:var(--gold-line)}
.tiny{font-size:13.5px;color:var(--muted);line-height:1.65;margin:8px 0}
.lead{margin-top:0}
.note{font-size:14px;color:var(--ink2);background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:26px 0 8px}
.link{display:block;margin:16px auto 0;border:0;background:transparent;color:var(--link);font-size:15px;font-weight:500;padding:10px;text-decoration:underline;text-underline-offset:4px}
.link.left{margin:6px 0 0;padding:6px 0}
/* 메인 */
.hello{display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.hello-t{font-size:14.5px;line-height:1.6;color:var(--ink2);min-width:0}
.hello-t span{display:block;color:var(--navy);font-weight:700;font-size:17px;margin-top:2px}
.avatar{width:48px;height:48px;border-radius:50%;background:var(--gold-soft);border:1px solid var(--gold-line);color:var(--gold);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0}
.avatar.lg{width:54px;height:54px}
.rec{display:grid;gap:4px;width:100%;text-align:left;margin-top:14px;border:1px solid var(--gold-line);border-radius:18px;padding:18px;background:linear-gradient(180deg,#FFFFFF, var(--gold-soft));box-shadow:var(--shadow)}
.rec-k{font-size:13px;font-weight:700;color:var(--gold);letter-spacing:.3px}
.rec b{font-size:20px;line-height:1.45;color:var(--navy)}
.rec-s{font-size:14px;color:var(--muted)}
.rec-go{justify-self:start;margin-top:10px;font-size:15px;font-weight:700;color:#fff;background:var(--navy);border-radius:10px;padding:9px 16px}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.field{min-height:68px;padding:12px;border-radius:16px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;gap:10px;text-align:left;min-width:0;box-shadow:var(--shadow)}
.field.on{border:2px solid var(--navy);background:var(--navy-soft);padding:11px}
.ficon{width:36px;height:36px;border-radius:11px;background:var(--gold-soft);display:flex;align-items:center;justify-content:center;color:var(--gold);flex-shrink:0}
.ftext{display:grid;min-width:0} .ftext b{font-size:16px;color:var(--navy)} .ftext small{font-size:13px;color:var(--muted);line-height:1.4}
.interests{grid-column:1/-1;background:var(--soft);border:1px solid var(--line);border-radius:16px;padding:8px;display:grid;gap:6px}
.int-h{font-size:13.5px;font-weight:500;color:var(--muted);padding:6px 8px 2px}
.int{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:52px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);text-align:left;font-size:15.5px;font-weight:500;color:var(--ink)}
.int small{color:var(--gold);font-size:13px;font-weight:700;flex-shrink:0}
.list{display:grid;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:10px;box-shadow:var(--shadow)}
.rowcard{display:flex;align-items:center;justify-content:space-between;gap:10px} .rowcard b{color:var(--navy)} .rowcard small{display:block;color:var(--muted);font-size:13px}
/* 버튼 */
.btn{border-radius:14px;border:0;min-height:52px;padding:0 18px;font-weight:700;font-size:16px;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;letter-spacing:.2px}
.btn.block{display:flex;width:100%;margin-top:16px}
.btn.big{min-height:58px;font-size:17px}
.btn.sm{min-height:44px;font-size:14.5px;padding:0 14px;flex-shrink:0}
.btn.primary{background:var(--navy);color:#FFFFFF;box-shadow:0 6px 16px rgba(14,33,72,.18)}
.btn.ghost{background:var(--surface);border:1.5px solid var(--line2);color:var(--navy)}
.btn:disabled,.btn.primary:disabled{background:#ECE9E3;color:#4A5364;box-shadow:none;cursor:default}
/* 질문 */
.progress{height:4px;background:#EEEBE4} .progress i{display:block;height:100%;background:var(--gold-line);transition:width .25s}
.qhead{font-size:13.5px;font-weight:700;color:var(--gold);margin-bottom:6px}
.q{font-size:24px;line-height:1.45;font-weight:700;color:var(--navy);margin:8px 0 20px}
.q.center,.center{text-align:center}
.sub{color:var(--ink2);margin-top:-8px}
.opts{display:grid;gap:10px}
.opt{min-height:56px;padding:13px 18px;text-align:left;border-radius:14px;border:1.5px solid var(--line2);background:var(--surface);font-size:17px;font-weight:500;color:var(--ink)}
.opt.on{border:2px solid var(--navy);background:var(--navy-soft);color:var(--navy);font-weight:700;padding:12.5px 17.5px}
.opt.unk{color:var(--ink2);border-style:dashed}
.opt.check.on::after{content:'  ✓';color:var(--navy);font-weight:900}
.grid{display:grid;gap:10px}
.grow{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 8px 8px 14px}
.grow span{font-weight:700;color:var(--navy);min-width:0;font-size:15.5px}
.seg{display:flex;gap:5px;flex-shrink:0}
.segb{min-width:52px;min-height:44px;border-radius:10px;border:1.5px solid var(--line2);background:var(--surface);font-size:14.5px;color:var(--ink2);font-weight:500}
.segb.on.k0{background:var(--green-soft);border-color:var(--green);color:var(--green);font-weight:700}
.segb.on.k1{background:var(--warn-soft);border-color:var(--warn);color:var(--warn);font-weight:700}
.segb.on.k2{background:#F0F1F4;border-color:var(--gray);color:var(--ink);font-weight:700}
.input,select{width:100%;min-height:54px;border-radius:14px;border:1.5px solid var(--line2);background:var(--surface);color:var(--ink);padding:0 16px;font-size:17px;font-family:inherit}
.input::placeholder{color:#7A8292}
.input:focus,select:focus{border-color:var(--navy);outline:none;box-shadow:0 0 0 3px rgba(14,33,72,.12)}
.pair{display:grid;gap:12px} .pair label,.field-in{display:grid;gap:7px;font-size:14px;color:var(--muted);margin-top:12px}
.field-in span{color:var(--ink2);font-weight:700;font-size:15px}
.tel{display:grid;grid-template-columns:auto minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:8px}
.tel .pre{min-height:54px;display:flex;align-items:center;justify-content:center;padding:0 16px;border-radius:14px;background:var(--soft);border:1.5px solid var(--line);font-size:17px;font-weight:700;color:var(--navy)}
.tel .dash{color:var(--muted);font-weight:700}
.tel .input{text-align:center;letter-spacing:3px;padding:0 8px;font-weight:700;font-size:18px}
.lab{font-size:15px;font-weight:700;color:var(--ink2);margin:18px 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.chipb{min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line2);background:var(--surface);font-size:15px;font-weight:500;color:var(--ink2)}
.chipb.on{background:var(--navy);border-color:var(--navy);color:#FFFFFF;font-weight:700}
.agree{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;color:var(--ink2);margin-top:18px} .agree input{width:22px;height:22px;margin-top:1px;flex-shrink:0;accent-color:var(--navy)}
/* 결과 */
.hero{background:var(--surface);color:var(--ink);padding:26px 18px 24px;border-bottom:1px solid var(--line);position:relative}
.hero::before{content:'';position:absolute;left:18px;right:18px;top:0;height:3px;background:linear-gradient(90deg,var(--gold-line),transparent)}
.hero-k{font-size:13.5px;font-weight:700;color:var(--gold);margin-bottom:10px}
.hero h1{font-size:23px;line-height:1.5;font-weight:700;margin:0 0 12px;color:var(--navy)}
.hero p{margin:0 0 8px;font-size:15.5px;line-height:1.75;color:var(--ink2)}
.hero .hnote{font-size:14px;color:var(--warn);background:var(--warn-soft);border-radius:10px;padding:10px 12px}
.chart{background:var(--soft);color:var(--ink);border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:16px;display:grid;gap:12px}
.bar{display:grid;grid-template-columns:minmax(0,1fr);gap:5px}
.bl{font-size:14px;color:var(--ink2);font-weight:500}
.bt{height:14px;background:#ECE8DF;border-radius:7px;overflow:hidden}
.bt i{display:block;height:100%;border-radius:7px}
.bv{font-size:15px;font-weight:700;color:var(--navy)}
.t-warn{background:var(--warn)} .t-base{background:var(--navy)} .t-ok{background:var(--green)} .t-muted{background:var(--gray)}
.cgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.cell{border-radius:12px;padding:10px 6px;display:grid;gap:2px;text-align:center;font-size:13px;border:1.5px solid}
.cell b{font-size:14px}
.cell.t-ok{background:var(--green-soft);border-color:var(--green);color:var(--green)}
.cell.t-warn{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.cell.t-muted{background:#F0F1F4;border-color:var(--gray);color:var(--ink)}
.chart .tiny,.hero .chart p.tiny{margin:0;color:var(--muted)}
.find{display:flex;gap:12px}
.find b{display:block;font-size:16px;line-height:1.5;color:var(--navy)} .find span{display:block;font-size:14.5px;color:var(--ink2);line-height:1.7;margin-top:3px}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;margin-top:8px}
.dot.warn{background:var(--warn)} .dot.base{background:var(--navy)} .dot.ok{background:var(--green)} .dot.muted{background:var(--gray)}
.ol,.ul{margin:0;padding-left:20px;display:grid;gap:8px;font-size:15px;color:var(--ink2)}
.ol b{color:var(--warn)}
.morebtn{display:grid;gap:3px;width:100%;text-align:left;border:1.5px dashed var(--gold-line);background:var(--gold-soft);margin-top:20px}
.morebtn b{color:var(--gold);font-size:16px} .morebtn span{font-size:14.5px;color:var(--ink2)}
.intro{background:var(--surface);border:1px solid var(--gold-line);border-radius:20px;padding:20px;margin-top:22px;box-shadow:var(--shadow)}
.intro-top{display:flex;gap:14px;align-items:center;font-size:15px;color:var(--ink2);line-height:1.55}
.intro-top b{color:var(--navy);font-size:17px}
.intro-top span{font-size:14px;color:var(--muted)}
.sent{margin-top:16px;padding:15px;border-radius:14px;background:var(--green-soft);color:var(--green);font-weight:700;text-align:center;font-size:16px}
.disc{font-size:13px;line-height:1.75;color:var(--muted);margin:24px 0 0;border-top:1px solid var(--line);padding-top:14px}
.done-ic{width:68px;height:68px;border-radius:50%;background:var(--green-soft);border:1.5px solid var(--green);color:var(--green);font-size:30px;font-weight:900;display:flex;align-items:center;justify-content:center;margin:22px auto 10px}
.task{display:grid;gap:4px;background:var(--gold-soft);border-color:var(--gold-line)}
.task span{font-size:13.5px;font-weight:700;color:var(--gold)} .task b{font-size:17px;color:var(--navy)} .task small{font-size:13.5px;color:var(--muted)}
/* 컨설턴트 */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:2px;box-shadow:var(--shadow)}
.stat span{font-size:13px;color:var(--muted)} .stat b{font-size:24px;color:var(--navy)}
.stat.hot{background:var(--warn-soft);border-color:#F2C4A6} .stat.hot b{color:var(--warn)}
.cons{display:grid;gap:10px} .cons.req{border:2px solid var(--warn)}
.cons-h{display:flex;justify-content:space-between;align-items:center;gap:6px 8px;flex-wrap:wrap} .cons-h b{color:var(--navy);font-size:17px}
.badge{font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--soft);border:1px solid var(--line);color:var(--ink2);white-space:nowrap}
.badge.hot{background:var(--warn);border-color:var(--warn);color:#fff}
.meta{font-size:14px;color:var(--muted)} .meta.hot{color:var(--warn);font-weight:700}
.box{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:13px;font-size:15px;line-height:1.7;color:var(--ink)}
.box b{color:var(--navy)}
.opener{font-size:14px;line-height:1.7;color:var(--ink2);background:var(--gold-soft);border-radius:12px;padding:11px 13px}
.opener small{color:var(--muted);font-size:13px}
.answers{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.ans{display:grid;gap:1px;font-size:14.5px} .ans span{color:var(--muted)} .ans b{font-weight:500;color:var(--ink)}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px} .row2 .btn{width:100%}
.empty{display:grid;gap:8px} .empty span{font-size:14.5px;color:var(--ink2)}
.boot{margin-top:18vh} p.boot{text-align:center}
.toast{position:fixed;left:16px;right:16px;bottom:24px;max-width:448px;margin:0 auto;background:var(--navy);color:#fff;padding:15px 18px;border-radius:14px;font-size:15px;z-index:20;box-shadow:0 10px 30px rgba(14,33,72,.3)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid rgba(14,33,72,.35);outline-offset:2px}
@media (max-width:340px){.q{font-size:21px}.hero h1{font-size:21px}.segb{min-width:44px;font-size:13.5px}.tel .pre{padding:0 10px}}
/* 추가 화면 요소 */
.pergoal{display:grid;gap:12px}
.pg{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:8px}
.pg b{color:var(--navy);font-size:16px}
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:16px}
.tab{min-height:44px;border:0;border-radius:10px;background:transparent;font-size:15px;font-weight:700;color:var(--ink2)}
.tab.on{background:var(--navy);color:#fff}
.ctable{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
.ct-h,.ct-r{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) minmax(0,1fr);gap:8px;padding:11px 12px;font-size:14px;align-items:start}
.ct-h{background:var(--soft);font-weight:700;color:var(--muted);font-size:13px}
.ct-r{border-top:1px solid var(--line);color:var(--ink2)} .ct-r b{color:var(--navy);font-weight:700}
.ct-r.chg span:last-child{color:var(--warn);font-weight:700}
.cards2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.icard{border-radius:12px;padding:12px;display:grid;gap:3px;border:1.5px solid;background:var(--surface)}
.icard b{font-size:15px;color:var(--ink)} .icard span{font-size:13.5px;font-weight:700}
.icard.t-warn{border-color:var(--warn);background:var(--warn-soft);color:var(--warn)}
.icard.t-base{border-color:var(--navy);background:var(--navy-soft);color:var(--navy)}
.icard.t-muted{border-color:var(--line2);background:#F4F4F6;color:var(--muted)}
.icard.t-warn,.icard.t-base,.icard.t-muted{background-clip:padding-box}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.checks li{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.checks i{width:24px;height:24px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:900;font-size:13px;color:#fff;margin-top:1px}
.checks li.ok i{background:var(--green)} .checks li.no i{background:var(--warn)} .checks li.wait i{background:#5B6372}
.checks b{display:block;font-size:15px;color:var(--ink)} .checks span{display:block;font-size:13.5px;color:var(--muted)}
.checks li.no span{color:var(--warn);font-weight:700}
.tl{display:grid;gap:6px}
.tl-track{position:relative;height:14px;border-radius:7px;background:#ECE8DF;margin:10px 8px}
.tl-track>i{position:absolute;left:0;top:0;bottom:0;border-radius:7px;background:var(--gold-line)}
.tl-pin{position:absolute;top:-4px;width:12px;height:22px;margin-left:-6px;border-radius:4px;background:var(--warn);border:2px solid #fff}
.tl-pin.done{background:var(--green)}
.tl-today{position:absolute;top:-8px;width:4px;height:30px;margin-left:-2px;border-radius:2px;background:var(--navy)}
.tl-ends{display:flex;justify-content:space-between;gap:6px;font-size:13px;color:var(--muted)}
.struct{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.sc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid}
.sc span{font-size:13px;color:var(--muted)} .sc b{font-size:16px;color:var(--navy)}
.sarrow{display:flex;align-items:center;justify-content:center;gap:10px;font-size:14px;color:var(--ink2);font-weight:700}
.sarrow i{font-style:normal;color:var(--gold);font-size:20px}
.stax{text-align:center;border-radius:12px;padding:10px;font-weight:700;font-size:15px;border:1.5px solid}
.stax.t-warn{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}

류 목록"], "opener": "보내주신 결과에서 현금이 ○억 정도 부족할 수 있다고 나왔는데, 실제로는 평가액과 미리 주신 재산에 따라 달라집니다. 자료 몇 가지만 같이 보면 우리 가족 범위가 나옵니다.", "annual": "재산 범위, 부동산 비중, 바로 쓸 돈, 부족 가능액", "task": "가족과 납부 방법 이야기해 보기", "calc": ""}, {"id": "inheritance.3", "field": "inheritance", "n": 3, "name": "상속재산 분배", "title": "재산 나눌 때, 우리 가족은 다툼 없을까요?", "questions": [{"q": "배우자분이 계신가요?", "opts": ["예", "아니요"], "key": "inheritance.spouse", "use": "상속인 구성"}, {"q": "자녀는 몇 명인가요?", "opts": ["없음", "1명", "2명", "3명 이상"], "key": "inheritance.children", "use": "위험 신호 ① (2명 이상)"}, {"q": "재산 대부분이 집 한 채·상가·사업체처럼 나누기 어려운 것인가요?", "opts": ["예", "아니요", "모름"], "key": "inheritance.division_target", "use": "위험 신호 ②"}, {"q": "특정 자녀에게 이미 더 주었거나 더 주고 싶으신가요?", "opts": ["예", "아니요", "모름"], "key": "inheritance.prior_gifts", "use": "위험 신호 ③"}, {"q": "유언장이나 유언대용신탁을 준비하셨나요?", "opts": ["공증 유언·신탁", "직접 쓴 유언장", "없음"], "key": "inheritance.will", "use": "위험 신호 ④ (없음)"}, {"q": "재혼·연락이 끊긴 가족처럼 상속 관계를 확인해야 할 가족이 있나요?", "opts": ["있다", "없다", "모름"], "key": "inheritance.other_heirs", "use": "위험 신호 ⑤"}], "more": ["분배에서 가장 정리하고 싶은 재산은 무엇인가요? (inheritance.division_target 상세)", "가족 사이에 이미 의견이 다른 부분이 있나요? (inheritance.dispute)", "더 준 재산은 언제, 대략 얼마였나요? (inheritance.prior_detail)"], "sentences": [{"cond": "위험 신호 3개 이상", "text": "다툼 위험 신호 5개 중 ○개가 해당됩니다. 지금 상속이 시작되면 가족 전원이 합의해야 재산을 나눌 수 있는데, 그 합의가 쉬운 구조가 아닙니다."}, {"cond": "위험 신호 1~2개", "text": "다툼 위험 신호가 ○개 있습니다. 미리 정리해 두면 대부분 막을 수 있는 부분입니다."}, {"cond": "위험 신호 0개", "text": "현재 답변으로는 다툼 신호가 보이지 않습니다. 재산과 가족 상황이 바뀔 때 다시 확인하세요."}], "graph": "신호 5칸 막대에 해당 칸을 주황색으로 칠합니다. 「모름」은 회색 칸으로 따로 표시합니다.", "findings": [{"label": "유언 없음", "text": "유언이 없으면 상속인 전원의 합의가 있어야 재산을 나눌 수 있습니다. 한 명만 반대해도 멈춥니다."}, {"label": "직접 쓴 유언장", "text": "형식 요건이 까다로워 하나만 빠져도 효력이 없을 수 있습니다."}, {"label": "특정 자녀에게 더 줌", "text": "다른 자녀가 최소한의 몫(유류분)을 청구할 수 있습니다."}, {"label": "나누기 어려운 재산", "text": "여러 명이 함께 가지면 팔거나 관리할 때마다 전원의 의견이 맞아야 합니다."}, {"label": "확인해야 할 가족 있음", "text": "그 가족도 상속인이라면 합의에 반드시 참여해야 합니다."}], "unconfirmed": ["법적으로 누가 상속인이고 각자 몫이 얼마인지", "과거에 더 받은 재산이 몫 계산에 어떻게 들어가는지", "지금 유언의 효력"], "deliverables": ["우리 가족 상속인·법정 몫 한눈에 보기", "나누는 방법 비교(그대로 나누기·한 명이 갖고 돈으로 정산·팔아서 나누기)", "유언·신탁 준비 체크리스트"], "opener": "점검에서 다툼 위험 신호가 ○개 나왔어요. 대부분은 미리 정리하면 막을 수 있는 것들이라, 가족 구성과 재산 목록만 같이 보면 무엇부터 할지 순서가 나옵니다.", "annual": "위험 신호 개수, 유언 준비 여부, 가족 구성 변화", "task": "유언 또는 신탁 상담 받기", "calc": ""}, {"id": "inheritance.4", "field": "inheritance", "n": 4, "name": "사전증여 영향", "title": "미리 준 재산, 상속 때 다시 계산됩니다", "questions": [{"q": "가족에게 미리 재산을 준 적이 있나요?", "opts": ["있다", "줄 계획이다", "없다", "모름"], "key": "inheritance.prior_gifts", "use": "결과 경로 결정"}, {"q": "누구에게 주셨나요?", "opts": ["배우자·자녀", "손주·사위·며느리", "둘 다"], "key": "inheritance.prior_details", "use": "합산 기간 10년·5년"}, {"q": "가장 최근에 준 것은 언제인가요?", "opts": ["3년 이내", "3~5년", "5~10년", "10년 넘음", "모름"], "key": "inheritance.prior_detail", "use": "연도 막대"}, {"q": "무엇을 주셨나요?", "opts": ["현금", "부동산", "주식", "여러 가지"], "key": "inheritance.prior_detail", "use": "가격 상승 지적"}, {"q": "모두 합치면 대략 얼마인가요?", "opts": ["5천만 미만", "5천만~2억", "2~5억", "5억 이상", "모름"], "key": "inheritance.prior_detail", "use": "결과 문장"}, {"q": "준 때 증여세 신고를 하셨나요?", "opts": ["했다", "안 했다", "모름"], "key": "신규", "use": "신고 누락 지적"}], "more": ["준 날짜를 연·월까지 알고 계신가요? (정확한 합산 종료일 계산)", "주신 분(재산 주인)의 나이대는요? (합산 기간이 끝나기 전 상속 가능성 설명용)", "안 준 나머지 재산은 대략 얼마인가요? (inheritance.estate_band)"], "sentences": [{"cond": "합산 기간 안", "text": "주신 재산은 약 ○○○○년까지 상속재산에 다시 더해집니다. 이미 세금을 냈어도 상속세 계산에 다시 들어간다는 뜻입니다."}, {"cond": "합산 기간 넘음", "text": "가장 최근 증여는 합산 기간이 지났을 가능성이 큽니다. 다만 날짜가 정확해야 확신할 수 있습니다."}, {"cond": "시기 모름", "text": "언제 준 재산인지 모르면 상속 때 더해지는지도 알 수 없습니다. 상속이 시작되면 가족이 이 내역을 모두 찾아야 합니다."}, {"cond": "줄 계획", "text": "지금 주면 ○○○○년까지 합산 대상입니다. 주는 시기와 받는 사람을 어떻게 정하느냐가 세금을 바꿉니다."}], "graph": "올해부터 합산 종료 연도까지 연도 막대, 구간 선택이면 끝점을 범위(예: 2029~2033년)로 그립니다.", "findings": [{"label": "부동산·주식을 줌", "text": "상속 때는 준 당시 가격으로 더해집니다. 그 뒤 오른 부분은 더해지지 않습니다."}, {"label": "손주·사위·며느리에게 줌", "text": "상속인이 아니면 합산 기간이 5년으로 짧습니다."}, {"label": "신고 안 함·모름", "text": "신고하지 않은 증여는 상속 때 드러나면 가산세까지  "use": "부부 합계"}], "more": ["국민연금공단 예상액 자료를 가지고 계신가요? (pension.national_record)", "연금 외 매달 들어오는 수입은? (pension.other_exact)", "언제부터 받고 싶으세요? (pension.receive_time — ④으로 연결)"], "sentences": [{"cond": "비율 < 50%", "text": "국민연금은 생활비의 약 ○%만 채웁니다. 나머지 매달 약 ○○만원은 다른 곳에서 와야 합니다."}, {"cond": "50% 이상", "text": "국민연금이 생활비의 절반 이상을 채웁니다. 남은 ○○만원을 어떤 연금으로 채울지가 다음 순서입니다."}, {"cond": "예상액 모름", "text": "국민연금 예상액을 모르면 노후 계획의 출발점이 없는 셈입니다. 예상액은 무료로 바로 조회할 수 있습니다."}], "graph": "월 생활비 막대 안에 「본인 국민연금」·「배우자 국민연금」·「빈칸」을 쌓고, 빈칸에 ○○만원을 크게 표시합니다.", "findings": [{"label": "납부 공백 있음", "text": "내지 않은 기간을 나중에 내는 방법(추후납부)으로 연금을 늘릴 수 있는지 확인해 볼 만합니다."}, {"label": "배우자 국민연금 없음", "text": "부부 생활비를 한 사람의 연금으로 감당해야 합니다."}, {"label": "일하는 중", "text": "남은 가입 기간에 따라 예상액이 더 늘 수 있습니다."}], "unconfirmed": ["공단 자료 기준 실제 예상액", "납부 공백을 채울 수 있는지", "배우자 연금"], "deliverables": ["부부 국민연금 예상액 정리표", "추후납부·계속 가입의 비용과 늘어나는 연금 비교", "빈칸을 채울 연금 순서"], "opener": "결과에서 국민연금이 생활비의 ○%를 채운다고 나왔는데요, 공단 예상액을 같이 조회해 보면 5분 만에 정확한 빈칸이 나옵니다.", "annual": "국민연금 예상액, 채우는 비율", "task": "국민연금 예상액 조회하기", "calc": "채우는 비율 = (본인 + 배우자 국민연금) ÷ 월 생활비. 기준이 「받을 때 금액」이면 오늘 생활비와 기준이 달라 「실제 비율은 이보다 낮을 수 있음」을 함께 표시합니다."}, {"id": "pension.2", "field": "pension", "n": 2, "name": "퇴직연금·IRP", "title": "퇴직금, 한꺼번에 받으면 세금을 더 낸다는 것 아세요?", "questions": [{"q": "퇴직금은 어디에 있나요?", "opts": ["회사 퇴직연금(DB·DC)", "이미 IRP로 받음", "모름"], "key": "pension.retire_benefit", "use": "결과 경로"}, {"q": "적립금은 대략 얼마인가요?", "opts": ["5천만 미만", "5천만~1억", "1~3억", "3억 이상", "모름"], "key": "pension.balance_exact", "use": "결과 문장"}, {"q": "퇴직금을 어떻게 받을 생각인가요?", "opts": ["한꺼번에", "연금으로 나눠서", "일부만 꺼내기", "모름"], "key": "pension.irp_partial", "use": "세금 비교"}, {"q": "꺼내려는 가장 큰 이유는요?", "opts": ["대출 상환", "자녀 지원", "사업", "생활비", "꺼낼 생각 없음"], "key": "pension.irp_reason", "use": "인출 지적"}, {"q": "퇴직연금을 어떤 상품에 두었는지 확인해 본 적이 있나요?", "opts": ["1년 안에 확인", "오래됨", "한 번도 없음"], "key": "신규", "use": "운용 지적"}, {"q": "그 돈이 언제 필요한가요?", "opts": ["퇴직하자마자", "몇 년 뒤", "55세 이후 노후 생활비로"], "key": "pension.need_date", "use": "수령 방식 제안"}], "more": ["정확한 적립금 (pension.balance_exact)", "IRP 안에 본인이 따로 넣은 돈도 있나요? (pension.fund_source — 과세 방식이 다름)", "한꺼번에 필요한 금액은 얼마인가요? (pension.lump_need)"], "sentences": [{"cond": "한꺼번에", "text": "퇴직금을 한꺼번에 받으면, 연금으로 나눠 받을 때보다 퇴직소득세를 약 1.4배 냅니다. 적립금이 ○억이면 그 차이도 작지 않습니다."}, {"cond": "일부만 꺼내기", "text": "IRP는 정해진 사유가 아니면 일부만 꺼낼 수 없고 계좌를 해지해야 합니다. 필요한 금액만 따로 나눠 두는 방법을 확인해야 합니다."}, {"cond": "연금으로", "text": "연금으로 받으면 세금이 줄고, 10년을 넘겨 받으면 더 줄어듭니다. 몇 년에 걸쳐 얼마씩 받을지가 다음 순서입니다."}, {"cond": "적립금·방식 모름", "text": "퇴직금이 어디에 얼마 있는지 모르면 받는 방식도 정할 수 없습니다. 퇴직연금 적립금은 한 번에 조회할 수 있습니다."}], "graph": "「한꺼번에」과 「연금으로」 두 막대를 퇴직소득세 비율(100 : 약 70)로 그리고, 금액 대신 비율만 표시합니다.", "findings": [{"label": "운용 확인 안 함", "text": "DC·IRP 적립금은 본인이 고른 상품에 그대로 머물러 있습니다. 오랫동안 확인하지 않았다면 지금 어디에 있는지부터 봐야 합니다."}, {"label": "대출 상환 목적", "text": "대출 이자와 퇴직금을 연금으로 받을 때의 세금 차이를 비교해야 합니다."}, {"label": "퇴직하자마자 필요", "text": "55세 전이면 연금으로 받을 수 없어 세금 혜택을 못 받습니다."}], "unconfirmed": ["실제 퇴직소득세", "IRP 안 퇴직금과 본인 납입금의 구분", "지금 운용 상품"], "deliverables": ["받는 방식별 세금 비교표(일시금·연금·나눠 받기)", "필요한 돈과 노후 돈을 나누는 계획", "운용 상품 점검"], "opener": "퇴직금을 한꺼번에 받으실 계획이시더라고요. 연금으로 받으면 세금이 꽤 줄어드는데, 필요한 돈은 바로 쓰고 나머지만 연금으로 받는 방법도 있어요.", "annual": "적립금, 받는 방식 계획, 운용 확인 여부", "task": "퇴직연금 적립금·상품 확인하기", "calc": ""}, {"id": "pension.3", "field": "pension", "n": 3, "name": "연금저축·연금보험", "title": "매년 돌려받을 수 있는 세금, 다 받고 계신가요?", "questions": [{"q": "어떻게 일하고 계신가요?", "opts": ["직장인", "사업자", "소득 없음"], "key": "신규", "use": "공제 대상 여부"}, {"q": "1년 소득은 어느 쪽인가요?", "opts": ["직장인 총급여 5,500만원 이하", "초과 (사업자는 종합소득 4,500만원 기준)"], "key": "신규", "use": "공제율 16.5%·13.2%"}, {"q": "연금저축에 1년에 얼마 넣고 계신가요?", "opts": ["없음", "300만 미만", "300~600만", "600만 이상"], "key": "신규", "use": "쓴 한도"}, {"q": "IRP에 본인이 1년에 얼마 넣고 계신가요?", "opts": ["없음", "300만 미만", "300만 이상"], "key": "신규", "use": "쓴 한도"}, {"q": "보험사 연금 상품이 있다면 어떤 것인가요?", "opts": ["연금저축보험", "일반 연금보험", "없음", "모름"], "key": "pension.type", "use": "상품 구분 지적"}, {"q": "연말정산에서 연금 공제를 받고 계신가요?", "opts": ["받고 있음", "잘 모름"], "key": "pension.account_tax_credit", "use": "확인 지적"}], "more": ["연금저축·IRP 연 납입액을 정확한 금액으로", "작년 연말정산에서 낸 세금(결정세액)이 있었나요? (공제를 받을 세금이 있는지)", "연금보험의 지급 방식은요? (pension.annuity_contract)"], "sentences": [{"cond": "남은 한도 있음", "text": "연금계좌에 더 넣을 여유가 있다면, 매년 약 ○○만원을 더 돌려받을 수 있습니다. 10년이면 약 ○○○만원입니다."}, {"cond": "한도 다 씀", "text": "연금계좌 세액공제는 이미 최대로 받고 계십니다. 이제는 받을 때의 세금(⑤)을 준비할 차례입니다."}, {"cond": "소득 없음", "text": "소득이 없으면 돌려받을 세금도 없습니다. 대신 불어난 돈에 대한 세금을 받을 때까지 미룰 수 있습니다."}], "graph": "900만원 한도 막대를 「연금저축 · IRP · 빈 한도」로 나누고, 빈 한도 아래에 「매년 ○○만원」을 표시합니다.", "findings": [{"label": "일반 연금보험", "text": "세액공제 대상이 아닙니다. 대신 요건을 갖추면 받을 때 세금이 없는 다른 장점이 있습니다."}, {"label": "공제 여부 모름", "text": "넣고도 연말정산에 반영되지 않는 경우가 있습니다."}, {"label": "중간에 해지하면 돌려받은 세금을 다시 내야 하므로, 넣을 때 오래 둘 돈인지가 중요합니다.", "text": "중간에 해지하면 돌려받은 세금을 다시 내야 하므로, 넣을 때 오래 둘 돈인지가 중요합니다."}], "unconfirmed": ["공제를 받을 세금이 있는지", "지금 계약의 비용·조건", "더 넣을 여유 금액"], "deliverables": ["우리 집 연금계좌 세액공제 점검표", "부부 중 누구 명의로 넣는 게 유리한지 비교", "기존 연금 상품 점검"], "opener": "결과에서 매년 약 ○○만원을 더 돌려받을 수 있다고 나왔어요. 올해 연말정산 전에 확인하면 올해분부터 받을 수 있습니다.", "annual": "연 납입액, 놓친 환급액", "task": "연말 전에 연금계좌 납입액 확인하기", "calc": "공제 대상 납입액 = min(연금저축, 600만) + IRP, 합계 900만원 한도. 놓치는 환급 = (900만 − 공제 대상 납입액) × 공제율. 예: 총급여 5,000만·연금저축 연 240만·IRP 없음 → 매년 약 109만원."}, {"id": "pension.4", "field": "pension", "n": 4, "name": "수령시점·방식", "title": "국민연금, 앞당길까 미룰까?", "questions": [{"q": "어떤 연금의 시점이 고민인가요?", "opts": ["국민연금", "퇴직·개인연금", "둘 다"], "key": "pension.type", "use": "결과 경로"}, {"q": "출생연도는요?", "opts": ["1964년 이전", "1965~1968년", "1969년 이후"], "key": "신규(노후와 공유)", "use": "정상 개시 나이"}, {"q": "언제 받고 싶으세요?", "opts": ["앞당겨서", "제때", "미뤄서", "모름"], "key": "pension.receive_time", "use": "비교 기준"}, {"q": "그때까지 다른 수입이 있나요?", "opts": ["있음", "없음"], "key": "pension.other_income", "use": "조건 지적"}, {"q": "개인연금은 어떻게 받게 되어 있나요?", "opts": ["평생(종신)", "정해진 기간", "모름", "없음"], "key": "pension.annuity_contract", "use": "기간 지적"}, {"q": "연금을 받으면서도 목돈이 필요한 일이 있나요?", "opts": ["예", "아니요"], "key": "pension.income_need", "use": "유동성 지적"}], "more": ["제때 받을 때 국민연금 월 예상액 (pension.monthly — 분기 나이까지 차이를 금액으로)", "개인연금 개시 예정일 (pension.start_date)", "목돈이 필요한 시점과 금액 (pension.need_date · lump_need)"], "sentences": [{"cond": "앞당겨서", "text": "5년 앞당기면 평생 매달 30% 줄어든 금액을 받습니다. 약 ○○세보다 오래 사신다면 제때 받는 쪽이 더 많습니다."}, {"cond": "미뤄서", "text": "5년 미루면 평생 매달 36% 늘어난 금액을 받습니다. 다만 약 ○○세까지는 미룬 만큼을 다 되찾지 못합니다."}, {"cond": "제때·모름", "text": "앞당기면 약 ○○세, 미루면 약 ○○세가 손익이 바뀌는 나이입니다. 다른 수입과 생활비에 따라 답이 달라집니다."}], "graph": "나이(60~95세) 축에 「앞당김·제때·미룸」 세 연금의 누적 수령액 선을 그리고, 선이 엇갈리는 두 나이에 점을 찍습니다.", "findings": [{"label": "앞당기려는데 다른 수입 있음", "text": "일정 소득이 있으면 앞당겨 받을 수 없거나 지급이 멈출 수 있습니다."}, {"label": "미루려는데 다른 수입 없음", "text": "미루는 동안 쓸 돈을 먼저 확보해야 합니다."}, {"label": "개인연금이 정해진 기간", "text": "기간이 끝나면 수입이 끊깁니다. 국민연금과 기간을 어떻게 이어 붙일지 봐야 합니다."}, {"label": "목돈 필요", "text": "연금으로 묶여 있는 돈은 중간에 꺼내기 어렵거나 세금이 붙습니다."}], "unconfirmed": ["제때 받을 때의 실제 연금액", "앞당길 때 소득 요건", "개인연금과 퇴직연금을 받는 순서"], "deliverables": ["우리 부부 연금 받는 순서표(국민·퇴직·개인)", "앞당김·미룸 금액 비교", "목돈 필요할 때 꺼낼 자금 계획"], "opener": "결과에서 앞당기면 77세, 미루면 84세가 기준이라고 나왔어요. 국민연금만 따로 보면 답이 없고, 퇴직연금·개인연금 순서를 같이 정해야 답이 나옵니다.", "annual": "희망 수령 시점, 다른 수입 여부", "task": "연금 전체 목록 한 장에 정리하기", "calc": "매달 70. 제때 개시 나이보다 약 11.7년 뒤(65세 개시면 약 77세)부터는 제때 받은 쪽이 누적으로 더 많음"}, {"id": "pension.5", "field": "pension", "n": 5, "name": "연금 관련 세금", "title": "연금 받을 때, 세금과 건강보험료가 새로 생길까요?", "questions": [{"q": "지금 자녀의 건강보험 피부양자인가요(또는 될 계획인가요)?", "opts": ["예", "아니요", "모름"], "key": "신규", "use": "건보 기준선 표시 여부"}, {"q": "국민연금 등 공적연금은 한 달에 얼마인가요?", "opts": ["50만 미만", "50~100만", "100~150만", "150만 이상"], "key": "pension.monthly", "use": "연 소득 합계"}, {"q": "연금저축·IRP 등 개인연금은 한 달에 얼마인가요?", "opts": ["없음", "125만 미만", "125만 이상"], "key": "신규", "use": "개인연금 과세 기준(연 1,500만)"}, {"q": "연금 외 이자·배당은 1년에 얼마인가요?", "opts": ["1,000만 미만", "1,000~2,000만", "2,000만 초과"], "key": "신규(세금 · 금융소득과 공유)", "use": "연 소득 합계"}, {"q": "임대료 등 다른 수입은 한 달에 얼마인가요?", "opts": ["없음", "100만 미만", "100만 이상"], "key": "pension.other_exact", "use": "연 소득 합계"}, {"q": "연세는요?", "opts": ["70세 미만", "70~79세", "80세 이상"],         var contact = { name: document.getElementById('fName').value.trim() || '고객', tel: '010-' + t1 + '-' + t2, how: how ? how.dataset.v : '전화', when: when ? when.dataset.v : '' };
        var extraRecs = Array.prototype.map.call(app.querySelectorAll('.fExtra:checked'), function (el) { return Store.get(el.dataset.id); }).filter(Boolean);
        var reqRes = null;
        var reqDone = function () {
          extraRecs.forEach(function (x) { if (!reqRes || !reqRes.sharedExtras || reqRes.sharedExtras.indexOf(x.design) >= 0) Store.update(x.id, { consent: true, consentAt: new Date().toISOString(), consentWithdrawnAt: null }); });
          if (!Store.get(S.record.id)) { Store.add(S.record); if (LINK_ID && Store.get(LINK_ID) && Store.get(LINK_ID).pending) Store.remove(LINK_ID); }   /* 저장 거부 고객: 상담 신청(필수 동의) 범위로만 보관 */
          Store.update(S.record.id, { status: '상담 신청', contact: contact, contactConsentAt: new Date().toISOString(), consent: agreed, consentAt: agreed ? new Date().toISOString() : null, requestedAt: new Date().toISOString() }); S.record = Store.get(S.record.id);
          S.screen = 'done'; render();
        };
        if (CLOUD.cust && S.record.linkId) {   /* 실서비스: 서버에 접수되어야 완료 화면으로 (담당 컨설턴트에게 알림톡) */
          t.disabled = true; t.textContent = '보내는 중…';
          callFn('mypbRequest', { k: S.record.linkId, name: contact.name, tel: '010' + t1 + t2, how: contact.how, when: contact.when, agree: true, share: agreed, snap: agreed ? snapFor(S.record) : '', extra: extraRecs.map(function (x) { return { design: x.design, menuLabel: x.menuLabel || menuLabelOf(x.design), snap: snapFor(x) }; }), design: S.record.design, menuLabel: S.record.menuLabel || menuLabelOf(S.record.design), title: S.design.title, line: agreed ? keyLine(S.record) : '', interest: S.record.interest || '' })
            .then(function (res) { reqRes = res; reqDone(); }, function (e) { t.disabled = false; t.textContent = '상담 신청 보내기'; alertBox('신청을 보내지 못했습니다. ' + (e.message || '') + ' 잠시 뒤 다시 눌러 주세요.'); });
          return;
        }
        reqDone(); return;
      case 'consentYes': case 'consentNo':
        if (S.consentReturn) {   /* 결과 화면의 「이 결과 저장하기」에서 온 경우: 동의하면 저장하고 결과로 돌아감 */
          if (act === 'consentYes' && S.record) {
            setSaveChoice(true);
            if (Store.get(S.record.id)) Store.update(S.record.id, { saveOk: true }); else { S.record.saveOk = true; Store.add(S.record); }
            S.record = Store.get(S.record.id); alertBox('결과를 저장했습니다.');
            cloudFire('mypbDone', Object.assign(doneData(S.record), { update: true, keepInterest: true }), S.record);   /* 이제 저장 동의 → 검진 완료 여부 전달 (같은 결과라 공유 답변은 그대로) */
          }
          S.screen = S.consentReturn; S.consentReturn = null; break;
        }
        setSaveChoice(act === 'consentYes'); var ps = S.pendingStart || [REC]; S.pendingStart = null; start(ps[0], ps[1], ps[2]); break;
      case 'saveReset': setSaveChoice(null); alertBox('다음 검진을 시작할 때 저장 여부를 다시 여쭤봅니다.'); rerender(true); return;
      case 'saveNow': S.consentReturn = S.screen; S.screen = 'consent'; break;
      case 'delRec':
        var did = t.dataset.id;
        confirmBox('이 검진 기록을 삭제할까요? 담당 컨설턴트에게도 더 이상 보이지 않고, 1년 뒤 비교와 알림도 끝납니다.', '삭제하기', function () {
          cloudCust('mypbWithdraw', { mode: 'all', design: (Store.get(did) || {}).design }, Store.get(did) && isLatestOf(Store.get(did)) ? Store.get(did) : null, function () {
          Store.remove(did);
          if (!Store.all().some(function (x) { return x.local && !x.pending && savedRec(x); })) setSaveChoice(null);   /* 남은 기록이 없으면 저장 동의도 철회: 다음 검진 때 다시 여쭤봄 */
          alertBox('기록을 삭제했습니다.'); rerender(true);
          });
        });
        return;
      case 'alertPick': var al = S.alertSel || (S.alertSel = {}); al[t.dataset.v] = !al[t.dataset.v]; rerender(true); return;
      case 'alertOn':
        var keys = ALERT_TOPICS.map(function (x) { return x[0]; }).filter(function (k) { return S.alertSel && S.alertSel[k]; });
        if (!keys.length) { alertBox('받으실 알림을 하나 이상 골라 주세요.'); return; }
        cloudCust('mypbAlert', { on: true, topics: keys }, S.record, function () {
          if (S.record && !Store.get(S.record.id)) Store.add(S.record);
          Store.update(S.record.id, { alertOk: true, alertTopics: keys, alertAt: new Date().toISOString() }); S.record = Store.get(S.record.id);
          alertBox('알림을 신청했습니다. 언제든 해지할 수 있습니다.'); rerender(true);
        }); return;
      case 'alertOff': var aid = t.dataset.id || (S.record && S.record.id); cloudCust('mypbAlert', { on: false }, Store.get(aid) || S.record, function () { Store.update(aid, { alertOk: false, alertOffAt: new Date().toISOString() }); if (S.record && S.record.id === aid) S.record = Store.get(aid); alertBox('알림을 해지했습니다.'); rerender(true); }); return;
      case 'lmReset': S.lm.dirty = false; lmSync('reset'); return;
      case 'lmField': S.lm.fOpen = S.lm.fOpen === t.dataset.id ? '' : t.dataset.id; rerender(true); return;
      case 'lmPick': lmSetId(t.dataset.id); issueWarm(); rerender(true); var st3 = document.getElementById('lmStep3'); if (st3) st3.scrollIntoView({ block: 'start', behavior: 'smooth' }); return;
      case 'lmBrowse': S.lm.browse = true; rerender(true); return;
      case 'lmUse': S.lm = S.lm || { n: '', id: null, msg: '', dirty: false, fOpen: '', browse: true }; lmSetId(t.dataset.id); S.ctab = 'send'; break;
      case 'lmShare':
        if (!lmReady()) return;
        lmGuard(function () {
          var shareText = S.lm.msg.trim() + '\n\n' + lmUrl(S.lm);
          if (navigator.share) {
            lmIssue();   /* 공유창을 여는 순간 등록 (공유창은 누른 즉시 열어야 해서 기다리지 않음) */
            navigator.share({ text: shareText }).then(function () { lmRecord(); rerender(true); alertBox('보냈습니다. 「전송 고객 현황」에서 열람·완료를 확인할 수 있습니다.'); }, function () {});   /* 취소로 와도 링크는 지우지 않음 (일부 브라우저는 실제로 보냈어도 취소로 알려 줌 · 안 보낸 링크는 1년 뒤 자동 정리) */
          }
          else { lmIssue(); lmRecord(); copyText(shareText, '이 기기에서는 공유창을 열 수 없어 문구+링크를 복사했습니다. 카카오톡 대화방에 붙여 넣어 보내세요.'); }
        });
        return;
      case 'lmPreview':
        if (!S.lm.id) { lmReady(); return; }
        if (!S.lm.n) { alertBox('고객 이름을 넣으면 그 이름으로 미리 볼 수 있습니다.'); document.getElementById('lmName').focus(); return; }
        var pvu = lmUrl(S.lm, { pv: '1', m: S.lm.msg.trim().slice(0, 1500) }); var pw = window.open(pvu, '_blank'); if (!pw) location.href = pvu; return;
      case 'lmCopy':
        if (!lmReady()) return;
        lmGuard(function () { lmIssue(); lmRecord(); copyText(S.lm.msg.trim() + '\n\n' + lmUrl(S.lm), '문구와 링크를 복사했습니다. 카카오톡 대화방에 붙여 넣어 보내세요.'); });
        return;
      case 'pubCopy': copyText(linkBase() + '?pub=1'); return;
      case 'viewRec':
        var vr = Store.get(t.dataset.id); if (!vr) return;
        S.design = DMAP[vr.design]; S.entry = vr.entry || S.design.field; S.menuLabel = vr.menuLabel || menuLabelOf(vr.design); S.ans = JSON.parse(JSON.stringify(vr.answers)); S.more = JSON.parse(JSON.stringify(vr.more || {}));
        S.recheck = false; S.prev = null; S.result = compute(); S.record = vr; S.alertSel = null; S.screen = 'result'; break;
      case 'consultant': if (ON_MYPB) return; S.screen = 'consultant'; break;
      case 'ctab': S.ctab = t.dataset.v; if (CLOUD.cons && (S.ctab === 'list' || S.ctab === 'annual')) cloudLoad().then(function () { if (S.screen === 'consultant') rerender(true); }).catch(function () {}); break;   /* 목록 탭을 열 때마다 서버에서 새로 받음 */
      case 'reload': location.reload(); return;
      case 'filter': S.filter = t.dataset.v; rerender(true); return;
      case 'exp': S.exp[t.dataset.id] = !S.exp[t.dataset.id]; rerender(true); return;
      case 'toggleOpen': S.open[t.dataset.id] = !S.open[t.dataset.id]; rerender(true); return;
      case 'toggleFacts': S.facts[t.dataset.id] = !S.facts[t.dataset.id]; rerender(true); return;
      case 'trend3': S.trend[t.dataset.id] = !S.trend[t.dataset.id]; rerender(true); return;
      case 'dlFacts': var fr = Store.get(t.dataset.id); if (fr) download('mypb_' + fr.design + '_' + fr.id + '.json', { design: fr.design, rule_version: fr.rule_version, ref_version: fr.ref_version, at: fr.at, status: fr.status, facts: fr.facts || factsOf(DMAP[fr.design], fr.answers, fr.more), result: { sentence: fr.sentence, metric: fr.metric, findings: fr.findings } }); return;
      case 'remind':
        var rr = Store.get(t.dataset.id); if (!rr) return;
        consSet({ k: rr.linkId || rr.id, design: rr.design, remind: true }, function () {
          Store.update(rr.id, { recheckSentAt: new Date().toISOString(), recheckCount: (rr.recheckCount || 0) + 1 });
          alertBox(CLOUD.cons ? '보낸 날짜를 기록했습니다. 재검진 알림톡 자동 발송은 준비 중이니, 이번에는 고객에게 카톡으로 직접 안내해 주세요.' : '재검진 알림을 보냈습니다 (시연: 기록만 남김).'); rerender(true);
        }); return;
      case 'seed': seed(); break;
      case 'clear': Store.clear(); break;
      case 'recheck':
        var p = Store.get(t.dataset.id); if (!p) return;
        S.prev = p; S.design = DMAP[p.design]; S.entry = p.entry || DMAP[p.design].field; S.menuLabel = p.menuLabel || menuLabelOf(p.design); S.taskDone = []; S.newField = null; S.recheckAnswer = null; S.recheck = true; S.more = {}; S.record = null;
        S.ans = JSON.parse(JSON.stringify(p.answers)); S.pos = 0; S.screen = 'recheck'; break;
      case 'taskDone': S.taskDone = S.taskDone.slice(); S.taskDone[+t.dataset.j] = +t.dataset.i; break;
      case 'consInfo': consSheet(); return;
      case 'refer': referShare(); return;
      case 'noPhone': alertBox('실제 링크에서는 담당 컨설턴트 전화번호가 자동으로 연결됩니다.'); return;
      case 'recheckSame': S.pos = S.design.order.length; finish(); break;
      case 'recheckGo': S.pos = 0; S.screen = 'q'; enterQ(); break;
    }
    render();
  });
  /* 휴대폰: 숫자만, 4자리 채우면 다음 칸, 빈 칸에서 지우면 앞 칸 · 금액 칸: 숫자만 + 천 단위 쉼표 */
  app.addEventListener('input', function (e) {
    var el = e.target;
    if (el.id === 'lmName') { lmSync('name'); return; }
    if (el.id === 'lmMsg') { lmSync('msg'); return; }
    if (el.dataset && el.dataset.kind === 'money') { var raw = el.value.replace(/[^0-9]/g, '').slice(0, 9); el.value = raw ? Number(raw).toLocaleString('ko-KR') : ''; return; }
    if (el.id !== 'fTel1' && el.id !== 'fTel2') return;
    var v = el.value.replace(/[^0-9]/g, '').slice(0, 4); if (el.value !== v) el.value = v;
    if (el.id === 'fTel1' && v.length === 4) { var n = document.getElementById('fTel2'); n.focus(); n.select(); }
  });
  app.addEventListener('toggle', function (e) { if (e.target.classList && e.target.classList.contains('lm') && S.lm) S.lm.open = e.target.open; }, true);
  app.addEventListener('keydown', function (e) {
    if (e.target.id === 'fTel2' && e.key === 'Backspace' && !e.target.value) { var p = document.getElementById('fTel1'); p.focus(); }
  });
  app.addEventListener('paste', function (e) {
    if (e.target.id !== 'fTel1') return;
    var d = (e.clipboardData || window.clipboardData).getData('text').replace(/[^0-9]/g, '').replace(/^010/, '');
    if (d.length >= 8) { e.preventDefault(); e.target.value = d.slice(0, 4); var n = document.getElementById('fTel2'); n.value = d.slice(4, 8); n.focus(); }
  });
  function alertBox(msg) {
    document.querySelectorAll('.toast').forEach(function (x) { x.remove(); });   /* 안내는 하나만 */
    var b = document.createElement('div'); b.className = 'toast'; b.setAttribute('role', 'status'); b.textContent = msg; document.body.appendChild(b);
    setTimeout(function () { b.remove(); }, 2600);
  }
  /* 고객이 링크를 열면 「열람」 (검진을 끝내면 검진 기록으로 바뀜) */
  function bootLocal() {
  if (!PUB && !PV && S.screen === 'home') {
    if (LINK_ID) {   /* 보낸 링크를 열면 그 고객의 「링크 발송」이 「열람」으로 바뀜 (실서비스: 서버의 같은 기록) */
      var lk = Store.get(LINK_ID);
      if (lk && lk.pending) Store.update(LINK_ID, { status: '열람', openedAt: new Date().toISOString() });
      else if (!lk) Store.add({ id: LINK_ID, pending: true, local: true, status: '열람', design: REC, contact: CUST ? { name: CUST } : undefined, at: new Date().toISOString(), openedAt: new Date().toISOString() });
    } else if (!Store.all().some(function (x) { return x.pending && x.local; })) Store.add({ id: 'v' + Date.now().toString(36), pending: true, local: true, status: '열람', design: REC, at: new Date().toISOString() });
  }
  restoreProgress();
  render();
  }
  /* 시작: 서버 링크(?k= 만 있는 링크)로 연 고객 → 서버에서 정보 받아 시작 · 올린 화면의 회원 → 자비아 로그인 확인 · 그 밖(파일·시연·미리보기) → 이 기기만 */
  /* mypb.kr(고객용 주소): 미리보기·공개용 말고는 서버에 등록된 링크로만 엶 — 서버를 거치지 않는 옛 형식 링크는 신청이 전달되지 않으므로 받지 않음 */
  if (ON_MYPB && !PV && !PUB) {
    if (LINK_ID) { S.screen = 'home'; custBoot(bootLocal); }
    else if (REF_ID) { S.screen = 'home'; refBoot(bootLocal); }
    else { S.err = '링크를 찾을 수 없습니다. 보내 주신 분께 다시 요청해 주세요.'; S.screen = 'linkErr'; render(); }
  }
  else if (HOSTED && S.screen === 'home' && LINK_ID && !params.c && !PV && !PUB) custBoot(bootLocal);
  else if (HOSTED && S.screen === 'home' && REF_ID && !params.c && !PV && !PUB) refBoot(bootLocal);
  else if (HOSTED && S.screen === 'consultant') consBoot();
  else bootLocal();
})();

</script>
